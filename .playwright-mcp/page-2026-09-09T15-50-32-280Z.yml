        - heading "Analyse (claude-opus-5, 17.2 s)" [level=3] [ref=e72]
        - generic [ref=e73]: "1. Hva som sies. Begge svarene: revebjelle er en svært giftig plante; første symptomer kommer fra magen; magesmerter, kvalme, oppkast og diaré; hjertesymptomer kan oppstå; kontakt Giftinformasjonen på 22 59 13 00 ved inntak. Begge oppgir urgency «info», sufficient «true» og samme kilde («Revebjelle er en svært giftig plante»). Bare i svar 2: tidsangivelsen «innen noen timer» for når magesymptomene kommer. Dette er den eneste substansielle forskjellen — den kan ikke verifiseres uten kildeutdraget, men er en konkret tilleggspåstand som svar 1 ikke gir. Bare i svar 1: bekreftende «Ja» innledningsvis. Ingen direkte motstrid mellom svarene. 2. Hvordan det sies. Begge er tre setninger, nøkternt informerende, uten overskrifter, lister eller markdown. Begge slutter med samme handlingsanvisning i aktiv form («Kontakt Giftinformasjonen …»). Svar 1 åpner med «Ja, revebjelle er …», som delvis speiler brukerens spørsmålsform («Er revebjelle giftig?») og dermed grenser mot instruksen om ikke å gjenta spørsmålet — men det er en bekreftelse, ikke en gjentakelse, så bruddet er marginalt. Svar 2 åpner rett på påstanden og ligger nærmere instruksen «gå rett på svaret». Svar 2 bruker tankestrek for å binde sammen symptombeskrivelsen, noe mer flytende, mens svar 1 bruker «og»-rekker. Ingen bruker passivkonstruksjoner av typen «det anbefales at». 3. Samlet. Svarene er tilnærmet identiske. 2 av 2 har samme innhold, samme lengde (tre setninger), samme kilde, samme metadata og samme avslutning. Avvikene er små og ligger på to steder: åpningen (1 av 2 starter med «Ja») og en tidsangivelse i symptombeskrivelsen (1 av 2 nevner «innen noen timer»). Det første er ren formulering; det andre er en reell, om liten, innholdsforskjell. Ingen forskjell i vektlegging eller hastegrad. 4. Å merke seg. Tidsangivelsen «innen noen timer» i svar 2 kan jeg ikke bekrefte uten kildeutdraget; hvis den ikke står der, er den lagt til av modellen. Ellers er begge svar konsistente og gir samme telefonnummer. Ingen svar feilet."
