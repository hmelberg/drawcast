pack: economics
title: Economics
description: Consumer choice, PPF, cost curves, payoff matrices and extensive-form game trees — micro and game-theory teaching figures with computed geometry.
---
template: indifference_budget
interaction: "Drag the budget line: near an axis end it turns (that good's price), in the middle it slides (income); the optimum and its curves follow."
title: Consumer choice (indifference curves & budget line)
version: 1
kit: 4
status: ready
description: >-
  A consumer-choice diagram: a straight budget line (income split between two
  goods at their prices), one to three Cobb-Douglas indifference curves
  (below, at, and above the utility-maximizing bundle), and the optimal
  bundle where the budget line is tangent to the highest attainable
  indifference curve, with dashed guides down to both axes. Choose this scene
  for ANY request about consumer choice, indifference curves, budget
  constraints or budget lines, marginal rate of substitution, Cobb-Douglas
  utility, or "what bundle maximizes utility". income, price_x and price_y
  are numeric and animate smoothly — tween them (with x_max/y_max set, so
  the axes hold still) to show the budget line pivoting or sliding and the
  optimum sliding along with it. price_x_before splits a price change into
  its substitution and income effects. Paused, the viewer can drag the
  budget line (an end turns it: that good's price; the middle slides it:
  income) and the optimum follows live; an explore beat naming nothing
  hands it over. Values {consumer.x}, {consumer.y}, and with price_x_before
  {consumer.substitution}, {consumer.income_effect}.
params:
  type: object
  properties:
    income:
      type: number
      description: "The consumer's income/budget (default 100)."
    price_x:
      type: number
      description: "Price per unit of the x-axis good (default 2)."
    price_y:
      type: number
      description: "Price per unit of the y-axis good (default 1)."
    preference:
      type: string
      enum: [balanced, x_leaning, y_leaning]
      description: "Cobb-Douglas exponent on the x-good: balanced=0.5 (default), x_leaning=0.7 (prefers the x-good), y_leaning=0.3 (prefers the y-good)."
    curves:
      type: integer
      enum: [1, 2, 3]
      description: "How many indifference curves to draw (default 3): 1 draws just the utility-maximizing curve; 2 adds a lower, attainable curve; 3 adds a higher, unattainable one too."
    show_optimum:
      type: boolean
      description: "Show the optimal-bundle dot and its dashed guides to both axes (default true)."
    x_good:
      type: string
      description: "Label for the good on the x-axis (default \"Good X\")."
    y_good:
      type: string
      description: "Label for the good on the y-axis (default \"Good Y\")."
    x_max:
      type: number
      description: "Fixed x-axis extent in units of the x-good (default 1.3 × the budget's x-intercept, so the line never seems to move). Set x_max and y_max when animating a price or income."
    y_max:
      type: number
      description: "Fixed y-axis extent in units of the y-good (see x_max)."
    price_x_before:
      type: number
      description: "The x-good's price before a change to price_x: adds the old budget line, the old optimum A on its curve, the compensated line through C, and the substitution (A→C) and income (C→B) effects."
element_ids:
  axes: the coordinate axes (one group with both axis lines and their captions)
  budget_line: the straight budget line from (0, income/price_y) to (income/price_x, 0)
  label_budget: the budget line's label
  ic_1 / ic_2 / ic_3: the indifference curve(s) actually drawn, in order below/at/above the optimum (only as many as `curves` requests)
  label_ic_1 / label_ic_2 / label_ic_3: each drawn curve's label
  optimum: dot at the utility-maximizing bundle (x* = alpha*income/price_x, y* = (1-alpha)*income/price_y), present when show_optimum
  optimum_label: the optimum's label
  guide_x: dashed vertical guide from the optimum down to the x-axis, present when show_optimum
  guide_y: dashed horizontal guide from the optimum to the y-axis, present when show_optimum
  budget_old / label_budget_old: the budget line at price_x_before (dashed), with price_x_before
  ic_old / label_ic_old: the indifference curve through the old optimum, with price_x_before
  budget_comp / label_budget_comp: the compensated budget line (new prices, old utility), with price_x_before
  point_a / label_point_a: the old optimum A, with price_x_before (the optimum is then labelled B)
  point_c / label_point_c: the compensated bundle C (A's curve, new prices), with price_x_before
  guide_a / guide_c: dashed guides from A and C down to the x-axis
  substitution_effect / label_substitution: arrow A→C along the x-axis
  income_effect / label_income: arrow C→B along the x-axis
examples:
  - request: "Draw a consumer's indifference curves and budget line, and show the optimal bundle."
    params: {}
  - request: "Show how a consumer chooses between food and housing."
    params: { preference: "x_leaning", x_good: "Food", y_good: "Housing" }
  - request: "Split a price rise into substitution and income effects."
    params: { price_x: 3, price_x_before: 2, curves: 1 }
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const income = Math.max(1, params.income ?? 100);
  const priceX = Math.max(0.01, params.price_x ?? 2);
  const priceY = Math.max(0.01, params.price_y ?? 1);
  const pref = params.preference === "x_leaning" ? "x_leaning" : params.preference === "y_leaning" ? "y_leaning" : "balanced";
  const alpha = pref === "x_leaning" ? 0.7 : pref === "y_leaning" ? 0.3 : 0.5;
  const curveCount = Math.min(3, Math.max(1, Math.round(params.curves ?? 3)));
  const showOptimum = params.show_optimum !== false;
  const xGood = typeof params.x_good === "string" && params.x_good.trim() !== "" ? params.x_good : "Good X";
  const yGood = typeof params.y_good === "string" && params.y_good.trim() !== "" ? params.y_good : "Good Y";

  const plot = { x0: 120, y0: 95, x1: 930, y1: 675 };
  const xInt = income / priceX;
  const yInt = income / priceY;
  const xStar = alpha * xInt;
  const yStar = (1 - alpha) * yInt;
  // A price change to split (Slutsky/Hicks, Cobb-Douglas): the old optimum
  // A, and C, the cheapest bundle on A's curve at the NEW prices.
  const pxBefore = Number.isFinite(params.price_x_before) ? Math.max(0.01, params.price_x_before) : null;
  const split = pxBefore !== null && Math.abs(pxBefore - priceX) > 1e-9 ? (() => {
    const xA = alpha * income / pxBefore, yA = yStar;
    const u0 = Math.pow(xA, alpha) * Math.pow(yA, 1 - alpha);
    const xC = u0 * Math.pow((alpha * priceY) / ((1 - alpha) * priceX), 1 - alpha);
    const yC = u0 * Math.pow(((1 - alpha) * priceX) / (alpha * priceY), alpha);
    const incomeC = priceX * xC + priceY * yC;
    return { xA, yA, u0, xC, yC, incomeC, xIntOld: income / pxBefore, xIntC: incomeC / priceX, yIntC: incomeC / priceY };
  })() : null;
  // The axes: 1.3 × the farthest intercept drawn, unless x_max/y_max hold
  // them still (an animated or dragged price) — and never so short that a
  // line runs off the plot.
  const xFar = split ? Math.max(xInt, split.xIntOld, split.xIntC) : xInt;
  const yFar = split ? Math.max(yInt, split.yIntC) : yInt;
  const worldXMax = Number.isFinite(params.x_max) && params.x_max > 0 ? Math.max(params.x_max, xFar * 1.05) : xFar * 1.3;
  const worldYMax = Number.isFinite(params.y_max) && params.y_max > 0 ? Math.max(params.y_max, yFar * 1.05) : yFar * 1.3;
  const sx = (v) => plot.x0 + (v / worldXMax) * (plot.x1 - plot.x0);
  const sy = (v) => plot.y0 + (v / worldYMax) * (plot.y1 - plot.y0);

  const drawables = [], labels = [], anchors = {}, order = [];
  const attached = {};
  const push = (d) => { drawables.push(d); order.push(d.id); };
  const label = (id, anchor, side, text, color, fontSize) => {
    labels.push(kit.label(id, anchor, side, text, { color, fontSize }));
    order.push(id);
  };

  const axesChildren = [
    kit.stroke("axes__x", [[plot.x0 - 6, plot.y0], [plot.x1 + kit.AXIS_OVERHANG, plot.y0]], { arrowhead: "end", strokeWidth: 4, ms: MS.axis }),
    kit.stroke("axes__y", [[plot.x0, plot.y0 - 6], [plot.x0, plot.y1 + kit.AXIS_OVERHANG]], { arrowhead: "end", strokeWidth: 4, ms: MS.axis }),
    kit.axisLabel("axes__x_label", "x", plot, xGood, { fontSize: 26 }),
    kit.axisLabel("axes__y_label", "y", plot, yGood, { fontSize: 26 }),
  ];
  push(kit.group("axes", axesChildren));

  const budgetPts = [[sx(0), sy(yInt)], [sx(xInt), sy(0)]];
  push(kit.stroke("budget_line", budgetPts, { color: C.ink, strokeWidth: 4.5, ms: MS.curve }));
  anchors.budget_line = budgetPts[1];
  label("label_budget", budgetPts[1], "below-right", "Budget line", C.ink, 20);
  attached["budget_line"] = [...(attached["budget_line"] ?? []), "label_budget"];

  const uAt = Math.pow(xStar, alpha) * Math.pow(yStar, 1 - alpha);
  const U = { below: uAt * 0.6, at: uAt, above: uAt * 1.55 };
  const LEVEL_STYLE = {
    below: { color: C.supply, dash: false, text: "Attainable" },
    at: { color: C.accent, dash: false, text: split ? "U after" : "Optimum U" },
    above: { color: C.guide, dash: true, text: "Unattainable" },
  };
  const levels = curveCount === 1 ? ["at"] : curveCount === 2 ? ["below", "at"] : ["below", "at", "above"];

  function icWorldPts(u) {
    const raw = kit.sample((x) => Math.pow(u / Math.pow(x, alpha), 1 / (1 - alpha)), worldXMax * 0.015, worldXMax * 0.98, 70);
    return raw.filter(([x, y]) => y >= 0 && y <= worldYMax * 0.97);
  }

  levels.forEach((lvl, i) => {
    const id = "ic_" + (i + 1);
    const world = icWorldPts(U[lvl]);
    const pts = world.length > 1 ? world.map(([x, y]) => [sx(x), sy(y)]) : [[sx(xStar), sy(yStar)], [sx(xStar) + 1, sy(yStar)]];
    const st = LEVEL_STYLE[lvl];
    push(kit.stroke(id, pts, { color: st.color, strokeWidth: lvl === "at" ? 4.5 : 3.5, dash: st.dash, ms: MS.curve }));
    anchors[id] = pts[pts.length - 1];
    label("label_" + id, anchors[id], "right", st.text, st.color, 19);
  });

  if (showOptimum) {
    const opt = [sx(xStar), sy(yStar)];
    push(kit.stroke("guide_x", [[opt[0], plot.y0], opt], { color: C.guide, dash: true, strokeWidth: 2.5, ms: MS.guides }));
    push(kit.stroke("guide_y", [[plot.x0, opt[1]], opt], { color: C.guide, dash: true, strokeWidth: 2.5, ms: MS.guides }));
    push(kit.stroke("optimum", [opt], { shapeHint: { type: "circle", c: opt, r: 7 }, strokeWidth: 3, fill: C.ink, ms: MS.dot }));
    anchors.optimum = opt;
    label("optimum_label", opt, "above-right", split ? "B" : "Optimum", C.ink, 22);
    attached["optimum"] = [...(attached["optimum"] ?? []), "optimum_label"];
  }

  const values = { x: xStar, y: yStar, x_intercept: xInt, y_intercept: yInt };
  if (split) {
    const { xA, yA, xC, yC } = split;
    const oldPts = [[sx(0), sy(yInt)], [sx(split.xIntOld), sy(0)]];
    push(kit.stroke("budget_old", oldPts, { color: C.guide, dash: true, strokeWidth: 3.5, ms: MS.curve }));
    anchors.budget_old = oldPts[1];
    label("label_budget_old", oldPts[1], "below", "Before", C.guide, 19);
    const oldWorld = icWorldPts(split.u0);
    const oldIc = oldWorld.length > 1 ? oldWorld.map(([x, y]) => [sx(x), sy(y)]) : [[sx(xA), sy(yA)], [sx(xA) + 1, sy(yA)]];
    push(kit.stroke("ic_old", oldIc, { color: C.supply, strokeWidth: 3.5, ms: MS.curve }));
    anchors.ic_old = oldIc[oldIc.length - 1];
    label("label_ic_old", anchors.ic_old, "right", "U before", C.supply, 19);
    const compPts = [[sx(0), sy(split.yIntC)], [sx(split.xIntC), sy(0)]];
    push(kit.stroke("budget_comp", compPts, { color: C.shifted, dash: true, strokeWidth: 3, ms: MS.curve }));
    anchors.budget_comp = compPts[0];
    label("label_budget_comp", compPts[0], "right", "Compensated", C.shifted, 19);
    const a = [sx(xA), sy(yA)], c = [sx(xC), sy(yC)];
    push(kit.stroke("guide_a", [[a[0], plot.y0], a], { color: C.guide, dash: true, strokeWidth: 2, ms: MS.guides }));
    push(kit.stroke("guide_c", [[c[0], plot.y0], c], { color: C.guide, dash: true, strokeWidth: 2, ms: MS.guides }));
    push(kit.stroke("point_a", [a], { shapeHint: { type: "circle", c: a, r: 7 }, strokeWidth: 3, fill: C.supply, color: C.supply, ms: MS.dot }));
    anchors.point_a = a;
    label("label_point_a", a, "above-right", "A", C.supply, 22);
    push(kit.stroke("point_c", [c], { shapeHint: { type: "circle", c, r: 7 }, strokeWidth: 3, fill: C.shifted, color: C.shifted, ms: MS.dot }));
    anchors.point_c = c;
    label("label_point_c", c, "above-right", "C", C.shifted, 22);
    // The two effects as arrows along the x-axis: A→C, then C→B. A move
    // too small to carry a head is drawn as a plain tick.
    const b = sx(xStar);
    const effect = (id, x0, x1, y, text, color) => {
      push(kit.stroke(id, [[x0, y], [x1, y]], Object.assign({ color, strokeWidth: 3.5, ms: MS.arrow }, Math.abs(x1 - x0) >= 10 ? { arrowhead: "end" } : {})));
      anchors[id] = [(x0 + x1) / 2, y];
      label("label_" + id.replace("_effect", ""), anchors[id], "above", text, color, 20);
    };
    effect("substitution_effect", a[0], c[0], plot.y0 + 50, "Substitution", C.shifted);
    effect("income_effect", c[0], b, plot.y0 + 22, "Income", C.accent);
    Object.assign(values, { x_before: xA, y_before: yA, x_comp: xC, y_comp: yC, substitution: xC - xA, income_effect: xStar - xC, income_comp: split.incomeC });
  }
  for (const k of Object.keys(values)) values[k] = Math.round(values[k] * 100) / 100;

  return { drawables, labels, anchors, order, attached, values, frame: { x: [0, worldXMax], y: [0, worldYMax], box: plot } };
widget: |
  // Free play (2026-09-27), like supply_demand's: paused, the viewer takes
  // hold of the budget line and the choice recomputes under the pointer.
  //
  //   near the x-axis end → turns about the y-intercept (price_x)
  //   near the y-axis end → turns about the x-intercept (price_y)
  //   the middle          → slides parallel (income)
  //
  // The optimum, its curves and guides, and a price_x_before split (A, C,
  // the substitution and income arrows) all follow. The first drag also
  // pins the axes where they stand (x_max, y_max): the axes otherwise scale
  // with the intercepts, and the line would never seem to move. Live: every
  // drag_move maps the press onto the press-time params — one patch per
  // gesture, no state.
  const END = 0.2;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const round = (v, d) => Math.round(v * 10 ** d) / 10 ** d;
  const fin = (v) => Number.isFinite(v);
  const read = (p) => {
    const income = Math.max(1, fin(p.income) ? p.income : 100);
    const px = Math.max(0.01, fin(p.price_x) ? p.price_x : 2);
    const py = Math.max(0.01, fin(p.price_y) ? p.price_y : 1);
    const alpha = p.preference === "x_leaning" ? 0.7 : p.preference === "y_leaning" ? 0.3 : 0.5;
    return { income, px, py, alpha };
  };
  // The layout's axes at these params (the layout's own rule, repeated).
  const world = (p) => {
    const { income, px, py, alpha } = read(p);
    let xFar = income / px, yFar = income / py;
    const pb = fin(p.price_x_before) ? Math.max(0.01, p.price_x_before) : null;
    if (pb !== null && Math.abs(pb - px) > 1e-9) {
      const u0 = Math.pow(alpha * income / pb, alpha) * Math.pow((1 - alpha) * income / py, 1 - alpha);
      const xC = u0 * Math.pow((alpha * py) / ((1 - alpha) * px), 1 - alpha);
      const yC = u0 * Math.pow(((1 - alpha) * px) / (alpha * py), alpha);
      const iC = px * xC + py * yC;
      xFar = Math.max(xFar, income / pb, iC / px);
      yFar = Math.max(yFar, iC / py);
    }
    const X = fin(p.x_max) && p.x_max > 0 ? Math.max(p.x_max, xFar * 1.05) : xFar * 1.3;
    const Y = fin(p.y_max) && p.y_max > 0 ? Math.max(p.y_max, yFar * 1.05) : yFar * 1.3;
    return [X, Y];
  };
  // Where along a polyline the nearest point to p lies (0–1), and that point.
  const along = (pts, p) => {
    const lens = [0];
    for (let i = 1; i < pts.length; i++) lens.push(lens[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const total = lens[lens.length - 1] || 1;
    let best = { d: Infinity, at: pts[0], t: 0 };
    for (let i = 1; i < pts.length; i++) {
      const [a, b] = [pts[i - 1], pts[i]];
      const dx = b[0] - a[0], dy = b[1] - a[1], len2 = dx * dx + dy * dy;
      const u = len2 === 0 ? 0 : clamp(((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / len2, 0, 1);
      const at = [a[0] + u * dx, a[1] + u * dy];
      const d = Math.hypot(p[0] - at[0], p[1] - at[1]);
      if (d < best.d) best = { d, at, t: (lens[i - 1] + u * (lens[i] - lens[i - 1])) / total };
    }
    return best;
  };
  const good = (p, key, fallback) => (typeof p[key] === "string" && p[key].trim() !== "" ? p[key] : fallback);
  // The patch a drag of the budget line from `from` to `to` (domain units)
  // makes, pressed at logical `fromL`; null = nothing.
  const dragPatch = (fromL, from, to, scene) => {
    const p = scene.params;
    const { income, px, py } = read(p);
    const xInt = income / px, yInt = income / py;
    const [X, Y] = world(p);
    const pin = { x_max: round(X, 3), y_max: round(Y, 3) };
    const line = scene.lines.get("budget_line")?.[0];
    const hit = line ? along(line, fromL) : null;
    // The grabbed point ON the line, moved with the pointer: the new line
    // passes through it.
    const g = (hit && scene.toDomain(hit.at)) || from;
    const tx = g[0] + to[0] - from[0], ty = g[1] + to[1] - from[1];
    const t = hit ? hit.t : 0.5;
    if (t > 1 - END) {
      // The line from the y-intercept through the pointer meets the x-axis at…
      const x = ty < yInt * 0.999 && tx > 0 ? (tx * yInt) / (yInt - ty) : Infinity;
      const xNew = clamp(x, X * 0.05, X * 0.95);
      return { patch: { price_x: round(income / xNew, 3), ...pin }, caption: "Changing the price of " + good(p, "x_good", "Good X") };
    }
    if (t < END) {
      const y = tx < xInt * 0.999 && ty > 0 ? (ty * xInt) / (xInt - tx) : Infinity;
      const yNew = clamp(y, Y * 0.05, Y * 0.95);
      return { patch: { price_y: round(income / yNew, 3), ...pin }, caption: "Changing the price of " + good(p, "y_good", "Good Y") };
    }
    // Parallel: the income that puts the line through the pointer, kept on the plot.
    const kMax = Math.min((X * 0.95) / xInt, (Y * 0.95) / yInt);
    const k = clamp(tx / xInt + ty / yInt, 0.05, kMax);
    return { patch: { income: round(income * k, 2), ...pin }, caption: "Changing income" };
  };
  const on = (ev, st, scene) => {
    const same = { state: st, effects: [] };
    if ((ev.type !== "drag_move" && ev.type !== "drag") || ev.id !== "budget_line" || !ev.from || !ev.fromDomain || !ev.domain) return same;
    const r = dragPatch(ev.from, ev.fromDomain, ev.domain, scene);
    const effects = [{ patch: r.patch }];
    if (st.said !== r.caption) effects.push({ caption: r.caption });
    return { state: { said: r.caption }, effects };
  };
  return { parts: ["budget_line"], live: true, init: () => ({ said: null }), on };
---
template: ppf
title: Production possibilities frontier
version: 2
kit: 4
status: ready
description: >-
  A production possibilities frontier (PPF) between two goods: a bowed-out
  (concave, increasing-opportunity-cost) or straight-line (constant-
  opportunity-cost) curve from the y-axis intercept to the x-axis intercept,
  the attainable region shaded underneath it, and optional labeled points
  that are efficient (on the frontier), inefficient (inside it, wasting
  resources), or unattainable (outside it, beyond current capacity). Choose
  this scene for ANY request about the production possibilities frontier,
  PPF, production possibilities curve, opportunity cost, scarcity,
  productive efficiency, or a classic "guns and butter" tradeoff.
  `indifference_curves` adds community indifference curves and the point
  where the highest attainable one is TANGENT to the frontier — the
  society-chooses-a-point-on-the-frontier figure, where the frontier alone
  only says which points are feasible. The tangency is computed, not
  eyeballed: the curve touches the frontier at `optimum_at` and lies inside
  the attainable set everywhere else.
params:
  type: object
  properties:
    good_x:
      type: string
      description: "Label for the good on the x-axis (default \"Good X\")."
    good_y:
      type: string
      description: "Label for the good on the y-axis (default \"Good Y\")."
    bowed:
      type: boolean
      description: "Concave, bowed-out frontier from increasing opportunity cost (default true); false draws a straight-line frontier (constant opportunity cost)."
    points:
      type: array
      items:
        type: object
        properties:
          x_share:
            type: number
            description: "0-1: how far along the frontier, from the y-intercept (0) to the x-intercept (1), this point's direction from the origin is taken from."
          label:
            type: string
          kind:
            type: string
            enum: [efficient, inefficient, unattainable]
            description: "efficient (default) sits ON the frontier; inefficient sits inside it (feasible but wasteful); unattainable sits outside it (infeasible)."
        required: [x_share, label]
      description: "Labeled reference points relative to the frontier."
    shade_attainable:
      type: boolean
      description: "Shade the attainable region under the frontier (default true)."
    indifference_curves:
      type: integer
      enum: [0, 1, 2, 3]
      description: "Community indifference curves against the frontier (default 0, none): 1 draws only the utility-maximizing curve, tangent to the frontier; 2 adds a lower, attainable curve; 3 adds a higher, unattainable one too. Numeric, so it can be animated from 0."
    optimum_at:
      type: number
      description: "0-1: where along the frontier, from the y-intercept (0) to the x-intercept (1), the tangency sits (default 0.5, the middle). Clamped to 0.08-0.92 so the implied preferences stay sane. Animate it to slide society's chosen point along the frontier."
    optimum_label:
      type: string
      description: "Label on the tangency dot (default \"Optimum\")."
element_ids:
  axes: the coordinate axes (one group with both axis lines and their captions)
  frontier: the production possibilities frontier curve
  attainable: the shaded attainable region under the frontier, present when shade_attainable
  pt_<i>: marker for points[i]
  pt_label_<i>: its label
  ic_1 / ic_2 / ic_3: the indifference curve(s) actually drawn, in order below/at/above the optimum (only as many as `indifference_curves` requests, so with 1 the single curve is ic_1 and it IS the tangent one)
  label_ic_1 / label_ic_2 / label_ic_3: each drawn curve's label
  optimum: dot where the highest attainable indifference curve touches the frontier, present when indifference_curves > 0
  optimum_label: the optimum's label
examples:
  - request: "Draw a production possibilities frontier for guns and butter."
    params: { good_x: "Guns", good_y: "Butter" }
  - request: "Show a production possibilities frontier with an unattainable combination of healthcare and education."
    params: { good_x: "Healthcare", good_y: "Education", points: [{ x_share: 0.5, label: "Unattainable mix", kind: "unattainable" }] }
  - request: "Add indifference curves to the PPF and show which point society actually chooses."
    params: { good_x: "Healthcare", good_y: "Everything else", indifference_curves: 3, optimum_at: 0.45 }
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const goodX = typeof params.good_x === "string" && params.good_x.trim() !== "" ? params.good_x : "Good X";
  const goodY = typeof params.good_y === "string" && params.good_y.trim() !== "" ? params.good_y : "Good Y";
  const bowed = params.bowed !== false;
  const shadeAttainable = params.shade_attainable !== false;
  const pointsIn = Array.isArray(params.points) ? params.points.slice(0, 6) : [];
  const icCount = Math.min(3, Math.max(0, Math.round(params.indifference_curves ?? 0)));
  const optimumAt = Math.min(0.92, Math.max(0.08, typeof params.optimum_at === "number" ? params.optimum_at : 0.5));
  const optimumLabel = typeof params.optimum_label === "string" && params.optimum_label.trim() !== "" ? params.optimum_label : "Optimum";

  const plot = { x0: 120, y0: 95, x1: 930, y1: 675 };
  const R = 90;
  const worldMax = R * 1.35;
  const sx = (v) => plot.x0 + (v / worldMax) * (plot.x1 - plot.x0);
  const sy = (v) => plot.y0 + (v / worldMax) * (plot.y1 - plot.y0);

  function curveWorldPt(s) {
    const share = Math.min(1, Math.max(0, typeof s === "number" ? s : 0.5));
    if (bowed) {
      const theta = (1 - share) * (Math.PI / 2);
      return [R * Math.cos(theta), R * Math.sin(theta)];
    }
    return [R * share, R * (1 - share)];
  }

  const drawables = [], labels = [], anchors = {}, order = [];
  const attached = {};
  const push = (d) => { drawables.push(d); order.push(d.id); };
  const label = (id, anchor, side, text, color, fontSize) => {
    labels.push(kit.label(id, anchor, side, text, { color, fontSize }));
    order.push(id);
  };

  const axesChildren = [
    kit.stroke("axes__x", [[plot.x0 - 6, plot.y0], [plot.x1 + kit.AXIS_OVERHANG, plot.y0]], { arrowhead: "end", strokeWidth: 4, ms: MS.axis }),
    kit.stroke("axes__y", [[plot.x0, plot.y0 - 6], [plot.x0, plot.y1 + kit.AXIS_OVERHANG]], { arrowhead: "end", strokeWidth: 4, ms: MS.axis }),
    kit.axisLabel("axes__x_label", "x", plot, goodX, { fontSize: 26 }),
    kit.axisLabel("axes__y_label", "y", plot, goodY, { fontSize: 26 }),
  ];
  push(kit.group("axes", axesChildren));

  const frontierWorld = bowed ? kit.arc([0, 0], R, Math.PI / 2, 0, 48) : [[0, R], [R, 0]];
  push(kit.stroke("frontier", frontierWorld.map(([x, y]) => [sx(x), sy(y)]), { color: C.ink, strokeWidth: 4.5, ms: MS.curve }));
  const midFrontier = frontierWorld[Math.floor(frontierWorld.length / 2)];
  anchors.frontier = [sx(midFrontier[0]), sy(midFrontier[1])];

  if (shadeAttainable) {
    const shadeWorld = frontierWorld.concat([[0, 0]]);
    const shadePts = shadeWorld.map(([x, y]) => [sx(x), sy(y)]);
    push(kit.area("attainable", shadePts, C.region1));
    let cx = 0, cy = 0;
    for (const p of shadePts) { cx += p[0]; cy += p[1]; }
    anchors.attainable = [cx / shadePts.length, cy / shadePts.length];
  }

  pointsIn.forEach((p, i) => {
    const s = p && typeof p.x_share === "number" ? p.x_share : 0.5;
    const kind = p && p.kind === "inefficient" ? "inefficient" : p && p.kind === "unattainable" ? "unattainable" : "efficient";
    const factor = kind === "inefficient" ? 0.6 : kind === "unattainable" ? 1.25 : 1;
    const base = curveWorldPt(s);
    const world = [base[0] * factor, base[1] * factor];
    const logical = [sx(world[0]), sy(world[1])];
    const color = kind === "efficient" ? C.ink : kind === "inefficient" ? C.accent : C.regionLoss;
    const id = "pt_" + i;
    push(kit.stroke(id, [logical], { shapeHint: { type: "circle", c: logical, r: 7 }, strokeWidth: 3, fill: color, ms: MS.dot }));
    anchors[id] = logical;
    const text = p && typeof p.label === "string" && p.label.trim() !== "" ? p.label : "Point " + (i + 1);
    label("pt_label_" + i, logical, "above-right", text, color, 20);
  });

  if (icCount > 0) {
    // Tangency, not eyeballing: pick the Cobb-Douglas exponent whose MRS equals
    // the frontier's MRT at optimum_at. Bowed frontier (quarter circle): the
    // slope there is -cot(theta), and MRS = (a/(1-a))*(y/x) = (a/(1-a))*tan(theta),
    // so a = cos^2(theta). Straight frontier: the slope is -1 everywhere, and the
    // same identity collapses to a = optimum_at. Convex curve under a concave
    // frontier then touches at exactly one point and lies inside it elsewhere.
    const theta = (1 - optimumAt) * (Math.PI / 2);
    const alpha = bowed ? Math.cos(theta) * Math.cos(theta) : optimumAt;
    const [ox, oy] = curveWorldPt(optimumAt);
    const uAt = Math.pow(ox, alpha) * Math.pow(oy, 1 - alpha);
    const U = { below: uAt * 0.72, at: uAt, above: uAt * 1.28 };
    const IC_STYLE = {
      below: { color: C.supply, dash: false, text: "Lower utility" },
      at: { color: C.accent, dash: false, text: "Highest attainable" },
      above: { color: C.guide, dash: true, text: "Unattainable" },
    };
    const levels = icCount === 1 ? ["at"] : icCount === 2 ? ["below", "at"] : ["below", "at", "above"];
    levels.forEach((lvl, i) => {
      const u = U[lvl];
      const world = kit
        .sample((x) => Math.pow(u / Math.pow(x, alpha), 1 / (1 - alpha)), worldMax * 0.02, worldMax * 0.99, 90)
        .filter(([, y]) => Number.isFinite(y) && y >= 0 && y <= worldMax * 0.99);
      const id = "ic_" + (i + 1);
      const pts = world.length > 1 ? world.map(([x, y]) => [sx(x), sy(y)]) : [[sx(ox), sy(oy)], [sx(ox) + 1, sy(oy)]];
      const st = IC_STYLE[lvl];
      push(kit.stroke(id, pts, { color: st.color, strokeWidth: lvl === "at" ? 4.5 : 3.5, dash: st.dash, ms: MS.curve }));
      anchors[id] = pts[pts.length - 1];
      label("label_" + id, anchors[id], "right", st.text, st.color, 19);
    });
    const opt = [sx(ox), sy(oy)];
    push(kit.stroke("optimum", [opt], { shapeHint: { type: "circle", c: opt, r: 7 }, strokeWidth: 3, fill: C.ink, ms: MS.dot }));
    anchors.optimum = opt;
    label("optimum_label", opt, "above-right", optimumLabel, C.ink, 22);
    attached["optimum"] = [...(attached["optimum"] ?? []), "optimum_label"];
  }

  return { drawables, labels, anchors, order, attached, frame: { x: [0, worldMax], y: [0, worldMax], box: plot } };
---
template: firm_cost_curves
title: Firm cost curves (competition & monopoly)
version: 1
kit: 4
status: ready
description: >-
  A firm's short-run cost curves — marginal cost (MC), average total cost
  (ATC), average variable cost (AVC) — computed from fixed reference
  expressions, with either a price-taking competitive firm's horizontal
  price line and profit-maximizing quantity (where P = MC), or a
  monopolist's downward demand and marginal-revenue curves with its
  profit-maximizing quantity (where MR = MC) and, on request, the
  deadweight-loss triangle versus the competitive outcome. Choose this scene
  for ANY request about marginal cost, average total cost, average variable
  cost, marginal revenue, a firm's profit-maximizing quantity, perfect
  competition, monopoly pricing, or monopoly deadweight loss. Curves: MC =
  0.06(Q-30)^2+12; AVC = 0.02(Q-45)^2+25.5 and ATC = AVC+F/Q follow from it,
  so MC passes through both minima: min AVC 25.5 at Q = 45, min ATC ~34 at
  Q ~ 49 with the default fixed_cost F = 400. A price between min AVC and
  min ATC is the loss-but-produce case; below min AVC, shutdown. Set
  mark_minima to add dots on both minima (min_avc, min_atc).
params:
  type: object
  properties:
    mode:
      type: string
      enum: [competition, monopoly]
      description: "A price-taking competitive firm, or a single-price monopolist. Default competition."
    show:
      type: array
      items:
        type: string
        enum: [mc, atc, avc, mr, demand, price_line]
      description: "Which curves/lines to draw. Default per mode: competition -> mc, atc, avc, price_line; monopoly -> mc, atc, demand, mr."
    price:
      type: number
      description: "Market price for a competitive firm, 0-100 (default 55). Numeric and animates smoothly."
    shade:
      type: string
      enum: [profit, loss, deadweight]
      description: "Shade a profit/loss rectangle at the profit-maximizing quantity (either mode), or, monopoly only, the deadweight-loss triangle between demand and MC from the monopoly quantity to the competitive quantity. Omit for no shading."
    fixed_cost:
      type: number
      description: "Fixed cost F, 0-2000 (default 400). ATC - AVC = F/Q, so a larger F widens the band between them. Numeric and animates smoothly."
    mark_minima:
      type: boolean
      description: "Add min_avc (shutdown point) and min_atc (break-even point) dots on the curves (default false)."
element_ids:
  axes: the coordinate axes (one group with both axis lines and their captions)
  mc / atc / avc / demand / mr: the curves currently in `show`
  min_avc / min_atc: dots at the minimum of AVC (shutdown point) and of ATC (break-even point), present when mark_minima and that curve is in `show`; labels label_min_avc / label_min_atc
  price_line: the horizontal market-price line (competition), present when in `show`
  q_star: dot at the profit-maximizing quantity
  p_star: dashed guide from q_star to the price axis
  shade: the shaded profit/loss rectangle or deadweight-loss triangle, when `shade` is set and computable
  label_mc / label_atc / label_avc / label_demand / label_mr / label_price_line / label_q_star / label_p_star / label_shade: curve and marker labels
examples:
  - request: "Draw a competitive firm's marginal and average cost curves."
    params: {}
  - request: "Show a monopolist's profit-maximizing quantity and the resulting deadweight loss."
    params: { mode: "monopoly", shade: "deadweight" }
  - request: "Show a firm that keeps producing at a loss because price covers its variable cost."
    params: { price: 30, shade: "loss", mark_minima: true }
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const mcExpr = kit.expr("0.06*(x-30)^2 + 12", ["x"]);
  // TVC = integral of MC, so AVC = 0.02(x-45)^2 + 25.5 meets MC at its minimum,
  // and ATC = AVC + F/x meets MC at its own (F = 400: Q ~ 49, ATC ~ 34).
  const fixedCost = typeof params.fixed_cost === "number" && Number.isFinite(params.fixed_cost)
    ? Math.min(2000, Math.max(0, params.fixed_cost)) : 400;
  const atcExpr = kit.expr("0.02*(x-45)^2 + 25.5 + f/x", ["x", "f"]);
  const avcExpr = kit.expr("0.02*(x-45)^2 + 25.5", ["x"]);
  const demandExpr = kit.expr("90 - 0.8*x", ["x"]);
  const mrExpr = kit.expr("90 - 1.6*x", ["x"]);
  const mc = (x) => mcExpr({ x });
  const atc = (x) => atcExpr({ x, f: fixedCost });
  const avc = (x) => avcExpr({ x });
  function argmin(f) {
    let lo = 1, hi = 100;
    for (let i = 0; i < 80; i++) {
      const m1 = lo + (hi - lo) / 3, m2 = hi - (hi - lo) / 3;
      if (f(m1) <= f(m2)) hi = m2; else lo = m1;
    }
    return (lo + hi) / 2;
  }
  const demandFn = (x) => demandExpr({ x });
  const mrFn = (x) => mrExpr({ x });

  function findCrossing(f, g, x0, x1, n) {
    let prevX = x0, prevDiff = f(x0) - g(x0);
    if (prevDiff === 0) return prevX;
    for (let i = 1; i <= n; i++) {
      const x = x0 + ((x1 - x0) * i) / n;
      const diff = f(x) - g(x);
      if (diff === 0) return x;
      if ((prevDiff < 0 && diff > 0) || (prevDiff > 0 && diff < 0)) {
        const t = prevDiff / (prevDiff - diff);
        return prevX + (x - prevX) * t;
      }
      prevX = x;
      prevDiff = diff;
    }
    return null;
  }

  const mode = params.mode === "monopoly" ? "monopoly" : "competition";
  const defaultShow = mode === "monopoly" ? ["mc", "atc", "demand", "mr"] : ["mc", "atc", "avc", "price_line"];
  const showList = Array.isArray(params.show) && params.show.length > 0 ? params.show : defaultShow;
  const showSet = new Set(showList);
  const price = Math.min(100, Math.max(0, typeof params.price === "number" ? params.price : 55));
  const shadeParam = params.shade === "profit" || params.shade === "loss" || params.shade === "deadweight" ? params.shade : null;

  let qStar = null, pStar = null, qCompetitive = null;
  if (mode === "monopoly") {
    qStar = findCrossing(mc, mrFn, 0.5, 100, 500);
    if (qStar !== null) pStar = demandFn(qStar);
    qCompetitive = findCrossing(mc, demandFn, 0.5, 100, 500);
  } else {
    qStar = findCrossing(mc, () => price, 30, 100, 500);
    if (qStar !== null) pStar = price;
  }

  const plot = { x0: 120, y0: 95, x1: 930, y1: 675 };
  const sx = (v) => plot.x0 + (v / 100) * (plot.x1 - plot.x0);
  const sy = (v) => plot.y0 + (v / 100) * (plot.y1 - plot.y0);

  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  const label = (id, anchor, side, text, color, fontSize) => {
    labels.push(kit.label(id, anchor, side, text, { color, fontSize }));
    order.push(id);
  };

  const axesChildren = [
    kit.stroke("axes__x", [[plot.x0 - 6, plot.y0], [plot.x1 + kit.AXIS_OVERHANG, plot.y0]], { arrowhead: "end", strokeWidth: 4, ms: MS.axis }),
    kit.stroke("axes__y", [[plot.x0, plot.y0 - 6], [plot.x0, plot.y1 + kit.AXIS_OVERHANG]], { arrowhead: "end", strokeWidth: 4, ms: MS.axis }),
    kit.axisLabel("axes__x_label", "x", plot, "Quantity (Q)", { fontSize: 26 }),
    kit.axisLabel("axes__y_label", "y", plot, "Price / cost", { fontSize: 26 }),
  ];
  push(kit.group("axes", axesChildren));

  function sampledLogical(fn) {
    const raw = kit.sample(fn, 0.5, 100, 90);
    return raw.filter(([x, y]) => y >= 0 && y <= 98).map(([x, y]) => [sx(x), sy(y)]);
  }

  const CURVES = {
    mc: { fn: mc, color: C.accent, dash: false, name: "MC" },
    atc: { fn: atc, color: C.supply, dash: false, name: "ATC" },
    avc: { fn: avc, color: C.shifted, dash: false, name: "AVC" },
    demand: { fn: demandFn, color: C.demand, dash: false, name: "Demand" },
    mr: { fn: mrFn, color: C.demand, dash: true, name: "MR" },
  };

  ["mc", "atc", "avc", "demand", "mr"].forEach((key) => {
    if (!showSet.has(key)) return;
    const def = CURVES[key];
    const pts = sampledLogical(def.fn);
    if (pts.length < 2) return;
    push(kit.stroke(key, pts, { color: def.color, strokeWidth: 4, dash: def.dash, ms: MS.curve }));
    anchors[key] = pts[pts.length - 1];
    label("label_" + key, anchors[key], "right", def.name, def.color, 20);
  });

  [["avc", avc, "Shutdown (min AVC)", "below-right"], ["atc", atc, "Break-even (min ATC)", "above-right"]].forEach(([key, fn, text, side]) => {
    if (params.mark_minima !== true || !showSet.has(key)) return;
    const q = argmin(fn), v = fn(q);
    if (!(v >= 0 && v <= 98)) return;
    const p = [sx(q), sy(v)], id = "min_" + key;
    push(kit.stroke(id, [p], { shapeHint: { type: "circle", c: p, r: 6 }, strokeWidth: 3, fill: CURVES[key].color, color: CURVES[key].color, ms: MS.dot }));
    anchors[id] = p;
    label("label_" + id, p, side, text, CURVES[key].color, 17);
  });

  if (showSet.has("price_line")) {
    const yL = sy(price);
    const pts = [[sx(0.5), yL], [sx(99.5), yL]];
    push(kit.stroke("price_line", pts, { color: C.accent, dash: true, strokeWidth: 3.5, ms: MS.priceLine }));
    anchors.price_line = pts[1];
    label("label_price_line", pts[1], "above-left", "Price", C.accent, 20);
  }

  if (qStar !== null && pStar !== null) {
    const qL = sx(qStar), pL = sy(pStar);
    push(kit.stroke("q_star", [[qL, pL]], { shapeHint: { type: "circle", c: [qL, pL], r: 7 }, strokeWidth: 3, fill: C.ink, ms: MS.dot }));
    anchors.q_star = [qL, pL];
    label("label_q_star", [qL, pL], "above-right", mode === "monopoly" ? "Q* (MR=MC)" : "Q* (P=MC)", C.ink, 19);
    push(kit.stroke("p_star", [[plot.x0, pL], [qL, pL]], { color: C.guide, dash: true, strokeWidth: 2.5, ms: MS.guides }));
    anchors.p_star = [plot.x0, pL];
    label("label_p_star", [plot.x0, pL], "left", "P*", C.guide, 19);
  }

  if (shadeParam === "profit" || shadeParam === "loss") {
    if (qStar !== null && pStar !== null) {
      const atcAtQ = atc(qStar);
      const top = Math.max(pStar, atcAtQ);
      const bottom = Math.min(pStar, atcAtQ);
      if (top - bottom > 0.5 && qStar > 0.5) {
        const rectWorld = [[0, bottom], [qStar, bottom], [qStar, top], [0, top]];
        const color = shadeParam === "profit" ? C.region1 : C.regionLoss;
        const rectPts = rectWorld.map(([x, y]) => [sx(x), sy(y)]);
        push(kit.area("shade", rectPts, color));
        anchors.shade = [sx(qStar / 2), sy((top + bottom) / 2)];
        label("label_shade", anchors.shade, "above", shadeParam === "profit" ? "Profit" : "Loss", color, 20);
      }
    }
  } else if (shadeParam === "deadweight" && mode === "monopoly" && qStar !== null && qCompetitive !== null && qCompetitive > qStar + 0.5) {
    const N = 30;
    const upper = [], lower = [];
    for (let i = 0; i <= N; i++) {
      const x = qStar + ((qCompetitive - qStar) * i) / N;
      upper.push([x, demandFn(x)]);
      lower.push([x, mc(x)]);
    }
    const regionWorld = upper.concat(lower.reverse());
    const regionPts = regionWorld.map(([x, y]) => [sx(Math.min(100, Math.max(0, x))), sy(Math.min(100, Math.max(0, y)))]);
    push(kit.area("shade", regionPts, C.regionLoss));
    let cx = 0, cy = 0;
    for (const p of regionPts) { cx += p[0]; cy += p[1]; }
    anchors.shade = [cx / regionPts.length, cy / regionPts.length];
    label("label_shade", anchors.shade, "above", "Deadweight loss", C.regionLoss, 20);
  }

  return { drawables, labels, anchors, order, frame: { x: [0, 100], y: [0, 100], box: plot } };
---
template: payoff_matrix
title: Payoff matrix (2x2 game)
version: 1
kit: 2
status: ready
description: >-
  A 2x2 game-theory payoff matrix: each cell shows both players' payoffs as
  "row, col", with best-response payoffs underlined per column (the row
  player's) and per row (the column player's) — the classic underlining
  method — and, by default, the pure-strategy Nash equilibrium cell(s)
  shaded, computed by checking that both payoffs are mutual best responses.
  Choose this scene for ANY request about game theory, a payoff matrix, the
  prisoner's dilemma, Nash equilibrium, a dominant strategy, best response,
  or any two-player simultaneous-move game.
params:
  type: object
  properties:
    row_player:
      type: string
      description: "Name of the row player (default \"Player 1\")."
    col_player:
      type: string
      description: "Name of the column player (default \"Player 2\")."
    row_strategies:
      type: array
      items: { type: string }
      minItems: 2
      maxItems: 2
      description: "The row player's two strategy names, top row first."
    col_strategies:
      type: array
      items: { type: string }
      minItems: 2
      maxItems: 2
      description: "The column player's two strategy names, left column first."
    payoffs:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: array
        minItems: 2
        maxItems: 2
        items:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: number }
      description: "Row-major 2x2 payoffs: payoffs[row][col] = [row player's payoff, column player's payoff]."
    highlight_equilibrium:
      type: boolean
      description: "Shade the pure-strategy Nash equilibrium cell(s), computed by a best-response check (default true)."
    title:
      type: string
element_ids:
  grid: the 2x2 grid lines
  cell_0_0 / cell_0_1 / cell_1_0 / cell_1_1: each cell (a group holding its payoff text and any best-response underline strokes)
  nash_<r>_<c>: shaded region behind a pure-strategy Nash equilibrium cell, present only for such cells when highlight_equilibrium
  row_label_0 / row_label_1: the row strategy names
  col_label_0 / col_label_1: the column strategy names
  row_player_label / col_player_label: the two players' names
  title: figure title, when set
examples:
  - request: "Draw the prisoner's dilemma payoff matrix and highlight the Nash equilibrium."
    params:
      row_player: "Suspect A"
      col_player: "Suspect B"
      row_strategies: ["Cooperate", "Defect"]
      col_strategies: ["Cooperate", "Defect"]
      payoffs: [[[3, 3], [0, 5]], [[5, 0], [1, 1]]]
      title: "Prisoner's Dilemma"
  - request: "Draw a stag hunt game and show both Nash equilibria."
    params:
      row_player: "Hunter 1"
      col_player: "Hunter 2"
      row_strategies: ["Stag", "Hare"]
      col_strategies: ["Stag", "Hare"]
      payoffs: [[[4, 4], [0, 3]], [[3, 0], [2, 2]]]
      title: "Stag Hunt"
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const rowPlayer = typeof params.row_player === "string" && params.row_player.trim() !== "" ? params.row_player : "Player 1";
  const colPlayer = typeof params.col_player === "string" && params.col_player.trim() !== "" ? params.col_player : "Player 2";
  const rowStrat = Array.isArray(params.row_strategies) && params.row_strategies.length >= 2 ? [String(params.row_strategies[0]), String(params.row_strategies[1])] : ["Strategy A", "Strategy B"];
  const colStrat = Array.isArray(params.col_strategies) && params.col_strategies.length >= 2 ? [String(params.col_strategies[0]), String(params.col_strategies[1])] : ["Strategy A", "Strategy B"];
  const rawPayoffs = Array.isArray(params.payoffs) ? params.payoffs : [];
  function cellPayoff(r, c) {
    const row = rawPayoffs[r];
    const cell = row && row[c];
    if (Array.isArray(cell) && typeof cell[0] === "number" && typeof cell[1] === "number") return [cell[0], cell[1]];
    return [0, 0];
  }
  const payoffs = [[cellPayoff(0, 0), cellPayoff(0, 1)], [cellPayoff(1, 0), cellPayoff(1, 1)]];
  const highlightEq = params.highlight_equilibrium !== false;

  function isRowBest(r, c) {
    const other = 1 - r;
    return payoffs[r][c][0] >= payoffs[other][c][0];
  }
  function isColBest(r, c) {
    const other = 1 - c;
    return payoffs[r][c][1] >= payoffs[r][other][1];
  }
  const nashCells = [];
  for (let r = 0; r < 2; r++) {
    for (let c = 0; c < 2; c++) {
      if (isRowBest(r, c) && isColBest(r, c)) nashCells.push([r, c]);
    }
  }

  const CX = 500, CY = 360, W = 460, H = 300;
  const X0 = CX - W / 2, Y0 = CY - H / 2;
  const CELL_W = W / 2, CELL_H = H / 2;
  const rowY = (r) => Y0 + H - CELL_H * (r + 0.5);
  const colX = (c) => X0 + CELL_W * (c + 0.5);

  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };

  const t = kit.table("grid", { x: X0, y: Y0, w: W, h: H, rows: 2, cols: 2 });
  const gridGroup = t.drawables[0];
  gridGroup.id = "grid";
  push(gridGroup);
  anchors.grid = [CX, CY];

  const FS = 32;
  for (let r = 0; r < 2; r++) {
    for (let c = 0; c < 2; c++) {
      const center = t.anchors["grid__c" + r + "_" + c] || [colX(c), rowY(r)];
      const rowVal = payoffs[r][c][0];
      const colVal = payoffs[r][c][1];
      const leftStr = String(rowVal);
      const rightStr = String(colVal);
      const sep = ", ";
      const cellText = leftStr + sep + rightStr;
      const measureW = (s) => s.length * FS * 0.52;
      const wL = measureW(leftStr), wSep = measureW(sep), wR = measureW(rightStr);
      const totalW = wL + wSep + wR;
      const leftEdge = center[0] - totalW / 2;
      const yUnderline = center[1] - FS * 0.5;
      const children = [kit.text("cell_" + r + "_" + c + "__val", center, cellText, { fontSize: FS })];
      if (isRowBest(r, c)) {
        children.push(kit.stroke("cell_" + r + "_" + c + "__ul_row", [[leftEdge, yUnderline], [leftEdge + wL, yUnderline]], { strokeWidth: 2.5, color: C.ink, ms: MS.stroke }));
      }
      if (isColBest(r, c)) {
        const rStart = leftEdge + wL + wSep;
        children.push(kit.stroke("cell_" + r + "_" + c + "__ul_col", [[rStart, yUnderline], [rStart + wR, yUnderline]], { strokeWidth: 2.5, color: C.ink, ms: MS.stroke }));
      }
      push(kit.group("cell_" + r + "_" + c, children));
      anchors["cell_" + r + "_" + c] = center;
    }
  }

  if (highlightEq) {
    nashCells.forEach((rc) => {
      const r = rc[0], c = rc[1];
      const left = X0 + CELL_W * c, right = left + CELL_W;
      const top = Y0 + H - CELL_H * r, bottom = top - CELL_H;
      const id = "nash_" + r + "_" + c;
      push(kit.area(id, [[left, bottom], [right, bottom], [right, top], [left, top]], C.region1));
      anchors[id] = [(left + right) / 2, (top + bottom) / 2];
    });
  }

  for (let r = 0; r < 2; r++) {
    const id = "row_label_" + r;
    push(kit.text(id, [X0 - 30, rowY(r)], rowStrat[r], { fontSize: 22, color: C.guide, anchor: "end" }));
    anchors[id] = [X0 - 30, rowY(r)];
  }
  for (let c = 0; c < 2; c++) {
    const id = "col_label_" + c;
    push(kit.text(id, [colX(c), Y0 + H + 40], colStrat[c], { fontSize: 22, color: C.guide }));
    anchors[id] = [colX(c), Y0 + H + 40];
  }

  push(kit.text("row_player_label", [X0 - 30, rowY(0) + 52], rowPlayer, { fontSize: 24, color: C.guide, anchor: "end" }));
  anchors.row_player_label = [X0 - 30, rowY(0) + 52];
  push(kit.text("col_player_label", [CX, Y0 + H + 85], colPlayer, { fontSize: 24, color: C.guide }));
  anchors.col_player_label = [CX, Y0 + H + 85];

  if (typeof params.title === "string" && params.title.trim() !== "") {
    push(kit.text("title", [CX, Y0 + H + 130], params.title, { fontSize: 30 }));
    anchors.title = [CX, Y0 + H + 130];
  }

  return { drawables, labels, anchors, order };
---
template: game_tree
title: Game tree (extensive form)
version: 1
kit: 2
status: ready
description: >-
  An extensive-form game tree: the first mover at the root, actions as
  labeled branches, either payoff pairs "(a, b)" at the leaves or a
  second-mover node with its own branches (up to three levels, three
  actions per node), plus optional backward-induction solving that
  highlights each player's best reply and boxes the subgame-perfect
  outcome. Defaults to the classic entry game (Out, or In followed by
  Fight/Accommodate — the non-credible-threat lesson). Choose this scene
  for ANY request about sequential games, extensive form, game trees,
  backward induction, subgame-perfect equilibrium, credible or
  non-credible threats, or first-mover advantage.
params:
  type: object
  properties:
    players:
      type: array
      minItems: 2
      maxItems: 2
      items: { type: string }
      description: "The two players' names, e.g. [\"Entrant\", \"Incumbent\"]."
    root:
      type: object
      description: "The tree: { player: 0|1, actions: [...] }. Each action is { label, payoffs: [p0, p1] } for a leaf OR { label, player, actions } for a further node. Depth max 3, max 3 actions per node. payoffs[0] always belongs to players[0]."
      properties:
        player: { type: integer, enum: [0, 1] }
        actions:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            properties:
              label: { type: string }
              payoffs:
                type: array
                items: { type: number }
                minItems: 2
                maxItems: 2
              player: { type: integer, enum: [0, 1] }
              actions: { type: array }
            required: [label]
    solve:
      type: boolean
      description: "Backward induction: highlight each node's best action and box the subgame-perfect outcome (default false)."
    title:
      type: string
element_ids:
  node_r: the root node (with its player number)
  node_<path>: an internal node, path = action indices from the root joined by _ (e.g. node_1)
  edge_<path>: the branch leading to that node/leaf, with its action label
  payoff_<path>: "the payoff pair at a leaf, e.g. payoff_1_0"
  legend: who is player 1 and 2 (a group)
  solution: the backward-induction marks — thick accent overlays on best replies plus a box around the equilibrium payoffs (a group, when solve)
  title: figure title, when set
examples:
  - request: "Draw the entry game and solve it by backward induction."
    params:
      solve: true
      title: "The entry game"
  - request: "Show a sequential game where the second mover's threat is not credible."
    params:
      players: ["Challenger", "Champion"]
      solve: true
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const playersIn = Array.isArray(params.players) ? params.players : [];
  const players = [
    typeof playersIn[0] === "string" && playersIn[0].trim() !== "" ? playersIn[0].trim() : "Entrant",
    typeof playersIn[1] === "string" && playersIn[1].trim() !== "" ? playersIn[1].trim() : "Incumbent",
  ];
  const DEFAULT_ROOT = {
    player: 0,
    actions: [
      { label: "Out", payoffs: [0, 2] },
      { label: "In", player: 1, actions: [
        { label: "Fight", payoffs: [-1, -1] },
        { label: "Accommodate", payoffs: [1, 1] },
      ] },
    ],
  };
  // Sanitize recursively: cap depth 3 and branching 3; anything malformed
  // becomes a (0, 0) leaf rather than a crash.
  const sane = (n, depth, fallbackPlayer) => {
    if (typeof n !== "object" || n === null) return { player: fallbackPlayer, actions: [{ label: "a", payoffs: [0, 0] }] };
    const player = n.player === 1 ? 1 : 0;
    const acts = (Array.isArray(n.actions) ? n.actions.slice(0, 3) : []).map((a, i) => {
      const label = typeof (a && a.label) === "string" && a.label.trim() !== "" ? a.label.trim() : "a" + (i + 1);
      if (a && Array.isArray(a.actions) && depth < 3) {
        const child = sane(a, depth + 1, 1 - player);
        return { label, node: child };
      }
      const p = Array.isArray(a && a.payoffs) ? a.payoffs : [0, 0];
      const p0 = Number.isFinite(p[0]) ? p[0] : 0;
      const p1 = Number.isFinite(p[1]) ? p[1] : 0;
      return { label, payoffs: [p0, p1] };
    });
    return { player, actions: acts.length > 0 ? acts : [{ label: "a", payoffs: [0, 0] }] };
  };
  const root = sane(typeof params.root === "object" && params.root !== null ? params.root : DEFAULT_ROOT, 1, 0);
  const doSolve = params.solve === true;

  // Positions: leaves get evenly spaced vertical slots (top-down in action
  // order), internal nodes sit at the mean of their children.
  // 210–600: the lowest leaf's payoff box clears the narration band and the
  // top one stays under the card heading (2026-09-25 example revisions).
  const X0 = 160, XSTEP = 225, YTOP = 600, YBOT = 210;
  let nLeaves = 0;
  const countLeaves = (n) => { for (const a of n.actions) { if (a.node) countLeaves(a.node); else nLeaves++; } };
  countLeaves(root);
  const yStep = nLeaves > 1 ? (YTOP - YBOT) / (nLeaves - 1) : 0;
  let slot = 0;
  const place = (n, depth) => {
    n.x = X0 + depth * XSTEP;
    const childYs = [];
    for (const a of n.actions) {
      if (a.node) { place(a.node, depth + 1); childYs.push(a.node.y); }
      else { a.x = X0 + (depth + 1) * XSTEP; a.y = nLeaves > 1 ? YTOP - slot * yStep : (YTOP + YBOT) / 2; slot++; childYs.push(a.y); }
    }
    n.y = childYs.reduce((s2, v) => s2 + v, 0) / childYs.length;
  };
  place(root, 0);

  // Backward induction: best action per node by that node's own payoff.
  const chosen = new Set();
  const value = (n, path) => {
    let best = -1, bestVal = -Infinity, vals = [];
    n.actions.forEach((a, i) => {
      const v = a.node ? value(a.node, path + "_" + i) : a.payoffs;
      vals.push(v);
      if (v[n.player] > bestVal) { bestVal = v[n.player]; best = i; }
    });
    chosen.add((path + "_" + best).replace(/^_/, ""));
    return vals[best];
  };
  let eqPath = null;
  if (doSolve) {
    value(root, "");
    // Follow the chosen edges from the root to find the equilibrium leaf.
    let n = root, path = "";
    while (n) {
      let next = null;
      n.actions.forEach((a, i) => {
        const p = (path + "_" + i).replace(/^_/, "");
        if (chosen.has(p)) { eqPath = p; next = a.node ? { n: a.node, p } : null; if (!a.node) eqPath = p; }
      });
      if (next) { n = next.n; path = next.p; } else break;
    }
  }

  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  const R = 24;
  const solutionChildren = [];

  const drawNode = (n, id) => {
    push(kit.group(id, [
      kit.stroke(id + "__c", kit.ellipse([n.x, n.y], R, R), { closed: true, fill: C.paper, strokeWidth: 3.5, ms: MS.node }),
      kit.text(id + "__p", [n.x, n.y], String(n.player + 1), { fontSize: 22, color: n.player === 0 ? C.demand : C.supply }),
    ]));
    anchors[id] = [n.x, n.y];
  };
  const walk = (n, id, path) => {
    drawNode(n, id);
    n.actions.forEach((a, i) => {
      const p = (path + "_" + i).replace(/^_/, "");
      const tx = a.node ? a.node.x : a.x, ty = a.node ? a.node.y : a.y;
      const dx = tx - n.x, dy = ty - n.y, len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;
      const from = [n.x + ux * (R + 4), n.y + uy * (R + 4)];
      const to = a.node ? [tx - ux * (R + 4), ty - uy * (R + 4)] : [tx - 10, ty];
      const eid = "edge_" + p;
      // Action label above the branch midpoint, pushed off the line.
      const mx = (from[0] + to[0]) / 2 - uy * 20, my = (from[1] + to[1]) / 2 + ux * 20 + 4;
      push(kit.group(eid, [
        kit.stroke(eid + "__l", [from, to], { strokeWidth: 3, ms: MS.connector }),
        kit.text(eid + "__t", [mx, my], a.label, { fontSize: 17 }),
      ]));
      anchors[eid] = [(from[0] + to[0]) / 2, (from[1] + to[1]) / 2];
      if (doSolve && chosen.has(p)) {
        solutionChildren.push(kit.stroke("sol__" + p, [from, to], { color: C.accent, strokeWidth: 6, opacity: 0.45, ms: MS.connector }));
      }
      if (a.node) {
        walk(a.node, "node_" + p, p);
      } else {
        const pid = "payoff_" + p;
        push(kit.text(pid, [a.x + 4, a.y], "(" + a.payoffs[0] + ", " + a.payoffs[1] + ")", { fontSize: 20, anchor: "start" }));
        anchors[pid] = [a.x + 4, a.y];
        if (doSolve && eqPath === p) {
          // Box the equilibrium payoffs with real clearance — the lint pads
          // text boxes, so a snug frame reads as "text sits on stroke".
          const tw = ("(" + a.payoffs[0] + ", " + a.payoffs[1] + ")").length * 11;
          solutionChildren.push(kit.stroke("sol__box", [[a.x - 14, a.y - 32], [a.x + tw + 18, a.y - 32], [a.x + tw + 18, a.y + 32], [a.x - 14, a.y + 32]], { closed: true, color: C.accent, strokeWidth: 2.5, ms: MS.stroke }));
        }
      }
    });
  };
  walk(root, "node_r", "");

  push(kit.group("legend", [
    kit.text("legend__1", [150, 640], "1 = " + players[0], { fontSize: 18, anchor: "start", color: C.demand }),
    kit.text("legend__2", [150, 614], "2 = " + players[1], { fontSize: 18, anchor: "start", color: C.supply }),
  ]));
  anchors.legend = [150, 640];

  if (doSolve && solutionChildren.length > 0) {
    push(kit.group("solution", solutionChildren));
    anchors.solution = anchors["node_r"];
  }

  if (typeof params.title === "string" && params.title.trim() !== "") {
    push(kit.text("title", [620, 700], params.title, { fontSize: 28 }));
  }
  return { drawables, labels, anchors, order };
