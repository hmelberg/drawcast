pack: games
title: Games
description: Chess positions and replayed lines from FEN and SAN — boards, move arrows, square highlights.
---
template: chess_board
title: Chess board (FEN / SAN)
version: 1
kit: 2
status: ready
engines: [chess]
interactions: [chess]
description: >-
  A chess board rendered from a FEN position and, optionally, a line of
  moves in Standard Algebraic Notation (SAN) played out via the chess
  engine: a green-and-cream 8x8 board with drawn Staunton piece
  silhouettes, an
  arrow along the most recently played move, optional static annotation
  arrows and highlighted squares, and file/rank coordinates. Choose this
  scene for ANY request about a chess position, a FEN diagram, a chess
  opening, a chess line, a chess puzzle or tactic, a checkmate, or replaying
  a sequence of chess moves. `plies_shown` is NUMERIC and ANIMATABLE:
  animate it from 0 to moves.length (write the starting value, e.g.
  `plies_shown: 0`, explicitly in params) to replay the line move by move,
  narrating each beat, with the newest move drawn as an arrow as it lands —
  each animated ply glides the moving piece (and, for a capture, fades the
  captured one) rather than teleporting it.
params:
  type: object
  properties:
    fen:
      type: string
      description: "Starting position in FEN notation. Default: the standard starting position."
    moves:
      type: array
      items: { type: string }
      description: "A line of moves in Standard Algebraic Notation (SAN), played from `fen` (or the start position) — e.g. [\"e4\", \"e5\", \"Nf3\"]. An illegal move throws, naming the offending SAN; a malformed fen throws too."
    plies_shown:
      type: number
      description: "How many plies of `moves` to show, as a NUMERIC count — the integer part selects the position (floored); default all of them (moves.length). 0 shows the position at `fen` before any move. Clamped to [0, moves.length]. A fractional value glides the next ply's piece (and a captured piece's fade) into place — exactly what `animate` produces as it eases plies_shown from one integer to the next, so animating this across an `animate` command replays the line move by move as a glide, not a teleport."
    arrows:
      type: array
      items:
        type: object
        properties:
          from: { type: string, description: "Algebraic square, e.g. \"e2\"." }
          to: { type: string, description: "Algebraic square, e.g. \"e4\"." }
        required: [from, to]
      description: "Static annotation arrows (threats, plans) drawn in accent color, independent of the played line."
    highlights:
      type: array
      items: { type: string }
      description: "Algebraic squares to shade, e.g. [\"d5\", \"e4\"] — outposts, weak squares, key files."
    flip:
      type: boolean
      description: "Show the board from Black's point of view (rank 1 at top, files mirrored). Default false (White's view)."
    coords:
      type: boolean
      description: "Show file letters (a-h) and rank numbers (1-8) around the board. Default true."
element_ids:
  board: the 8x8 board — its light-square ground plus the grid lines
  sq_<file><rank>: a dark square's fill (one per dark square, e.g. sq_a1); the light squares are part of `board`
  piece_<file><rank>: the drawn piece on that square in the currently shown position — a filled silhouette with an ink outline — present for every square occupied in the starting position or ever visited by `moves` (including a castling move's rook squares) (an empty group on a touched-but-currently-vacant square, so the same id exists at every plies_shown and can be animated). At a fractional plies_shown mid-`animate`, the departing square's id carries the moving piece gliding toward its destination (a captured piece, if any, stays on the destination square's id and fades out instead)
  move_arrow: an arrow along the most recently played move currently shown (demand color, over a paper casing so it separates from either square color); present whenever `moves` is non-empty, collapsed to nothing before the first ply is shown
  arrow_<i>: a static annotation arrow from arrows[i] (accent color, over the same paper casing)
  hl_<sq>: a marked square from highlights[i] — a bright wash inside an ink frame, so it reads on a dark and a light square alike
  coord_<k>: a file letter (a-h) or rank number (1-8) around the board, when coords is true
examples:
  - request: "Draw the starting chess position."
    params: {}
  - request: "Show the opening 1. e4 e5 2. Nf3 Nc6 3. Bb5, with the last move as an arrow."
    params: { moves: ["e4", "e5", "Nf3", "Nc6", "Bb5"] }
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;

  // Board geometry: a 620x620 board centered on the canvas (grown from the
  // original 520x520 — the board should fill most of the 1000x750 frame,
  // not float in a sea of margin). X0/Y0 stay derived from BOARD so the
  // board is always centered whatever size it is; 65 logical units of
  // margin above and below is still comfortably enough for the
  // coordinate labels (well inside the canvas, never near y=0/y=750).
  const BOARD = 620;
  const X0 = (kit.CANVAS.w - BOARD) / 2;
  const Y0 = (kit.CANVAS.h - BOARD) / 2;
  const CELL = BOARD / 8;

  // The board itself — grid, ground, dark squares, coordinate labels, and the
  // starting piece array — is scaffold: it establishes the setting but
  // isn't what the narration is about, so it should appear near-instantly.
  // Coord labels are text, and text is always instant (kit.text has no
  // `ms`/`instant` knob at all — see kit.ts). Everything else here is strokes
  // and area fills, which default to SKETCH_MS.stroke/region (1400/1300ms);
  // all of them — the pieces' own fills and outlines included — are pinned to
  // the smallest named budget instead, so a 32-piece opening array still sets
  // itself up briskly. The move arrow keeps its normal pace (MS.connector)
  // below — THAT is the part the narration is about.
  const SCAFFOLD_MS = MS.dot;

  const flip = params.flip === true;
  const showCoords = params.coords !== false;
  const fen = typeof params.fen === "string" && params.fen.trim() !== "" ? params.fen : undefined;
  const movesRaw = Array.isArray(params.moves) ? params.moves.map(String) : [];

  // Play the WHOLE line up front. This both validates every SAN (an
  // illegal move — or a malformed fen — throws naming the offending
  // move/fen; that throw propagates out of this layout function, and
  // layoutSpec's own catch turns it into the standard fall-through
  // warning) and tells us every square the line will EVER touch,
  // independent of plies_shown — needed below so `animate`-ing
  // plies_shown never needs an element id that did not already exist.
  const plies = movesRaw.length > 0 ? engines.chess.replay(fen, movesRaw) : [];
  const maxPlies = plies.length;
  const rawShown = typeof params.plies_shown === "number" && Number.isFinite(params.plies_shown) ? params.plies_shown : maxPlies;
  // Fractional-ply glide: clamp FIRST, then floor — equivalent to the old
  // clamp(floor(rawShown)) for every real rawShown (maxPlies is always an
  // integer), but it also gives us `plyT`, the fraction left over after
  // flooring (named plyT, not t, because `t` below is already the board's
  // own kit.table() result). `plyT` is 0 for every integer plies_shown AND
  // once clamped to maxPlies — the byte-identical-to-before regression pin
  // depends on that, since plyT===0 below always falls through to the plain
  // per-square lookup, never the glide/fade/lift branch. `animate`'s own
  // smoothstep easing on the plies_shown PARAM itself (src/render/player.ts)
  // is what shapes how `plyT` advances over wall-clock time — this layout
  // only ever sees the already-eased value, so `plyT` is used as a plain
  // linear lerp fraction below, with no second easing layered on top.
  const clampedRaw = Math.max(0, Math.min(maxPlies, rawShown));
  const shown = Math.floor(clampedRaw);
  const plyT = clampedRaw - shown;

  const positionFen = shown > 0 ? plies[shown - 1].fenAfter : fen;
  const board = engines.chess.board(positionFen); // also validates a bare fen with no moves.
  const startBoard = movesRaw.length > 0 ? engines.chess.board(fen) : board;

  // Square <-> board-array mapping, verified both ways:
  //
  //   The engine's board(): row 0 = rank 8, row 7 = rank 1; col 0 = file a,
  //   col 7 = file h. kit.table: row 0 = TOP, row 7 = BOTTOM (y-up); col 0 =
  //   LEFT, col 7 = RIGHT.
  //
  //   Not flipped (White's view, the default): the engine's top-to-bottom
  //   order (rank 8 -> rank 1) already matches the table's top-to-bottom
  //   order, and its left-to-right order (file a -> file h) already
  //   matches the table's left-to-right order — table row r / col c IS
  //   board row r / col c, the identity map.
  //
  //   Flipped (Black's view): the WHOLE board turns 180 degrees — rank 1
  //   sits at the top, file h sits on the left — so table row r / col c is
  //   board row (7 - r) / col (7 - c). boardRC below is its own inverse
  //   either way (applying it twice cancels), which is used to go from a
  //   square back to a table cell too.
  //
  //   A square's file/rank name depends only on its OWN board row/col,
  //   never on orientation: file = "abcdefgh"[boardCol], rank = 8 - boardRow.
  //
  //   Trace e2 (file e = col 4, rank 2 -> boardRow 6, boardCol 4 — row 6 is
  //   White's pawn rank, per the engine's own board() contract):
  //     not flipped: table r=6 (2nd row from the BOTTOM), c=4 (5th col from
  //       the LEFT) — e2 sits low and right-of-center: exactly where
  //       White's e-pawn starts when White is at the bottom. Correct.
  //     flipped:      r = 7-6 = 1 (2nd row from the TOP), c = 7-4 = 3 (4th
  //       col from the LEFT) — e2 sits high and left-of-center: exactly
  //       where White's e-pawn starts once the board is spun for Black's
  //       view. Correct.
  function boardRC(r, c) { return flip ? [7 - r, 7 - c] : [r, c]; }
  function fileOf(bc) { return "abcdefgh"[bc]; }
  function rankOf(br) { return 8 - br; }
  function squareId(br, bc) { return fileOf(bc) + rankOf(br); }
  function validSquare(sq) { return typeof sq === "string" && /^[a-h][1-8]$/.test(sq); }
  function rcOfSquare(sq) {
    const bc = "abcdefgh".indexOf(sq[0]);
    const br = 8 - Number(sq[1]);
    return boardRC(br, bc); // boardRC is its own inverse.
  }

  // Castling detection, for the fractional-ply glide below: chess.js's own
  // `ply.from`/`ply.to` record only the KING's squares for "O-O"/"O-O-O"
  // (verbose move objects don't surface the rook's squares directly), so the
  // rook's own from/to are derived here from the king's rank (= the SAN's
  // own color/side — rank "1" is White's back rank, "8" is Black's) and
  // whether it's king- or queenside. Detected by SAN rather than any
  // engine flag, per the plan: chess.js suffixes a trailing "+"/"#" for
  // check/mate, so that's stripped first. Returns null for every other move.
  function castleRook(ply) {
    const san = ply.san.replace(/[+#]/g, "");
    if (san !== "O-O" && san !== "O-O-O") return null;
    const rank = ply.from[1];
    const kingside = san === "O-O";
    return { from: (kingside ? "h" : "a") + rank, to: (kingside ? "f" : "d") + rank };
  }

  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };

  const t = kit.table("board", { x: X0, y: Y0, w: BOARD, h: BOARD, rows: 8, cols: 8, ms: SCAFFOLD_MS });
  const gridGroup = t.drawables[0];

  // The `board` element carries BOTH the light ground and the grid lines.
  //
  // A chess.com board paints two square colors, not one — the light squares
  // are a warm cream, not the bare page. The obvious encoding (a second
  // `sq_<light>` element per light square) would silently break every scene
  // that already exists: a draw list naming only the 32 DARK squares (the
  // bundled Scholar's Mate does exactly that) would leave 32 brand-new
  // elements undrawn, i.e. invisible. One ground rectangle inside `board`
  // instead gives the light squares their color the moment the board itself
  // is drawn, and leaves the element-id surface untouched.
  //
  // Both square fills are `precise`: an exact, full-strength shape in BOTH
  // render styles. A hachured wash over a 620px ground is a field of scribble
  // rather than a board, and the hand-drawn character of the figure is carried
  // by the grid lines, the piece outlines, the arrows and the coordinate
  // lettering — all of which still sketch.
  const ground = kit.area(
    "board__ground",
    [[X0, Y0], [X0 + BOARD, Y0], [X0 + BOARD, Y0 + BOARD], [X0, Y0 + BOARD]],
    C.boardLight,
    { precise: true, ms: SCAFFOLD_MS },
  );
  push(kit.group("board", [ground, ...gridGroup.children]));
  anchors.board = [X0 + BOARD / 2, Y0 + BOARD / 2];

  function cellPos(r, c) { return t.anchors["board__c" + r + "_" + c]; }
  function squarePos(sq) { const [r, c] = rcOfSquare(sq); return cellPos(r, c); }

  // Dark squares: (r + c) odd is dark on EITHER orientation — the 180-degree
  // flip subtracts both r and c from 7 (an odd number), so the sum's parity
  // is unchanged, and it is computed directly on table coordinates.
  //
  // Color: C.boardDark over C.boardLight — chess.com's own pair, warmed
  // toward this app's paper-toned palette (see COLORS in src/layout/model.ts
  // for the exact derivation). Painted at full opacity, like a real board:
  // the previous 0.5-opacity green let the page show through and read as a
  // shaded diagram rather than a board. demand (the move arrow), region1
  // (highlights) and accent (annotation arrows) are all non-green and stay
  // clearly legible on either square.
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      if ((r + c) % 2 !== 1) continue;
      const [br, bc] = boardRC(r, c);
      const id = "sq_" + squareId(br, bc);
      const [cx, cy] = cellPos(r, c);
      const h = CELL / 2;
      push(kit.area(id, [[cx - h, cy - h], [cx + h, cy - h], [cx + h, cy + h], [cx - h, cy + h]], C.boardDark, { precise: true, ms: SCAFFOLD_MS }));
      anchors[id] = [cx, cy];
    }
  }

  // Highlighted squares (deduped, invalid ones dropped): a bright wash plus
  // an ink frame, BOTH as exact areas so a piece standing on the square paints
  // straight over them (areas share one z layer and pieces come later in
  // `order`).
  //
  // Why not just a yellow wash. The shipped version — region1 at 0.5 over the
  // square — separated from the plain square by only 1.39:1 (dark) and 1.20:1
  // (light) in WCAG relative luminance. That difference is carried almost
  // entirely by HUE, yellow against green: the classic pair that collapses on
  // a dim or low-gamut screen and for a red-green colorblind viewer.
  //
  // And no fill alone can fix the light square. Raising the wash's lightness
  // helps the dark square (C.boardHighlight at full opacity is 2.28:1 against
  // boardDark, comfortably past 1.8:1) but boardLight is already at luminance
  // 0.845 — even PURE WHITE only reaches 1.17:1 against it. Going darker
  // instead needs luminance <= 0.135 to clear 1.8:1 against BOTH squares, and
  // a fill that dark would bury the ink-filled black pieces standing on it
  // (they would drop to ~2:1). Hence the frame: ink around the square's edge
  // is 9.88:1 against boardLight and 3.67:1 against boardDark, so the marked
  // square is separated by luminance on either color, by construction. It is
  // drawn as ONE area with the inner square punched out as a hole, which
  // `kit.area` renders as an exact evenodd ring.
  const HL_FRAME = 5;
  const seenHl = new Set();
  const highlightSquares = (Array.isArray(params.highlights) ? params.highlights : []).filter(
    (s) => validSquare(s) && !seenHl.has(s) && seenHl.add(s),
  );
  highlightSquares.forEach((sq) => {
    const [r, c] = rcOfSquare(sq);
    const [cx, cy] = cellPos(r, c);
    const id = "hl_" + sq;
    const box = (m) => [[cx - m, cy - m], [cx + m, cy - m], [cx + m, cy + m], [cx - m, cy + m]];
    push(kit.group(id, [
      kit.area(id + "__fill", box(CELL / 2), C.boardHighlight, { precise: true, ms: SCAFFOLD_MS }),
      kit.area(id + "__frame", box(CELL / 2), C.ink, { holes: [box(CELL / 2 - HL_FRAME)], ms: SCAFFOLD_MS }),
    ]));
    anchors[id] = [cx, cy];
  });

  // ---- Piece silhouettes ---------------------------------------------------
  //
  // Pieces get a STABLE id per square the game ever touches — every square
  // occupied in the starting position, plus every ply's from/to square — so
  // the same id exists at every plies_shown value (an EMPTY group on a
  // touched-but-currently-empty square) and `animate` can move a piece onto a
  // square that started empty instead of needing a brand new element to appear
  // mid-animation.
  //
  // Pieces are DRAWN shapes, not Unicode glyphs (♔♕♖♗♘♙ / ♚♛♜♝♞♟). The glyphs
  // were thin, depended on whatever chess font the reader happened to have,
  // and — the reason they finally had to go — could only be centered through
  // SVG's `dominant-baseline: "central"`, a font-METRICS line with no fixed
  // relation to where a glyph's ink sits. That cost this template two rounds
  // of hand-measured y-nudges in opposite directions. A drawn silhouette has
  // a bounding box of its own, so "centered in the square" is arithmetic.
  //
  // Data convention (the STAMPS convention in kit.ts): a unit box, x/y in
  // [-1, 1], y-up, every piece standing on its base plate at y = -1. These
  // are FILLED rings rather than stroke stamps, so they live here as
  // template-local data instead of in the shared stamp library.
  //
  // Four of the six pieces are left-right symmetric, so they are authored as
  // a RIGHT-HAND PROFILE — starting ON THE AXIS (x = 0) at the silhouette's
  // topmost axis point, then down the right side to the base's right corner —
  // and `sym` mirrors it into a closed ring. Symmetry is then exact by
  // construction, and each table is half the size to read. The KNIGHT (which
  // faces left) and the BISHOP (whose slit is a diagonal, not a center notch)
  // are full rings.
  //
  //     sym(profile) = profile ++ reverse(profile without the axis point) mirrored
  //
  // The axis point is not always the apex: the queen's coronet has FOUR ball
  // tips, not a center one, so her profile starts at the FLOOR of the center V
  // (x = 0, y = 0.27) and climbs the inner point before coming back down. All
  // `sym` needs is that the first point sits on the axis; the ring closes
  // across the base between the last point and its mirror.
  //
  // ---- Where these numbers come from --------------------------------------
  // Not eyeballed. Every table below was traced off the reference set the user
  // supplied (a chess.com-style board, one piece per 100px cell): the piece
  // pixels were separated from the square by CHROMA (both board tones are
  // green/cream and so chromatic; every piece pixel — white fill, gray
  // shading, dark outline, black fill — is achromatic), the resulting mask's
  // boundary was walked with a Moore neighbour trace, and the contour was
  // simplified with Douglas-Peucker to the 22-26 profile points (43-51 ring
  // points) below. The symmetric four were mirror-ORed about their own axis
  // first, so the halves agree before `sym` ever runs — the UNION, not the
  // intersection: ANDing erodes by the sub-pixel disagreement between the two
  // sides and visibly flattened the pawn's ball into a vertical chord.
  // Coordinates are then exactly this unit box: the trace's own bounding box
  // mapped to y in [-1, 1], x scaled by the SAME factor (so W/H is preserved)
  // about the bounding box's center.
  //
  // What the reference's proportions actually are — the thing this data is
  // for — measured off that same trace. W and H are fractions of one CELL;
  // every landmark is in this unit box, so a half-width of 0.48 means 0.48 of
  // the piece's own half-height:
  //
  //     piece    W      H      W/H     silhouette landmarks
  //     pawn    0.53   0.68   0.78     ball r 0.41 centred y 0.60; collar
  //                                    half-width 0.48, y 0.27..0.00; skirt
  //                                    flaring 0.24 -> 0.78 by y = -1
  //     rook    0.58   0.73   0.80     3 merlons, notch floor y 0.72 (a seventh
  //                                    of the height); head half-width 0.68;
  //                                    shaft waist 0.49; plinth 0.79
  //     knight  0.68   0.80   0.85     muzzle front x -0.85, chin y -0.22,
  //                                    throat corner (0.04, 0.04), one ear at
  //                                    y 1.00, plinth y -0.57..-1, half 0.85
  //     bishop  0.58   0.81   0.72     finial r 0.19 centred (-0.03, 0.82);
  //                                    mitre widest 0.59 at y -0.05; slit y
  //                                    0.62 down to -0.05, ~0.17 wide; plinth 0.71
  //     queen   0.79   0.80   0.99     4 ball tips: inner span x 0.08..0.51,
  //                                    topping out at y 1.00; outer span
  //                                    x 0.68..0.99 over y 0.14..0.59; centre V
  //                                    floor y 0.27; plinth 0.73
  //     king    0.77   0.82   0.94     cross: upright half 0.12 to y 1.00, arms
  //                                    out to 0.30 over y 0.83..0.56; crown
  //                                    widest 0.94 at y 0.04; plinth 0.72
  //
  // The reference's own HEIGHT ladder (king 1, bishop .99, knight/queen .98,
  // rook .89, pawn .83) is deliberately NOT adopted: `h` below stays on this
  // template's older, wider-spread ladder, because the height ladder is also
  // how a test reads a piece's KIND back off a render, and .99-vs-.98 is under
  // a pixel apart at this size. Only the CONTOURS were retraced.
  //
  // `marks` are detail strokes drawn ON TOP of the fill in the CONTRASTING
  // color (ink on a white piece, paper on a black one) — the knight's eye, the
  // king's two crown cut-outs, and the plinth seam that gives five of the six
  // pieces the reference's chunky two-step base. They are not holes: in the
  // reference these ARE holes (the square shows through the king's crown), but
  // a hole vanishes whenever the square and the piece are close in value (a
  // white king on a light square), whereas a contrasting stroke reads on every
  // combination. The two features the reference carries as real openings ONTO
  // the background — the rook's crenellation notches and the bishop's slit —
  // are part of the RING instead, so they stay openings.
  const sym = (profile) => [...profile, ...profile.slice(1).reverse().map(([x, y]) => [-x, y])];

  /** A plinth seam: the shallow dome the reference draws where a piece's body meets its base plate. */
  const seam = (halfWidth, edgeY, crownY) => [[-halfWidth, edgeY], [0, crownY], [halfWidth, edgeY]];

  const PIECES = {
    // Pawn: a big ball, a flared collar, then a skirt that sweeps out to a
    // base almost twice the ball's width. Shortest piece on the board, and the
    // only one whose base is the skirt itself — no plinth, so no plinth seam.
    // Its one mark is the ball's own underside: in the reference the ball is a
    // FULL circle overlapping the collar, and the silhouette alone (which sees
    // only their union) loses the ball entirely — the collar's cusps read as a
    // waist in a peanut. The arc closes the circle back up.
    p: {
      h: 0.76,
      ring: sym([
        [0.00, 1.00], [0.14, 0.98], [0.26, 0.92], [0.35, 0.82], [0.40, 0.71],            // ball: a true circle, r 0.41 about y 0.60
        [0.41, 0.60], [0.39, 0.48], [0.35, 0.39], [0.30, 0.31],
        [0.34, 0.27], [0.48, 0.18], [0.48, 0.07], [0.42, 0.00],                          // collar: a flared brim, flat-bottomed
        [0.27, -0.01], [0.24, -0.06],                                                     // the shelf down onto the skirt
        [0.26, -0.13], [0.31, -0.23], [0.40, -0.35], [0.53, -0.45],                       // skirt, concave then convex
        [0.66, -0.56], [0.74, -0.68], [0.78, -0.80], [0.78, -1.00],
      ]),
      marks: [[[-0.30, 0.31], [-0.18, 0.26], [0.00, 0.25], [0.18, 0.26], [0.30, 0.31]]], // the ball's underside, where the collar crosses it
    },
    // Rook: a crenellated tower. Three merlons — the center one straddles the
    // axis, so the profile starts on top of it — over a head that is the
    // WIDEST part of the piece, then a waisted shaft that flares gently into
    // a plinth. The notches are cut into the ring itself (they open onto the
    // background in the reference too).
    r: {
      h: 0.84,
      ring: sym([
        [0.00, 1.00], [0.20, 1.00], [0.21, 0.75], [0.25, 0.72], [0.29, 0.72], [0.33, 0.77], // centre merlon + notch
        [0.35, 0.85], [0.38, 0.94], [0.60, 0.94], [0.67, 0.90],                             // outer merlon, rounded shoulder
        [0.68, 0.67], [0.65, 0.55], [0.63, 0.43], [0.53, 0.34], [0.49, 0.31],               // head, waisting into the shaft
        [0.49, 0.14], [0.51, -0.05], [0.54, -0.25], [0.57, -0.42], [0.57, -0.53],           // shaft, flaring downward
        [0.64, -0.58], [0.72, -0.62], [0.78, -0.71], [0.79, -1.00],                         // plinth
      ]),
      marks: [
        seam(0.42, 0.32, 0.39),   // the battlement's base line, under the merlons
        seam(0.62, -0.58, -0.53), // the plinth seam
      ],
    },
    // Knight: a horse head facing LEFT, on its own plinth — a full ring, and
    // the piece that carries the most shape information. What makes it read as
    // a horse rather than a blob, in the reference as much as here: a single
    // ear at the very top, a long straight NOSE BRIDGE falling away to the
    // left, a blunt muzzle whose front is the leftmost point of the whole
    // piece, a flat chin, and — the load-bearing one — a sharp concave THROAT
    // corner at (0.04, 0.04) where the jaw meets the front of the neck. The
    // back of the head is one big convex sweep with no mane zigzag at all.
    n: {
      h: 0.88,
      ring: [
        [-0.27, 1.00], [-0.16, 1.00],                                                    // the ear
        [0.01, 0.82], [0.16, 0.79], [0.28, 0.76], [0.38, 0.71], [0.50, 0.61], [0.60, 0.48], // crest
        [0.68, 0.34], [0.73, 0.20], [0.76, 0.04], [0.77, -0.10], [0.75, -0.24],          // back of the head
        [0.72, -0.36], [0.68, -0.50], [0.67, -0.57],                                     // back of the neck
        [0.74, -0.62], [0.82, -0.71], [0.84, -0.80], [0.85, -1.00],                      // plinth, right side
        [-0.62, -1.00], [-0.62, -0.77], [-0.57, -0.67], [-0.48, -0.59], [-0.42, -0.53],  // plinth, left side
        [-0.33, -0.38], [-0.20, -0.22], [-0.06, -0.07], [0.04, 0.04],                    // front of the neck, up to the throat
        [0.02, 0.09], [-0.06, 0.05], [-0.17, -0.03], [-0.28, -0.06], [-0.36, -0.07],     // the jaw, running forward
        [-0.45, -0.17], [-0.49, -0.22], [-0.65, -0.22], [-0.73, -0.19],                  // chin, flat underside of the muzzle
        [-0.81, -0.12], [-0.85, -0.02], [-0.84, 0.05],                                   // muzzle front — the leftmost point
        [-0.76, 0.18], [-0.64, 0.34], [-0.55, 0.48], [-0.49, 0.67], [-0.34, 0.82], [-0.33, 0.95], // nose bridge, forehead, ear front (near-vertical)
      ],
      marks: [
        [[-0.26, 0.50], [-0.22, 0.55], [-0.17, 0.50], [-0.22, 0.45], [-0.26, 0.50]],     // eye — small enough that the stroke fills it in
        [[-0.42, -0.53], [0.14, -0.55], [0.74, -0.62]],                                  // plinth seam
      ],
    },
    // Bishop: a rounded onion mitre with a ball finial, split by a long
    // DIAGONAL slit — the slit runs from the finial's left shoulder down and
    // slightly left to the middle of the body, which is what makes this a full
    // ring rather than a mirrored profile. The slit is part of the ring, so it
    // opens onto the square exactly as the reference's does; at this size its
    // two outline strokes very nearly meet, which is why it reads as a dark
    // gash rather than a gap.
    b: {
      h: 0.92,
      ring: [
        [-0.09, 1.00], [0.04, 1.00], [0.11, 0.96], [0.16, 0.88], [0.15, 0.78], [0.09, 0.70], [0.04, 0.60], // finial ball
        [0.01, 0.52], [-0.02, 0.42], [-0.05, 0.28], [-0.08, 0.12], [-0.09, -0.02], [-0.03, -0.06], [0.05, -0.03], // slit: left wall, floor
        [0.09, 0.10], [0.11, 0.26], [0.14, 0.42], [0.19, 0.54], [0.24, 0.63],                              // slit: right wall, up to the lip
        [0.32, 0.53], [0.44, 0.38], [0.51, 0.25], [0.56, 0.11], [0.58, -0.04], [0.56, -0.20],              // mitre, right flank
        [0.51, -0.38], [0.44, -0.50], [0.41, -0.57],
        [0.50, -0.61], [0.62, -0.66], [0.70, -0.74], [0.71, -0.84], [0.71, -1.00],                         // plinth, right
        [-0.71, -1.00], [-0.71, -0.84], [-0.69, -0.72], [-0.62, -0.65], [-0.50, -0.61], [-0.41, -0.57],    // plinth, left
        [-0.46, -0.48], [-0.53, -0.36], [-0.58, -0.20], [-0.59, -0.02], [-0.57, 0.14], [-0.52, 0.27],      // mitre, left flank
        [-0.45, 0.39], [-0.33, 0.54], [-0.19, 0.70], [-0.21, 0.81], [-0.20, 0.91], [-0.14, 0.97],          // left shoulder, stepping in under the finial
      ],
      marks: [seam(0.49, -0.60, -0.55)],
    },
    // Queen: a scalloped coronet of FOUR ball tips — two high and inboard, two
    // lower and flung wide — over a body that flares straight down to the
    // plinth. There is no center point, so the profile starts at the floor of
    // the center V (on the axis) and climbs the inner point first. The widest
    // piece on the board after the king.
    q: {
      h: 0.94,
      ring: sym([
        [0.00, 0.27], [0.13, 0.59], [0.08, 0.72], [0.08, 0.88],                                    // out of the centre V, up a thin neck
        [0.15, 0.98], [0.28, 1.00], [0.44, 0.96], [0.51, 0.84], [0.48, 0.70], [0.38, 0.57],        // inner ball
        [0.40, 0.40], [0.42, 0.15],                                                                // down the narrow slot between the points
        [0.58, 0.31], [0.56, 0.44], [0.62, 0.52],                                                  // and up the outer point, itself a narrow spike
        [0.70, 0.59], [0.86, 0.59], [0.96, 0.51], [0.99, 0.36], [0.90, 0.20],                      // outer ball
        [0.76, 0.06], [0.65, -0.20], [0.53, -0.53],                                                // the flank
        [0.61, -0.59], [0.71, -0.70], [0.73, -1.00],                                               // plinth
      ]),
      marks: [seam(0.58, -0.59, -0.53)],
    },
    // King: a cross on top (its own flat top straddles the axis), then a squat
    // crown that flares wider than anything else on the board before pulling
    // sharply in to the plinth. The crown's two cut-outs are the reference's
    // most recognisable feature and are carried as closed detail strokes.
    k: {
      h: 1,
      ring: sym([
        [0.00, 1.00], [0.12, 1.00], [0.12, 0.88],                              // cross, upright
        [0.17, 0.83], [0.30, 0.83], [0.30, 0.56], [0.17, 0.56],                // cross, right arm
        [0.16, 0.51], [0.24, 0.46],                                            // cross, foot into the crown
        [0.34, 0.48], [0.64, 0.48], [0.74, 0.43], [0.81, 0.38], [0.87, 0.31],  // crown, flat top rounding into the shoulder
        [0.92, 0.21], [0.94, 0.08], [0.93, -0.07], [0.89, -0.19], [0.81, -0.29], // crown, widest flank
        [0.68, -0.42], [0.54, -0.58],                                          // in to the waist
        [0.60, -0.64], [0.69, -0.74], [0.72, -0.85], [0.72, -1.00],            // plinth
      ]),
      marks: [
        [[-0.23, 0.03], [-0.30, 0.09], [-0.44, 0.09], [-0.49, 0.02], [-0.31, -0.24], [-0.24, -0.26], [-0.22, -0.16], [-0.23, 0.03]], // crown cut-out, left
        [[0.23, 0.03], [0.30, 0.09], [0.44, 0.09], [0.49, 0.02], [0.31, -0.24], [0.24, -0.26], [0.22, -0.16], [0.23, 0.03]],         // crown cut-out, right
        seam(0.59, -0.64, -0.58),
      ],
    },
  };

  // Sizing: the KING — the tallest piece — is 80% of the cell (77.5 * 0.8 =
  // 62px), and every other kind is a fixed fraction of that, roughly the
  // proportions of a real set (a pawn is not a king's height). Bases stay
  // within a few px of each other across the back rank, so a rank still reads
  // as one row, and pawns — the shortest — never stand next to a king.
  const KING_H = CELL * 0.8;

  // Piece bounding boxes, computed ONCE from the unit-box data: a piece is
  // placed by its own geometry, with no font metrics anywhere in the chain.
  for (const def of Object.values(PIECES)) {
    const xs = def.ring.map(([x]) => x), ys = def.ring.map(([, y]) => y);
    def.box = { cx: (Math.min(...xs) + Math.max(...xs)) / 2, cy: (Math.min(...ys) + Math.max(...ys)) / 2, h: Math.max(...ys) - Math.min(...ys) };
  }

  /**
   * One piece's drawables, as a kit.group carrying the square's own id, so
   * every draw list, glide, highlight and command keeps addressing
   * `piece_<square>` exactly as it did when a piece was a single text.
   * `at` is the CENTER the silhouette's bounding box lands on; `lift` scales
   * the shape about that center (the mid-glide hop); `opacity` fades the whole
   * piece (a captured piece dissolving under the piece that takes it).
   *
   * The outline is 2.6px, up from 2.2 with the retraced shapes. The reference
   * set draws a ~3px outline on a ~80px-tall piece (3.7%); ours are 47-62px
   * tall, so a proportional match would be 1.7-2.3px — but our pieces are also
   * ~10% smaller in their cells than the reference's, and at 2.2 the white
   * pieces read thin against boardLight. 2.6 lands the king at 4.2% and the
   * pawn at 5.5%, which is the reference's bold weight rather than its exact
   * ratio. Checked against renders of the full start position at both widths.
   */
  function pieceGroup(id, cell, at, lift, opacity) {
    const def = PIECES[cell.piece];
    const s = (KING_H * def.h * lift) / def.box.h;
    const place = (pts) => pts.map(([x, y]) => [at[0] + (x - def.box.cx) * s, at[1] + (y - def.box.cy) * s]);
    const white = cell.color === "w";
    const fade = opacity !== undefined ? { opacity } : {};
    const ring = place(def.ring);
    const children = [
      kit.area(id + "__fill", ring, white ? C.paper : C.ink, { precise: true, ms: SCAFFOLD_MS, ...fade }),
      kit.stroke(id + "__edge", ring, { closed: true, color: C.ink, strokeWidth: 2.6, ms: SCAFFOLD_MS, ...fade }),
    ];
    def.marks.forEach((mark, i) => {
      children.push(kit.stroke(id + "__mark" + i, place(mark), { color: white ? C.ink : C.paper, strokeWidth: 1.8, ms: SCAFFOLD_MS, ...fade }));
    });
    return kit.group(id, children);
  }

  const touched = new Set();
  for (let br = 0; br < 8; br++) {
    for (let bc = 0; bc < 8; bc++) {
      if (startBoard[br][bc]) touched.add(squareId(br, bc));
    }
  }
  for (const ply of plies) {
    touched.add(ply.from);
    touched.add(ply.to);
    // A castling ply's `from`/`to` are only the king's squares (see
    // castleRook above) — the rook's own from/to need adding explicitly so
    // their ids exist even on a custom FEN where the rook didn't start on
    // its usual corner (the standard start already covers a1/h1/a8/h8 via
    // startBoard above, but not necessarily the RESULT squares d1/f1/d8/f8).
    const rook = castleRook(ply);
    if (rook) { touched.add(rook.from); touched.add(rook.to); }
  }

  // Fractional-ply glide (plyT in (0,1), see the `plyT` derivation above):
  // the ply about to land — plies[shown], i.e. ply number shown+1 — draws as
  // a glide instead of a teleport. Two small per-square override maps, built
  // once per render and consulted in the per-square loop below:
  //   glide: sq -> { toSq, lift } for a square whose piece is IN FLIGHT.
  //     The mover keeps its DEPARTURE square's id (piece_<from>) for the
  //     whole tween and slides toward the destination center in a straight
  //     line — knights included, so a knight's glide cuts across the board
  //     rather than tracing an L; that reads fine at this scale and keeps
  //     one scheme for every piece. Castling adds a SECOND entry, for the
  //     rook, computed the same way. At plyT===0 this map is never even
  //     built (see below), which is what keeps every integer plies_shown
  //     byte-identical to before this feature existed.
  //   fade: sq -> opacity for a square whose PRE-move occupant should fade
  //     out rather than vanish — only set for a real capture, at the
  //     destination square (`to`). Applied to the whole piece group: the
  //     filled silhouette AND its outline and detail strokes all carry the
  //     same opacity, so a captured piece dissolves instead of leaving a
  //     floating contour behind. En passant is punted: chess.js flags it
  //     as a capture, but the actual captured pawn sits on a DIFFERENT
  //     square than `to` (same file as `to`, same rank as `from`) — this
  //     scheme never touches that square, so an en-passant victim just
  //     disappears at the integer boundary, unfaded, exactly like before.
  //     (`to` itself is empty in that case, so computing a fade entry for it
  //     is harmless — there is no piece there to visibly fade.)
  const glide = new Map();
  const fade = new Map();
  if (plyT > 0) {
    const nextPly = plies[shown];
    const lift = 1 + 0.1 * 4 * plyT * (1 - plyT); // parabolic, peaks at +10% when plyT=0.5
    glide.set(nextPly.from, { toSq: nextPly.to, lift });
    if (nextPly.capture) fade.set(nextPly.to, 1 - plyT);
    const rook = castleRook(nextPly);
    if (rook) glide.set(rook.from, { toSq: rook.to, lift });
  }

  // A square's piece is placed by its silhouette's own bounding-box center,
  // straight onto the cell's center — no nudge of any kind. A touched-but-
  // currently-empty square still emits its group, with no children: the id
  // exists at every plies_shown (so `animate` never needs an element that did
  // not already exist) and simply paints nothing.
  [...touched].sort().forEach((sq) => {
    const [r, c] = rcOfSquare(sq);
    const [br, bc] = boardRC(r, c);
    const cell = board[br][bc];
    const id = "piece_" + sq;
    const [cx, cy] = cellPos(r, c);
    let at = [cx, cy];
    let lift = 1;
    const inFlight = glide.get(sq);
    if (inFlight) {
      const [tx, ty] = squarePos(inFlight.toSq);
      at = [cx + (tx - cx) * plyT, cy + (ty - cy) * plyT];
      lift = inFlight.lift;
    }
    const opacity = fade.get(sq);
    push(cell ? pieceGroup(id, cell, at, lift, opacity) : kit.group(id, []));
    anchors[id] = at;
  });

  /**
   * An arrow with a paper CASING under it — the cartographer's halo: a wider
   * stroke in C.paper laid down first, then the colored arrow on top of it,
   * both as children of one group carrying the arrow's own element id (so a
   * draw list naming `move_arrow` or `arrow_0` still gets both, exactly as it
   * did when an arrow was a single stroke).
   *
   * Why: demand (the move arrow) is only 1.69:1 against boardDark in WCAG
   * relative luminance, and accent (annotation arrows) 1.55:1 — red and
   * purple on green, the classic weak pair, separated mostly by hue. Rather
   * than repaint two shared palette colors for one template, the casing
   * guarantees the arrow is never adjacent to the green at all: against the
   * paper casing, demand is 5.16:1 and accent 4.74:1, on either square. On a
   * light square the casing itself is nearly invisible (1.13:1 against
   * boardLight) and simply does no harm — demand was already 4.55:1 there.
   *
   * The casing draws at the scaffold budget rather than the arrow's own: it
   * is packaging for the beat, not the beat.
   */
  function arrowWithHalo(id, from, to, color, strokeWidth) {
    const geom = { shorten: 22 };
    const halo = kit.edgeArrow(id + "__halo", from, to, { ...geom, color: C.paper, strokeWidth: strokeWidth + 3.5, ms: SCAFFOLD_MS });
    const line = kit.edgeArrow(id + "__line", from, to, { ...geom, color, strokeWidth, ms: MS.connector });
    return kit.group(id, [...halo.drawables, ...line.drawables]);
  }

  // Last-move arrow: present whenever the line has any moves at all (so it
  // can be animated in smoothly), collapsed to a zero-length segment at the
  // board's own center — a point no piece ever anchors on — before the
  // first ply is shown.
  if (maxPlies > 0) {
    const boardCenter = [X0 + BOARD / 2, Y0 + BOARD / 2];
    let from = boardCenter, to = boardCenter;
    if (shown > 0) {
      const last = plies[shown - 1];
      from = squarePos(last.from);
      to = squarePos(last.to);
    }
    push(arrowWithHalo("move_arrow", from, to, C.demand, 4));
    anchors.move_arrow = to;
  }

  // Static annotation arrows.
  (Array.isArray(params.arrows) ? params.arrows : []).slice(0, 12).forEach((a, i) => {
    if (!a || !validSquare(a.from) || !validSquare(a.to)) return;
    const from = squarePos(a.from), to = squarePos(a.to);
    const id = "arrow_" + i;
    push(arrowWithHalo(id, from, to, C.accent, 3.5));
    anchors[id] = to;
  });

  // File letters below the board, rank numbers to its left — both outside
  // the grid, so they never contest a square's own content. No y-nudge
  // here (unlike the pieces above): plain digit/letter glyphs already sit
  // close to the font's central baseline, so dominant-baseline: "central"
  // centers them well enough on its own.
  if (showCoords) {
    const FS = 24; // grown with the board (20 at BOARD=520).
    for (let c = 0; c < 8; c++) {
      const file = fileOf(boardRC(0, c)[1]);
      const id = "coord_" + file;
      const [cx] = cellPos(0, c);
      const pos = [cx, Y0 - 31];
      push(kit.text(id, pos, file, { fontSize: FS, color: C.guide, anchor: "middle" }));
      anchors[id] = pos;
    }
    for (let r = 0; r < 8; r++) {
      const rank = rankOf(boardRC(r, 0)[0]);
      const id = "coord_" + rank;
      const [, cy] = cellPos(r, 0);
      const pos = [X0 - 26, cy];
      push(kit.text(id, pos, String(rank), { fontSize: FS, color: C.guide, anchor: "end" }));
      anchors[id] = pos;
    }
  }

  return { drawables, labels, anchors, order };
