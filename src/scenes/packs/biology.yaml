pack: biology
title: Biology
description: Cell-membrane, DNA-helix, phylogenetic-tree, pathway, Punnett-square, food-web, flower and water-cycle figures — computed geometry, no engines.
---
template: membrane_bilayer
title: Cell membrane (phospholipid bilayer)
version: 1
kit: 1
status: ready
description: >-
  A phospholipid bilayer cross-section: two rows of lipids (circular heads
  outward, wavy tails meeting in the middle) with optional embedded proteins
  (channel, pump, receptor) and optional transport arrows showing substances
  crossing the membrane by diffusion or active transport. Choose this for
  requests about cell membranes, phospholipid bilayers, membrane proteins,
  membrane transport, diffusion vs. active transport, or osmosis.
params:
  type: object
  properties:
    width_units:
      type: number
      description: "Lipids per leaflet row, 4–12 (default 8)."
    proteins:
      type: array
      items:
        type: string
        enum: [channel, pump, receptor]
      description: "Membrane proteins to embed, left to right (default [channel])."
    transports:
      type: array
      items:
        type: object
        properties:
          species:
            type: string
            description: "What's moving, e.g. \"O₂\" or \"Na⁺\"."
          mode:
            type: string
            enum: [diffusion, active]
            description: "diffusion = passive, no energy (default); active = uses ATP."
          direction:
            type: string
            enum: [in, out]
            description: "Into the cell or out of it (default out)."
        required: [species]
      description: "Substances shown moving across the membrane, each drawn as an arrow through a protein."
    labels:
      type: boolean
      description: "Show protein-type and transport-species name labels (default true)."
element_ids:
  lipids: the lipid bilayer — both leaflets' heads and tails (one group)
  protein_<i>: each embedded membrane protein (channel, pump, or receptor), 0-indexed left to right
  transport_<i>: each transport arrow through a protein (plus its "ATP" marker when active), 0-indexed
  label_protein_<i>: the protein-type name label (when labels is true)
  label_transport_<i>: the transport's species name label (when labels is true)
examples:
  - request: "Draw a cell membrane with a channel protein."
    params: { proteins: ["channel"] }
  - request: "Show diffusion of O₂ through a membrane channel."
    params: { proteins: ["channel"], transports: [{ species: "O₂", mode: "diffusion", direction: "in" }] }
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const widthUnits = Math.min(12, Math.max(4, Math.round(params.width_units ?? 8)));
  const proteins = Array.isArray(params.proteins) ? params.proteins : ["channel"];
  const transports = Array.isArray(params.transports) ? params.transports : [];
  const showLabels = params.labels !== false;

  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  const label = (id, anchor, side, text, color, fontSize) => {
    if (!showLabels) return;
    labels.push(kit.label(id, anchor, side, text, { color, fontSize }));
    order.push(id);
  };

  const X0 = 110, X1 = 890;
  const xs = [];
  for (let i = 0; i < widthUnits; i++) {
    xs.push(widthUnits > 1 ? X0 + ((X1 - X0) * i) / (widthUnits - 1) : (X0 + X1) / 2);
  }

  const HEAD_R = 11;
  const TOP_HEAD_Y = 470, BOT_HEAD_Y = 290;
  const MID_Y = (TOP_HEAD_Y + BOT_HEAD_Y) / 2;
  const TAIL_LEN = TOP_HEAD_Y - HEAD_R - MID_Y;
  const TAIL_AMP = 6, TAIL_WL = 45;
  const PROT_YB = 255, PROT_YT = 505;

  function pickSlots(n) {
    if (n <= 0) return [];
    const out = [];
    for (let i = 0; i < n; i++) out.push(Math.round(((i + 1) * widthUnits) / (n + 1)));
    return out.map((v) => Math.min(widthUnits - 1, Math.max(0, v)));
  }

  const proteinSlots = pickSlots(proteins.length);
  const usedCols = new Set(proteinSlots);

  let transportXs;
  if (proteins.length > 0) {
    transportXs = transports.map((_, i) => xs[proteinSlots[i % proteinSlots.length]]);
  } else {
    const tSlots = pickSlots(transports.length);
    tSlots.forEach((s) => usedCols.add(s));
    transportXs = tSlots.map((s) => xs[s]);
  }

  // Vertical wavy tail: kit.wave is horizontal (x = distance, y = wiggle), so
  // swap roles — the wave's own "t" axis becomes the tail's vertical run and
  // its sine offset becomes the small horizontal wiggle around x0.
  function tailPts(x0, y0, dir) {
    const raw = kit.wave([0, 0], TAIL_LEN, TAIL_AMP, TAIL_WL);
    return raw.map(([t, s]) => [x0 + s, y0 + dir * t]);
  }

  const lipidStrokes = [];
  xs.forEach((x, i) => {
    if (usedCols.has(i)) return;
    lipidStrokes.push(kit.stroke(`lipid_${i}_head_top`, [[x, TOP_HEAD_Y]], { shapeHint: { type: "circle", c: [x, TOP_HEAD_Y], r: HEAD_R }, strokeWidth: 2.5, ms: MS.dot }));
    lipidStrokes.push(kit.stroke(`lipid_${i}_tail_top_a`, tailPts(x - 4, TOP_HEAD_Y - HEAD_R, -1), { strokeWidth: 2, ms: MS.guides }));
    lipidStrokes.push(kit.stroke(`lipid_${i}_tail_top_b`, tailPts(x + 4, TOP_HEAD_Y - HEAD_R, -1), { strokeWidth: 2, ms: MS.guides }));
    lipidStrokes.push(kit.stroke(`lipid_${i}_head_bot`, [[x, BOT_HEAD_Y]], { shapeHint: { type: "circle", c: [x, BOT_HEAD_Y], r: HEAD_R }, strokeWidth: 2.5, ms: MS.dot }));
    lipidStrokes.push(kit.stroke(`lipid_${i}_tail_bot_a`, tailPts(x - 4, BOT_HEAD_Y + HEAD_R, 1), { strokeWidth: 2, ms: MS.guides }));
    lipidStrokes.push(kit.stroke(`lipid_${i}_tail_bot_b`, tailPts(x + 4, BOT_HEAD_Y + HEAD_R, 1), { strokeWidth: 2, ms: MS.guides }));
  });
  push(kit.group("lipids", lipidStrokes));
  anchors.lipids = [(X0 + X1) / 2, MID_Y];

  // A closed, gently chamfered rectangle — a simple deterministic stand-in
  // for a "rounded rect" without needing per-corner arc math.
  function chamferBar(cx, y0, y1, w, r) {
    const x0 = cx - w / 2, x1 = cx + w / 2;
    return [
      [x0, y0 + r], [x0, y1 - r], [x0 + r, y1], [x1 - r, y1],
      [x1, y1 - r], [x1, y0 + r], [x1 - r, y0], [x0 + r, y0],
    ];
  }
  const capitalize = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  proteins.forEach((type, i) => {
    const x = xs[proteinSlots[i]];
    const children = [];
    if (type === "pump") {
      const ry = (PROT_YT - PROT_YB) / 2, cy = (PROT_YT + PROT_YB) / 2;
      children.push(kit.stroke(`protein_${i}_body`, kit.ellipse([x, cy], 28, ry), { closed: true, color: C.accent, strokeWidth: 3.5, ms: MS.node }));
    } else if (type === "receptor") {
      const forkY = 460;
      children.push(kit.stroke(`protein_${i}_stalk`, chamferBar(x, PROT_YB, forkY, 16, 6), { closed: true, color: C.accent, strokeWidth: 3.5, ms: MS.node }));
      children.push(kit.stroke(`protein_${i}_fork_l`, [[x, forkY], [x - 32, PROT_YT]], { color: C.accent, strokeWidth: 3.5, ms: MS.connector }));
      children.push(kit.stroke(`protein_${i}_fork_r`, [[x, forkY], [x + 32, PROT_YT]], { color: C.accent, strokeWidth: 3.5, ms: MS.connector }));
    } else {
      children.push(kit.stroke(`protein_${i}_bar_l`, chamferBar(x - 17, PROT_YB, PROT_YT, 16, 6), { closed: true, color: C.accent, strokeWidth: 3.5, ms: MS.node }));
      children.push(kit.stroke(`protein_${i}_bar_r`, chamferBar(x + 17, PROT_YB, PROT_YT, 16, 6), { closed: true, color: C.accent, strokeWidth: 3.5, ms: MS.node }));
    }
    push(kit.group(`protein_${i}`, children));
    anchors[`protein_${i}`] = [x, (PROT_YB + PROT_YT) / 2];
    label(`label_protein_${i}`, [x, PROT_YT + 6], "above", capitalize(type), C.accent, 22);
  });

  transports.forEach((tr, i) => {
    const x = transportXs[i];
    const mode = tr && tr.mode === "active" ? "active" : "diffusion";
    const dir = tr && tr.direction === "in" ? "in" : "out";
    const species = (tr && tr.species) || "X";
    const yBot = 270, yTop = 490;
    const pts = dir === "out" ? [[x, yBot], [x, yTop]] : [[x, yTop], [x, yBot]];
    const strokeColor = mode === "active" ? C.accent : C.guide;
    const sw = mode === "active" ? 5 : 3;
    const children = [kit.stroke(`transport_${i}_arrow`, pts, { arrowhead: "end", color: strokeColor, strokeWidth: sw, ms: MS.arrow })];
    if (mode === "active") {
      // Beside the arrow's TAIL, clear of the membrane band: mid-height put it
      // inside the protein it passes through (a pump body is an ellipse of
      // rx 28 about x, so x + 16 was always on top of it). The tail end is
      // also the opposite end from label_transport_<i>, which sits at the head.
      const atpY = dir === "out" ? yBot - 22 : yTop + 22;
      children.push(kit.text(`transport_${i}_atp`, [x + 16, atpY], "ATP", { fontSize: 18, color: C.accent, anchor: "start" }));
    }
    push(kit.group(`transport_${i}`, children));
    const labelAnchor = dir === "out" ? [x, yTop + 8] : [x, yBot - 8];
    label(`label_transport_${i}`, labelAnchor, dir === "out" ? "above" : "below", species, strokeColor, 22);
  });

  return { drawables, labels, anchors, order };
---
template: dna_helix
title: DNA double helix
version: 1
kit: 1
status: ready
description: >-
  A DNA double helix drawn as two phase-shifted sine strands (the
  sugar-phosphate backbones) with base-pair rungs connecting them wherever the
  strands are far apart — the classic look of rungs vanishing at the crossing
  points. Choose this for requests about DNA structure, the double helix,
  base pairing, or the sugar-phosphate backbone.
params:
  type: object
  properties:
    turns:
      type: number
      description: "Number of helical turns to draw, 1–4 (default 2)."
    show_base_pairs:
      type: boolean
      description: "Draw the rungs connecting the two strands (default true)."
    labels:
      type: boolean
      description: "Show the backbone/base-pair name labels (default true)."
element_ids:
  strand_a / strand_b: the two sugar-phosphate backbone strands
  rungs: the base-pair rungs connecting the strands (one group; present when show_base_pairs is true)
  label_backbone: the "Sugar-phosphate backbone" label (when labels is true)
  label_basepair: the "Base pair" label pointing at one rung (when labels and show_base_pairs are true)
examples:
  - request: "Draw a DNA double helix."
    params: {}
  - request: "Draw a DNA helix with 3 turns, no labels."
    params: { turns: 3, labels: false }
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const turns = Math.min(4, Math.max(1, Math.round(params.turns ?? 2)));
  const showBasePairs = params.show_base_pairs !== false;
  const showLabels = params.labels !== false;

  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  const label = (id, anchor, side, text, color, fontSize) => {
    if (!showLabels) return;
    labels.push(kit.label(id, anchor, side, text, { color, fontSize }));
    order.push(id);
  };

  const X0 = 120, LEN = 760, MID_Y = 375, AMP = 70;
  const WL = LEN / turns;

  const strandA = kit.wave([X0, MID_Y], LEN, AMP, WL);
  push(kit.stroke("strand_a", strandA, { color: C.demand, strokeWidth: 5, ms: MS.curve }));
  anchors.strand_a = strandA[Math.floor(strandA.length / 4)];

  // Second strand: same sine, phase-shifted by half a wavelength (kit.wave
  // has no phase param, so this mirrors kit.wave's own formula by hand — the
  // same technique physics/wave_diagram uses for its second interference wave).
  const strandB = [];
  for (let t = 0; t <= LEN; t += 4) {
    strandB.push([X0 + t, MID_Y + AMP * Math.sin((t / WL) * 2 * Math.PI + Math.PI)]);
  }
  push(kit.stroke("strand_b", strandB, { color: C.supply, strokeWidth: 5, ms: MS.curve }));
  anchors.strand_b = strandB[Math.floor(strandB.length / 4)];

  if (showBasePairs) {
    const rungs = [];
    let ri = 0, midRung = null;
    for (let t = 0; t <= LEN; t += 20) {
      const yA = MID_Y + AMP * Math.sin((t / WL) * 2 * Math.PI);
      const yB = MID_Y + AMP * Math.sin((t / WL) * 2 * Math.PI + Math.PI);
      if (Math.abs(yA - yB) > 40) {
        rungs.push(kit.stroke(`rung_${ri}`, [[X0 + t, yA], [X0 + t, yB]], { color: C.guide, strokeWidth: 2, ms: MS.connector }));
        if (midRung === null || Math.abs(t - LEN / 2) < Math.abs(midRung.t - LEN / 2)) midRung = { t, pt: [X0 + t, (yA + yB) / 2] };
        ri++;
      }
    }
    push(kit.group("rungs", rungs));
    // Above the band, not beside the rung: the middle of the helix is where
    // the rungs are densest, so a "right"-side label there lands across its
    // three neighbours (lint: label sits on stroke). Anchoring at the top of
    // the band, directly over the middle rung, keeps the pointing sense and
    // puts the text in free canvas.
    if (midRung) label("label_basepair", [midRung.pt[0], MID_Y + AMP + 8], "above", "Base pair", C.guide, 24);
  }

  label("label_backbone", [X0 + 40, MID_Y + AMP * Math.sin((40 / WL) * 2 * Math.PI)], "above", "Sugar-phosphate backbone", C.demand, 22);

  return { drawables, labels, anchors, order };
---
template: phylo_tree
title: Phylogenetic tree
version: 1
kit: 1
status: ready
description: >-
  A rectangular cladogram parsed from a Newick tree string: leaves flush at
  the right with their names, internal nodes positioned by depth (branch
  lengths are ignored in v1), right-angle elbow connectors. Choose this for
  requests about phylogenetic trees, evolutionary relationships, cladograms,
  or "how are X and Y related".
params:
  type: object
  properties:
    newick:
      type: string
      description: "Newick tree string, e.g. \"((Human,Chimp),(Mouse,Rat),Chicken);\". Branch lengths are parsed but ignored — layout is depth-proportional."
    title:
      type: string
      description: "Caption above the tree."
element_ids:
  edges: the parent→child connector lines (one group; right-angle elbows)
  leaf_<i>: each leaf's name text, 0-indexed left to right as given in the newick string
  tree_title: the caption (when title is given)
examples:
  - request: "Draw a phylogenetic tree of Human, Chimp, Mouse, Rat, and Chicken."
    params: {}
  - request: "Draw a phylogenetic tree of felids."
    params: { newick: "(Dog,(Cat,(Lion,Tiger)));", title: "Felids" }
layout: |
  const newick = typeof params.newick === "string" && params.newick.trim() !== ""
    ? params.newick
    : "((Human,Chimp),(Mouse,Rat),Chicken);";

  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };

  const root = kit.parseNewick(newick);

  const leaves = [];
  (function collect(n) {
    if (n.children.length === 0) leaves.push(n);
    else n.children.forEach(collect);
  })(root);
  const numLeaves = Math.max(1, leaves.length);
  leaves.forEach((leaf, i) => {
    leaf._y = numLeaves > 1 ? 620 - (i * (620 - 180)) / (numLeaves - 1) : 400;
  });

  let maxDepth = 0;
  (function depth(n, d) {
    if (n.children.length === 0) { maxDepth = Math.max(maxDepth, d); return; }
    n.children.forEach((c) => depth(c, d + 1));
  })(root, 0);

  const X_ROOT = 140, X_LEAF = 760;
  function place(n, d) {
    if (n.children.length === 0) { n._x = X_LEAF; return; }
    n.children.forEach((c) => place(c, d + 1));
    n._x = maxDepth > 0 ? X_ROOT + (d / maxDepth) * (X_LEAF - X_ROOT) : X_ROOT;
    n._y = n.children.reduce((s, c) => s + c._y, 0) / n.children.length;
  }
  place(root, 0);

  const edges = [];
  let ei = 0;
  (function walk(n) {
    n.children.forEach((c) => {
      edges.push(kit.stroke(`edge_${ei}`, [[n._x, n._y], [c._x, n._y], [c._x, c._y]], { strokeWidth: 3, ms: kit.SKETCH_MS.connector }));
      ei++;
      walk(c);
    });
  })(root);
  if (edges.length > 0) {
    push(kit.group("edges", edges));
    anchors.edges = [root._x, root._y];
  }

  // Leaf names are exact-position kit.text (they ARE the tree, not a
  // repositionable annotation of it) — so unlike a kit.label, nothing here
  // stops a long name from running past x=1000. Guard it directly: shrink
  // the font to fit the LONGEST name, and if even the floor size would still
  // overflow, ellipsize past the width the floor size allows.
  const FS_BASE = 24, FS_FLOOR = 14, TEXT_X = 775, MARGIN = 15;
  const availW = kit.CANVAS.w - TEXT_X - MARGIN;
  const rawMaxLen = Math.max(1, ...leaves.map((l) => (l.name || "").length));
  const fs = Math.max(FS_FLOOR, Math.min(FS_BASE, availW / (rawMaxLen * 0.52)));
  const maxCharsAtFloor = Math.max(1, Math.floor(availW / (FS_FLOOR * 0.52)));
  function displayName(raw, i) {
    const s = raw || `Taxon ${i + 1}`;
    if (s.length <= maxCharsAtFloor) return s;
    return s.slice(0, Math.max(1, maxCharsAtFloor - 1)) + "…";
  }

  leaves.forEach((leaf, i) => {
    push(kit.text(`leaf_${i}`, [TEXT_X, leaf._y], displayName(leaf.name, i), { fontSize: fs, anchor: "start" }));
  });

  if (params.title) {
    labels.push(kit.label("tree_title", [450, 660], "above", String(params.title), { fontSize: 30 }));
    order.push("tree_title");
  }

  return { drawables, labels, anchors, order };
---
template: pathway
title: Signaling / metabolic pathway
version: 1
kit: 2
status: ready
description: >-
  A signaling or metabolic pathway diagram parsed from a kit.parseEdgeList
  string: nodes (protein ellipses, gene rectangles, metabolite circles, or
  plain-text processes) laid out left-to-right by dependency layer, connected
  by arrows that activate (->), bars that inhibit (-|), or dashed arrows that
  convert (=>). Choose this scene for ANY request about a signaling pathway,
  a metabolic pathway, gene regulation, a protein activating or inhibiting
  another, a signal cascade (e.g. EGFR/RAS/ERK, MAPK), or a pathway diagram
  in general.
params:
  type: object
  properties:
    edges:
      type: string
      description: >-
        kit.parseEdgeList notation: "EGFR -> RAS; RAS -> ERK; p53 -| cell
        cycle" (-> activates, -| inhibits, => converts). Default: a
        3-node MAPK-style cascade.
    node_types:
      type: object
      additionalProperties:
        type: string
        enum: [protein, gene, metabolite, process]
      description: >-
        Maps a node name to its shape: protein = rounded ellipse (default for
        any node not listed here), gene = rectangle, metabolite = small
        circle, process = plain text with no shape.
    title:
      type: string
element_ids:
  node_<slug>: a node's shape (ellipse/rect/circle; absent for "process" nodes, which have no shape)
  node_label_<slug>: the node's name label
  edge_<i>: the i-th parsed edge's connector (arrow, bar, or dashed arrow)
  title: figure title, when set
examples:
  - request: "Draw the MAPK-style pathway EGFR to RAS to ERK, with p53 inhibiting the cell cycle."
    params:
      edges: "EGFR -> RAS; RAS -> ERK; p53 -| cell cycle"
      title: "A simplified MAPK cascade"
  - request: "Draw a metabolic pathway converting glucose to pyruvate, activated by insulin."
    params:
      edges: "insulin -> glycolysis; glucose => pyruvate"
      node_types: { glucose: metabolite, pyruvate: metabolite, insulin: protein, glycolysis: process }
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  function slugify(name) { return String(name).toLowerCase().replace(/[^a-z0-9]/g, "_") || "n"; }
  const TYPES = ["protein", "gene", "metabolite", "process"];
  const TYPE_COLOR = { protein: C.accent, gene: C.demand, metabolite: C.supply, process: C.guide };
  const typesIn = params.node_types && typeof params.node_types === "object" ? params.node_types : {};
  function typeOf(name) { return TYPES.includes(typesIn[name]) ? typesIn[name] : "protein"; }

  const edgesStr = typeof params.edges === "string" && params.edges.trim() !== ""
    ? params.edges
    : "EGFR -> RAS; RAS -> ERK; p53 -| cell cycle";
  const parsed = kit.parseEdgeList(edgesStr).slice(0, 24);

  const nodeNames = [];
  const seen = {};
  function addNode(name) { if (!seen[name]) { seen[name] = true; nodeNames.push(name); } }
  parsed.forEach((e) => { addNode(e.from); addNode(e.to); });
  Object.keys(typesIn).forEach(addNode);
  if (nodeNames.length === 0) addNode("Node 1");

  const X0 = 110, Y0 = 140, W = 780, H = 470;
  const positions = kit.layoutNodes(nodeNames, parsed.map((e) => ({ from: e.from, to: e.to })), { style: "layered", x: X0, y: Y0, w: W, h: H });

  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  const label = (id, anchor, side, text, color, fontSize) => {
    labels.push(kit.label(id, anchor, side, text, { color, fontSize }));
    order.push(id);
  };

  nodeNames.forEach((name) => {
    const c = positions[name];
    if (!c) return;
    const slug = slugify(name);
    const type = typeOf(name);
    const color = TYPE_COLOR[type];
    let halfH = 0;
    if (type === "protein") {
      push(kit.group("node_" + slug, [kit.stroke("node_" + slug + "__shape", kit.ellipse(c, 64, 30), { closed: true, color, strokeWidth: 3, ms: MS.node })]));
      halfH = 30;
    } else if (type === "gene") {
      const w2 = 104, h2 = 46;
      const rectPts = [[c[0] - w2 / 2, c[1] - h2 / 2], [c[0] + w2 / 2, c[1] - h2 / 2], [c[0] + w2 / 2, c[1] + h2 / 2], [c[0] - w2 / 2, c[1] + h2 / 2]];
      push(kit.group("node_" + slug, [kit.stroke("node_" + slug + "__shape", rectPts, { closed: true, color, strokeWidth: 3, ms: MS.node })]));
      halfH = h2 / 2;
    } else if (type === "metabolite") {
      push(kit.group("node_" + slug, [kit.stroke("node_" + slug + "__shape", kit.ellipse(c, 30, 30), { closed: true, color, strokeWidth: 3, ms: MS.node })]));
      halfH = 30;
    }
    anchors["node_" + slug] = c;
    const fontSize = name.length > 12 ? 16 : 19;
    label("node_label_" + slug, [c[0], c[1] + halfH + 8], "above", name, color, fontSize);
  });

  function edgeColor(effect) { return effect === "inhibits" ? C.regionLoss : effect === "converts" ? C.guide : C.ink; }
  // Per-node-type boundary shapes for edgeArrow's trim (matches each type's
  // drawn shape above) — a "process" node has no shape, so it only gets a
  // small breathing gap, same magnitude as a shape trim's own gap.
  const SHAPE_BY_TYPE = { protein: { ellipse: [64, 30] }, gene: { rect: [104, 46] }, metabolite: { ellipse: [30, 30] }, process: 3 };
  function shapeFor(name) { return SHAPE_BY_TYPE[typeOf(name)]; }
  parsed.forEach((e, i) => {
    const from = positions[e.from], to = positions[e.to];
    if (!from || !to) return;
    const id = "edge_" + i;
    const opts = {
      shortenStart: shapeFor(e.from),
      shortenEnd: shapeFor(e.to),
      head: e.effect === "inhibits" ? "bar" : "arrow",
      dash: e.effect === "converts",
      color: edgeColor(e.effect),
      strokeWidth: 3.5,
      ms: MS.connector,
    };
    const { drawables: edgeDrawables } = kit.edgeArrow(id, from, to, opts);
    edgeDrawables.forEach(push);
    anchors[id] = [(from[0] + to[0]) / 2, (from[1] + to[1]) / 2];
  });

  if (typeof params.title === "string" && params.title.trim() !== "") {
    push(kit.text("title", [500, 80], params.title, { fontSize: 28 }));
  }

  return { drawables, labels, anchors, order };
---
template: punnett_square
title: Punnett square
version: 1
kit: 2
status: ready
description: >-
  A 2x2 Punnett square for a monohybrid genetic cross: each parent's two
  alleles become the row/column gamete headers, every cell shows the
  resulting offspring genotype with the dominant (uppercase) allele written
  first, cells sharing the dominant or recessive phenotype are shaded
  together, and a reduced ratio caption sits under the grid ("3 : 1" for the
  classic Aa x Aa cross counting phenotypes, or "1 : 2 : 1 genotypes" when
  no phenotype is highlighted). Choose this scene for ANY request about a
  Punnett square, a genetic cross, dominant and recessive alleles, genotype
  vs phenotype ratios, heterozygous or homozygous parents, or Mendelian
  inheritance.
params:
  type: object
  properties:
    parent1:
      type: string
      description: "Parent 1's two-letter genotype, e.g. \"Aa\" (default \"Aa\")."
    parent2:
      type: string
      description: "Parent 2's two-letter genotype, e.g. \"Aa\" (default \"Aa\")."
    trait:
      type: object
      properties:
        dominant: { type: string }
        recessive: { type: string }
      description: "Trait names for the dominant/recessive alleles, e.g. { dominant: \"brown eyes\", recessive: \"blue eyes\" } — appended to the ratio caption."
    highlight:
      type: string
      enum: [dominant, recessive]
      description: "Which phenotype's cells to shade (default \"recessive\"); pass null to shade nothing and show a genotype-count ratio instead."
    show_ratio:
      type: boolean
      description: "Show the ratio caption under the grid (default true)."
element_ids:
  grid: the 2x2 grid lines (a group)
  "grid__c<r>_<c>": each cell's offspring-genotype text (row 0 = top; kit.table's own ids)
  "grid__ch<c> / grid__rh<r>": the column/row gamete-letter headers
  parent1_label: parent 1's caption above the column headers
  parent2_label: parent 2's caption left of the row headers
  hl_<r>_<c>: shaded region behind a highlighted-phenotype cell, present only for those cells when highlight is set
  ratio: the ratio caption under the grid, when show_ratio
examples:
  - request: "Cross two heterozygous parents in a Punnett square."
    params: { parent1: "Aa", parent2: "Aa" }
  - request: "Cross a heterozygous parent with a homozygous recessive parent and highlight the dominant phenotype."
    params: { parent1: "Aa", parent2: "aa", highlight: "dominant", trait: { dominant: "brown eyes", recessive: "blue eyes" } }
layout: |
  const C = kit.COLORS;
  function normParent(p) { return typeof p === "string" && /^[A-Za-z]{2}$/.test(p) ? p : "Aa"; }
  const parent1 = normParent(params.parent1);
  const parent2 = normParent(params.parent2);
  const g1 = [parent1[0], parent1[1]];
  const g2 = [parent2[0], parent2[1]];

  function combine(a, b) {
    const arr = [a, b];
    arr.sort((x, y) => {
      const xu = x === x.toUpperCase(), yu = y === y.toUpperCase();
      if (xu !== yu) return xu ? -1 : 1;
      return x < y ? -1 : x > y ? 1 : 0;
    });
    return arr.join("");
  }
  const cells = [
    [combine(g1[0], g2[0]), combine(g1[1], g2[0])],
    [combine(g1[0], g2[1]), combine(g1[1], g2[1])],
  ];
  const isDominant = (g) => g[0] === g[0].toUpperCase();

  const highlight = params.highlight === "dominant" ? "dominant" : (params.highlight === null || params.highlight === false) ? null : "recessive";
  const showRatio = params.show_ratio !== false;

  const CX = 500, CY = 390, W = 340, H = 260;
  const X0 = CX - W / 2, Y0 = CY - H / 2;
  const cellW = W / 2, cellH = H / 2;
  const FS = 28;

  const drawables = [], labels = [], anchors = {}, order = [];

  const t = kit.table("grid", { x: X0, y: Y0, w: W, h: H, rows: 2, cols: 2, cells, colHeaders: g1, rowHeaders: g2, fontSize: FS, headerColor: C.guide });
  t.drawables[0].id = "grid";
  t.order[0] = "grid";
  t.drawables.forEach((d) => drawables.push(d));
  order.push(...t.order);
  anchors.grid = [CX, CY];
  Object.assign(anchors, t.anchors);

  function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
  function reduceRatio(counts) {
    if (counts.some((n) => n === 0)) return counts.slice();
    let g = counts[0];
    for (let k = 1; k < counts.length; k++) g = gcd(g, counts[k]);
    return counts.map((n) => n / g);
  }

  if (highlight) {
    for (let r = 0; r < 2; r++) {
      for (let c = 0; c < 2; c++) {
        const g = cells[r][c];
        const matches = highlight === "dominant" ? isDominant(g) : !isDominant(g);
        if (!matches) continue;
        const left = X0 + cellW * c, right = left + cellW;
        const top = Y0 + H - cellH * r, bottom = top - cellH;
        const id = "hl_" + r + "_" + c;
        drawables.push(kit.area(id, [[left, bottom], [right, bottom], [right, top], [left, top]], C.region1));
        order.push(id);
        anchors[id] = [(left + right) / 2, (top + bottom) / 2];
      }
    }
  }

  let ratioText;
  if (highlight) {
    let dom = 0, rec = 0;
    for (let r = 0; r < 2; r++) {
      for (let c = 0; c < 2; c++) {
        if (isDominant(cells[r][c])) dom++; else rec++;
      }
    }
    const reduced = reduceRatio([dom, rec]);
    ratioText = reduced[0] + " : " + reduced[1];
    if (params.trait && typeof params.trait.dominant === "string" && typeof params.trait.recessive === "string") {
      ratioText += " (" + params.trait.dominant + " : " + params.trait.recessive + ")";
    }
  } else {
    const genoOrder = [];
    const counts = {};
    for (let r = 0; r < 2; r++) {
      for (let c = 0; c < 2; c++) {
        const g = cells[r][c];
        if (counts[g] === undefined) { counts[g] = 0; genoOrder.push(g); }
        counts[g]++;
      }
    }
    const reduced = reduceRatio(genoOrder.map((g) => counts[g]));
    ratioText = reduced.join(" : ") + " genotypes";
  }

  if (showRatio) {
    drawables.push(kit.text("ratio", [CX, Y0 - 55], ratioText, { fontSize: 26 }));
    order.push("ratio");
  }

  drawables.push(kit.text("parent1_label", [CX, Y0 + H + 105], "Parent 1 (" + parent1 + ")", { fontSize: 22, color: C.guide }));
  order.push("parent1_label");
  drawables.push(kit.text("parent2_label", [X0 - 105, CY], "Parent 2 (" + parent2 + ")", { fontSize: 22, color: C.guide, anchor: "end" }));
  order.push("parent2_label");

  return { drawables, labels, anchors, order };
---
template: food_web
title: Food web
version: 1
kit: 2
status: ready
description: >-
  A food web laid out in horizontal trophic bands, producers at the bottom
  rising through primary and secondary consumers to apex predators at the
  top: each organism is a name in an ellipse halo, and each link in "grass ->
  rabbit" notation (A is eaten by B) draws an arrow from A up to B, following
  energy flow up the food chain. An organism named in `highlight` gets its
  direct links tinted. Choose this scene for ANY request about a food web, a
  food chain, trophic levels, producers and consumers, predator-prey
  relationships, or "what eats what" in an ecosystem.
params:
  type: object
  properties:
    organisms:
      type: array
      items:
        type: object
        properties:
          name: { type: string }
          level:
            type: string
            enum: [producer, primary, secondary, apex]
            description: "Trophic level; unspecified/other levels default to primary consumer."
        required: [name]
      description: "The organisms in the web (default: a grass/rabbit/mouse/fox/hawk web)."
    links:
      type: string
      description: "kit.parseEdgeList notation, \"grass -> rabbit; rabbit -> fox\" — A -> B means A is eaten by B."
    highlight:
      type: string
      description: "An organism's name; tints its direct links (predator and prey links both)."
element_ids:
  org_<slug>: an organism's name in its ellipse halo (one group)
  link_<i>: the i-th parsed link's upward arrow (A eaten by B, drawn from A to B)
  band_label_<k>: the trophic-band caption (k = 0 producers, 1 primary, 2 secondary, 3 apex)
examples:
  - request: "Draw a food web with grass, rabbits, mice, foxes and hawks."
    params: {}
  - request: "Draw a food web and highlight what happens to the fox's links."
    params:
      organisms:
        - { name: "Grass", level: "producer" }
        - { name: "Rabbit", level: "primary" }
        - { name: "Fox", level: "secondary" }
      links: "Grass -> Rabbit; Rabbit -> Fox"
      highlight: "Fox"
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  function slugify(name) { return String(name).toLowerCase().replace(/[^a-z0-9]/g, "_") || "n"; }
  const LEVELS = ["producer", "primary", "secondary", "apex"];
  const LEVEL_Y = { producer: 140, primary: 320, secondary: 480, apex: 630 };
  const LEVEL_COLOR = { producer: C.region2, primary: C.accent, secondary: C.demand, apex: C.regionLoss };
  const LEVEL_TITLE = { producer: "Producers", primary: "Primary consumers", secondary: "Secondary consumers", apex: "Apex predators" };

  const defaultOrganisms = [
    { name: "Grass", level: "producer" },
    { name: "Rabbit", level: "primary" },
    { name: "Mouse", level: "primary" },
    { name: "Fox", level: "secondary" },
    { name: "Hawk", level: "apex" },
  ];
  const orgsIn = Array.isArray(params.organisms) ? params.organisms.slice(0, 16).filter((o) => o && typeof o.name === "string" && o.name.trim() !== "") : [];
  const organisms = orgsIn.length > 0 ? orgsIn : defaultOrganisms;
  function normLevel(l) { return LEVELS.indexOf(l) >= 0 ? l : "primary"; }

  const linksStr = typeof params.links === "string" && params.links.trim() !== ""
    ? params.links
    : "Grass -> Rabbit; Grass -> Mouse; Rabbit -> Fox; Mouse -> Fox; Rabbit -> Hawk; Mouse -> Hawk";
  const parsed = kit.parseEdgeList(linksStr).slice(0, 40);
  const highlightName = typeof params.highlight === "string" ? params.highlight : undefined;

  const X_MIN = 420, X_MAX = 900;
  const byLevel = { producer: [], primary: [], secondary: [], apex: [] };
  organisms.forEach((o) => byLevel[normLevel(o.level)].push(o));

  const positions = {};
  LEVELS.forEach((lvl) => {
    const list = byLevel[lvl];
    const m = list.length;
    list.forEach((o, i) => {
      const x = m <= 1 ? (X_MIN + X_MAX) / 2 : X_MIN + ((X_MAX - X_MIN) * i) / (m - 1);
      positions[o.name] = [x, LEVEL_Y[lvl]];
    });
  });

  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };

  LEVELS.forEach((lvl, k) => {
    push(kit.text("band_label_" + k, [90, LEVEL_Y[lvl]], LEVEL_TITLE[lvl], { fontSize: 20, color: C.guide, anchor: "start" }));
  });

  organisms.forEach((o) => {
    const pos = positions[o.name];
    if (!pos) return;
    const lvl = normLevel(o.level);
    const color = LEVEL_COLOR[lvl];
    const slug = slugify(o.name);
    const fontSize = o.name.length > 10 ? 16 : 19;
    const halo = kit.stroke("org_" + slug + "__halo", kit.ellipse(pos, 58, 28), { closed: true, color, strokeWidth: 3, ms: MS.node });
    const text = kit.text("org_" + slug + "__text", pos, o.name, { fontSize, color });
    push(kit.group("org_" + slug, [halo, text]));
    anchors["org_" + slug] = pos;
  });

  parsed.forEach((e, i) => {
    const from = positions[e.from], to = positions[e.to];
    if (!from || !to) return;
    const hl = highlightName !== undefined && (e.from === highlightName || e.to === highlightName);
    const color = hl ? C.accent : C.ink;
    const strokeWidth = hl ? 5 : 3;
    const id = "link_" + i;
    const { drawables: linkDrawables } = kit.edgeArrow(id, from, to, { shorten: { ellipse: [58, 28] }, color, strokeWidth, ms: MS.connector });
    linkDrawables.forEach(push);
    anchors[id] = [(from[0] + to[0]) / 2, (from[1] + to[1]) / 2];
  });

  return { drawables, labels, anchors, order };
---
template: flower_anatomy
title: Flower cross-section
version: 1
kit: 1
status: ready
description: 'A longitudinal cross-section (half-section) of a typical flower with every named part: petals and sepals fanning off the receptacle, stamens (anther on a curving filament), the pistil/carpel (stigma, style, ovary containing ovules), receptacle and stem. Optional pollination story: pollen grains landing on the stigma with an approach arrow, a pollen tube growing down the style to an ovule, and a visiting bee. Choose this scene for requests about flower anatomy, ''parts of a flower'', labelling a flower diagram, stamens and pistils/carpels, pollination and pollinators, fertilisation in plants, or how a flower makes seeds. Labels can be limited to the parts under discussion and rendered in several languages.'
params:
  type: object
  properties:
    petals:
      type: integer
      minimum: 1
      maximum: 10
      description: How many petals to draw, fanned across the section (default 5).
    stamens:
      type: integer
      minimum: 1
      maximum: 6
      description: How many stamens (anther + filament) to draw, spread symmetrically (default 2).
    labels:
      type: array
      items:
        type: string
        enum:
          - petals
          - sepals
          - stamen
          - anther
          - filament
          - pistil
          - stigma
          - style
          - ovary
          - ovules
          - receptacle
          - stem
          - pollen
          - pollen_tube
          - bee
      description: 'Which parts get name labels. Default: the classic labelled diagram (petals, sepals, anther, filament, stigma, style, ovary, ovules, receptacle, stem, plus pollen/tube/bee when shown). Narrow this to just the parts the narration discusses.'
    pollen:
      type: boolean
      description: Show pollen grains landing on the stigma plus a pollen tube growing down the style to an ovule (default false). Turn on for pollination/fertilisation explanations.
    bee:
      type: boolean
      description: Show a visiting bee flying in at the upper right (default false).
    language:
      type: string
      enum:
        - en
        - es
        - fr
        - de
        - pt
        - it
      description: Language of the part labels (default 'en').
    labelText:
      type: object
      additionalProperties:
        type: string
      description: Override individual label strings by part key, e.g. {"pistil":"Carpel"}.
  additionalProperties: false
element_ids:
  stem: the two-line stem below the flower
  receptacle / receptacle_fill: the receptacle cup the flower parts sit on
  sepals: group of the sepal outlines and fills
  petals: group of all petal outlines and fills
  stamens: group of the filaments and anthers
  ovary / ovary_fill: the ovary wall and its pale interior
  ovules: group of the ovules inside the ovary
  style: group of the two style walls
  stigma / stigma_fill / stigma_hairs: the sticky stigma head at the top of the style
  pollen: group of the pollen grains (only when pollen is on)
  pollen_path: dashed arrow showing the pollen arriving at the stigma
  pollen_tube: dashed arrow of the pollen tube growing down the style to an ovule
  bee: group of the visiting bee (only when bee is on)
  label_petals / label_sepals / label_stamen / label_anther / label_filament / label_pistil / label_stigma / label_style / label_ovary / label_ovules / label_receptacle / label_stem / label_pollen / label_pollen_tube / label_bee: the part name labels
examples:
  - request: Draw a flower in cross-section and label its parts.
    params: {}
  - request: Show how pollination and fertilisation work — pollen landing on the stigma and the tube growing to the ovule, with a bee visiting.
    params:
      petals: 5
      pollen: true
      bee: true
      labels:
        - anther
        - stigma
        - style
        - ovary
        - ovules
        - pollen
        - pollen_tube
        - bee
layout: |-
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const cx = 470;
  const nPet = Math.max(1, Math.min(10, Math.round(params.petals ?? 5)));
  const nStam = Math.max(1, Math.min(6, Math.round(params.stamens ?? 2)));
  const showPollen = params.pollen === true;
  const showBee = params.bee === true;
  const DICT = {
    en:{petals:"Petal",sepals:"Sepal",stamen:"Stamen",anther:"Anther",filament:"Filament",pistil:"Pistil (carpel)",stigma:"Stigma",style:"Style",ovary:"Ovary",ovules:"Ovule",receptacle:"Receptacle",stem:"Stem",pollen:"Pollen grain",pollen_tube:"Pollen tube",bee:"Bee (pollinator)"},
    es:{petals:"Pétalo",sepals:"Sépalo",stamen:"Estambre",anther:"Antera",filament:"Filamento",pistil:"Pistilo",stigma:"Estigma",style:"Estilo",ovary:"Ovario",ovules:"Óvulo",receptacle:"Receptáculo",stem:"Tallo",pollen:"Grano de polen",pollen_tube:"Tubo polínico",bee:"Abeja"},
    fr:{petals:"Pétale",sepals:"Sépale",stamen:"Étamine",anther:"Anthère",filament:"Filet",pistil:"Pistil",stigma:"Stigmate",style:"Style",ovary:"Ovaire",ovules:"Ovule",receptacle:"Réceptacle",stem:"Tige",pollen:"Grain de pollen",pollen_tube:"Tube pollinique",bee:"Abeille"},
    de:{petals:"Blütenblatt",sepals:"Kelchblatt",stamen:"Staubblatt",anther:"Staubbeutel",filament:"Staubfaden",pistil:"Stempel",stigma:"Narbe",style:"Griffel",ovary:"Fruchtknoten",ovules:"Samenanlage",receptacle:"Blütenboden",stem:"Stiel",pollen:"Pollenkorn",pollen_tube:"Pollenschlauch",bee:"Biene"},
    pt:{petals:"Pétala",sepals:"Sépala",stamen:"Estame",anther:"Antera",filament:"Filete",pistil:"Pistilo",stigma:"Estigma",style:"Estilete",ovary:"Ovário",ovules:"Óvulo",receptacle:"Receptáculo",stem:"Caule",pollen:"Grão de pólen",pollen_tube:"Tubo polínico",bee:"Abelha"},
    it:{petals:"Petalo",sepals:"Sepalo",stamen:"Stame",anther:"Antera",filament:"Filamento",pistil:"Pistillo",stigma:"Stigma",style:"Stilo",ovary:"Ovario",ovules:"Ovulo",receptacle:"Ricettacolo",stem:"Fusto",pollen:"Granulo di polline",pollen_tube:"Tubo pollinico",bee:"Ape"}
  };
  const T = DICT[params.language ?? "en"] ?? DICT.en;
  const over = params.labelText ?? {};
  const txt = (k) => over[k] ?? T[k] ?? DICT.en[k];
  const want = new Set(params.labels ?? ["petals","sepals","anther","filament","stigma","style","ovary","ovules","receptacle","stem","pollen","pollen_tube","bee"]);
  const GREEN = C.supply ?? C.ink, PET = C.demand ?? C.ink, STAM = C.shifted ?? C.ink, PIS = C.accent ?? C.ink, POL = C.shifted ?? C.ink;
  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  const lab = (key, anchor, side, color, fs) => {
    anchors[key] = anchor;
    if (!want.has(key)) return;
    const id = "label_" + key;
    labels.push(kit.label(id, anchor, side, txt(key), { color: color, fontSize: fs ?? 24 }));
    order.push(id);
  };
  const petalShape = (base, angDeg, L, W) => {
    const a = angDeg * Math.PI / 180, dx = Math.cos(a), dy = Math.sin(a), px = -dy, py = dx;
    const p = (t, w) => [base[0] + dx * L * t + px * W * w, base[1] + dy * L * t + py * W * w];
    return kit.smoothClosed([base, p(0.28, 0.8), p(0.68, 0.95), p(1, 0), p(0.68, -0.95), p(0.28, -0.8)], 5);
  };
  const rotEllipse = (c, rx, ry, a, m) => {
    const n2 = m ?? 24, pts = [];
    for (let k = 0; k < n2; k++) { const th = k / n2 * 2 * Math.PI, x = rx * Math.cos(th), y = ry * Math.sin(th);
      pts.push([c[0] + x * Math.cos(a) - y * Math.sin(a), c[1] + x * Math.sin(a) + y * Math.cos(a)]); }
    return pts;
  };
  const disc = (id, c, r, color, fill, sw, ms) => kit.stroke(id, [c], { shapeHint: { type: "circle", c: c, r: r }, color: color, fill: fill, strokeWidth: sw ?? 2.5, ms: ms });

  push(kit.group("stem", [
    kit.stroke("stem_l", [[cx - 15, 26], [cx - 13, 108], [cx - 16, 188]], { color: GREEN, strokeWidth: 4, ms: MS.stroke }),
    kit.stroke("stem_r", [[cx + 15, 26], [cx + 13, 108], [cx + 16, 188]], { color: GREEN, strokeWidth: 4, ms: MS.stroke })
  ]));
  lab("stem", [cx + 17, 100], "right", GREEN);

  const recPts = [[cx - 16, 186], [cx - 46, 212], [cx - 54, 238], [cx + 54, 238], [cx + 46, 212], [cx + 16, 186]];
  push(kit.area("receptacle_fill", recPts, GREEN, { opacity: 0.18 }));
  push(kit.stroke("receptacle", recPts, { closed: true, color: GREEN, strokeWidth: 3.5, ms: MS.node }));
  lab("receptacle", [cx + 18, 186], "below-right", GREEN);

  const sepChildren = [];
  let sepTip = [cx - 130, 190];
  [[cx - 44, 232, 198], [cx + 44, 232, 342]].forEach((s, i) => {
    const pts = petalShape([s[0], s[1]], s[2], 140, 32);
    sepChildren.push(kit.area("sepal_fill_" + i, pts, GREEN, { opacity: 0.18 }));
    sepChildren.push(kit.stroke("sepal_" + i, pts, { closed: true, color: GREEN, strokeWidth: 3, ms: MS.curve }));
    if (i === 0) sepTip = [s[0] + 140 * Math.cos(s[2] * Math.PI / 180), s[1] + 140 * Math.sin(s[2] * Math.PI / 180)];
  });
  push(kit.group("sepals", sepChildren));
  lab("sepals", [sepTip[0] - 4, sepTip[1] - 4], "left", GREEN);

  const petW = Math.max(26, Math.min(56, 260 / nPet));
  const petL = 250;
  const petChildren = [];
  let leftTip = [cx - 200, 360], rightTip = [cx + 200, 360];
  for (let i = 0; i < nPet; i++) {
    const a = nPet === 1 ? 90 : 152 - (124 * i) / (nPet - 1);
    const ar = a * Math.PI / 180;
    const base = [cx + 14 * Math.cos(ar), 244 + 8 * Math.sin(ar)];
    const tip = [base[0] + petL * Math.cos(ar), base[1] + petL * Math.sin(ar)];
    const pts = petalShape(base, a, petL, petW);
    petChildren.push(kit.area("petal_fill_" + i, pts, PET, { opacity: 0.16 }));
    petChildren.push(kit.stroke("petal_" + i, pts, { closed: true, color: PET, strokeWidth: 3.5, ms: MS.curve }));
    if (i === 0) leftTip = tip;
    if (i === nPet - 1) rightTip = tip;
  }
  push(kit.group("petals", petChildren));
  lab("petals", [leftTip[0] - 6, leftTip[1] + 10], "above-left", PET);
  anchors.flower = [cx, 380];
  anchors.petal_right = rightTip;

  const stamChildren = [];
  let rightAnther = [cx + 140, 420], rightMid = [cx + 66, 330], leftMid = [cx - 66, 330], leftAnther = [cx - 140, 420];
  for (let i = 0; i < nStam; i++) {
    const t = nStam === 1 ? 0 : -1 + (2 * i) / (nStam - 1);
    const ax = cx + t * (150 - 6 * Math.abs(t));
    const ay = 452 - 34 * Math.abs(t) + 8 * (i % 2);
    const base = [cx + t * 20, 244];
    const mid = [cx + t * 66, 332];
    const top = [ax, ay - 26];
    const path = kit.smooth([base, mid, top], 8);
    stamChildren.push(kit.stroke("filament_" + i, path, { color: STAM, strokeWidth: 3, ms: MS.guides }));
    const dir = Math.atan2(top[1] - mid[1], top[0] - mid[0]);
    const apts = rotEllipse([ax, ay], 26, 13, dir, 20);
    stamChildren.push(kit.area("anther_fill_" + i, apts, STAM, { opacity: 0.4 }));
    stamChildren.push(kit.stroke("anther_" + i, apts, { closed: true, color: STAM, strokeWidth: 3, ms: MS.node }));
    if (i === 0) { leftAnther = [ax, ay]; leftMid = mid; }
    if (i === nStam - 1) { rightAnther = [ax, ay]; rightMid = mid; }
  }
  push(kit.group("stamens", stamChildren));
  lab("anther", [rightAnther[0] + 6, rightAnther[1] + 10], "above-right", STAM);
  lab("filament", [rightMid[0] + 8, rightMid[1]], "right", STAM);
  lab("stamen", [leftMid[0] - 6, leftMid[1]], "left", STAM);
  anchors.anther_left = leftAnther;

  const ovC = [cx, 296];
  const ovPts = kit.blob(ovC, 68, 56, 0.05, 2);
  push(kit.area("ovary_fill", ovPts, PIS, { opacity: 0.14 }));
  push(kit.stroke("ovary", ovPts, { closed: true, color: PIS, strokeWidth: 4, ms: MS.node }));
  lab("ovary", [cx - 66, 302], "left", PIS);
  const ovuleChildren = [], ovulePos = [];
  for (let k = 0; k < 3; k++) {
    const p = [cx - 34 + k * 34, 292];
    ovulePos.push(p);
    ovuleChildren.push(disc("ovule_" + k, p, 13, PIS, undefined, 2.5, MS.dot));
    ovuleChildren.push(disc("ovule_core_" + k, p, 4, PIS, PIS, 2, MS.dot));
  }
  push(kit.group("ovules", ovuleChildren));
  lab("ovules", [ovulePos[2][0] + 12, ovulePos[2][1] - 4], "right", PIS);

  const styleCtr = kit.smooth([[cx, 344], [cx + 6, 404], [cx + 5, 466], [cx, 514]], 10);
  push(kit.group("style", [
    kit.stroke("style_l", kit.parallelOffset(styleCtr, 11), { color: PIS, strokeWidth: 3.5, ms: MS.curve }),
    kit.stroke("style_r", kit.parallelOffset(styleCtr, -11), { color: PIS, strokeWidth: 3.5, ms: MS.curve })
  ]));
  lab("style", [cx - 16, 440], "left", PIS);

  const stigC = [cx + 2, 534];
  const stigPts = kit.blob(stigC, 44, 22, 0.14, 5);
  push(kit.area("stigma_fill", stigPts, PIS, { opacity: 0.3 }));
  push(kit.stroke("stigma", stigPts, { closed: true, color: PIS, strokeWidth: 3.5, ms: MS.node }));
  const hairs = [];
  for (let k = 0; k < 5; k++) {
    const hx = stigC[0] - 30 + k * 15;
    hairs.push(kit.stroke("stigma_hair_" + k, [[hx, stigC[1] + 15], [hx + 4 * kit.jitter(k + 3), stigC[1] + 28]], { color: PIS, strokeWidth: 2, ms: MS.dot }));
  }
  push(kit.group("stigma_hairs", hairs));
  lab("stigma", [stigC[0] - 12, stigC[1] + 20], showPollen ? "above-left" : "above", PIS);
  lab("pistil", [cx + 18, 474], "right", PIS);

  if (showPollen) {
    const grains = [];
    const gpts = [[stigC[0] + 22, stigC[1] + 18], [stigC[0] + 80, stigC[1] + 58], [stigC[0] + 134, stigC[1] + 96]];
    gpts.forEach((p, k) => {
      const r0 = k === 0 ? 10 : 8;
      grains.push(disc("pollen_grain_" + k, p, r0, POL, POL, 2.5, MS.dot));
      for (let s = 0; s < 6; s++) {
        const th = s / 6 * 2 * Math.PI;
        grains.push(kit.stroke("pollen_spike_" + k + "_" + s, [[p[0] + r0 * Math.cos(th), p[1] + r0 * Math.sin(th)], [p[0] + (r0 + 5) * Math.cos(th), p[1] + (r0 + 5) * Math.sin(th)]], { color: POL, strokeWidth: 1.8, ms: MS.dot }));
      }
    });
    push(kit.group("pollen", grains));
    push(kit.stroke("pollen_path", kit.smooth([[stigC[0] + 176, stigC[1] + 140], [stigC[0] + 112, stigC[1] + 86], [stigC[0] + 42, stigC[1] + 30]], 8), { color: POL, strokeWidth: 2.5, dash: true, arrowhead: "end", ms: MS.connector }));
    lab("pollen", [gpts[0][0] + 6, gpts[0][1] + 8], "above-right", POL);
    const tube = kit.smooth([[stigC[0] + 6, stigC[1] - 14], [cx + 9, 470], [cx + 6, 404], [cx + 2, 352], [cx - 14, 314], [ovulePos[0][0] + 13, ovulePos[0][1] + 5]], 10);
    push(kit.stroke("pollen_tube", tube, { color: POL, strokeWidth: 3, dash: true, arrowhead: "end", ms: MS.curve }));
    lab("pollen_tube", [cx - 24, 480], "left", POL); anchors.pollen_tube = [cx + 6, 404];
  }

  if (showBee) {
    const bc = [800, 616], rot = -0.32, cr = Math.cos(rot), sr = Math.sin(rot);
    const Tf = (p) => [bc[0] + p[0] * cr - p[1] * sr, bc[1] + p[0] * sr + p[1] * cr];
    const body = [];
    for (let k = 0; k < 28; k++) { const th = k / 28 * 2 * Math.PI; body.push(Tf([44 * Math.cos(th), 26 * Math.sin(th)])); }
    const children = [
      kit.area("bee_body_fill", body, STAM, { opacity: 0.25 }),
      kit.stroke("bee_body", body, { closed: true, color: C.ink, strokeWidth: 3.5, ms: MS.node })
    ];
    [-14, 4, 22].forEach((sx, k) => {
      const hy = 26 * Math.sqrt(Math.max(0, 1 - (sx / 44) * (sx / 44)));
      children.push(kit.stroke("bee_stripe_" + k, [Tf([sx, -hy * 0.9]), Tf([sx, hy * 0.9])], { color: C.ink, strokeWidth: 3, ms: MS.dot }));
    });
    const head = [];
    for (let k = 0; k < 20; k++) { const th = k / 20 * 2 * Math.PI; head.push(Tf([-54 + 17 * Math.cos(th), 4 + 17 * Math.sin(th)])); }
    children.push(kit.stroke("bee_head", head, { closed: true, color: C.ink, strokeWidth: 3, ms: MS.node }));
    children.push(kit.stroke("bee_antenna_l", kit.smooth([Tf([-62, 16]), Tf([-74, 32]), Tf([-84, 44])], 6), { color: C.ink, strokeWidth: 2, ms: MS.dot }));
    children.push(kit.stroke("bee_antenna_r", kit.smooth([Tf([-50, 20]), Tf([-56, 38]), Tf([-60, 52])], 6), { color: C.ink, strokeWidth: 2, ms: MS.dot }));
    const wing = (id, c, rx, ry, a) => {
      const pts = [];
      for (let k = 0; k < 20; k++) {
        const th = k / 20 * 2 * Math.PI, x = rx * Math.cos(th), y = ry * Math.sin(th);
        pts.push(Tf([c[0] + x * Math.cos(a) - y * Math.sin(a), c[1] + x * Math.sin(a) + y * Math.cos(a)]));
      }
      return kit.stroke(id, pts, { closed: true, color: C.guide, strokeWidth: 2, ms: MS.guides });
    };
    children.push(wing("bee_wing_1", [-6, 34], 30, 13, 0.5));
    children.push(wing("bee_wing_2", [18, 30], 24, 11, 0.3));
    children.push(kit.stroke("bee_stinger", [Tf([44, -2]), Tf([58, -8])], { color: C.ink, strokeWidth: 2.5, ms: MS.dot }));
    push(kit.group("bee", children));
    lab("bee", [bc[0] + 4, bc[1] + 44], "above", C.ink);
  }

  return { drawables, labels, anchors, order };
---
template: water_cycle
title: Water cycle cross-section
version: 1
kit: 1
status: ready
description: 'A landscape cross-section of the hydrological cycle: sun in the top-left corner, ocean on the left, a mountain on the right, clouds overhead, rain or snow falling on the mountain, a river running back to the sea, and a groundwater aquifer under the surface, with curved arrows for evaporation, condensation, precipitation, runoff and infiltration (plus optional transpiration from trees). Choose this scene for any request about the water cycle or hydrological cycle, evaporation and condensation, precipitation, ''where does rain come from'', runoff and infiltration, or groundwater recharge. Stages can be shown selectively so the narration can build the cycle one step at a time.'
params:
  type: object
  properties:
    stages:
      type: array
      items:
        type: string
        enum:
          - evaporation
          - condensation
          - precipitation
          - runoff
          - infiltration
          - transpiration
      description: 'Which cycle stages to draw arrows (and labels) for. Default: evaporation, condensation, precipitation, runoff, infiltration. Use a subset to build the cycle up step by step.'
    transpiration:
      type: boolean
      description: Show trees on the land with dashed transpiration arrows rising to the cloud (default false). Equivalent to adding 'transpiration' to stages.
    groundwater:
      type: boolean
      description: Show the water table, the shaded aquifer, bedrock hatching and the groundwater flow arrow toward the sea (default true).
    labels:
      type: boolean
      description: Show stage name labels (default true). Set false when the narration will name each stage instead.
    precipType:
      type: string
      enum:
        - rain
        - snow
        - both
      description: 'Falling precipitation on the mountain: slanted rain dashes, snowflakes, or snow high up with rain lower down (default ''rain'').'
    labelText:
      type: object
      description: Override the text of individual labels (e.g. translations or simpler wording).
      properties:
        evaporation:
          type: string
        condensation:
          type: string
        precipitation:
          type: string
        runoff:
          type: string
        infiltration:
          type: string
        transpiration:
          type: string
        ocean:
          type: string
        groundwater:
          type: string
element_ids:
  sun / sun_rays: the sun disc in the top-left corner and its rays
  ocean_fill / ocean_surface: the sea on the left and its wavy surface line
  land_fill / land_surface: the land cross-section and the seabed-to-mountain profile
  trees: small trees on the lower slope (transpiration only)
  river: the river running down the slope back to the sea
  aquifer_fill / water_table / bedrock / bedrock_hatch: the groundwater zone, its dashed water table, and the impermeable bedrock
  cloud_small / cloud_small_fill / cloud_main / cloud_main_fill: the forming cloud over the sea and the big rain cloud over the mountain
  evaporation: curved arrows rising from the ocean surface
  transpiration: dashed arrows rising from the trees
  condensation: the arrow feeding vapour from the small cloud into the rain cloud
  rain / snow: the falling precipitation strokes on the mountain
  runoff: arrows of surface flow down the slope
  infiltration: arrows soaking down from the surface to the water table
  gw_flow: the dashed groundwater flow arrow back to the sea
  label_evaporation / label_condensation / label_precipitation / label_runoff / label_infiltration / label_transpiration / label_ocean / label_groundwater: the stage name labels
examples:
  - request: Draw the water cycle.
    params: {}
  - request: Explain evaporation and transpiration only — no groundwater, snow on the peak.
    params:
      stages:
        - evaporation
        - condensation
      transpiration: true
      groundwater: false
      precipType: snow
layout: |-
  const C=kit.COLORS,MS=kit.SKETCH_MS;
  const WATER=C.supply??C.ink,HEAT=C.demand??C.ink,VAPOR=C.accent??C.ink,ROCKC=C.guide??C.ink,LANDF=C.region1??C.guide;
  const allStages=["evaporation","condensation","precipitation","runoff","infiltration"];
  const stages=new Set(params.stages??allStages);
  if(params.transpiration===true)stages.add("transpiration");
  const showTrees=stages.has("transpiration");
  const showGW=params.groundwater!==false;
  const showLabels=params.labels!==false;
  const txt=params.labelText??{};
  const T=(k,d)=>(typeof txt[k]==="string"&&txt[k].length)?txt[k]:d;
  const precipType=params.precipType??"rain";
  const drawables=[],labels=[],anchors={},order=[];
  const push=d=>{drawables.push(d);order.push(d.id);};
  const lab=(id,at,side,text,color,fs)=>{if(!showLabels)return;labels.push(kit.label(id,at,side,text,{color:color,fontSize:fs??24}));order.push(id);};
  const arrows=specs=>{const out=[];for(const s of specs){for(const d of kit.edgeArrow(s[0],s[1],s[2],s[3]).drawables)out.push(d);}return out;};
  const SEA=245,BOT=60,ROCK=122;
  const prof=[[0,158],[120,150],[240,184],[330,SEA],[400,263],[470,288],[540,326],[610,384],[680,464],[745,547],[800,494],[870,434],[960,401],[1000,391]];
  const landY=x=>{if(x<=prof[0][0])return prof[0][1];for(let i=1;i<prof.length;i++){if(x<=prof[i][0]){const a=prof[i-1],b=prof[i];return a[1]+(b[1]-a[1])*((x-a[0])/(b[0]-a[0]));}}return prof[prof.length-1][1];};
  const wt=x=>Math.min(landY(x)-45,SEA-8+(landY(x)-SEA)*0.32);

  push(kit.ball("sun",[112,652],50,{fill:HEAT,ms:MS.node}));
  const rays=[];
  for(let i=0;i<8;i++){const th=i*Math.PI/4+0.2;rays.push(kit.stroke("ray_"+i,[[112+58*Math.cos(th),652+58*Math.sin(th)],[112+84*Math.cos(th),652+84*Math.sin(th)]],{color:HEAT,strokeWidth:3,ms:MS.guides}));}
  push(kit.group("sun_rays",rays));
  anchors.sun=[112,652];

  push(kit.area("ocean_fill",[[0,SEA],[330,SEA],[240,184],[120,150],[0,158]],WATER,{opacity:0.3,ms:MS.region}));
  push(kit.stroke("ocean_surface",kit.wave([0,SEA],332,4,95,6),{color:WATER,strokeWidth:3.5,ms:MS.curve}));
  anchors.ocean=[150,205];
  lab("label_ocean",[150,205],"below",T("ocean","Ocean"),WATER);

  const surf=kit.smooth(prof,6);
  push(kit.area("land_fill",surf.concat([[1000,BOT],[0,BOT]]),LANDF,{opacity:0.2,ms:MS.region}));
  push(kit.stroke("land_surface",surf,{strokeWidth:4.5,ms:MS.curve}));
  anchors.mountain=[745,560];

  if(showTrees){
    const trees=[];
    [420,482,545].forEach((x,i)=>{const y=landY(x);trees.push(kit.stroke("tree_t"+i,[[x,y],[x,y+34]],{strokeWidth:3,ms:MS.guides}));trees.push(kit.stroke("tree_c"+i,kit.blob([x,y+54],22,25,0.12,i+1),{closed:true,strokeWidth:3,ms:MS.node}));});
    push(kit.group("trees",trees));
  }

  const rxs=[742,700,655,610,560,505,450,400,336];
  const riverPts=kit.smooth(rxs.map(x=>[x,landY(x)-13]),6);
  push(kit.stroke("river",riverPts,{color:WATER,strokeWidth:5,arrowhead:"end",ms:MS.curve}));
  anchors.river=[505,landY(505)-13];

  if(showGW){
    const wtPts=[];
    for(let x=332;x<=1000;x+=42)wtPts.push([x,wt(x)]);
    wtPts.push([1000,wt(1000)]);
    push(kit.area("aquifer_fill",wtPts.concat([[1000,ROCK],[332,ROCK]]),WATER,{opacity:0.22,ms:MS.region}));
    push(kit.stroke("water_table",kit.smooth(wtPts,4),{color:WATER,strokeWidth:3,dash:true,ms:MS.curve}));
    push(kit.stroke("bedrock",kit.smooth([[300,ROCK-4],[560,ROCK+6],[800,ROCK-2],[1000,ROCK+4]],4),{color:ROCKC,strokeWidth:3,ms:MS.curve}));
    const hs=kit.hatch([330,ROCK-6],[1000,ROCK-2],12,18,-1).map((s,i)=>kit.stroke("rock_h_"+i,s,{color:ROCKC,strokeWidth:2,ms:MS.guides}));
    push(kit.group("bedrock_hatch",hs));
    anchors.groundwater=[470,200];
    lab("label_groundwater",[470,200],"below",T("groundwater","Groundwater"),WATER);
  }

  const cloudPts=(c,rx,ry,ph)=>{const pts=[];const n=56;for(let i=0;i<n;i++){const th=(i/n)*2*Math.PI;const bump=1+0.16*Math.sin(3*th+ph)+0.09*Math.sin(6*th+ph*2);const flat=Math.sin(th)<0?0.42:1;pts.push([c[0]+rx*bump*Math.cos(th),c[1]+ry*bump*flat*Math.sin(th)]);}return pts;};
  const cs=[430,612],cm=[700,650];
  push(kit.area("cloud_small_fill",cloudPts(cs,72,40,0.7),ROCKC,{opacity:0.16,ms:MS.region}));
  push(kit.stroke("cloud_small",cloudPts(cs,72,40,0.7),{closed:true,strokeWidth:3.5,ms:MS.curve}));
  push(kit.area("cloud_main_fill",cloudPts(cm,122,57,2.1),ROCKC,{opacity:0.22,ms:MS.region}));
  push(kit.stroke("cloud_main",cloudPts(cm,122,57,2.1),{closed:true,strokeWidth:4,ms:MS.curve}));
  anchors.cloud=cm;

  if(stages.has("evaporation")){
    push(kit.group("evaporation",arrows([["evap_1",[140,262],[300,548],{curve:-0.28,color:VAPOR,strokeWidth:3.5,ms:MS.connector}],["evap_2",[250,258],[372,558],{curve:-0.22,color:VAPOR,strokeWidth:3.5,ms:MS.connector}]])));
    anchors.evaporation=[210,400];
    lab("label_evaporation",[175,420],"left",T("evaporation","Evaporation"),VAPOR);
  }

  if(showTrees){
    push(kit.group("transpiration",arrows([["transp_1",[420,landY(420)+84],[412,566],{curve:0.16,color:VAPOR,strokeWidth:3,dash:true,ms:MS.connector}],["transp_2",[520,landY(520)+84],[468,566],{curve:-0.14,color:VAPOR,strokeWidth:3,dash:true,ms:MS.connector}]])));
    anchors.transpiration=[490,430];
    lab("label_transpiration",[540,455],"right",T("transpiration","Transpiration"),VAPOR);
  }

  if(stages.has("condensation")){
    push(kit.group("condensation",arrows([["cond_1",[512,618],[568,644],{curve:0.22,color:VAPOR,strokeWidth:3.5,ms:MS.connector}]])));
    anchors.condensation=[540,655];
    lab("label_condensation",[522,690],"above",T("condensation","Condensation"),VAPOR);
  }

  if(stages.has("precipitation")){
    const rain=[],snow=[];
    for(let i=0;i<20;i++){
      const x=622+Math.abs(kit.jitter(i*3+1))*180;
      const lo=landY(x)+30,hi=604;
      if(hi-lo<34)continue;
      const y=lo+Math.abs(kit.jitter(i*5+7))*(hi-lo);
      const isSnow=precipType==="snow"||(precipType!=="rain"&&landY(x)>470);
      if(isSnow){
        snow.push(kit.stroke("snow_"+i+"_a",[[x-8,y],[x+8,y]],{color:WATER,strokeWidth:2.5,ms:MS.dot}));
        snow.push(kit.stroke("snow_"+i+"_b",[[x-5,y-7],[x+5,y+7]],{color:WATER,strokeWidth:2.5,ms:MS.dot}));
        snow.push(kit.stroke("snow_"+i+"_c",[[x-5,y+7],[x+5,y-7]],{color:WATER,strokeWidth:2.5,ms:MS.dot}));
      }else{
        rain.push(kit.stroke("rain_"+i,[[x+6,y+24],[x,y]],{color:WATER,strokeWidth:3,ms:MS.dot}));
      }
    }
    if(rain.length)push(kit.group("rain",rain));
    if(snow.length)push(kit.group("snow",snow));
    anchors.precipitation=[715,560];
    lab("label_precipitation",[822,530],"right",T("precipitation",precipType==="snow"?"Precipitation (snow)":"Precipitation"),WATER);
  }

  if(stages.has("runoff")){
    push(kit.group("runoff",arrows([["runoff_1",[672,landY(672)+26],[600,landY(600)+22],{curve:-0.16,color:WATER,strokeWidth:3.5,ms:MS.connector}],["runoff_2",[520,landY(520)+22],[430,landY(430)+18],{curve:-0.16,color:WATER,strokeWidth:3.5,ms:MS.connector}]])));
    anchors.runoff=[560,landY(560)+40];
    lab("label_runoff",[578,landY(578)+52],"above-right",T("runoff","Runoff"),WATER);
  }

  if(stages.has("infiltration")){
    const inf=[];
    [470,565,655].forEach((x,i)=>{
      const y0=landY(x)-8;
      const tgt=showGW?wt(x)+10:y0-70;
      if(y0-tgt>18){for(const d of arrows([["infil_"+i,[x,y0],[x+12,tgt],{curve:0.15,color:WATER,strokeWidth:3,ms:MS.connector}]]))inf.push(d);}
    });
    if(inf.length)push(kit.group("infiltration",inf));
    anchors.infiltration=[600,330];
    lab("label_infiltration",[648,342],"right",T("infiltration","Infiltration"),WATER);
  }

  if(showGW){
    push(kit.group("gw_flow",arrows([["gwflow_1",[600,255],[352,196],{curve:0.1,color:WATER,strokeWidth:3,dash:true,ms:MS.connector}]])));
  }

  return {drawables:drawables,labels:labels,anchors:anchors,order:order};
