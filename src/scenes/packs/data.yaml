pack: data
title: Data charts & tables
description: Bar charts and tables drawn from data — typed by the author or computed by a code element's script and referenced with "{id.var}" tokens — as vector geometry the animate verb can tween stage by stage.
---
template: bar_chart
title: Bar chart
version: 2
kit: 5
status: ready
description: >-
  A bar chart from data: categories along the x axis, one bar per category
  (grouped bars with `series`), drawn as ink so it animates as geometry.
  `values` may be one list (a static chart) or a list of lists — STAGES of
  the same chart — and the numeric `stage` param picks which one is shown;
  a fractional stage interpolates, so `animate: {stage: 1}` plays the change
  as bars growing and shrinking. Feed it typed numbers, or a code element's
  variables via "{id.var}" tokens (labels typed by hand keep the bar_i beats
  alive before the script has run). Choose this scene for ANY request for a
  bar chart, a column chart, a histogram (compute the bins in Python), a
  comparison across categories or years, or "show how these numbers change".
params:
  type: object
  properties:
    labels:
      oneOf:
        - { type: array, items: { type: string }, maxItems: 40 }
        - { type: string, pattern: "^\\{[A-Za-z][A-Za-z0-9_]*\\.[A-Za-z_][A-Za-z0-9_.]*\\}$" }
      description: "Category names under the bars, one per bar. TYPE these by hand even when values come from a script — the storyboard's bar_i beats exist only when the bar count is known before the script runs. A \"{id.var}\" token (a DataFrame column of names, say) works too, at that cost."
    values:
      oneOf:
        - { type: array, items: { type: number }, maxItems: 40 }
        - { type: array, items: { type: array, items: { type: number }, maxItems: 40 }, minItems: 1, maxItems: 12 }
        - { type: string, pattern: "^\\{[A-Za-z][A-Za-z0-9_]*\\.[A-Za-z_][A-Za-z0-9_.]*\\}$" }
      description: "One series: a list of numbers (static), or a list of lists (STAGES — depth means staged; every stage has one number per label, a missing one counts as 0), or a \"{id.var}\" token naming a code element's variable."
    series:
      type: array
      maxItems: 6
      items:
        type: object
        properties:
          name: { type: string }
          values:
            oneOf:
              - { type: array, items: { type: number }, maxItems: 40 }
              - { type: array, items: { type: array, items: { type: number }, maxItems: 40 }, minItems: 1, maxItems: 12 }
              - { type: string, pattern: "^\\{[A-Za-z][A-Za-z0-9_]*\\.[A-Za-z_][A-Za-z0-9_.]*\\}$" }
        required: [values]
      description: "Several series → grouped bars with a legend. Use INSTEAD of values. Each series' values follow the same static/staged/token rule."
    stage:
      type: number
      minimum: 0
      x-max-from: ["values", "series.0.values"]
      description: "Which stage is shown (0-based; default 0). Fractional values interpolate between adjacent stages — the animate verb's target: {\"animate\": {\"stage\": 1}}. Write the starting stage explicitly."
    value_labels:
      type: boolean
      description: "Write each bar's value above it (default false)."
    stacked:
      type: boolean
      description: "Stack the series on top of each other instead of grouping them side by side (requires `series`). The y scale then comes from the stack TOTAL. Use for composition — how a total splits — not for comparing series to each other. Values must all be positive: a stack of mixed signs misstates the total, so it falls back to grouped bars and reports the problem."
    gap:
      type: number
      minimum: 0
      maximum: 0.8
      description: "Space between category groups as a fraction of a slot (default 0.35)."
    box:
      type: object
      properties:
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }
      required: [x, y, w, h]
      description: "Plot area in logical units (lower-left corner, width, height) when the chart shares the canvas with something else — a code panel on the left, say. Default: the standard plot area."
    ylim:
      type: array
      items: { type: number }
      minItems: 2
      maxItems: 2
      description: "Fixed y range [low, high]. Default: 0 to the largest value across ALL stages (plus headroom), so the frame never jumps during a tween."
    x_label:
      type: string
    y_label:
      type: string
    title:
      type: string
element_ids:
  axes: the x and y axes with their captions (and a dashed zero line when values go negative)
  bar_1: "the first category's bar (its fill, outline, category label and value label; bar_2, bar_3, … likewise) — one per label, at every stage"
  legend: the series legend (only with several series)
  title: figure title, when set
  note: the refusal note, drawn only when a request could not be honoured
examples:
  - request: "Bar chart of GDP per capita for Norway, Sweden and Denmark."
    params:
      labels: ["Norway", "Sweden", "Denmark"]
      values: [87, 52, 58]
      y_label: "USD (thousands)"
      title: "GDP per capita"
  - request: "Show how the three countries' GDP changed from 2010 to 2020, one stage per year."
    params:
      labels: ["Norway", "Sweden", "Denmark"]
      values: [[87, 52, 58], [67, 52, 61]]
      stage: 0
      value_labels: true
      title: "GDP per capita, 2010 → 2020"
  - request: "Grouped bars: treated vs control, before and after."
    params:
      labels: ["Before", "After"]
      series:
        - { name: "Treated", values: [10, 16] }
        - { name: "Control", values: [10, 11] }
      y_label: "Outcome"
  - request: "Stacked bars: how total health spending splits between hospitals, primary care and drugs, 2015 vs 2020."
    params:
      labels: ["2015", "2020"]
      stacked: true
      value_labels: true
      series:
        - { name: "Hospitals", values: [52, 61] }
        - { name: "Primary care", values: [24, 29] }
        - { name: "Drugs", values: [14, 18] }
      y_label: "Billion NOK"
      title: "Health spending by sector"
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const num = (v, d) => (typeof v === "number" && Number.isFinite(v) ? v : d);
  const str = (v, d) => (typeof v === "string" && v.trim() !== "" ? v.trim() : d);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const isNumRow = (a) => Array.isArray(a) && a.every((v) => v === null || (typeof v === "number" && Number.isFinite(v)));
  // values: number[] (one stage) or number[][] (staged — depth means staged).
  // Anything else — an unresolved "{code.var}" token before the script has
  // run, say — is "no data yet".
  const toStages = (v) => {
    if (!Array.isArray(v) || v.length === 0) return null;
    if (Array.isArray(v[0])) return v.every(isNumRow) ? v.slice(0, 12) : null;
    return isNumRow(v) ? [v] : null;
  };
  const series = [];
  if (Array.isArray(params.series)) {
    params.series.slice(0, 6).forEach((s, k) => {
      const st = toStages(s && s.values);
      // A series whose values are not data yet (a "{code.var}" token before the
      // script has run) still COUNTS: a zero series keeps m, the legend and the
      // per-series colours identical before and after substitution.
      series.push({ name: str(s && s.name, "Series " + (k + 1)), stages: st || [[]] });
    });
  } else {
    const st = toStages(params.values);
    if (st) series.push({ name: "", stages: st });
  }
  const labels = (Array.isArray(params.labels) ? params.labels : [])
    .filter((l) => typeof l === "string" || typeof l === "number")
    .map(String)
    .slice(0, 40);
  let n = labels.length;
  for (const s of series) for (const st of s.stages) n = Math.max(n, st.length);
  n = Math.min(40, n);
  // The promise idiom: typed labels but no data yet → n bars of height 0, so
  // the storyboard's bar_i beats exist offline and before the script has run.
  if (series.length === 0 && n > 0) series.push({ name: "", stages: [labels.map(() => 0)] });
  let K = 1;
  for (const s of series) K = Math.max(K, s.stages.length);
  const stage = clamp(num(params.stage, 0), 0, K - 1);
  const k0 = Math.floor(stage), k1 = Math.min(K - 1, k0 + 1), t = stage - k0;
  // A series with fewer stages than K holds its last stage; a missing bar is 0.
  const atStage = (s, k, i) => {
    const st = s.stages[Math.min(k, s.stages.length - 1)];
    const v = st[i];
    return typeof v === "number" ? v : 0;
  };
  const value = (s, i) => atStage(s, k0, i) + (atStage(s, k1, i) - atStage(s, k0, i)) * t;

  const wantStacked = params.stacked === true && series.length > 1;
  const negatives = wantStacked
    ? series.filter((s) => s.stages.some((st) => st.some((v) => typeof v === "number" && v < 0)))
    : [];
  const stacked = wantStacked && negatives.length === 0;
  // A body cannot raise a lint issue (SceneLayout has no warning channel), so
  // a refusal is drawn: a short note under the id "note", above the plot.
  const note = wantStacked && negatives.length > 0
    ? `stacked bars need non-negative values — "${negatives[0].name}" has one, so these are grouped`
    : null;

  // Limits over ALL stages, so the frame never jumps mid-tween. Bars start at
  // 0. Stacked charts scale to the STACK TOTAL per label per stage, not the
  // largest single value — a grouped-bar scan would under-scale the columns.
  let lo = 0, hi = 0;
  if (stacked) {
    for (let k = 0; k < K; k++) {
      for (let i = 0; i < n; i++) {
        let tot = 0;
        for (const s of series) { const v = atStage(s, k, i); if (typeof v === "number") tot += v; }
        hi = Math.max(hi, tot);
        lo = Math.min(lo, 0);
      }
    }
  } else {
    for (const s of series) for (const st of s.stages) for (const v of st) if (typeof v === "number") { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  }
  const ylim = Array.isArray(params.ylim) && params.ylim.length === 2 && params.ylim.every((v) => typeof v === "number" && Number.isFinite(v)) ? params.ylim : null;
  let yMin = ylim ? Math.min(ylim[0], ylim[1]) : lo;
  let yMax = ylim ? Math.max(ylim[0], ylim[1]) : hi;
  if (!ylim) {
    const pad = (yMax - yMin) * 0.08;
    if (yMax > 0) yMax += pad;
    if (yMin < 0) yMin -= pad;
  }
  if (yMax - yMin < 1e-9) yMax = yMin + 1;

  const b = params.box;
  const boxed = b && typeof b === "object" && [b.x, b.y, b.w, b.h].every((v) => typeof v === "number" && Number.isFinite(v)) && b.w > 0 && b.h > 0;
  // Always a fresh object (never params.box itself) — the top is adjusted below.
  const plot = boxed ? { x0: b.x, y0: b.y, x1: b.x + b.w, y1: b.y + b.h } : kit.plotArea();
  const title = str(params.title, "");
  // The title and the y-axis caption both want the strip above the plot, and
  // the caption gets there first (it hangs off the y arrow's tip). There is no
  // room for both, so a DRAWN TITLE COSTS 55 UNITS OF PLOT HEIGHT — the
  // did_trends convention: caption just over the arrow, title clear above it.
  // The cost is the same whether the top is the default or the author's box:
  // a box says where the plot goes, not that a title may sit on the caption.
  // Never below the plot's own floor: a box that already sits above 620 would
  // otherwise invert (y1 < y0) and draw the chart upside down.
  if (title) plot.y1 = Math.max(plot.y0, Math.min(plot.y1, 620));
  const Y = (v) => plot.y0 + ((v - yMin) / (yMax - yMin)) * (plot.y1 - plot.y0);
  const base = Y(clamp(0, yMin, yMax)); // the bars' baseline: the zero line, or the axis when 0 is off-scale
  const m = series.length;
  const slotW = (plot.x1 - plot.x0) / Math.max(1, n);
  const gap = clamp(num(params.gap, 0.35), 0, 0.8);
  const groupW = slotW * (1 - gap);
  const barW = groupW / Math.max(1, m);
  const xLab = str(params.x_label, "");
  const yLab = str(params.y_label, "");
  const showValues = params.value_labels === true;
  // Value labels carry the data's own precision (at most 2 decimals).
  let dec = 0;
  for (const s of series) for (const st of s.stages) for (const v of st) {
    if (typeof v === "number" && !Number.isInteger(v)) dec = Math.min(2, Math.max(dec, (String(v).split(".")[1] || "").length));
  }
  const fmt = (v) => (dec === 0 ? String(Math.round(v)) : v.toFixed(dec));

  const drawables = [], labelReqs = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };

  const axesChildren = [
    kit.stroke("axes__x", [[plot.x0 - 6, plot.y0], [plot.x1 + kit.AXIS_OVERHANG, plot.y0]], { arrowhead: "end", strokeWidth: 4, ms: MS.axis }),
    kit.stroke("axes__y", [[plot.x0, plot.y0 - 6], [plot.x0, plot.y1 + kit.AXIS_OVERHANG]], { arrowhead: "end", strokeWidth: 4, ms: MS.axis }),
  ];
  // Ruling I/J: a stacked x caption (a long phrase, placed above/left of the
  // arrow tip rather than inline past it) sits in the same row as bar_i__l's
  // category labels — drop it one row lower so it clears them.
  const X_CAPTION_DROP = 28; // a stacked x caption sits one row below the end marks / category labels
  if (xLab) {
    const xCaption = kit.axisLabel("axes__x_label", "x", plot, xLab, { fontSize: 22 });
    if (xCaption.anchor === "end") xCaption.pos[1] = plot.y0 - 20 - X_CAPTION_DROP;
    axesChildren.push(xCaption);
  }
  if (yLab) axesChildren.push(kit.axisLabel("axes__y_label", "y", plot, yLab, { fontSize: 22 }));
  if (yMin < 0) axesChildren.push(kit.stroke("axes__zero", [[plot.x0, base], [plot.x1, base]], { color: C.guide, dash: true, strokeWidth: 2, ms: MS.guides }));
  push(kit.group("axes", axesChildren));
  anchors.axes = [plot.x0, plot.y0];

  if (note) {
    const notePos = [plot.x0, plot.y1 - 16];
    push(kit.text("note", notePos, note, { fontSize: 16, color: C.guide, anchor: "start" }));
    anchors.note = notePos;
  }

  // Stacked: one column per category, segments piled bottom-up in series
  // order. The baseline is the running total BELOW this segment, computed
  // from interpolated values so a fractional stage re-proportions smoothly.
  const baseFor = (i, j) => {
    let b = 0;
    for (let q = 0; q < j; q++) b += value(series[q], i);
    return b;
  };

  const labelSize = n > 12 ? 13 : 17;
  for (let i = 0; i < n; i++) {
    const id = "bar_" + (i + 1);
    const xc = plot.x0 + slotW * (i + 0.5);
    const children = [];
    let reach = base;
    series.forEach((s, j) => {
      const v = value(s, i);
      // Grouped bars sit side by side within the category slot; stacked bars
      // share the whole slot width and pile on top of the running total.
      const x = stacked
        ? plot.x0 + slotW * i + (slotW - groupW) / 2
        : plot.x0 + slotW * i + (slotW - groupW) / 2 + barW * j;
      const w = stacked ? groupW : barW;
      const segBase = stacked ? baseFor(i, j) : 0;
      const yBase = stacked ? Y(clamp(segBase, yMin, yMax)) : base;
      const yv = stacked ? Y(clamp(segBase + v, yMin, yMax)) : Y(clamp(v, yMin, yMax));
      const lo2 = Math.min(yBase, yv), hi2 = Math.max(yBase, yv);
      const color = C.series[j % C.series.length];
      const rect = [[x, lo2], [x + w, lo2], [x + w, hi2], [x, hi2]];
      children.push(kit.area(id + "__f" + j, rect, color, { opacity: 0.55 }));
      children.push(kit.stroke(id + "__o" + j, rect, { closed: true, color, strokeWidth: 2.5, ms: MS.stroke }));
      // A stacked segment gets its own label only when it is tall enough to
      // hold one (26 units of drawn height); the stack total is written
      // above the column instead, once, below.
      if (showValues && (!stacked || hi2 - lo2 >= 26)) {
        children.push(kit.text(id + "__v" + j, [x + w / 2, v >= 0 ? hi2 + 13 : lo2 - 13], fmt(v), { fontSize: 15, color: C.guide }));
      }
      reach = v >= 0 ? Math.max(reach, hi2) : Math.min(reach, lo2);
    });
    if (stacked && showValues) {
      const total = series.reduce((sum, s) => sum + value(s, i), 0);
      children.push(kit.text(id + "__total", [xc, Y(clamp(total, yMin, yMax)) + 13], fmt(total), { fontSize: 15, color: C.guide }));
    }
    children.push(kit.text(id + "__l", [xc, plot.y0 - 20], labels[i] !== undefined ? labels[i] : String(i + 1), { fontSize: labelSize }));
    push(kit.group(id, children));
    anchors[id] = [xc, (base + reach) / 2];
  }

  if (m >= 2) {
    const lx = plot.x1 - 150, ly = plot.y1 - 16;
    const children = [];
    series.forEach((s, j) => {
      const y = ly - j * 24;
      const color = C.series[j % C.series.length];
      children.push(kit.area("legend__s" + j, [[lx, y - 8], [lx + 18, y - 8], [lx + 18, y + 8], [lx, y + 8]], color, { opacity: 0.55 }));
      children.push(kit.text("legend__t" + j, [lx + 26, y], s.name, { fontSize: 16, anchor: "start" }));
    });
    push(kit.group("legend", children));
    anchors.legend = [lx + 70, ly - (m - 1) * 12];
  }

  if (title) {
    // Read the caption's real position rather than assuming one: it is centred
    // at (arrow tip + gap + half its box), and its box grows with its font.
    // 40 is what it takes for the two BOXES to clear by the lint's own measure:
    // half a 30pt title (18.75) + half a 22pt caption (13.75) + the 2-unit pad
    // lintLayout adds to each side. 730 is the last line a 30pt title can sit
    // on and stay inside the canvas.
    let ty = Math.min(700, plot.y1 + 25);
    const yCap = axesChildren.find((d) => d.id === "axes__y_label");
    if (yCap) ty = Math.max(ty, yCap.pos[1] + 40);
    ty = Math.min(ty, 730);
    push(kit.text("title", [(plot.x0 + plot.x1) / 2, ty], title, { fontSize: 30 }));
    anchors.title = [(plot.x0 + plot.x1) / 2, ty];
  }
  return { drawables, labels: labelReqs, anchors, order };
---
template: data_table
title: Data table
version: 1
kit: 5
status: ready
description: >-
  A ruled table from data: a header row over an ink rule, then one drawable
  per row (`row_1`, `row_2`, …) so a table can fill in row by row on
  narration beats. Columns size to their content; numeric columns are
  right-aligned and formatted with `decimals`. Feed it typed `columns` and
  `rows`, or a code element's whole DataFrame with `data: "{id.df}"`. Choose
  this scene for ANY request to show a table of numbers, a comparison grid,
  a schedule of values year by year, or the rows of a data frame.
params:
  type: object
  properties:
    columns:
      type: array
      items: { type: string }
      maxItems: 8
      description: "Header labels, one per column."
    rows:
      type: array
      maxItems: 200
      items:
        type: array
        items:
          oneOf: [{ type: number }, { type: string }, { type: "null" }]
      description: "Cell values, one array per row (numbers stay numbers — they are formatted by decimals; strings are shown as written). At most 24 rows are drawn."
    data:
      oneOf:
        - type: object
          properties:
            columns: { type: array, items: { type: string } }
            rows: { type: array, items: { type: array } }
          required: [columns, rows]
        - { type: string, pattern: "^\\{[A-Za-z][A-Za-z0-9_]*\\.[A-Za-z_][A-Za-z0-9_.]*\\}$" }
      description: "A whole DataFrame — {columns, rows} as the runtime harvests it — usually as a \"{id.df}\" token. Explicit columns/rows win when both are given."
    decimals:
      type: integer
      minimum: 0
      maximum: 6
      description: "Decimals for non-integer numbers (default 2)."
    font_size:
      type: number
      minimum: 12
      maximum: 30
      description: "Cell text size (default 20)."
    box:
      type: object
      properties:
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }
      required: [x, y, w, h]
      description: "Where the table sits (lower-left corner, width, height) when it shares the canvas. Default: the standard plot area; the table hangs from its top edge."
    title:
      type: string
element_ids:
  header: the header row (column names over an ink rule)
  row_1: "the first data row (row_2, row_3, … likewise) — draw them one per beat to fill the table in"
  more: "the '… N more rows' line when the data exceeds what fits"
  title: figure title, when set
examples:
  - request: "A table of 100 growing at 2 percent and 7 percent, every ten years for thirty years."
    params:
      columns: ["Year", "2 %", "7 %"]
      rows:
        - [0, 100, 100]
        - [10, 121.9, 196.7]
        - [20, 148.6, 387.0]
        - [30, 181.1, 761.2]
      decimals: 1
      title: "Compounding, decade by decade"
  - request: "Show the three countries and their GDP per capita as a table."
    params:
      columns: ["Country", "GDP per capita"]
      rows:
        - ["Norway", 87]
        - ["Sweden", 52]
        - ["Denmark", 58]
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const num = (v, d) => (typeof v === "number" && Number.isFinite(v) ? v : d);
  const str = (v, d) => (typeof v === "string" && v.trim() !== "" ? v.trim() : d);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  // data: a harvested DataFrame ({columns, rows}); a still-unresolved token is a string → no data.
  const data = params.data && typeof params.data === "object" ? params.data : null;
  const columns = (Array.isArray(params.columns) ? params.columns : data && Array.isArray(data.columns) ? data.columns : [])
    .map(String)
    .slice(0, 8);
  const rowsIn = Array.isArray(params.rows) ? params.rows : data && Array.isArray(data.rows) ? data.rows : [];
  const dec = clamp(Math.round(num(params.decimals, 2)), 0, 6);
  const cell = (c) => (c === null || c === undefined ? "" : typeof c === "number" ? (Number.isInteger(c) ? String(c) : c.toFixed(dec)) : String(c));
  const rows = rowsIn.filter(Array.isArray).map((r) => columns.map((_, j) => cell(r[j])));
  const fontSize = clamp(num(params.font_size, 20), 12, 30);
  const rowH = fontSize * 1.6;
  const b = params.box;
  const box = b && typeof b === "object" && [b.x, b.y, b.w, b.h].every((v) => typeof v === "number" && Number.isFinite(v)) && b.w > 0 && b.h > 0
    ? { x0: b.x, y0: b.y, x1: b.x + b.w, y1: b.y + b.h }
    : kit.plotArea();
  const CAP = 24;
  const fit = Math.max(1, Math.floor((box.y1 - box.y0) / rowH) - 2); // header + a "more" line
  const shown = rows.slice(0, Math.min(CAP, fit));
  const more = rows.length - shown.length;

  const drawables = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  if (columns.length === 0) return { drawables, labels: [], anchors, order };

  // Column widths ∝ the widest cell (header included), clamped into the box.
  const charW = fontSize * 0.55;
  const raw = columns.map((c, j) => Math.max(c.length, 1, ...shown.map((r) => r[j].length)) * charW + fontSize);
  const total = raw.reduce((a, v) => a + v, 0) || 1;
  const widths = raw.map((w) => (w / total) * (box.x1 - box.x0));
  const colX = (j) => box.x0 + widths.slice(0, j).reduce((a, v) => a + v, 0);
  const rowTop = (r) => box.y1 - r * rowH; // r = 0 → the header's top edge
  const numeric = columns.map((_, j) => shown.length > 0 && shown.every((r) => r[j] === "" || /^-?\d[\d.,]*%?$/.test(r[j])));
  const cellText = (id, r, j, text, color) =>
    kit.text(id, [numeric[j] ? colX(j) + widths[j] - fontSize / 2 : colX(j) + fontSize / 2, rowTop(r) - rowH / 2], text, {
      fontSize,
      anchor: numeric[j] ? "end" : "start",
      ...(color ? { color } : {}),
    });

  const head = columns.map((c, j) => cellText("header__c" + j, 0, j, c, C.ink));
  head.push(kit.stroke("header__rule", [[box.x0, rowTop(1)], [box.x1, rowTop(1)]], { strokeWidth: 2.5, ms: MS.stroke }));
  push(kit.group("header", head));
  anchors.header = [(box.x0 + box.x1) / 2, rowTop(0) - rowH / 2];

  shown.forEach((r, i) => {
    const id = "row_" + (i + 1);
    const kids = r.map((text, j) => cellText(id + "__c" + j, i + 1, j, text));
    kids.push(kit.stroke(id + "__rule", [[box.x0, rowTop(i + 2)], [box.x1, rowTop(i + 2)]], { color: C.guide, strokeWidth: 1, instant: true }));
    push(kit.group(id, kids));
    anchors[id] = [(box.x0 + box.x1) / 2, rowTop(i + 1) - rowH / 2];
  });

  if (more > 0) {
    const y = rowTop(shown.length + 1) - rowH / 2;
    push(kit.text("more", [box.x0 + fontSize / 2, y], "… " + more + " more rows", { fontSize, anchor: "start", color: C.guide }));
    anchors.more = [(box.x0 + box.x1) / 2, y];
  }

  const title = str(params.title, "");
  if (title) {
    const ty = Math.min(700, box.y1 + 25);
    push(kit.text("title", [(box.x0 + box.x1) / 2, ty], title, { fontSize: 30 }));
    anchors.title = [(box.x0 + box.x1) / 2, ty];
  }
  return { drawables, labels: [], anchors, order };
---
template: line_chart
title: Line chart
version: 1
kit: 5
status: ready
description: >-
  A line chart from data: one or more series over a numeric or categorical
  x, each line ending in its own name, drawn as ink so it animates as
  geometry. `values` may be one list (static) or a list of lists — STAGES
  of the same chart — and the numeric `stage` param picks which one is
  shown; a fractional stage interpolates, so `animate: {stage: 1}` plays
  the change, and a series given prefix by prefix draws itself in from its
  last point. Feed it typed numbers, or a code element's variables via
  "{id.var}" tokens (name the series by hand so the line_k beats exist
  before the script has run). Choose this scene for ANY request for a line
  chart, a trend over time, a curve computed from data, two scenarios
  compared over time, or "show how this develops".
params:
  type: object
  properties:
    x:
      oneOf:
        - { type: array, items: { type: number }, maxItems: 2000 }
        - { type: array, items: { type: string }, maxItems: 2000 }
        - { type: string, pattern: "^\\{[A-Za-z][A-Za-z0-9_]*\\.[A-Za-z_][A-Za-z0-9_.]*\\}$" }
      description: "x positions: numbers (a real axis), strings (categories under the axis), or a \"{id.var}\" token. Omitted: 1, 2, 3, …"
    values:
      oneOf:
        - { type: array, items: { type: number }, maxItems: 2000 }
        - { type: array, minItems: 1, items: { type: array, items: { type: number }, maxItems: 2000 }, maxItems: 12 }
        - { type: string, pattern: "^\\{[A-Za-z][A-Za-z0-9_]*\\.[A-Za-z_][A-Za-z0-9_.]*\\}$" }
      description: "One series: a list of numbers (static), a list of lists (STAGES — depth means staged; a shorter stage reveals the line prefix by prefix), or a \"{id.var}\" token."
    series:
      type: array
      maxItems: 6
      items:
        type: object
        properties:
          name: { type: string }
          values:
            oneOf:
              - { type: array, items: { type: number }, maxItems: 2000 }
              - { type: array, minItems: 1, items: { type: array, items: { type: number }, maxItems: 2000 }, maxItems: 12 }
              - { type: string, pattern: "^\\{[A-Za-z][A-Za-z0-9_]*\\.[A-Za-z_][A-Za-z0-9_.]*\\}$" }
        required: [values]
      description: "Several lines, each ending in its name. Use INSTEAD of values. Each series' values follow the same static/staged/token rule."
    stage:
      type: number
      minimum: 0
      x-max-from: ["values", "series.0.values"]
      description: "Which stage is shown (0-based; default 0). Fractional values interpolate — the animate verb's target: {\"animate\": {\"stage\": 1}}. Write the starting stage explicitly."
    points:
      type: boolean
      description: "Dots at the data points (default false)."
    smooth:
      type: boolean
      description: "Catmull–Rom smoothing through the points (default false; keep off for step-like data)."
    box:
      type: object
      properties: { x: { type: number }, y: { type: number }, w: { type: number }, h: { type: number } }
      required: [x, y, w, h]
      description: "Plot area (lower-left corner, width, height) when the chart shares the canvas. Default: the standard plot area."
    xlim:
      type: array
      items: { type: number }
      minItems: 2
      maxItems: 2
      description: "Fixed x range for numeric x."
    ylim:
      type: array
      items: { type: number }
      minItems: 2
      maxItems: 2
      description: "Fixed y range. Default: the data's range across ALL stages plus headroom, so the frame never jumps."
    x_label: { type: string }
    y_label: { type: string }
    title: { type: string }
element_ids:
  axes: the x and y axes with their captions and end values
  line_1: "the first series: its polyline, optional dots, and its name at the end (line_2, … likewise)"
  title: figure title, when set
examples:
  - request: "Plot 100 growing at 2 and 7 percent over 50 years as two curves."
    params:
      x: [0, 10, 20, 30, 40, 50]
      series:
        - { name: "2 %", values: [100, 122, 149, 181, 221, 269] }
        - { name: "7 %", values: [100, 197, 387, 761, 1497, 2946] }
      y_label: "Value of 100"
      x_label: "Years"
  - request: "A line that is revealed point by point as the narration walks along it."
    params:
      x: ["Mon", "Tue", "Wed", "Thu", "Fri"]
      values: [[3, 5], [3, 5, 4], [3, 5, 4, 7, 6]]
      stage: 0
      points: true
      title: "Sales this week"
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const num = (v, d) => (typeof v === "number" && Number.isFinite(v) ? v : d);
  const str = (v, d) => (typeof v === "string" && v.trim() !== "" ? v.trim() : d);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const isNumRow = (a) => Array.isArray(a) && a.every((v) => v === null || (typeof v === "number" && Number.isFinite(v)));
  const toStages = (v) => {
    if (!Array.isArray(v) || v.length === 0) return null;
    if (Array.isArray(v[0])) return v.every(isNumRow) ? v.slice(0, 12) : null;
    return isNumRow(v) ? [v] : null;
  };
  const series = [];
  if (Array.isArray(params.series)) {
    params.series.slice(0, 6).forEach((s, k) => {
      const st = toStages(s && s.values);
      // A series whose values are not data yet still COUNTS (zero series), so
      // the line_k beat, its colour and its end label exist before the script runs.
      series.push({ name: str(s && s.name, "Series " + (k + 1)), stages: st || [[]] });
    });
  } else {
    const st = toStages(params.values);
    if (st) series.push({ name: "", stages: st });
    // Finding P: a `values` TOKEN with no series still mints line_1 — one
    // anonymous zero series that draws nothing. bar_chart already keeps its
    // bar_i beats alive before the script has run, and a model copying that
    // exemplar writes draw: ["axes", "line_1"]; without this the id is
    // unknown offline and costs a needless repair round.
    else if (typeof params.values === "string") series.push({ name: "", stages: [[]] });
  }
  // x: numbers (real axis), strings (categories), else indices 1..n.
  const xNum = Array.isArray(params.x) && params.x.length > 0 && params.x.every((v) => typeof v === "number" && Number.isFinite(v)) ? params.x.slice(0, 2000) : null;
  const xCat = !xNum && Array.isArray(params.x) && params.x.length > 0 && params.x.every((v) => typeof v === "string") ? params.x.slice(0, 2000) : null;
  let n = xNum ? xNum.length : xCat ? xCat.length : 0;
  for (const s of series) for (const st of s.stages) n = Math.max(n, st.length);
  // Ruling D: numeric x caps the index space to what it has — values beyond
  // it are silently dropped, the same policy data_table uses for extra rows.
  // Categorical x (and the indices-only fallback) are unaffected.
  if (xNum) n = Math.min(n, xNum.length);
  n = Math.min(2000, n);
  let K = 1;
  for (const s of series) K = Math.max(K, s.stages.length);
  const stage = clamp(num(params.stage, 0), 0, K - 1);
  const k0 = Math.floor(stage), k1 = Math.min(K - 1, k0 + 1), t = stage - k0;
  const at = (s, k, i) => { const st = s.stages[Math.min(k, s.stages.length - 1)]; const v = st[i]; return typeof v === "number" ? v : null; };

  // Limits over all stages (y) and all x, so the frame never jumps mid-tween
  // — but only over the PLOTTED prefix of each stage (Ruling D's cap on n):
  // a value beyond what numeric x can place never appears, so it must not
  // stretch the scale either.
  let lo = Infinity, hi = -Infinity;
  for (const s of series) for (const st of s.stages) for (const v of st.slice(0, n)) if (typeof v === "number") { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  if (!Number.isFinite(lo)) { lo = 0; hi = 1; }
  const ylim = Array.isArray(params.ylim) && params.ylim.length === 2 && params.ylim.every((v) => typeof v === "number" && Number.isFinite(v)) ? params.ylim : null;
  let yMin = ylim ? Math.min(ylim[0], ylim[1]) : Math.min(0, lo);
  let yMax = ylim ? Math.max(ylim[0], ylim[1]) : hi;
  if (!ylim) { const pad = (yMax - yMin) * 0.08; if (yMax > 0) yMax += pad; if (yMin < 0) yMin -= pad; }
  if (yMax - yMin < 1e-9) yMax = yMin + 1;
  const xs = xNum ? xNum : Array.from({ length: n }, (_, i) => i + 1);
  const xlim = xNum && Array.isArray(params.xlim) && params.xlim.length === 2 && params.xlim.every((v) => typeof v === "number" && Number.isFinite(v)) ? params.xlim : null;
  let xMin = xlim ? Math.min(xlim[0], xlim[1]) : Math.min(...xs), xMax = xlim ? Math.max(xlim[0], xlim[1]) : Math.max(...xs);
  if (!(xMax - xMin > 1e-9)) xMax = xMin + 1;

  const b = params.box;
  const boxed = b && typeof b === "object" && [b.x, b.y, b.w, b.h].every((v) => typeof v === "number" && Number.isFinite(v)) && b.w > 0 && b.h > 0;
  const plot = boxed ? { x0: b.x, y0: b.y, x1: b.x + b.w, y1: b.y + b.h } : kit.plotArea();
  const title = str(params.title, "");
  // A drawn title costs 55 units of plot height (the did_trends convention) — see bar_chart.
  if (title) plot.y1 = Math.max(plot.y0, Math.min(plot.y1, 620));
  // Finding C1 — the same convention one axis over: a series name is drawn
  // PAST its last point, so the plot must give up the width that label needs.
  // The default plot ends at 930 and a 19pt name of five characters or more
  // then runs off the 1000-wide canvas (out-of-canvas, an ERROR). An authored
  // box pays the same cost: a box says where the plot goes, not that a label
  // may hang over the canvas edge.
  const END_SIZE = 19; // the end label's font size
  const END_GAP = 12; // gap between the last point and its name
  const CANVAS_EDGE = 4; // CANVAS_EDGE_MARGIN (src/layout/axes.ts) — the margin the app's own axis captions keep
  let endLabelW = 0;
  for (const s of series) if (s.name) endLabelW = Math.max(endLabelW, kit.textWidth(s.name, END_SIZE));
  if (endLabelW > 0) {
    // Never crush the plot below half its width: a name that long is the
    // author's problem, so let it overflow rather than squeeze the chart.
    const minX1 = plot.x0 + (plot.x1 - plot.x0) * 0.5;
    plot.x1 = Math.max(minX1, Math.min(plot.x1, kit.CANVAS.w - CANVAS_EDGE - END_GAP - endLabelW));
  }
  // Ruling E: clamp the VALUE into [xMin, xMax] / [yMin, yMax] before
  // scaling — exactly as bar_chart clamps y. An xlim/ylim narrower than the
  // data would otherwise place a point (or an axis end-label, which shares
  // this same scale) thousands of units off-canvas — past the compiler's own
  // ±4000 bounds check, not just a cosmetic overflow. No geometric clipping:
  // the clamped point sits AT the limit, the line simply ends there.
  const Y = (v) => plot.y0 + ((clamp(v, yMin, yMax) - yMin) / (yMax - yMin)) * (plot.y1 - plot.y0);
  const X = xCat
    ? (i) => plot.x0 + ((plot.x1 - plot.x0) / Math.max(1, n)) * (i + 0.5)
    : (i) => plot.x0 + ((clamp(xs[i], xMin, xMax) - xMin) / (xMax - xMin)) * (plot.x1 - plot.x0);
  const xLab = str(params.x_label, ""), yLab = str(params.y_label, "");
  // Ruling F: x and y get their own decimal precision — bar_chart's own
  // digit-counting over the axis's data (and its explicit lim, if given),
  // combined with whether the (padded) limit itself is non-integer — capped
  // at 2 either way. A value that IS an integer is always shown bare ("0",
  // "50"), even on an axis whose other end needs decimals ("0.26").
  const digits = (vals) => {
    let d = 0;
    for (const v of vals) if (typeof v === "number" && Number.isFinite(v) && !Number.isInteger(v)) d = Math.min(2, Math.max(d, (String(v).split(".")[1] || "").length));
    return d;
  };
  // Same prefix bound as the limits scan above: a dropped value must not
  // over-precision the axis either.
  const yVals = [];
  for (const s of series) for (const st of s.stages) for (const v of st.slice(0, n)) if (typeof v === "number") yVals.push(v);
  if (ylim) yVals.push(ylim[0], ylim[1]);
  let decY = digits(yVals);
  if (!Number.isInteger(yMin) || !Number.isInteger(yMax)) decY = Math.min(2, Math.max(decY, 1));
  const xVals = xNum ? xNum.slice() : [];
  if (xlim) xVals.push(xlim[0], xlim[1]);
  let decX = digits(xVals);
  if (!Number.isInteger(xMin) || !Number.isInteger(xMax)) decX = Math.min(2, Math.max(decX, 1));
  const fmtAxis = (dec) => (v) => (Number.isInteger(v) ? String(Math.round(v)) : v.toFixed(dec));
  const fmtX = fmtAxis(decX), fmtY = fmtAxis(decY);

  const drawables = [], labelReqs = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };

  const axesChildren = [
    kit.stroke("axes__x", [[plot.x0 - 6, plot.y0], [plot.x1 + kit.AXIS_OVERHANG, plot.y0]], { arrowhead: "end", strokeWidth: 4, ms: MS.axis }),
    kit.stroke("axes__y", [[plot.x0, plot.y0 - 6], [plot.x0, plot.y1 + kit.AXIS_OVERHANG]], { arrowhead: "end", strokeWidth: 4, ms: MS.axis }),
  ];
  // Ruling I: a stacked x caption (a long phrase, placed above/left of the
  // arrow tip rather than inline past it) sits in the same row as axes__x1
  // or the last category label — drop it one row lower so it clears them.
  const X_CAPTION_DROP = 28; // a stacked x caption sits one row below the end marks / category labels
  if (xLab) {
    const xCaption = kit.axisLabel("axes__x_label", "x", plot, xLab, { fontSize: 22 });
    if (xCaption.anchor === "end") xCaption.pos[1] = plot.y0 - 20 - X_CAPTION_DROP;
    axesChildren.push(xCaption);
  }
  if (yLab) axesChildren.push(kit.axisLabel("axes__y_label", "y", plot, yLab, { fontSize: 22 }));
  if (xCat) {
    const size = n > 12 ? 13 : 17;
    xCat.forEach((s, i) => axesChildren.push(kit.text("axes__c" + i, [X(i), plot.y0 - 20], s, { fontSize: size })));
  } else if (n > 0) {
    axesChildren.push(kit.text("axes__x0", [X(0), plot.y0 - 20], fmtX(xs[0]), { fontSize: 15, color: C.guide }));
    axesChildren.push(kit.text("axes__x1", [X(n - 1), plot.y0 - 20], fmtX(xs[n - 1]), { fontSize: 15, color: C.guide }));
  }
  axesChildren.push(kit.text("axes__y0", [plot.x0 - 12, plot.y0], fmtY(yMin), { fontSize: 15, anchor: "end", color: C.guide }));
  axesChildren.push(kit.text("axes__y1", [plot.x0 - 12, plot.y1], fmtY(yMax), { fontSize: 15, anchor: "end", color: C.guide }));
  if (yMin < 0 && yMax > 0) axesChildren.push(kit.stroke("axes__zero", [[plot.x0, Y(0)], [plot.x1, Y(0)]], { color: C.guide, dash: true, strokeWidth: 2, ms: MS.guides }));
  push(kit.group("axes", axesChildren));
  anchors.axes = [plot.x0, plot.y0];

  // Interpolated points for one series: appearing points grow out of their
  // predecessor in the older stage, disappearing ones shrink into their
  // predecessor in the newer stage — a prefix reveal draws the line in.
  // X/Y already clamp the value into [xMin, xMax] / [yMin, yMax] (Ruling E).
  const pointsOf = (s) => {
    const pts = [];
    const pred = (k, i) => { for (let j = i - 1; j >= 0; j--) { const v = at(s, k, j); if (v !== null) return [X(j), Y(v)]; } return null; };
    for (let i = 0; i < n; i++) {
      const a = at(s, k0, i), c = at(s, k1, i);
      if (a === null && c === null) continue;
      // Ruling A: at t === 0 the displayed stage IS k0, so a point absent
      // from k0 has not appeared yet — reproduce k0's own point count exactly
      // rather than drawing it already sitting at its predecessor.
      if (a === null && t === 0) continue;
      let from, to;
      if (a !== null && c !== null) { from = [X(i), Y(a)]; to = [X(i), Y(c)]; }
      else if (a === null) { to = [X(i), Y(c)]; from = pred(k0, i) || to; }
      else { from = [X(i), Y(a)]; to = pred(k1, i) || from; }
      pts.push([from[0] + (to[0] - from[0]) * t, from[1] + (to[1] - from[1]) * t]);
    }
    return pts;
  };

  const lines = series.map((s, k) => ({ s, k, pts: pointsOf(s) }));
  // Finding I6: dodge the end labels apart (46 units) the way did_trends
  // does, but around the CLUSTER'S OWN CENTRE — the push below only ever
  // moves a label UP, so four series converging near the top used to walk the
  // last one clean off the canvas. After centring, the stack is held inside
  // the axes: its top never rises above the y arrow's tip, its bottom never
  // sinks into the x caption's row (Ruling T — a curve that ends at the floor,
  // an epidemic burning out, put its name straight on top of "Days"). The cap
  // is applied first, so a stack taller than the plot keeps its bottom rather
  // than its top. A series with no name or no points takes no slot at all.
  const DODGE = 46;
  const END_LABEL_FLOOR = 28; // an end label never sits in the x caption's row (its 19pt box clears a 22pt inline caption centred on the axis: 13.75 + 11.875 + the lint's 2-unit pad = 27.625)
  const labelY = lines.map((L) => (L.pts.length ? L.pts[L.pts.length - 1][1] : plot.y0));
  const slots = lines.map((L, k) => (L.s.name && L.pts.length ? k : -1)).filter((k) => k >= 0).sort((i, j) => labelY[i] - labelY[j]);
  const dodged = labelY.slice();
  for (let q = 1; q < slots.length; q++) {
    const prev = slots[q - 1], cur = slots[q];
    if (dodged[cur] - dodged[prev] < DODGE) dodged[cur] = dodged[prev] + DODGE;
  }
  if (slots.length > 0) {
    let want = 0, got = 0;
    for (const k of slots) { want += labelY[k]; got += dodged[k]; }
    let shift = (want - got) / slots.length;
    const cap = plot.y1 + kit.AXIS_OVERHANG;
    if (dodged[slots[slots.length - 1]] + shift > cap) shift = cap - dodged[slots[slots.length - 1]];
    if (dodged[slots[0]] + shift < plot.y0 + END_LABEL_FLOOR) shift = plot.y0 + END_LABEL_FLOOR - dodged[slots[0]];
    for (const k of slots) dodged[k] += shift;
  }
  lines.forEach((L, k) => {
    const id = "line_" + (k + 1);
    const color = C.series[k % C.series.length];
    const children = [];
    const pts = L.pts;
    if (pts.length >= 2) children.push(kit.stroke(id + "__l", params.smooth === true ? kit.smooth(pts) : pts, { color, strokeWidth: 4, ms: MS.curve }));
    else if (pts.length === 1) children.push(kit.stroke(id + "__l", [pts[0], [pts[0][0] + 0.01, pts[0][1]]], { color, strokeWidth: 4, ms: MS.curve }));
    else children.push(kit.stroke(id + "__l", [], { color, strokeWidth: 4, ms: MS.curve }));
    if (params.points === true) pts.forEach((p, i) => children.push(kit.stroke(id + "__p" + (i + 1), kit.polygon(p, 4, 10), { closed: true, color, fill: color, strokeWidth: 2, ms: MS.stroke })));
    if (L.s.name && pts.length) children.push(kit.text(id + "__t", [pts[pts.length - 1][0] + END_GAP, dodged[k]], L.s.name, { fontSize: END_SIZE, anchor: "start", color }));
    push(kit.group(id, children));
    anchors[id] = pts.length ? pts[Math.floor(pts.length / 2)] : [plot.x0, plot.y0];
  });

  if (title) {
    let ty = Math.min(700, plot.y1 + 25);
    const yCap = axesChildren.find((d) => d.id === "axes__y_label");
    if (yCap) ty = Math.max(ty, yCap.pos[1] + 40);
    ty = Math.min(ty, 730);
    push(kit.text("title", [(plot.x0 + plot.x1) / 2, ty], title, { fontSize: 30 }));
    anchors.title = [(plot.x0 + plot.x1) / 2, ty];
  }
  return { drawables, labels: labelReqs, anchors, order };
---
template: scatter_plot
title: Scatter plot
version: 1
kit: 5
status: ready
description: >-
  A scatter plot from data: one dot per (x, y) pair, optional per-point
  labels (a labelled point is its own beat), and an optional fitted line —
  least squares computed here (`fit: true`) or `[slope, intercept]` handed
  in from a script (animatable numbers). `y` may be one list (static) or a
  list of lists (STAGES) and a fractional `stage` interpolates, so the same
  points can move — Anscombe's quartet, before/after a treatment. Feed it
  typed numbers or a code element's variables via "{id.var}" tokens (type
  `x` by hand so the dots exist before the script has run). Choose this
  scene for ANY request for a scatter plot, a correlation, a regression
  line through data, or "does x go with y".
params:
  type: object
  properties:
    x:
      oneOf:
        - { type: array, items: { type: number }, maxItems: 500 }
        - { type: string, pattern: "^\\{[A-Za-z][A-Za-z0-9_]*\\.[A-Za-z_][A-Za-z0-9_.]*\\}$" }
      description: "x of every point (numbers), or a \"{id.var}\" token. TYPE these by hand when the beats address points."
    y:
      oneOf:
        - { type: array, items: { type: number }, maxItems: 500 }
        - { type: array, minItems: 1, items: { type: array, items: { type: number }, maxItems: 500 }, maxItems: 12 }
        - { type: string, pattern: "^\\{[A-Za-z][A-Za-z0-9_]*\\.[A-Za-z_][A-Za-z0-9_.]*\\}$" }
      description: "y of every point: a list (static), a list of lists (STAGES of the same points — depth means staged), or a \"{id.var}\" token."
    labels:
      oneOf:
        - { type: array, items: { type: string }, maxItems: 500 }
        - { type: string, pattern: "^\\{[A-Za-z][A-Za-z0-9_]*\\.[A-Za-z_][A-Za-z0-9_.]*\\}$" }
      description: "Optional per-point names; a named point becomes its own beat point_i (empty string = unnamed). A \"{id.var}\" token works, at the cost that the point_i beats exist only after the script runs."
    fit:
      oneOf:
        - { type: boolean }
        - { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        - { type: string, pattern: "^\\{[A-Za-z][A-Za-z0-9_]*\\.[A-Za-z_][A-Za-z0-9_.]*\\}$" }
      description: "true = least-squares line computed here (follows the points through a stage tween); [slope, intercept] = a line from the script, e.g. np.polyfit — animatable as fit.0 / fit.1."
    stage:
      type: number
      minimum: 0
      x-max-from: ["y"]
      description: "Which stage of y is shown (0-based; default 0). Fractional values interpolate — {\"animate\": {\"stage\": 1}}."
    box:
      type: object
      properties: { x: { type: number }, y: { type: number }, w: { type: number }, h: { type: number } }
      required: [x, y, w, h]
      description: "Plot area (lower-left corner, width, height). Default: the standard plot area."
    xlim: { type: array, items: { type: number }, minItems: 2, maxItems: 2, description: "Fixed x range." }
    ylim: { type: array, items: { type: number }, minItems: 2, maxItems: 2, description: "Fixed y range. Default: the data's range across ALL stages plus headroom." }
    x_label: { type: string }
    y_label: { type: string }
    title: { type: string }
element_ids:
  axes: the x and y axes with their captions and end values
  points: every unnamed dot, as one group — absent when every point is named
  point_1: "a NAMED point (dot + its label) — its own beat; numbered by position (point_2, …)"
  fit_line: the fitted line with its equation
  title: figure title, when set
examples:
  - request: "Scatter of study hours against exam score with a regression line."
    params:
      x: [1, 2, 3, 4, 5, 6, 7, 8]
      y: [52, 55, 61, 58, 70, 74, 79, 83]
      fit: true
      x_label: "Hours studied"
      y_label: "Score"
  - request: "Show Anscombe's first two datasets as the same fitted line through different points."
    params:
      x: [10, 8, 13, 9, 11, 14, 6, 4, 12, 7, 5]
      y:
        - [8.04, 6.95, 7.58, 8.81, 8.33, 9.96, 7.24, 4.26, 10.84, 4.82, 5.68]
        - [9.14, 8.14, 8.74, 8.77, 9.26, 8.10, 6.13, 3.10, 9.13, 7.26, 4.74]
      stage: 0
      fit: true
      title: "Same line, different data"
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const num = (v, d) => (typeof v === "number" && Number.isFinite(v) ? v : d);
  const str = (v, d) => (typeof v === "string" && v.trim() !== "" ? v.trim() : d);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const isNumRow = (a) => Array.isArray(a) && a.every((v) => v === null || (typeof v === "number" && Number.isFinite(v)));
  const toStages = (v) => {
    if (!Array.isArray(v) || v.length === 0) return null;
    if (Array.isArray(v[0])) return v.every(isNumRow) ? v.slice(0, 12) : null;
    return isNumRow(v) ? [v] : null;
  };
  const xs = Array.isArray(params.x) && params.x.every((v) => typeof v === "number" && Number.isFinite(v)) ? params.x.slice(0, 500) : null;
  let stages = toStages(params.y);
  // The placeholder promise: typed x but y still a token → dots at the floor.
  if (!stages && xs && xs.length > 0) stages = [xs.map(() => 0)];
  // Nothing to place: axes only (a spec with both x and y unresolved).
  const n = xs ? Math.min(500, xs.length) : 0;
  const K = stages ? stages.length : 1;
  const stage = clamp(num(params.stage, 0), 0, K - 1);
  const k0 = Math.floor(stage), k1 = Math.min(K - 1, k0 + 1), t = stage - k0;
  const at = (k, i) => { if (!stages) return null; const st = stages[Math.min(k, stages.length - 1)]; const v = st[i]; return typeof v === "number" ? v : null; };
  const labels = Array.isArray(params.labels) ? params.labels.map((l) => (typeof l === "string" ? l.trim() : "")) : [];

  // Ruling H: limits (and, below, digit counting) scan only the first n
  // entries of each stage — a stage longer than x contributes nothing beyond
  // n — but limits still span ALL stages, so the frame never jumps mid-tween.
  let lo = Infinity, hi = -Infinity;
  if (stages) for (const st of stages) for (const v of st.slice(0, n)) if (typeof v === "number") { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  if (!Number.isFinite(lo)) { lo = 0; hi = 1; }
  // Finding I2 (controller ruling): a scatter's axes run over the DATA range
  // with headroom on BOTH sides — forcing them through 0 spent most of the
  // plot on empty space for a cloud that lives at 44…93. The one exception is
  // an origin that is already near: non-negative data whose minimum is within
  // a quarter of its maximum snaps to 0, because starting a hair above zero
  // reads as a lie. An explicit xlim/ylim always wins, verbatim. (line_chart
  // is untouched by this ruling: its x is a shared index space and its y
  // baseline carries the "how much" reading a trend line is about.)
  const snapsToZero = (a2, b2) => a2 >= 0 && a2 <= 0.25 * b2;
  // Headroom is a fraction of the range the axis actually shows, so an axis
  // that snapped keeps exactly the padding it had when it was forced to 0.
  const rangeOf = (a2, b2, frac) => {
    const zero = snapsToZero(a2, b2);
    const from = zero ? 0 : a2;
    const room = (b2 - from) * frac;
    return [zero ? 0 : from - room, b2 + room];
  };
  // Fix: constant data on an axis (hi - lo < 1e-9) used to leave the range a
  // single point, drawing every dot exactly ON the axis line once the later
  // degenerate guard only extended it upward. A non-zero value v instead
  // widens the DATA range itself to [min(0, 2v), max(0, 2v)] before the
  // snap/headroom logic above runs, so v lands in the middle of an axis that
  // starts (or ends) at 0. v === 0 is the placeholder promise (typed x, a
  // still-unresolved y token) and keeps its old floor behaviour untouched.
  const centerDegenerate = (a2, b2) => {
    if (!(b2 - a2 < 1e-9) || a2 === 0) return [a2, b2];
    return [Math.min(0, 2 * a2), Math.max(0, 2 * a2)];
  };
  [lo, hi] = centerDegenerate(lo, hi);
  const ylim = Array.isArray(params.ylim) && params.ylim.length === 2 && params.ylim.every((v) => typeof v === "number" && Number.isFinite(v)) ? params.ylim : null;
  const ySnapped = !ylim && snapsToZero(lo, hi);
  const yRange = ylim ? [Math.min(ylim[0], ylim[1]), Math.max(ylim[0], ylim[1])] : rangeOf(lo, hi, 0.08);
  let yMin = yRange[0], yMax = yRange[1];
  if (yMax - yMin < 1e-9) yMax = yMin + 1;
  let xLo = n ? Math.min(...xs.slice(0, n)) : 0, xHi = n ? Math.max(...xs.slice(0, n)) : 1;
  [xLo, xHi] = centerDegenerate(xLo, xHi);
  const xlim = Array.isArray(params.xlim) && params.xlim.length === 2 && params.xlim.every((v) => typeof v === "number" && Number.isFinite(v)) ? params.xlim : null;
  const xSnapped = !xlim && snapsToZero(xLo, xHi);
  const xRange = xlim ? [Math.min(xlim[0], xlim[1]), Math.max(xlim[0], xlim[1])] : rangeOf(xLo, xHi, 0.06);
  let xMin = xRange[0], xMax = xRange[1];
  if (!(xMax - xMin > 1e-9)) xMax = xMin + 1;

  const b = params.box;
  const boxed = b && typeof b === "object" && [b.x, b.y, b.w, b.h].every((v) => typeof v === "number" && Number.isFinite(v)) && b.w > 0 && b.h > 0;
  const plot = boxed ? { x0: b.x, y0: b.y, x1: b.x + b.w, y1: b.y + b.h } : kit.plotArea();
  const title = str(params.title, "");
  if (title) plot.y1 = Math.max(plot.y0, Math.min(plot.y1, 620));
  // Ruling H: clamp the data value into [xMin, xMax] / [yMin, yMax] before
  // scaling — exactly as line_chart does — so a narrower xlim/ylim never
  // sends a dot or the fit line off-canvas (past the compiler's ±4000 bounds
  // check, not just cosmetically).
  const X = (v) => plot.x0 + ((clamp(v, xMin, xMax) - xMin) / (xMax - xMin)) * (plot.x1 - plot.x0);
  const Y = (v) => plot.y0 + ((clamp(v, yMin, yMax) - yMin) / (yMax - yMin)) * (plot.y1 - plot.y0);
  const xLab = str(params.x_label, ""), yLab = str(params.y_label, "");
  // Ruling H: x and y each get their own decimal precision — line_chart's own
  // digit-counting over the axis's data (and its explicit lim, if given),
  // combined with whether the (padded) limit itself is non-integer — capped
  // at 2 either way. A value that IS an integer is always shown bare ("0",
  // "53"), even on an axis whose other end needs decimals ("0.26").
  const digits = (vals) => {
    let d = 0;
    for (const v of vals) if (typeof v === "number" && Number.isFinite(v) && !Number.isInteger(v)) d = Math.min(2, Math.max(d, (String(v).split(".")[1] || "").length));
    return d;
  };
  const yVals = [];
  if (stages) for (const st of stages) for (const v of st.slice(0, n)) if (typeof v === "number") yVals.push(v);
  if (ylim) yVals.push(ylim[0], ylim[1]);
  let decY = digits(yVals);
  if (!Number.isInteger(yMin) || !Number.isInteger(yMax)) decY = Math.min(2, Math.max(decY, 1));
  const xVals = xs ? xs.slice(0, n) : [];
  if (xlim) xVals.push(xlim[0], xlim[1]);
  let decX = digits(xVals);
  if (!Number.isInteger(xMin) || !Number.isInteger(xMax)) decX = Math.min(2, Math.max(decX, 1));
  const fmtAxis = (dec) => (v) => (Number.isInteger(v) ? String(Math.round(v)) : v.toFixed(dec));
  const fmtX = fmtAxis(decX), fmtY = fmtAxis(decY);

  const drawables = [], labelReqs = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  const axesChildren = [
    kit.stroke("axes__x", [[plot.x0 - 6, plot.y0], [plot.x1 + kit.AXIS_OVERHANG, plot.y0]], { arrowhead: "end", strokeWidth: 4, ms: MS.axis }),
    kit.stroke("axes__y", [[plot.x0, plot.y0 - 6], [plot.x0, plot.y1 + kit.AXIS_OVERHANG]], { arrowhead: "end", strokeWidth: 4, ms: MS.axis }),
  ];
  // Ruling I: a stacked x caption (a long phrase, placed above/left of the
  // arrow tip rather than inline past it) sits in the same row as axes__x1
  // or the last category label — drop it one row lower so it clears them.
  const X_CAPTION_DROP = 28; // a stacked x caption sits one row below the end marks / category labels
  if (xLab) {
    const xCaption = kit.axisLabel("axes__x_label", "x", plot, xLab, { fontSize: 22 });
    if (xCaption.anchor === "end") xCaption.pos[1] = plot.y0 - 20 - X_CAPTION_DROP;
    axesChildren.push(xCaption);
  }
  if (yLab) axesChildren.push(kit.axisLabel("axes__y_label", "y", plot, yLab, { fontSize: 22 }));
  // Ruling H: all four axis end marks — the plan's shared geometry rules.
  // Finding I3: each mark names the DATA's own extreme at that extreme's own
  // position ("12" under the last point, not "12.72" under the arrowhead) —
  // the headroom is breathing room, not a number anyone measured. The
  // exceptions name the frame instead, because there it IS the frame the
  // reader must trust: an end the author fixed with xlim/ylim, and a low end
  // the axis snapped to 0.
  const xLoV = xlim || xSnapped ? xMin : xLo, xHiV = xlim ? xMax : xHi;
  const yLoV = ylim || ySnapped ? yMin : lo, yHiV = ylim ? yMax : hi;
  axesChildren.push(kit.text("axes__x0", [X(xLoV), plot.y0 - 20], fmtX(xLoV), { fontSize: 15, color: C.guide }));
  // Degenerate data (every point on one x, or the placeholder's zeros) puts
  // both ends of an axis in the same spot — one mark, not two stacked.
  if (Math.abs(X(xHiV) - X(xLoV)) >= 1) axesChildren.push(kit.text("axes__x1", [X(xHiV), plot.y0 - 20], fmtX(xHiV), { fontSize: 15, color: C.guide }));
  axesChildren.push(kit.text("axes__y0", [plot.x0 - 12, Y(yLoV)], fmtY(yLoV), { fontSize: 15, anchor: "end", color: C.guide }));
  if (Math.abs(Y(yHiV) - Y(yLoV)) >= 1) axesChildren.push(kit.text("axes__y1", [plot.x0 - 12, Y(yHiV)], fmtY(yHiV), { fontSize: 15, anchor: "end", color: C.guide }));
  push(kit.group("axes", axesChildren));
  anchors.axes = [plot.x0, plot.y0];

  // Current position of point i (see line_chart for the appear/disappear
  // rule). `pos` is the CLAMPED screen position (for drawing, per Ruling H);
  // `val` lerps the same appear/disappear structure but in unclamped DATA
  // space, so a value outside xlim/ylim keeps its real number for the fit
  // (Finding 1) instead of the clipped one X()/Y() draws at.
  const pred = (k, i) => { for (let j = i - 1; j >= 0; j--) { const v = at(k, j); if (v !== null) return [X(xs[j]), Y(v)]; } return null; };
  const predVal = (k, i) => { for (let j = i - 1; j >= 0; j--) { const v = at(k, j); if (v !== null) return [xs[j], v]; } return null; };
  const pos = [], val = [];
  for (let i = 0; i < n; i++) {
    const a = at(k0, i), c = at(k1, i);
    if (a === null && c === null) { pos.push(null); val.push(null); continue; }
    // Ruling A: at t === 0 the displayed stage IS k0, so a point absent from
    // k0 has not appeared yet — reproduce k0's own point count exactly rather
    // than drawing it already sitting at its predecessor.
    if (a === null && t === 0) { pos.push(null); val.push(null); continue; }
    let from, to, dFrom, dTo;
    if (a !== null && c !== null) {
      from = [X(xs[i]), Y(a)]; to = [X(xs[i]), Y(c)];
      dFrom = [xs[i], a]; dTo = [xs[i], c];
    } else if (a === null) {
      to = [X(xs[i]), Y(c)]; from = pred(k0, i) || to;
      dTo = [xs[i], c]; dFrom = predVal(k0, i) || dTo;
    } else {
      from = [X(xs[i]), Y(a)]; to = pred(k1, i) || from;
      dFrom = [xs[i], a]; dTo = predVal(k1, i) || dFrom;
    }
    pos.push([from[0] + (to[0] - from[0]) * t, from[1] + (to[1] - from[1]) * t]);
    val.push([dFrom[0] + (dTo[0] - dFrom[0]) * t, dFrom[1] + (dTo[1] - dFrom[1]) * t]);
  }

  const color = C.series[0];
  const dot = (id, p) => kit.stroke(id, kit.polygon(p, 5, 12), { closed: true, color, fill: color, strokeWidth: 2, ms: MS.stroke });
  // Finding O (amends Ruling A): a LABELLED point keeps its beat at every
  // stage. An appearing point still has no dot at stage 0 — Ruling A stands
  // for what is drawn — but point_i exists all the same, holding an empty-pts
  // stroke (the zero-series idiom: the id exists, nothing draws), so a later
  // highlight: {target: ["point_3"]} resolves against stage 0's order instead
  // of being dropped as an unknown id. `points` likewise exists as soon as
  // any unlabelled index does, with children only for the dots present now.
  const centre = [(plot.x0 + plot.x1) / 2, (plot.y0 + plot.y1) / 2];
  const cloud = [];
  const named = [];
  let anyUnnamed = false;
  for (let i = 0; i < n; i++) {
    const name = labels[i] || "";
    if (name) { named.push({ i, p: pos[i], name }); continue; }
    anyUnnamed = true;
    if (pos[i]) cloud.push(dot("points__d" + (i + 1), pos[i]));
  }
  if (anyUnnamed) { push(kit.group("points", cloud)); anchors.points = centre; }
  named.forEach(({ i, p, name }) => {
    const id = "point_" + (i + 1);
    push(kit.group(id, p
      ? [dot(id + "__d", p), kit.text(id + "__t", [p[0] + 10, p[1] + 12], name, { fontSize: 16, anchor: "start", color: C.ink })]
      : [kit.stroke(id + "__d", [], { closed: true, color, fill: color, strokeWidth: 2, ms: MS.stroke })]));
    anchors[id] = p || centre;
  });

  // The fitted line: least squares through the CURRENT (interpolated) points,
  // or the script's [slope, intercept]. Drawn across the visible x range.
  // Ruling C: a fit param that is still an unresolved token string behaves as
  // fit: true (least squares through the current — offline: placeholder —
  // points), so the fit_line beat exists before the script has run.
  // Finding 1: regress on `val` (unclamped DATA values), not on `pos`
  // inverted back through X()/Y() — that used to recover the CLAMPED value
  // (whatever xlim/ylim clipped it to) for any point outside the limits,
  // silently corrupting the fit. Drawing still uses the clamped `pos`.
  let fit = null;
  if (Array.isArray(params.fit) && params.fit.length === 2 && params.fit.every((v) => typeof v === "number" && Number.isFinite(v))) fit = { slope: params.fit[0], intercept: params.fit[1] };
  else if ((params.fit === true || typeof params.fit === "string") && n >= 2) {
    let sx = 0, sy = 0, sxx = 0, sxy = 0, m = 0;
    for (let i = 0; i < n; i++) {
      if (!val[i]) continue;
      const [xv, yv] = val[i];
      sx += xv; sy += yv; sxx += xv * xv; sxy += xv * yv; m++;
    }
    const den = m * sxx - sx * sx;
    if (m >= 2 && Math.abs(den) > 1e-12) { const slope = (m * sxy - sx * sy) / den; fit = { slope, intercept: (sy - slope * sx) / m }; }
  }
  // The title's POSITION is needed here (the equation caption dodges it); the
  // title itself is still drawn last, so the drawing order is unchanged.
  let titleAt = null;
  if (title) {
    let ty = Math.min(700, plot.y1 + 25);
    const yCap = axesChildren.find((d) => d.id === "axes__y_label");
    if (yCap) ty = Math.max(ty, yCap.pos[1] + 40);
    titleAt = [(plot.x0 + plot.x1) / 2, Math.min(ty, 730)];
  }

  if (fit) {
    const eq = "y = " + fit.slope.toFixed(2) + "x " + (fit.intercept < 0 ? "- " : "+ ") + Math.abs(fit.intercept).toFixed(2);
    // Finding I1: CLIP the line to the plot rectangle, never clamp its
    // endpoints — clamping kept each endpoint's x and moved its y, quietly
    // drawing a different slope from the one the caption states (a ylim of
    // [0,3] turned y = 2.00x + 1.00 into a line of slope 0.63). Solve for the
    // x-interval on which intercept + slope*x stays inside [yMin, yMax] and
    // intersect it with [xMin, xMax]. Nothing left means the line misses the
    // frame entirely: the stroke keeps its id and draws nothing.
    let a = xMin, c = xMax;
    if (Math.abs(fit.slope) > 1e-12) {
      const xa = (yMin - fit.intercept) / fit.slope, xb = (yMax - fit.intercept) / fit.slope;
      a = Math.max(a, Math.min(xa, xb));
      c = Math.min(c, Math.max(xa, xb));
    } else if (fit.intercept < yMin || fit.intercept > yMax) { a = 1; c = 0; }
    const inside = c - a > 1e-9;
    // Inside the rectangle by construction, so X/Y's clamp is a no-op here.
    const p0 = [X(a), Y(fit.intercept + fit.slope * a)], p1 = [X(c), Y(fit.intercept + fit.slope * c)];
    const ends = inside
      ? [p0, p1]
      : [[X(xMin), Y(clamp(fit.intercept + fit.slope * xMin, yMin, yMax))], [X(xMax), Y(clamp(fit.intercept + fit.slope * xMax, yMin, yMax))]];

    // Findings S2/I7: the equation used to sit above the right end come what
    // may — on a dot in the hours example, and inside the title's own row for
    // any rising fit without a ylim. Try four spots around the segment's ends
    // (above/below, right end first, anchored toward the plot's interior) and
    // take the first that clears every dot, the title, the axis captions AND
    // end marks, every named point's label, and the fit segment itself, by 4
    // units; if none does, fall back to the first.
    const CAP = 16, CAP_DY = 18, CLEAR = 4;
    const capW = kit.textWidth(eq, CAP);
    // Every text box — the caption's own included — is measured exactly as
    // the lint measures it: kit.textWidth(text, fontSize) x fontSize * 1.25.
    const boxAt = (x, y, w, h, anchor) => ({ x: anchor === "end" ? x - w : anchor === "start" ? x : x - w / 2, y: y - h / 2, w: w, h: h });
    const clearOf = (u, v) => u.x - CLEAR >= v.x + v.w || v.x - CLEAR >= u.x + u.w || u.y - CLEAR >= v.y + v.h || v.y - CLEAR >= u.y + u.h;
    // Segment-vs-box crossing (Fix: a candidate the fit line ITSELF runs
    // through used to be accepted — the lint then flagged the label sitting
    // on the stroke). True when either endpoint sits inside the box, or the
    // segment crosses any of the box's four edges.
    const pointInBox = (p, r) => p[0] >= r.x && p[0] <= r.x + r.w && p[1] >= r.y && p[1] <= r.y + r.h;
    const segsCross = (p1, p2, p3, p4) => {
      const cr = (a, b, c) => (c[0] - a[0]) * (b[1] - a[1]) - (c[1] - a[1]) * (b[0] - a[0]);
      const d1 = cr(p3, p4, p1), d2 = cr(p3, p4, p2), d3 = cr(p1, p2, p3), d4 = cr(p1, p2, p4);
      return ((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0));
    };
    const segCrossesBox = (a2, b2, r) => {
      if (pointInBox(a2, r) || pointInBox(b2, r)) return true;
      const tl = [r.x, r.y], tr = [r.x + r.w, r.y], br = [r.x + r.w, r.y + r.h], bl = [r.x, r.y + r.h];
      return segsCross(a2, b2, tl, tr) || segsCross(a2, b2, tr, br) || segsCross(a2, b2, br, bl) || segsCross(a2, b2, bl, tl);
    };
    const obstacles = [];
    for (const p of pos) if (p) obstacles.push({ x: p[0] - 6, y: p[1] - 6, w: 12, h: 12 });
    // Text heights follow the lint's own measure: 1.25 x the font size.
    if (titleAt) obstacles.push(boxAt(titleAt[0], titleAt[1], kit.textWidth(title, 30), 37.5, "middle"));
    // The two axis captions AND the four axis end marks — every text the
    // axes group draws, built from the same pos/text/fontSize/anchor it was
    // drawn with.
    const AXES_OBSTACLE_IDS = new Set(["axes__x_label", "axes__y_label", "axes__x0", "axes__x1", "axes__y0", "axes__y1"]);
    for (const d of axesChildren) if (AXES_OBSTACLE_IDS.has(d.id)) obstacles.push(boxAt(d.pos[0], d.pos[1], kit.textWidth(d.text, d.fontSize), d.fontSize * 1.25, d.anchor));
    // Every named point's label, from the same numbers point_i__t is drawn
    // with (fontSize 16, anchor start, pos [p0 + 10, p1 + 12]).
    for (const { p, name } of named) if (p) obstacles.push(boxAt(p[0] + 10, p[1] + 12, kit.textWidth(name, 16), 16 * 1.25, "start"));
    const spots = [[1, 1], [1, -1], [0, 1], [0, -1], [1, 1]];
    let capPos = null, capAnchor = "end";
    for (const [side, dir] of spots) {
      capAnchor = side === 1 ? "end" : "start";
      capPos = [ends[side][0], ends[side][1] + dir * CAP_DY];
      const box = boxAt(capPos[0], capPos[1], capW, CAP * 1.25, capAnchor);
      if (obstacles.every((o) => clearOf(box, o)) && !segCrossesBox(ends[0], ends[1], box)) break;
    }

    push(kit.group("fit_line", [
      kit.stroke("fit_line__l", inside ? [p0, p1] : [], { color: C.accent, strokeWidth: 3, ms: MS.curve }),
      kit.text("fit_line__t", capPos, eq, { fontSize: CAP, anchor: capAnchor, color: C.accent }),
    ]));
    anchors.fit_line = [(ends[0][0] + ends[1][0]) / 2, (ends[0][1] + ends[1][1]) / 2];
  }

  if (titleAt) {
    push(kit.text("title", titleAt, title, { fontSize: 30 }));
    anchors.title = titleAt;
  }
  return { drawables, labels: labelReqs, anchors, order };
