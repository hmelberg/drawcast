pack: space
title: Space
description: "The solar system: the Sun, planets, dwarf planets and moons drawn for a date at a chosen scale, every body clickable by name — and the night sky over a place at a moment, with the stars, the planets and the Moon's phase where they really are. Positions from astronomy-engine (MIT); facts from the NASA planetary fact sheets; stars from d3-celestial (BSD-3-Clause), Hipparcos."
---
template: solar_system
title: The solar system (planets, dwarf planets, moons)
version: 1
kit: 9
status: ready
engines: [space]
description: >-
  The Sun and its planets from a curated table and a real ephemeris: seen from
  above with every planet at its TRUE position on its orbit for a date
  (`view: top`, the default), lined up for a size comparison (`row`), or
  through a camera 30° above the plane (`tilted`). EVERY BODY IS A NAMED
  ELEMENT whose id is its own name in lower case (sun, mercury, venus, earth,
  mars, jupiter, saturn, uranus, neptune; dwarfs pluto, ceres, eris, haumea,
  makemake; moons moon, phobos, deimos, io, europa, ganymede, callisto, mimas,
  enceladus, tethys, dione, rhea, titan, iapetus, miranda, ariel, umbriel,
  titania, oberon, triton, charon), so `ask` with widget "click" and answer
  "mars" asks the viewer to find Mars, widget "drag" with items [{"id":
  "mars", "label": "Mars"}, …] asks them to place the names, and `quiz` can ask
  about any of them. Orbits are `orbit_<id>`, written names `label_<id>`.
  No drawing shows sizes AND distances truthfully, so `scale` chooses which
  truth to keep and the figure says so in `scale_note`: schematic (default;
  sizes compressed, orbits evenly spaced), sizes (true relative radii —
  Jupiter eleven Earths across; in a row the Sun is so large only its edge
  fits the page), distances (true relative orbit radii, every body a dot —
  pair it with bodies ["inner"] or ["outer"]; the whole system crowds the
  inner planets into the Sun), log. `date` (ISO, or today) places the bodies;
  `days` is a numeric offset from it and THE ANIMATABLE HANDLE — {"animate":
  {"days": 687}} moves every body along its orbit for one Martian year.
  `focus: "jupiter"` draws that body large in the centre with its moons on
  their orbits, its ring and its spin axis, and leaves everything else out —
  the ONLY way moons are drawn (they are invisible at any honest solar-system
  scale); `moons` narrows to some of them. `names` chooses the label
  language; the `highlight` PARAM tints bodies for the whole figure — to make
  one glow for ONE sentence use the highlight COMMAND ({"highlight":
  {"target": ["mars"]}, "speak": "…"}), and a click question glows its answer
  by itself. Choose this scene for ANY request about the solar system, a
  planet, a moon, the order, sizes or distances of the planets, or where a
  planet is on a date. An unrecognised name is skipped and listed in a small
  note rather than failing. In the app the ⊕ tray's Space section lets the
  viewer click any body to look closer; {"explore": {"space": true}} is the
  authored invitation to do so.
params:
  type: object
  properties:
    bodies:
      type: array
      items: { type: string }
      description: "Which sun-orbiting bodies to draw: ids (mercury, venus, earth, mars, jupiter, saturn, uranus, neptune, pluto, ceres, eris, haumea, makemake) or group words that expand in place — planets (the eight; the default), inner (mercury–mars), outer (jupiter–neptune), all (planets and the five dwarf planets). Moons are NOT drawn here — see focus."
      x-translate: false
    view:
      type: string
      enum: [top, row, tilted]
      description: "top (default): the orbits seen from above, bodies at their true angles for the date. row: the classic line-up, the Sun at the left, for comparing sizes — no orbits. tilted: the same orbits through a camera 30° above the plane."
    scale:
      type: string
      enum: [schematic, sizes, distances, log]
      description: "Which truth the figure keeps. schematic (default): compressed sizes, even orbit spacing — 'Not to scale'. sizes: true relative radii, even spacing. distances: true relative orbit radii, every body the same dot — pair it with bodies inner or outer. log: orbit radius by the log of the distance."
    date:
      type: string
      description: "ISO date (2026-09-06) or today (the default). Every body sits where it really is on this date."
      x-translate: false
    days:
      type: number
      minimum: -3650
      maximum: 3650
      description: "Offset from date in days (default 0) — the animatable handle: animate days to 687 and Mars goes round once while Earth laps it. Write the starting value (0) in params when you animate."
    orbits:
      type: boolean
      description: "Draw the dashed orbit circles (default true; a row has none)."
    moons:
      type: array
      items: { type: string }
      description: "With focus: which of the focus body's moons to draw — moon ids (io, europa) or the parent's own id for all of them. Omit to draw every listed moon of the focus body. Without focus nothing here is drawn."
      x-translate: false
    focus:
      type: string
      description: "One body id. That body large in the centre with its moons on their orbits, its ring and its spin axis; the frame crops to it and everything else is left out. This is how you draw Jupiter and its moons, Saturn's rings, or the Earth–Moon pair."
      x-translate: false
    names:
      type: string
      enum: [en, nb, none]
      description: "Language of the written names: en (default), nb (Norwegian), none (no names — for a 'which one is…' question)."
    highlight:
      type: array
      items: { type: string }
      description: "Body ids to tint for the whole figure. Nothing is removed."
      x-translate: false
    title:
      type: string
element_ids:
  sun: the Sun — a shaded disc, or, in a row at true sizes, the visible edge of a disc far larger than the page
  <body_id>: every drawn body is its own element and its id IS its name in lower case (mars, jupiter, io) — the ids an ask with widget "click" or "drag" compares against; Saturn's ring is part of saturn
  orbit_<body_id>: that body's dashed orbit circle, broken where the body's own name is written across it (top and tilted views; a row has none)
  label_<body_id>: that body's written name, when names is not none
  axis: the focus body's spin axis, leaning by its axial tilt (focus only)
  frame: a light dashed frame around the crop (focus only)
  scale_note: "which truth the figure keeps — \"Not to scale\", \"Sizes to scale, distances not\", …"
  scale_bar: a bar with its length written (1 AU, 100 000 km) — sizes, distances and log
  missing_note: "\"Unknown: …\" for names that matched nothing, and for moons named outside focus"
  title: figure title, when set
examples:
  - request: "Draw the solar system."
    params: { view: "top", date: "2026-09-06" }
  - request: "How big are the planets compared with each other?"
    params: { view: "row", scale: "sizes", date: "2026-09-06" }
  - request: "Vis Jupiter og månene dens."
    params: { focus: "jupiter", names: "nb", date: "2026-09-06" }
  - request: "Where are the inner planets right now, to scale?"
    params: { view: "top", scale: "distances", bodies: ["inner"] }
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const eng = engines.space;
  const all = eng.all();
  const F = { x0: 60, y0: 80, x1: 940, y1: 700 };
  const CX = (F.x0 + F.x1) / 2, CY = (F.y0 + F.y1) / 2;   // 500, 390
  const R_MAX = 290;                                        // the outermost orbit in the top views
  const SUN_CAP = Math.floor((F.y1 - F.y0) / 6);            // 103: the Sun never takes more than a sixth of the frame
  const LABEL_PX = 19, NOTE_PX = 18;
  // The box lint measures around a one-line name (fontSize × the 1.25 line
  // height of layout/labels.ts), and the least a name may step to clear one
  // already written: lint calls two text boxes closer than 2 units an overlap,
  // so a step of the line plus 4 leaves 2 units to spare. Never a bare
  // constant — the step has to follow the size of the type it moves.
  const LABEL_H = LABEL_PX * 1.25, LABEL_STEP = LABEL_H + 4;
  // Headroom for the OTHER word. A translated copy swaps the words this body
  // computed AFTER it has run (layout/text-map.ts) and leaves every box where
  // it was put, so a layout that places its own names measures the word
  // written here, not the one that lands. A character's width, added where it
  // is free — see the two places below, and the limit stated at the second.
  const TRANSLATED_ROOM = kit.textWidth("n", LABEL_PX);

  const view = params.view === "row" || params.view === "tilted" ? params.view : "top";
  const mode = params.scale === "sizes" || params.scale === "distances" || params.scale === "log" ? params.scale : "schematic";
  const names = params.names === "nb" || params.names === "none" ? params.names : "en";
  const L = names === "nb" ? "nb" : "en";
  const daysIn = typeof params.days === "number" && Number.isFinite(params.days) ? params.days : 0;
  const date = eng.resolveDate(params.date, daysIn);
  const missing = [];

  // Which bodies. Group words expand in place; unknown names go to the note;
  // a moon named here is known but invisible at any honest scale — it belongs to
  // focus. The Sun is not flagged: it is the centre of every top view anyway,
  // so naming it among the bodies is a no-op, not a mistake worth a note.
  const picked = eng.bodies(Array.isArray(params.bodies) && params.bodies.length > 0 ? params.bodies : ["planets"]);
  missing.push(...picked.missing);
  for (const b of picked.bodies) if (b.kind === "moon") missing.push(b.id + " (a moon: use focus)");
  let focusId = null;
  if (typeof params.focus === "string" && params.focus.trim() !== "") {
    const f = eng.bodies([params.focus]);
    if (f.bodies[0]) focusId = f.bodies[0].id; else missing.push(params.focus.trim());
  }
  // Expanded as ONE selection, exactly the way `bodies` is above — the params
  // schema offers the same group words there, so a model writing
  // highlight: ["inner"] is generalising what this pack taught it. Taking
  // bodies[0] of a per-name expansion tinted Mercury and dropped Venus, Earth
  // and Mars, with no note and no warning.
  const highlightIds = new Set();
  const hi = eng.bodies(Array.isArray(params.highlight) ? params.highlight : []);
  for (const b of hi.bodies) highlightIds.add(b.id);
  missing.push(...hi.missing);
  const orbitsOn = params.orbits !== false && view !== "row";

  // The centre and what orbits it: the Sun and the picked planets, or the
  // focus body and its moons — innermost first.
  let centre, sats;
  if (focusId) {
    centre = all[focusId];
    const s = eng.satellites(focusId, Array.isArray(params.moons) ? params.moons : undefined);
    sats = s.bodies; missing.push(...s.missing);
  } else {
    centre = all.sun;
    sats = picked.bodies.filter((b) => b.parent === "sun");
  }
  sats = sats.slice().sort((a, b) => a.a_km - b.a_km);
  const n = sats.length;

  // Where each body is on its orbit: the true angle for the date. Eccentricity
  // and inclination are not drawn this round — every body sits ON its circle.
  // Read in one place only, by the view below (the guard here is that
  // branch's own condition, inverted): a line-up has no orbits, so it has no
  // angles either, and the ephemeris call it does not read would say
  // otherwise to anyone reading this.
  const angles = {};
  if (view !== "row" || focusId) {
    const pos = focusId ? eng.moonPositions(focusId, sats.map((b) => b.id), date) : eng.positions(sats.map((b) => b.id), date);
    for (const b of sats) { const p = pos[b.id]; angles[b.id] = p ? Math.atan2(p.y, p.x) : 0; }
  }

  // No solver requests: this pack writes every name itself (see "names"
  // below), so `labels` goes back empty and the placement is all in one place.
  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  const nameOf = (b) => b.name[L] || b.name.en;
  const lit = (id) => highlightIds.has(id);
  const extent = (b, r) => r * (b.ring ? b.ring.outer : 1);   // how far a body reaches, ring included
  const ball = (id, c, r, b) => kit.ball(id, c, r, { fill: b.color, color: lit(id) ? C.accent : undefined, strokeWidth: lit(id) ? 3 : Math.min(2, Math.max(1, r / 6)) });

  // Saturn's ring: seen from straight above (the solar-system top view) an
  // annulus behind the disc; otherwise — a row, a tilted camera, or the focus
  // portrait, whose leaning axis already says we are looking edge-on — an
  // ellipse whose far half lies behind the disc and near half in front. The
  // pieces are sub-drawables of the body's own element.
  const ellipseArc = (c, rx, ry, t0, t1, m) => { const pts = []; for (let i = 0; i <= m; i++) { const t = t0 + ((t1 - t0) * i) / m; pts.push([c[0] + rx * Math.cos(t), c[1] + ry * Math.sin(t)]); } return pts; };
  const ringPieces = (b, id, c, r, flat) => {
    if (!b.ring) return null;
    const col = b.ring.color, ro = r * b.ring.outer, ri = r * b.ring.inner;
    if (flat) {
      return { back: [
        kit.area(id + "__ringb", kit.ellipse(c, ro, ro, 64), col, { opacity: 0.55, holes: [kit.ellipse(c, ri, ri, 48)], ms: MS.region }),
        kit.stroke(id + "__ringb_o", kit.ellipse(c, ro, ro, 64), { closed: true, color: col, strokeWidth: 1.5, ms: MS.stroke }),
      ], front: [] };
    }
    const q = 0.38;   // the ring plane seen at Saturn's tilt
    const band = (t0, t1) => [...ellipseArc(c, ro, ro * q, t0, t1, 24), ...ellipseArc(c, ri, ri * q, t1, t0, 24)];
    return {
      back: [kit.area(id + "__ringb", band(0, Math.PI), col, { opacity: 0.55, ms: MS.region }), kit.stroke(id + "__ringb_o", ellipseArc(c, ro, ro * q, 0, Math.PI, 24), { color: col, strokeWidth: 1.5, ms: MS.stroke })],
      front: [kit.area(id + "__ringf", band(Math.PI, 2 * Math.PI), col, { opacity: 0.55, ms: MS.region }), kit.stroke(id + "__ringf_o", ellipseArc(c, ro, ro * q, Math.PI, 2 * Math.PI, 24), { color: col, strokeWidth: 1.5, ms: MS.stroke })],
    };
  };
  // One body as an element: its shaded disc, wrapped with the ring when it has one.
  const bodyElement = (b, id, c, r, flat) => {
    const disc = ball(id, c, r, b);
    const rg = ringPieces(b, id, c, r, flat);
    return rg ? kit.group(id, [...rg.back, { ...disc, id: id + "__disc" }, ...rg.front]) : disc;
  };

  const titleText = typeof params.title === "string" && params.title.trim() !== "" ? params.title : "";
  const missingText = missing.length > 0 ? (L === "nb" ? "Ukjent: " : "Unknown: ") + missing.join(", ") : "";
  if (titleText !== "") {
    push(kit.text("title", [500, 726], titleText, { fontSize: 30 }));
    anchors.title = [500, 726];
  }

  let pxPerKm = null;      // for the scale bar: px per km of DISTANCE (distances) or of RADIUS (sizes)
  let reducedName = "";    // the centre body the note has to admit it shrank — the Sun, or the focus body

  // The captions every figure carries, and where they will be. They are pushed
  // at the END — the notes and the bar in the strip along the foot of the page,
  // the title in the strip along the top — but their boxes are fixed the
  // moment `pxPerKm` and `reducedName` are, and a name looking for room has to
  // see them: the outermost orbit runs 27 units under the title's box, which
  // is one step of a name's search away. The shared solver got them for
  // nothing through obstacleBoxes (layout/layout.ts); a layout that places its
  // own names has to list them itself, and this is that list.
  const textBox = (at, s, fs, start) => { const w = kit.textWidth(s, fs), h = fs * 1.25; return { x: start ? at[0] : at[0] - w / 2, y: at[1] - h / 2, w, h }; };
  // ONE box shape for the whole layout — {x, y, w, h} at the LOW corner — and
  // one test. textBox builds a caption's, boxAt a name's, boxHit compares any
  // two. The row used to hold its names as centre triples {x, y, w} and
  // compare them inline by centre distance: arithmetically the same thing (two
  // boxes of one height clear each other by `pad` exactly when their centres
  // are further apart than half the widths plus pad), but a different enough
  // SHAPE that the caption boxes could not be handed to it — and so, for a
  // round, the row was the one branch that never saw a caption at all.
  const boxAt = (c, w, h) => ({ x: c[0] - w / 2, y: c[1] - h / 2, w, h });
  const boxHit = (a, b, pad) => a.x - pad < b.x + b.w && a.x + a.w + pad > b.x && a.y - pad < b.y + b.h && a.y + a.h + pad > b.y;
  const linearBar = () => (pxPerKm && (mode === "sizes" || mode === "distances") ? eng.scaleBar(mode, pxPerKm, L) : null);
  const captionBoxes = () => {
    const out = [textBox([F.x0, 36], eng.scaleNote(mode, L, reducedName), NOTE_PX, true)];
    if (titleText !== "") out.push(textBox([500, 726], titleText, 30));
    if (missingText !== "") out.push(textBox([500, 36], missingText, NOTE_PX));
    const b = linearBar();
    if (b) out.push(textBox([F.x1 - b.lengthPx / 2, 22], b.label, 16));
    return out;
  };
  const captionRules = () => {
    const b = linearBar();
    return b ? [[[F.x1 - b.lengthPx, 40], [F.x1, 40]], [[F.x1 - b.lengthPx, 34], [F.x1 - b.lengthPx, 46]], [[F.x1, 34], [F.x1, 46]]] : [];
  };

  if (view === "row" && !focusId) {
    // ---- the line-up ------------------------------------------------------
    const y = CY, gap = 24;
    // The Sun's share of the width: a full disc (schematic, log), a segment of
    // fixed visible width (sizes), a dot (distances).
    const sunW = mode === "sizes" ? 110 : mode === "distances" ? 16 : 2 * Math.min(SUN_CAP, 97);
    const xs0 = F.x0 + sunW + gap, W = F.x1 - gap - xs0;
    let xs = [], rs = [], sunR, sunC;
    if (mode === "distances") {
      pxPerKm = n > 0 ? W / Math.max(...sats.map((b) => b.a_km)) : null;
      const sunX = F.x0 + sunW / 2;
      xs = sats.map((b) => sunX + b.a_km * pxPerKm);
      const rad = eng.drawnRadii(centre, sats, mode, 5);
      rs = rad.bodies; sunR = rad.centre; sunC = [sunX, y];
    } else {
      // Variable slots: each body takes its own reach (ring included) plus a
      // gap, so the giants get room and the small ones stay visible.
      const f = mode === "sizes" ? (v) => v : Math.sqrt;
      const reach = (b) => f(b.r_km) * (b.ring ? b.ring.outer : 1);
      const sum = sats.reduce((s, b) => s + reach(b), 0) || 1;
      const k = Math.max(0, W - (n + 1) * gap) / (2 * sum);
      const rad = eng.drawnRadii(centre, sats, mode, n > 0 ? k * Math.max(...sats.map((b) => f(b.r_km))) : 60);
      rs = rad.bodies;
      let x = xs0 + gap;
      xs = sats.map((b, i) => { const e = extent(b, rs[i]); const cx = x + e; x += 2 * e + gap; return cx; });
      if (mode === "sizes") {
        pxPerKm = k;
        sunR = rad.centre;                      // true: ~900 px — only its edge fits
        sunC = [F.x0 + sunW - sunR, y];
      } else {
        sunR = Math.min(rad.centre, sunW / 2);
        sunC = [F.x0 + sunW / 2, y];
      }
    }
    // The Sun: whole when it fits, else the circular segment inside the frame —
    // a stroke past the canvas edge is a lint ERROR, so the clip is not optional.
    // sunSegment's contiguous arc holds only for a centre off to the LEFT, which
    // is exactly where a row puts it; the top views clamp instead, never clip.
    const seg = eng.sunSegment(sunC, sunR, F);
    if (seg.clipped) {
      push(kit.group("sun", [
        kit.area("sun__fill", seg.fill, centre.color, { opacity: 0.9, precise: true, ms: MS.region }),
        kit.stroke("sun__arc", seg.arc, { color: lit("sun") ? C.accent : "#c98f00", strokeWidth: 3, ms: MS.stroke }),
      ]));
      anchors.sun = [F.x0 + Math.min(40, sunW / 2), y];
    } else {
      push(bodyElement(centre, "sun", sunC, sunR, true));
      anchors.sun = sunC;
    }
    sats.forEach((b, i) => { push(bodyElement(b, b.id, [xs[i], y], rs[i], false)); anchors[b.id] = [xs[i], y]; });
    // Names under the bodies (the canvas is y-up, so subtracting from y goes
    // DOWN the page), in tiers when neighbours are closer than a name is
    // wide. A tier is a HORIZONTAL grouping — it only says which names
    // cannot share a line. The vertical is this layout's own, and a tier index
    // times a step is not enough on its own: every name starts just clear of
    // its OWN disc, and the discs differ in size, so a body a little larger
    // than its neighbour eats into the step and the two boxes touch again
    // (Venus/Earth in a true-size row missed each other by 0.05 units). So the
    // step is a real line of type, and each name then steps up by whole lines
    // until its box really is clear of every name already written.
    if (names !== "none") {
      const texts = sats.map(nameOf);
      const widths = texts.map((t) => kit.textWidth(t, LABEL_PX));
      const tiers = eng.labelTiers(xs, widths, 6);
      // The captions are on the list from the start, the way they are in the
      // view below: they are pushed at the end but their boxes are fixed
      // already, and a name stepping DOWN walks straight into the strip along
      // the foot where scale_note, missing_note and the bar's label sit. One
      // giant body is all it takes — Jupiter at true sizes is 337 px across,
      // so its name starts at y 37 and missing_note is at 36.
      const written = captionBoxes();
      sats.forEach((b, i) => {
        const w = widths[i];
        const tx = Math.min(1000 - w / 2 - 4, Math.max(w / 2 + 4, xs[i]));
        const y0 = y - rs[i] - 16 - tiers[i] * LABEL_STEP;
        const free = (t) => { const bx = boxAt([tx, t], w, LABEL_H); return bx.y > 4 && bx.y + bx.h < kit.CANVAS.h - 4 && !written.some((q) => boxHit(bx, q, 2)); };
        const walk = (dir) => { let t = y0; for (let guard = 0; guard <= sats.length + 2 && !free(t); guard++) t += dir * LABEL_STEP; return free(t) ? t : null; };
        // Down first — under the body is where a row's name belongs. But down
        // runs out: below a disc that fills the frame there is the caption
        // strip and then the edge of the page, and no number of steps helps.
        // So the same search runs UPWARD from the same start, ending on the
        // disc itself, where a name reads on its halo and costs no lint (a
        // body is a circle hint, not a polyline, so no stroke rule sees it).
        const ty = walk(-1) ?? walk(1) ?? y0;
        written.push(boxAt([tx, ty], w, LABEL_H));
        push(kit.text("label_" + b.id, [tx, ty], texts[i], { fontSize: LABEL_PX, color: lit(b.id) ? C.accent : C.ink }));
        anchors["label_" + b.id] = [tx, ty];
      });
      const sunAt = seg.clipped ? [F.x0 + 12, y] : [sunC[0], y - sunR - 16];
      push(kit.text("label_sun", sunAt, nameOf(centre), { fontSize: LABEL_PX, color: C.ink, anchor: seg.clipped ? "start" : "middle" }));
      anchors.label_sun = sunAt;
    }
  } else {
    // ---- from above: orbits around the centre ------------------------------
    // The tilted view is the same picture through an orbit camera 30° up —
    // kit.project3d's projection with azimuth 0, written out (x1 = x,
    // z1 = -y, y2 = -z1·sin el, depth = D - z1·cos el, s = D / depth) because
    // project3d has no polyline primitive and an orbit would cost 48 segments.
    // The far side (y > 0) lands at the top of the screen, smaller.
    const EL = Math.PI / 6, D = 1100;
    const P = (x, y) => {
      if (view !== "tilted") return { x: CX + x, y: CY + y, s: 1 };
      const s = D / (D + y * Math.cos(EL));
      return { x: CX + x * s, y: CY + y * Math.sin(EL) * s, s };
    };
    const rMin = focusId ? 130 : 60;
    const orbitR = eng.orbitRadii(sats, mode, rMin, R_MAX);
    const gaps = orbitR.map((r, i) => (i === 0 ? r : r - orbitR[i - 1]));
    const gapMin = gaps.length > 0 ? Math.min(...gaps) : R_MAX;
    // Nothing orbits: no gap between rings sets the sizes, so the centre body
    // takes a fixed one. For the Sun that is SUN_CAP — the sixth of the frame
    // this layout promises at the top of the file, which a bare 120 quietly
    // broke (`bodies: ["krypton"]` resolves to nothing and drew the Sun at
    // 120, 39 % of the frame's height across). A focus portrait of a moonless
    // body — `focus: "venus"` — is not the Sun and IS the whole figure, so it
    // keeps the larger one.
    const soloPx = focusId ? 120 : SUN_CAP;
    const largestPx = n === 0 ? soloPx : Math.max(3, 0.42 * gapMin);
    if (mode === "distances" && n > 0) pxPerKm = R_MAX / Math.max(...sats.map((b) => b.a_km));
    const rad = eng.drawnRadii(centre, sats, mode, largestPx, mode === "distances" && pxPerKm ? pxPerKm : undefined);
    if (mode === "sizes" && n > 0) pxPerKm = largestPx / Math.max(...sats.map((b) => b.r_km));
    const centreCap = n === 0 ? soloPx : Math.max(3, Math.min(SUN_CAP, orbitR[0] - 12));
    if (mode === "sizes" && rad.centre > centreCap) reducedName = nameOf(centre);
    const centreR = Math.min(rad.centre, centreCap);
    // Straight down on the plane the ring is an annulus; a focus portrait
    // leans its axis, so there the ring is the tilted ellipse everyone pictures.
    const flat = view === "top" && !focusId;

    // Everything is MEASURED before anything is drawn, because the names have
    // to be placed before the orbits go down: the one orbit a name sits on has
    // to duck under it.
    const c0 = P(0, 0);
    const centreDrawn = centreR * c0.s;
    const orbitPts = sats.map((b, i) => {
      const pts = [];
      for (let k = 0; k < 72; k++) { const t = (2 * Math.PI * k) / 72; const q = P(orbitR[i] * Math.cos(t), orbitR[i] * Math.sin(t)); pts.push([q.x, q.y]); }
      return pts;
    });
    const orbitWhole = sats.map(() => true);
    let axisPts = null;
    if (focusId && typeof centre.tilt_deg === "number") {
      // The spin axis, leaning by the axial tilt, long enough to read past the disc (and the ring).
      const t = (centre.tilt_deg * Math.PI) / 180, len = extent(centre, centreDrawn) * 1.35;
      axisPts = [[c0.x - len * Math.sin(t), c0.y - len * Math.cos(t)], [c0.x + len * Math.sin(t), c0.y + len * Math.cos(t)]];
    }
    // Traced as an open path that returns to its start, NOT a closed stroke.
    // Drawn the same either way, but `closed: true` would make elementRings
    // hand the frame a hit OUTLINE, and hitElement answers with the smallest
    // outline containing the point and never looks at boxes after that
    // (src/ui/hit.ts, "Pass 1"). A border around the whole portrait would then
    // win every click, and the ⊕ Space section, click questions and drag
    // questions all read the same call. A frame is a border, not a region.
    const framePts = focusId ? [[F.x0, F.y0], [F.x1, F.y0], [F.x1, F.y1], [F.x0, F.y1], [F.x0, F.y0]] : null;
    const placed = sats.map((b, i) => {
      const a = angles[b.id], ex = orbitR[i] * Math.cos(a), ey = orbitR[i] * Math.sin(a);
      const q = P(ex, ey);
      return { b, i, a, q, r: rad.bodies[i] * q.s, ey };
    });
    placed.sort((u, v) => v.ey - u.ey);   // far first

    // Log distances have no linear bar: a decade ruler from r(d) to r(10d)
    // straight down from the centre, when a decade pair fits the drawn range.
    let ruler = null;
    if (mode === "log" && n > 1) {
      const as = sats.map((b) => b.a_km), aMin = Math.min(...as), aMax = Math.max(...as);
      const units = focusId ? [1e4, 1e5, 1e6, 1e7] : [0.1, 1, 10, 100].map((au) => eng.km(au));
      let pair = null;
      for (const d of units) if (d >= aMin * 0.999 && 10 * d <= aMax * 1.001) pair = d;
      if (pair !== null) {
        const r1 = eng.logRadius(pair, aMin, aMax, rMin, R_MAX), r2 = eng.logRadius(10 * pair, aMin, aMax, rMin, R_MAX);
        const a = P(0, -r1), z = P(0, -r2);
        const fmt = (d) => focusId ? String(Math.round(d)).replace(/\B(?=(\d{3})+(?!\d))/g, "\u202f") : String(Math.round(eng.au(d) * 10) / 10).replace(".", L === "nb" ? "," : ".");
        ruler = { a, z, text: fmt(pair) + " → " + fmt(10 * pair) + (focusId ? " km" : " AU") };
      }
    }

    // ---- names -------------------------------------------------------------
    // A name is written beside its body and ALONG its own orbit, and that one
    // orbit ducks under it. The break is arithmetic, not taste: eight evenly
    // spaced orbits leave 33 units between rings, while the core of a 19-unit
    // name — the box lint measures a stroke against — is 43 units across its
    // diagonal. No ring gap can hold one at any size lint calls readable (its
    // floor is 14), so a name that clears every ring does not exist. Sitting
    // ON its own ring is the one placement whose core stays clear of every
    // OTHER ring, and breaking a line so that it can carry its own label is
    // what an atlas has always done with a contour. The rings on either side
    // pass through the outer margin of the box, which is what the halo — and
    // lint's core, rather than the whole box — is for.
    // Placed here rather than by the shared solver (layout/labels.ts) because
    // the break has to know where the name landed, and because the solver's
    // eight sides at two rings cannot aim at a 33-unit gap. kit.textWidth
    // measures with the same heuristic lint does, so the boxes reserved here
    // are the boxes lint will check — the anatomy pack's columns place names
    // themselves for the same reason.
    // The core lint reads a label by: the middle 60 % across and 50 % down of
    // its box, offset a fifth and a quarter in. A SILENT COPY of the four
    // numbers in `lintText` (src/lint/lint.ts, the overlap-label-stroke rule)
    // — a layout body is compiled from YAML and cannot import, so the
    // duplication is forced. Change one, change the other: the 200-date sweeps
    // in tests/space-template.test.ts are all that would notice.
    const coreOf = (b) => ({ x: b.x + b.w * 0.2, y: b.y + b.h * 0.25, w: b.w * 0.6, h: b.h * 0.5 });
    const grow = (b, kx, ky) => ({ x: b.x - kx, y: b.y - ky, w: b.w + 2 * kx, h: b.h + 2 * ky });
    const turn = (p, q, r) => Math.sign((q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]));
    const segHit = (a, b, r) => {
      if (Math.max(a[0], b[0]) < r.x || Math.min(a[0], b[0]) > r.x + r.w || Math.max(a[1], b[1]) < r.y || Math.min(a[1], b[1]) > r.y + r.h) return false;
      if (a[0] >= r.x && a[0] <= r.x + r.w && a[1] >= r.y && a[1] <= r.y + r.h) return true;
      const k = [[r.x, r.y], [r.x + r.w, r.y], [r.x + r.w, r.y + r.h], [r.x, r.y + r.h]];
      for (let j = 0; j < 4; j++) { const u = k[j], v = k[(j + 1) % 4]; if (turn(a, b, u) !== turn(a, b, v) && turn(u, v, a) !== turn(u, v, b)) return true; }
      return false;
    };
    const pathHit = (pts, r, closed) => { const m = closed ? pts.length : pts.length - 1; for (let j = 0; j < m; j++) if (segHit(pts[j], pts[(j + 1) % pts.length], r)) return true; return false; };
    // The ring minus the arc inside the box: the longest run of it that
    // survives, drawn as one open polyline the long way round. A ring so small
    // that a name would take most of it keeps its whole circle — a stub reads
    // as a mistake, while a graze is only a graze, and lint says so either way.
    const duck = (pts, r) => {
      const m = pts.length, ok = [];
      for (let j = 0; j < m; j++) ok.push(!segHit(pts[j], pts[(j + 1) % m], r));
      if (ok.every((v) => v)) return null;
      let bs = -1, bl = 0;
      for (let s = 0; s < m; s++) {
        if (!ok[s] || ok[(s - 1 + m) % m]) continue;
        let len = 0;
        while (len < m && ok[(s + len) % m]) len++;
        if (len > bl) { bl = len; bs = s; }
      }
      if (bs < 0 || bl < m / 2) return null;
      const out = [];
      for (let j = 0; j <= bl; j++) out.push(pts[(bs + j) % m]);
      return out;
    };

    const nameTexts = [];
    if (names !== "none") {
      // What a name may not touch: any disc (its whole box — a name never sits
      // on a body), any text already on the page, whether a name written here
      // or a caption pushed at the end, and — with its core, the way lint
      // reads it — every guide except the one orbit that will duck.
      const discs = [boxAt([c0.x, c0.y], 2 * extent(centre, centreDrawn), 2 * extent(centre, centreDrawn))];
      for (const p of placed) discs.push(boxAt([p.q.x, p.q.y], 2 * extent(p.b, p.r), 2 * extent(p.b, p.r)));
      const guides = [];
      if (orbitsOn) sats.forEach((b, i) => guides.push({ id: "orbit_" + b.id, pts: orbitPts[i], ring: i }));
      if (axisPts) guides.push({ id: "axis", pts: axisPts, ring: -1 });
      if (framePts) guides.push({ id: "frame", pts: framePts, ring: -2 });
      // A ring around a body is ink like any other: Mimas is closer to Saturn's
      // rings than to any orbit, and its name has to clear their rim.
      const ringRim = (b, at, r) => {
        const rg = ringPieces(b, "rim", at, r, flat);
        if (rg) for (const d of [...rg.back, ...rg.front]) if (d.kind === "stroke") guides.push({ id: "rim", pts: d.pts, ring: -1 });
      };
      ringRim(centre, [c0.x, c0.y], centreDrawn);
      for (const p of placed) ringRim(p.b, [p.q.x, p.q.y], p.r);
      const written = captionBoxes();
      for (const pts of captionRules()) guides.push({ id: "scale_bar", pts, ring: -1 });
      if (ruler) {
        guides.push({ id: "scale_bar", pts: [[ruler.a.x, ruler.a.y], [ruler.z.x, ruler.z.y]], ring: -1 });
        guides.push({ id: "scale_bar", pts: [[ruler.a.x - 6, ruler.a.y], [ruler.a.x + 6, ruler.a.y]], ring: -1 });
        guides.push({ id: "scale_bar", pts: [[ruler.z.x - 6, ruler.z.y], [ruler.z.x + 6, ruler.z.y]], ring: -1 });
        written.push({ x: (ruler.a.x + ruler.z.x) / 2 + 10, y: (ruler.a.y + ruler.z.y) / 2 - 10, w: kit.textWidth(ruler.text, 16), h: 20 });
      }
      // The centre goes first, and not out of politeness: it is the one body
      // with no ring of its own to sit on, so it has to take a gap, and the
      // gap it can reach is the innermost one — the same one Mercury wants.
      const jobs = [{ id: "label_" + centre.id, q: c0, e: extent(centre, centreDrawn), text: nameOf(centre), color: C.ink, ring: -1, a: 0 }];
      for (const p of placed) jobs.push({ id: "label_" + p.b.id, q: p.q, e: extent(p.b, p.r), text: nameOf(p.b), color: lit(p.b.id) ? C.accent : C.ink, ring: p.i, a: p.a });
      for (const p of jobs) {
        // THE LIMIT OF PLACING OUR OWN NAMES, and what is done about it. A
        // translated copy swaps these words after this body has run and leaves
        // every box where it was put, so every measurement here is of the word
        // written NOW. A character of headroom goes into the clearance between
        // names (`room` below) and into the gap cut in the ring (the duck) —
        // measured, both are free. It does NOT go into where a candidate sits:
        // letting it move the candidates as well takes the Jupiter portrait
        // from 200 dates clean to 0, because the gap between Jupiter's disc
        // and Io's ring is 27 units and the name stops fitting the only place
        // it fits. Paying for a hypothetical figure with a real one is not a
        // trade worth making. So: a swap of a character or so reads; a longer
        // one can reach a neighbouring name, or — where the search had to use
        // a gap rather than a ring — the next ring along, and the translated
        // copy lints where this one does not. The row view above has placed
        // its own names since before this, with the same limit.
        const text = p.text, w = kit.textWidth(text, LABEL_PX), e = p.e, own = p.ring >= 0 ? "orbit_" + sats[p.ring].id : "";
        const cands = [];
        // First choice: along its own orbit, just clear of the body, either
        // way round. On a ring too small to carry a name — the inner planets
        // at true distances — the turn would be most of a circle; skip it.
        const turnBy = p.ring >= 0 ? (w / 2 + e + 6) / Math.max(orbitR[p.ring], 1) : Infinity;
        if (turnBy < 1.2) for (const k of [1, -1, 1.5, -1.5, 2.1, -2.1]) {
          const q = P(orbitR[p.ring] * Math.cos(p.a + k * turnBy), orbitR[p.ring] * Math.sin(p.a + k * turnBy));
          cands.push([q.x, q.y]);
        }
        // Then out from the body and round the compass, starting outward —
        // and for the centre, which has no outward, straight DOWN the page
        // (−π/2 on a y-up canvas), under the body the way a caption sits.
        const th0 = p.ring >= 0 ? Math.atan2(p.q.y - c0.y, p.q.x - c0.x) : -Math.PI / 2;
        for (const extra of [6, 26]) for (const m of [0, 1, -1, 2, -2, 3, -3, 4]) {
          const th = th0 + (m * Math.PI) / 4, dx = Math.cos(th), dy = Math.sin(th);
          const d = e + extra + (Math.abs(dx) * w + Math.abs(dy) * LABEL_H) / 2;
          cands.push([p.q.x + dx * d, p.q.y + dy * d]);
        }
        // The first spot that costs nothing wins, so the order above is the
        // preference. When no spot is free — thirteen rings in 230 units
        // cannot carry thirteen names — take the CHEAPEST rather than the
        // first, and the prices are what each fault costs the reader: off the
        // page is a lint error and unreadable; two names on top of each other
        // are two names nobody can read; a name across a guide is the graze
        // lint warns about; a name touching a disc is only untidy — measured,
        // it beat every ordering that treated a body as the worse offence,
        // because next to a body is where the name belongs.
        // Two boxes per candidate: `bx` is what gets drawn, `room` is the same
        // box a character wider, for the word a translation may put there.
        let pick = null, best = null, bestCost = Infinity;
        for (const c of cands) {
          const bx = boxAt(c, w, LABEL_H), room = boxAt(c, w + TRANSLATED_ROOM, LABEL_H), co = coreOf(bx);
          let cost = bx.x < 4 || bx.y < 4 || bx.x + bx.w > kit.CANVAS.w - 4 || bx.y + bx.h > kit.CANVAS.h - 4 ? 10000 : 0;
          for (const q of written) if (boxHit(room, q, 2)) cost += 100;
          for (const g of guides) if (g.id !== own && pathHit(g.pts, co, g.ring === -2 || (g.ring >= 0 && orbitWhole[g.ring]))) cost += 10;
          for (const q of discs) if (boxHit(bx, q, 2)) cost += 6;
          if (cost === 0) { pick = bx; break; }
          if (cost < bestCost) { bestCost = cost; best = bx; }
        }
        if (!pick) pick = best;
        written.push(grow(pick, TRANSLATED_ROOM / 2, 0));
        nameTexts.push({ id: p.id, at: [pick.x + pick.w / 2, pick.y + pick.h / 2], text, color: p.color });
        if (orbitsOn && p.ring >= 0) {
          // The gap is cut wider than the name by a character, and taller by
          // nothing: a swapped word grows sideways — its line height is the
          // font's, not the language's — and on the innermost ring, where the
          // circle turns fastest, every unit of height costs degrees of arc.
          const arc = duck(orbitPts[p.ring], grow(pick, 2 + TRANSLATED_ROOM, 2));
          // Written back IN PLACE, and that is load-bearing: the guide entry
          // above holds this very array, so the names still to be placed see
          // the ring as it will be drawn — a spot inside a gap already cut is
          // free, and a ring that has ducked is no longer whole (orbitWhole
          // says so, and pathHit closes the ring only while it is).
          if (arc) { orbitPts[p.ring].length = 0; for (const q of arc) orbitPts[p.ring].push(q); orbitWhole[p.ring] = false; }
        }
      }
    }

    // ---- and now the ink, back to front -------------------------------------
    // Orbits first (guides behind everything), then the centre and its axis,
    // then the bodies far-to-near so a near one covers a far one when tilted.
    if (framePts) push(kit.stroke("frame", framePts, { color: C.guide, strokeWidth: 1.5, dash: true, ms: MS.guides }));
    if (orbitsOn) sats.forEach((b, i) => {
      push(kit.stroke("orbit_" + b.id, orbitPts[i], { closed: orbitWhole[i], color: C.guide, strokeWidth: 1.2, dash: true, ms: MS.guides }));
      anchors["orbit_" + b.id] = orbitPts[i][0];
    });
    push(bodyElement(centre, centre.id, [c0.x, c0.y], centreDrawn, flat));
    anchors[centre.id] = [c0.x, c0.y];
    if (axisPts) {
      push(kit.stroke("axis", axisPts, { color: C.guide, strokeWidth: 1.5, dash: true, ms: MS.guides }));
      anchors.axis = [c0.x, c0.y];
    }
    for (const p of placed) { push(bodyElement(p.b, p.b.id, [p.q.x, p.q.y], p.r, flat)); anchors[p.b.id] = [p.q.x, p.q.y]; }
    if (ruler) {
      push(kit.group("scale_bar", [
        kit.stroke("scale_bar__line", [[ruler.a.x, ruler.a.y], [ruler.z.x, ruler.z.y]], { color: C.guide, strokeWidth: 2, ms: MS.guides }),
        kit.stroke("scale_bar__t0", [[ruler.a.x - 6, ruler.a.y], [ruler.a.x + 6, ruler.a.y]], { color: C.guide, strokeWidth: 2, ms: MS.guides }),
        kit.stroke("scale_bar__t1", [[ruler.z.x - 6, ruler.z.y], [ruler.z.x + 6, ruler.z.y]], { color: C.guide, strokeWidth: 2, ms: MS.guides }),
        kit.text("scale_bar__label", [(ruler.a.x + ruler.z.x) / 2 + 10, (ruler.a.y + ruler.z.y) / 2], ruler.text, { fontSize: 16, color: C.guide, anchor: "start" }),
      ]));
      anchors.scale_bar = [(ruler.a.x + ruler.z.x) / 2, (ruler.a.y + ruler.z.y) / 2];
    }
    for (const t of nameTexts) {
      push(kit.text(t.id, t.at, t.text, { fontSize: LABEL_PX, color: t.color }));
      anchors[t.id] = t.at;
    }
  }

  // Every figure says which truth it keeps; sizes and distances add a bar at the bottom right.
  push(kit.text("scale_note", [F.x0, 36], eng.scaleNote(mode, L, reducedName), { fontSize: NOTE_PX, color: C.guide, anchor: "start" }));
  anchors.scale_note = [F.x0, 36];
  const bar = linearBar();
  if (bar) {
    const bx1 = F.x1, bx0 = F.x1 - bar.lengthPx, by = 40;
    push(kit.group("scale_bar", [
      kit.stroke("scale_bar__line", [[bx0, by], [bx1, by]], { color: C.guide, strokeWidth: 2, ms: MS.guides }),
      kit.stroke("scale_bar__t0", [[bx0, by - 6], [bx0, by + 6]], { color: C.guide, strokeWidth: 2, ms: MS.guides }),
      kit.stroke("scale_bar__t1", [[bx1, by - 6], [bx1, by + 6]], { color: C.guide, strokeWidth: 2, ms: MS.guides }),
      kit.text("scale_bar__label", [(bx0 + bx1) / 2, by - 18], bar.label, { fontSize: 16, color: C.guide }),
    ]));
    anchors.scale_bar = [(bx0 + bx1) / 2, by];
  }
  if (missingText !== "") {
    push(kit.text("missing_note", [500, 36], missingText, { fontSize: NOTE_PX, color: C.guide }));
    anchors.missing_note = [500, 36];
  }

  return { drawables, labels, anchors, order };
---
template: sky_map
title: The night sky from a place at a time
version: 1
kit: 9
status: ready
engines: [space, sky]
description: >-
  THE SKY OVERHEAD, from a place on Earth at a moment: a round chart with the
  zenith at its centre and the horizon as its rim, north at the top and EAST ON
  THE LEFT — the way a planisphere reads when you hold it up and look through
  it. Every star to `limit_mag` that is above the horizon is drawn, sized by
  brightness and tinted by colour, from a bundled catalogue of 1 040 stars; the
  Sun, Moon and naked-eye planets are placed by a real ephemeris and the Moon
  is drawn with the phase it actually has that night, its lit side turned
  toward the Sun. `lat`/`lon`/`place` say where the viewer stands (Oslo by
  default), `time` when (an ISO datetime, or now); `hours` and `days` are
  numeric offsets from it and THE ANIMATABLE HANDLES — {"animate": {"hours":
  6}} turns the sky through a night, {"animate": {"days": 182}} shows why the
  same stars are not up in six months. Anything below the horizon is simply not
  drawn, and a body you named in `show` that has set is SAID so in the caption
  rather than silently missing. The star field is ONE element, `stars`, because
  no author can know which stars are up at a given hour — so to ask a question
  about one star, name it in `mark` and it becomes its own element with its own
  name as its id ({"ask": {"question": "Which one is Vega?", "widget": "click",
  "answer": "vega"}}); `highlight` marks AND tints. Choose this scene for any
  request about tonight's sky, a constellation, a named star, where a planet is
  tonight, the Moon's phase, or why the sky turns.
params:
  type: object
  properties:
    lat:
      type: number
      minimum: -90
      maximum: 90
      description: "Observer's latitude in degrees north (default 59.91, Oslo). Negative is south."
    lon:
      type: number
      minimum: -180
      maximum: 180
      description: "Observer's longitude in degrees east (default 10.75, Oslo). Negative is west."
    place:
      type: string
      description: "The place name written under the chart (default Oslo, and only when lat/lon are the default too — a chart at other coordinates does not claim to be somewhere it is not)."
    time:
      type: string
      description: "ISO datetime with its offset (2026-09-07T22:00:00+02:00), or now (the default). Without an offset the time is read as UTC; a bare date means 22:00 local solar time where the observer stands."
      x-translate: false
    hours:
      type: number
      minimum: -24
      maximum: 24
      description: "Offset from time in hours (default 0) — an animatable handle: animate hours to 6 and the sky turns a quarter of a circle about the pole. Write the starting value (0) in params when you animate."
    days:
      type: number
      minimum: -366
      maximum: 366
      description: "Offset from time in days (default 0) — the other animatable handle: animate days to 182 and the same hour of night shows the opposite half of the sky."
    limit_mag:
      type: number
      minimum: 2
      maximum: 4.5
      description: "The faintest star drawn (default 4.5, which is roughly what a dark suburban sky shows). 2 keeps only the few dozen brightest. A star does not change size when this does."
    names:
      type: string
      enum: [en, nb, la, none]
      description: "Label language: en (default; the descriptive English names, The Great Bear), la (the international Latin names, Ursa Major), nb (Norwegian, Store bjørn), none. Star proper names are the same word in every language except where Norwegian has its own."
    show:
      type: array
      items: { type: string }
      description: "Which Sun/Moon/planet ids to mark (sun, moon, mercury, venus, mars, jupiter, saturn, uranus, neptune), or the group words planets, inner, outer, all, which expand in place. Default: sun, moon and the five planets you can see with the naked eye, drawn when they are up and passed over in silence when they are not. Name one explicitly and the chart SAYS so when it is below the horizon."
      x-translate: false
    mark:
      type: array
      items: { type: string }
      description: "Stars or bodies to lift out into their own elements so a question or a highlight command can address them, WITHOUT changing how they look — the way to write {\"ask\": {\"widget\": \"click\", \"answer\": \"sirius\"}} without the figure giving the answer away. A star's id is its proper name in lower case (sirius, betelgeuse)."
      x-translate: false
    highlight:
      type: array
      items: { type: string }
      description: "Stars or bodies to tint for the whole figure; they are lifted into their own elements too. To make one glow for ONE sentence use the highlight COMMAND instead ({\"highlight\": {\"target\": [\"sirius\"]}}), and a click question glows its answer by itself."
      x-translate: false
    title:
      type: string
element_ids:
  horizon: the circle where the sky meets the ground — everything drawn is inside it
  compass_n: "N at the top of the chart"
  compass_e: "E on the LEFT (a chart held overhead reverses east and west)"
  compass_s: "S at the bottom"
  compass_w: "W on the right"
  stars: every star that is not singled out, as one element — this is what an author draws when the stars come out
  <star_name>: a star named in mark or highlight becomes its own element, its id its proper name in lower case (sirius, vega, betelgeuse)
  <body_id>: sun, moon, mercury, venus, mars, jupiter, saturn, uranus or neptune, drawn only when it is above the horizon
  moon: the Moon, drawn with the phase it has that night, its lit side turned toward the Sun
  label_<id>: the written name of a body or a singled-out star
  place_label: the place and the local time, along the foot
  sky_note: "the figure's one caption: daylight, anything named that has set, unknown names, and that the Sun, Moon and planets are drawn as symbols"
  title: figure title, when set
examples:
  - request: "What is up over Oslo tonight?"
    params: { time: "2026-09-07T22:00:00+02:00" }
  - request: "Hvor er Saturn i kveld?"
    params: { time: "2026-09-07T22:00:00+02:00", show: ["saturn"], highlight: ["saturn"], names: "nb" }
  - request: "Which star is Vega?"
    params: { time: "2026-09-07T22:00:00+02:00", mark: ["Vega", "Deneb", "Altair"] }
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const eng = engines.sky, spc = engines.space;
  const CH = eng.chart;                                  // { cx: 500, cy: 385, r: 285 }
  const F = { x0: 60, y0: 80, x1: 940, y1: 700 };
  const NOTE_PX = 18, LABEL_PX = 19, COMPASS_PX = 20;
  const LABEL_H = LABEL_PX * 1.25;
  // Headroom for the OTHER word: a translated copy swaps the words this body
  // measured AFTER it has run (src/layout/text-map.ts) and leaves every box
  // where it was put. A character's width, added to the clearance a name
  // reserves — never to where a candidate sits.
  const TRANSLATED_ROOM = kit.textWidth("n", LABEL_PX);

  const num = (v, d) => (typeof v === "number" && Number.isFinite(v) ? v : d);
  const clamp = (lo, hi, v) => Math.max(lo, Math.min(hi, v));
  const list = (v) => (Array.isArray(v) ? v.filter((x) => typeof x === "string" && x.trim() !== "") : []);
  const oneOf = (v, opts, d) => (typeof v === "string" && opts.indexOf(v) >= 0 ? v : d);

  const lat = clamp(-90, 90, num(params.lat, 59.91));
  const lon = ((num(params.lon, 10.75) + 540) % 360) - 180;
  const names = oneOf(params.names, ["en", "nb", "la", "none"], "en");
  const L = names === "none" ? "en" : names;
  const bodyLang = L === "nb" ? "nb" : "en";
  const limit = clamp(2, 4.5, num(params.limit_mag, 4.5));
  const at = eng.resolveTime(params.time, params.hours, params.days, lon);
  // A chart at coordinates the author chose does not claim to be Oslo.
  const defaultSpot = params.lat === undefined && params.lon === undefined;
  const placeText = typeof params.place === "string" && params.place.trim() !== "" ? params.place.trim() : (defaultSpot ? "Oslo" : "");

  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  const unknown = [];
  const sayUnknown = (q) => { const s = q.trim(); if (unknown.indexOf(s) < 0) unknown.push(s); };

  // The nine the sky can place — sky.ts's ephemeris knows exactly these. Every
  // other body in the round-1 table (Earth, a moon, a dwarf planet) has no
  // naked-eye place in a chart of the sky, so it is not drawn.
  const SKY_IDS = ["sun", "moon", "mercury", "venus", "mars", "jupiter", "saturn", "uranus", "neptune"];
  const GROUP_WORDS = ["planets", "inner", "outer", "all"];
  const skyBodies = (q) => spc.bodies([q]).bodies.filter((b) => SKY_IDS.indexOf(b.id) >= 0);

  // ---- what the author singled out ---------------------------------------
  // `draw` has no wildcard and the model cannot know which stars are up at a
  // given hour, so the field is ONE element. Anything named in `mark` or
  // `highlight` is lifted OUT of it into its own element, which is what makes
  // a click question and the highlight command reach a single star.
  const markStars = new Set(), markBodies = new Set();
  const litStars = new Set(), litBodies = new Set();
  const take = (q, stars, bodies) => {
    const s = eng.findStar(q);
    if (s) { stars.add(s.hip); return true; }
    const hits = skyBodies(q);
    if (hits.length === 0) return false;
    for (const b of hits) bodies.add(b.id);
    return true;
  };
  for (const q of list(params.mark)) if (!take(q, markStars, markBodies)) sayUnknown(q);
  for (const q of list(params.highlight)) {
    if (take(q, litStars, litBodies)) take(q, markStars, markBodies);
    else sayUnknown(q);
  }

  // ---- the bodies ---------------------------------------------------------
  const DEFAULT_SHOW = ["sun", "moon", "mercury", "venus", "mars", "jupiter", "saturn"];
  const asked = list(params.show);
  const showIds = [];
  const addBody = (id) => { if (showIds.indexOf(id) < 0) showIds.push(id); };
  if (asked.length === 0) {
    for (const id of DEFAULT_SHOW) addBody(id);
  } else for (const q of asked) {
    // The sibling template's `bodies` takes the same group words, so a model
    // writing show: ["outer"] here is generalising what this pack taught it —
    // and EVERY body of the expansion is kept, never just the first (round 1's
    // own scar, in solar_system's highlight param). Earth rides in on
    // "planets" and "all" and can never be a point in its own sky, so it drops
    // out without a word; a name nobody can place is only "unknown" when the
    // author typed that name themselves.
    const hits = skyBodies(q);
    for (const b of hits) addBody(b.id);
    if (hits.length === 0 && GROUP_WORDS.indexOf(q.trim().toLowerCase()) < 0) sayUnknown(q);
  }
  for (const id of markBodies) addBody(id);
  // The Sun is asked for whether or not it is drawn: whether it is DAY is a
  // fact about the moment, not about the author's list.
  const posIds = showIds.slice();
  if (posIds.indexOf("sun") < 0) posIds.push("sun");
  const bPos = eng.bodyPositions(posIds, at, lat, lon);
  const bodyName = (id) => { const b = spc.body(id); return b ? (b.name[bodyLang] || b.name.en) : id; };
  const below = [];
  // Only a body the author NAMED is reported as set: the default list is half
  // below the horizon at any hour, and saying so every time would be noise.
  for (const id of showIds) {
    const p = bPos[id];
    if ((!p || p.alt < 0) && (asked.length > 0 || markBodies.has(id))) below.push(bodyName(id));
  }
  const up = showIds.filter((id) => bPos[id] && bPos[id].alt >= 0);
  const daylight = bPos.sun !== undefined && bPos.sun.alt > -0.5;

  // ---- the captions, measured before anything is placed -------------------
  const clauses = eng.noteClauses({ daylight: daylight, below: below, unknown: unknown, symbols: up.length > 0 }, L);
  let noteText = clauses.join(" · ");
  // ONE caption, and it drops its cheapest clause rather than running off the
  // page. Round 1's known limit was two captions colliding in this same foot
  // strip; one caption cannot collide with itself.
  while (clauses.length > 0 && kit.textWidth(noteText, NOTE_PX) > F.x1 - F.x0) { clauses.pop(); noteText = clauses.join(" · "); }
  const clock = eng.localClock(at, lon);
  const placeLine = (placeText !== "" ? placeText + " · " : "") + clock.date + " " + clock.time;
  const titleText = typeof params.title === "string" && params.title.trim() !== "" ? params.title.trim() : "";
  const textBox = (at2, s, fs, start) => { const w = kit.textWidth(s, fs), h = fs * 1.25; return { x: start ? at2[0] : at2[0] - w / 2, y: at2[1] - h / 2, w, h }; };
  const captionBoxes = () => {
    const out = [textBox([F.x0, 24], placeLine, NOTE_PX, true)];
    if (noteText !== "") out.push(textBox([F.x0, 52], noteText, NOTE_PX, true));
    if (titleText !== "") out.push(textBox([500, 726], titleText, 30));
    return out;
  };

  // ---- geometry, all measured before any ink ------------------------------
  const P = (p) => eng.project(p, CH);
  // Traced right round and then back to the FIRST POINT ITSELF, not to a
  // recomputed cos(2π) — which lands half an ulp off and leaves a hairline gap
  // in the rim where the pen started.
  const ring = (c, r, n) => {
    const pts = [];
    for (let i = 0; i < n; i++) { const t = (2 * Math.PI * i) / n; pts.push([c[0] + r * Math.cos(t), c[1] + r * Math.sin(t)]); }
    pts.push([pts[0][0], pts[0][1]]);
    return pts;
  };
  const horizonPts = ring([CH.cx, CH.cy], CH.r, 144);

  const COMPASS = [[0, "compass_n", "N", "N"], [90, "compass_e", "E", "Ø"], [180, "compass_s", "S", "S"], [270, "compass_w", "W", "V"]];
  const compass = COMPASS.map((c) => {
    const rr = CH.r + 20, a = (c[0] * Math.PI) / 180;
    return { id: c[1], text: L === "nb" ? c[3] : c[2], at: [CH.cx - rr * Math.sin(a), CH.cy + rr * Math.cos(a)] };
  });

  const sPos = eng.starPositions(at, lat, lon);
  const field = [], byName = new Map();
  for (const s of eng.stars()) {
    const p = sPos.get(s.hip);
    if (!p || p.alt < 0) continue;
    const singled = markStars.has(s.hip);
    if (s.mag > limit && !singled) continue;
    const d = { s: s, at: P(p), r: eng.starRadius(s.mag) };
    if (!singled) { field.push(d); continue; }
    // TWO catalogue stars share the proper name "Alnair" (HIP 68002, ζ Cen,
    // and HIP 109268, α Gru), so `mark: ["hip_68002", "hip_109268"]` would
    // mint the id "alnair" twice — a duplicate drawable id, which the compile
    // guard throws on and layoutSpec catches as a silent fall-through to
    // tier-2. The BRIGHTER one keeps the name, which is the star the name
    // means and the same rule findStar's index follows; the other goes back
    // into the field rather than vanishing from a sky it is really in.
    const sid = eng.starId(s), held = byName.get(sid);
    if (held === undefined) { byName.set(sid, d); continue; }
    if (s.mag < held.s.mag) { byName.set(sid, d); field.push(held); } else field.push(d);
  }
  const own = [...byName.values()];

  const bodies = up.map((id) => {
    const b = spc.body(id);
    return { id: id, b: b, at: P(bPos[id]), r: id === "sun" ? 11 : id === "moon" ? 12 : 6 };
  });

  // The Moon's two outlines, worked out here rather than with the ink, because
  // its rim is a stroke a name has to keep off — the same reason round 1 hands
  // Saturn's ring rim to the label search.
  let moonRim = null, moonLit = null;
  for (const b of bodies) {
    if (b.id !== "moon") continue;
    const limb = eng.moonLimb(at, lat, lon), r = b.r, c = b.at;
    moonRim = ring(c, r, 48);
    let dir = [1, 0];
    if (limb.toward) {
      const q = P(limb.toward), dx = q[0] - c[0], dy = q[1] - c[1], m = Math.hypot(dx, dy) || 1;
      dir = [dx / m, dy / m];
    }
    const nrm = [-dir[1], dir[0]];
    // The terminator is a half-ellipse whose semi-axis along the bright
    // direction is r(1 - 2k): +r at new (it lies on the limb, no lit area),
    // 0 at quarter (a straight edge through the centre), -r at full (it
    // reaches the far limb and the whole disc is lit). The lit area then works
    // out to exactly k·πr², which is what makes the phase checkable by area.
    const d = r * (1 - 2 * limb.fraction);
    moonLit = [];
    for (let i = 0; i <= 32; i++) { const t = -Math.PI / 2 + (Math.PI * i) / 32, ct = Math.cos(t), st = Math.sin(t); moonLit.push([c[0] + r * ct * dir[0] + r * st * nrm[0], c[1] + r * ct * dir[1] + r * st * nrm[1]]); }
    for (let i = 32; i >= 0; i--) { const t = -Math.PI / 2 + (Math.PI * i) / 32, ct = Math.cos(t), st = Math.sin(t); moonLit.push([c[0] + d * ct * dir[0] + r * st * nrm[0], c[1] + d * ct * dir[1] + r * st * nrm[1]]); }
  }

  // ---- names -------------------------------------------------------------
  // Two rules, and they are different on purpose.
  //   A BODY the author asked for by name always gets its name, so its search
  //   takes the CHEAPEST spot; its candidates aim INWARD, toward the zenith,
  //   where the dome is emptiest — a name placed outward from a body near the
  //   rim runs off the page.
  //   A STAR's name is written only where it costs the READER nothing: a name
  //   on another name, across the rim, or off the page is worse than no name,
  //   so a star that cannot have one goes without. Star dots are a different
  //   matter — they are the page a star chart writes on, they carry no lint
  //   (a dot is a one-point stroke with a circle hint, so no stroke rule sees
  //   it), and refusing to write over them would leave the field unnamed. So
  //   the price list has two buckets: `hard` is what a reader — and lint —
  //   would call a defect, `soft` is only untidy, and a spot is chosen by
  //   hard first, soft second. tests/sky-template.test.ts holds the floor so
  //   this cannot become "write nothing and lint clean".
  const boxAt = (c, w, h) => ({ x: c[0] - w / 2, y: c[1] - h / 2, w, h });
  const boxHit = (a, b, pad) => a.x - pad < b.x + b.w && a.x + a.w + pad > b.x && a.y - pad < b.y + b.h && a.y + a.h + pad > b.y;
  // The core lint reads a label by: the middle 60 % across and 50 % down of
  // its box, offset a fifth and a quarter in. A SILENT COPY of the four
  // numbers in lintText (src/lint/lint.ts, the overlap-label-stroke rule) — a
  // layout body is compiled from YAML and cannot import, so the duplication is
  // forced. Change one, change the other; the 200-moment sweeps in
  // tests/sky-template.test.ts are all that would notice.
  const coreOf = (b) => ({ x: b.x + b.w * 0.2, y: b.y + b.h * 0.25, w: b.w * 0.6, h: b.h * 0.5 });
  const turn = (p, q, r) => Math.sign((q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]));
  const segHit = (a, b, r) => {
    if (Math.max(a[0], b[0]) < r.x || Math.min(a[0], b[0]) > r.x + r.w || Math.max(a[1], b[1]) < r.y || Math.min(a[1], b[1]) > r.y + r.h) return false;
    if (a[0] >= r.x && a[0] <= r.x + r.w && a[1] >= r.y && a[1] <= r.y + r.h) return true;
    const k = [[r.x, r.y], [r.x + r.w, r.y], [r.x + r.w, r.y + r.h], [r.x, r.y + r.h]];
    for (let j = 0; j < 4; j++) { const u = k[j], v = k[(j + 1) % 4]; if (turn(a, b, u) !== turn(a, b, v) && turn(u, v, a) !== turn(u, v, b)) return true; }
    return false;
  };
  // How far a box is from a point, per axis — the one test both prunings use.
  const boxNear = (b, c, reach) => Math.max(b.x - c[0], 0, c[0] - (b.x + b.w)) < reach && Math.max(b.y - c[1], 0, c[1] - (b.y + b.h)) < reach;
  // Only the segments of a guide that could possibly reach this name, as a
  // flat list of endpoint PAIRS. Four hundred stars and a 144-segment rim,
  // times thirty candidate spots, times a name, times two thousand layouts in
  // the sweep, is the difference between a test that runs and one that times
  // out — and pruning once per NAME instead of once per candidate is where the
  // whole saving is.
  const nearSegs = (pts, c, reach) => {
    const out = [];
    for (let j = 0; j + 1 < pts.length; j++) {
      const a = pts[j], b = pts[j + 1];
      const bx = { x: Math.min(a[0], b[0]), y: Math.min(a[1], b[1]), w: Math.abs(a[0] - b[0]), h: Math.abs(a[1] - b[1]) };
      if (boxNear(bx, c, reach)) { out.push(a); out.push(b); }
    }
    return out;
  };

  const written = captionBoxes();
  for (const c of compass) written.push(textBox(c.at, c.text, COMPASS_PX));
  const guides = [horizonPts];                       // Task 5 pushes the constellation lines here
  if (moonRim) guides.push(moonRim);
  const discs = [];
  for (const d of field) discs.push(boxAt(d.at, 2 * d.r, 2 * d.r));
  for (const d of own) discs.push(boxAt(d.at, 2 * d.r * 1.25, 2 * d.r * 1.25));
  for (const b of bodies) discs.push(boxAt(b.at, 2 * b.r, 2 * b.r));

  const nameTexts = [];
  /** Candidate spots around a point, each carrying which `gaps` ring it came
   *  from: `dirs` are screen directions in preference order, `gaps` how far
   *  past the disc to sit. */
  const spotsAround = (c, w, e, dirs, gaps) => {
    const out = [];
    for (let g = 0; g < gaps.length; g++) for (const th of dirs) {
      const dx = Math.cos(th), dy = Math.sin(th);
      const d = e + gaps[g] + (Math.abs(dx) * w + Math.abs(dy) * LABEL_H) / 2;
      out.push({ at: [c[0] + dx * d, c[1] + dy * d], ring: g });
    }
    return out;
  };
  /** What a spot costs the reader. `hard`: off the page is unreadable and a
   *  lint error; two names on top of each other are two names nobody can read;
   *  a name across a drawn line is the graze lint warns about. `soft`: how far
   *  out the name had to walk, plus the star dots it ends up sitting on — a
   *  dot under a name is only untidy, and on a star chart unavoidable, but a
   *  name that ran three rings out to dodge two of them no longer reads as
   *  belonging to anything, so a ring costs three dots. `freeOnly` means take a
   *  spot with no HARD cost or none at all. */
  const RING_COST = 3;
  const place = (id, c, e, text, color, dirs, gaps, freeOnly) => {
    const w = kit.textWidth(text, LABEL_PX);
    const reach = e + gaps[gaps.length - 1] + w + LABEL_H + 8;
    const near = written.filter((t) => boxNear(t, c, reach));
    const dots = discs.filter((t) => boxNear(t, c, reach));
    const segs = guides.map((g) => nearSegs(g, c, reach)).filter((s) => s.length > 0);
    let best = null, bestHard = Infinity, bestSoft = Infinity;
    for (const q of spotsAround(c, w, e, dirs, gaps)) {
      const bx = boxAt(q.at, w, LABEL_H);
      let hard = bx.x < 4 || bx.y < 4 || bx.x + bx.w > kit.CANVAS.w - 4 || bx.y + bx.h > kit.CANVAS.h - 4 ? 10000 : 0;
      const room = { x: bx.x - TRANSLATED_ROOM / 2, y: bx.y, w: bx.w + TRANSLATED_ROOM, h: bx.h };
      for (const t of near) if (boxHit(room, t, 2)) hard += 100;
      const co = coreOf(bx);
      for (const s of segs) for (let j = 0; j < s.length; j += 2) if (segHit(s[j], s[j + 1], co)) { hard += 10; break; }
      let soft = q.ring * RING_COST;
      for (const t of dots) if (boxHit(bx, t, 2)) soft += 1;
      if (hard < bestHard || (hard === bestHard && soft < bestSoft)) { best = bx; bestHard = hard; bestSoft = soft; }
      if (hard === 0 && soft === 0) break;
    }
    if (!best || (freeOnly && bestHard > 0)) return;
    written.push({ x: best.x - TRANSLATED_ROOM / 2, y: best.y, w: best.w + TRANSLATED_ROOM, h: best.h });
    nameTexts.push({ id: id, at: [best.x + best.w / 2, best.y + best.h / 2], text: text, color: color });
  };

  if (names !== "none") {
    const IN = [], STEP = Math.PI / 4;
    // Inward first, then round the compass from there.
    for (const m of [0, 1, -1, 2, -2, 3, -3, 4]) IN.push(m * STEP);
    for (const b of bodies) {
      const th0 = Math.atan2(CH.cy - b.at[1], CH.cx - b.at[0]);
      place("label_" + b.id, b.at, b.r, bodyName(b.id), litBodies.has(b.id) ? C.accent : C.ink, IN.map((d) => th0 + d), [8, 24, 42], false);
    }
    for (const d of own) {
      const t = eng.starName(d.s, L);
      if (!t) continue;
      const th0 = Math.atan2(CH.cy - d.at[1], CH.cx - d.at[0]);
      place("label_" + eng.starId(d.s), d.at, d.r * 1.25, t, litStars.has(d.s.hip) ? C.accent : C.ink, IN.map((x) => th0 + x), [8, 22, 38], true);
    }
  }

  // ---- and now the ink, back to front -------------------------------------
  // The rim is traced as an OPEN path that returns to its start, NOT
  // closed: true. Drawn the same either way, but `closed` would make
  // elementRings hand the horizon a hit OUTLINE covering the whole sky, and
  // hitElement answers with the smallest outline containing the point and
  // never looks at boxes after that (src/ui/hit.ts, "Pass 1") — the rim would
  // win every click meant for a star. Round 1 shipped exactly that as a frame.
  push(kit.stroke("horizon", horizonPts, { color: C.guide, strokeWidth: 2, ms: MS.guides }));
  for (const c of compass) { push(kit.text(c.id, c.at, c.text, { fontSize: COMPASS_PX, color: C.ink })); anchors[c.id] = c.at; }

  if (field.length > 0) {
    // A group's leaf durations ACCUMULATE (src/render/svg-backend.ts:583-589),
    // so a fixed per-dot sketch time would make the star field take minutes.
    // The field draws in about two seconds however many stars are in it.
    const per = Math.max(4, Math.round(2200 / field.length));
    push(kit.group("stars", field.map((d) => kit.ball("stars__hip_" + d.s.hip, d.at, d.r, { fill: eng.starColor(d.s.bv), strokeWidth: 0.8, ms: per }))));
    anchors.stars = [CH.cx, CH.cy];
  }
  for (const d of own) {
    const id = eng.starId(d.s), on = litStars.has(d.s.hip);
    push(kit.ball(id, d.at, d.r * 1.25, { fill: on ? C.accent : eng.starColor(d.s.bv), color: on ? C.accent : undefined, strokeWidth: on ? 2 : 0.8, ms: MS.dot }));
    anchors[id] = d.at;
  }

  for (const b of bodies) {
    const on = litBodies.has(b.id);
    if (b.id === "moon" && moonRim) {
      // The WHOLE disc is filled first. An `area` is a hit outline and
      // hitElement's box pass SKIPS any id that already has one, so a moon
      // that filled only its crescent would lose every click on its dark half
      // to whatever lies behind it.
      //   The two washes are the other way round from the sky: this is ink on
      // warm paper (kit.GROUND #faf6ec), and nothing can be painted BRIGHTER
      // than the paper. So the dark half is the shaded one and the lit half is
      // COLORS.paper — the bright warm white kept for exactly this, a shape
      // that has to read as unpainted on top of a tinted one. A hand drawing
      // of a phase has always shaded the dark side.
      //   Both are `precise`, and that is what makes the knock-out a knock-out.
      // A plain kit.area is a SHADED REGION: the sketchy backend hachures it at
      // gap 5.5 and the clean one outlines it in ink (src/render/svg-backend.ts,
      // the two `isExactArea` branches). Across a disc 24 units wide that is
      // four hatch strokes, and paper-coloured hatching laid BETWEEN grey
      // hatching hides nothing — the phase would have gone back to invisible in
      // the style this figure is normally drawn in. `precise` renders one flat
      // filled path, stroke none, at the asked opacity, identically in both
      // styles; it is the same knock-out idiom a white chess piece uses
      // (src/scenes/packs/games.yaml). It changes nothing about elementRings,
      // the hit test or the lint — an area is an outline either way.
      push(kit.group("moon", [
        kit.area("moon__disc", moonRim, on ? C.accent : b.b.color, { opacity: 0.62, precise: true, ms: MS.region }),
        kit.area("moon__lit", moonLit, C.paper, { opacity: 0.95, precise: true, ms: MS.region }),
        kit.stroke("moon__rim", moonRim, { color: on ? C.accent : C.guide, strokeWidth: on ? 3 : 1.4, ms: MS.stroke }),
      ]));
      anchors.moon = b.at;
      continue;
    }
    push(kit.ball(b.id, b.at, b.r, { fill: on ? C.accent : b.b.color, color: on ? C.accent : undefined, strokeWidth: on ? 3 : 1.5, ms: MS.dot }));
    anchors[b.id] = b.at;
  }

  for (const t of nameTexts) { push(kit.text(t.id, t.at, t.text, { fontSize: LABEL_PX, color: t.color })); anchors[t.id] = t.at; }

  push(kit.text("place_label", [F.x0, 24], placeLine, { fontSize: NOTE_PX, color: C.guide, anchor: "start" }));
  anchors.place_label = [F.x0, 24];
  if (noteText !== "") {
    push(kit.text("sky_note", [F.x0, 52], noteText, { fontSize: NOTE_PX, color: C.guide, anchor: "start" }));
    anchors.sky_note = [F.x0, 52];
  }
  if (titleText !== "") { push(kit.text("title", [500, 726], titleText, { fontSize: 30 })); anchors.title = [500, 726]; }

  return { drawables, labels, anchors, order };
