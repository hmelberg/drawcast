pack: isometric
title: 2.5D & isometric
description: Isometric layer stacks, block diagrams on a floor, and textbook 3D solids — flat drawings that read as depth, for subjects where depth is the point.
---
template: layer_stack
title: Isometric layer stack
version: 1
kit: 1
status: ready
description: >-
  A stack of flat slabs seen at an isometric angle, one slab per layer, each
  named in a column on the right (with an optional one-line note under the
  name), top layer first. Optionally exploded (gaps between slabs) and with
  one layer highlighted while the rest turn grey. Choose this scene for
  requests about layers built on top of each other: a technology or software
  stack, the OSI / TCP-IP network model, layers of abstraction, the layers of
  the skin or the atmosphere or the Earth's crust drawn as slabs, a
  sandwich / laminate / PCB build-up, or "show X as a stack of layers". Not
  for data (use a bar chart) and not for a nested concentric picture.
params:
  type: object
  properties:
    layers:
      type: array
      description: "The layers, TOP FIRST (the first item is the top slab). 1–8 layers. Each is a string (the name) or { name, note }."
      items:
        anyOf:
          - type: string
          - type: object
            properties:
              name: { type: string, description: "Layer name, kept short (≤ 22 characters)." }
              note: { type: string, description: "Optional one-line note drawn smaller under the name (≤ 30 characters)." }
            required: [name]
    highlight:
      description: "Optional: one layer to emphasise, by its name or by its index (0 = top). The others are drawn grey."
      anyOf:
        - type: string
        - type: number
    exploded:
      type: boolean
      description: "Leave a gap between slabs (default true). false stacks them touching, like a solid laminate."
    title:
      type: string
      description: "Optional title across the top."
element_ids:
  layer_<i>: "slab i (0 = top), a group of its visible faces — draw these bottom-up (layer_<n-1> first) to build the stack"
  layer_<i>_label: "slab i's label: a group of the dashed leader, the name (layer_<i>_name) and the note (layer_<i>_note, present only when given)"
  title: the title, when set
examples:
  - request: "Draw the OSI model as a stack of layers."
    params:
      title: The OSI model
      layers:
        - { name: "7 Application", note: "HTTP, SMTP, DNS" }
        - { name: "6 Presentation", note: "TLS, encoding" }
        - { name: "5 Session", note: "sockets, RPC" }
        - { name: "4 Transport", note: "TCP, UDP" }
        - { name: "3 Network", note: "IP, routing" }
        - { name: "2 Data link", note: "Ethernet, MAC" }
        - { name: "1 Physical", note: "cables, radio" }
  - request: "Show a typical web app stack and highlight the database layer."
    params:
      layers: [Browser UI, API server, Business logic, Database, Operating system]
      highlight: Database
  - request: "Draw the layers of the skin as a solid block of three layers."
    params:
      title: Layers of the skin
      exploded: false
      layers:
        - { name: Epidermis, note: "outer, waterproof" }
        - { name: Dermis, note: "nerves, hair roots" }
        - { name: Hypodermis, note: "fat, insulation" }
  - request: "Show the TCP/IP model and highlight the transport layer."
    params:
      title: The TCP/IP model
      highlight: Transport
      layers:
        - { name: Application, note: "HTTP, DNS, SSH" }
        - { name: Transport, note: "TCP, UDP" }
        - { name: Internet, note: "IPv4, IPv6, ICMP" }
        - { name: Link, note: "Ethernet, Wi-Fi" }
  - request: "Draw the layers of the atmosphere."
    params:
      title: Layers of the atmosphere
      layers:
        - { name: Exosphere, note: "700 km and up" }
        - { name: Thermosphere, note: "80–700 km" }
        - { name: Mesosphere, note: "50–80 km" }
        - { name: Stratosphere, note: "12–50 km, ozone" }
        - { name: Troposphere, note: "0–12 km, weather" }
layout: |
  // 2.5D via kit.project3d: one box3 per slab, one project3d call per slab,
  // called bottom-up so each slab paints over the one below it (the painter's
  // order is ours, not a global face sort — a stack has an obvious one). The
  // camera is near-orthographic (a far camera with fov scaled to match), so
  // parallel edges stay parallel: the isometric look, not a photo.
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const raw = Array.isArray(params.layers) ? params.layers : [];
  const layers = raw
    .map((l) => (typeof l === "string" || typeof l === "number") ? { name: String(l) } : (l && typeof l === "object" ? { name: String(l.name ?? ""), note: l.note != null ? String(l.note) : undefined } : null))
    .filter((l) => l && l.name.trim() !== "")
    .slice(0, 8);
  if (layers.length === 0) layers.push({ name: "Top" }, { name: "Middle" }, { name: "Bottom" });
  const n = layers.length;
  const hl = params.highlight;
  const hIndex = typeof hl === "number" ? Math.round(hl) : typeof hl === "string" ? layers.findIndex((l) => l.name === hl) : -1;
  const exploded = params.exploded !== false;
  const hasTitle = typeof params.title === "string" && params.title.trim() !== "";
  const PALETTE = [C.supply, C.region2, C.region1, C.shifted, C.accent, C.demand];

  // ---- world: x = width, y = up, z = depth; slab i (0 = top) ----
  const W = 3.2, D = 2.0, T = 0.42, G = exploded ? 0.34 : 0;
  const yOf = (i) => (n - 1 - i) * (T + G) + T / 2;
  const AZ = 30, EL = 28, DIST = 2000;
  // project3d's own projection (kit.ts), written out so the layout can
  // measure the figure before it draws it and place labels at real corners.
  const az = AZ * Math.PI / 180, el = EL * Math.PI / 180;
  const projWith = (fov, cx, cy) => (p) => {
    const x1 = p[0] * Math.cos(az) - p[2] * Math.sin(az);
    const z1 = p[0] * Math.sin(az) + p[2] * Math.cos(az);
    const y2 = p[1] * Math.cos(el) - z1 * Math.sin(el);
    const z2 = p[1] * Math.sin(el) + z1 * Math.cos(el);
    const s = fov / Math.max(0.1, DIST - z2);
    return [cx + x1 * s, cy + y2 * s];
  };
  // Fit: measure at unit scale, then scale + centre into the figure box
  // (left part of the canvas; the label column takes the right).
  const corners = [];
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) for (const y of [0, yOf(0) + T / 2]) corners.push([sx * W / 2, y, sz * D / 2]);
  const unit = projWith(DIST, 0, 0);
  const pts0 = corners.map(unit);
  const bx0 = Math.min(...pts0.map((p) => p[0])), bx1 = Math.max(...pts0.map((p) => p[0]));
  const by0 = Math.min(...pts0.map((p) => p[1])), by1 = Math.max(...pts0.map((p) => p[1]));
  const box = { x0: 50, x1: 560, y0: 60, y1: hasTitle ? 650 : 700 };
  const S = Math.min((box.x1 - box.x0) / (bx1 - bx0), (box.y1 - box.y0) / (by1 - by0), 150);
  // Centre slabs + label column together when they fit side by side.
  const labelW = Math.max(...layers.map((l) => Math.max(l.name.length * 26, (l.note ?? "").length * 19) * 0.52));
  const figW = S * (bx1 - bx0);
  const x0 = Math.max(50, (1000 - (figW + 70 + labelW)) / 2);
  const cx = x0 + figW / 2 - S * (bx0 + bx1) / 2;
  const cy = (box.y0 + box.y1) / 2 - S * (by0 + by1) / 2;
  const proj = projWith(S * DIST, cx, cy);
  const cam = { azimuth: AZ, elevation: EL, distance: DIST, fov: S * DIST, cx, cy };

  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };

  // Solid faces: each face's fill becomes one exact opaque path (in the
  // sketchy style too, so what stands behind stays hidden) and a `surface`,
  // so a glow lights the outline instead of repainting the face on top.
  const solidify = (d) => { if (d.kind === "group") d.children.forEach(solidify); else if (d.kind === "area") { d.precise = true; d.surface = true; } return d; };
  for (let i = n - 1; i >= 0; i--) {
    const fill = hIndex >= 0 && hIndex !== i ? C.guide : PALETTE[i % PALETTE.length];
    const out = kit.project3d(cam, [{ kind: "box3", id: "layer_" + i, c: [0, yOf(i), 0], size: [W, T, D], color: C.ink, fill }]);
    push(kit.group("layer_" + i, out.drawables.map(solidify)));
    anchors["layer_" + i] = proj([0, yOf(i) + T / 2, 0]);
  }

  // ---- label column: each label points at its slab's right-most edge ----
  const nameFS0 = 26, noteFS = 19;
  const edge = (i) => proj([W / 2, yOf(i), -D / 2]);
  const colX = Math.max(...layers.map((_, i) => edge(i)[0])) + 70;
  const room = 985 - colX;
  const nameFS = Math.max(16, Math.min(nameFS0, ...layers.map((l) => room / (Math.max(1, l.name.length) * 0.52))));
  const notes = layers.some((l) => l.note);
  const noteDrop = nameFS * 0.625 + noteFS * 0.625 + 4;
  const sep = nameFS * 1.25 + (notes ? noteDrop : 0) + 6;
  // Top-down: keep each label at its slab's height, pushed down only as far
  // as it must go to clear the one above; then lift the column if it ran low.
  const ys = [];
  layers.forEach((_, i) => { const want = edge(i)[1]; ys.push(i === 0 ? want : Math.min(want, ys[i - 1] - sep)); });
  const floorY = (notes ? noteDrop : 0) + nameFS;
  const lift = Math.max(0, floorY - ys[n - 1]);
  for (let i = 0; i < n; i++) ys[i] += lift;
  layers.forEach((l, i) => {
    const a = edge(i);
    const on = hIndex < 0 || hIndex === i;
    const kids = [
      kit.stroke("layer_" + i + "_name_leader", [[a[0] + 6, a[1]], [colX - 12, ys[i]]], { color: C.guide, strokeWidth: 2, dash: true, ms: MS.connector }),
      kit.text("layer_" + i + "_name", [colX, ys[i]], l.name, { fontSize: nameFS, anchor: "start", color: on ? C.ink : C.guide }),
    ];
    if (l.note) kids.push(kit.text("layer_" + i + "_note", [colX, ys[i] - noteDrop], l.note, { fontSize: noteFS, anchor: "start", color: C.guide }));
    push(kit.group("layer_" + i + "_label", kids));
    anchors["layer_" + i + "_label"] = [colX, ys[i]];
  });

  if (hasTitle) push(kit.text("title", [500, 712], params.title, { fontSize: 30 }));
  return { drawables, labels, anchors, order };
---
template: isometric_blocks
title: Isometric blocks on a floor
version: 1
kit: 1
status: ready
description: >-
  Named 3D blocks standing on an isometric floor grid, each block's name
  written on its top face, with optional arrows along the floor between
  blocks. Blocks are placed by grid cell and can be wider, deeper or taller
  than one cell. Choose this scene for system-architecture or
  infrastructure sketches in 3D (servers, services, databases, a data
  centre, a network), a factory floor or warehouse layout, a small city
  block or campus plan, or any "isometric diagram of these parts and how
  they connect". Keep block names short — they are written on the blocks —
  and leave two empty cells between linked blocks so the arrows have
  floor to run on. Rows run
  toward the viewer, so put tall blocks in low rows (the back) where they
  hide nothing. Not for quantitative data (a 3D bar chart distorts values —
  use a flat chart).
params:
  type: object
  properties:
    blocks:
      type: array
      description: "1–12 blocks. Cells must not overlap."
      items:
        type: object
        properties:
          name: { type: string, description: "Short name written on the block's top face (≤ 10 characters reads best)." }
          at: { type: array, items: { type: number }, minItems: 2, maxItems: 2, description: "[column, row] of the block's back-left cell. Columns run back-to-front along the right, rows run back-to-front along the left: [0, 0] is the far corner, and higher numbers come nearer the viewer. Default [0, 0]." }
          size: { type: array, items: { type: number }, minItems: 3, maxItems: 3, description: "[columns wide, rows deep, height], default [1, 1, 1]. Height 0.3–4." }
          color: { type: string, enum: [blue, green, yellow, orange, purple, red, grey], description: "Default: cycles through the palette." }
        required: [name]
    links:
      type: array
      description: "Arrows from one block to another, by name — following the floor line between them, drawn over the blocks, from one block's outline to the other's."
      items:
        type: object
        properties:
          from: { type: string }
          to: { type: string }
          both_ways: { type: boolean, description: "Arrowheads at both ends (default false)." }
        required: [from, to]
    floor:
      type: boolean
      description: "Draw the floor slab under the blocks (default true)."
    title:
      type: string
element_ids:
  floor: the floor the blocks stand on (present unless floor is false)
  block_<i>: "block i (in the order given), a group of its visible faces"
  block_<i>_name: "block i's name, on its top face — or just above the block when the top face is too small or covered, or placed by the label solver (with a leader) when the block is hidden behind a taller one"
  links: "SET — every link arrow; naming it stands for all of them, and each keeps its own link_<k> id"
  link_<k>: "the k-th link arrow that could be drawn (a link between blocks that touch or overlap on screen is skipped)"
  title: the title, when set
examples:
  - request: "Draw an isometric diagram of a web app: load balancer, two app servers, a cache and a database."
    params:
      title: A small web service
      blocks:
        - { name: LB, at: [0, 2], size: [1, 1, 0.6], color: purple }
        - { name: App 1, at: [3, 0], size: [1, 1, 1.1], color: blue }
        - { name: App 2, at: [3, 4], size: [1, 1, 1.1], color: blue }
        - { name: Cache, at: [6, 0], size: [1, 1, 0.7], color: orange }
        - { name: DB, at: [6, 4], size: [1, 1, 1.3], color: green }
      links:
        - { from: LB, to: App 1 }
        - { from: LB, to: App 2 }
        - { from: App 1, to: Cache }
        - { from: App 2, to: DB }
  - request: "Sketch a warehouse floor in isometric: receiving, storage racks, packing and shipping."
    params:
      blocks:
        - { name: Racks, at: [0, 0], size: [2, 1, 2.0], color: grey }
        - { name: Receiving, at: [0, 3], size: [2, 1, 0.5], color: yellow }
        - { name: Packing, at: [4, 0], size: [2, 1, 0.5], color: orange }
        - { name: Shipping, at: [4, 3], size: [2, 1, 0.5], color: red }
      links:
        - { from: Receiving, to: Racks }
        - { from: Racks, to: Packing }
        - { from: Packing, to: Shipping }
  - request: "Draw a small office network in isometric: internet, firewall, switch, two servers and a NAS."
    params:
      title: Office network
      blocks:
        - { name: Internet, at: [0, 0], size: [1, 1, 0.5], color: grey }
        - { name: Firewall, at: [3, 0], size: [1, 1, 0.8], color: red }
        - { name: Switch, at: [3, 3], size: [1, 1, 0.4], color: yellow }
        - { name: Web, at: [6, 1], size: [1, 1, 1.4], color: blue }
        - { name: Mail, at: [6, 4], size: [1, 1, 1.4], color: blue }
        - { name: NAS, at: [1, 6], size: [1, 1, 0.9], color: green }
      links:
        - { from: Internet, to: Firewall, both_ways: true }
        - { from: Firewall, to: Switch }
        - { from: Switch, to: Web }
        - { from: Switch, to: Mail }
        - { from: Switch, to: NAS }
  - request: "Sketch a small campus plan: library, lecture hall, lab building and cafeteria."
    params:
      blocks:
        - { name: Library, at: [0, 0], size: [2, 2, 1.6], color: purple }
        - { name: Lectures, at: [4, 0], size: [2, 1, 1.0], color: blue }
        - { name: Labs, at: [0, 4], size: [2, 1, 1.2], color: green }
        - { name: Cafe, at: [4, 3], size: [1, 1, 0.5], color: orange }
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const COLOR = { blue: C.supply, green: C.region2, yellow: C.region1, orange: C.shifted, purple: C.accent, red: C.demand, grey: C.guide };
  const CYCLE = [C.supply, C.region2, C.shifted, C.accent, C.region1, C.demand];
  const num = (v, d) => (typeof v === "number" && Number.isFinite(v) ? v : d);
  const raw = Array.isArray(params.blocks) ? params.blocks : [];
  const blocks = raw.filter((b) => b && typeof b === "object").slice(0, 12).map((b, i) => {
    const at = Array.isArray(b.at) ? b.at : [];
    const sz = Array.isArray(b.size) ? b.size : [];
    return {
      i, name: String(b.name ?? ""),
      x0: Math.round(num(at[0], 0)), z0: Math.round(num(at[1], 0)),
      w: Math.max(1, Math.round(num(sz[0], 1))), d: Math.max(1, Math.round(num(sz[1], 1))),
      h: Math.min(4, Math.max(0.3, num(sz[2], 1))),
      fill: COLOR[b.color] ?? CYCLE[i % CYCLE.length],
    };
  });
  if (blocks.length === 0) blocks.push({ i: 0, name: "", x0: 0, z0: 0, w: 1, d: 1, h: 1, fill: CYCLE[0] });
  const hasTitle = typeof params.title === "string" && params.title.trim() !== "";
  const showFloor = params.floor !== false;

  // ---- camera: true isometric (azimuth 45°, elevation 35.26°), near-orthographic ----
  const AZ = 45, EL = 35.264, DIST = 3000;
  const az = AZ * Math.PI / 180, el = EL * Math.PI / 180;
  // project3d's projection (kit.ts), written out to measure, fit and place text.
  const projWith = (fov, cx, cy) => (p) => {
    const x1 = p[0] * Math.cos(az) - p[2] * Math.sin(az);
    const z1 = p[0] * Math.sin(az) + p[2] * Math.cos(az);
    const y2 = p[1] * Math.cos(el) - z1 * Math.sin(el);
    const z2 = p[1] * Math.sin(el) + z1 * Math.cos(el);
    const s = fov / Math.max(0.1, DIST - z2);
    return [cx + x1 * s, cy + y2 * s];
  };
  const minX = Math.min(...blocks.map((b) => b.x0)), minZ = Math.min(...blocks.map((b) => b.z0));
  const maxX = Math.max(...blocks.map((b) => b.x0 + b.w)), maxZ = Math.max(...blocks.map((b) => b.z0 + b.d));
  const M = 0.5; // floor margin, in cells
  const fx0 = minX - M, fx1 = maxX + M, fz0 = minZ - M, fz1 = maxZ + M;
  const pts3 = [];
  for (const x of [fx0, fx1]) for (const z of [fz0, fz1]) pts3.push([x, 0, z]);
  for (const b of blocks) for (const x of [b.x0, b.x0 + b.w]) for (const z of [b.z0, b.z0 + b.d]) pts3.push([x, b.h + 0.45, z]);
  const unit = projWith(DIST, 0, 0);
  const p0 = pts3.map(unit);
  const bx0 = Math.min(...p0.map((p) => p[0])), bx1 = Math.max(...p0.map((p) => p[0]));
  const by0 = Math.min(...p0.map((p) => p[1])), by1 = Math.max(...p0.map((p) => p[1]));
  const fit = { x0: 40, x1: 960, y0: 40, y1: hasTitle ? 660 : 710 };
  const S = Math.min((fit.x1 - fit.x0) / (bx1 - bx0), (fit.y1 - fit.y0) / (by1 - by0), 170);
  const cx = (fit.x0 + fit.x1) / 2 - S * (bx0 + bx1) / 2;
  const cy = (fit.y0 + fit.y1) / 2 - S * (by0 + by1) / 2;
  const proj = projWith(S * DIST, cx, cy);
  const cam = { azimuth: AZ, elevation: EL, distance: DIST, fov: S * DIST, cx, cy };

  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };

  if (showFloor) {
    // Fill plus only the two FRONT edges: the back edges would run behind the
    // blocks, and the lint (which cannot see occlusion) would count them as
    // crossing the names written on top.
    push(kit.group("floor", [
      kit.area("floor_fill", [[fx0, 0, fz1], [fx1, 0, fz1], [fx1, 0, fz0], [fx0, 0, fz0]].map(proj), C.guide, { opacity: 0.22 }),
      kit.stroke("floor_edge", [[fx0, 0, fz1], [fx1, 0, fz1], [fx1, 0, fz0]].map(proj), { color: C.guide, strokeWidth: 2.5, ms: MS.guides }),
    ]));
  }

  // ---- blocks, painted back to front ----
  // A is behind B when it lies wholly at smaller x or wholly at smaller z
  // (the viewer looks from +x, +z, +y). Topological order; a cycle (only
  // possible for overlapping cells) falls back to x + z.
  const behind = (A, B) => (A.x0 + A.w <= B.x0 && !(B.z0 + B.d <= A.z0)) || (A.z0 + A.d <= B.z0 && !(B.x0 + B.w <= A.x0));
  const left = blocks.slice(), painted = [];
  while (left.length > 0) {
    let k = left.findIndex((b) => !left.some((o) => o !== b && behind(o, b)));
    if (k < 0) { left.sort((p, q) => (p.x0 + p.z0) - (q.x0 + q.z0)); k = 0; }
    painted.push(left.splice(k, 1)[0]);
  }
  // Each block's screen silhouette: the convex hull of its eight corners.
  const hullOf = (pts) => {
    const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], hi = [];
    for (const q of p) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
    for (const q of p.slice().reverse()) { while (hi.length >= 2 && cross(hi[hi.length - 2], hi[hi.length - 1], q) <= 0) hi.pop(); hi.push(q); }
    return lo.slice(0, -1).concat(hi.slice(0, -1));
  };
  const inPoly = (pt, poly) => {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [xi, yi] = poly[i], [xj, yj] = poly[j];
      if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < ((xj - xi) * (pt[1] - yi)) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  };
  // Solid faces: each face's fill becomes one exact opaque path (in the
  // sketchy style too, so what stands behind stays hidden) and a `surface`,
  // so a glow lights the outline instead of repainting the face on top.
  const solidify = (d) => { if (d.kind === "group") d.children.forEach(solidify); else if (d.kind === "area") { d.precise = true; d.surface = true; } return d; };
  const hulls = {};
  for (const b of painted) {
    const out = kit.project3d(cam, [{ kind: "box3", id: "block_" + b.i, c: [b.x0 + b.w / 2, b.h / 2, b.z0 + b.d / 2], size: [b.w, b.h, b.d], color: C.ink, fill: b.fill }]);
    push(kit.group("block_" + b.i, out.drawables.map(solidify)));
    const cs = [];
    for (const x of [b.x0, b.x0 + b.w]) for (const y of [0, b.h]) for (const z of [b.z0, b.z0 + b.d]) cs.push(proj([x, y, z]));
    hulls[b.i] = hullOf(cs);
    anchors["block_" + b.i] = proj([b.x0 + b.w / 2, b.h, b.z0 + b.d / 2]);
  }

  // ---- links: drawn OVER the blocks, following the floor line between two
  // blocks from where it leaves one silhouette to where it meets the other —
  // so an arrowhead is never hidden behind the block it points at ----
  const byName = {};
  blocks.forEach((b) => { if (b.name && !(b.name in byName)) byName[b.name] = b; });
  const linkKids = [];
  (Array.isArray(params.links) ? params.links : []).forEach((ln) => {
    const a = byName[ln && ln.from], b = byName[ln && ln.to];
    if (!a || !b || a === b) return;
    const A = [a.x0 + a.w / 2, a.z0 + a.d / 2], B = [b.x0 + b.w / 2, b.z0 + b.d / 2];
    const at = (t) => proj([A[0] + (B[0] - A[0]) * t, 0, A[1] + (B[1] - A[1]) * t]);
    const N = 400;
    let t0 = null, t1 = null;
    for (let k = 0; k <= N && t0 === null; k++) if (!inPoly(at(k / N), hulls[a.i])) t0 = k / N;
    for (let k = N; k >= 0 && t1 === null; k--) if (!inPoly(at(k / N), hulls[b.i])) t1 = k / N;
    if (t0 === null || t1 === null || t1 <= t0) return;
    const p0 = at(t0), p1 = at(t1), len = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]);
    const GAP = 9;
    if (len < 2 * GAP + 24) return;
    const ux = (p1[0] - p0[0]) / len, uy = (p1[1] - p0[1]) / len;
    const k = linkKids.length;
    linkKids.push(kit.stroke("link_" + k, [[p0[0] + ux * GAP, p0[1] + uy * GAP], [p1[0] - ux * GAP, p1[1] - uy * GAP]], {
      arrowhead: ln.both_ways ? "both" : "end", color: C.demand, strokeWidth: 3.5, ms: MS.arrow,
    }));
  });
  // Each arrow is its own element; `links` names the set (SceneLayout.groups).
  linkKids.forEach(push);
  const groups = linkKids.length > 0 ? { links: linkKids.map((d) => d.id) } : {};

  // ---- names: on the top face when it fits, else just above the block ----
  // A spot must pass the lint's own test (no stroke crosses the middle of
  // the text's box — hidden strokes included, the lint cannot see
  // occlusion) and must not spill onto another block.
  const segHits = (a, b, r) => {
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const p = [-dx, dx, -dy, dy], q = [a[0] - r.x, r.x + r.w - a[0], a[1] - r.y, r.y + r.h - a[1]];
    let t0 = 0, t1 = 1;
    for (let i = 0; i < 4; i++) {
      if (p[i] === 0) { if (q[i] < 0) return false; continue; }
      const t = q[i] / p[i];
      if (p[i] < 0) { if (t > t1) return false; if (t > t0) t0 = t; } else { if (t < t0) return false; if (t < t1) t1 = t; }
    }
    return true;
  };
  const strokesOf = (d) => d.kind === "group" ? d.children.flatMap(strokesOf) : d.kind === "stroke" ? [d] : [];
  const textBox = (pos, s, fs) => { const w = Math.max(1, s.length) * fs * 0.52, h = fs * 1.25; return { x: pos[0] - w / 2, y: pos[1] - h / 2, w, h }; };
  const samplesOf = (r) => { const out = []; for (const fx of [0.08, 0.5, 0.92]) for (const fy of [0.12, 0.5, 0.88]) out.push([r.x + r.w * fx, r.y + r.h * fy]); return out; };
  const placed = [];
  const clear = (r, owner) => {
    if (r.x < 4 || r.y < 4 || r.x + r.w > 996 || r.y + r.h > (hasTitle ? 680 : 746)) return false;
    if (placed.some((o) => r.x < o.x + o.w + 2 && o.x < r.x + r.w + 2 && r.y < o.y + o.h + 2 && o.y < r.y + r.h + 2)) return false;
    const c = { x: r.x + r.w * 0.2, y: r.y + r.h * 0.25, w: r.w * 0.6, h: r.h * 0.5 };
    for (const d of drawables) {
      if (d.id === "block_" + owner.i) continue;
      for (const s of strokesOf(d)) {
        const ps = s.closed ? [...s.pts, s.pts[0]] : s.pts;
        for (let k = 0; k + 1 < ps.length; k++) if (segHits(ps[k], ps[k + 1], c)) return false;
      }
    }
    return !blocks.some((o) => o !== owner && samplesOf(r).some((p) => inPoly(p, hulls[o.i])));
  };
  for (const b of blocks) {
    if (!b.name) continue;
    const top = [[b.x0, b.h, b.z0], [b.x0 + b.w, b.h, b.z0], [b.x0 + b.w, b.h, b.z0 + b.d], [b.x0, b.h, b.z0 + b.d]].map(proj);
    const centre = proj([b.x0 + b.w / 2, b.h, b.z0 + b.d / 2]);
    let spot = null;
    for (let fs = 26; fs >= 15 && !spot; fs -= 1) {
      const r = textBox(centre, b.name, fs);
      if (samplesOf(r).every((p) => inPoly(p, top)) && clear(r, b)) spot = { pos: centre, fs, r };
    }
    if (!spot) {
      const topY = Math.max(...top.map((p) => p[1]));
      for (const lift of [12, 30]) {
        const fs = 22, pos = [centre[0], topY + lift + fs * 0.625], r = textBox(pos, b.name, fs);
        if (!spot && clear(r, b)) spot = { pos, fs, r };
      }
    }
    if (!spot) {
      // The top face is in plain view but edges of blocks BEHIND it run under
      // it: the picture is right, so write it there anyway — the lint (which
      // cannot see occlusion) may warn. Only a face covered by a nearer block
      // is given up on.
      const nearer = painted.slice(painted.indexOf(b) + 1);
      for (let fs = 24; fs >= 15 && !spot; fs -= 1) {
        const r = textBox(centre, b.name, fs), pts = samplesOf(r);
        if (pts.every((p) => inPoly(p, top)) && !nearer.some((o) => pts.some((p) => inPoly(p, hulls[o.i])))) spot = { pos: centre, fs, r };
      }
    }
    if (!spot) {
      // Nowhere clear near the block (hidden behind a taller one): hand it to
      // drawcast's label solver, which finds room and draws a leader.
      labels.push(kit.label("block_" + b.i + "_name", centre, "above", b.name, { fontSize: 20 }));
      order.push("block_" + b.i + "_name");
      continue;
    }
    placed.push(spot.r);
    push(kit.text("block_" + b.i + "_name", spot.pos, b.name, { fontSize: spot.fs }));
  }

  if (hasTitle) push(kit.text("title", [500, 712], params.title, { fontSize: 30 }));
  return { drawables, labels, anchors, order, groups };
---
template: geometric_solids
title: Textbook 3D solid with dimensions
version: 1
kit: 1
status: ready
description: >-
  One classroom 3D solid — cube, cuboid (rectangular prism), triangular
  prism, square pyramid, cylinder, cone or sphere — drawn the textbook way:
  visible edges solid, hidden edges dashed, faces lightly shaded, and its
  dimensions (length, width, height, radius, side…) written beside the edges
  they measure, with dashed height / radius lines where a textbook draws
  them. Choose this scene for geometry lessons about 3D shapes, volume and
  surface area problems ("a cylinder with radius 3 cm and height 8 cm"),
  naming the parts of a solid, or comparing solids.
params:
  type: object
  properties:
    solid:
      type: string
      enum: [cube, cuboid, triangular_prism, square_pyramid, cylinder, cone, sphere]
      description: "Which solid (default cuboid)."
    dims:
      type: object
      description: >-
        The measurements. Numbers set the drawn proportions AND become the
        labels (with unit appended); only the ones that apply to the solid
        are used, and only those given are labelled. cube: side. cuboid:
        length, width, height. triangular_prism: base, height (of the
        triangle), length. square_pyramid: side, height. cylinder: radius,
        height. cone: radius, height, slant. sphere: radius.
      properties:
        side: { type: number }
        length: { type: number }
        width: { type: number }
        height: { type: number }
        base: { type: number }
        radius: { type: number }
        slant: { type: number, description: "cone only: labelled on the slanted side; does not change the shape." }
    unit:
      type: string
      description: "Appended to every number label, e.g. \"cm\"."
    labels:
      type: object
      description: "Text overrides for dimension labels, e.g. { height: \"h\", radius: \"r\" } — shown instead of the number. A dimension with a label but no number is labelled at its default proportion."
      additionalProperties: { type: string }
    show_hidden:
      type: boolean
      description: "Draw hidden edges dashed (default true)."
    title:
      type: string
element_ids:
  faces: the light shading on the visible faces (a group)
  edges: "the visible outline — every solid edge and silhouette line (a group)"
  hidden_edges: the dashed hidden edges (a group; present when show_hidden is not false and the solid has any)
  height_line / radius_line: the dashed helper lines a textbook draws for the height and radius (present when that dimension is labelled and it is not an edge)
  right_angle: the small square marking where the height meets the base (with height_line)
  dim_<name>: "each dimension label: dim_side, dim_length, dim_width, dim_height, dim_base, dim_radius, dim_slant"
  title: the title, when set
examples:
  - request: "Draw a cylinder with radius 3 cm and height 8 cm."
    params: { solid: cylinder, dims: { radius: 3, height: 8 }, unit: cm }
  - request: "Show a cuboid 6 by 3 by 4 cm with its hidden edges dashed."
    params: { solid: cuboid, dims: { length: 6, width: 3, height: 4 }, unit: cm }
  - request: "Draw a cone and label its radius r, height h and slant height l."
    params: { solid: cone, labels: { radius: r, height: h, slant: l }, title: "Cone: V = ⅓πr²h" }
  - request: "Draw a square-based pyramid with side 6 m and height 5 m."
    params: { solid: square_pyramid, dims: { side: 6, height: 5 }, unit: m }
  - request: "Show a triangular prism: triangle base 4, triangle height 3, length 7."
    params: { solid: triangular_prism, dims: { base: 4, height: 3, length: 7 } }
  - request: "Draw a cube with side length 5 cm."
    params: { solid: cube, dims: { side: 5 }, unit: cm }
  - request: "Show a sphere of radius r."
    params: { solid: sphere, labels: { radius: r }, title: "Sphere: V = 4⁄3πr³" }
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const SOLIDS = ["cube", "cuboid", "triangular_prism", "square_pyramid", "cylinder", "cone", "sphere"];
  const solid = SOLIDS.includes(params.solid) ? params.solid : "cuboid";
  const dims = params.dims && typeof params.dims === "object" ? params.dims : {};
  const lbls = params.labels && typeof params.labels === "object" ? params.labels : {};
  const unit = typeof params.unit === "string" && params.unit.trim() !== "" ? " " + params.unit.trim() : "";
  const showHidden = params.show_hidden !== false;
  const hasTitle = typeof params.title === "string" && params.title.trim() !== "";
  const pos = (v) => typeof v === "number" && Number.isFinite(v) && v > 0;
  const fmt = (v) => String(Math.round(v * 1000) / 1000);
  // A dimension is labelled when it has a text override or a number.
  const labelOf = (k) => typeof lbls[k] === "string" && lbls[k].trim() !== "" ? lbls[k] : pos(dims[k]) ? fmt(dims[k]) + unit : null;
  // Proportions: the given numbers, defaults otherwise, each kept within 4×
  // of the solid's largest so no dimension collapses to a sliver.
  const DEF = {
    cube: { side: 2 }, cuboid: { length: 3, width: 1.8, height: 1.6 }, triangular_prism: { base: 2, height: 1.7, length: 3 },
    square_pyramid: { side: 2.2, height: 2.2 }, cylinder: { radius: 1, height: 2.4 }, cone: { radius: 1.1, height: 2.4 }, sphere: { radius: 1 },
  }[solid];
  const P = {};
  for (const k of Object.keys(DEF)) P[k] = pos(dims[k]) ? dims[k] : DEF[k];
  const big = Math.max(...Object.keys(P).map((k) => k === "radius" ? 2 * P[k] : P[k]));
  for (const k of Object.keys(P)) P[k] = Math.max(P[k], (k === "radius" ? 0.5 : 1) * big / 4);

  // ---- orthographic textbook view: see the front, the right side and the top ----
  const az = 28 * Math.PI / 180, el = 20 * Math.PI / 180;
  const ca = Math.cos(az), sa = Math.sin(az), ce = Math.cos(el), se = Math.sin(el);
  const rot = (p) => [p[0] * ca - p[2] * sa, p[1] * ce - (p[0] * sa + p[2] * ca) * se];
  const facing = (nrm) => nrm[1] * se + (nrm[0] * sa + nrm[2] * ca) * ce; // > 0: toward the viewer
  const depthOf = (p) => p[0] * sa + p[2] * ca; // > 0: front half

  // ---- world geometry (y up), centred on the origin ----
  let V = [], F = [], round = null;
  const H2 = (P.height ?? 0) / 2;
  if (solid === "cube" || solid === "cuboid") {
    const hx = (solid === "cube" ? P.side : P.length) / 2, hy = (solid === "cube" ? P.side : P.height) / 2, hz = (solid === "cube" ? P.side : P.width) / 2;
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) V.push([sx * hx, sy * hy, sz * hz]);
    const ix = (sx, sy, sz) => ((sx > 0 ? 4 : 0) + (sy > 0 ? 2 : 0) + (sz > 0 ? 1 : 0));
    F = [
      [ix(1, -1, -1), ix(1, 1, -1), ix(1, 1, 1), ix(1, -1, 1)], [ix(-1, -1, -1), ix(-1, -1, 1), ix(-1, 1, 1), ix(-1, 1, -1)],
      [ix(-1, 1, -1), ix(-1, 1, 1), ix(1, 1, 1), ix(1, 1, -1)], [ix(-1, -1, -1), ix(1, -1, -1), ix(1, -1, 1), ix(-1, -1, 1)],
      [ix(-1, -1, 1), ix(1, -1, 1), ix(1, 1, 1), ix(-1, 1, 1)], [ix(-1, -1, -1), ix(-1, 1, -1), ix(1, 1, -1), ix(1, -1, -1)],
    ];
  } else if (solid === "triangular_prism") {
    const hb = P.base / 2, hz = P.length / 2, h = P.height;
    V = [[-hb, -h / 2, hz], [hb, -h / 2, hz], [0, h / 2, hz], [-hb, -h / 2, -hz], [hb, -h / 2, -hz], [0, h / 2, -hz]];
    F = [[0, 1, 2], [3, 5, 4], [0, 3, 4, 1], [1, 4, 5, 2], [0, 2, 5, 3]];
  } else if (solid === "square_pyramid") {
    const hs = P.side / 2;
    V = [[-hs, -H2, -hs], [hs, -H2, -hs], [hs, -H2, hs], [-hs, -H2, hs], [0, H2, 0]];
    F = [[0, 1, 2, 3], [3, 2, 4], [2, 1, 4], [1, 0, 4], [0, 3, 4]];
  } else {
    round = solid;
  }

  // Screen fit: every point that can carry ink.
  const ring = (y, r, n = 96) => Array.from({ length: n }, (_, i) => { const t = (i / n) * 2 * Math.PI; return [r * Math.cos(t), y, r * Math.sin(t)]; });
  const R = P.radius ?? 0;
  const inkPts = round === "sphere" ? [[-R, -R, 0], [R, R, 0]].map((p) => [p[0], p[1]]) :
    round ? [...ring(-H2, R), ...(round === "cylinder" ? ring(H2, R) : [[0, H2, 0]])].map(rot) : V.map(rot);
  const ix0 = Math.min(...inkPts.map((p) => p[0])), ix1 = Math.max(...inkPts.map((p) => p[0]));
  const iy0 = Math.min(...inkPts.map((p) => p[1])), iy1 = Math.max(...inkPts.map((p) => p[1]));
  const fitBox = { x0: 230, x1: 770, y0: 120, y1: hasTitle ? 600 : 640 };
  const S = Math.min((fitBox.x1 - fitBox.x0) / (ix1 - ix0), (fitBox.y1 - fitBox.y0) / (iy1 - iy0));
  const ox = (fitBox.x0 + fitBox.x1) / 2 - S * (ix0 + ix1) / 2, oy = (fitBox.y0 + fitBox.y1) / 2 - S * (iy0 + iy1) / 2;
  const scr = (p) => { const q = rot(p); return [ox + S * q[0], oy + S * q[1]]; };
  const centre2 = [ox + S * (ix0 + ix1) / 2, oy + S * (iy0 + iy1) / 2];

  const faceKids = [], edgeKids = [], hiddenKids = [], helpers = [];
  const TINT = C.supply;
  const shade = (nrm) => 0.16 + 0.26 * (1 - Math.max(0, nrm[1])); // top lightest, sides deeper
  const edgeStroke = (id, pts) => kit.stroke(id, pts, { color: C.ink, strokeWidth: 3.5, ms: MS.stroke });
  const hiddenStroke = (id, pts) => kit.stroke(id, pts, { color: C.guide, strokeWidth: 2, dash: true, ms: MS.guides });

  if (!round) {
    const cen = V.reduce((s, p) => [s[0] + p[0] / V.length, s[1] + p[1] / V.length, s[2] + p[2] / V.length], [0, 0, 0]);
    const normals = F.map((f) => {
      const [a, b, c] = f.map((k) => V[k]);
      const e1 = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], e2 = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
      let n = [e1[1] * e2[2] - e1[2] * e2[1], e1[2] * e2[0] - e1[0] * e2[2], e1[0] * e2[1] - e1[1] * e2[0]];
      const m = f.reduce((s, k) => [s[0] + V[k][0] / f.length, s[1] + V[k][1] / f.length, s[2] + V[k][2] / f.length], [0, 0, 0]);
      if (n[0] * (m[0] - cen[0]) + n[1] * (m[1] - cen[1]) + n[2] * (m[2] - cen[2]) < 0) n = n.map((v) => -v);
      const len = Math.hypot(...n) || 1;
      return n.map((v) => v / len);
    });
    const vis = normals.map((n) => facing(n) > 1e-9);
    F.forEach((f, k) => { if (vis[k]) faceKids.push(kit.area("face_" + k, f.map((j) => scr(V[j])), TINT, { opacity: shade(normals[k]) })); });
    const edges = new Map();
    F.forEach((f, k) => f.forEach((a, j) => {
      const b = f[(j + 1) % f.length], key = Math.min(a, b) + "_" + Math.max(a, b);
      if (!edges.has(key)) edges.set(key, { a: Math.min(a, b), b: Math.max(a, b), faces: [] });
      edges.get(key).faces.push(k);
    }));
    for (const e of edges.values()) {
      const pts = [scr(V[e.a]), scr(V[e.b])];
      if (e.faces.some((k) => vis[k])) edgeKids.push(edgeStroke("edge_" + e.a + "_" + e.b, pts));
      else if (showHidden) hiddenKids.push(hiddenStroke("hidden_" + e.a + "_" + e.b, pts));
    }
  } else if (round === "sphere") {
    const c = scr([0, 0, 0]), r = S * R;
    faceKids.push(kit.area("face_0", kit.ellipse(c, r, r, 72), TINT, { opacity: 0.24 }));
    edgeKids.push(kit.stroke("outline", kit.ellipse(c, r, r, 72), { closed: true, color: C.ink, strokeWidth: 3.5, ms: MS.curve }));
  }

  // Round solids: a circle of the solid split into its front (solid) and back (dashed) arcs.
  // `frontOf(i)` decides which samples count as front; arcs are cut where it flips.
  const arcs = (pts3, frontOf) => {
    const n = pts3.length, flag = pts3.map((_, i) => frontOf(i));
    const start = flag.findIndex((f, i) => f !== flag[(i + n - 1) % n]);
    if (start < 0) return [{ front: flag[0], pts: [...pts3, pts3[0]].map(scr) }];
    const out = [];
    for (let k = 0; k < n; k++) {
      const i = (start + k) % n;
      const last = out[out.length - 1];
      if (last && last.front === flag[i]) last.pts.push(scr(pts3[i]));
      else { if (last) last.pts.push(scr(pts3[i])); out.push({ front: flag[i], pts: [scr(pts3[i])] }); }
    }
    out[out.length - 1].pts.push(scr(pts3[start]));
    return out;
  };
  const drawRing = (id, runs) => runs.forEach((a, k) => {
    if (a.front) edgeKids.push(kit.stroke(id + "_front_" + k, a.pts, { color: C.ink, strokeWidth: 3.5, ms: MS.curve }));
    else if (showHidden) hiddenKids.push(hiddenStroke(id + "_back_" + k, a.pts));
  });
  const rightPt = (y, r) => [r * ca, y, -r * sa]; // screen-rightmost point of a horizontal circle

  if (round === "cylinder") {
    const bot = ring(-H2, R), top = ring(H2, R);
    const sL = [-R * ca, 0, R * sa], sR = [R * ca, 0, -R * sa]; // silhouette directions (screen left/right)
    const sideRegion = [scr([sL[0], -H2, sL[2]]), ...bot.filter((p) => depthOf(p) >= 0).sort((p, q) => rot(p)[0] - rot(q)[0]).map(scr), scr([sR[0], -H2, sR[2]]),
      scr([sR[0], H2, sR[2]]), ...top.filter((p) => depthOf(p) >= 0).sort((p, q) => rot(q)[0] - rot(p)[0]).map(scr), scr([sL[0], H2, sL[2]])];
    faceKids.push(kit.area("face_side", sideRegion, TINT, { opacity: 0.32 }));
    faceKids.push(kit.area("face_top", top.map(scr), TINT, { opacity: 0.16 }));
    edgeKids.push(kit.stroke("top_rim", [...top, top[0]].map(scr), { color: C.ink, strokeWidth: 3.5, ms: MS.curve }));
    drawRing("base_rim", arcs(bot, (i) => depthOf(bot[i]) >= 0));
    edgeKids.push(edgeStroke("side_left", [scr([sL[0], -H2, sL[2]]), scr([sL[0], H2, sL[2]])]));
    edgeKids.push(edgeStroke("side_right", [scr([sR[0], -H2, sR[2]]), scr([sR[0], H2, sR[2]])]));
  } else if (round === "cone") {
    const bot = ring(-H2, R), apex = scr([0, H2, 0]);
    // Tangent points: the base samples at the extreme bearings seen from the apex.
    const bearing = (p) => { const q = scr(p); return Math.atan2(q[0] - apex[0], apex[1] - q[1]); };
    let lo = 0, hi = 0;
    bot.forEach((p, i) => { if (bearing(p) < bearing(bot[lo])) lo = i; if (bearing(p) > bearing(bot[hi])) hi = i; });
    // The base arc between the tangent points that holds the nearest sample is in front.
    const near = bot.reduce((b, p, i) => depthOf(p) > depthOf(bot[b]) ? i : b, 0);
    const between = (i, a, b) => { const n = bot.length, span = (b - a + n) % n; return (i - a + n) % n <= span; };
    const frontArcIsLoHi = between(near, lo, hi);
    const inFront = (i) => frontArcIsLoHi ? between(i, lo, hi) : between(i, hi, lo);
    const frontIdx = [];
    for (let k = 0, i = frontArcIsLoHi ? lo : hi; k <= bot.length; k++, i = (i + 1) % bot.length) { frontIdx.push(i); if (i === (frontArcIsLoHi ? hi : lo)) break; }
    faceKids.push(kit.area("face_side", [apex, ...frontIdx.map((i) => scr(bot[i]))], TINT, { opacity: 0.3 }));
    drawRing("base_rim", arcs(bot, inFront));
    edgeKids.push(edgeStroke("side_left", [apex, scr(bot[lo])]));
    edgeKids.push(edgeStroke("side_right", [apex, scr(bot[hi])]));
  } else if (round === "sphere") {
    const eq = ring(0, R);
    drawRing("equator", arcs(eq, (i) => depthOf(eq[i]) >= 0));
  }

  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  if (faceKids.length) push(kit.group("faces", faceKids));
  if (edgeKids.length) push(kit.group("edges", edgeKids));
  if (hiddenKids.length) push(kit.group("hidden_edges", hiddenKids));

  // ---- helper lines (height / radius) where a textbook draws them ----
  const wantH = labelOf("height") !== null && (round === "cone" || solid === "square_pyramid" || solid === "triangular_prism");
  const wantR = labelOf("radius") !== null && round !== null;
  if (wantH) {
    const hz = solid === "triangular_prism" ? P.length / 2 : 0;
    const topP = solid === "triangular_prism" ? [0, P.height / 2, hz] : [0, H2, 0];
    const footP = solid === "triangular_prism" ? [0, -P.height / 2, hz] : [0, -H2, 0];
    push(kit.stroke("height_line", [scr(topP), scr(footP)], { color: C.demand, strokeWidth: 2.5, dash: true, ms: MS.guides }));
    const u = 0.09 * Math.min(P.height, 2 * (P.radius ?? (P.side ?? P.base) / 2));
    const sq = solid === "triangular_prism"
      ? [[u, -P.height / 2, hz], [u, -P.height / 2 + u, hz], [0, -P.height / 2 + u, hz]]
      : [[u * ca, -H2, -u * sa], [u * ca, -H2 + u, -u * sa], [0, -H2 + u, 0]];
    push(kit.stroke("right_angle", sq.map(scr), { color: C.demand, strokeWidth: 2, ms: MS.dot }));
  }
  if (wantR) {
    const y = round === "cylinder" ? H2 : round === "cone" ? -H2 : 0;
    push(kit.stroke("radius_line", [scr([0, y, 0]), scr(rightPt(y, R))], { color: C.demand, strokeWidth: 2.5, dash: true, ms: MS.guides }));
  }

  // ---- dimension labels: first candidate spot no stroke crosses (the lint's own test) ----
  const segHits = (a, b, r) => {
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const p = [-dx, dx, -dy, dy], q = [a[0] - r.x, r.x + r.w - a[0], a[1] - r.y, r.y + r.h - a[1]];
    let t0 = 0, t1 = 1;
    for (let i = 0; i < 4; i++) {
      if (p[i] === 0) { if (q[i] < 0) return false; continue; }
      const t = q[i] / p[i];
      if (p[i] < 0) { if (t > t1) return false; if (t > t0) t0 = t; } else { if (t < t0) return false; if (t < t1) t1 = t; }
    }
    return true;
  };
  const strokesOf = (d) => d.kind === "group" ? d.children.flatMap(strokesOf) : d.kind === "stroke" ? [d] : [];
  const FS = 26;
  const boxAt = (c, s) => { const w = Math.max(1, s.length) * FS * 0.52, h = FS * 1.25; return { x: c[0] - w / 2, y: c[1] - h / 2, w, h }; };
  const placed = [];
  const clear = (r) => {
    if (r.x < 6 || r.y < 6 || r.x + r.w > 994 || r.y + r.h > (hasTitle ? 680 : 744)) return false;
    if (placed.some((o) => r.x < o.x + o.w + 4 && o.x < r.x + r.w + 4 && r.y < o.y + o.h + 4 && o.y < r.y + r.h + 4)) return false;
    const c = { x: r.x + r.w * 0.2, y: r.y + r.h * 0.25, w: r.w * 0.6, h: r.h * 0.5 };
    for (const d of drawables) for (const s of strokesOf(d)) {
      const ps = s.closed ? [...s.pts, s.pts[0]] : s.pts;
      for (let k = 0; k + 1 < ps.length; k++) if (segHits(ps[k], ps[k + 1], c)) return false;
    }
    return true;
  };
  // Beside a segment a→b: its midpoint pushed out along the normal that points
  // away from `away` (the solid's centre, or an explicit side), far enough that
  // the text box clears the line; tried at growing distances, then the far side.
  const dimLabel = (key, a, b, away) => {
    const s = labelOf(key);
    if (s === null) return;
    const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    let nx = -(b[1] - a[1]), ny = b[0] - a[0];
    const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
    if ((m[0] - away[0]) * nx + (m[1] - away[1]) * ny < 0) { nx = -nx; ny = -ny; }
    const r0 = boxAt([0, 0], s);
    const reach = Math.abs(nx) * r0.w / 2 + Math.abs(ny) * r0.h / 2;
    const cands = [];
    for (const sign of [1, -1]) for (const g of [10, 22, 38, 60]) cands.push([m[0] + sign * nx * (reach + g), m[1] + sign * ny * (reach + g)]);
    let spot = cands.find((c) => clear(boxAt(c, s)));
    if (!spot) spot = cands[0];
    placed.push(boxAt(spot, s));
    push(kit.text("dim_" + key, spot, s, { fontSize: FS, color: C.demand }));
    anchors["dim_" + key] = spot;
  };

  if (solid === "cube" || solid === "cuboid") {
    const hx = (solid === "cube" ? P.side : P.length) / 2, hy = (solid === "cube" ? P.side : P.height) / 2, hz = (solid === "cube" ? P.side : P.width) / 2;
    const fb = [scr([-hx, -hy, hz]), scr([hx, -hy, hz])];             // front-bottom edge (x)
    const rb = [scr([hx, -hy, hz]), scr([hx, -hy, -hz])];             // right-bottom edge (z)
    const rv = [scr([hx, -hy, -hz]), scr([hx, hy, -hz])];             // right-most vertical edge (y)
    if (solid === "cube") dimLabel("side", fb[0], fb[1], centre2);
    else { dimLabel("length", fb[0], fb[1], centre2); dimLabel("width", rb[0], rb[1], centre2); dimLabel("height", rv[0], rv[1], centre2); }
  } else if (solid === "triangular_prism") {
    const hb = P.base / 2, hz = P.length / 2, h = P.height;
    dimLabel("base", scr([-hb, -h / 2, hz]), scr([hb, -h / 2, hz]), centre2);
    dimLabel("length", scr([hb, -h / 2, hz]), scr([hb, -h / 2, -hz]), centre2);
    const t = scr([0, h / 2, hz]), f = scr([0, -h / 2, hz]);
    dimLabel("height", t, f, [t[0] - 1, t[1]]);
  } else if (solid === "square_pyramid") {
    const hs = P.side / 2;
    dimLabel("side", scr([-hs, -H2, hs]), scr([hs, -H2, hs]), centre2);
    const t = scr([0, H2, 0]), f = scr([0, -H2, 0]);
    dimLabel("height", t, f, [t[0] - 1, t[1]]);
  } else if (round === "cylinder") {
    const c = scr([0, H2, 0]), rp = scr(rightPt(H2, R));
    dimLabel("radius", c, rp, [c[0], c[1] - 1]);
    const b = scr(rightPt(-H2, R));
    dimLabel("height", b, rp, centre2);
  } else if (round === "cone") {
    const c = scr([0, -H2, 0]), rp = scr(rightPt(-H2, R)), apex = scr([0, H2, 0]);
    dimLabel("radius", c, rp, [c[0], c[1] + 1]);
    dimLabel("height", apex, c, [apex[0] - 1, apex[1]]);
    const right = edgeKids.find((d) => d.id === "side_right");
    if (right) dimLabel("slant", right.pts[0], right.pts[1], centre2);
  } else if (round === "sphere") {
    const c = scr([0, 0, 0]), rp = scr(rightPt(0, R));
    dimLabel("radius", c, rp, [c[0], c[1] - 1]);
  }

  anchors.solid = centre2;
  if (hasTitle) push(kit.text("title", [500, 712], params.title, { fontSize: 30 }));
  return { drawables, labels, anchors, order };
