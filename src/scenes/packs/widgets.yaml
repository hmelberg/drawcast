pack: widgets
title: Widgets
description: Figures the viewer can work while paused — a Morse key, the Tower of Hanoi, logic gates, a xylophone, bubble sort, tic-tac-toe — each a template document with a widget body; the models for writing your own.
---
template: morse_key
title: Morse code key
version: 1
kit: 10
status: ready
description: >-
  A telegraph key with a dot pad, a dash pad, a gap pad that ends a letter,
  and a send pad that delivers the finished message — the sent signal as a
  strip of dots and dashes, the decoded letters, and a small code chart with
  one word highlighted. The viewer can tap the pads while paused (each
  sounds), or use the keyboard: hold space for a dot or a dash, Enter to end
  a letter, Enter again to send; an ask bound to this template can require a
  word, delivered by pressing send or the keyboard. Choose this for ANY
  request about Morse code, telegraphy, SOS, or dots and dashes.
params:
  type: object
  properties:
    word:
      type: string
      description: "Word the chart highlights and the lesson is about, e.g. SOS (default SOS)."
    chart:
      type: boolean
      description: "Show the code chart (default true)."
    signal:
      type: string
      description: "Sent signal so far — the widget sets this; leave empty."
    decoded:
      type: string
      description: "Decoded letters so far — the widget sets this; leave empty."
element_ids:
  key_dot: the dot pad (tap to send a dot)
  key_dash: the dash pad (tap to send a dash)
  key_gap: the gap pad (tap to end a letter)
  key_send: the send pad (tap to deliver the finished message)
  signal: the strip of sent dots and dashes
  decoded: the decoded letters
  chart: the code chart (a group; chart_<letter> per row)
  hint: the keyboard hint line (space = dot/dash, enter = gap/send), drawn with the pads
  title: the title
examples:
  - request: "Teach Morse code and let me send SOS."
    params: { word: "SOS" }
  - request: "Show the Morse alphabet."
    params: { word: "HELLO", chart: true }
layout: |
  const C = kit.COLORS;
  const word = (typeof params.word === "string" && params.word.trim() !== "" ? params.word : "SOS").toUpperCase();
  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  push(kit.text("title", [500, 700], "Morse code", { fontSize: 30 }));
  push(kit.pad("key_dot", [300, 150], "·", { r: 42 }));
  push(kit.pad("key_dash", [430, 150], "−", { r: 42 }));
  push(kit.pad("key_gap", [580, 150], "gap", { w: 100, h: 64 }));
  push(kit.pad("key_send", [730, 150], "send", { w: 100, h: 64 }));
  push(kit.text("hint", [500, 215], "space: short = dot, long = dash · enter: end letter · enter again: send", { fontSize: 15, color: C.guide }));
  push(kit.text("signal", [500, 260], params.signal ?? "", { fontSize: 44, color: C.demand }));
  push(kit.text("decoded", [500, 330], params.decoded ?? "", { fontSize: 34 }));
  if (params.chart !== false) {
    const letters = Object.keys(kit.MORSE).filter((k) => /[A-Z]/.test(k));
    const cols = 4, rows = Math.ceil(letters.length / cols);
    const x0 = 120, y0 = 640, dx = 210, dy = 34;
    const children = letters.map((L, i) => {
      const x = x0 + (i % cols) * dx, y = y0 - Math.floor(i / cols) * dy;
      const hot = word.includes(L);
      return kit.text("chart_" + L.toLowerCase(), [x, y], L + "  " + kit.MORSE[L], { fontSize: 18, color: hot ? C.demand : C.guide });
    });
    push(kit.group("chart", children));
    anchors.chart = [500, y0 - (rows * dy) / 2];
  }
  anchors.key_dot = [300, 150]; anchors.key_dash = [430, 150]; anchors.key_gap = [580, 150]; anchors.key_send = [730, 150];
  return { drawables, labels, anchors, order };
widget: |
  const CODE = kit.MORSE;
  const decode = (s) => Object.keys(CODE).find((k) => CODE[k] === s) ?? "?";
  const same = (state) => ({ state, effects: [] });
  const beep = (sym) => ({ sound: { hz: 700, ms: sym === "." ? 80 : 240 } });
  // Held under DOT_MS is a dot, at or above it a dash — one key does both
  // (spec §2.2 addendum 2026-09-15).
  const DOT_MS = 200;
  const init = () => ({ signal: "", letter: "", text: "" });
  const on = (ev, st) => {
    // press/gap/send close over `st` so the pads and the key branch below
    // can share exactly one copy of each rule.
    const press = (sym) => {
      const next = { ...st, signal: st.signal + sym, letter: st.letter + sym };
      return { state: next, effects: [beep(sym), { patch: { signal: next.signal } }] };
    };
    const gap = () => {
      if (st.letter === "") return same(st);
      const next = { ...st, letter: "", text: st.text + decode(st.letter), signal: st.signal + " " };
      return { state: next, effects: [{ patch: { signal: next.signal, decoded: next.text } }] };
    };
    const send = () => {
      if (st.letter === "" && st.text === "") return same(st);
      const open = st.letter !== "";
      const text = open ? st.text + decode(st.letter) : st.text;
      const next = { ...st, letter: "", text };
      const effects = open ? [{ patch: { decoded: text } }, { answer: text }] : [{ answer: text }];
      return { state: next, effects };
    };
    if (ev.type === "key") {
      if (ev.key === " ") return press(ev.ms < DOT_MS ? "." : "-");
      if (ev.key === "Enter") return st.letter === "" ? send() : gap();
      return same(st);
    }
    if (ev.type !== "click") return same(st);
    if (ev.id === "key_dot" || ev.id === "key_dash") return press(ev.id === "key_dot" ? "." : "-");
    if (ev.id === "key_gap") return gap();
    if (ev.id === "key_send") return send();
    return same(st);
  };
  const demo = (scene, answer) => {
    const out = [];
    let signal = "", decoded = "";
    for (const ch of String(answer).toUpperCase()) {
      for (const sym of (CODE[ch] ?? "")) {
        signal = signal + sym;
        out.push({ pointer: sym === "." ? "key_dot" : "key_dash", ...beep(sym) }, { patch: { signal } });
      }
      signal = signal + " ";
      decoded = decoded + ch;
      out.push({ pointer: "key_gap" }, { patch: { signal, decoded } });
    }
    return out.concat([{ pointer: "key_send" }]);
  };
  const judge = (given, answer) => given.trim().toUpperCase() === answer.trim().toUpperCase();
  return { init, on, demo, judge, keys: [" ", "Enter"] };
---
template: tower_of_hanoi
title: Tower of Hanoi
version: 1
kit: 10
status: ready
description: >-
  The Tower of Hanoi puzzle: three pegs and a stack of disks that must move
  one at a time, never a larger disk onto a smaller one. The viewer can play
  it while paused — DRAG the top disk onto another peg, or click it and then
  click the peg; an ask bound to this template can require the puzzle to be
  solved. Choose this for ANY request about the Tower of Hanoi, recursion
  puzzles or the 2^n − 1 moves.
params:
  type: object
  properties:
    disks:
      type: integer
      description: "Number of disks, 3–5 (default 3)."
    pegs:
      type: string
      description: "Peg contents bottom→top, pegs separated by | (e.g. \"321||\") — the widget sets this; leave empty for the start."
    moves:
      type: integer
      description: "Moves made so far — the widget sets this; leave empty."
element_ids:
  peg_0: the left peg — base, pole and the area around them (a group)
  peg_1: the middle peg (a group)
  peg_2: the right peg (a group)
  disk_1: the smallest disk — drag it onto a peg, or click it then click a peg (one disk_<d> per disk, disk_1 smallest; draw every disk in the same beat as the pegs, or they are not there to be worked)
  counter: the move counter
  title: the title
examples:
  - request: "The Tower of Hanoi puzzle with three disks."
    params: { disks: 3 }
  - request: "Show a four-disk Tower of Hanoi."
    params: { disks: 4 }
layout: |
  const C = kit.COLORS;
  const n = Math.min(5, Math.max(3, Number.isInteger(params.disks) ? params.disks : 3));
  const start = Array.from({ length: n }, (_, i) => String(n - i)).join("") + "||";
  const pegs = (typeof params.pegs === "string" && params.pegs.split("|").length === 3 ? params.pegs : start).split("|");
  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  push(kit.text("title", [500, 700], "Tower of Hanoi", { fontSize: 30 }));
  const X = [220, 500, 780], BASE = 180, H = 24, MAXW = 200;
  // The pegs first — zone, base and pole, nothing else — so that every disk
  // draws OVER the peg it stands on.
  pegs.forEach((stack, p) => {
    push(kit.group("peg_" + p, [
      kit.stroke("peg_" + p + "__zone", kit.rect(X[p] - 120, BASE, 240, 210), { closed: true, fill: kit.GROUND, opacity: 0.001, strokeWidth: 1, instant: true }),
      kit.stroke("peg_" + p + "__base", [[X[p] - 120, BASE], [X[p] + 120, BASE]], { strokeWidth: 4 }),
      kit.stroke("peg_" + p + "__pole", [[X[p], BASE], [X[p], BASE + 200]], { strokeWidth: 4 }),
    ]));
    anchors["peg_" + p] = [X[p], BASE + 100];
  });
  // Then the disks, bottom to top — TOP-LEVEL parts, not children of a peg,
  // because a viewer drags a disk and the body must be handed the disk it
  // grabbed. Each disk is its own ROW (H − 4 tall on a pitch of H), so no
  // disk's outline contains another disk's centre and the smallest
  // containing ring is always the disk actually under the pointer.
  pegs.forEach((stack, p) => {
    [...stack].forEach((d, i) => {
      const w = MAXW * (Number(d) / n), y = BASE + i * H;
      push(kit.stroke("disk_" + d, kit.rect(X[p] - w / 2, y, w, H - 4), { closed: true, fill: C.series[(Number(d) - 1) % C.series.length], strokeWidth: 2 }));
      anchors["disk_" + d] = [X[p], y + (H - 4) / 2];
    });
  });
  push(kit.text("counter", [500, 120], "moves: " + (Number.isInteger(params.moves) ? params.moves : 0), { fontSize: 22, color: C.guide }));
  return { drawables, labels, anchors, order };
widget: |
  const same = (state) => ({ state, effects: [] });
  const encode = (pegs) => pegs.map((s) => s.join("")).join("|");
  const init = (scene) => {
    const raw = typeof scene.params.pegs === "string" && scene.params.pegs.split("|").length === 3 ? scene.params.pegs : null;
    const n = Math.min(5, Math.max(3, Number.isInteger(scene.params.disks) ? scene.params.disks : 3));
    const pegs = raw ? raw.split("|").map((s) => [...s]) : [Array.from({ length: n }, (_, i) => String(n - i)), [], []];
    return { pegs, selected: null, moves: Number.isInteger(scene.params.moves) ? scene.params.moves : 0, n };
  };
  const TOP_ONLY = "Only the top disk moves.";
  // Which peg disk `d` (a one-character string) stands on, or -1.
  const pegOf = (st, d) => st.pegs.findIndex((s) => s.includes(d));
  // The ONE move rule. Both gestures come here — a drag that was released on
  // a peg, and the second click of a click-click — so the puzzle can only
  // ever be wrong in one place.
  const move = (st, from, to) => {
    const idle = { ...st, selected: null };
    if (from < 0 || to < 0 || from === to || st.pegs[from].length === 0) return same(idle);
    const disk = st.pegs[from][st.pegs[from].length - 1], rest = st.pegs[to];
    if (rest.length > 0 && Number(rest[rest.length - 1]) < Number(disk)) {
      return { state: idle, effects: [{ glow: "peg_" + to, color: "#b23a3a" }, { caption: "A larger disk may not go on a smaller one." }] };
    }
    const pegs = st.pegs.map((s, i) => (i === from ? s.slice(0, -1) : i === to ? [...s, disk] : s));
    const moves = st.moves + 1;
    const solved = pegs[2].length === st.n;
    const effects = [{ patch: { pegs: encode(pegs), moves } }];
    if (solved) effects.push({ glow: "peg_2", color: "#4a7c59" }, { caption: "Solved in " + moves + " moves." }, { answer: "solved" });
    return { state: { ...st, pegs, selected: null, moves }, effects };
  };
  // Where a gesture LANDED, as a peg index. A peg is itself; a disk is the
  // peg it stands on — which is where a viewer aiming at the top of a stack
  // actually releases. Blank paper, the title and the counter are no target.
  const target = (st, id) => {
    const p = /^peg_(\d)$/.exec(id ?? "");
    if (p) return Number(p[1]);
    const d = /^disk_(\d)$/.exec(id ?? "");
    return d ? pegOf(st, d[1]) : -1;
  };
  const on = (ev, st) => {
    if (ev.type === "drag") {
      const m = /^disk_(\d)$/.exec(ev.id);
      if (!m) return same(st);
      const from = pegOf(st, m[1]);
      if (from < 0) return same(st);
      // A buried disk is not liftable at all: say so rather than lifting the
      // one above it, which is not what the pointer grabbed.
      if (st.pegs[from][st.pegs[from].length - 1] !== m[1]) return { state: { ...st, selected: null }, effects: [{ caption: TOP_ONLY }] };
      return move(st, from, target(st, ev.to));
    }
    if (ev.type !== "click") return same(st);
    const disk = /^disk_(\d)$/.exec(ev.id), peg = /^peg_(\d)$/.exec(ev.id);
    if (!disk && !peg) return same(st);
    // A click on a disk is a click on its peg — with one extra rule when
    // nothing is held yet: only the disk on TOP can be picked up.
    const p = peg ? Number(peg[1]) : pegOf(st, disk[1]);
    if (p < 0) return same(st);
    if (st.selected === null) {
      if (st.pegs[p].length === 0) return same(st);
      const top = st.pegs[p][st.pegs[p].length - 1];
      if (disk && disk[1] !== top) return { state: st, effects: [{ caption: TOP_ONLY }] };
      return { state: { ...st, selected: p }, effects: [{ glow: "disk_" + top }] };
    }
    if (st.selected === p) return { state: { ...st, selected: null }, effects: [] };
    return move(st, st.selected, p);
  };
  const demo = (scene, answer) => {
    const n = Math.min(5, Math.max(3, Number.isInteger(scene.params.disks) ? scene.params.disks : 3));
    const pegs = [Array.from({ length: n }, (_, i) => String(n - i)), [], []];
    const steps = [];
    let moves = 0;
    // `tap`, not `move`: the movie's form of a move — two laser taps and a
    // patch — and a second `move` in this file would shadow the RULE above.
    const tap = (from, to) => {
      pegs[to].push(pegs[from].pop());
      moves = moves + 1;
      steps.push([{ pointer: "peg_" + from }, { pointer: "peg_" + to }, { patch: { pegs: encode(pegs), moves } }]);
    };
    const hanoi = (k, from, to, via) => { if (k === 0) return; hanoi(k - 1, from, via, to); tap(from, to); hanoi(k - 1, via, to, from); };
    hanoi(n, 0, 2, 1);
    // Bounded to seven moves (14 taps) on purpose: the whole 3-disk solution —
    // a 4-disk solve would run 27s of movie. Whatever the disk count, the
    // movie must still end on the solved tower: one last patch jumps
    // straight there after the bounded taps — but ONLY when the bound cut
    // something off. At n=3 the whole solution IS seven moves, so the last
    // bounded step already lands on the solved tower; appending the jump
    // again would emit the very same patch twice.
    const bounded = steps.slice(0, 7).reduce((a, b) => a.concat(b), []);
    const solved = ["", "", Array.from({ length: n }, (_, i) => String(n - i)).join("")].join("|");
    return steps.length > 7 ? bounded.concat([{ patch: { pegs: solved, moves: 2 ** n - 1 } }]) : bounded;
  };
  return { init, on, demo };
---
template: logic_gates
title: Logic gate
version: 1
kit: 10
status: ready
description: >-
  One logic gate (AND, OR, XOR or NAND) with two input switches and a bulb:
  the bulb lights when the gate's output is 1. The viewer can flip the
  switches while paused and watch the bulb; an ask bound to this template
  can require an input that lights it. Choose this for ANY request about a
  single logic gate, a truth table shown on a circuit, or Boolean AND/OR/XOR.
params:
  type: object
  properties:
    gate:
      type: string
      enum: [AND, OR, XOR, NAND]
      description: "The gate (default AND)."
    a:
      type: boolean
      description: "Input A on/off — the widget sets this; default false."
    b:
      type: boolean
      description: "Input B on/off — the widget sets this; default false."
element_ids:
  switch_a: input A's switch pad (tap to flip)
  switch_b: input B's switch pad (tap to flip)
  gate: the gate body with its name
  bulb: the output bulb (lit when the output is 1)
  wires: the wiring (a group)
  title: the title
examples:
  - request: "What does an XOR gate do?"
    params: { gate: "XOR" }
  - request: "Show an AND gate with two switches and a bulb."
    params: { gate: "AND" }
layout: |
  const C = kit.COLORS;
  const gate = ["AND", "OR", "XOR", "NAND"].includes(params.gate) ? params.gate : "AND";
  const a = params.a === true, b = params.b === true;
  const out = gate === "AND" ? a && b : gate === "OR" ? a || b : gate === "XOR" ? a !== b : !(a && b);
  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  push(kit.text("title", [500, 700], gate + " gate", { fontSize: 30 }));
  push(kit.pad("switch_a", [180, 460], "A = " + (a ? 1 : 0), { w: 150, h: 64 }, { fill: a ? C.series[2] : undefined }));
  push(kit.pad("switch_b", [180, 300], "B = " + (b ? 1 : 0), { w: 150, h: 64 }, { fill: b ? C.series[2] : undefined }));
  push(kit.group("wires", [
    kit.stroke("wires__a", [[255, 460], [400, 460], [400, 410]], { strokeWidth: 3 }),
    kit.stroke("wires__b", [[255, 300], [400, 300], [400, 350]], { strokeWidth: 3 }),
    kit.stroke("wires__out", [[600, 380], [700, 380]], { strokeWidth: 3 }),
  ]));
  push(kit.group("gate", [
    kit.stroke("gate__body", kit.rect(400, 320, 200, 120), { closed: true, fill: kit.GROUND, strokeWidth: 3 }),
    kit.text("gate__name", [500, 380], gate, { fontSize: 32 }),
  ]));
  const bulb = kit.stamp("bulb", [780, 380], { scale: 60 });
  const lit = kit.area("bulb__lit", kit.circle([780, 380], 40), out ? "#f2c94c" : kit.GROUND, { opacity: out ? 0.9 : 0.0, precise: true });
  push(kit.group("bulb", [lit, ...bulb.drawables]));
  anchors.bulb = [780, 380]; anchors.switch_a = [180, 460]; anchors.switch_b = [180, 300];
  return { drawables, labels, anchors, order };
widget: |
  const same = (state) => ({ state, effects: [] });
  const table = (gate, a, b) => gate === "AND" ? a && b : gate === "OR" ? a || b : gate === "XOR" ? a !== b : !(a && b);
  const init = (scene) => ({ a: scene.params.a === true, b: scene.params.b === true, gate: ["AND", "OR", "XOR", "NAND"].includes(scene.params.gate) ? scene.params.gate : "AND" });
  const on = (ev, st) => {
    if (ev.type !== "click") return same(st);
    if (ev.id !== "switch_a" && ev.id !== "switch_b") return same(st);
    const next = { ...st, [ev.id === "switch_a" ? "a" : "b"]: !(ev.id === "switch_a" ? st.a : st.b) };
    const out = table(next.gate, next.a, next.b);
    const effects = [{ sound: { hz: 520, ms: 60 } }, { patch: { a: next.a, b: next.b } }, { caption: "A=" + (next.a ? 1 : 0) + ", B=" + (next.b ? 1 : 0) + " → " + (out ? 1 : 0) }];
    if (out) effects.push({ glow: "bulb", color: "#4a7c59" }, { answer: "lit" });
    return { state: next, effects };
  };
  const demo = (scene, answer) => {
    const gate = ["AND", "OR", "XOR", "NAND"].includes(scene.params.gate) ? scene.params.gate : "AND";
    let a = scene.params.a === true, b = scene.params.b === true;
    const rows = [[false, false], [true, false], [false, true], [true, true]];
    const lit = rows.find((r) => table(gate, r[0], r[1])) ?? [a, b];
    const out = [];
    if (a !== lit[0]) { a = lit[0]; out.push({ pointer: "switch_a" }, { patch: { a, b } }); }
    if (b !== lit[1]) { b = lit[1]; out.push({ pointer: "switch_b" }, { patch: { a, b } }); }
    if (out.length === 0 && table(gate, a, b)) {
      // Already lit at the starting switches (NAND at 0,0 — nothing above
      // needed to flip): still show the laser working the gate, flip A on
      // then back off, before the glow.
      out.push({ pointer: "switch_a" }, { patch: { a: !a, b } });
      out.push({ pointer: "switch_a" }, { patch: { a, b } });
    }
    if (table(gate, a, b)) out.push({ glow: "bulb", color: "#4a7c59" });
    return out;
  };
  return { init, on, demo };
---
template: xylophone
title: Xylophone
version: 1
kit: 10
status: ready
description: >-
  A xylophone: eight tuned bars from C4 to C5, long and low on the left,
  short and high on the right, a line of the notes played so far, and a done
  pad that delivers the tune. The viewer can play it while paused — tap a bar
  and it sounds, or press the number keys 1 to 8, Enter for done; an ask
  bound to this template can require a short tune. Choose this for ANY
  request about a xylophone, a glockenspiel, a marimba, the notes of a scale,
  or playing a short tune on tuned bars.
params:
  type: object
  properties:
    title:
      type: string
      description: "Heading above the bars (default \"Xylophone\")."
    played:
      type: string
      description: "Notes played so far, space separated (e.g. \"C4 E4 G4\") — the widget sets this; leave empty."
element_ids:
  bar_1: the C4 bar (the longest, on the left)
  bar_2: the D4 bar
  bar_3: the E4 bar
  bar_4: the F4 bar
  bar_5: the G4 bar
  bar_6: the A4 bar
  bar_7: the B4 bar
  bar_8: the C5 bar (the shortest, on the right)
  key_done: the done pad (tap to deliver the tune)
  played: the line of notes played so far
  hint: the keyboard hint line, drawn with the pads
  title: the title
examples:
  - request: "A xylophone I can play."
    params: {}
  - request: "Show the eight bars of a C major scale."
    params: { title: "C major, one octave" }
layout: |
  const C = kit.COLORS;
  const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];
  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  const title = typeof params.title === "string" && params.title.trim() !== "" ? params.title : "Xylophone";
  push(kit.text("title", [500, 700], title, { fontSize: 30 }));
  push(kit.text("played", [500, 630], params.played ?? "", { fontSize: 34, color: C.demand }));
  push(kit.text("hint", [500, 582], "keys 1 to 8 play the bars · enter delivers the tune", { fontSize: 16, color: C.guide }));
  const BASE = 170;
  NOTES.forEach((note, i) => {
    // The falling height IS the lesson: a long bar rings low, a short one
    // high. The pad's own outline is the bar.
    const h = 380 - i * 20, x = 137 + i * 105;
    push(kit.pad("bar_" + (i + 1), [x, BASE + h / 2], note, { w: 90, h }, { fontSize: 26, fill: C.series[i % C.series.length] }));
    anchors["bar_" + (i + 1)] = [x, BASE + h / 2];
  });
  push(kit.pad("key_done", [500, 105], "done", { w: 150, h: 60 }));
  anchors.key_done = [500, 105];
  return { drawables, labels, anchors, order };
widget: |
  const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];
  const same = (state) => ({ state, effects: [] });
  const norm = (s) => String(s).trim().toUpperCase().replace(/\s+/g, " ");
  const init = (scene) => ({ played: typeof scene.params.played === "string" ? scene.params.played : "" });
  const on = (ev, st) => {
    // A bar and its number key are the same gesture, so both go through one
    // rule; only done answers ("answer" means done — spec §2.2).
    const play = (i) => {
      const played = st.played === "" ? NOTES[i] : st.played + " " + NOTES[i];
      return { state: { ...st, played }, effects: [
        { sound: { notes: NOTES[i] + ":q", tempo: 160 } },
        { patch: { played } },
      ]};
    };
    const done = () => (st.played === "" ? same(st) : { state: st, effects: [{ answer: st.played }] });
    if (ev.type === "key") {
      if (ev.key === "Enter") return done();
      const i = Number(ev.key) - 1;
      return Number.isInteger(i) && i >= 0 && i < NOTES.length ? play(i) : same(st);
    }
    if (ev.type !== "click") return same(st);
    if (ev.id === "key_done") return done();
    const m = /^bar_([1-8])$/.exec(ev.id);
    return m ? play(Number(m[1]) - 1) : same(st);
  };
  const demo = (scene, answer) => {
    const out = [];
    let played = "";
    for (const note of norm(answer).split(" ")) {
      const i = NOTES.indexOf(note);
      // A note this xylophone does not have: demonstrate NOTHING. Skipping it
      // would play a DIFFERENT tune than the one asked for, and the movie
      // would look right while teaching the wrong answer.
      if (i < 0) return [];
      played = played === "" ? NOTES[i] : played + " " + NOTES[i];
      out.push({ pointer: "bar_" + (i + 1), sound: { notes: NOTES[i] + ":q", tempo: 160 } }, { patch: { played } });
    }
    return out.concat([{ pointer: "key_done" }]);
  };
  const judge = (given, answer) => norm(given) === norm(answer);
  return { init, on, demo, judge, keys: ["1", "2", "3", "4", "5", "6", "7", "8", "Enter"] };
---
template: bubble_sort
title: Bubble sort
version: 1
kit: 10
status: ready
description: >-
  A row of bars, each as tall as its value and labelled with it, that the
  viewer sorts by hand under bubble sort's one rule: only NEIGHBOURS may
  swap. DRAG a bar onto the bar beside it — or click one, then the other —
  and the two trade places; a counter keeps the tally. When the row is ascending every bar glows. An ask
  bound to this template can require the row sorted. Choose this for ANY
  request about bubble sort, sorting algorithms by hand, swapping neighbours,
  or counting the swaps a sort takes.
params:
  type: object
  properties:
    values:
      type: array
      items: { type: integer }
      minItems: 4
      maxItems: 8
      description: "The bars, left to right (default [5, 2, 8, 1, 9, 3]) — start them UNSORTED, and the widget sets this as the viewer swaps."
    swaps:
      type: integer
      description: "Swaps made so far — the widget sets this; leave empty."
element_ids:
  bar_0: the leftmost bar (one bar_<i> per value — bar_0 … bar_<n−1> — labelled with its value)
  counter: the swap counter
  hint: the line that states the neighbours-only rule
  title: the title
examples:
  - request: "Sort six bars the way bubble sort does."
    params: { values: [5, 2, 8, 1, 9, 3] }
  - request: "Bubble sort on four bars."
    params: { values: [4, 1, 3, 2] }
layout: |
  const C = kit.COLORS;
  const DEFAULT = [5, 2, 8, 1, 9, 3];
  const given = Array.isArray(params.values) ? params.values.filter((v) => typeof v === "number") : [];
  const values = given.length >= 2 ? given.slice(0, 8) : DEFAULT;
  const n = values.length;
  const top = Math.max(...values.map((v) => Math.abs(v)), 1);
  // Colour by RANK, never by position: a bar keeps its colour as it travels,
  // which is the only way the eye can follow one value through a sort.
  const ranked = values.slice().sort((a, b) => a - b);
  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  push(kit.text("title", [500, 700], "Bubble sort", { fontSize: 30 }));
  push(kit.text("counter", [500, 645], "swaps: " + (Number.isInteger(params.swaps) ? params.swaps : 0), { fontSize: 22, color: C.guide }));
  push(kit.text("hint", [500, 600], "drag a bar onto a NEIGHBOUR — or click both — to swap them", { fontSize: 16, color: C.guide }));
  const BASE = 150, PITCH = 820 / n, W = Math.min(120, PITCH - 22);
  values.forEach((v, i) => {
    const h = 70 + 330 * (Math.abs(v) / top), x = 90 + PITCH * (i + 0.5);
    push(kit.pad("bar_" + i, [x, BASE + h / 2], String(v), { w: W, h }, { fontSize: 26, fill: C.series[ranked.indexOf(v) % C.series.length] }));
    anchors["bar_" + i] = [x, BASE + h / 2];
  });
  return { drawables, labels, anchors, order };
widget: |
  const DEFAULT = [5, 2, 8, 1, 9, 3];
  const same = (state) => ({ state, effects: [] });
  const barsOf = (scene) => {
    const given = Array.isArray(scene.params.values) ? scene.params.values.filter((v) => typeof v === "number") : [];
    return given.length >= 2 ? given.slice(0, 8) : DEFAULT.slice();
  };
  const isSorted = (v) => v.every((x, i) => i === 0 || v[i - 1] <= x);
  const allBars = (v) => v.map((_, k) => "bar_" + k);
  const init = (scene) => ({
    values: barsOf(scene),
    selected: null,
    swaps: Number.isInteger(scene.params.swaps) ? scene.params.swaps : 0,
    done: false,
  });
  // The index of the bar an event named, or -1 (blank paper included).
  const barAt = (st, id) => {
    const m = /^bar_(\d+)$/.exec(id ?? "");
    const i = m ? Number(m[1]) : -1;
    return i >= 0 && i < st.values.length ? i : -1;
  };
  // The one swap rule: the second click of a click-click and the release of
  // a drag both land here, so "only neighbours" is stated once.
  const trade = (st, i, j) => {
    const idle = { ...st, selected: null };
    if (i < 0 || j < 0 || i === j) return same(idle);
    if (Math.abs(i - j) !== 1) return { state: idle, effects: [{ caption: "Bubble sort only swaps neighbours." }] };
    const a = Math.min(i, j), values = st.values.slice();
    values[a] = st.values[a + 1];
    values[a + 1] = st.values[a];
    const swaps = st.swaps + 1, done = isSorted(values);
    const effects = [{ sound: { hz: 480, ms: 60 } }, { patch: { values, swaps } }];
    if (done) effects.push({ glow: allBars(values), color: "#4a7c59" }, { caption: "Sorted in " + swaps + " swaps." }, { answer: "sorted" });
    return { state: { ...st, values, selected: null, swaps, done }, effects };
  };
  const on = (ev, st) => {
    // Once the row is sorted the widget has answered; further gestures are
    // the viewer playing with a finished puzzle, not a second answer.
    if (st.done) return same(st);
    if (ev.type === "drag") {
      const i = barAt(st, ev.id);
      return i < 0 ? same(st) : trade(st, i, barAt(st, ev.to));
    }
    if (ev.type !== "click") return same(st);
    const i = barAt(st, ev.id);
    if (i < 0) return same(st);
    if (st.selected === null) return { state: { ...st, selected: i }, effects: [{ glow: "bar_" + i }] };
    if (st.selected === i) return { state: { ...st, selected: null }, effects: [] };
    return trade(st, st.selected, i);
  };
  const demo = (scene) => {
    const start = barsOf(scene), values = start.slice(), steps = [];
    let swaps = 0;
    for (let end = values.length - 1; end > 0; end--) {
      for (let i = 0; i < end; i++) {
        if (values[i] <= values[i + 1]) continue;
        const hold = values[i];
        values[i] = values[i + 1];
        values[i + 1] = hold;
        swaps = swaps + 1;
        steps.push([{ pointer: "bar_" + i }, { pointer: "bar_" + (i + 1) }, { patch: { values: values.slice(), swaps } }]);
      }
    }
    // Bounded to twelve swaps (24 taps): the default six bars take seven, but
    // a reversed eight takes 28 — a minute of laser. Whatever the bars, the
    // movie must END SORTED: one last patch jumps straight there.
    const bounded = steps.slice(0, 12).reduce((a, b) => a.concat(b), []);
    const sorted = start.slice().sort((a, b) => a - b);
    return bounded.concat([
      { patch: { values: sorted, swaps } },
      { glow: allBars(sorted), color: "#4a7c59" },
      { caption: "Sorted in " + swaps + " swaps." },
    ]);
  };
  return { init, on, demo };
---
template: tictactoe
title: Tic-tac-toe
version: 1
kit: 10
status: ready
description: >-
  Tic-tac-toe against a built-in opponent. The viewer is X and moves first —
  click a square while paused, or press 1 to 9 (reading order) — and O
  answers at once by ONE fixed rule: take the win, else block, else the
  centre, else the first free corner, else the first free square. The same
  moves therefore always give the same game. Three in a row glows and the
  widget answers won, lost or draw. An ask bound to this template can require
  a draw. Choose this for ANY request about tic-tac-toe, noughts and crosses,
  or a game nobody can win against careful play.
params:
  type: object
  properties:
    title:
      type: string
      description: "Heading above the board (default \"Tic-tac-toe\")."
    board:
      type: string
      description: "The nine squares in reading order, \"x\", \"o\" or \".\" (e.g. \"x...o....\") — the widget sets this; leave empty for an empty board."
element_ids:
  grid: the four lines of the board (a group)
  cell_0: the top-left square (its mark is its label; key 1)
  cell_1: the top-middle square (key 2)
  cell_2: the top-right square (key 3)
  cell_3: the middle-left square (key 4)
  cell_4: the centre square (key 5)
  cell_5: the middle-right square (key 6)
  cell_6: the bottom-left square (key 7)
  cell_7: the bottom-middle square (key 8)
  cell_8: the bottom-right square (key 9)
  status: the line under the title that says whose move it is, or how it ended
  title: the title
examples:
  - request: "Tic-tac-toe against the computer."
    params: {}
  - request: "Show a tic-tac-toe board with the centre taken."
    params: { board: "....x...." }
layout: |
  const C = kit.COLORS;
  const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
  const raw = typeof params.board === "string" && params.board.length === 9 ? params.board.toLowerCase() : ".........";
  const board = raw.split("").map((c) => (c === "x" || c === "o" ? c : "."));
  const won = LINES.find((l) => board[l[0]] !== "." && board[l[0]] === board[l[1]] && board[l[1]] === board[l[2]]);
  const full = board.every((c) => c !== ".");
  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  const title = typeof params.title === "string" && params.title.trim() !== "" ? params.title : "Tic-tac-toe";
  push(kit.text("title", [500, 700], title, { fontSize: 30 }));
  const status = won ? (board[won[0]] === "x" ? "You won." : "O won.") : full ? "A draw." : "Your move — you are X.";
  push(kit.text("status", [500, 640], status, { fontSize: 24, color: C.guide }));
  // The board is the four lines of the # — the squares themselves are
  // invisible zones, so nothing is drawn twice and a click anywhere in a
  // square counts (the Tower's peg zones, same trick).
  const S = 130, X0 = 305, Y0 = 185;
  const at = (i) => [X0 + S * (i % 3) + S / 2, Y0 + S * (2 - Math.floor(i / 3)) + S / 2];
  push(kit.group("grid", [
    kit.stroke("grid__v1", [[X0 + S, Y0], [X0 + S, Y0 + 3 * S]], { strokeWidth: 4 }),
    kit.stroke("grid__v2", [[X0 + 2 * S, Y0], [X0 + 2 * S, Y0 + 3 * S]], { strokeWidth: 4 }),
    kit.stroke("grid__h1", [[X0, Y0 + S], [X0 + 3 * S, Y0 + S]], { strokeWidth: 4 }),
    kit.stroke("grid__h2", [[X0, Y0 + 2 * S], [X0 + 3 * S, Y0 + 2 * S]], { strokeWidth: 4 }),
  ]));
  anchors.grid = [500, Y0 + 1.5 * S];
  board.forEach((mark, i) => {
    const c = at(i);
    push(kit.group("cell_" + i, [
      kit.stroke("cell_" + i + "__zone", kit.rect(c[0] - S / 2, c[1] - S / 2, S, S), { closed: true, fill: kit.GROUND, opacity: 0.001, strokeWidth: 1, instant: true }),
      kit.text("cell_" + i + "__mark", c, mark === "x" ? "X" : mark === "o" ? "O" : "", { fontSize: 64, color: mark === "x" ? C.demand : C.supply }),
    ]));
    anchors["cell_" + i] = c;
  });
  return { drawables, labels, anchors, order };
widget: |
  const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
  const CORNERS = [0, 2, 6, 8];
  const NAMES = ["the top left", "the top middle", "the top right", "the middle left", "the centre", "the middle right", "the bottom left", "the bottom middle", "the bottom right"];
  const same = (state) => ({ state, effects: [] });
  const readBoard = (s) => (typeof s === "string" && s.length === 9 ? s.toLowerCase() : ".........").split("").map((c) => (c === "x" || c === "o" ? c : "."));
  const lineOf = (b) => LINES.find((l) => b[l[0]] !== "." && b[l[0]] === b[l[1]] && b[l[1]] === b[l[2]]) ?? null;
  const full = (b) => b.every((c) => c !== ".");
  /** A line where `who` has two and the third is free — the win, or the block. */
  const third = (b, who) => {
    for (const l of LINES) {
      const free = l.filter((i) => b[i] === ".");
      if (free.length === 1 && l.filter((i) => b[i] === who).length === 2) return free[0];
    }
    return null;
  };
  // ONE fixed rule, in this order, so the same clicks always give the same
  // game — which is what makes the lesson (and the test) repeatable.
  const reply = (b) => {
    const win = third(b, "o");
    if (win !== null) return win;
    const block = third(b, "x");
    if (block !== null) return block;
    if (b[4] === ".") return 4;
    const corner = CORNERS.find((i) => b[i] === ".");
    if (corner !== undefined) return corner;
    return b.findIndex((c) => c === ".");
  };
  const init = (scene) => {
    const board = readBoard(scene.params.board);
    return { board, done: lineOf(board) !== null || full(board) };
  };
  const play = (st, i) => {
    if (st.done) return same(st);
    if (st.board[i] !== ".") return { state: st, effects: [{ caption: "That square is taken." }] };
    const b = st.board.slice();
    b[i] = "x";
    let theirs = null, line = lineOf(b);
    let outcome = line ? "won" : full(b) ? "draw" : null;
    if (outcome === null) {
      theirs = reply(b);
      b[theirs] = "o";
      line = lineOf(b);
      outcome = line ? "lost" : full(b) ? "draw" : null;
    }
    if (outcome === "draw") line = b.map((_, k) => k);
    const caption = outcome === "won" ? "Three in a row — you won." :
      outcome === "lost" ? "O got three in a row." :
      outcome === "draw" ? "A draw — neither side could force it." :
      "O played " + NAMES[theirs] + ".";
    const effects = [{ sound: { hz: 620, ms: 60 } }, { caption }, { patch: { board: b.join("") } }];
    if (outcome) effects.push({ glow: line.map((k) => "cell_" + k), color: outcome === "lost" ? "#b23a3a" : "#4a7c59" }, { answer: outcome });
    return { state: { board: b, done: outcome !== null }, effects };
  };
  const on = (ev, st) => {
    if (ev.type === "key") {
      const i = Number(ev.key) - 1;
      return Number.isInteger(i) && i >= 0 && i < 9 ? play(st, i) : same(st);
    }
    if (ev.type !== "click") return same(st);
    const m = /^cell_([0-8])$/.exec(ev.id);
    return m ? play(st, Number(m[1])) : same(st);
  };
  const demo = (scene) => {
    // A scripted X — centre, the far corner, then the blocks O forces — run
    // through the SAME rules the viewer plays against, so the movie can never
    // show a game the widget would not allow. It ends in a draw.
    let st = init(scene);
    const out = [];
    for (const i of [4, 8, 1, 3, 6]) {
      if (st.done || st.board[i] !== ".") continue;
      const r = play(st, i);
      st = r.state;
      out.push({ pointer: "cell_" + i });
      for (const e of r.effects) if (e.answer === undefined) out.push(e);
    }
    return out;
  };
  const norm = (s) => String(s).trim().toLowerCase();
  // A win passes a draw's ask: beating the rule is not a wrong answer.
  const judge = (given, answer) => norm(given) === norm(answer) || (norm(answer) === "draw" && norm(given) === "won");
  return { init, on, demo, judge, keys: ["1", "2", "3", "4", "5", "6", "7", "8", "9"] };
