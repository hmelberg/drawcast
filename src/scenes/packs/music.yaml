pack: music
title: Music
description: Staff notation, a piano keyboard and the parts of a violin — sheet-music figures that pair with the play command's synthesized sound.
---
template: note_sheet
title: Note sheet (staff notation)
version: 1
kit: 3
status: ready
engines: [music]
interactions: [staff]
description: >-
  A treble-clef staff with notes computed from a simple notation string —
  "C4:q D4:q E4:h" (pitch letter + optional #/b + octave, duration w/h/q/e/s
  = 4/2/1/half/quarter beats, chords joined with +, R for rests) — with
  correct staff positions, ledger lines, stems, open vs filled heads, bar
  lines by time signature, and optional letter names under the notes — or a
  whole tune given as ABC notation via the `abc` param (first voice
  rendered; key signatures become explicit accidentals). Pair it with a
  `play` command carrying the SAME notation (or the same {abc}) so viewers
  hear what they see. Choose this scene for ANY request about sheet music,
  staff or musical notation, notes/scales/melodies/chords written on a
  staff, reading music, note durations, or a named tune in ABC. With
  keyboard: true a compact piano sits below the staff, and each note also
  gets a key mark with its own id key_<i> — so one play command with
  reveal: [note_0, ...] and press: [key_0, ...] writes the staff note
  permanently AND presses its piano key transiently on the same beat.
params:
  type: object
  properties:
    notes:
      type: string
      description: "Notation, e.g. \"C4:q D4:q E4:q F4:q G4:h R:q G4+B4:h\". Up to 16 tokens; comfortable range C3-A5. Default: the C-major scale."
    abc:
      type: string
      description: "A tune in ABC notation (overrides `notes`; the first voice is rendered, bar lines follow the tune's M: unless time_top is set)."
    time_top:
      type: integer
      description: "Beats per bar for the bar lines, 2-6 (default 4; 0 = no bar lines)."
    keyboard:
      type: boolean
      description: "Draw a compact piano under the staff; each sounding note also gets its own key-mark element key_<i> — reveal the notes, press the keys (default false; suits the C4-C6 range)."
    labels:
      type: boolean
      description: "Letter names under the notes (default true; false on a grand staff unless set)."
    clef:
      type: string
      enum: [treble, bass, grand]
      description: "treble (default); bass for low notes (comfortable C2-E4); grand = treble over bass joined by a brace, for piano music."
    bass_notes:
      type: string
      description: "Grand staff only: the bass staff's notes, the same notation as `notes`, lined up with them by beat. Up to 16 tokens."
    sound:
      type: boolean
      description: "The notes sound as they are drawn: a draw of note_<i> ids plays exactly those notes, each appearing (and its key going down) as it sounds, with the beat's sentence over them. Write no play for them yourself."
    title:
      type: string
element_ids:
  staff: the five staff lines (a group)
  clef: the clef (treble, or bass on a bass staff; the treble one on a grand staff)
  bass_staff: the lower staff's five lines (grand staff)
  bass_clef: the bass clef (grand staff)
  brace: the brace joining the two staves (grand staff)
  bass_note_<i>: the i-th bass-staff token (grand staff)
  bass_key_<i>: the key mark for bass token i (grand staff with keyboard)
  keys: the compact piano below the staff (a group, when keyboard)
  key_<i>: the key mark for token i (a group, when keyboard) — press these in time with the notes
  note_<i>: the i-th token — heads, stem, flag, ledger lines (a group; rests too)
  bar_<i>: the i-th bar line
  label_<i>: letter name under token i (when labels)
  title: figure title, when set
examples:
  - request: "Write the C major scale on a staff."
    params:
      title: "The C major scale"
  - request: "Show a simple melody with a chord at the end."
    params:
      notes: "E4:q E4:q F4:q G4:q G4:q F4:q E4:q D4:q C4:h C4+E4+G4:h"
      title: "Ode to Joy (opening)"
  - request: "How do the two hands share a piano score?"
    params:
      clef: grand
      notes: "E4:q E4:q F4:q G4:q G4:q F4:q E4:q D4:q"
      bass_notes: "C3:h G2:h C3:h G2:h"
      title: "Two hands, one score"
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS, M = engines.music;
  const clef = params.clef === "bass" || params.clef === "grand" ? params.clef : "treble";
  const grand = clef === "grand";
  let notation = typeof params.notes === "string" && params.notes.trim() !== "" ? params.notes : (clef === "bass" ? "C3:q D3:q E3:q F3:q G3:q A3:q B3:q C4:q" : "C4:q D4:q E4:q F4:q G4:q A4:q B4:q C5:q");
  let bassNotation = typeof params.bass_notes === "string" ? params.bass_notes : "";
  let timeTopDefault = 4;
  if (typeof params.abc === "string" && params.abc.trim() !== "") {
    const tune = kit.parseABC(params.abc);
    if (tune.voices.length > 0) notation = tune.voices[0].notes;
    if (grand && tune.voices.length > 1 && bassNotation === "") bassNotation = tune.voices[1].notes;
    if (tune.meterTop) timeTopDefault = tune.meterTop;
  }
  const tokens = kit.parseNotes(notation).slice(0, 16);
  const bassTokens = grand ? kit.parseNotes(bassNotation).slice(0, 16) : [];
  const timeTop = Number.isFinite(params.time_top) ? Math.max(0, Math.min(6, Math.round(params.time_top))) : timeTopDefault;
  const wantLabels = grand ? params.labels === true : params.labels !== false;
  const wantKeyboard = params.keyboard === true;

  const drawables = [], labels = [], anchors = {}, order = [];
  const attached = {};
  const push = (d) => { drawables.push(d); order.push(d.id); };
  // A glyph from the music font as an exact filled shape (never stroked into a blob).
  const glyph = (id, g, color) => kit.area(id, g.pts, color || C.ink, { precise: true, ...(g.holes ? { holes: g.holes } : {}), ms: MS.dot });
  // What the viewer composed while paused (ui/staffplay.ts) is drawn in the
  // accent ink from token `draft_from` on — a preview param, never authored.
  const draftFrom = { treble: params.draft_from, bass: params.bass_draft_from };

  // The staves. A staff is its bottom line, its clef and the diatonic number
  // of that bottom line (octave*7 + letter): E4 = 30 for treble, G2 = 18 for
  // bass. One diatonic step = half a gap. A grand staff is two, joined by a
  // brace; with the keyboard on, everything moves up and a grand staff
  // tightens its gap so both hands and the keys still fit.
  const X0 = 130, X1 = 890;
  // A crowded line gets a smaller staff, so a flag or a sharp never runs into
  // the next note: about 2.4 staff spaces per note is what a head, its flag
  // and a little air need. A grand staff with the keys is 20 at most.
  const nDense = Math.max(1, tokens.length, bassTokens.length);
  const GAP = Math.max(16, Math.min(grand && wantKeyboard ? 20 : 26, (X1 - 240) / nDense / 2.4)), STEP = GAP / 2;
  const staves = [];
  if (grand) {
    const yT = wantKeyboard ? 560 : 460;
    staves.push({ key: "treble", bottom: yT, ref: 30, tokens, prefix: "note_", keyPrefix: "key_", labelPrefix: "label_", staffId: "staff", clefId: "clef" });
    staves.push({ key: "bass", bottom: yT - 4 * GAP - 3 * GAP, ref: 18, tokens: bassTokens, prefix: "bass_note_", keyPrefix: "bass_key_", labelPrefix: "bass_label_", staffId: "bass_staff", clefId: "bass_clef" });
  } else {
    const yB = wantKeyboard ? 430 : 340;
    staves.push({ key: clef, bottom: yB, ref: clef === "bass" ? 18 : 30, tokens, prefix: "note_", keyPrefix: "key_", labelPrefix: "label_", staffId: "staff", clefId: "clef" });
  }
  for (const st of staves) {
    const lines = [];
    for (let i = 0; i < 5; i++) lines.push(kit.stroke(st.staffId + "__l" + i, [[X0, st.bottom + i * GAP], [X1, st.bottom + i * GAP]], { strokeWidth: 2.5, ms: MS.guides }));
    push(kit.group(st.staffId, lines));
    anchors[st.staffId] = [(X0 + X1) / 2, st.bottom + 2 * GAP];
    // The clef's origin sits on its reference line: G on the second line, F on the fourth.
    const refLine = st.key === "bass" ? st.bottom + 3 * GAP : st.bottom + GAP;
    push(glyph(st.clefId, M.glyphAt(st.key === "bass" ? "fClef" : "gClef", [X0 + 14, refLine], GAP)));
    anchors[st.clefId] = [X0 + 14 + GAP, refLine];
  }
  if (grand) {
    const top = staves[0].bottom + 4 * GAP, bottom = staves[1].bottom;
    const [bx0, by0, bx1, by1] = M.bboxOf("brace");
    // The brace glyph is one staff tall at one staff space; scale it to span both staves.
    const k = (top - bottom) / ((by1 - by0) * GAP);
    const g = M.glyphAt("brace", [0, 0], GAP * k);
    const shift = (pt) => [X0 - 8 - (bx1 * GAP * k) + pt[0], bottom - by0 * GAP * k + pt[1]];
    push(glyph("brace", { pts: g.pts.map(shift), ...(g.holes ? { holes: g.holes.map((h) => h.map(shift)) } : {}) }));
    push(kit.stroke("brace__line", [[X0, bottom], [X0, top]], { strokeWidth: 2.5, ms: MS.guides }));
    anchors.brace = [X0 - 12, (top + bottom) / 2];
  }

  // Compact keyboard under the staff (keyboard: true). Sized to the tune's
  // octave span (max two), and keyMarks() hands each note its key-press
  // visuals so they can live inside that note's own group.
  const KB = { y0: 120, y1: 300, blackBot: 200 };
  let keyMarks = () => [];
  if (wantKeyboard) {
    const WHITE = ["C", "D", "E", "F", "G", "A", "B"];
    const HAS_SHARP = { C: true, D: true, E: false, F: true, G: true, A: true, B: false };
    let lo = 9, hi = 0;
    for (const tok of [...tokens, ...bassTokens]) for (const p of tok.pitches) {
      const o = Number(p[p.length - 1]);
      lo = Math.min(lo, o); hi = Math.max(hi, o);
    }
    if (lo > hi) { lo = 4; hi = 4; }
    const startOct = Math.min(lo, 6);
    // Two octaves at most on one staff; a grand staff spans both hands, three.
    const span = Math.max(1, Math.min(grand ? 3 : 2, hi - startOct + 1));
    const nWhite = span * 7;
    const KW = Math.min(54, 740 / nWhite);
    const KX0 = (1000 - nWhite * KW) / 2;
    const BW = KW * 0.62;
    const whiteX = (i) => KX0 + i * KW;
    const hasBlackAfter = (i) => i < nWhite - 1 && HAS_SHARP[WHITE[i % 7]];
    const keyChildren = [
      kit.stroke("keys__frame", [[KX0 - 8, KB.y0 - 8], [KX0 + nWhite * KW + 8, KB.y0 - 8], [KX0 + nWhite * KW + 8, KB.y1 + 12], [KX0 - 8, KB.y1 + 12]], { closed: true, strokeWidth: 3.5, ms: MS.stroke }),
      kit.area("keys__felt", [[KX0, KB.y1], [KX0 + nWhite * KW, KB.y1], [KX0 + nWhite * KW, KB.y1 + 6], [KX0, KB.y1 + 6]], C.demand, { opacity: 0.75, precise: true }),
    ];
    for (let i = 0; i < nWhite; i++) {
      keyChildren.push(kit.stroke("key_w" + i, [[whiteX(i), KB.y0], [whiteX(i) + KW, KB.y0], [whiteX(i) + KW, KB.y1], [whiteX(i), KB.y1]], { closed: true, fill: C.paper, strokeWidth: 2.5, ms: 70 }));
    }
    for (let i = 0; i < nWhite; i++) {
      if (!hasBlackAfter(i)) continue;
      const bx = whiteX(i + 1) - BW / 2;
      keyChildren.push(kit.area("key_b" + i + "__f", [[bx, KB.blackBot], [bx + BW, KB.blackBot], [bx + BW, KB.y1], [bx, KB.y1]], C.ink, { opacity: 1, precise: true }));
      keyChildren.push(kit.stroke("key_b" + i, [[bx, KB.blackBot], [bx + BW, KB.blackBot], [bx + BW, KB.y1], [bx, KB.y1]], { closed: true, strokeWidth: 2, ms: 70 }));
    }
    push(kit.group("keys", keyChildren));
    anchors.keys = [500, (KB.y0 + KB.y1) / 2];

    keyMarks = (noteId, pitches) => {
      const marks = [];
      pitches.forEach((p, j) => {
        const sharp = p.includes("#");
        const letter = p[0];
        const octave = Number(p[p.length - 1]);
        const wi = (octave - startOct) * 7 + WHITE.indexOf(letter);
        if (wi < 0 || wi >= nWhite) return;
        if (sharp) {
          if (wi >= nWhite - 1) return;
          const bx = whiteX(wi + 1) - BW / 2;
          marks.push(kit.area(noteId + "__key" + j, [[bx + 2, KB.blackBot + 2], [bx + BW - 2, KB.blackBot + 2], [bx + BW - 2, KB.y1 - 2], [bx + 2, KB.y1 - 2]], C.accent, { opacity: 0.85 }));
        } else {
          const x = whiteX(wi);
          const upL = x + 2 + (wi > 0 && hasBlackAfter(wi - 1) ? BW / 2 : 0);
          const upR = x + KW - 2 - (hasBlackAfter(wi) ? BW / 2 : 0);
          marks.push(kit.area(noteId + "__key" + j, [[x + 2, KB.y0 + 2], [x + KW - 2, KB.y0 + 2], [x + KW - 2, KB.blackBot - 2], [x + 2, KB.blackBot - 2]], C.demand, { opacity: 0.5 }));
          marks.push(kit.area(noteId + "__keyu" + j, [[upL, KB.blackBot - 2], [upR, KB.blackBot - 2], [upR, KB.y1 - 2], [upL, KB.y1 - 2]], C.demand, { opacity: 0.5 }));
        }
      });
      return marks;
    };
  }

  // Diatonic position: octave*7 + letter index.
  const LETTER_DIAT = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 };
  const diatOf = (pitch) => Number(pitch[pitch.length - 1]) * 7 + LETTER_DIAT[pitch[0]];

  // Where each token goes across. One staff: evenly by index, as always. A
  // grand staff: by beat, so what both hands play at once lines up.
  const totalBeats = Math.max(1, ...staves.map((st) => st.tokens.reduce((a, t) => a + t.beats, 0)));
  const nMax = Math.max(1, ...staves.map((st) => st.tokens.length));
  // Never wider than the staff: the last token must land before its end
  // (a floor here once pushed a sixteen-token line off the right edge; the
  // staff's own size already shrinks with density — GAP, above).
  const advance = Math.min(84, (X1 - 240) / nMax);
  const beatW = Math.min(84, (X1 - 240) / totalBeats);
  const xOf = (i, beatAt) => (grand ? 225 + beatAt * beatW : 225 + i * advance);
  const headHalf = (M.bboxOf("noteheadBlack")[2] / 2) * GAP;
  const ledgerHalf = headHalf + M.defaults.legerLineExtension * GAP;
  const stemW = Math.max(2.5, M.defaults.stemThickness * GAP);

  for (const st of staves) {
    const yOf = (pitch) => st.bottom + (diatOf(pitch) - st.ref) * STEP;
    const MID_Y = st.bottom + 2 * GAP;
    let beatsSoFar = 0;
    let barCount = 0;
    const from = grand && st.key === "bass" ? draftFrom.bass : draftFrom.treble;
    st.tokens.forEach((tok, i) => {
      const x = xOf(i, beatsSoFar);
      const id = st.prefix + i;
      const children = [];
      const ink = Number.isInteger(from) && i >= from ? C.accent : C.ink;
      const { value, dots } = M.valueOf(tok.beats);
      if (tok.pitches.length === 0) {
        // Rests: a whole rest hangs from the fourth line, a half sits on the
        // middle one, the rest are centred on the middle line.
        const restY = value === "whole" ? st.bottom + 3 * GAP : MID_Y;
        const name = M.restOf(value);
        const [rx0, , rx1] = M.bboxOf(name);
        children.push(glyph(id + "__rest", M.glyphAt(name, [x - ((rx0 + rx1) / 2) * GAP, restY], GAP), ink));
        anchors[id] = [x, MID_Y];
      } else {
        const ys = tok.pitches.map(yOf);
        const yLo = Math.min(...ys), yHi = Math.max(...ys);
        // Ledger lines: line positions beyond the staff that this note reaches.
        for (let ly = st.bottom - GAP; ly >= yLo - STEP; ly -= GAP) {
          children.push(kit.stroke(id + "__lg" + ly, [[x - ledgerHalf, ly], [x + ledgerHalf, ly]], { strokeWidth: 2.5, ms: MS.dot, color: ink }));
        }
        for (let ly = st.bottom + 5 * GAP; ly <= yHi + STEP; ly += GAP) {
          children.push(kit.stroke(id + "__lu" + ly, [[x - ledgerHalf, ly], [x + ledgerHalf, ly]], { strokeWidth: 2.5, ms: MS.dot, color: ink }));
        }
        // Stem up when the chord sits low on its staff; it starts at the
        // font's anchor on the outermost head and runs past the others.
        const up = (yLo + yHi) / 2 < MID_Y;
        const anchorY = up ? yLo : yHi;
        const span = (yHi - yLo) / GAP;
        const nt = M.note(value, [x, anchorY], GAP, { stem: up ? "up" : "down", stemLength: 3.5 + span });
        tok.pitches.forEach((p, k) => {
          const y = yOf(p);
          children.push(glyph(id + "__h" + k, y === anchorY ? nt.head : M.glyphCentered(M.headOf(value), [x, y], GAP), ink));
          if (p.includes("#")) children.push(glyph(id + "__acc" + k, M.glyphCentered("accidentalSharp", [x - headHalf - 0.9 * GAP, y], GAP), ink));
          // A dot sits in a space: a head on a line moves its dot up half a gap.
          const onLine = (diatOf(p) - st.ref) % 2 === 0;
          for (let d = 0; d < dots; d++) {
            children.push(glyph(id + "__dot" + k + "_" + d, M.glyphCentered("augmentationDot", [x + headHalf + (0.55 + d * 0.6) * GAP, y + (onLine ? STEP : 0)], GAP), ink));
          }
        });
        if (nt.stem) children.push(kit.stroke(id + "__stem", [nt.stem.from, nt.stem.to], { strokeWidth: stemW, ms: MS.dot, color: ink }));
        if (nt.flag) children.push(glyph(id + "__flag", nt.flag, ink));
        anchors[id] = [x, ys[0]];
        const marks = keyMarks(st.keyPrefix + i, tok.pitches);
        if (marks.length > 0) {
          push(kit.group(st.keyPrefix + i, marks));
          anchors[st.keyPrefix + i] = [500, 210];
        }
        if (wantLabels) {
          const labelY = st.bottom - 68;
          const name = tok.pitches.map((p) => p.replace(/\d/g, "")).join("-");
          push(kit.text(st.labelPrefix + i, [x, labelY], name, { fontSize: 18, color: C.guide }));
          anchors[st.labelPrefix + i] = [x, labelY];
          attached[id] = [st.labelPrefix + i];
        }
      }
      push(kit.group(id, children));

      beatsSoFar += tok.beats;
      // Bar lines follow the upper staff and, on a grand staff, run through both.
      if (st === staves[0] && timeTop > 0 && i < st.tokens.length - 1 && Math.abs(beatsSoFar % timeTop) < 1e-9) {
        const bx = grand ? xOf(0, beatsSoFar) - beatW / 2 : x + advance / 2;
        const bid = "bar_" + barCount++;
        const lowY = grand ? staves[1].bottom : st.bottom;
        push(kit.stroke(bid, [[bx, lowY], [bx, st.bottom + 4 * GAP]], { strokeWidth: 3, ms: MS.dot }));
        anchors[bid] = [bx, MID_Y];
      }
    });
  }

  if (typeof params.title === "string" && params.title.trim() !== "") {
    push(kit.text("title", [500, wantKeyboard ? 700 : 640], params.title, { fontSize: 30 }));
  }
  return { drawables, labels, anchors, order, attached };
---
template: piano_keys
title: Piano keyboard
version: 1
kit: 3
status: ready
interactions: [piano]
description: >-
  A piano keyboard (one or two octaves) with any set of keys highlighted —
  chords, scales, intervals — plus letter names on the white keys and an
  optional caption. Highlights get their own ids in the order given, so a
  chord can be revealed note by note, each paired with a `play` command
  sounding that note. Choose this scene for ANY request about a piano or
  keyboard, chords or scales shown on keys, intervals (octave, fifth,
  third), semitones and black keys, or why notes sound good together. For
  a whole MELODY with sheet music AND pressed keys together, use
  note_sheet with keyboard: true instead.
params:
  type: object
  properties:
    octaves:
      type: integer
      description: "1 (C4-B4) or 2 (C3-B4, the default)."
    highlight:
      type: array
      maxItems: 8
      items: { type: string }
      description: "Pitches to mark, e.g. [\"C4\", \"E4\", \"G4\"] — flats accepted (Db4 folds to C#4). Each gets its own id highlight_<i> in this order."
    labels:
      type: boolean
      description: "Letter names on the white keys (default true)."
    caption:
      type: string
      description: "Caption under the keyboard, e.g. \"C major = C + E + G\"."
    title:
      type: string
element_ids:
  keys: the keyboard itself (white then black keys, a group)
  labels: the white-key letter names (a group, when labels)
  highlight_<i>: the mark on highlight[i] (draw them one at a time to build a chord)
  caption: the caption text, when set
  title: figure title, when set
examples:
  - request: "Show a C major chord on the piano."
    params:
      highlight: ["C4", "E4", "G4"]
      caption: "C major = C + E + G"
      title: "The C major chord"
  - request: "Show an octave on the keyboard."
    params:
      octaves: 2
      highlight: ["C3", "C4"]
      caption: "One octave apart: double the frequency"
      title: "The octave"
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const octaves = params.octaves === 1 ? 1 : 2;
  const startOct = octaves === 1 ? 4 : 3;
  const rawHl = Array.isArray(params.highlight) ? params.highlight.slice(0, 8) : [];
  const wantLabels = params.labels !== false;

  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };

  const WHITE = ["C", "D", "E", "F", "G", "A", "B"];
  const HAS_SHARP = { C: true, D: true, E: false, F: true, G: true, A: true, B: false };
  const nWhite = octaves * 7;
  const KW = Math.min(60, 760 / nWhite);
  const X0 = (1000 - nWhite * KW) / 2;
  const Y_BOT = 250, Y_TOP = 520, BLACK_BOT = 370, BW = KW * 0.62;

  // key layout: white index i -> pitch; black keys sit between.
  const whitePitch = (i) => WHITE[i % 7] + String(startOct + Math.floor(i / 7));
  const whiteX = (i) => X0 + i * KW;

  const hasBlackAfter = (i) => i < nWhite - 1 && HAS_SHARP[WHITE[i % 7]];
  const keyChildren = [];
  // Cabinet frame around the whole keyboard, then the red felt hinge strip —
  // the two cues that make it read as a piano rather than a grid.
  keyChildren.push(kit.stroke("keys__frame", [[X0 - 9, Y_BOT - 9], [X0 + nWhite * KW + 9, Y_BOT - 9], [X0 + nWhite * KW + 9, Y_TOP + 17], [X0 - 9, Y_TOP + 17]], { closed: true, strokeWidth: 4, ms: MS.stroke }));
  keyChildren.push(kit.area("keys__felt", [[X0, Y_TOP], [X0 + nWhite * KW, Y_TOP], [X0 + nWhite * KW, Y_TOP + 8], [X0, Y_TOP + 8]], C.demand, { opacity: 0.75, precise: true }));
  for (let i = 0; i < nWhite; i++) {
    keyChildren.push(kit.stroke("key_w" + i, [[whiteX(i), Y_BOT], [whiteX(i) + KW, Y_BOT], [whiteX(i) + KW, Y_TOP], [whiteX(i), Y_TOP]], { closed: true, fill: C.paper, strokeWidth: 3, ms: 90 }));
  }
  for (let i = 0; i < nWhite; i++) {
    if (!hasBlackAfter(i)) continue;
    const bx = whiteX(i + 1) - BW / 2;
    // Solid ink body (a precise area — a stroke fill renders washed-out in
    // the sketchy style, the chess-piece lesson) under its own outline.
    keyChildren.push(kit.area("key_b" + i + "__f", [[bx, BLACK_BOT], [bx + BW, BLACK_BOT], [bx + BW, Y_TOP], [bx, Y_TOP]], C.ink, { opacity: 1, precise: true }));
    keyChildren.push(kit.stroke("key_b" + i, [[bx, BLACK_BOT], [bx + BW, BLACK_BOT], [bx + BW, Y_TOP], [bx, Y_TOP]], { closed: true, strokeWidth: 2.5, ms: 90 }));
  }
  push(kit.group("keys", keyChildren));
  anchors.keys = [500, (Y_BOT + Y_TOP) / 2];

  if (wantLabels) {
    const labelChildren = [];
    for (let i = 0; i < nWhite; i++) {
      labelChildren.push(kit.text("labels__" + i, [whiteX(i) + KW / 2, Y_BOT + 24], WHITE[i % 7], { fontSize: 19, color: C.guide }));
    }
    push(kit.group("labels", labelChildren));
    anchors.labels = [500, Y_BOT + 24];
  }

  // Highlights: normalize through the shared notation parser (folds flats).
  const HL_COLORS = [C.demand, C.supply, C.accent, C.shifted, C.region2, C.demand, C.supply, C.accent];
  rawHl.forEach((name, hi) => {
    if (typeof name !== "string") return;
    const tok = kit.parseNotes(name.trim())[0];
    if (!tok || tok.pitches.length === 0) return;
    const pitch = tok.pitches[0];
    const sharp = pitch.includes("#");
    const letter = pitch[0];
    const octave = Number(pitch[pitch.length - 1]);
    const wi = (octave - startOct) * 7 + WHITE.indexOf(letter);
    if (wi < 0 || wi >= nWhite) return;
    const id = "highlight_" + hi;
    const color = HL_COLORS[hi];
    if (sharp) {
      if (wi >= nWhite - 1) return;
      const bx = whiteX(wi + 1) - BW / 2;
      push(kit.group(id, [
        kit.area(id + "__f", [[bx + 3, BLACK_BOT + 3], [bx + BW - 3, BLACK_BOT + 3], [bx + BW - 3, Y_TOP - 3], [bx + 3, Y_TOP - 3]], color, { opacity: 0.85 }),
        kit.stroke(id + "__dot", kit.ellipse([bx + BW / 2, BLACK_BOT - 22], 9, 9, 14), { closed: true, fill: color, color, ms: MS.dot }),
      ]));
      anchors[id] = [bx + BW / 2, (BLACK_BOT + Y_TOP) / 2];
    } else {
      const x = whiteX(wi);
      // Pressed look: tint the WHOLE key — the wide lower part plus the
      // narrow upper section between its neighboring black keys.
      const upL = x + 3 + (wi > 0 && hasBlackAfter(wi - 1) ? BW / 2 : 0);
      const upR = x + KW - 3 - (hasBlackAfter(wi) ? BW / 2 : 0);
      push(kit.group(id, [
        kit.area(id + "__f", [[x + 3, Y_BOT + 3], [x + KW - 3, Y_BOT + 3], [x + KW - 3, BLACK_BOT - 2], [x + 3, BLACK_BOT - 2]], color, { opacity: 0.45 }),
        kit.area(id + "__fu", [[upL, BLACK_BOT - 2], [upR, BLACK_BOT - 2], [upR, Y_TOP - 3], [upL, Y_TOP - 3]], color, { opacity: 0.45 }),
        kit.stroke(id + "__dot", kit.ellipse([x + KW / 2, Y_BOT + 58], 9, 9, 14), { closed: true, fill: color, color, ms: MS.dot }),
      ]));
      anchors[id] = [x + KW / 2, Y_BOT + 58];
    }
  });

  if (typeof params.caption === "string" && params.caption.trim() !== "") {
    push(kit.text("caption", [500, 190], params.caption, { fontSize: 24 }));
    anchors.caption = [500, 190];
  }
  if (typeof params.title === "string" && params.title.trim() !== "") {
    push(kit.text("title", [500, 640], params.title, { fontSize: 30 }));
  }
  return { drawables, labels, anchors, order };
---
template: violin_anatomy
title: Violin parts (front view)
version: 1
kit: 1
status: ready
description: 'A front (top) view of a bowed string instrument with its named parts: scroll, pegbox and pegs, neck, fingerboard, four strings, f-holes, bridge, upper and lower bouts, waist (C-bout), tailpiece and chin rest, plus an optional bow standing beside it. Body proportions can be switched between violin/fiddle, viola and cello, labels can be limited to just the parts under discussion, translated (English, German, French, Spanish, Italian), and one part can be highlighted in accent ink. Choose this scene for any request about a violin, viola, cello or fiddle — ''label the parts of a violin'', ''where is the bridge / soundpost side / f-hole'', ''what does the tailpiece do'', ''draw a fiddle'', ''parts of a cello'' — or for explaining how a bowed string instrument makes sound while pointing at scroll, pegs, strings, bridge or bow.'
params:
  type: object
  properties:
    labels:
      type: array
      items:
        type: string
        enum:
          - scroll
          - pegs
          - neck
          - fingerboard
          - strings
          - f_holes
          - bridge
          - upper_bout
          - lower_bout
          - waist
          - tailpiece
          - chinrest
          - bow
      description: 'Which parts get name labels. Default: every body part except the bow. Pass a short list for a focused explanation.'
    language:
      type: string
      enum:
        - en
        - de
        - fr
        - es
        - it
      description: Language of the part labels (default 'en').
    instrument:
      type: string
      enum:
        - violin
        - fiddle
        - viola
        - cello
      description: 'Which member of the family: adjusts body width and neck length slightly (default ''violin''; ''fiddle'' is identical to violin).'
    bow:
      type: boolean
      description: Draw the bow standing beside the instrument (default true). Set false for a clean parts-of-the-body figure.
    strings:
      type: boolean
      description: Draw the four strings from tailpiece over the bridge to the pegs (default true).
    highlight:
      type: string
      enum:
        - scroll
        - pegs
        - neck
        - fingerboard
        - strings
        - f_holes
        - bridge
        - upper_bout
        - lower_bout
        - waist
        - tailpiece
        - chinrest
        - bow
        - body
      description: Draw this one part in accent ink and heavier stroke — use it when the narration is about a single part.
  additionalProperties: false
element_ids:
  body_fill / body / purfling: the body outline, its pale fill and the inner purfling line
  hi_lower_bout_r / hi_lower_bout_l / hi_upper_bout_r / hi_upper_bout_l / hi_waist_r / hi_waist_l: accent arcs drawn over the outline when a bout or the waist is highlighted
  neck: the neck sides plus the nut line at the top
  fingerboard_fill / fingerboard: the fingerboard lying on the neck and over the belly
  pegbox / pegbox_slot: the pegbox and its inner slot
  pegs: 'group: four peg shafts and heads'
  scroll: 'group: the scroll''s outer curve and its spiral'
  tailpiece_fill / tailpiece / tailgut: the tailpiece and the gut to the end button
  bridge: the bridge between the f-hole notches
  strings: 'group: the four strings'
  fholes: 'group: both f-holes with their eyes'
  chinrest / chinrest_clamp: the chin rest and its clamp
  bow: 'group: bow stick, hair, frog and tip'
  bridge_leader: thin guide from the bridge out to its label (only when bridge is labelled)
  label_scroll / label_pegs / label_neck / label_fingerboard / label_strings / label_f_holes / label_bridge / label_upper_bout / label_lower_bout / label_waist / label_tailpiece / label_chinrest / label_bow: the part name labels
examples:
  - request: Draw a violin and label its parts.
    params: {}
  - request: Show me the bridge and f-holes on a cello, in Italian, no bow.
    params:
      instrument: cello
      language: it
      labels:
        - bridge
        - f_holes
        - waist
      bow: false
      highlight: bridge
layout: |-
  const C=kit.COLORS,MS=kit.SKETCH_MS;
  const inst=params.instrument??"violin";
  const lang=params.language??"en";
  const drawBow=params.bow!==false;
  const drawStrings=params.strings!==false;
  const hi=params.highlight??null;
  const DEF=["scroll","pegs","neck","fingerboard","strings","f_holes","bridge","upper_bout","lower_bout","waist","tailpiece","chinrest"];
  const wanted=new Set(params.labels??DEF);
  const NAMES={en:{scroll:"Scroll",pegs:"Pegs",neck:"Neck",fingerboard:"Fingerboard",strings:"Strings",f_holes:"f-holes",bridge:"Bridge",upper_bout:"Upper bout",lower_bout:"Lower bout",waist:"Waist (C-bout)",tailpiece:"Tailpiece",chinrest:"Chin rest",bow:"Bow"},de:{scroll:"Schnecke",pegs:"Wirbel",neck:"Hals",fingerboard:"Griffbrett",strings:"Saiten",f_holes:"F-Löcher",bridge:"Steg",upper_bout:"Oberbügel",lower_bout:"Unterbügel",waist:"Mittelbügel",tailpiece:"Saitenhalter",chinrest:"Kinnhalter",bow:"Bogen"},fr:{scroll:"Volute",pegs:"Chevilles",neck:"Manche",fingerboard:"Touche",strings:"Cordes",f_holes:"Ouïes",bridge:"Chevalet",upper_bout:"Courbe sup.",lower_bout:"Courbe inf.",waist:"Échancrure",tailpiece:"Cordier",chinrest:"Mentonnière",bow:"Archet"},es:{scroll:"Voluta",pegs:"Clavijas",neck:"Mástil",fingerboard:"Diapasón",strings:"Cuerdas",f_holes:"Efes",bridge:"Puente",upper_bout:"Curva superior",lower_bout:"Curva inferior",waist:"Cintura",tailpiece:"Cordal",chinrest:"Barbada",bow:"Arco"},it:{scroll:"Riccio",pegs:"Piroli",neck:"Manico",fingerboard:"Tastiera",strings:"Corde",f_holes:"Effe",bridge:"Ponticello",upper_bout:"Curva superiore",lower_bout:"Curva inferiore",waist:"Vita",tailpiece:"Cordiera",chinrest:"Mentoniera",bow:"Archetto"}};
  const T=NAMES[lang]||NAMES.en;
  const drawables=[],labels=[],anchors={},order=[];
  const push=(d)=>{drawables.push(d);order.push(d.id);};
  const isHi=(p)=>hi===p;
  const ink=(p)=>isHi(p)?C.accent:C.ink;
  const wd=(p,w)=>isHi(p)?w+2:w;
  const lab=(p,a,side)=>{anchors[p]=a;if(!wanted.has(p))return;const t=T[p]||p;labels.push(kit.label("label_"+p,a,side,t,{color:isHi(p)?C.accent:C.ink,fontSize:t.length>13?22:25}));order.push("label_"+p);};
  const prof=inst==="cello"?{bw:1.12,nl:0.8}:inst==="viola"?{bw:1.06,nl:0.94}:{bw:1,nl:1};
  const cx=400,yB=76,yT=430,sf=prof.nl;
  const W=(w)=>w*prof.bw;
  const right=[[30,82],[80,96],[118,122],[132,162],[124,200],[96,234],[74,256],[88,278],[108,306],[112,344],[98,386],[60,416],[26,429]];
  const ring=[[cx,yB]];
  for(const p of right)ring.push([cx+W(p[0]),p[1]]);
  ring.push([cx,yT+4]);
  for(let i=right.length-1;i>=0;i--)ring.push([cx-W(right[i][0]),right[i][1]]);
  const body=kit.smoothClosed(ring,4);
  const mid=(yB+yT)/2;
  push(kit.area("body_fill",body,C.region1,{opacity:0.13}));
  push(kit.stroke("body",body,{closed:true,color:ink("body"),strokeWidth:wd("body",4.5),roughness:0.8,ms:MS.curve}));
  push(kit.stroke("purfling",body.map((p)=>[cx+(p[0]-cx)*0.955,mid+(p[1]-mid)*0.965]),{closed:true,color:C.guide,strokeWidth:1.6,ms:MS.guides}));
  anchors.body=[cx,mid];
  const boutArc=(part,j0,j1)=>{if(!isHi(part))return;for(const s of [1,-1]){const pts=[];for(let j=j0;j<=j1;j++)pts.push([cx+s*W(right[j][0]),right[j][1]]);push(kit.stroke("hi_"+part+(s>0?"_r":"_l"),kit.smooth(pts,6),{color:C.accent,strokeWidth:6,ms:MS.curve}));}};
  boutArc("lower_bout",1,5);boutArc("upper_bout",7,11);boutArc("waist",5,7);
  lab("upper_bout",[cx+W(112),344],"right");
  lab("lower_bout",[cx-W(132),162],"left");
  lab("waist",[cx-W(74)-4,256],"left");
  const nutY=yT+125*prof.nl,pegLen=88*prof.nl,pegTop=nutY+pegLen;
  push(kit.stroke("neck",[[cx-33,yT-6],[cx-27,nutY],[cx+27,nutY],[cx+33,yT-6]],{color:ink("neck"),strokeWidth:wd("neck",3.5),ms:MS.stroke}));
  lab("neck",[cx+30,yT+66*prof.nl],"right");
  push(kit.stroke("pegbox",kit.smooth([[cx-27,nutY+4],[cx-31,nutY+pegLen*0.5],[cx-25,pegTop-2],[cx+25,pegTop-2],[cx+31,nutY+pegLen*0.5],[cx+27,nutY+4]],8),{color:C.ink,strokeWidth:3.5,ms:MS.stroke}));
  push(kit.stroke("pegbox_slot",kit.smooth([[cx-14,nutY+12],[cx-17,nutY+pegLen*0.55],[cx-11,pegTop-12],[cx+11,pegTop-12],[cx+17,nutY+pegLen*0.55],[cx+14,nutY+12]],6),{color:C.guide,strokeWidth:1.8,ms:MS.guides}));
  const pegDefs=[[-1,0.24],[1,0.42],[-1,0.62],[1,0.82]];
  const pegKids=[];
  pegDefs.forEach((d,i)=>{const s=d[0],y=nutY+pegLen*d[1];pegKids.push(kit.stroke("peg_shaft_"+i,[[cx+s*27,y],[cx+s*54,y]],{color:ink("pegs"),strokeWidth:wd("pegs",3.5),ms:MS.stroke}));pegKids.push(kit.stroke("peg_head_"+i,kit.ellipse([cx+s*62,y],9,14,20),{closed:true,color:ink("pegs"),strokeWidth:wd("pegs",3),ms:MS.node}));});
  push(kit.group("pegs",pegKids));
  lab("pegs",[cx-72,nutY+pegLen*0.62],"left");
  const back=kit.smooth([[cx-25,pegTop-4],[cx-30,pegTop+18*sf],[cx-16,pegTop+42*sf],[cx+12,pegTop+46*sf],[cx+30,pegTop+30*sf],[cx+30,pegTop+8*sf]],8);
  const spir=[];
  for(let i=0;i<=60;i++){const t=i/60;const a=-0.17*Math.PI+t*2.6*Math.PI;const r=(31-26*t)*sf;spir.push([cx+3+r*Math.cos(a),pegTop+24*sf+r*Math.sin(a)]);}
  push(kit.group("scroll",[kit.stroke("scroll_back",back,{color:ink("scroll"),strokeWidth:wd("scroll",3.5),ms:MS.curve}),kit.stroke("scroll_spiral",spir,{color:ink("scroll"),strokeWidth:wd("scroll",2.8),ms:MS.curve})]));
  lab("scroll",[cx,pegTop+48*sf],"above");
  const fb=[[cx-15,nutY-2],[cx-25,264],[cx+25,264],[cx+15,nutY-2]];
  push(kit.area("fingerboard_fill",fb,C.ink,{opacity:0.28}));
  push(kit.stroke("fingerboard",fb,{closed:true,color:ink("fingerboard"),strokeWidth:wd("fingerboard",3),ms:MS.stroke}));
  lab("fingerboard",[cx-40,500],"left");
  const tp=kit.smooth([[cx-10,100],[cx-21,148],[cx-23,172],[cx+23,172],[cx+21,148],[cx+10,100]],6);
  push(kit.area("tailpiece_fill",tp,C.ink,{opacity:0.2}));
  push(kit.stroke("tailpiece",tp,{closed:true,color:ink("tailpiece"),strokeWidth:wd("tailpiece",3),ms:MS.stroke}));
  push(kit.stroke("tailgut",[[cx,100],[cx,84]],{color:C.guide,strokeWidth:2.5,ms:MS.guides}));
  lab("tailpiece",[cx+24,130],"right");
  push(kit.stroke("bridge",kit.smooth([[cx-34,228],[cx-27,248],[cx-12,242],[cx,250],[cx+12,242],[cx+27,248],[cx+34,228]],4),{color:ink("bridge"),strokeWidth:wd("bridge",3.5),ms:MS.stroke}));
  if(wanted.has("bridge"))push(kit.stroke("bridge_leader",[[cx+36,236],[cx+W(96)+20,236]],{color:C.guide,strokeWidth:1.5,ms:MS.guides}));lab("bridge",[cx+W(96)+22,236],"right");anchors.bridge=[cx,240];
  if(drawStrings){const kids=[];for(let i=0;i<4;i++){const f=(i-1.5)/1.5,pd=pegDefs[i],py=nutY+pegLen*pd[1];kids.push(kit.stroke("string_"+i,[[cx+f*14,150],[cx+f*21,242],[cx+f*10,nutY+1],[cx+pd[0]*10,py]],{color:ink("strings"),strokeWidth:wd("strings",2),ms:MS.stroke}));}push(kit.group("strings",kids));}
  lab("strings",[cx+18,400],"right");
  const fkids=[];
  for(const s of [1,-1]){const tag=s>0?"r":"l";const fx=cx+s*W(56),fy=252;fkids.push(kit.stroke("fhole_"+tag,kit.smooth([[fx+s*9,fy+37],[fx+s*1,fy+27],[fx-s*5,fy+10],[fx+s*5,fy-10],[fx-s*1,fy-27],[fx-s*9,fy-37]],8),{color:ink("f_holes"),strokeWidth:wd("f_holes",3),ms:MS.curve}));fkids.push(kit.stroke("fhole_eye_top_"+tag,kit.ellipse([fx+s*11,fy+40],6,6,14),{closed:true,color:ink("f_holes"),strokeWidth:2,ms:MS.dot}));fkids.push(kit.stroke("fhole_eye_bot_"+tag,kit.ellipse([fx-s*11,fy-40],8,8,16),{closed:true,color:ink("f_holes"),strokeWidth:2,ms:MS.dot}));}
  push(kit.group("fholes",fkids));
  lab("f_holes",[cx-W(56)-12,290],"left");
  const chc=[cx-W(80),126];
  push(kit.stroke("chinrest",kit.blob(chc,48,30,0.05,2),{closed:true,color:ink("chinrest"),strokeWidth:wd("chinrest",3),ms:MS.node}));
  push(kit.stroke("chinrest_clamp",[[chc[0]+22,chc[1]+22],[chc[0]+30,chc[1]+2]],{color:C.guide,strokeWidth:2,ms:MS.guides}));
  lab("chinrest",[chc[0]-44,122],"left");
  if(drawBow){const kids=[];kids.push(kit.stroke("bow_stick",kit.smooth([[884,110],[876,250],[866,400],[852,545],[834,676]],8),{color:ink("bow"),strokeWidth:wd("bow",4),ms:MS.curve}));kids.push(kit.stroke("bow_hair",[[880,118],[830,668]],{color:C.guide,strokeWidth:2,ms:MS.stroke}));kids.push(kit.stroke("bow_frog",[[878,100],[896,108],[888,134],[870,126]],{closed:true,color:ink("bow"),strokeWidth:2.5,ms:MS.stroke}));kids.push(kit.stroke("bow_tip",[[822,656],[840,664],[834,688],[818,680]],{closed:true,color:ink("bow"),strokeWidth:2.5,ms:MS.stroke}));push(kit.group("bow",kids));lab("bow",[858,400],"left");}
  return {drawables,labels,anchors,order};
