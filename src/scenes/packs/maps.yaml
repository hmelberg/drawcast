pack: maps
title: Maps
description: "Hand-sketched world maps: country outlines, highlights and labeled markers."
---
template: world_map
title: World map (country outlines)
version: 1
kit: 2
status: ready
engines: [geo]
description: >-
  A hand-sketched map drawn from real country boundaries via the geo engine
  (Natural Earth outlines, d3-geo projected): the whole world, or a small set
  of named countries cropped to fill the frame. Choose this scene for ANY
  request to draw or name a map, a country, a region, the world, geography, a
  continent (Europe, Africa, Asia...), a group of countries (the Nordics,
  the EU, Scandinavia...), or to outline, locate, highlight or mark a place
  on a map. `focus` narrows the map to just the named countries; omit it for
  a whole-world outline. `highlight` shades one or more of the drawn
  countries; `markers` drops a labeled dot at a country's centroid (e.g. a
  capital city). An unrecognized country name is skipped and listed in a
  small "Unknown: ..." note rather than failing the whole figure.
params:
  type: object
  properties:
    focus:
      type: array
      items: { type: string }
      description: "Country names to draw, cropped to fill the frame (matched case-insensitively against the dataset's own English names, e.g. \"Norway\"). Omit for the whole world."
    highlight:
      type: array
      items: { type: string }
      description: "Subset of the drawn countries (world or focus) to shade with a low-opacity area fill — call attention to one or more countries. A real country name that wasn't drawn (e.g. not in `focus`) is skipped, not filled without an outline, and listed in missing_note as \"Not drawn: ...\"."
    markers:
      type: array
      items:
        type: object
        properties:
          country: { type: string, description: "A drawn or known country name — the dot lands on its centroid." }
          label: { type: string, description: "Text next to the dot, e.g. a capital city. Defaults to the country name." }
        required: [country]
      description: "A small dot at each country's centroid, with a label. In focus mode the map is cropped to `focus`+`highlight` only — a marker country far outside that view (e.g. a Japan marker on a Nordics map) is skipped rather than drawn at an implausible off-frame point, and listed in missing_note as \"Outside view: ...\"."
    title:
      type: string
element_ids:
  country_<slug>: a drawn country's outline (one group of ring strokes per country; slug = the dataset's own name, lowercased, non-alphanumeric runs -> "_")
  hl_<slug>: a highlighted country's low-opacity area fill (its outer ring)
  marker_<i>: a small dot at markers[i]'s country centroid, absent when that marker is unresolved or outside the cropped view
  marker_label_<i>: markers[i]'s label, absent under the same conditions as marker_<i>
  graticule: a light frame around the map, present in focus mode only
  missing_note: "small guide text listing unrecognized country names (\"Unknown: X, Y\"), real-but-not-drawn highlight names (\"Not drawn: X, Y\"), and/or marker countries outside the cropped view (\"Outside view: X, Y\"), present only when there are any"
  title: figure title, when set
examples:
  - request: "Draw a world map."
    params: {}
  - request: "Show France, Germany and Spain on a map."
    params: { focus: ["France", "Germany", "Spain"], highlight: ["France"] }
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;

  // Fit box: 880x560 at (60,120) inside the 1000x750 canvas, leaving room
  // above for a title and below for a small "Unknown: ..." note.
  const FIT = { x: 60, y: 120, w: 880, h: 560 };
  const off = (p) => [p[0] + FIT.x, p[1] + FIT.y];

  // Deterministic id fragment from the DATASET's own country name (never the
  // caller's casing) — same country always gets the same id, whichever mode
  // drew it and however the caller spelled the request.
  function slug(name) {
    return String(name).toLowerCase().replace(/[^a-z0-9]+/g, "_");
  }

  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };

  const focusRaw = (Array.isArray(params.focus) ? params.focus : []).filter((n) => typeof n === "string" && n.trim() !== "");
  const isFocus = focusRaw.length > 0;
  const highlightRaw = (Array.isArray(params.highlight) ? params.highlight : []).filter((n) => typeof n === "string" && n.trim() !== "");
  const markersInput = Array.isArray(params.markers) ? params.markers : [];
  const markerCountries = markersInput
    .filter((m) => m && typeof m.country === "string" && m.country.trim() !== "")
    .map((m) => m.country);

  // ONE engine call: "all" for the whole world, or every name any part of
  // this request could need a shape/centroid for (focus + highlight +
  // marker countries) — the engine dedupes case-insensitively on its own.
  // `fitNames` restricts what the PROJECTION is fit to (focus + highlight —
  // highlight is documented as always a subset of the drawn countries) so a
  // `markers`-only country far from the focus set (e.g. a Japan marker on a
  // Nordics map) still gets a resolvable centroid without dragging the fit
  // box out to include it and shrinking everything else back down — the
  // exact "world_map draws tiny" bug, reproduced for markers instead of
  // focus. Ignored by the engine in world mode.
  const requestNames = isFocus ? [...focusRaw, ...highlightRaw, ...markerCountries] : "all";
  const fitNames = [...focusRaw, ...highlightRaw];
  const { shapes, missing, centroids } = engines.geo.countries(requestNames, { w: FIT.w, h: FIT.h, fitNames });

  // Map accuracy is a later phase (see ROADMAP) — for now, every drawn ring
  // is run through kit.smooth (Catmull-Rom) before stroking, in BOTH world
  // and focus modes, so a country's corners round pleasantly instead of
  // reading as a raw polygon. Two knobs keep the point count sane across a
  // whole-world render (~250+ rings): SMOOTH_MAX_RING skips a ring that's
  // already dense enough to look smooth on its own (Canada/Russia/Antarctica
  // etc. at 110m resolution top out around 200-550 points — smoothing those
  // further buys nothing visible for a lot more path data), and
  // SMOOTH_SAMPLES (kit.smooth's own `per` — samples generated PER INPUT
  // SEGMENT) is 4, the low end of a "4-6 looks pleasant" range, chosen
  // because it's applied across every ring at once rather than to one
  // hand-picked shape. Measured against the real dataset: world mode goes
  // from ~10.4k raw points (already capped at >=8pt rings, below) to ~33k
  // smoothed — a real but bounded cost, not an unbounded blow-up. Applied to
  // the RAW ring (before the `off()` translate into FIT-box coordinates) —
  // translation doesn't change point count or spline shape, only where it
  // ultimately sits, so this order is just simpler to read.
  //
  // Known limitation (acceptable for a "smooth now" pass): kit.smooth treats
  // its input as an OPEN curve (it clamps by duplicating the first/last
  // points, rather than wrapping around) — a ring is actually CLOSED (the
  // engine repeats the first point as the last, world-atlas convention; the
  // stroke itself is closed via SVG "Z"), so the seam where the ring
  // "starts" gets one un-smoothed corner rather than a fully periodic
  // round-trip. At one corner out of a whole country's outline this reads as
  // negligible; a truly periodic Catmull-Rom would need a new kit.ts
  // primitive, out of scope for a smoothing pass that's explicitly a
  // placeholder ahead of the accuracy upgrade.
  const SMOOTH_MAX_RING = 120;
  const SMOOTH_SAMPLES = 4;
  // Catmull-Rom can overshoot the convex hull of its control points — usually
  // invisible mid-ring, but world mode's projection is fit flush to the FULL
  // [0,FIT.w]x[0,FIT.h] box with no margin (unlike focus mode's fitExtent,
  // which already pads ~4%), so a ring vertex right at the world's own edge
  // (Antarctica's southern rim, the antimeridian seam) can overshoot a hair
  // past 0 or FIT.w/FIT.h. Clamped back into the fit box after smoothing —
  // this only ever touches the rare overshoot vertex, not the shape's
  // general roundness.
  function smoothRing(ring) {
    const sm = ring.length >= 4 && ring.length <= SMOOTH_MAX_RING ? kit.smooth(ring, SMOOTH_SAMPLES) : ring;
    return sm.map(([x, y]) => [Math.max(0, Math.min(FIT.w, x)), Math.max(0, Math.min(FIT.h, y))]);
  }
  // Memoized per shape (by dataset name) so the country-outline loop and the
  // highlight loop below draw from the EXACT SAME smoothed geometry — a
  // highlight fill must trace its country's own outline, not a separately
  // (and possibly differently) smoothed copy of it, or the fill would show
  // as a halo mismatch against the stroke.
  const smoothedRingsCache = new Map();
  function smoothedRings(shape) {
    const key = shape.name.toLowerCase();
    let sm = smoothedRingsCache.get(key);
    if (!sm) {
      sm = shape.rings.map(smoothRing);
      smoothedRingsCache.set(key, sm);
    }
    return sm;
  }

  function findShape(name) {
    const key = name.toLowerCase();
    return shapes.find((s) => s.name.toLowerCase() === key);
  }

  // Every name this request could not resolve, in first-seen order,
  // deduped case-insensitively — world mode never gets a `missing` entry
  // from the engine itself (it always asks for "all"), so highlight/marker
  // names are checked by hand against what "all" actually returned.
  const unknown = new Map(); // lowercase -> first-seen original casing
  const noteUnknown = (name) => {
    const key = name.toLowerCase();
    if (!unknown.has(key)) unknown.set(key, name);
  };
  missing.forEach(noteUnknown);
  if (!isFocus) {
    for (const name of [...highlightRaw, ...markerCountries]) {
      if (!findShape(name)) noteUnknown(name);
    }
  }

  // Focus mode: a light frame marks the crop, since only a few countries
  // float in an otherwise-empty box with no world context around them.
  if (isFocus) {
    const fx0 = FIT.x, fy0 = FIT.y, fx1 = FIT.x + FIT.w, fy1 = FIT.y + FIT.h;
    push(kit.stroke("graticule", [[fx0, fy0], [fx1, fy0], [fx1, fy1], [fx0, fy1]], {
      closed: true, color: C.guide, strokeWidth: 1.5, dash: true, ms: MS.guides,
    }));
  }

  // Country outlines. Iterate `shapes` (the engine's own dataset order) so
  // ids and draw order never depend on how the caller listed names.
  // `drawnKeys` is the ground truth for "actually has an outline on this
  // figure" — used below so `highlight` never shades a country with no
  // outline of its own (a floating tint): a real country that fails EITHER
  // the focus filter OR (world mode) the ring-size cap is "not drawn", not
  // silently filled anyway.
  const focusKeys = new Set(focusRaw.map((n) => n.toLowerCase()));
  const drawnKeys = new Set();
  for (const shape of shapes) {
    if (isFocus && !focusKeys.has(shape.name.toLowerCase())) continue; // requested only for its centroid (highlight/marker), not drawn
    const smoothed = smoothedRings(shape); // one smoothed ring per RAW ring, same order/count
    // The size cap (world mode only) is measured on the RAW ring — a
    // sliver's raw point count is what makes it visually insignificant, not
    // however many points smoothing happens to expand it to.
    const rings = isFocus ? smoothed : shape.rings.map((r, i) => (r.length >= 8 ? smoothed[i] : null)).filter((r) => r !== null); // world mode: drop slivers, keep the drawable count sane
    if (rings.length === 0) continue;
    const id = "country_" + slug(shape.name);
    const children = rings.map((ring, i) =>
      kit.stroke(id + "__ring" + i, ring.map(off), {
        closed: true,
        color: isFocus ? C.ink : C.guide,
        strokeWidth: isFocus ? 3.5 : 1.5,
        ms: isFocus ? MS.stroke : MS.guides,
      }),
    );
    push(kit.group(id, children));
    drawnKeys.add(shape.name.toLowerCase());
    const c = centroids[shape.name];
    if (c) anchors[id] = off(c);
  }

  // Every real country named in `highlight` that isn't in `drawnKeys` —
  // recognized, but not on this figure. Reported separately from `unknown`
  // (which is names the dataset itself doesn't recognize at all).
  const notDrawn = new Map(); // lowercase -> first-seen original casing
  const noteNotDrawn = (name) => {
    const key = name.toLowerCase();
    if (!notDrawn.has(key)) notDrawn.set(key, name);
  };

  // Highlights: subset of the DRAWN countries only, shaded with a
  // low-opacity area fill over the shape's outer ring. Deduped
  // case-insensitively. `markers` deliberately has no such restriction —
  // its own params doc says "a drawn OR known country name" — a marker on
  // a country whose outline isn't shown is a normal, intended use (e.g. a
  // capital called out without drawing its whole country).
  const seenHl = new Set();
  for (const name of highlightRaw) {
    const key = name.toLowerCase();
    if (seenHl.has(key)) continue;
    seenHl.add(key);
    const shape = findShape(name);
    if (!shape) continue; // unrecognized — already recorded in `unknown` above
    if (!drawnKeys.has(shape.name.toLowerCase())) {
      noteNotDrawn(name);
      continue;
    }
    const id = "hl_" + slug(shape.name);
    // The SAME smoothed ring the outline loop above drew (memoized in
    // smoothedRings) — never a separately-smoothed copy, or the fill would
    // trace slightly different geometry than its own outline (a halo).
    push(kit.area(id, smoothedRings(shape)[0].map(off), C.region2, { opacity: 0.3 }));
    const c = centroids[shape.name];
    if (c) anchors[id] = off(c);
  }

  // Every marker country whose centroid resolved but landed outside the
  // fit box — the engine still projects it (using the SAME projection as
  // everything else, fit to focus+highlight only — see fitNames above), so
  // a country nowhere near the focus set (a Japan marker on a Nordics map)
  // comes back at wildly off-frame coordinates rather than a plausible
  // on-canvas point. Drawing it would either silently clip or, worse, land
  // it somewhere arbitrary-looking inside the frame; skipping it and
  // saying so is the honest outcome — the same "point at a note, don't
  // fake a picture" treatment as `unknown`/`notDrawn` above.
  const outside = new Map(); // lowercase -> first-seen original casing
  const noteOutside = (name) => {
    const key = name.toLowerCase();
    if (!outside.has(key)) outside.set(key, name);
  };

  // Markers: a small diamond dot at the country's centroid plus a label
  // (defaults to the country name), placed by the label solver so it steps
  // around other labels/strokes. Index tracks markersInput directly so a
  // caller can always predict marker_<i> / marker_label_<i> from its own
  // markers array position — a skipped (unresolved or out-of-view) marker
  // simply leaves that index's ids absent, same as an unresolved one today.
  markersInput.forEach((m, i) => {
    if (!m || typeof m.country !== "string" || m.country.trim() === "") return;
    const shape = findShape(m.country);
    const c = shape && centroids[shape.name];
    if (!c) return; // unresolved — already recorded in `unknown` above
    if (c[0] < 0 || c[0] > FIT.w || c[1] < 0 || c[1] > FIT.h) {
      noteOutside(shape.name);
      return;
    }
    const pos = off(c);
    const dotId = "marker_" + i;
    push(kit.stroke(dotId, kit.polygon(pos, 7, 4, Math.PI / 4), {
      closed: true, color: C.accent, fill: C.accent, strokeWidth: 2, ms: MS.dot,
    }));
    anchors[dotId] = pos;
    const text = typeof m.label === "string" && m.label.trim() !== "" ? m.label : shape.name;
    const labelId = "marker_label_" + i;
    // fontSize 16, not 20: a focus-mode map (Fix: geo engine fit) now fills
    // the frame instead of floating at world scale, so several capital
    // labels in a tight regional cluster (e.g. the Nordics) sit close
    // enough together and to neighboring borders that a smaller label
    // footprint is what keeps them clean — the antimeridian rotation fix
    // (centering the projection on the selection's own centroid longitude)
    // shifts coordinates enough that 18 alone wasn't always enough margin
    // either. 16 still sits safely above the font-floor (14) for legibility.
    labels.push(kit.label(labelId, pos, "above", text, { color: C.accent, fontSize: 16 }));
    order.push(labelId);
  });

  // Unrecognized, real-but-not-drawn, and off-frame marker names: there is
  // no dedicated warning channel in a scene layout, so all three surface as
  // a small on-canvas note instead of vanishing (unrecognized), silently
  // filling with no outline (not drawn — see the highlight loop above), or
  // landing at an implausible off-frame point (outside view — see the
  // markers loop above).
  const noteParts = [];
  if (unknown.size > 0) noteParts.push("Unknown: " + [...unknown.values()].join(", "));
  if (notDrawn.size > 0) noteParts.push("Not drawn: " + [...notDrawn.values()].join(", "));
  if (outside.size > 0) noteParts.push("Outside view: " + [...outside.values()].join(", "));
  if (noteParts.length > 0) {
    push(kit.text("missing_note", [500, 40], noteParts.join("  —  "), {
      fontSize: 18, color: C.guide,
    }));
  }

  if (typeof params.title === "string" && params.title.trim() !== "") {
    push(kit.text("title", [500, 715], params.title, { fontSize: 30 }));
  }

  return { drawables, labels, anchors, order };
