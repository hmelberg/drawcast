pack: evidence
title: Evidence & epidemiology
description: Survival curves, forest plots, causal DAGs, epidemic compartments and distribution curves — the figures of clinical and epidemiological papers.
---
template: survival_curve
title: Survival curve (Kaplan-Meier)
version: 2
kit: 4
status: ready
accepts_data: true
description: >-
  A Kaplan-Meier survival curve: one to three right-continuous step functions
  (the classic KM staircase — a flat segment at the current survival
  proportion, then a vertical drop at each event time), optional censoring
  tick marks on the flat segments, and dashed median-survival guides where
  each arm's curve crosses 50% survival. Choose this scene for ANY request
  about survival analysis, Kaplan-Meier curves, a survival curve, time-to-
  event data, censoring, median survival, or comparing survival between
  treatment arms or groups. Each arm's `survival` list takes typed numbers or
  a code element's variable via a "{id.var}" token — the Kaplan-Meier
  estimate a script actually computed. Entry i sits at time i × `time_step`
  (default 1, so [1, .9, .8] at 0, 1, 2); both axes draw tick numbers. TYPE every arm's `label` by hand: the
  typed names are what keep the arm_i beats alive before the script has run,
  and an arm still waiting for its numbers draws flat at 100 % survival with
  no median guide, never an invented staircase.
params:
  type: object
  properties:
    arms:
      type: array
      minItems: 1
      maxItems: 3
      items:
        type: object
        properties:
          label:
            type: string
          color:
            type: string
            enum: [supply, demand, accent]
            description: "Optional; default cycles demand, supply, accent by arm order."
          survival:
            type: array
            items: { type: number }
            description: "Survival proportions (0-1) at times 0, time_step, 2×time_step, …; non-increasing; the first SHOULD be 1.0 (everyone alive at t=0)."
        required: [label, survival]
      description: "One to three survival arms to compare."
    time_label:
      type: string
      description: "The time axis name and unit. Default \"Months\"."
    time_step:
      type: number
      description: "Time between successive survival entries (default 1), e.g. 6 for survival at 0, 6, 12, … months."
    time_ticks:
      type: array
      items: { type: number }
      description: "Extra labelled ticks at these times (e.g. [12, 16]), beside the automatic ones."
    survival_ticks:
      type: array
      items: { type: number }
      description: "Extra labelled ticks at these proportions (e.g. [0.25]); 0, 50% and 100% are always drawn."
    censor_ticks:
      type: array
      items:
        type: object
        properties:
          arm: { type: integer, description: "Index into `arms`." }
          at: { type: integer, description: "Index into that arm's survival array (time at × time_step) where a subject was censored." }
        required: [arm, at]
      description: "Small tick marks on an arm's flat segment marking a censored observation."
    show_median:
      type: boolean
      description: "Show dashed guides at 50% survival down to each arm's median crossing (default true)."
    title:
      type: string
element_ids:
  axes: the coordinate axes (one group with both axis lines, their tick numbers and captions)
  arm_<i>: the right-continuous step-function curve for arms[i]
  arm_label_<i>: its label
  median_line: dashed guides at 50% survival to each arm's median crossing, present when show_median and at least one arm crosses 50%
  censor_<i>: tick mark for censor_ticks[i]
  title: figure title, when set
examples:
  - request: "Draw a Kaplan-Meier survival curve comparing two treatment arms."
    params:
      arms:
        - { label: "Treatment", survival: [1, 0.92, 0.8, 0.68, 0.6, 0.55] }
        - { label: "Control", survival: [1, 0.85, 0.62, 0.45, 0.32, 0.25] }
  - request: "Show a survival curve with censored patients marked."
    params:
      arms:
        - { label: "Cohort", survival: [1, 0.95, 0.88, 0.8, 0.8, 0.7] }
      censor_ticks: [{ arm: 0, at: 3 }, { arm: 0, at: 4 }]
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const ARM_COLORS = ["demand", "supply", "accent"];
  const armsRaw = Array.isArray(params.arms) ? params.arms.slice(0, 3) : [];
  const arms = armsRaw.length > 0 ? armsRaw : [{ label: "Arm 1", survival: [1, 0.9, 0.75, 0.6, 0.5, 0.4] }];
  const timeLabel = typeof params.time_label === "string" && params.time_label.trim() !== "" ? params.time_label : "Months";
  const showMedian = params.show_median !== false;
  const step = typeof params.time_step === "number" && params.time_step > 0 && Number.isFinite(params.time_step) ? params.time_step : 1;
  // Sizes are written against the page's 26-unit base; the page's
  // text.font_size scales them all at render time.
  const TICK_SIZE = 20, ARM_SIZE = 24;

  const plot = { x0: 120, y0: 110, x1: 930, y1: 630 };
  const maxLen = Math.max(2, ...arms.map((a) => (Array.isArray(a.survival) ? a.survival.length : 0)));
  const xDomainMax = maxLen - 1;
  const tMax = xDomainMax * step;
  const sx = (i) => plot.x0 + (i / xDomainMax) * (plot.x1 - plot.x0);
  const tx = (t) => plot.x0 + (t / tMax) * (plot.x1 - plot.x0);
  const sy = (v) => plot.y0 + Math.max(0, Math.min(1, v)) * (plot.y1 - plot.y0);

  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  const label = (id, anchor, side, text, color, fontSize) => {
    labels.push(kit.label(id, anchor, side, text, { color, fontSize }));
    order.push(id);
  };

  const axesChildren = [
    kit.stroke("axes__x", [[plot.x0 - 6, plot.y0], [plot.x1 + kit.AXIS_OVERHANG, plot.y0]], { arrowhead: "end", strokeWidth: 4, ms: MS.axis }),
    kit.stroke("axes__y", [[plot.x0, plot.y0 - 6], [plot.x0, plot.y1 + kit.AXIS_OVERHANG]], { arrowhead: "end", strokeWidth: 4, ms: MS.axis }),
    // The caption drops below the row of tick numbers.
    kit.axisLabel("axes__x_label", "x", { ...plot, y0: plot.y0 - 8 }, timeLabel, { fontSize: 26, captionDrop: true }),
    kit.axisLabel("axes__y_label", "y", plot, "Survival", { fontSize: 26 }),
  ];
  // Tick numbers. Time: at entry times, every k-th entry so at most ten
  // show — by multiples, so a label never reads 2.9999999999999996.
  // Survival: 0, 50 %, 100 %.
  const finiteIn = (v, lo, hi) => typeof v === "number" && Number.isFinite(v) && v >= lo - 1e-9 && v <= hi + 1e-9;
  const k = [1, 2, 3, 4, 5, 6, 10, 12, 20, 24, 50, 100].find((n) => xDomainMax / n <= 10) || Math.ceil(xDomainMax / 10);
  const tStep = step * k;
  const timeTicks = [];
  for (let m = 0; m * tStep <= tMax + 1e-9 && m < 24; m++) timeTicks.push(m * tStep);
  (Array.isArray(params.time_ticks) ? params.time_ticks : []).slice(0, 8).forEach((t) => {
    if (finiteIn(t, 0, tMax) && !timeTicks.some((u) => Math.abs(tx(u) - tx(t)) < 1)) timeTicks.push(t);
  });
  const survTicks = [0, 0.5, 1];
  (Array.isArray(params.survival_ticks) ? params.survival_ticks : []).slice(0, 8).forEach((v) => {
    if (finiteIn(v, 0, 1) && !survTicks.some((u) => Math.abs(u - v) < 1e-6)) survTicks.push(v);
  });
  const trim = (v) => Math.round(v * 1000) / 1000;
  const fmtT = (t) => kit.num(trim(t));
  const fmtS = (v) => kit.num(trim(v * 100)) + "%";
  timeTicks.forEach((t, q) => {
    const x = tx(t);
    axesChildren.push(kit.stroke("axes__xt" + q, [[x, plot.y0], [x, plot.y0 - 8]], { color: C.guide, strokeWidth: 2, ms: MS.stroke }));
    axesChildren.push(kit.text("axes__xn" + q, [x, plot.y0 - 22], fmtT(t), { fontSize: TICK_SIZE, color: C.guide }));
  });
  survTicks.forEach((v, q) => {
    const y = sy(v);
    axesChildren.push(kit.stroke("axes__yt" + q, [[plot.x0, y], [plot.x0 - 8, y]], { color: C.guide, strokeWidth: 2, ms: MS.stroke }));
    axesChildren.push(kit.text("axes__yn" + q, [plot.x0 - 14, y], fmtS(v), { fontSize: TICK_SIZE, anchor: "end", color: C.guide }));
  });
  push(kit.group("axes", axesChildren));

  // Right-continuous, non-increasing per arm: a value below the previous one
  // (or a bad/missing entry) is clamped down to it, so the drawn staircase
  // can only ever hold flat or drop — never step back up.
  const clampedArms = arms.map((a) => {
    const raw = Array.isArray(a.survival) && a.survival.length > 0 ? a.survival : [1];
    const out = [];
    let prev = 1;
    for (let k = 0; k < raw.length; k++) {
      const v = typeof raw[k] === "number" && Number.isFinite(raw[k]) ? raw[k] : prev;
      const clamped = Math.max(0, Math.min(prev, v));
      out.push(clamped);
      prev = clamped;
    }
    return out;
  });

  function armColor(a, i) {
    return C[a.color === "supply" || a.color === "demand" || a.color === "accent" ? a.color : ARM_COLORS[i % ARM_COLORS.length]];
  }

  const crossings = [];
  arms.forEach((a, i) => {
    const s = clampedArms[i];
    const color = armColor(a, i);
    const pts = [[sx(0), sy(s[0])]];
    for (let k = 1; k < s.length; k++) {
      pts.push([sx(k), sy(s[k - 1])]);
      pts.push([sx(k), sy(s[k])]);
    }
    const lastIdx = s.length - 1;
    if (lastIdx < xDomainMax) pts.push([sx(xDomainMax), sy(s[lastIdx])]);
    const id = "arm_" + i;
    push(kit.stroke(id, pts, { color, strokeWidth: 4.5, ms: MS.curve }));
    anchors[id] = pts[pts.length - 1];
    label("arm_label_" + i, pts[pts.length - 1], "right", a.label || "Arm " + (i + 1), color, ARM_SIZE);

    let crossIdx = -1;
    for (let k = 0; k < s.length; k++) {
      if (s[k] <= 0.5) { crossIdx = k; break; }
    }
    if (crossIdx >= 0) crossings.push({ x: sx(crossIdx) });
  });

  if (showMedian && crossings.length > 0) {
    const y05 = sy(0.5);
    const maxX = Math.max(...crossings.map((c) => c.x));
    const children = [kit.stroke("median_line__h", [[plot.x0, y05], [maxX, y05]], { color: C.guide, dash: true, strokeWidth: 2.5, ms: MS.guides })];
    crossings.forEach((c, i) => {
      children.push(kit.stroke("median_line__v" + i, [[c.x, y05], [c.x, plot.y0]], { color: C.guide, dash: true, strokeWidth: 2.5, ms: MS.guides }));
    });
    push(kit.group("median_line", children));
    anchors.median_line = [maxX, y05];
  }

  (Array.isArray(params.censor_ticks) ? params.censor_ticks : []).slice(0, 30).forEach((ct, i) => {
    const armIdx = typeof ct.arm === "number" ? ct.arm : -1;
    const arm = arms[armIdx];
    const s = clampedArms[armIdx];
    if (!arm || !s) return;
    const atIdx = typeof ct.at === "number" ? Math.max(0, Math.min(xDomainMax, Math.round(ct.at))) : -1;
    if (atIdx < 0) return;
    const sIdx = Math.min(atIdx, s.length - 1);
    const x = sx(atIdx), y = sy(s[sIdx]);
    const color = armColor(arm, armIdx);
    const id = "censor_" + i;
    push(kit.stroke(id, [[x, y - 11], [x, y + 11]], { color, strokeWidth: 3, ms: MS.stroke }));
    anchors[id] = [x, y];
  });

  if (typeof params.title === "string" && params.title.trim() !== "") {
    push(kit.text("title", [(plot.x0 + plot.x1) / 2, plot.y1 + 68], params.title, { fontSize: 30 }));
  }

  return { drawables, labels, anchors, order, ...(arms.every((a) => Array.isArray(a.survival)) ? { frame: { x: [0, tMax], y: [0, 1], box: plot } } : {}) };
---
template: forest_plot
title: Forest plot (meta-analysis)
version: 2
kit: 11
status: ready
accepts_data: true
description: >-
  A meta-analysis forest plot: one row per study with a square point-
  estimate marker (sized by weight) and a horizontal confidence-interval
  whisker, a dashed null-effect reference line, and an optional pooled
  estimate drawn as a diamond spanning its own confidence interval. Ratio
  measures (risk ratio, odds ratio, hazard ratio) are positioned on a LOG
  scale so equal fold-changes are equally spaced, with the null line at 1;
  mean-difference is positioned on a linear scale with the null line at 0.
  Choose this scene for ANY request about a forest plot, meta-analysis,
  pooled estimate, pooled effect, confidence interval, risk ratio, odds
  ratio, hazard ratio, mean difference, heterogeneity, or combining evidence
  across studies. Every estimate takes a typed number or a code element's
  variable via a "{id.var}" token — a meta-analysis the script actually ran.
  TYPE each study's `label` (and `measure`) by hand: the typed names are what
  keep the study_i / ci_i / pooled beats alive before the script has run, and
  a row still waiting for its numbers draws on the null line with a dash for
  its value, never an invented interval.
params:
  type: object
  properties:
    measure:
      type: string
      enum: [RR, OR, HR, MD]
      description: "Effect measure (default RR). RR/OR/HR are ratio measures plotted on a log scale; MD (mean difference) is plotted on a linear scale."
    studies:
      type: array
      minItems: 2
      maxItems: 8
      items:
        type: object
        properties:
          label: { type: string }
          est: { type: number }
          lo: { type: number, description: "Lower bound of the confidence interval." }
          hi: { type: number, description: "Upper bound of the confidence interval." }
          weight:
            type: number
            description: "1-10, sizes the square marker (default mid-weight)."
        required: [label, est, lo, hi]
    pooled:
      type: object
      properties:
        est: { type: number }
        lo: { type: number }
        hi: { type: number }
      required: [est, lo, hi]
      description: "The pooled effect estimate, drawn as a diamond."
    null_line:
      type: number
      description: "Where the reference (no-effect) line sits — default 1 for ratio measures, 0 for MD."
    title:
      type: string
element_ids:
  null_line: dashed vertical reference line at the null effect
  study_<i>: square point-estimate marker for studies[i] (counted from 0), sized by weight
  ci_<i>: its horizontal confidence-interval whisker
  study_label_<i>: its study-name label, left column
  est_label_<i>: its "est [lo, hi]" text, right column
  pooled: the pooled-estimate diamond, present when `pooled` is set
  pooled_label: the pooled diamond's name + "est [lo, hi]" text, present when `pooled` is set
  axis: the horizontal value axis with tick labels
  title: figure title, when set
examples:
  - request: "Draw a meta-analysis forest plot pooling four studies of a treatment's risk ratio."
    params:
      measure: "RR"
      studies:
        - { label: "Anderson 2015", est: 0.82, lo: 0.63, hi: 1.07, weight: 6 }
        - { label: "Bianchi 2017", est: 0.71, lo: 0.55, hi: 0.92, weight: 8 }
        - { label: "Carter 2019", est: 0.9, lo: 0.68, hi: 1.19, weight: 5 }
        - { label: "Diallo 2021", est: 0.65, lo: 0.48, hi: 0.88, weight: 7 }
      pooled: { est: 0.76, lo: 0.65, hi: 0.89 }
      title: "Risk of relapse: pooled analysis"
  - request: "Show a forest plot of mean differences from three trials."
    params:
      measure: "MD"
      studies:
        - { label: "Trial 1", est: -2.1, lo: -4.0, hi: -0.2, weight: 5 }
        - { label: "Trial 2", est: -1.4, lo: -3.1, hi: 0.3, weight: 4 }
        - { label: "Trial 3", est: -3.0, lo: -5.2, hi: -0.8, weight: 6 }
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const measure = ["RR", "OR", "HR", "MD"].includes(params.measure) ? params.measure : "RR";
  const isLog = measure !== "MD";
  const nullVal = typeof params.null_line === "number" && Number.isFinite(params.null_line) ? params.null_line : (isLog ? 1 : 0);

  const studiesRaw = Array.isArray(params.studies) ? params.studies.slice(0, 8) : [];
  // PENDING rows. A "{id.var}" token the resolver has not filled yet is still
  // a string where a number belongs — and the editor lints before the script
  // has run, so that is the normal state of a script-fed forest plot, not an
  // error. Such a row keeps its place, its typed name and its beats, but
  // collapses onto the null line with no whisker width and a dash in the value
  // column: a figure waiting for numbers must never SHOW numbers it invented.
  // (A hand-authored row missing an endpoint lands here too — the schema
  // requires all three, so there is nothing honest to draw for it either.)
  const finite = (v) => typeof v === "number" && Number.isFinite(v);
  const pending = (s) => !(finite(s && s.est) && finite(s && s.lo) && finite(s && s.hi));
  // Only fall back to a fully canned pair when the caller supplied NO real
  // studies at all — a single real study (schema wants 2+, but a caller
  // might still send one) renders as its own one-row plot instead of being
  // silently swapped out for unrelated placeholder data.
  const studies = (studiesRaw.length > 0 ? studiesRaw : [
    { label: "Study A", est: 0.8, lo: 0.6, hi: 1.05 },
    { label: "Study B", est: 0.65, lo: 0.5, hi: 0.85 },
  ]).map((s, i) => {
    const waiting = pending(s);
    const est = waiting ? nullVal : s.est;
    const weight = Math.min(10, Math.max(1, finite(s.weight) ? s.weight : 5));
    const label = typeof s.label === "string" && s.label.trim() !== "" ? s.label : "Study " + (i + 1);
    return { label, est, lo: waiting ? nullVal : s.lo, hi: waiting ? nullVal : s.hi, weight, waiting };
  });
  const pooledRaw = params.pooled && typeof params.pooled === "object" ? params.pooled : null;
  // A pooled estimate fed by tokens still mints its diamond and its label —
  // an author's `draw: ["pooled"]` beat must resolve before the script runs —
  // as a zero-width diamond on the null with a dash for its value.
  const pooledIn = pooledRaw
    ? (pending(pooledRaw) ? { est: nullVal, lo: nullVal, hi: nullVal, waiting: true } : { est: pooledRaw.est, lo: pooledRaw.lo, hi: pooledRaw.hi, waiting: false })
    : null;
  const PENDING_TEXT = "—";

  const toDomain = (v) => (isLog ? Math.log(Math.max(1e-6, v)) : v);
  const domainVals = [toDomain(nullVal)];
  studies.forEach((s) => { domainVals.push(toDomain(s.lo), toDomain(s.hi), toDomain(s.est)); });
  if (pooledIn) domainVals.push(toDomain(pooledIn.lo), toDomain(pooledIn.hi), toDomain(pooledIn.est));
  let dMin = Math.min(...domainVals), dMax = Math.max(...domainVals);
  const span = dMax - dMin;
  const pad = span > 1e-9 ? span * 0.15 : (isLog ? 0.35 : 1);
  dMin -= pad; dMax += pad;
  const denom = (dMax - dMin) || 1;

  const PLOT = { x0: 400, x1: 740 };
  const LABEL_X = 380;
  const EST_X = 770;
  const TITLE_Y = 715;
  // Readable sizes (page frame §4, W25): names 26, numbers 22, axis 22. A
  // few studies keep rows close (at most 90 apart) so the plot is not a tall
  // thin figure the page shrinks to fit; eight share 330 as before.
  const NAME_FONT = 26, NUM_FONT = 22, AXIS_FONT = 22;
  // The rows, the pooled diamond and the axis fit between 630 and an axis at
  // 240 (its caption then clears the caption band, y < 160); fewer rows are
  // centred in that height.
  const TOP_MAX = 630, AXIS_MIN = 240;
  const rowsN = studies.length;
  const pooledGap = pooledIn ? 80 : 0;
  const room = TOP_MAX - AXIS_MIN - 80 - pooledGap;
  const rowSpacing = rowsN > 1 ? Math.min(90, room / (rowsN - 1)) : 0;
  const TOP_ROW_Y = TOP_MAX - Math.max(0, room - (rowsN - 1) * rowSpacing) / 2;
  const rowY = (i) => TOP_ROW_Y - i * rowSpacing;
  const LOW_ROW_Y = rowY(rowsN - 1);
  const POOLED_Y = LOW_ROW_Y - pooledGap;
  const AXIS_Y = (pooledIn ? POOLED_Y : LOW_ROW_Y) - 80;
  // A long study name shrinks (to 18) before it would run off the left edge.
  const nameFont = (t) => Math.max(18, Math.min(NAME_FONT, Math.floor((LABEL_X - 30) / (0.5 * Math.max(1, t.length)))));

  const xOf = (v) => PLOT.x0 + ((toDomain(v) - dMin) / denom) * (PLOT.x1 - PLOT.x0);

  const drawables = [], labels = [], anchors = {}, order = [];
  const attached = {};
  const push = (d) => { drawables.push(d); order.push(d.id); };

  const nullPx = xOf(nullVal);
  push(kit.stroke("null_line", [[nullPx, AXIS_Y + 15], [nullPx, TOP_ROW_Y + 40]], { color: C.guide, dash: true, strokeWidth: 2.5, ms: MS.guides }));
  anchors.null_line = [nullPx, TOP_ROW_Y + 40];

  studies.forEach((s, i) => {
    const y = rowY(i);
    const estPx = xOf(s.est), loPx = xOf(s.lo), hiPx = xOf(s.hi);
    const halfSize = 6 + ((s.weight - 1) / 9) * 12;
    push(kit.stroke("ci_" + i, [[loPx, y - 6], [loPx, y + 6], [loPx, y], [hiPx, y], [hiPx, y - 6], [hiPx, y + 6]], { color: C.ink, strokeWidth: 2.5, ms: MS.stroke }));
    push(kit.stroke("study_" + i, kit.polygon([estPx, y], halfSize, 4, Math.PI / 4), { closed: true, color: C.ink, fill: C.ink, strokeWidth: 2, ms: MS.dot }));
    anchors["study_" + i] = [estPx, y];
    push(kit.text("study_label_" + i, [LABEL_X, y], s.label, { fontSize: nameFont(s.label), anchor: "end" }));
    const estText = s.waiting ? PENDING_TEXT : kit.num(s.est, 2) + " [" + kit.num(s.lo, 2) + (kit.num(0.5, 1).includes(",") ? "; " : ", ") + kit.num(s.hi, 2) + "]";
    push(kit.text("est_label_" + i, [EST_X, y], estText, { fontSize: NUM_FONT, anchor: "start" }));
  });

  if (pooledIn) {
    const estPx = xOf(pooledIn.est), loPx = xOf(pooledIn.lo), hiPx = xOf(pooledIn.hi);
    const halfH = 15;
    push(kit.stroke("pooled", [[loPx, POOLED_Y], [estPx, POOLED_Y + halfH], [hiPx, POOLED_Y], [estPx, POOLED_Y - halfH]], { closed: true, color: C.accent, fill: C.accent, strokeWidth: 2.5, ms: MS.dot }));
    anchors.pooled = [estPx, POOLED_Y];
    const estStr = pooledIn.waiting ? PENDING_TEXT : kit.num(pooledIn.est, 2) + " [" + kit.num(pooledIn.lo, 2) + (kit.num(0.5, 1).includes(",") ? "; " : ", ") + kit.num(pooledIn.hi, 2) + "]";
    push(kit.group("pooled_label", [
      kit.text("pooled_label__name", [LABEL_X, POOLED_Y], "Pooled", { fontSize: NAME_FONT, anchor: "end", color: C.accent }),
      kit.text("pooled_label__stats", [EST_X, POOLED_Y], estStr, { fontSize: NUM_FONT, anchor: "start", color: C.accent }),
    ]));
    anchors.pooled_label = [(LABEL_X + EST_X) / 2, POOLED_Y];
    attached["pooled"] = ["pooled_label"];
  }

  const minOriginal = isLog ? Math.exp(dMin) : dMin;
  const maxOriginal = isLog ? Math.exp(dMax) : dMax;
  const axisChildren = [
    kit.stroke("axis__line", [[PLOT.x0 - 15, AXIS_Y], [PLOT.x1 + 15, AXIS_Y]], { color: C.ink, strokeWidth: 3, ms: MS.axis }),
    kit.stroke("axis__tick_min", [[PLOT.x0, AXIS_Y - 8], [PLOT.x0, AXIS_Y + 8]], { color: C.guide, strokeWidth: 2, ms: MS.stroke }),
    kit.text("axis__tick_min_label", [PLOT.x0, AXIS_Y - 30], kit.num(minOriginal, 2), { fontSize: AXIS_FONT, color: C.guide }),
    kit.stroke("axis__tick_null", [[nullPx, AXIS_Y - 8], [nullPx, AXIS_Y + 8]], { color: C.guide, strokeWidth: 2, ms: MS.stroke }),
    kit.text("axis__tick_null_label", [nullPx, AXIS_Y - 30], String(nullVal), { fontSize: AXIS_FONT, color: C.guide }),
    kit.stroke("axis__tick_max", [[PLOT.x1, AXIS_Y - 8], [PLOT.x1, AXIS_Y + 8]], { color: C.guide, strokeWidth: 2, ms: MS.stroke }),
    kit.text("axis__tick_max_label", [PLOT.x1, AXIS_Y - 30], kit.num(maxOriginal, 2), { fontSize: AXIS_FONT, color: C.guide }),
    kit.text("axis__caption", [(PLOT.x0 + PLOT.x1) / 2, AXIS_Y - 62], measure + (isLog ? " (log scale)" : " (linear scale)"), { fontSize: AXIS_FONT, color: C.guide }),
  ];
  push(kit.group("axis", axisChildren));
  anchors.axis = [(PLOT.x0 + PLOT.x1) / 2, AXIS_Y];

  if (typeof params.title === "string" && params.title.trim() !== "") {
    push(kit.text("title", [500, TITLE_Y], params.title, { fontSize: 28 }));
  }

  return { drawables, labels, anchors, order, attached };
---
template: causal_dag
title: Causal DAG (directed acyclic graph)
version: 1
kit: 2
status: ready
description: >-
  A causal directed acyclic graph (DAG): an exposure node far left, an
  outcome node far right, and any confounders (banded above the exposure-
  outcome line), mediators (sitting on that line, between exposure and
  outcome), and colliders (banded below), connected by straight causal
  arrows. Optionally tints the confounder's edges to highlight the backdoor
  path it opens. Choose this scene for ANY request about a causal diagram,
  causal DAG, confounder, confounding, collider, collider bias, mediator,
  mediation, backdoor path, or the causal structure behind an exposure-
  outcome relationship.
params:
  type: object
  properties:
    nodes:
      type: array
      items:
        type: object
        properties:
          name: { type: string }
          role:
            type: string
            enum: [exposure, outcome, confounder, collider, mediator]
            description: "Determines placement; unspecified/other roles are placed as mediators."
        required: [name]
    edges:
      type: string
      description: "kit.parseEdgeList notation, e.g. \"Coffee -> Heart disease; Stress -> Coffee; Stress -> Heart disease\". Only -> is meaningful for a causal DAG."
    highlight_backdoor:
      type: boolean
      description: "Tint edges touching a confounder to flag the backdoor path it opens (default false)."
    title:
      type: string
element_ids:
  node_<slug>: a node (ellipse halo + its name), one per entry in `nodes`
  edge_<i>: the i-th parsed edge's arrow
  title: figure title, when set
examples:
  - request: "Show how a confounder biases the effect of coffee on heart disease."
    params:
      nodes:
        - { name: "Coffee", role: "exposure" }
        - { name: "Heart disease", role: "outcome" }
        - { name: "Stress", role: "confounder" }
      edges: "Coffee -> Heart disease; Stress -> Coffee; Stress -> Heart disease"
      highlight_backdoor: true
      title: "Confounding by stress"
  - request: "Draw a causal DAG with a mediator between exposure and outcome."
    params:
      nodes:
        - { name: "Exercise", role: "exposure" }
        - { name: "Mortality", role: "outcome" }
        - { name: "Fitness", role: "mediator" }
      edges: "Exercise -> Fitness; Fitness -> Mortality; Exercise -> Mortality"
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  function slugify(name) { return String(name).toLowerCase().replace(/[^a-z0-9]/g, "_") || "n"; }
  const ROLES = ["exposure", "outcome", "confounder", "collider", "mediator"];
  const ROLE_COLOR = { exposure: C.demand, outcome: C.supply, confounder: C.accent, collider: C.regionLoss, mediator: C.shifted };
  function normalizedRole(r) { return ROLES.indexOf(r) >= 0 ? r : "mediator"; }

  const nodesIn = Array.isArray(params.nodes)
    ? params.nodes.slice(0, 12).filter((n) => n && typeof n.name === "string" && n.name.trim() !== "")
    : [];

  const MID_Y = 375;
  const EXPOSURE_X = 150, OUTCOME_X = 850;
  const BAND_Y = { confounder: MID_Y + 165, collider: MID_Y - 165, mediator: MID_Y };
  const BAND_X_MIN = 320, BAND_X_MAX = 680;

  const positions = {};
  const bands = { exposure: [], outcome: [], confounder: [], collider: [], mediator: [] };
  nodesIn.forEach((n) => { bands[normalizedRole(n.role)].push(n); });

  function spreadVertical(list, x, yMin, yMax) {
    const m = list.length;
    list.forEach((n, i) => {
      const y = m <= 1 ? (yMin + yMax) / 2 : yMin + ((yMax - yMin) * i) / (m - 1);
      positions[n.name] = [x, y];
    });
  }
  function spreadHorizontal(list, y, xMin, xMax) {
    const m = list.length;
    list.forEach((n, i) => {
      const x = m <= 1 ? (xMin + xMax) / 2 : xMin + ((xMax - xMin) * i) / (m - 1);
      positions[n.name] = [x, y];
    });
  }
  spreadVertical(bands.exposure, EXPOSURE_X, MID_Y - 70, MID_Y + 70);
  spreadVertical(bands.outcome, OUTCOME_X, MID_Y - 70, MID_Y + 70);
  spreadHorizontal(bands.confounder, BAND_Y.confounder, BAND_X_MIN, BAND_X_MAX);
  spreadHorizontal(bands.collider, BAND_Y.collider, BAND_X_MIN, BAND_X_MAX);
  spreadHorizontal(bands.mediator, BAND_Y.mediator, BAND_X_MIN, BAND_X_MAX);

  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };

  // Readable node names (page frame §4, W25): 26 at most, 20 at least; the
  // ellipse grows round its name. A crowded band (its nodes closer than two
  // ellipses) and a long name shrink the font first, down to 20.
  const NODE_FONT = 26, NODE_FONT_MIN = 20, RY = 34;
  const gapIn = (list, span) => (list.length > 1 ? span / (list.length - 1) : Infinity);
  const roomOf = (role) => {
    if (role === "exposure" || role === "outcome") return 2 * (BAND_X_MIN - EXPOSURE_X) - 40;
    return Math.min(2 * (BAND_X_MIN - EXPOSURE_X) - 40, gapIn(bands[role], BAND_X_MAX - BAND_X_MIN) - 24);
  };
  const sizeOf = (n) => {
    const room = roomOf(normalizedRole(n.role));
    let f = NODE_FONT;
    while (f > NODE_FONT_MIN && kit.textWidth(n.name, f) + 40 > room) f -= 1;
    const rx = Math.max(64, Math.min(room / 2, kit.textWidth(n.name, f) / 2 + 22));
    return { f, rx };
  };
  const sizes = {};
  nodesIn.forEach((n) => { sizes[n.name] = sizeOf(n); });

  nodesIn.forEach((n) => {
    const c = positions[n.name];
    if (!c) return;
    const role = normalizedRole(n.role);
    const color = ROLE_COLOR[role];
    const slug = slugify(n.name);
    const { f: fontSize, rx } = sizes[n.name];
    const halo = kit.stroke("node_" + slug + "__halo", kit.ellipse(c, rx, RY), { closed: true, color, strokeWidth: 3, ms: MS.node });
    const text = kit.text("node_" + slug + "__text", c, n.name, { fontSize, color });
    push(kit.group("node_" + slug, [halo, text]));
    anchors["node_" + slug] = c;
  });

  function roleOf(name) {
    const found = nodesIn.find((n) => n.name === name);
    return found ? normalizedRole(found.role) : "mediator";
  }

  const highlightBackdoor = params.highlight_backdoor === true;
  const edgesStr = typeof params.edges === "string" ? params.edges : "";
  const parsed = kit.parseEdgeList(edgesStr);
  parsed.slice(0, 40).forEach((e, i) => {
    const from = positions[e.from];
    const to = positions[e.to];
    if (!from || !to) return;
    const backdoor = highlightBackdoor && (roleOf(e.from) === "confounder" || roleOf(e.to) === "confounder");
    const color = backdoor ? C.regionLoss : C.ink;
    const strokeWidth = backdoor ? 4.5 : 3.5;
    const id = "edge_" + i;
    const { drawables: edgeDrawables } = kit.edgeArrow(id, from, to, { shortenStart: { ellipse: [sizes[e.from].rx, RY] }, shortenEnd: { ellipse: [sizes[e.to].rx, RY] }, color, strokeWidth, ms: MS.connector });
    edgeDrawables.forEach(push);
    const mainPts = edgeDrawables[0].pts;
    anchors[id] = [(mainPts[0][0] + mainPts[mainPts.length - 1][0]) / 2, (mainPts[0][1] + mainPts[mainPts.length - 1][1]) / 2];
  });

  if (typeof params.title === "string" && params.title.trim() !== "") {
    push(kit.text("title", [500, 715], params.title, { fontSize: 30 }));
  }

  return { drawables, labels, anchors, order };
---
template: sir_compartments
interaction: "In model mode: scrub R0, beta, a stay or the share vaccinated; drag the intervention band along the days, or the cursor to read a day; the curves recompute."
title: Epidemic compartment model (SIR / SEIR)
version: 2
kit: 11
status: ready
description: >-
  A compartmental epidemic model (SIR, SEIR, SIS, SIRS): boxes for each
  compartment in a left-to-right chain, connected by rate-labeled flow
  arrows. Choose this scene for ANY request about an SIR or SEIR model, an
  epidemic curve, R0 or the effective reproduction number Rt, herd immunity,
  vaccination coverage, flattening the curve, or why an epidemic peaks.
  Two modes. The flow diagram alone (compartments, rates, show_loop) is a
  static drawing. Give `r0` (or `model`) for the LIVE model instead: the flow
  diagram moves to the top with its rates as numbers, and a plot of S, I, R
  (E) over the days fills the page, computed from the equations — the peak
  (dot, day), the dashed 1/R0 line on the S axis (where the S curve crosses
  it, Rt = 1 and I peaks), herd immunity with a vaccination bar, an
  intervention band cutting contacts, a time cursor reading S, I, R and Rt.
  r0, vaccinated, infectious_days, cursor_day and intervention.* are numeric
  and ANIMATE (give `days` when you animate, so the time axis holds still).
  Paused, the viewer scrubs or taps R0, the rates and the vaccination share,
  drags the intervention band and its edges, and drags a cursor across the
  plot. Values: {sir.r0}, {sir.beta}, {sir.hit} (herd immunity, %),
  {sir.peak_day}, {sir.peak_i} (%), {sir.final_size} (% ever infected; SIR
  and SEIR), {sir.endemic_i} (%; SIS, SIRS, or with lifespan_years),
  {sir.cross_day} (Rt falls below 1), {sir.r_eff} (Rt at the cursor, day 0
  without one), {sir.s_at} {sir.i_at} {sir.r_at} {sir.v_at} (% at the
  cursor; R recovered, V vaccinated), {sir.days}.
params:
  type: object
  properties:
    compartments:
      type: array
      minItems: 2
      maxItems: 5
      items: { type: string }
      description: "Flow diagram alone: compartment codes in flow order, e.g. [\"S\",\"E\",\"I\",\"R\"] (default [\"S\",\"I\",\"R\"])."
    labels:
      type: array
      items: { type: string }
      description: "Full compartment names in order (default Susceptible/Exposed/Infectious/Recovered/Deceased by code). The live model takes them too."
    rates:
      type: array
      items: { type: string }
      description: "Flow diagram alone: rate label over each arrow (default β then γ, then σ/μ/δ)."
    show_loop:
      type: object
      properties:
        from: { type: string }
        to: { type: string }
        label: { type: string }
      required: [from, to]
      description: "Flow diagram alone: a curved return arrow below the chain, e.g. waning immunity from R back to S."
    model:
      type: string
      enum: [sir, seir, sis, sirs]
      description: "The live model: sir (default), seir (a latent E stage), sis (recovery gives no immunity), sirs (immunity wanes)."
    r0:
      type: number
      description: "Live model: the basic reproduction number (default 2.5). beta is set so that R0 is this."
    infectious_days:
      type: number
      description: "Live model: mean days infectious, 1/γ (default 10)."
    latent_days:
      type: number
      description: "SEIR: mean days exposed before infectious, 1/σ (default 5)."
    immunity_days:
      type: number
      description: "SIRS: mean days immunity lasts, 1/ω (default 180)."
    vaccinated:
      type: number
      description: "Live model: share vaccinated (immune) at the start, 0–1 (0.4 for 40 %); shows herd immunity and a vaccination bar. Newborns too, with lifespan_years."
    initial_infected:
      type: number
      description: "Live model: share infectious on day 0 (default 0.001)."
    intervention:
      type: object
      properties:
        start: { type: number }
        end: { type: number }
        reduction: { type: number }
      description: "Live model: from day start to day end, contacts (β) are cut by reduction, a share 0–1 — a shaded band on the plot."
    cursor_day:
      type: number
      description: "Live model: a vertical cursor on this day, reading S, I, R and Rt above the plot."
    days:
      type: number
      description: "Live model: the time axis, 0 to days (default fitted to the epidemic). Give it when you animate."
    lifespan_years:
      type: number
      description: "Live model: births and deaths at this life expectancy (an endemic model; default none — a closed population)."
    curves:
      type: array
      items: { type: string, enum: [s, e, i, r] }
      description: "Live model: which curves to draw (default all the model's compartments)."
    show_hit:
      type: boolean
      description: "Live model: the herd-immunity readout and bar (default on when vaccinated is given)."
    show_threshold:
      type: boolean
      description: "Live model: the dashed 1/R0 line (default true)."
    show_peak:
      type: boolean
      description: "Live model: the peak dot and its day (default true)."
element_ids:
  box_<name>: a compartment box (s, e, i, r in the live model)
  box_code_<name>: the compartment's short code, inside the box
  box_name_<name>: its full descriptive name (below the box; inside it in the live model)
  flow_<i>: the i-th flow arrow (compartments[i] -> compartments[i+1])
  rate_<i>: that flow's rate label (the live model writes β = 0.25, γ = 1/10)
  loop: the curved return arrow (show_loop; the live SIS/SIRS model's recovery or waning)
  loop_label: its label
  r0_value: "live model: the R₀ = 2.5 readout, top right"
  hit_value: "live model: the herd immunity 60% readout, present with show_hit"
  immunity_bar: "live model: the population bar, green as far as vaccinated, a tick at herd immunity"
  vax_value: "live model: the vaccinated 40% readout, present when vaccinated is given"
  vaccinated_band: "live model: the vaccinated, a band hanging from 100 % as deep as the share (drawn with its label vaccinated_label); its lower edge below the dashed 1/R₀ line is herd immunity. R is only those recovered from infection"
  axes: "live model: the axes (days, share of people) with their numbers"
  curve_s / curve_e / curve_i / curve_r: "live model: the compartment curves"
  label_s / label_e / label_i / label_r: their letters (drawn with their curve)
  threshold: "live model: the dashed S = 1/R₀ line (Rt = 1 where S crosses it)"
  threshold_label: its 1/R₀ label
  peak: "live model: the dot at the peak of I (drawn with peak_guide and peak_label)"
  peak_guide: its dashed drop to the day axis
  peak_label: "its peak, day 38 label"
  intervention: "live model: the shaded band over the intervention's days, present with intervention"
  intervention_label: "its contacts −40% label"
  cursor: "live model: the time cursor with a dot on each curve, present with cursor_day"
  cursor_readout: "the cursor's readout above the plot (a set): cursor_day_label (day 38), cursor_rt (Rₜ = 1.03), cursor_s / cursor_e / cursor_i / cursor_r (each share); drawn with the cursor"
examples:
  - request: "Draw an SIR model of an epidemic."
    params: {}
  - request: "Show an SEIR model with waning immunity looping back from recovered to susceptible."
    params:
      compartments: ["S", "E", "I", "R"]
      rates: ["β·S·I", "σ·E", "γ·I"]
      show_loop: { from: "R", to: "S", label: "Waning immunity" }
  - request: "Why does an epidemic peak before everyone has been infected?"
    params: { r0: 3, days: 120, cursor_day: 38 }
  - request: "How much vaccination stops a measles outbreak?"
    params: { r0: 12, infectious_days: 8, vaccinated: 0.8, days: 120 }
  - request: "What does a four-week lockdown do to the epidemic curve?"
    params: { model: seir, r0: 2.5, intervention: { start: 30, end: 58, reduction: 0.5 }, days: 250 }
lint: |
  // What the params say that the schema cannot check.
  const out = [];
  const warn = (message) => out.push({ severity: "warn", message });
  const error = (message) => out.push({ severity: "error", message });
  const MODEL_ONLY = ["infectious_days", "latent_days", "immunity_days", "vaccinated", "initial_infected", "intervention", "cursor_day", "days", "lifespan_years", "curves", "show_hit", "show_threshold", "show_peak"];
  const isModel = typeof params.model === "string" || typeof params.r0 === "number";
  if (!isModel) {
    const stray = MODEL_ONLY.filter((k) => params[k] !== undefined);
    if (stray.length > 0) warn(stray.join(", ") + " only work in the live model — set r0 (or model) to draw it; the flow diagram alone ignores them");
    return out;
  }
  const share = (name, v) => {
    if (typeof v === "number" && (v < 0 || v > 1)) error(name + " is a share from 0 to 1 (0.6 for 60 %), got " + v);
  };
  share("vaccinated", params.vaccinated);
  share("initial_infected", params.initial_infected);
  const iv = params.intervention;
  if (iv && typeof iv === "object") {
    share("intervention.reduction", iv.reduction);
    if (typeof iv.start === "number" && typeof iv.end === "number" && iv.end <= iv.start) error("intervention.end (" + iv.end + ") must come after intervention.start (" + iv.start + ")");
  }
  if (typeof params.r0 === "number" && (params.r0 < 0.1 || params.r0 > 20)) warn("r0 " + params.r0 + " is drawn clamped to 0.1–20");
  const kind = ["sir", "seir", "sis", "sirs"].includes(params.model) ? params.model : "sir";
  if (typeof params.model === "string" && !["sir", "seir", "sis", "sirs"].includes(params.model)) error('model must be "sir", "seir", "sis" or "sirs", got "' + params.model + '"');
  if (kind === "sis" && params.vaccinated !== undefined) warn("an SIS model has no immune compartment: vaccinated is ignored");
  if (kind !== "seir" && params.latent_days !== undefined) warn("latent_days is the SEIR model's (model: seir); it is ignored here");
  if (kind !== "sirs" && params.immunity_days !== undefined) warn("immunity_days is the SIRS model's (model: sirs); it is ignored here");
  const flowOnly = ["compartments", "rates", "show_loop"].filter((k) => params[k] !== undefined);
  if (flowOnly.length > 0) warn("the live model draws its compartments and rates from `model`: " + flowOnly.join(", ") + " ignored");
  if (typeof params.days === "number" && typeof params.cursor_day === "number" && params.cursor_day > params.days) warn("cursor_day " + params.cursor_day + " is past the last day (" + params.days + "); it is drawn at the end");
  return out;
layout: |
  // ── The live model (2026-09-28) ─────────────────────────────────────
  // Named by `model` or `r0`: the flow diagram moves to the top, a time
  // series of the compartments fills the page below it, and the numbers
  // (R0, herd immunity, peak, final size, Rt at a cursor) are computed by
  // integrating the equations. Without either param the template is the
  // flow diagram alone, painted exactly as before (tests/sir-parity).
  if (typeof params.model === "string" || typeof params.r0 === "number") {
    const C = kit.COLORS, MS = kit.SKETCH_MS;
    const num = (v, d) => (typeof v === "number" && Number.isFinite(v) ? v : d);
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const kind = ["sir", "seir", "sis", "sirs"].includes(params.model) ? params.model : "sir";
    const r0 = clamp(num(params.r0, 2.5), 0.1, 20);
    const D = clamp(num(params.infectious_days, 10), 0.5, 365);
    const Lat = clamp(num(params.latent_days, 5), 0.2, 365);
    const Wn = clamp(num(params.immunity_days, 180), 5, 36500);
    const life = typeof params.lifespan_years === "number" && params.lifespan_years > 0 ? clamp(params.lifespan_years, 1, 200) : null;
    const mu = life ? 1 / (life * 365) : 0;
    const gamma = 1 / D;
    const sigma = kind === "seir" ? 1 / Lat : 0;
    const omega = kind === "sirs" ? 1 / Wn : 0;
    // R0 is what the author gives; beta is what makes it so.
    const beta = kind === "seir" ? (r0 * (gamma + mu) * (sigma + mu)) / sigma : r0 * (gamma + mu);
    const hasR = kind !== "sis";
    const vacc = hasR ? clamp(num(params.vaccinated, 0), 0, 1) : 0;
    const i0 = clamp(num(params.initial_infected, 0.001), 1e-6, 0.5);
    const ivp = params.intervention && typeof params.intervention === "object" && !Array.isArray(params.intervention) ? params.intervention : null;
    const iv = ivp
      ? (() => {
          const s = Math.max(0, num(ivp.start, 20));
          return { start: s, end: Math.max(s, num(ivp.end, s + 30)), cut: clamp(num(ivp.reduction, 0.4), 0, 1) };
        })()
      : null;
    const betaAt = (t) => (iv && t >= iv.start && t < iv.end ? beta * (1 - iv.cut) : beta);

    // State [S, E, I, R, cumulative infections, V], as shares of the
    // population. The vaccinated are immune like R but kept apart (V), so R
    // is what infection did and the vaccinated are drawn as their own band.
    const deriv = (t, y) => {
      const [S, E, I, R, , V] = y;
      const inf = betaAt(t) * S * I;
      const dS = mu * (1 - vacc) - inf - mu * S + omega * (R + V) + (kind === "sis" ? gamma * I : 0);
      const dE = kind === "seir" ? inf - (sigma + mu) * E : 0;
      const dI = (kind === "seir" ? sigma * E : inf) - (gamma + mu) * I;
      const dR = hasR ? gamma * I - (omega + mu) * R : 0;
      const dV = hasR ? mu * vacc - (omega + mu) * V : 0;
      return [dS, dE, dI, dR, inf, dV];
    };
    const dt = Math.min(0.25, D / 40, kind === "seir" ? Lat / 40 : 1);
    const endemic = kind === "sis" || kind === "sirs" || mu > 0;
    const given = typeof params.days === "number" && Number.isFinite(params.days) && params.days > 0 ? clamp(params.days, 5, 40000) : null;
    // Run long enough to see the epidemic end (closed models), or to settle.
    // A closed epidemic runs on past the author's axis until it is over, so
    // its peak and size are its own even when the plot shows only the start.
    const tCap = endemic ? given ?? (mu > 0 ? 7300 : kind === "sirs" ? Math.max(1500, 6 * Wn) : 4000) : Math.max(given ?? 0, 4000);
    const ts = [0], ys = [[Math.max(0, 1 - vacc - i0), 0, i0, 0, i0, vacc]];
    let y = ys[0], t = 0, peakI = i0, peakT = 0, crossT = null, doneT = null;
    const reff = (tt, S) => (r0 * S * betaAt(tt)) / beta;
    while (t < tCap - 1e-9) {
      const h = Math.min(dt, tCap - t);
      const k1 = deriv(t, y);
      const k2 = deriv(t + h / 2, y.map((v, i) => v + (h / 2) * k1[i]));
      const k3 = deriv(t + h / 2, y.map((v, i) => v + (h / 2) * k2[i]));
      const k4 = deriv(t + h, y.map((v, i) => v + h * k3[i]));
      const prevReff = reff(t, y[0]);
      y = y.map((v, i) => Math.max(0, v + (h / 6) * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i])));
      t += h;
      ts.push(t);
      ys.push(y);
      if (y[2] > peakI) { peakI = y[2]; peakT = t; }
      const nowReff = reff(t, y[0]);
      if (crossT === null && prevReff > 1 && nowReff <= 1) crossT = t - h + (h * (prevReff - 1)) / (prevReff - nowReff || 1);
      // A closed epidemic is over once infection has all but gone, past its peak.
      if (!endemic && doneT === null && t >= (given ?? 0) && y[1] + y[2] < Math.max(0.01 * peakI, 1e-7) && (t > peakT + D || peakT === 0)) {
        doneT = t;
        break;
      }
    }
    // The peak between the samples: a parabola through the three around it.
    {
      const k = ts.findIndex((tt) => tt >= peakT);
      if (k > 0 && k < ys.length - 1) {
        const a = ys[k - 1][2], b = ys[k][2], c = ys[k + 1][2], h = ts[k] - ts[k - 1];
        const den = a - 2 * b + c;
        if (den < 0) {
          const off = (0.5 * h * (a - c)) / den;
          if (Math.abs(off) <= h) { peakT = ts[k] + off; peakI = b - ((a - c) * (a - c)) / (8 * den); }
        }
      }
    }
    // A peak is a turn: I must fall back after it (an SIS curve that climbs
    // to its level has none).
    let hasPeak = false;
    if (peakI > i0 * 1.01) {
      const k = ts.findIndex((tt) => tt >= peakT);
      for (let j = k; j < ys.length; j++) if (ys[j][2] < 0.97 * peakI) { hasPeak = true; break; }
    }
    const NICE = [30, 40, 50, 60, 80, 100, 120, 150, 200, 250, 300, 400, 500, 600, 800, 1000, 1200, 1500, 2000, 2500, 3000, 4000, 5000, 6000, 8000, 10000, 15000, 20000, 40000];
    const niceCeil = (v) => NICE.find((n) => n >= v - 1e-9) ?? 40000;
    const at = (tt) => {
      // The state at day tt, linearly between the steps.
      if (tt <= 0) return ys[0];
      if (tt >= ts[ts.length - 1]) return ys[ys.length - 1];
      let lo = 0, hi = ts.length - 1;
      while (hi - lo > 1) { const m = (lo + hi) >> 1; if (ts[m] <= tt) lo = m; else hi = m; }
      const f = (tt - ts[lo]) / (ts[hi] - ts[lo] || 1);
      return ys[lo].map((v, i) => v + f * (ys[hi][i] - v));
    };

    // Final size: the share ever infected. A closed model without an
    // intervention has the classic equation, S∞ = S0·exp(−R0·(1 − v − S∞));
    // otherwise it is read off the run's end.
    let finalSize = null, endemicI = null;
    if (!endemic) {
      if (!iv) {
        const S0 = ys[0][0];
        let lo = 0, hi = S0;
        for (let k = 0; k < 80; k++) {
          const m = (lo + hi) / 2;
          if (m - S0 * Math.exp(-r0 * (1 - vacc - m)) > 0) hi = m; else lo = m;
        }
        finalSize = 1 - vacc - (lo + hi) / 2;
      } else {
        finalSize = ys[ys.length - 1][4];
      }
    } else if (kind === "sis" && mu === 0) {
      endemicI = r0 > 1 ? 1 - 1 / r0 : 0;
    } else if (kind === "sirs" && mu === 0) {
      endemicI = r0 > 1 ? ((1 - 1 / r0) * omega) / (omega + gamma) : 0;
    } else if (kind !== "sirs") {
      endemicI = Math.max(0, (mu * (r0 * (1 - vacc) - 1)) / beta);
    } else {
      endemicI = ys[ys.length - 1][2];
    }
    const hit = r0 > 1 ? 1 - 1 / r0 : 0;
    // The time axis: to the end of a closed epidemic; an endemic one until
    // it has settled near its level (20 years with births).
    const settleT = (() => {
      if (endemicI === null) return null;
      const tol = Math.max(0.03 * endemicI, 1e-4);
      for (let j = ys.length - 1; j >= 0; j--) if (Math.abs(ys[j][2] - endemicI) > tol) return ts[Math.min(j + 1, ts.length - 1)];
      return 0;
    })();
    const horizon = given ?? (mu > 0 ? 7300 : endemic ? niceCeil(Math.max(hasPeak ? 3 * peakT : 0, (settleT ?? 0) * 1.15, 6 * D, 60)) : niceCeil(Math.max(doneT ?? t, 30)));

    // ── Geometry ──
    // A return flow (SIS, SIRS) hangs below the chain: the plot starts lower.
    const looped = kind === "sis" || kind === "sirs";
    const plot = { x0: 110, y0: 80, x1: 880, y1: looped ? 425 : 460 };
    const sx = (tt) => plot.x0 + (tt / horizon) * (plot.x1 - plot.x0);
    const sy = (f) => plot.y0 + f * (plot.y1 - plot.y0);
    const drawables = [], labels = [], anchors = {}, order = [], attached = {}, drawnWith = {}, groups = {};
    const push = (d, at) => { drawables.push(d); order.push(d.id); if (at) anchors[d.id] = at; };
    const label = (id, anchor, side, text, color, fontSize) => { labels.push(kit.label(id, anchor, side, text, { color, fontSize })); order.push(id); };
    const pct = (f) => kit.num(Math.round(f * 100), 0) + "%";
    const days = (v) => kit.num(Math.round(v), 0);
    const R0T = "R₀";

    // The flow diagram, across the top.
    const DEFAULT_FULL = { s: "Susceptible", e: "Exposed", i: "Infectious", r: "Recovered" };
    const codes = kind === "seir" ? ["S", "E", "I", "R"] : kind === "sis" ? ["S", "I"] : ["S", "I", "R"];
    const names = Array.isArray(params.labels) ? params.labels.map(String) : [];
    const BW = codes.length === 4 ? 112 : 124, BH = 80, CY = 600;
    const fx0 = 70 + BW / 2, fx1 = (codes.length === 4 ? 735 : codes.length === 2 ? 470 : 640) - BW / 2;
    const cx = codes.map((_, i) => (codes.length === 1 ? fx0 : fx0 + (i * (fx1 - fx0)) / (codes.length - 1)));
    codes.forEach((code, i) => {
      const slug = code.toLowerCase();
      const c = [cx[i], CY];
      push(kit.stroke("box_" + slug, kit.rect(c[0] - BW / 2, c[1] - BH / 2, BW, BH), { closed: true, shapeHint: { type: "rect", x: c[0] - BW / 2, y: c[1] - BH / 2, w: BW, h: BH }, color: C.ink, strokeWidth: 4, ms: MS.node }), c);
      push(kit.text("box_code_" + slug, [c[0], c[1] + 14], code, { fontSize: 30 }), [c[0], c[1] + 14]);
      const nm = typeof names[i] === "string" && names[i].trim() !== "" ? names[i] : DEFAULT_FULL[slug];
      push(kit.text("box_name_" + slug, [c[0], c[1] - 23], nm, { fontSize: Math.min(18, Math.floor((BW - 12) / Math.max(1, nm.length) / 0.55)), color: C.guide }), [c[0], c[1] - 23]);
      attached["box_" + slug] = ["box_code_" + slug, "box_name_" + slug];
      drawnWith["box_" + slug] = ["box_code_" + slug, "box_name_" + slug];
    });
    // Rates as numbers: β per day, and each stay as one over its days.
    const oneOver = (d) => "1/" + kit.num(Math.round(d * 10) / 10);
    const rateText = [];
    if (kind === "seir") rateText.push("β = " + kit.num(Math.round(beta * 100) / 100, 2), "σ = " + oneOver(Lat), "γ = " + oneOver(D));
    else if (kind === "sis") rateText.push("β = " + kit.num(Math.round(beta * 100) / 100, 2));
    else rateText.push("β = " + kit.num(Math.round(beta * 100) / 100, 2), "γ = " + oneOver(D));
    for (let i = 0; i < codes.length - 1; i++) {
      const a = [cx[i], CY], b = [cx[i + 1], CY];
      const { drawables: fd } = kit.edgeArrow("flow_" + i, a, b, { strokeWidth: 5, color: C.ink, ms: MS.arrow, shorten: { rect: [BW, BH] } });
      fd.forEach((d) => push(d));
      anchors["flow_" + i] = [(a[0] + b[0]) / 2, CY];
      const rp = [(a[0] + b[0]) / 2, CY + BH / 2 + 20];
      push(kit.text("rate_" + i, rp, rateText[i], { fontSize: 23, color: C.accent }), rp);
      attached["flow_" + i] = ["rate_" + i];
    }
    // A return flow below the chain: recovery back to S (SIS), waning (SIRS).
    if (kind === "sis" || kind === "sirs") {
      const from = [cx[codes.length - 1], CY - BH / 2], to = [cx[0], CY - BH / 2];
      // A shallow bow: about 38 units below the boxes, whatever the span.
      const { drawables: ld } = kit.edgeArrow("loop", from, to, { curve: 76 / Math.max(1, from[0] - to[0]), strokeWidth: 3.5, color: C.guide, ms: MS.connector, shorten: 6 });
      ld.forEach((d) => push(d));
      let low = ld[0].pts[0];
      for (const p of ld[0].pts) if (p[1] < low[1]) low = p;
      anchors.loop = low;
      const lt = kind === "sis" ? "γ = " + oneOver(D) : "ω = " + oneOver(Wn);
      // Inside the bow, between the loop and the box above it.
      push(kit.text("loop_label", [low[0], low[1] + 17], lt, { fontSize: 22, color: C.accent }), [low[0], low[1] + 17]);
      attached.loop = ["loop_label"];
    }

    // The readouts, top right: R0 (scrub it), herd immunity, vaccination.
    const RX = codes.length === 4 ? 790 : 700;
    push(kit.text("r0_value", [RX, 640], R0T + " = " + kit.num(Math.round(r0 * 100) / 100), { fontSize: 34, color: C.accent, anchor: "start" }), [RX + 60, 640]);
    const showHit = hasR && (params.show_hit === true || (params.show_hit !== false && typeof params.vaccinated === "number"));
    const showVax = hasR && typeof params.vaccinated === "number";
    if (showHit) {
      push(kit.text("hit_value", [RX, 597], kit.say({ en: "herd immunity ", nb: "flokkimmunitet " }) + pct(hit), { fontSize: 22, color: C.ink, anchor: "start" }), [RX + 80, 597]);
      // A bar for the population: filled as far as it is vaccinated, with a
      // tick where herd immunity begins.
      const bx0 = RX, bx1 = Math.min(975, RX + 240), by = 566, bh = 22;
      const kids = [kit.stroke("immunity_bar__box", kit.rect(bx0, by - bh / 2, bx1 - bx0, bh), { closed: true, color: C.guide, strokeWidth: 2, ms: MS.guides })];
      if (vacc > 0) kids.push(kit.area("immunity_bar__fill", kit.rect(bx0, by - bh / 2, (bx1 - bx0) * vacc, bh), C.region2, { opacity: 0.9 }));
      const hx = bx0 + (bx1 - bx0) * hit;
      kids.push(kit.stroke("immunity_bar__hit", [[hx, by - bh / 2 - 7], [hx, by + bh / 2 + 7]], { color: C.accent, strokeWidth: 3.5, ms: MS.guides }));
      push(kit.group("immunity_bar", kids), [(bx0 + bx1) / 2, by]);
      attached.immunity_bar = ["hit_value"];
    }
    if (showVax) {
      push(kit.text("vax_value", [RX, 534], kit.say({ en: "vaccinated ", nb: "vaksinert " }) + pct(vacc), { fontSize: 22, color: "#4f6f45", anchor: "start" }), [RX + 70, 534]);
    }

    // The plot.
    const xStep = (() => {
      const raw = horizon / 5;
      const p10 = 10 ** Math.floor(Math.log10(raw));
      for (const m of [1, 2, 2.5, 5, 10]) if (m * p10 >= raw - 1e-9) return m * p10;
      return 10 * p10;
    })();
    const axKids = [
      kit.stroke("axes__x", [[plot.x0 - 6, plot.y0], [plot.x1 + kit.AXIS_OVERHANG, plot.y0]], { arrowhead: "end", strokeWidth: 3.5, ms: MS.axis }),
      kit.stroke("axes__y", [[plot.x0, plot.y0 - 6], [plot.x0, plot.y1 + kit.AXIS_OVERHANG]], { arrowhead: "end", strokeWidth: 3.5, ms: MS.axis }),
      kit.text("axes__x_label", [plot.x1 + kit.AXIS_OVERHANG + 10, plot.y0], kit.say({ en: "days", nb: "dager" }), { fontSize: 22, color: C.ink, anchor: "start" }),
      kit.text("axes__y_label", [plot.x0 - 10, plot.y1 + kit.AXIS_OVERHANG + 20], kit.say({ en: "share of people", nb: "andel av folket" }), { fontSize: 22, color: C.ink, anchor: "start" }),
    ];
    for (let v = 0, k = 0; v <= horizon + 1e-9 && k < 12; v += xStep, k++) {
      axKids.push(kit.stroke("axes__xt" + k, [[sx(v), plot.y0], [sx(v), plot.y0 - 8]], { color: C.ink, strokeWidth: 2, ms: MS.guides }));
      axKids.push(kit.text("axes__xn" + k, [sx(v), plot.y0 - 25], kit.num(Math.round(v * 10) / 10), { fontSize: 20, color: C.ink }));
    }
    [0, 0.5, 1].forEach((f, k) => {
      axKids.push(kit.stroke("axes__yt" + k, [[plot.x0, sy(f)], [plot.x0 - 8, sy(f)]], { color: C.ink, strokeWidth: 2, ms: MS.guides }));
      axKids.push(kit.text("axes__yn" + k, [plot.x0 - 14, sy(f)], pct(f), { fontSize: 20, color: C.ink, anchor: "end" }));
    });
    push(kit.group("axes", axKids), [plot.x0, plot.y0]);

    // The intervention: a band over its days, under everything else.
    if (iv) {
      const a = sx(Math.min(iv.start, horizon)), b = sx(Math.min(iv.end, horizon));
      const w = Math.max(2, b - a);
      push(kit.area("intervention", kit.rect(a, plot.y0, w, plot.y1 - plot.y0), C.region1, { opacity: 0.3 }), [a + w / 2, plot.y1]);
      const lt = kit.say({ en: "contacts ", nb: "kontakter " }) + "−" + pct(iv.cut);
      // Its label at the height in the band farthest from every curve.
      const tm = (Math.min(iv.start, horizon) + Math.min(iv.end, horizon)) / 2;
      const probe = [Math.min(iv.start, horizon), tm, Math.min(iv.end, horizon)].map((tt) => at(tt));
      const cols = (Array.isArray(params.curves) && params.curves.length > 0 ? params.curves.map((c) => String(c).toLowerCase()) : ["s", "e", "i", "r"]).map((c) => ({ s: 0, e: 1, i: 2, r: 3 })[c]).filter((k) => k !== undefined && (k !== 1 || kind === "seir") && (k !== 3 || hasR));
      let bestF = 0.93, bestGap = -1;
      for (const f of [0.93, 0.8, 0.66, 0.5, 0.34, 0.2, 0.07]) {
        let gap = Infinity;
        for (const st of probe) for (const k of cols) gap = Math.min(gap, Math.abs(st[k] - f));
        if (gap > bestGap + 0.02) { bestGap = gap; bestF = f; }
      }
      push(kit.text("intervention_label", [a + w / 2, sy(bestF)], lt, { fontSize: 20, color: C.ink }), [a + w / 2, sy(bestF)]);
      attached.intervention = ["intervention_label"];
      drawnWith.intervention = ["intervention_label"];
    }

    const nV = mu > 0 || omega > 0 ? 121 : 2;
    const samplesV = Array.from({ length: nV }, (_, k) => (k / (nV - 1)) * horizon);
    // The vaccinated: a band hanging from 100 %, as deep as they are. Its
    // lower edge below the dashed 1/R0 line is herd immunity.
    if (hasR && typeof params.vaccinated === "number") {
      const top = samplesV.map((tt) => [sx(tt), sy(1)]);
      const bottom = samplesV.map((tt) => [sx(tt), sy(1 - at(tt)[5])]).reverse();
      push(kit.area("vaccinated_band", [...top, ...bottom], C.region2, { opacity: 0.3 }), [sx(horizon * 0.5), sy(1 - vacc / 2)]);
      if (plot.y1 - sy(1 - vacc) >= 30) {
        const vy = sy(1 - Math.min(vacc, 0.5) / 2);
        push(kit.text("vaccinated_label", [plot.x0 + 16, vy], kit.say({ en: "vaccinated", nb: "vaksinert" }), { fontSize: 22, color: "#4f6f45", anchor: "start" }), [plot.x0 + 70, vy]);
        attached.vaccinated_band = ["vaccinated_label"];
        drawnWith.vaccinated_band = ["vaccinated_label"];
      }
    }

    // Herd-immunity threshold on the S axis: S = 1/R0, where Rt = 1.
    if (r0 > 1 && params.show_threshold !== false) {
      const ty = sy(1 / r0);
      push(kit.stroke("threshold", [[plot.x0, ty], [plot.x1, ty]], { color: C.accent, dash: true, strokeWidth: 2.5, ms: MS.guides }), [plot.x1, ty]);
      // Clear of the axis name "days" when the line runs low (a large R0).
      const tly = Math.max(ty, plot.y0 + 36);
      push(kit.text("threshold_label", [plot.x1 + 8, tly], "1/" + R0T, { fontSize: 22, color: C.accent, anchor: "start" }), [plot.x1 + 8, tly]);
      attached.threshold = ["threshold_label"];
      drawnWith.threshold = ["threshold_label"];
    }

    // The curves, sampled across the horizon.
    const COLOR = { s: C.supply, e: C.shifted, i: C.demand, r: "#5d7f52" };
    const IDX = { s: 0, e: 1, i: 2, r: 3 };
    const want = Array.isArray(params.curves) && params.curves.length > 0 ? params.curves.map((c) => String(c).toLowerCase()) : codes.map((c) => c.toLowerCase());
    const shown = codes.map((c) => c.toLowerCase()).filter((c) => want.includes(c));
    const NS = 240;
    const samples = Array.from({ length: NS + 1 }, (_, k) => (k / NS) * horizon);
    const curveSamples = {};
    shown.forEach((c) => {
      const pts = samples.map((tt) => [sx(tt), sy(at(tt)[IDX[c]])]);
      push(kit.stroke("curve_" + c, pts, { color: COLOR[c], strokeWidth: c === "i" ? 5 : 4, ms: MS.curve }), pts[pts.length - 1]);
      curveSamples["curve_" + c] = pts;
    });
    // Their names: S where it starts, I at its peak, E and R where they end.
    const peakIn = hasPeak && peakT <= horizon;
    shown.forEach((c) => {
      const pts = curveSamples["curve_" + c];
      let a = pts[pts.length - 1], side = "right";
      if (c === "s") { a = pts[Math.round(NS * 0.04)]; side = "above-right"; }
      if (c === "i" && peakIn) { a = [sx(peakT), sy(peakI)]; side = peakI < 0.12 ? "left" : "above-left"; }
      label("label_" + c, a, side, c.toUpperCase(), COLOR[c], 27);
      attached["curve_" + c] = ["label_" + c];
      drawnWith["curve_" + c] = ["label_" + c];
    });

    // The peak: a dot on I and a guide down to its day.
    if (peakIn && shown.includes("i") && params.show_peak !== false) {
      const pp = [sx(peakT), sy(peakI)];
      push(kit.stroke("peak_guide", [pp, [pp[0], plot.y0]], { color: C.guide, dash: true, strokeWidth: 2.5, ms: MS.guides }), [pp[0], plot.y0]);
      push(kit.stroke("peak", [pp], { shapeHint: { type: "circle", c: pp, r: 8 }, strokeWidth: 3, fill: C.demand, color: C.demand, ms: MS.dot }), pp);
      label("peak_label", pp, peakI < 0.12 ? "above" : "above-right", kit.say({ en: "peak, day ", nb: "topp, dag " }) + days(peakT), C.demand, 22);
      attached.peak = ["peak_label", "peak_guide"];
      drawnWith.peak = ["peak_guide", "peak_label"];
    }

    // A time cursor: the state on its day, and Rt.
    const values = {
      r0: Math.round(r0 * 100) / 100,
      beta: Math.round(beta * 1e4) / 1e4,
      gamma: Math.round(gamma * 1e4) / 1e4,
      infectious_days: D,
      hit: Math.round(hit * 1e4) / 100,
      vaccinated: Math.round(vacc * 1e4) / 100,
      r_eff0: Math.round(r0 * ys[0][0] * 100) / 100,
      days: horizon,
    };
    if (kind === "seir") { values.sigma = Math.round(sigma * 1e4) / 1e4; values.latent_days = Lat; }
    if (kind === "sirs") { values.omega = Math.round(omega * 1e5) / 1e5; values.immunity_days = Wn; }
    if (hasPeak) { values.peak_day = Math.round(peakT * 10) / 10; values.peak_i = Math.round(peakI * 1e4) / 100; }
    else if (!endemic) { values.peak_day = 0; values.peak_i = Math.round(i0 * 1e4) / 100; }
    if (crossT !== null) values.cross_day = Math.round(crossT * 10) / 10;
    if (finalSize !== null) values.final_size = Math.round(finalSize * 1e4) / 100;
    if (endemicI !== null) values.endemic_i = Math.round(endemicI * 1e6) / 1e4;
    const cDay = typeof params.cursor_day === "number" && Number.isFinite(params.cursor_day) ? clamp(params.cursor_day, 0, horizon) : null;
    const st = at(cDay ?? 0);
    values.r_eff = Math.round(reff(cDay ?? 0, st[0]) * 100) / 100;
    if (cDay !== null) {
      values.day = Math.round(cDay * 10) / 10;
      values.s_at = Math.round(st[0] * 1e4) / 100;
      values.i_at = Math.round(st[2] * 1e4) / 100;
      if (kind === "seir") values.e_at = Math.round(st[1] * 1e4) / 100;
      if (hasR) values.r_at = Math.round(st[3] * 1e4) / 100;
      if (hasR && vacc > 0) values.v_at = Math.round(st[5] * 1e4) / 100;
      const x = sx(cDay);
      const kids = [kit.stroke("cursor__line", [[x, plot.y0], [x, plot.y1 + 6]], { color: C.ink, strokeWidth: 2.5, ms: MS.guides })];
      shown.forEach((c) => {
        const p = [x, sy(st[IDX[c]])];
        kids.push(kit.stroke("cursor__dot_" + c, [p], { shapeHint: { type: "circle", c: p, r: 6 }, strokeWidth: 2, fill: COLOR[c], color: COLOR[c], ms: MS.dot }));
      });
      push(kit.group("cursor", kids), [x, plot.y1]);
      // The readout above the plot: the day and Rt, then each compartment.
      const rt = reff(cDay, st[0]);
      const parts = [["cursor_day_label", kit.say({ en: "day ", nb: "dag " }) + kit.num(Math.round(cDay * 10) / 10), C.ink], ["cursor_rt", "Rₜ = " + kit.num(Math.round(rt * 100) / 100, 2), C.accent]];
      shown.forEach((c) => parts.push(["cursor_" + c, c.toUpperCase() + " " + pct(st[IDX[c]]), COLOR[c]]));
      const widths = parts.map(([, s]) => kit.textWidth(s, 23));
      const total = widths.reduce((a, b) => a + b, 0) + 14 * (parts.length - 1);
      // Clear of the y axis's name, which stands at the same height.
      const yName = kit.say({ en: "share of people", nb: "andel av folket" });
      let x0 = clamp(x - total / 2, plot.x0 + 10 + kit.textWidth(yName, 22) + 36, 975 - total);
      const ry = plot.y1 + 38;
      // Each number is its own element (cursor_rt, cursor_s …), named
      // together as cursor_readout; they come and go with the cursor.
      const rids = parts.map(([id, s, col], k) => {
        push(kit.text(id, [x0, ry], s, { fontSize: 23, color: col, anchor: "start" }), [x0 + widths[k] / 2, ry]);
        x0 += widths[k] + 14;
        return id;
      });
      groups.cursor_readout = rids;
      attached.cursor = rids;
      drawnWith.cursor = rids;
    }
    for (const k of Object.keys(values)) if (!Number.isFinite(values[k])) delete values[k];

    return { drawables, labels, anchors, order, attached, drawnWith, groups, values, curveSamples, frame: { x: [0, horizon], y: [0, 100], box: plot } };
  }

  const C = kit.COLORS, MS = kit.SKETCH_MS;
  function slugify(name) { return String(name).toLowerCase().replace(/[^a-z0-9]/g, "_") || "c"; }
  const DEFAULT_FULL = { s: "Susceptible", e: "Exposed", i: "Infectious", r: "Recovered", d: "Deceased" };
  const DEFAULT_RATES = ["β", "γ", "σ", "μ", "δ"];

  const compartmentsIn = Array.isArray(params.compartments) && params.compartments.length >= 2
    ? params.compartments.slice(0, 5).map(String)
    : ["S", "I", "R"];
  const n = compartmentsIn.length;
  const labelsIn = Array.isArray(params.labels) ? params.labels.map(String) : [];
  const ratesIn = Array.isArray(params.rates) ? params.rates.map(String) : [];

  function fullLabel(i, code) {
    if (typeof labelsIn[i] === "string" && labelsIn[i].trim() !== "") return labelsIn[i];
    const key = String(code).toLowerCase();
    return DEFAULT_FULL[key] || String(code);
  }

  const CHAIN_Y = 400;
  const positions = kit.layoutNodes(compartmentsIn, [], { style: "chain", x: 80, y: 395, w: 840, h: 10 });

  const drawables = [], labels = [], anchors = {}, order = [];
  const attached = {};
  const push = (d) => { drawables.push(d); order.push(d.id); };
  const label = (id, anchor, side, text, color, fontSize) => {
    labels.push(kit.label(id, anchor, side, text, { color, fontSize }));
    order.push(id);
  };

  // Duplicate compartment codes (e.g. two "S"s) would otherwise both slugify
  // to the same box_<slug> id and collide — suffix repeats to keep every id
  // unique.
  const slugCounts = {};
  function uniqueSlug(code) {
    const base = slugify(code);
    const n = (slugCounts[base] = (slugCounts[base] || 0) + 1);
    return n === 1 ? base : base + "_" + n;
  }

  const W = 150, H = 90;
  compartmentsIn.forEach((code, i) => {
    const slug = uniqueSlug(code);
    const c = positions[code];
    const pts = [[c[0] - W / 2, c[1] - H / 2], [c[0] + W / 2, c[1] - H / 2], [c[0] + W / 2, c[1] + H / 2], [c[0] - W / 2, c[1] + H / 2]];
    push(kit.stroke("box_" + slug, pts, { closed: true, shapeHint: { type: "rect", x: c[0] - W / 2, y: c[1] - H / 2, w: W, h: H }, color: C.ink, strokeWidth: 4, ms: MS.node }));
    anchors["box_" + slug] = c;
    // The code (S/E/I/R…) reads big and bold inside the box — sized to
    // ~1/3 of the box's height so it holds its own against the 4px stroke.
    // The full descriptive name is a smaller caption below.
    push(kit.text("box_code_" + slug, c, String(code), { fontSize: 30 }));
    label("box_name_" + slug, [c[0], c[1] - H / 2 - 8], "below", fullLabel(i, code), C.guide, 20);
  });

  for (let i = 0; i < n - 1; i++) {
    const a = positions[compartmentsIn[i]];
    const b = positions[compartmentsIn[i + 1]];
    const id = "flow_" + i;
    const { drawables: flowDrawables } = kit.edgeArrow(id, a, b, { strokeWidth: 5.5, color: C.ink, ms: MS.arrow, shorten: { rect: [W, H] } });
    flowDrawables.forEach(push);
    const midX = (a[0] + b[0]) / 2, midY = (a[1] + b[1]) / 2;
    anchors[id] = [midX, midY];
    const rateText = ratesIn[i] || DEFAULT_RATES[i % DEFAULT_RATES.length];
    label("rate_" + i, [midX, CHAIN_Y + H / 2 + 30], "above", rateText, C.accent, 22);
  }

  const loopParam = params.show_loop && typeof params.show_loop === "object" ? params.show_loop : null;
  if (
    loopParam &&
    typeof loopParam.from === "string" &&
    typeof loopParam.to === "string" &&
    positions[loopParam.from] &&
    positions[loopParam.to] &&
    loopParam.from !== loopParam.to
  ) {
    const a = positions[loopParam.from];
    const b = positions[loopParam.to];
    const fromPt = [a[0], a[1] - H / 2];
    const toPt = [b[0], b[1] - H / 2];
    const dirSign = (toPt[0] - fromPt[0]) >= 0 ? 1 : -1;
    const curveVal = -dirSign * 0.35;
    const { drawables: loopDrawables } = kit.edgeArrow("loop", fromPt, toPt, { curve: curveVal, strokeWidth: 3.5, color: C.guide, ms: MS.connector, shorten: 8 });
    loopDrawables.forEach(push);
    const mainPts = loopDrawables[0].pts;
    let lowest = mainPts[0];
    for (const p of mainPts) { if (p[1] < lowest[1]) lowest = p; }
    anchors.loop = lowest;
    const loopText = typeof loopParam.label === "string" && loopParam.label.trim() !== "" ? loopParam.label : "Waning immunity";
    label("loop_label", lowest, "below", loopText, C.guide, 20);
    attached["loop"] = [...(attached["loop"] ?? []), "loop_label"];
  }

  return { drawables, labels, anchors, order, attached };
widget: |
  // Free play (2026-09-28), in model mode only (`model` or `r0` set) — the
  // flow diagram alone has nothing to work. While paused the viewer takes
  // hold of the model's numbers and the whole figure recomputes:
  //
  //   R₀ = 2.5 (r0_value)          drag sideways: 0.1 per 4 units; tap: type it
  //   β on the S→ arrow (rate_0)   0.01 per step; R₀ follows (γ held)
  //   γ = 1/10, σ = 1/5, ω = 1/180 the days of that stay, 1 per step (ω: 5);
  //   (rate_i, loop_label)         β is held, so a longer infectious stay
  //                                raises R₀ — as it does
  //   vaccinated 40% (vax_value)   1 % per step
  //   contacts −40%                the intervention's cut, 1 % per step
  //   the intervention band        drag it along the days; near an edge,
  //                                that edge alone
  //   the vaccinated band          drag up or down: its lower edge is the
  //                                share vaccinated (whole percents)
  //   the cursor, or blank plot    drag: the day it reads (whole days)
  //
  // While a drag is in flight the time axis holds still (the press-time
  // `days`); on release it is the author's again (fitted when they gave
  // none), so a slower epidemic is seen whole.
  const STEP_UNITS = 4;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const num = (v, d) => (typeof v === "number" && Number.isFinite(v) ? v : d);
  const fix = (v, d) => Number(v.toFixed(d));
  const NUMBERS = ["r0_value", "rate_0", "rate_1", "rate_2", "loop_label", "vax_value", "intervention_label"];
  const isModel = (p) => typeof p.model === "string" || typeof p.r0 === "number";
  const kindOf = (p) => (["sir", "seir", "sis", "sirs"].includes(p.model) ? p.model : "sir");
  // The model's numbers, with the layout's own defaults and bounds.
  const model = (p) => {
    const kind = kindOf(p);
    const r0 = clamp(num(p.r0, 2.5), 0.1, 20);
    const D = clamp(num(p.infectious_days, 10), 0.5, 365);
    const Lat = clamp(num(p.latent_days, 5), 0.2, 365);
    const mu = typeof p.lifespan_years === "number" && p.lifespan_years > 0 ? 1 / (clamp(p.lifespan_years, 1, 200) * 365) : 0;
    const sigma = 1 / Lat;
    // β per unit of R0: R0 = β/(γ+μ), times σ/(σ+μ) with a latent stay.
    const per = (d, l) => (kind === "seir" ? ((1 / d + mu) * (1 / l + mu)) / (1 / l) : 1 / d + mu);
    return { kind, r0, D, Lat, W: clamp(num(p.immunity_days, 180), 5, 36500), per, beta: r0 * per(D, Lat) };
  };
  // Which stay a rate label is the number of.
  const stayOf = (id, kind) => {
    if (kind === "seir") return id === "rate_1" ? "latent_days" : id === "rate_2" ? "infectious_days" : null;
    if (kind === "sis") return id === "loop_label" ? "infectious_days" : null;
    if (id === "rate_1") return "infectious_days";
    return kind === "sirs" && id === "loop_label" ? "immunity_days" : null;
  };
  const intervention = (p) => {
    const iv = p.intervention && typeof p.intervention === "object" && !Array.isArray(p.intervention) ? p.intervention : null;
    if (!iv) return null;
    const start = Math.max(0, num(iv.start, 20));
    return { start, end: Math.max(start, num(iv.end, start + 30)), reduction: clamp(num(iv.reduction, 0.4), 0, 1) };
  };
  // The horizon as painted: the curves run to its last day.
  const horizonOf = (scene) => {
    for (const id of ["curve_i", "curve_s", "curve_r", "curve_e"]) {
      const ln = scene.lines.get(id);
      const last = ln && ln[0] && ln[0][ln[0].length - 1];
      const d = last ? scene.toDomain(last) : null;
      if (d) return Math.round(d[0]);
    }
    return num(scene.params.days, 100);
  };
  // A stay's new days, holding β: R0 moves with it.
  const withStay = (p, key, days) => {
    const m = model(p);
    const D = key === "infectious_days" ? days : m.D;
    const L = key === "latent_days" ? days : m.Lat;
    const patch = { [key]: days };
    if (key !== "immunity_days") patch.r0 = fix(m.beta / m.per(D, L), 3);
    return patch;
  };
  // What the number `id` becomes at value v (in its own units).
  const setNumber = (id, v, p) => {
    const m = model(p);
    if (id === "r0_value") return { r0: fix(clamp(v, 0.1, 20), 2) };
    if (id === "rate_0") return { r0: fix(clamp(v * (m.r0 / m.beta), 0.1, 20), 3) };
    if (id === "vax_value") return { vaccinated: fix(clamp(v, 0, 1), 4) };
    if (id === "intervention_label") {
      const iv = intervention(p);
      return iv ? { intervention: { ...p.intervention, reduction: fix(clamp(v, 0, 1), 4) } } : {};
    }
    const key = stayOf(id, m.kind);
    return key ? withStay(p, key, v) : {};
  };
  const current = (id, p) => {
    const m = model(p);
    if (id === "r0_value") return m.r0;
    if (id === "rate_0") return m.beta;
    if (id === "vax_value") return clamp(num(p.vaccinated, 0), 0, 1);
    if (id === "intervention_label") return intervention(p)?.reduction ?? 0;
    const key = stayOf(id, m.kind);
    return key === "latent_days" ? m.Lat : key === "immunity_days" ? m.W : m.D;
  };
  const scrubbed = (id, p, n) => {
    const v0 = current(id, p);
    if (id === "r0_value") return setNumber(id, fix(v0 + 0.1 * n, 1), p);
    if (id === "rate_0") return setNumber(id, Math.max(0.01, fix(v0 + 0.01 * n, 2)), p);
    if (id === "vax_value" || id === "intervention_label") return setNumber(id, fix(v0 + 0.01 * n, 2), p);
    const key = stayOf(id, model(p).kind);
    if (!key) return {};
    const step = key === "immunity_days" ? 5 : v0 < 4 ? 0.5 : 1;
    const lo = key === "immunity_days" ? 5 : 0.5;
    return setNumber(id, clamp(fix(v0 + step * n, 1), lo, key === "immunity_days" ? 3650 : 60), p);
  };
  const none = (state) => ({ state, effects: [] });

  const init = (scene) => ({ days0: scene.params.days });
  const on = (ev, st, scene) => {
    const state = st ?? { days0: undefined };
    const p = scene.params;
    if (!isModel(p)) return none(state);
    if (ev.type === "input") {
      if (!NUMBERS.includes(ev.id)) return none(state);
      const pctField = ev.id === "vax_value" || ev.id === "intervention_label";
      const patch = setNumber(ev.id, pctField ? ev.value / 100 : ev.value, p);
      return Object.keys(patch).length ? { state, effects: [{ patch }] } : none(state);
    }
    if ((ev.type !== "drag_move" && ev.type !== "drag") || !ev.from) return none(state);
    let patch = null;
    const H = horizonOf(scene);
    if (NUMBERS.includes(ev.id)) {
      const dx = ev.point[0] - ev.from[0];
      patch = scrubbed(ev.id, p, Math.trunc(dx / STEP_UNITS + (dx >= 0 ? 1e-6 : -1e-6)));
    } else if ((ev.id === "vaccinated_band" || ev.id === "vaccinated_label") && ev.domain) {
      patch = { vaccinated: clamp(Math.round(100 - ev.domain[1]) / 100, 0, 0.99) };
    } else if ((ev.id === "cursor" || ev.id === "__surface") && ev.domain) {
      patch = { cursor_day: clamp(Math.round(ev.domain[0]), 0, H) };
    } else if (ev.id === "intervention" && ev.domain && ev.fromDomain) {
      const iv = intervention(p);
      if (!iv) return none(state);
      const d = Math.round(ev.domain[0] - ev.fromDomain[0]);
      const edge = Math.max(1, 0.03 * H);
      const x0 = ev.fromDomain[0];
      let { start, end } = iv;
      if (Math.abs(x0 - iv.start) <= edge && Math.abs(x0 - iv.start) <= Math.abs(x0 - iv.end)) start = clamp(iv.start + d, 0, iv.end - 1);
      else if (Math.abs(x0 - iv.end) <= edge) end = clamp(iv.end + d, iv.start + 1, Math.max(H, iv.end));
      else {
        const dd = clamp(d, -iv.start, Math.max(0, H - iv.end));
        start = iv.start + dd;
        end = iv.end + dd;
      }
      patch = { intervention: { ...p.intervention, start, end } };
    }
    if (!patch || Object.keys(patch).length === 0) return none(state);
    // The axis holds still under the finger; the release gives it back.
    patch.days = ev.type === "drag_move" ? H : state.days0;
    return { state, effects: [{ patch }] };
  };
  const editable = (id, point, scene) => {
    const p = scene.params;
    if (!isModel(p) || !NUMBERS.includes(id)) return null;
    const v = current(id, p);
    if (id === "r0_value") return { value: fix(v, 2), label: kit.say({ en: "Basic reproduction number R0", nb: "Basisreproduksjonstall R0" }), min: 0.1, max: 20, step: 0.1 };
    if (id === "rate_0") return { value: fix(v, 3), label: kit.say({ en: "Transmission rate β per day", nb: "Smitterate β per dag" }), min: 0.001, max: 20, step: 0.01 };
    if (id === "vax_value") return { value: fix(v * 100, 1), label: kit.say({ en: "Vaccinated, percent", nb: "Vaksinert, prosent" }), min: 0, max: 100, step: 1 };
    if (id === "intervention_label") return intervention(p) ? { value: fix(v * 100, 1), label: kit.say({ en: "Contacts cut, percent", nb: "Kontakter kuttet, prosent" }), min: 0, max: 100, step: 1 } : null;
    const key = stayOf(id, model(p).kind);
    if (!key) return null;
    const what = key === "latent_days" ? { en: "Days latent", nb: "Dager latent" } : key === "immunity_days" ? { en: "Days immune", nb: "Dager immun" } : { en: "Days infectious", nb: "Dager smittsom" };
    return { value: fix(v, 1), label: kit.say(what), min: key === "immunity_days" ? 5 : 0.5, max: key === "immunity_days" ? 36500 : 365, step: key === "immunity_days" ? 5 : 0.5 };
  };
  const parts = (scene) => (isModel(scene.params) ? [...NUMBERS, "cursor", "vaccinated_label", "vaccinated_band", "intervention"].filter((id) => scene.ids.includes(id)) : []);
  // The plot's own paper: a press there reads the day under it.
  const surface = (scene) => {
    if (!isModel(scene.params) || !scene.ids.includes("axes")) return null;
    const H = horizonOf(scene);
    const a = scene.toLogical([0, 0]), b = scene.toLogical([H, 100]);
    return { x: Math.min(a[0], b[0]), y: Math.min(a[1], b[1]), w: Math.abs(b[0] - a[0]), h: Math.abs(b[1] - a[1]) };
  };
  return { init, on, editable, parts, surface, live: true };
---
template: reed_frost
interaction: "Scrub N, p or R0; tap 'new runs' for fresh outbreaks under the same rule."
title: Reed–Frost chain-binomial outbreaks
version: 1
kit: 11
status: ready
description: >-
  The Reed–Frost chain-binomial epidemic in a small group: generation by
  generation, each susceptible escapes each case independently with
  probability 1 − p, so the next generation's cases are Binomial(S, 1 − (1 −
  p)^C). Left, a set of simulated outbreaks as lines of people infected so far
  against generation — grey the ones that fizzled, red the ones that took
  off — and the expected (average) path; right, the EXACT distribution of the
  final number infected as sideways bars on the same axis, split at its dip
  into "fizzles" and "takes off" with each one's probability. Choose this
  scene for ANY request about the Reed–Frost model, chain binomial, stochastic
  or random outbreaks, why some outbreaks die out while others explode, minor
  versus major outbreaks, extinction probability, or an outbreak in a
  household, class, ship or village. Give R0 or p: R0 ≈ p·(N − 1). p, r0,
  population and seed animate (seed in whole steps draws new outbreaks; the
  same seed always draws the same ones). Paused, the viewer scrubs or taps N,
  p and R0 in the header, and taps "new runs" for another set. Values:
  {reed_frost.r0}, {reed_frost.p}, {reed_frost.p_minor} and
  {reed_frost.p_major} (% exact; absent with {reed_frost.split} 0, a small
  group near threshold whose totals have no dip to split at — then all is
  one colour and neither side is named), {reed_frost.p_minor_bp} (% by the
  branching-process approximation), {reed_frost.p_no_spread} (% that the
  first case infects nobody), {reed_frost.mean_final} and
  {reed_frost.mean_major} (people), {reed_frost.cutoff},
  {reed_frost.runs_major} and {reed_frost.runs_minor} (of the drawn runs),
  {reed_frost.expected_1} {reed_frost.expected_2} (expected new cases in
  generation 1, 2).
params:
  type: object
  properties:
    population:
      type: integer
      description: "People in the group, N, 2–100 (default 30), the first cases included."
    p:
      type: number
      description: "The chance that one case infects one given susceptible in a generation, 0–1. Wins over r0."
    r0:
      type: number
      description: "Instead of p: the expected cases one case causes in a group with no immunity, p = r0/(N − 1) (default 2)."
    initial:
      type: integer
      description: "Cases in generation 0 (default 1)."
    runs:
      type: integer
      description: "Simulated outbreaks drawn, 0–40 (default 12)."
    seed:
      type: integer
      description: "Which random outbreaks (default 1). The same seed draws the same ones; animate it in whole steps for new ones."
    generations:
      type: integer
      description: "Generations on the axis (default fitted). Give it when you animate p, r0 or population, so the axis holds still."
    show_expected:
      type: boolean
      description: "The dashed average path (default true)."
    show_distribution:
      type: boolean
      description: "The exact final-size bars on the right (default true)."
element_ids:
  n_value: "the N = 30 readout in the header"
  p_value: "the p = 0.069 readout"
  r0_value: "the R₀ ≈ 2 readout"
  rerun: "the new runs button (a tap draws new outbreaks)"
  axes: "the axes: generation, and infected so far (0 to N)"
  run_<k>: "the k-th simulated outbreak, k = 1…runs (group runs; runs_minor and runs_major split them)"
  expected: "the dashed average path (drawn with its label expected_label)"
  cutoff: "the dashed line across the bars between the fizzled totals and the ones that took off"
  dist_minor: "the bars of the final totals that count as fizzling (all the bars when there is no split)"
  dist_major: "the bars of the totals that count as taking off"
  dist_axis: "the distribution panel's base line, with its caption"
  minor_label: "the fizzles 21% label (drawn with dist_minor)"
  major_label: "the takes off 79% label (drawn with dist_major)"
examples:
  - request: "Why do some outbreaks fizzle out while others explode?"
    params: { population: 30, r0: 2, runs: 12 }
  - request: "Show the Reed–Frost chain binomial model for a household of 5 with p = 0.3."
    params: { population: 5, p: 0.3, runs: 10 }
lint: |
  const out = [];
  const N = typeof params.population === "number" ? params.population : 30;
  if (typeof params.population === "number" && (params.population < 2 || params.population > 100)) out.push({ severity: params.population < 2 ? "error" : "warn", message: "population " + params.population + " is drawn clamped to 2–100 (the exact distribution is for small groups)" });
  if (typeof params.p === "number" && (params.p < 0 || params.p > 1)) out.push({ severity: "error", message: "p is a probability from 0 to 1, got " + params.p });
  if (typeof params.p === "number" && typeof params.r0 === "number") out.push({ severity: "warn", message: "give p or r0, not both: p wins, r0 is ignored" });
  if (typeof params.p !== "number" && typeof params.r0 === "number" && params.r0 / Math.max(1, Math.min(100, N) - 1) > 1) out.push({ severity: "error", message: "r0 " + params.r0 + " in a group of " + N + " needs p = " + (params.r0 / (N - 1)).toFixed(2) + ", above 1 — use a smaller r0 or a larger population" });
  if (typeof params.initial === "number" && params.initial >= Math.min(100, Math.max(2, N))) out.push({ severity: "error", message: "initial (" + params.initial + ") must be below population (" + N + ")" });
  if (typeof params.runs === "number" && params.runs > 40) out.push({ severity: "warn", message: "runs " + params.runs + " is drawn as 40" });
  return out;
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const num = (v, d) => (typeof v === "number" && Number.isFinite(v) ? v : d);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const N = Math.round(clamp(num(params.population, 30), 2, 100));
  const I0 = Math.round(clamp(num(params.initial, 1), 1, N - 1));
  const p = typeof params.p === "number" && Number.isFinite(params.p) ? clamp(params.p, 0, 1) : clamp(num(params.r0, 2) / (N - 1), 0, 1);
  const q = 1 - p;
  const R0 = p * (N - 1);
  const nRuns = Math.round(clamp(num(params.runs, 12), 0, 40));
  const seed = Math.floor(num(params.seed, 1));
  const showExp = params.show_expected !== false;
  const showDist = params.show_distribution !== false;

  // ── The exact chain binomial ──
  // A state is (S, C): susceptibles left, and cases this generation. From
  // it, j new cases with Binomial(S, 1 − q^C); j = 0 ends the outbreak with
  // N − S infected. Carried generation by generation (for the expected
  // path) until no probability is left in play.
  const lf = [0];
  for (let k = 1; k <= N; k++) lf[k] = lf[k - 1] + Math.log(k);
  const pmf = (s, pi) => {
    const out = new Array(s + 1).fill(0);
    if (pi <= 0) { out[0] = 1; return out; }
    if (pi >= 1) { out[s] = 1; return out; }
    const a = Math.log(pi), b = Math.log(1 - pi);
    for (let j = 0; j <= s; j++) out[j] = Math.exp(lf[s] - lf[j] - lf[s - j] + j * a + (s - j) * b);
    return out;
  };
  const final = new Array(N + 1).fill(0);
  const expCum = [];
  let active = new Map([[(N - I0) * (N + 1) + I0, 1]]);
  let absorbedMean = 0;
  // A state's binomial row, computed once however many generations reach it.
  const memo = new Map();
  for (let t = 0; t <= N + 1; t++) {
    let e = absorbedMean, mass = 0;
    for (const [key, m] of active) { e += m * (N - Math.floor(key / (N + 1))); mass += m; }
    expCum.push(e);
    if (mass < 1e-12) break;
    const next = new Map();
    for (const [key, m] of active) {
      const s = Math.floor(key / (N + 1)), c = key % (N + 1);
      let w = memo.get(key);
      if (!w) { w = pmf(s, 1 - Math.pow(q, c)); memo.set(key, w); }
      for (let j = 0; j <= s; j++) {
        const mw = m * w[j];
        if (mw < 1e-14) continue;
        if (j === 0) { final[N - s] += mw; absorbedMean += mw * (N - s); }
        else { const k2 = (s - j) * (N + 1) + j; next.set(k2, (next.get(k2) ?? 0) + mw); }
      }
    }
    active = next;
  }
  const total = final.reduce((a, b) => a + b, 0) || 1;
  for (let k = 0; k <= N; k++) final[k] /= total;

  // Where "fizzled" ends: the dip between the two humps of the final-size
  // distribution. Below threshold (R0 ≤ 1) all fizzle; one hump far from
  // the start: all but "nobody infected" take off. One hump near the start
  // with R0 above 1 (a small group near threshold) has no honest split: the
  // figure then draws one colour and names no side (split: 0).
  let cutoff = N, split = true;
  {
    let found = false;
    for (let k = I0 + 1; k < N; k++) {
      if (final[k] < final[k - 1] && final[k] <= final[k + 1]) {
        let rise = 0;
        for (let j = k + 1; j <= N; j++) rise = Math.max(rise, final[j]);
        if (rise > final[k] * 1.5 + 1e-9) { cutoff = k; found = true; break; }
      }
    }
    if (!found) {
      let mode = I0;
      for (let k = I0; k <= N; k++) if (final[k] > final[mode]) mode = k;
      // (Only the first cases infecting nobody always counts as fizzling.)
    if (R0 <= 1) cutoff = N;
    else if (mode > I0 + 0.25 * (N - I0)) cutoff = I0;
    else split = false;
    }
  }
  let pMinor = 0, meanMajor = 0, pMajor = 0;
  for (let k = I0; k <= N; k++) {
    if (k <= cutoff) pMinor += final[k];
    else { pMajor += final[k]; meanMajor += k * final[k]; }
  }
  const meanFinal = final.reduce((a, v, k) => a + v * k, 0);
  // The branching-process approximation: extinction q* = (1 − p + p q*)^(N − 1).
  let qx = 0;
  for (let k = 0; k < 400; k++) qx = Math.pow(1 - p + p * qx, N - 1);
  const pMinorBp = Math.pow(qx, I0);

  // ── Simulated outbreaks ──
  // Each person, generation and run draws its own uniform from a hash of
  // (seed, run, generation, person): the same seed is the same outbreaks,
  // and a larger p only ever infects more of the same people.
  const mix = (h) => {
    h ^= h >>> 16; h = Math.imul(h, 0x7feb352d);
    h ^= h >>> 15; h = Math.imul(h, 0x846ca68b);
    h ^= h >>> 16;
    return h >>> 0;
  };
  const u01 = (r, t, i) => mix(mix(mix(mix(seed) ^ Math.imul(r + 1, 0x9e3779b1)) ^ Math.imul(t + 1, 0x85ebca6b)) ^ Math.imul(i + 1, 0xc2b2ae35)) / 4294967296;
  const runs = [];
  for (let r = 0; r < nRuns; r++) {
    const sus = new Array(N).fill(true);
    for (let i = 0; i < I0; i++) sus[i] = false;
    let c = I0, cum = I0;
    const path = [cum], news = [c];
    for (let t = 0; c > 0 && t <= N; t++) {
      const pi = 1 - Math.pow(q, c);
      let j = 0;
      for (let i = I0; i < N; i++) if (sus[i] && u01(r, t, i) < pi) { sus[i] = false; j++; }
      c = j;
      cum += j;
      path.push(cum);
      news.push(j);
    }
    // The last entry is the generation that found no one.
    runs.push({ path, final: cum, len: path.length - 1 });
  }

  // ── Geometry ──
  const settle = expCum.findIndex((e) => e >= 0.995 * meanFinal);
  const longest = runs.reduce((a, r) => Math.max(a, r.len), 0);
  const G = typeof params.generations === "number" && params.generations >= 1 ? Math.round(clamp(params.generations, 2, 60)) : clamp(Math.max(longest, settle < 0 ? expCum.length - 1 : settle, 4) + 1, 5, 40);
  const plot = { x0: 105, y0: 90, x1: showDist ? 610 : 880, y1: 540 };
  // The bars' longest is 190 units, leaving room on their right for a name.
  const dist = { x0: 670, x1: 860 };
  const sx = (g) => plot.x0 + (g / G) * (plot.x1 - plot.x0);
  const sy = (k) => plot.y0 + (k / N) * (plot.y1 - plot.y0);
  const drawables = [], labels = [], anchors = {}, order = [], attached = {}, groups = {}, drawnWith = {};
  const push = (d, at) => { drawables.push(d); order.push(d.id); if (at) anchors[d.id] = at; };
  const INK_MINOR = split ? C.guide : C.supply, INK_MAJOR = split ? C.demand : C.supply;

  // The header: the numbers to scrub, and the button.
  const HY = 640;
  const pText = "p = " + kit.num(Math.round(p * 1000) / 1000, p < 0.1 ? 3 : 2);
  const nText = "N = " + kit.num(N, 0);
  const rText = "R₀ ≈ " + kit.num(Math.round(R0 * 100) / 100);
  let hx = 105;
  push(kit.text("n_value", [hx, HY], nText, { fontSize: 30, color: C.ink, anchor: "start" }), [hx + 40, HY]);
  hx += kit.textWidth(nText, 30) + 50;
  push(kit.text("p_value", [hx, HY], pText, { fontSize: 30, color: C.accent, anchor: "start" }), [hx + 50, HY]);
  hx += kit.textWidth(pText, 30) + 50;
  push(kit.text("r0_value", [hx, HY], rText, { fontSize: 30, color: C.accent, anchor: "start" }), [hx + 50, HY]);
  push(kit.pad("rerun", [845, HY], kit.say({ en: "new runs ↻", nb: "nye forsøk ↻" }), { w: 170, h: 48 }, { fontSize: 22 }), [845, HY]);

  // Axes: generation across, people infected so far up.
  const axKids = [
    kit.stroke("axes__x", [[plot.x0 - 6, plot.y0], [plot.x1 + kit.AXIS_OVERHANG, plot.y0]], { arrowhead: "end", strokeWidth: 3.5, ms: MS.axis }),
    kit.stroke("axes__y", [[plot.x0, plot.y0 - 6], [plot.x0, plot.y1 + kit.AXIS_OVERHANG]], { arrowhead: "end", strokeWidth: 3.5, ms: MS.axis }),
    kit.text("axes__x_label", [plot.x1 + kit.AXIS_OVERHANG, plot.y0 - 60], kit.say({ en: "generation", nb: "generasjon" }), { fontSize: 22, color: C.ink, anchor: "end" }),
    kit.text("axes__y_label", [plot.x0 - 10, plot.y1 + kit.AXIS_OVERHANG + 20], kit.say({ en: "infected so far", nb: "smittet så langt" }), { fontSize: 22, color: C.ink, anchor: "start" }),
  ];
  const gStep = G <= 12 ? 1 : G <= 24 ? 2 : 5;
  for (let g = 0, k = 0; g <= G; g += gStep, k++) {
    axKids.push(kit.stroke("axes__xt" + k, [[sx(g), plot.y0], [sx(g), plot.y0 - 8]], { color: C.ink, strokeWidth: 2, ms: MS.guides }));
    axKids.push(kit.text("axes__xn" + k, [sx(g), plot.y0 - 25], kit.num(g, 0), { fontSize: 20, color: C.ink }));
  }
  const yTicks = N <= 12 ? Array.from({ length: N + 1 }, (_, k) => k).filter((k) => k % (N <= 6 ? 1 : 2) === 0 || k === N) : [0, Math.round(N / 2), N];
  yTicks.forEach((k, i) => {
    axKids.push(kit.stroke("axes__yt" + i, [[plot.x0, sy(k)], [plot.x0 - 8, sy(k)]], { color: C.ink, strokeWidth: 2, ms: MS.guides }));
    axKids.push(kit.text("axes__yn" + i, [plot.x0 - 14, sy(k)], kit.num(k, 0), { fontSize: 20, color: C.ink, anchor: "end" }));
  });
  push(kit.group("axes", axKids), [plot.x0, plot.y0]);

  // The line between the fizzled totals and the ones that took off, across
  // the distribution's bars (the runs say it by their colour).
  const both = split && cutoff >= I0 && cutoff < N && showDist;
  if (both) {
    const cy = sy(cutoff + 0.5);
    push(kit.stroke("cutoff", [[dist.x0 - 8, cy], [dist.x1, cy]], { color: C.guide, dash: true, strokeWidth: 2, ms: MS.guides }), [dist.x1, cy]);
  }

  // The runs: people infected so far, generation by generation, flat once over.
  const ids = [], minorIds = [], majorIds = [];
  const unit = (plot.y1 - plot.y0) / N;
  runs.forEach((r, k) => {
    const major = split && r.final > cutoff;
    // A hair apart, so runs that end on the same count read as a bundle.
    const off = ((k % 5) - 2) * Math.min(1.6, unit * 0.12);
    const pts = [];
    for (let g = 0; g <= G; g++) pts.push([sx(g), sy(r.path[Math.min(g, r.path.length - 1)]) + off]);
    const id = "run_" + (k + 1);
    push(kit.stroke(id, pts, { color: major ? INK_MAJOR : INK_MINOR, strokeWidth: major ? 3 : 3.5, opacity: 0.85, ms: MS.connector }), pts[pts.length - 1]);
    ids.push(id);
    (major ? majorIds : minorIds).push(id);
  });
  if (ids.length > 0) groups.runs = ids;
  if (minorIds.length > 0) groups.runs_minor = minorIds;
  if (majorIds.length > 0) groups.runs_major = majorIds;

  if (showExp) {
    const pts = [];
    for (let g = 0; g <= G; g++) pts.push([sx(g), sy(expCum[Math.min(g, expCum.length - 1)])]);
    push(kit.stroke("expected", pts, { color: C.ink, dash: true, strokeWidth: 3.5, ms: MS.curve }), pts[pts.length - 1]);
    labels.push(kit.label("expected_label", pts[Math.min(pts.length - 1, Math.max(2, Math.round(G * 0.45)))], "above", kit.say({ en: "average", nb: "gjennomsnitt" }), { color: C.ink, fontSize: 22 }));
    order.push("expected_label");
    attached.expected = ["expected_label"];
    drawnWith.expected = ["expected_label"];
  }

  // The exact final-size distribution, sideways on the same axis.
  if (showDist) {
    let pmax = 0;
    for (let k = I0; k <= N; k++) pmax = Math.max(pmax, final[k]);
    const bh = Math.max(1.5, Math.min(16, unit * 0.8));
    const len = (v) => (pmax > 0 ? (v / pmax) * (dist.x1 - dist.x0) : 0);
    const minorBars = [], majorBars = [];
    for (let k = I0; k <= N; k++) {
      const L = len(final[k]);
      if (L < 0.8) continue;
      const bar = kit.area("dist__" + k, kit.rect(dist.x0, sy(k) - bh / 2, L, bh), split && k > cutoff ? INK_MAJOR : INK_MINOR, { opacity: 0.75 });
      (split && k > cutoff ? majorBars : minorBars).push(bar);
    }
    push(kit.group("dist_axis", [
      kit.stroke("dist_axis__line", [[dist.x0, plot.y0], [dist.x0, plot.y1]], { color: C.ink, strokeWidth: 2.5, ms: MS.axis }),
      kit.text("dist_axis__caption", [dist.x0, plot.y1 + kit.AXIS_OVERHANG + 20], kit.say({ en: "chance of each total", nb: "sjansen for hvert antall" }), { fontSize: 22, color: C.ink, anchor: "start" }),
    ]), [dist.x0, plot.y1]);
    if (minorBars.length > 0) push(kit.group("dist_minor", minorBars), [dist.x0, sy(I0)]);
    if (majorBars.length > 0) push(kit.group("dist_major", majorBars), [dist.x0, sy(Math.min(N, cutoff + 1))]);
    // Each hump's name and chance, beside its tallest bar.
    const pctS = (v) => kit.num(Math.round(v * 100), 0) + "%";
    // Each hump's name beside it: level with its tallest bar, clear of
    // every bar within a label's height of that row.
    const humpAt = (lo, hi) => { let m = lo; for (let k = lo; k <= hi; k++) if (final[k] > final[m]) m = k; return m; };
    const clearX = (m, text) => {
      let w = 0;
      for (let k = I0; k <= N; k++) if (Math.abs(sy(k) - sy(m)) < 16) w = Math.max(w, len(final[k]));
      return Math.min(dist.x0 + w + 12, 985 - kit.textWidth(text, 22));
    };
    if (split && pMinor > 0.005) {
      const m = humpAt(I0, Math.min(cutoff, N));
      const text = kit.say({ en: "fizzles ", nb: "dør ut " }) + pctS(pMinor);
      const at = [clearX(m, text), Math.max(sy(m), plot.y0 + 12)];
      push(kit.text("minor_label", at, text, { fontSize: 22, color: "#6f695f", anchor: "start" }), at);
      attached.dist_minor = ["minor_label"];
      drawnWith.dist_minor = ["minor_label"];
    }
    if (split && pMajor > 0.005) {
      const m = humpAt(cutoff + 1, N);
      const text = kit.say({ en: "takes off ", nb: "tar av " }) + pctS(pMajor);
      const at = [clearX(m, text), Math.min(sy(m), plot.y1)];
      push(kit.text("major_label", at, text, { fontSize: 22, color: C.demand, anchor: "start" }), at);
      attached.dist_major = ["major_label"];
      drawnWith.dist_major = ["major_label"];
    }
  }

  const r2 = (v) => Math.round(v * 100) / 100;
  const values = {
    population: N, initial: I0, p: Math.round(p * 1e5) / 1e5, r0: r2(R0), seed, generations: G,
    p_minor_bp: r2(pMinorBp * 100), p_no_spread: r2(final[I0] * 100), mean_final: r2(meanFinal),
    runs: nRuns, split: split ? 1 : 0,
  };
  if (split) {
    Object.assign(values, { p_minor: r2(pMinor * 100), p_major: r2(pMajor * 100), cutoff, runs_major: majorIds.length, runs_minor: minorIds.length });
    if (pMajor > 0) values.mean_major = r2(meanMajor / pMajor);
  }
  if (expCum.length > 1) values.expected_1 = r2(expCum[1] - expCum[0]);
  if (expCum.length > 2) values.expected_2 = r2(expCum[2] - expCum[1]);
  if (expCum.length > 3) values.expected_3 = r2(expCum[3] - expCum[2]);

  return { drawables, labels, anchors, order, attached, groups, drawnWith, values, frame: { x: [0, G], y: [0, N], box: plot } };
widget: |
  // Free play (2026-09-28): while paused the viewer works the group.
  //
  //   N = 30 (n_value)       drag sideways: 1 person per 4 units; tap: type it
  //   p = 0.069 (p_value)    0.005 per step (0.001 below 0.05)
  //   R₀ ≈ 2 (r0_value)      0.1 per step; p follows as R₀/(N − 1)
  //   new runs ↻ (rerun)     a tap: the next seed, new outbreaks
  //
  // A scrub keeps the generation axis where it was pressed; the release
  // gives it back to the author (fitted when they set none).
  const STEP_UNITS = 4;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const num = (v, d) => (typeof v === "number" && Number.isFinite(v) ? v : d);
  const fix = (v, d) => Number(v.toFixed(d));
  const NUMBERS = ["n_value", "p_value", "r0_value"];
  const model = (prm) => {
    const N = Math.round(clamp(num(prm.population, 30), 2, 100));
    const p = typeof prm.p === "number" && Number.isFinite(prm.p) ? clamp(prm.p, 0, 1) : clamp(num(prm.r0, 2) / (N - 1), 0, 1);
    return { N, p, r0: p * (N - 1) };
  };
  const gensOf = (scene) => {
    for (const id of ["run_1", "expected"]) {
      const ln = scene.lines.get(id);
      const last = ln && ln[0] && ln[0][ln[0].length - 1];
      const d = last ? scene.toDomain(last) : null;
      if (d) return Math.round(d[0]);
    }
    return undefined;
  };
  const setNumber = (id, v, prm) => {
    const m = model(prm);
    if (id === "n_value") return { population: Math.round(clamp(v, 2, 100)) };
    if (id === "p_value") return { p: fix(clamp(v, 0, 1), 4) };
    if (id === "r0_value") return { p: fix(clamp(v / (m.N - 1), 0, 1), 5) };
    return {};
  };
  const init = (scene) => ({ g0: scene.params.generations });
  const on = (ev, st, scene) => {
    const state = st ?? { g0: undefined };
    const prm = scene.params;
    if (ev.type === "click" && ev.id === "rerun") {
      return { state, effects: [{ patch: { seed: Math.floor(num(prm.seed, 1)) + 1 } }] };
    }
    if (ev.type === "input" && NUMBERS.includes(ev.id)) return { state, effects: [{ patch: setNumber(ev.id, ev.value, prm) }] };
    if ((ev.type !== "drag_move" && ev.type !== "drag") || !ev.from || !NUMBERS.includes(ev.id)) return { state, effects: [] };
    const dx = ev.point[0] - ev.from[0];
    const n = Math.trunc(dx / STEP_UNITS + (dx >= 0 ? 1e-6 : -1e-6));
    const m = model(prm);
    let patch;
    if (ev.id === "n_value") patch = setNumber(ev.id, m.N + n, prm);
    else if (ev.id === "p_value") {
      const step = m.p < 0.05 ? 0.001 : 0.005;
      patch = setNumber(ev.id, fix(m.p + step * n, 3), prm);
    } else patch = setNumber(ev.id, fix(m.r0 + 0.1 * n, 1), prm);
    patch.generations = ev.type === "drag_move" ? gensOf(scene) ?? state.g0 : state.g0;
    return { state, effects: [{ patch }] };
  };
  const editable = (id, point, scene) => {
    const m = model(scene.params);
    if (id === "n_value") return { value: m.N, label: kit.say({ en: "People in the group", nb: "Personer i gruppen" }), min: 2, max: 100, step: 1 };
    if (id === "p_value") return { value: fix(m.p, 4), label: kit.say({ en: "Chance one case infects one person", nb: "Sjanse for at ett tilfelle smitter én person" }), min: 0, max: 1, step: 0.001 };
    if (id === "r0_value") return { value: fix(m.r0, 2), label: kit.say({ en: "Basic reproduction number R0", nb: "Basisreproduksjonstall R0" }), min: 0, max: 99, step: 0.1 };
    return null;
  };
  const parts = (scene) => ["rerun", ...NUMBERS].filter((id) => scene.ids.includes(id));
  // "new runs" is a button: its tap is the body's (WidgetBody.taps).
  const taps = (id) => id === "rerun";
  return { init, on, editable, parts, taps, live: true };
---
template: distribution_curve
title: Probability distribution curve
version: 2
kit: 2
status: ready
accepts_data: true
description: >-
  A probability distribution curve — a normal (Gaussian) bell curve, or a
  right- or left-skewed curve — with a dashed mean guide, optional tick marks
  at ±1 and ±2 standard deviations, and an optional shaded tail (upper,
  lower, or both/two-sided) with a percentage or probability label. Choose
  this scene for ANY request about a normal distribution, bell curve,
  probability distribution, standard deviation, z-score, p-value, a
  statistical significance threshold, a critical region, a skewed
  distribution, or shading the tail(s) of a distribution. The shade
  boundaries take typed numbers or a code element's variable via a "{id.var}"
  token — a critical value or z-score the script computed — and until it has
  run the curve draws with the boundary at ±1σ, so the shade beats exist from
  the first frame. TYPE the shade's `label` and `side` by hand: a token can
  supply a number, never a mode or a caption.
params:
  type: object
  properties:
    kind:
      type: string
      enum: [normal, right_skew, left_skew]
      description: "Default \"normal\"."
    mean_label:
      type: string
      description: "Default \"μ\"."
    sd_label:
      type: string
      description: "Default \"σ\"."
    shade:
      type: object
      properties:
        from:
          type: number
          description: "Standard deviations from the mean where shading starts, e.g. 1.96."
        to:
          type: number
          description: "Standard deviations from the mean where shading ends (default: the edge of the curve)."
        side:
          type: string
          enum: [upper, lower, two]
          description: "upper shades the right tail from `from` SDs upward; lower shades the left tail; two shades both tails symmetrically (default upper)."
        label:
          type: string
          description: "e.g. \"2.5%\"."
    show_sd_ticks:
      type: boolean
      description: "Tick marks at ±1σ and ±2σ (default true)."
    title:
      type: string
element_ids:
  axis: the horizontal value axis
  curve: the sampled distribution curve
  shade: the shaded tail region, present when `shade` is set
  shade2: the second (mirrored) shaded tail, present only when shade.side is "two"
  shade_label: the shaded region's label, present when `shade` is set
  mean_line: dashed guide at the mean, with its label
  sd_tick_<i>: tick mark at ±1σ/±2σ, present when show_sd_ticks
  title: figure title, when set
examples:
  - request: "Explain a p-value cutoff of 0.05, two-sided, with a normal curve."
    params:
      shade: { from: 1.96, side: "two", label: "2.5% each tail" }
      title: "Two-sided significance at α = 0.05"
  - request: "Draw a right-skewed distribution."
    params: { kind: "right_skew" }
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const kind = params.kind === "right_skew" || params.kind === "left_skew" ? params.kind : "normal";
  const meanLabel = typeof params.mean_label === "string" && params.mean_label.trim() !== "" ? params.mean_label : "μ";
  const sdLabel = typeof params.sd_label === "string" && params.sd_label.trim() !== "" ? params.sd_label : "σ";
  const showTicks = params.show_sd_ticks !== false;

  const plot = { x0: 110, y0: 160, x1: 890, y1: 600 };
  const MEAN_X = 50, S = 14;
  const sx = (wx) => plot.x0 + (wx / 100) * (plot.x1 - plot.x0);
  const sy = (density) => plot.y0 + Math.max(0, density) * (plot.y1 - plot.y0);

  const bellExpr = kit.expr("exp(-((x-50)^2)/2/s^2)", ["x", "s"]);
  const normalFn = (x) => bellExpr({ x, s: S });
  function asymFn(peakX, sigL, sigR) {
    return (x) => {
      const sig = x <= peakX ? sigL : sigR;
      const d = x - peakX;
      return Math.exp(-(d * d) / (2 * sig * sig));
    };
  }
  const RIGHT_SKEW_SIG = { left: 9, right: 24 };
  const LEFT_SKEW_SIG = { left: 24, right: 9 };
  const rightSkewFn = asymFn(34, RIGHT_SKEW_SIG.left, RIGHT_SKEW_SIG.right);
  const leftSkewFn = asymFn(66, LEFT_SKEW_SIG.left, LEFT_SKEW_SIG.right);
  const curveFn = kind === "right_skew" ? rightSkewFn : kind === "left_skew" ? leftSkewFn : normalFn;
  // The "1 SD" step size on each side of the fixed mean (world x = MEAN_X),
  // matching whichever piece of the ACTIVE curve is drawn on that side —
  // normal is uniform (sigL=sigR=S); a skewed kind reuses the EXACT sigL/sigR
  // asymFn built its curve with, so every tick/shade boundary below is a
  // genuine multiple of this curve's own spread, never the normal kind's S.
  // Picked by sign relative to the mean (not by literal position vs. the
  // curve's peak): the mean can sit on either side of the peak, but "one SD
  // to the right of the mean" always means the curve's right-hand spread,
  // and "to the left" always means its left-hand spread.
  const sigma = kind === "right_skew" ? RIGHT_SKEW_SIG : kind === "left_skew" ? LEFT_SKEW_SIG : { left: S, right: S };

  const drawables = [], labels = [], anchors = {}, order = [];
  const attached = {};
  const push = (d) => { drawables.push(d); order.push(d.id); };
  const label = (id, anchor, side, text, color, fontSize) => {
    labels.push(kit.label(id, anchor, side, text, { color, fontSize }));
    order.push(id);
  };

  push(kit.stroke("axis", [[plot.x0 - 10, plot.y0], [plot.x1 + 20, plot.y0]], { arrowhead: "end", strokeWidth: 4, ms: MS.axis }));
  anchors.axis = [plot.x1 + 20, plot.y0];

  const curvePts = kit.sample(curveFn, 0, 100, 100).map(([x, y]) => [sx(x), sy(y)]);
  push(kit.stroke("curve", curvePts, { color: C.ink, strokeWidth: 4.5, ms: MS.curve }));
  anchors.curve = curvePts[curvePts.length - 1];

  // How many SDs (on a given side) fit before the sampled curve's own domain
  // edge (world x 0/100) — per side, since a skewed curve's left/right SD
  // step sizes differ, so the same SD count reaches a different world-x
  // distance on each side.
  function domainSDMax(sig, dir) {
    return dir === "right" ? (100 - MEAN_X) / sig : MEAN_X / sig;
  }

  function shadeArea(id, wFrom, wTo, color) {
    const N = 36;
    const top = [];
    for (let k = 0; k <= N; k++) {
      const wx = wFrom + ((wTo - wFrom) * k) / N;
      top.push([sx(wx), sy(curveFn(wx))]);
    }
    const pts = top.concat([[sx(wTo), plot.y0], [sx(wFrom), plot.y0]]);
    push(kit.area(id, pts, color));
    let cx = 0, cy = 0;
    for (const p of pts) { cx += p[0]; cy += p[1]; }
    anchors[id] = [cx / pts.length, cy / pts.length];
  }

  const shadeParam = params.shade && typeof params.shade === "object" ? params.shade : null;
  if (shadeParam) {
    const side = shadeParam.side === "lower" || shadeParam.side === "two" ? shadeParam.side : "upper";
    // "two" shades both tails using the SAME from/to SD count on each side
    // (so "beyond ±1.96σ" stays one meaningful number) — clamped against
    // whichever side's own domain runs out first, so neither shaded region
    // is asked to sample past the curve's sampled edge.
    const domMax = side === "upper"
      ? domainSDMax(sigma.right, "right")
      : side === "lower"
        ? domainSDMax(sigma.left, "left")
        : Math.min(domainSDMax(sigma.right, "right"), domainSDMax(sigma.left, "left"));
    const from = Math.min(domMax, Math.max(0, typeof shadeParam.from === "number" ? shadeParam.from : 1));
    const toRaw = typeof shadeParam.to === "number" ? shadeParam.to : domMax;
    const to = Math.min(domMax, Math.max(from, toRaw));

    if (side === "upper") {
      shadeArea("shade", MEAN_X + from * sigma.right, MEAN_X + to * sigma.right, C.region1);
    } else if (side === "lower") {
      shadeArea("shade", MEAN_X - to * sigma.left, MEAN_X - from * sigma.left, C.region1);
    } else {
      shadeArea("shade", MEAN_X + from * sigma.right, MEAN_X + to * sigma.right, C.region1);
      shadeArea("shade2", MEAN_X - to * sigma.left, MEAN_X - from * sigma.left, C.region1);
    }

    const labelText = typeof shadeParam.label === "string" && shadeParam.label.trim() !== ""
      ? shadeParam.label
      : side === "two"
        ? "beyond ±" + from + sdLabel
        : "beyond " + (side === "lower" ? "−" : "") + from + sdLabel;
    const labelX = side === "two"
      ? sx(MEAN_X)
      : side === "lower"
        ? sx(MEAN_X - ((from + to) / 2) * sigma.left)
        : sx(MEAN_X + ((from + to) / 2) * sigma.right);
    label("shade_label", [labelX, plot.y1 + 18], "above", labelText, C.ink, 19);
    attached["shade"] = [...(attached["shade"] ?? []), "shade_label"];
  }

  const meanHeight = curveFn(MEAN_X);
  const meanTopPx = sy(meanHeight);
  const meanXpx = sx(MEAN_X);
  push(kit.group("mean_line", [
    kit.stroke("mean_line__line", [[meanXpx, plot.y0], [meanXpx, meanTopPx]], { color: C.guide, dash: true, strokeWidth: 2.5, ms: MS.guides }),
    kit.text("mean_line__text", [meanXpx, meanTopPx + 24], meanLabel, { fontSize: 22, color: C.guide }),
  ]));
  anchors.mean_line = [meanXpx, meanTopPx];

  if (showTicks) {
    [-2, -1, 1, 2].forEach((sd, i) => {
      const wx = MEAN_X + sd * (sd > 0 ? sigma.right : sigma.left);
      const xpx = sx(wx);
      const text = sd + sdLabel;
      push(kit.group("sd_tick_" + i, [
        kit.stroke("sd_tick_" + i + "__mark", [[xpx, plot.y0 - 9], [xpx, plot.y0 + 9]], { color: C.guide, strokeWidth: 2.5, ms: MS.stroke }),
        kit.text("sd_tick_" + i + "__text", [xpx, plot.y0 - 26], text, { fontSize: 16, color: C.guide }),
      ]));
      anchors["sd_tick_" + i] = [xpx, plot.y0];
    });
  }

  if (typeof params.title === "string" && params.title.trim() !== "") {
    push(kit.text("title", [(plot.x0 + plot.x1) / 2, plot.y1 + 70], params.title, { fontSize: 30 }));
  }

  return { drawables, labels, anchors, order, attached, frame: { x: [-MEAN_X / S, (100 - MEAN_X) / S], y: [0, 1], box: plot } };
