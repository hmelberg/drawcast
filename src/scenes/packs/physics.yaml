pack: physics
title: Physics
description: Optics ray diagrams, wave diagrams, circuits, projectiles, a bicycle drivetrain and a hydraulic press — classroom physics figures with computed geometry.
---
template: ray_diagram
title: Lens ray diagram
version: 1
kit: 1
status: ready
description: >-
  A converging-lens ray diagram with the geometry COMPUTED from the thin-lens
  equation: object arrow, lens, both focal points, the two principal rays
  (parallel→focal and center-straight), and the image — real and inverted when
  the object is outside the focal length, virtual, upright and dashed when
  inside. Choose this scene for ANY request about lenses, ray diagrams, image
  formation, real vs virtual images, magnification, or "what happens when the
  object moves inside the focal length". Vary focal_length and object_distance
  and the figure re-derives itself.
params:
  type: object
  properties:
    focal_length:
      type: number
      description: "Focal length in arbitrary units (default 10)."
    object_distance:
      type: number
      description: "Object distance from the lens, same units (default 25). Less than focal_length gives a virtual image."
    object_height:
      type: number
      description: "Object height in units (default 6)."
    show_labels:
      type: boolean
      description: "F / object / image labels (default true)."
element_ids:
  axis: the optical axis
  lens: the lens (vertical double-headed arrow)
  focal_left / focal_right: the focal-point ticks with F labels
  object: the object arrow
  ray_parallel: the parallel-then-through-focus principal ray
  ray_center: the straight-through-center principal ray
  ray_parallel_ext / ray_center_ext: dashed back-extensions (virtual case only)
  image: the image arrow (dashed when virtual)
  label_object / label_image / label_left / label_right: the labels (label_left and label_right are the two F labels)
examples:
  - request: "Draw a ray diagram for a converging lens with the object outside the focal length."
    params: { focal_length: 10, object_distance: 25, object_height: 6 }
  - request: "Show why a magnifying glass makes a virtual image when the object is inside the focal length."
    params: { focal_length: 12, object_distance: 7, object_height: 5 }
layout: |
  const f = Math.max(1, params.focal_length ?? 10);
  const dObj = Math.max(1.2, params.object_distance ?? 25);
  const hObj = Math.max(1, params.object_height ?? 6);
  const showLabels = params.show_labels !== false;
  const virtual = dObj < f;
  const dImg = (f * dObj) / (dObj - f);           // thin lens; negative when virtual
  const m = -dImg / dObj;
  const hImg = m * hObj;
  // Scale to fit: horizontal span from object to image (or 2f), vertical from heights.
  // Virtual images always sit FARTHER from the lens than the object (|dImg| > dObj
  // whenever dObj < f), and the outgoing parallel ray is drawn on to 2f+2 — both
  // extremes must be inside the horizontal span or the virtual case runs off-canvas.
  const leftU = virtual ? Math.max(dObj, Math.abs(dImg)) : dObj;
  const rightU = Math.max(virtual ? 2 * f + 2 : dImg, 2 * f);
  const sx = 780 / (leftU + rightU);
  const sy = Math.min(sx, 250 / Math.max(hObj, Math.abs(hImg)));
  const lensX = 110 + leftU * sx, axisY = 375;
  const X = (u) => lensX + u * sx;                 // u<0 left of lens
  const Y = (h) => axisY + h * sy;
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  const label = (id, anchor, side, text, color) => {
    if (!showLabels) return;
    labels.push(kit.label(id, anchor, side, text, { color, fontSize: 24 }));
    order.push(id);
  };
  push(kit.stroke("axis", [[70, axisY], [930, axisY]], { strokeWidth: 2.5, color: C.guide, ms: MS.axis }));
  push(kit.stroke("lens", [[lensX, axisY - 210], [lensX, axisY + 210]], { arrowhead: "both", strokeWidth: 4, ms: MS.axis }));
  for (const [id, u] of [["focal_left", -f], ["focal_right", f]]) {
    push(kit.stroke(id, [[X(u), axisY - 9], [X(u), axisY + 9]], { strokeWidth: 3, ms: MS.dot }));
    label("label_" + id.slice(6), [X(u), axisY - 26], "below", "F");
  }
  const tip = [X(-dObj), Y(hObj)];
  push(kit.stroke("object", [[X(-dObj), axisY], tip], { arrowhead: "end", strokeWidth: 5, color: C.supply, ms: MS.arrow }));
  anchors.object = tip;
  label("label_object", [tip[0], tip[1] + 26], "above", "Object", C.supply);
  const imgTip = [X(dImg), Y(hImg)];
  // Ray 1: parallel to axis, refracts through far focal point.
  push(kit.stroke("ray_parallel", virtual
    ? [tip, [lensX, tip[1]], [X(2 * f + 2), Y(hObj - ((2 * f + 2 - 0) * (hObj - 0)) / f)]]
    : [tip, [lensX, tip[1]], imgTip], { arrowhead: "end", strokeWidth: 3, color: C.demand, ms: MS.connector }));
  // Ray 2: straight through the lens center.
  push(kit.stroke("ray_center", virtual
    ? [tip, [X(Math.max(2 * f, 1.6 * dObj)), Y(-(hObj / dObj) * Math.max(2 * f, 1.6 * dObj))]]
    : [tip, imgTip], { arrowhead: "end", strokeWidth: 3, color: C.accent, ms: MS.connector }));
  if (virtual) {
    push(kit.stroke("ray_parallel_ext", [[lensX, tip[1]], imgTip], { dash: true, strokeWidth: 2.5, color: C.demand, ms: MS.guides }));
    push(kit.stroke("ray_center_ext", [tip, imgTip], { dash: true, strokeWidth: 2.5, color: C.accent, ms: MS.guides }));
  }
  push(kit.stroke("image", [[X(dImg), axisY], imgTip], { arrowhead: "end", strokeWidth: 5, color: C.ink, dash: virtual, ms: MS.arrow }));
  anchors.image = imgTip;
  label("label_image", [imgTip[0], imgTip[1] + (hImg >= 0 ? 26 : -26)], hImg >= 0 ? "above" : "below", virtual ? "Virtual image" : "Real image");
  return { drawables, labels, anchors, order };
---
template: wave_diagram
title: Wave diagram
version: 1
kit: 1
status: ready
description: >-
  A transverse wave with labeled amplitude and wavelength: a sine curve on an
  axis, a double-headed amplitude arrow, a wavelength bracket between crests,
  and optional crest/trough labels or a second dashed wave with a phase shift
  (interference/superposition setups). Choose this scene for requests about
  waves, wavelength, amplitude, frequency, phase, or interference.
params:
  type: object
  properties:
    amplitude:
      type: number
      description: "Amplitude in units 1–10 (default 5)."
    cycles:
      type: number
      description: "How many wavelengths to draw, 1–5 (default 3)."
    second_wave_phase_deg:
      type: number
      description: "If set, a second dashed wave shifted by this phase (e.g. 180 for destructive interference)."
    label_parts:
      type: boolean
      description: "Label amplitude, wavelength, crest and trough (default true)."
element_ids:
  axis: the horizontal axis
  wave: the main wave curve
  wave2: the second (dashed) wave when second_wave_phase_deg is set
  amp_arrow: double-headed amplitude arrow
  wl_arrow: double-headed wavelength arrow between crests
  label_amp / label_wl / label_crest / label_trough: the labels
examples:
  - request: "Draw a wave and label the wavelength and amplitude."
    params: { amplitude: 5, cycles: 3 }
  - request: "Show destructive interference of two waves."
    params: { amplitude: 4, cycles: 3, second_wave_phase_deg: 180, label_parts: false }
layout: |
  const ampU = Math.min(10, Math.max(1, params.amplitude ?? 5));
  const cycles = Math.min(5, Math.max(1, Math.round(params.cycles ?? 3)));
  const phase2 = params.second_wave_phase_deg;
  const labelParts = params.label_parts !== false;
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const x0 = 90, len = 800, midY = 375;
  const wl = len / cycles;
  const amp = ampU * 22;
  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  push(kit.stroke("axis", [[x0 - 20, midY], [x0 + len + 30, midY]], { arrowhead: "end", strokeWidth: 2.5, color: C.guide, ms: MS.axis }));
  push(kit.stroke("wave", kit.wave([x0, midY], len, amp, wl), { strokeWidth: 4.5, color: C.supply, ms: MS.curve }));
  anchors.wave = [x0 + wl / 4, midY + amp];
  if (phase2 !== undefined) {
    const sh = (((phase2 % 360) + 360) % 360) / 360 * wl;
    const shifted = [];
    for (let t = 0; t <= len; t += 4) shifted.push([x0 + t, midY + amp * Math.sin(((t - sh) / wl) * 2 * Math.PI)]);
    push(kit.stroke("wave2", shifted, { strokeWidth: 3.5, color: C.demand, dash: true, ms: MS.curve }));
  }
  if (labelParts) {
    const crestX = x0 + wl / 4;
    // The wavelength bracket normally spans crest-to-crest (one wavelength on
    // from the first crest). With few cycles that second crest can land past
    // the drawn wave — off the fixed-width canvas. When it would, anchor the
    // bracket along the axis instead: x0 and x0+wl are the same phase (both
    // ascending zero-crossings), so it is still a true one-wavelength span,
    // just not crest-to-crest. The amp arrow clamps to the same right edge so
    // it always lands inside the drawn span too.
    const wlFits = crestX + wl <= x0 + len;
    const wlX0 = wlFits ? crestX : x0;
    const wlX1 = wlFits ? crestX + wl : x0 + wl;
    push(kit.stroke("amp_arrow", [[wlX1, midY], [wlX1, midY + amp]], { arrowhead: "both", strokeWidth: 2.5, color: C.accent, ms: MS.guides }));
    labels.push(kit.label("label_amp", [wlX1 + 8, midY + amp / 2], "right", "Amplitude A", { color: C.accent, fontSize: 24 }));
    order.push("label_amp");
    push(kit.stroke("wl_arrow", [[wlX0, midY + amp + 26], [wlX1, midY + amp + 26]], { arrowhead: "both", strokeWidth: 2.5, color: C.accent, ms: MS.guides }));
    labels.push(kit.label("label_wl", [(wlX0 + wlX1) / 2, midY + amp + 34], "above", "Wavelength λ", { color: C.accent, fontSize: 24 }));
    order.push("label_wl");
    labels.push(kit.label("label_crest", [crestX, midY + amp], "above", "Crest", { fontSize: 22 }));
    order.push("label_crest");
    labels.push(kit.label("label_trough", [crestX + wl / 2, midY - amp], "below", "Trough", { fontSize: 22 }));
    order.push("label_trough");
  }
  return { drawables, labels, anchors, order };
---
template: circuit_diagram
title: Electric circuit diagram
version: 1
kit: 2
status: ready
description: >-
  A rectangular electric-circuit loop built from component pictograms
  (resistor zigzag, battery long/short plates, bulb circled X, switch, and
  capacitor plates): in series every component is spliced one after another
  along the top wire; in parallel the loop opens 2-3 separate rungs between
  the top and bottom rails so each component gets its own branch. The battery
  always sits centered in the bottom wire regardless of where it appears in
  the component list. Small arrowheads along the rails show the direction of
  conventional current, clockwise starting from the battery's + terminal,
  when requested. Choose this scene for ANY request about a circuit diagram,
  an electric circuit, a resistor, a battery, a light bulb, a switch, a
  capacitor, series vs parallel circuits, or the direction of conventional
  current.
params:
  type: object
  properties:
    topology:
      type: string
      enum: [series, parallel]
      description: "Loop topology (default \"series\")."
    components:
      type: array
      minItems: 2
      maxItems: 5
      items:
        type: object
        properties:
          type:
            type: string
            enum: [resistor, battery, bulb, switch, capacitor]
          label:
            type: string
            description: "Caption under/beside the component (default: its type name)."
        required: [type]
      description: >-
        2-5 components in the loop, in order. Exactly one battery is
        recommended; it is always drawn centered in the bottom wire
        regardless of its position in this list. The remaining components are
        spliced along the top wire (series) or become the parallel rungs
        between the rails (parallel), in list order.
    show_current:
      type: boolean
      description: "Small arrowheads on the rails showing current direction, clockwise from the battery's + terminal (default true)."
element_ids:
  wire: the rectangular loop's plain wire segments — rails, top/bottom wire, and any rung stubs (one group)
  comp_<i>: the i-th entry in `components`, as a pictogram (i = its index in the `components` array, not draw order)
  comp_label_<i>: comp_<i>'s caption
  current_<i>: a small current-direction arrowhead on a wire segment, present only when show_current
examples:
  - request: "Draw a series circuit with a battery, a bulb and a switch."
    params:
      topology: series
      components:
        - { type: battery }
        - { type: bulb, label: "Lamp" }
        - { type: switch }
  - request: "Draw two resistors in parallel with a battery."
    params:
      topology: parallel
      components:
        - { type: battery }
        - { type: resistor, label: "R1" }
        - { type: resistor, label: "R2" }
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const VALID_TYPES = ["resistor", "battery", "bulb", "switch", "capacitor"];
  const topology = params.topology === "parallel" ? "parallel" : "series";
  const showCurrent = params.show_current !== false;
  const rawComponents = Array.isArray(params.components) ? params.components.filter((c) => c && typeof c === "object").slice(0, 5) : [];
  const componentsIn = rawComponents.length >= 2 ? rawComponents : [{ type: "battery" }, { type: "resistor" }, { type: "bulb" }];
  const capitalize = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const normalized = componentsIn.map((c) => ({
    type: VALID_TYPES.includes(c.type) ? c.type : "resistor",
    label: typeof c.label === "string" && c.label.trim() !== "" ? c.label : undefined,
  }));
  const batteryIdx = normalized.findIndex((c) => c.type === "battery");
  const othersIdx = normalized.map((c, i) => i).filter((i) => i !== batteryIdx);

  const X0 = 150, X1 = 850, YB = 200, YT = 550, CX = (X0 + X1) / 2, CY = (YB + YT) / 2;
  const SCALE = 42;

  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  const label = (id, anchor, side, text, color, fontSize) => {
    labels.push(kit.label(id, anchor, side, text, { color, fontSize }));
    order.push(id);
  };

  const compAt = {};
  const compAnchors = {};
  const n = othersIdx.length;
  othersIdx.forEach((origI, k) => {
    const x = n > 0 ? X0 + ((X1 - X0) * (k + 0.5)) / n : CX;
    const at = topology === "parallel" ? [x, CY] : [x, YT];
    const rot = topology === "parallel" ? Math.PI / 2 : 0;
    const st = kit.stamp(normalized[origI].type, at, { scale: SCALE, rot, idPrefix: "comp_" + origI });
    push(kit.group("comp_" + origI, st.drawables));
    compAt[origI] = at;
    compAnchors[origI] = st.anchors;
    anchors["comp_" + origI] = at;
  });

  let batteryAnchors = null;
  if (batteryIdx >= 0) {
    const st = kit.stamp("battery", [CX, YB], { scale: SCALE, rot: 0, idPrefix: "comp_" + batteryIdx });
    push(kit.group("comp_" + batteryIdx, st.drawables));
    compAt[batteryIdx] = [CX, YB];
    batteryAnchors = st.anchors;
    anchors["comp_" + batteryIdx] = [CX, YB];
  }

  normalized.forEach((c, i) => {
    const text = c.label || capitalize(c.type);
    if (i === batteryIdx) {
      label("comp_label_" + i, [CX, YB - 6], "below", text, undefined, 22);
    } else if (topology === "parallel") {
      label("comp_label_" + i, compAt[i], "right", text, undefined, 22);
    } else {
      label("comp_label_" + i, [compAt[i][0], YT + 6], "above", text, undefined, 22);
    }
  });

  const wireChildren = [];
  wireChildren.push(kit.stroke("wire__left", [[X0, YB], [X0, YT]], { strokeWidth: 3, ms: MS.stroke }));
  wireChildren.push(kit.stroke("wire__right", [[X1, YB], [X1, YT]], { strokeWidth: 3, ms: MS.stroke }));

  if (batteryAnchors) {
    wireChildren.push(kit.stroke("wire__bl", [[X0, YB], batteryAnchors.left], { strokeWidth: 3, ms: MS.stroke }));
    wireChildren.push(kit.stroke("wire__br", [batteryAnchors.right, [X1, YB]], { strokeWidth: 3, ms: MS.stroke }));
  } else {
    wireChildren.push(kit.stroke("wire__bottom", [[X0, YB], [X1, YB]], { strokeWidth: 3, ms: MS.stroke }));
  }

  if (topology === "parallel") {
    wireChildren.push(kit.stroke("wire__top", [[X0, YT], [X1, YT]], { strokeWidth: 3, ms: MS.stroke }));
    othersIdx.forEach((origI) => {
      const x = compAt[origI][0];
      const a = compAnchors[origI];
      wireChildren.push(kit.stroke("wire__rung_top_" + origI, [[x, YT], a.right], { strokeWidth: 3, ms: MS.stroke }));
      wireChildren.push(kit.stroke("wire__rung_bot_" + origI, [[x, YB], a.left], { strokeWidth: 3, ms: MS.stroke }));
    });
  } else {
    let prevPt = [X0, YT];
    othersIdx.forEach((origI) => {
      const a = compAnchors[origI];
      wireChildren.push(kit.stroke("wire__top_" + origI, [prevPt, a.left], { strokeWidth: 3, ms: MS.stroke }));
      prevPt = a.right;
    });
    wireChildren.push(kit.stroke("wire__top_end", [prevPt, [X1, YT]], { strokeWidth: 3, ms: MS.stroke }));
  }
  push(kit.group("wire", wireChildren));
  anchors.wire = [CX, CY];

  if (showCurrent) {
    function arrowSeg(a, b, len) {
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const L = Math.hypot(dx, dy) || 1;
      const ux = dx / L, uy = dy / L;
      const half = Math.min(len, L * 0.7) / 2;
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      return [[mx - ux * half, my - uy * half], [mx + ux * half, my + uy * half]];
    }
    let ci = 0;
    push(kit.stroke("current_" + ci, arrowSeg([X0, YB], [X0, YT], 55), { arrowhead: "end", strokeWidth: 3, color: C.accent, ms: MS.arrow })); ci++;
    push(kit.stroke("current_" + ci, arrowSeg([X1, YT], [X1, YB], 55), { arrowhead: "end", strokeWidth: 3, color: C.accent, ms: MS.arrow })); ci++;
    if (batteryAnchors) {
      push(kit.stroke("current_" + ci, arrowSeg(batteryAnchors.left, [X0, YB], 55), { arrowhead: "end", strokeWidth: 3, color: C.accent, ms: MS.arrow })); ci++;
      push(kit.stroke("current_" + ci, arrowSeg([X1, YB], batteryAnchors.right, 55), { arrowhead: "end", strokeWidth: 3, color: C.accent, ms: MS.arrow })); ci++;
    } else {
      push(kit.stroke("current_" + ci, arrowSeg([X1, YB], [X0, YB], 55), { arrowhead: "end", strokeWidth: 3, color: C.accent, ms: MS.arrow })); ci++;
    }
  }

  return { drawables, labels, anchors, order };
---
template: projectile_motion
title: Projectile motion trajectory
version: 1
kit: 2
status: ready
description: >-
  A projectile's parabolic trajectory computed from real kinematics (g = 10):
  launched at a given speed and angle, the path is sampled from the exact
  closed-form y(x), with velocity-vector arrows at launch, apex (horizontal
  only — vertical velocity is zero at the top) and landing, optional dashed
  horizontal/vertical component arrows, and a hatched ground line. speed and
  angle_deg are plain numeric params, so an `animate` command can sweep either
  one smoothly and the whole parabola, apex and vectors re-derive themselves
  frame by frame. Choose this scene for ANY request about projectile motion,
  trajectory, range, a launch angle, time of flight, or the height/velocity
  of a thrown or fired object (ignoring air resistance).
params:
  type: object
  properties:
    speed:
      type: number
      description: "Launch speed, 1-10 arbitrary units (default 6)."
    angle_deg:
      type: number
      description: "Launch angle above the horizontal, 5-85 degrees (default 45). Animatable."
    show_vectors:
      type: boolean
      description: "Velocity arrows at launch, apex and landing (default true)."
    show_components:
      type: boolean
      description: "Dashed horizontal/vertical component arrows at launch and landing, when show_vectors is also true (default false)."
    label_apex:
      type: boolean
      description: "Label the apex point (default true)."
element_ids:
  ground: the ground line and hatching (one group)
  path: the trajectory parabola
  v0 / v_apex / v_land: the velocity-vector arrows at launch, apex (horizontal only) and landing, present when show_vectors
  vx_<k> / vy_<k>: dashed horizontal/vertical component arrows (k=0 launch, k=1 landing), present when show_vectors and show_components
  apex_label: the "Apex" caption, present when label_apex
examples:
  - request: "Show projectile motion at 45 degrees."
    params: { speed: 6, angle_deg: 45 }
  - request: "Show the horizontal and vertical velocity components of a projectile launched at a steep angle."
    params: { speed: 8, angle_deg: 70, show_components: true }
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const speed = Math.min(10, Math.max(1, params.speed ?? 6));
  const angleDeg = Math.min(85, Math.max(5, params.angle_deg ?? 45));
  const showVectors = params.show_vectors !== false;
  const showComponents = showVectors && params.show_components === true;
  const labelApex = params.label_apex !== false;

  const g = 10;
  const th = (angleDeg * Math.PI) / 180;
  const cosT = Math.cos(th), sinT = Math.sin(th);
  const R = (speed * speed * Math.sin(2 * th)) / g;
  const H = (speed * sinT) * (speed * sinT) / (2 * g);

  const X0 = 120, groundY = 200;
  const availW = 650, availH = 430;
  const S = Math.min(availW / Math.max(R, 0.001), availH / Math.max(H, 0.001));
  const worldToScreen = (wx, wy) => [X0 + wx * S, groundY + wy * S];

  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };

  const landingX = X0 + R * S;
  const groundX0 = X0 - 40, groundX1 = landingX + 40;
  const groundChildren = [kit.stroke("ground__line", [[groundX0, groundY], [groundX1, groundY]], { strokeWidth: 3, color: C.guide, ms: MS.axis })];
  kit.hatch([groundX0, groundY], [groundX1, groundY], 22, 16, -1).forEach(([a, b], i) => {
    groundChildren.push(kit.stroke("ground__hatch" + i, [a, b], { strokeWidth: 2, color: C.guide, ms: MS.guides }));
  });
  push(kit.group("ground", groundChildren));

  const fn = (x) => x * Math.tan(th) - (g * x * x) / (2 * speed * speed * cosT * cosT);
  const rawPts = kit.sample(fn, 0, R, 60);
  const pathPts = rawPts.map(([wx, wy]) => worldToScreen(wx, wy));
  push(kit.stroke("path", pathPts, { strokeWidth: 4, color: C.supply, ms: MS.curve }));
  anchors.path = pathPts[Math.floor(pathPts.length / 2)];

  const launchPt = worldToScreen(0, 0);
  const apexPt = worldToScreen(R / 2, H);
  const landPt = worldToScreen(R, 0);
  anchors.apex_label = apexPt;

  if (showVectors) {
    const mag2len = (m) => 24 + m * 10;

    const v0Len = mag2len(speed);
    const v0Tip = [launchPt[0] + v0Len * cosT, launchPt[1] + v0Len * sinT];
    push(kit.group("v0", [
      kit.stroke("v0__arrow", [launchPt, v0Tip], { arrowhead: "end", strokeWidth: 4, color: C.demand, ms: MS.arrow }),
      kit.text("v0__label", [v0Tip[0] - sinT * 20, v0Tip[1] + cosT * 20], "v₀", { fontSize: 20, color: C.demand }),
    ]));
    anchors.v0 = v0Tip;

    const vApexLen = mag2len(speed * cosT);
    const vApexTip = [apexPt[0] + vApexLen, apexPt[1]];
    push(kit.group("v_apex", [
      kit.stroke("v_apex__arrow", [apexPt, vApexTip], { arrowhead: "end", strokeWidth: 4, color: C.demand, ms: MS.arrow }),
      kit.text("v_apex__label", [vApexTip[0] + 12, vApexTip[1] + 18], "v", { fontSize: 20, color: C.demand }),
    ]));
    anchors.v_apex = vApexTip;

    const vLandLen = mag2len(speed);
    const vLandTip = [landPt[0] + vLandLen * cosT, landPt[1] - vLandLen * sinT];
    push(kit.group("v_land", [
      kit.stroke("v_land__arrow", [landPt, vLandTip], { arrowhead: "end", strokeWidth: 4, color: C.demand, ms: MS.arrow }),
      kit.text("v_land__label", [vLandTip[0] + 14 * cosT, vLandTip[1] - 14 * sinT], "v", { fontSize: 20, color: C.demand }),
    ]));
    anchors.v_land = vLandTip;

    if (showComponents) {
      const vxLen = mag2len(speed * cosT);
      const vyLen = mag2len(speed * sinT);
      push(kit.stroke("vx_0", [launchPt, [launchPt[0] + vxLen, launchPt[1]]], { arrowhead: "end", strokeWidth: 2.5, color: C.guide, dash: true, ms: MS.guides }));
      push(kit.stroke("vy_0", [launchPt, [launchPt[0], launchPt[1] + vyLen]], { arrowhead: "end", strokeWidth: 2.5, color: C.guide, dash: true, ms: MS.guides }));
      push(kit.stroke("vx_1", [landPt, [landPt[0] + vxLen, landPt[1]]], { arrowhead: "end", strokeWidth: 2.5, color: C.guide, dash: true, ms: MS.guides }));
      push(kit.stroke("vy_1", [landPt, [landPt[0], landPt[1] - vyLen]], { arrowhead: "end", strokeWidth: 2.5, color: C.guide, dash: true, ms: MS.guides }));
    }
  }

  if (labelApex) {
    labels.push(kit.label("apex_label", apexPt, "above", "Apex", { fontSize: 22 }));
    order.push("apex_label");
  }

  return { drawables, labels, anchors, order };
---
template: bicycle_drivetrain
title: Bicycle drivetrain & gear ratio
version: 1
kit: 1
status: ready
description: 'A side view of a bicycle drivetrain: a toothed front chainring and a smaller rear cog (sprocket) drawn at their correct relative sizes, joined by a chain that runs along both external tangents, plus the pedal crank, the rear wheel rim with spokes, force/speed arrows, and a gear-ratio caption. Choose this for anything about bicycle gears, gear ratios, chainrings, cassettes, cogs, sprockets, derailleurs, mechanical advantage on a bike, or why a small chainring with a big cog is easier to pedal than a big chainring with a small cog. Teeth counts are params, so you can show a climbing gear vs a top gear by re-rendering with different numbers.'
params:
  type: object
  properties:
    front_teeth:
      type: integer
      description: Teeth on the front chainring (default 52). Sizes are drawn in proportion to the two teeth counts.
      minimum: 7
      maximum: 80
    rear_teeth:
      type: integer
      description: Teeth on the rear cog / sprocket (default 16).
      minimum: 7
      maximum: 80
    show_chain:
      type: boolean
      description: Draw the chain wrapping both sprockets (default true).
    show_crank:
      type: boolean
      description: Draw the pedal crank arm and pedal (default true).
    show_arrows:
      type: boolean
      description: Draw the pedal force arrow and the rear-wheel rotation/speed arrow (default true). Turn off for a plain mechanical diagram.
    show_wheel:
      type: boolean
      description: Draw the faint rear wheel rim and spokes behind the cog for context (default true).
    show_teeth:
      type: boolean
      description: Draw individual teeth on both sprockets (default true).
    show_ratio:
      type: boolean
      description: Show the gear-ratio caption at the bottom (default true).
    front_label:
      type: string
      description: Label for the chainring (default "52T chainring" from front_teeth).
    rear_label:
      type: string
      description: Label for the rear cog (default "16T rear cog" from rear_teeth).
    chain_label:
      type: string
      description: Label for the chain (default "Chain").
    crank_label:
      type: string
      description: Label for the crank arm (default "Crank arm").
    pedal_label:
      type: string
      description: Label for the pedal force arrow (default "Pedal force").
    wheel_label:
      type: string
      description: Label for the rear-wheel speed arrow (default "Wheel turns N× per pedal turn").
    ratio_caption:
      type: string
      description: Override the bottom gear-ratio caption text.
element_ids:
  wheel_rim: faint rear wheel rim arc
  spokes: the rear wheel spokes (one group)
  chainring: front chainring pitch circle
  chainring_teeth: the chainring's teeth (one group)
  chainring_hub: crank axle / bottom bracket circle
  cog: rear cog pitch circle
  cog_teeth: the rear cog's teeth (one group)
  cog_hub: rear axle circle
  chain: the closed chain loop around both sprockets
  chain_links: the chain link ticks along the two straight runs (one group)
  crank: the crank arm
  pedal: the pedal at the end of the crank
  pedal_arrow: downward force arrow at the pedal
  wheel_arrow: curved rotation/speed arrow around the rear wheel
  ratio_caption: the gear-ratio caption text at the bottom
  label_front / label_rear / label_chain / label_crank / label_pedal_force / label_wheel: the name labels
examples:
  - request: Draw a bike drivetrain and explain what a gear ratio is.
    params: {}
  - request: Why is a small chainring with a big cog easier to pedal? Show a climbing gear.
    params:
      front_teeth: 34
      rear_teeth: 28
      show_arrows: true
      pedal_label: Less force needed
      wheel_label: Wheel turns only 1.21× per pedal turn
layout: |-
  const P=params||{};
  const C=kit.COLORS,MS=kit.SKETCH_MS;
  const cl=(v,d)=>{const n=Math.round(Number(v));return Number.isFinite(n)?Math.max(7,Math.min(80,n)):d;};
  const front=cl(P.front_teeth??52,52);
  const rear=cl(P.rear_teeth??16,16);
  const showChain=P.show_chain!==false;
  const showCrank=P.show_crank!==false;
  const showArrows=P.show_arrows!==false;
  const showWheel=P.show_wheel!==false;
  const showTeeth=P.show_teeth!==false;
  const showRatio=P.show_ratio!==false;
  const ratio=front/rear;
  const rs=String(Math.round(ratio*100)/100);
  const drawables=[],labels=[],anchors={},order=[];
  const push=(d)=>{drawables.push(d);order.push(d.id);};
  const lab=(id,a,side,t,color,fs)=>{if(!t)return;labels.push(kit.label(id,a,side,t,{color:color,fontSize:fs??24}));order.push(id);};
  const rad=(deg)=>deg*Math.PI/180;
  const k=135/Math.max(front,rear);
  const r1=Math.max(24,front*k),r2=Math.max(24,rear*k);
  const c1=[368,400],c2=[762,400];
  anchors.chainring=c1;anchors.cog=c2;

  const rimR=208;
  if(showWheel){
    push(kit.stroke("wheel_rim",kit.arc(c2,rimR,rad(102),rad(-102),46),{color:C.guide,strokeWidth:2.5,ms:MS.curve}));
    const spokes=[];
    [80,40,0,-40,-80].forEach((deg,i)=>{
      const th=rad(deg);
      spokes.push(kit.stroke("spoke_"+i,[[c2[0]+(r2+7)*Math.cos(th),c2[1]+(r2+7)*Math.sin(th)],[c2[0]+rimR*Math.cos(th),c2[1]+rimR*Math.sin(th)]],{color:C.guide,strokeWidth:1.8,ms:MS.guides}));
    });
    push(kit.group("spokes",spokes));
    anchors.wheel=[c2[0]+rimR*Math.cos(rad(45)),c2[1]+rimR*Math.sin(rad(45))];
  }

  push(kit.stroke("chainring",[c1],{shapeHint:{type:"circle",c:c1,r:r1},strokeWidth:4.5,ms:MS.node}));
  if(showTeeth){
    const t=[];const n=Math.min(front,72);
    for(let i=0;i<n;i++){const th=(i/n)*2*Math.PI;t.push(kit.stroke("ct_"+i,[[c1[0]+r1*Math.cos(th),c1[1]+r1*Math.sin(th)],[c1[0]+(r1+10)*Math.cos(th),c1[1]+(r1+10)*Math.sin(th)]],{strokeWidth:2.5,ms:MS.dot}));}
    push(kit.group("chainring_teeth",t));
  }
  push(kit.stroke("chainring_hub",[c1],{shapeHint:{type:"circle",c:c1,r:13},strokeWidth:3,ms:MS.dot}));
  lab("label_front",[c1[0],c1[1]+r1+14],"above",P.front_label??(front+"T chainring"),C.ink,26);

  push(kit.stroke("cog",[c2],{shapeHint:{type:"circle",c:c2,r:r2},strokeWidth:4.5,ms:MS.node}));
  if(showTeeth){
    const t=[];const n=Math.min(rear,72);
    for(let i=0;i<n;i++){const th=(i/n)*2*Math.PI;t.push(kit.stroke("rt_"+i,[[c2[0]+r2*Math.cos(th),c2[1]+r2*Math.sin(th)],[c2[0]+(r2+9)*Math.cos(th),c2[1]+(r2+9)*Math.sin(th)]],{strokeWidth:2.5,ms:MS.dot}));}
    push(kit.group("cog_teeth",t));
  }
  push(kit.stroke("cog_hub",[c2],{shapeHint:{type:"circle",c:c2,r:10},strokeWidth:3,ms:MS.dot}));
  lab("label_rear",[c2[0],c2[1]+r2+14],"above",P.rear_label??(rear+"T rear cog"),C.ink,26);

  const d=Math.hypot(c2[0]-c1[0],c2[1]-c1[1]);
  const alpha=Math.atan2(c2[1]-c1[1],c2[0]-c1[0]);
  const gamma=Math.acos(Math.max(-1,Math.min(1,(r1-r2)/d)));
  const aUp=alpha+gamma,aLo=alpha-gamma;
  const p1u=[c1[0]+r1*Math.cos(aUp),c1[1]+r1*Math.sin(aUp)];
  const p2u=[c2[0]+r2*Math.cos(aUp),c2[1]+r2*Math.sin(aUp)];
  const p1l=[c1[0]+r1*Math.cos(aLo),c1[1]+r1*Math.sin(aLo)];
  const p2l=[c2[0]+r2*Math.cos(aLo),c2[1]+r2*Math.sin(aLo)];
  if(showChain){
    const chainPts=[p1u].concat(kit.arc(c2,r2,aUp,aLo,20)).concat(kit.arc(c1,r1,aLo,aUp-2*Math.PI,30));
    push(kit.stroke("chain",chainPts,{closed:true,strokeWidth:3.5,ms:MS.curve}));
    const links=[];
    [[p1u,p2u],[p1l,p2l]].forEach((rn,ri)=>{
      const a=rn[0],b=rn[1];
      const L=Math.hypot(b[0]-a[0],b[1]-a[1])||1;
      const nx=-(b[1]-a[1])/L,ny=(b[0]-a[0])/L;
      const n=Math.max(3,Math.round(L/28));
      for(let i=1;i<n;i++){
        const t=i/n,qx=a[0]+(b[0]-a[0])*t,qy=a[1]+(b[1]-a[1])*t;
        links.push(kit.stroke("chain_link_"+ri+"_"+i,[[qx+nx*5,qy+ny*5],[qx-nx*5,qy-ny*5]],{strokeWidth:2.5,ms:MS.dot}));
      }
    });
    push(kit.group("chain_links",links));
    anchors.chain=[(p1u[0]+p2u[0])/2,(p1u[1]+p2u[1])/2];
    lab("label_chain",[(p1u[0]+p2u[0])/2,(p1u[1]+p2u[1])/2+8],"above",P.chain_label??"Chain",C.ink,24);
  }

  if(showCrank){
    const cAng=rad(-100);
    const L=r1+58;
    const pd=[c1[0]+L*Math.cos(cAng),c1[1]+L*Math.sin(cAng)];
    push(kit.stroke("crank",[c1,pd],{color:C.accent,strokeWidth:9,ms:MS.stroke}));
    const px=-Math.sin(cAng),py=Math.cos(cAng);
    push(kit.stroke("pedal",[[pd[0]+px*26,pd[1]+py*26],[pd[0]-px*26,pd[1]-py*26]],{color:C.accent,strokeWidth:10,ms:MS.stroke}));
    anchors.pedal=pd;
    lab("label_crank",[(c1[0]+pd[0])/2-16,(c1[1]+pd[1])/2],"left",P.crank_label??"Crank arm",C.accent,24);
    if(showArrows){
      const a0=[pd[0],pd[1]-18],a1=[pd[0],pd[1]-104];
      push(kit.stroke("pedal_arrow",[a0,a1],{color:C.demand,strokeWidth:4,arrowhead:"end",ms:MS.connector}));
      anchors.pedal_arrow=a1;
      lab("label_pedal_force",a1,"left",P.pedal_label??"Pedal force",C.demand,24);
    }
  }

  if(showArrows){
    const ar=Math.min(172,r2+64);
    const pts=kit.arc(c2,ar,rad(62),rad(-62),24);
    push(kit.stroke("wheel_arrow",pts,{color:C.supply,strokeWidth:4,arrowhead:"end",ms:MS.connector}));
    const tip=pts[pts.length-1];
    anchors.wheel_arrow=tip;
    lab("label_wheel",tip,"below-right",P.wheel_label??("Wheel turns "+rs+"\u00d7 per pedal turn"),C.supply,24);
  }

  if(showRatio){
    const cap=P.ratio_caption??(front+"T : "+rear+"T  =  "+rs+" wheel turns per pedal turn");
    push(kit.text("ratio_caption",[500,46],cap,{fontSize:30}));
    anchors.ratio=[500,46];
  }

  return {drawables,labels,anchors,order};
---
template: hydraulic_press
title: Hydraulic press (Pascal's principle)
version: 1
kit: 1
status: ready
description: 'A hydraulic press / lift / jack in cross-section: two connected cylinders of different bore joined by a fluid-filled channel, a small input piston pushed down by a force arrow and a wide output piston carrying a load block, with area labels (A₁, A₂), force labels, an optional displacement mark (d₁ down, d₂ = d₁/ratio up) and an optional pressure equation P = F₁/A₁ = F₂/A₂. Choose this scene for any request about hydraulic presses, hydraulic lifts, jacks, brakes, Pascal''s principle / Pascal''s law, pressure transmitted equally through a fluid, force multiplication, or ''why can a small force lift a heavy load''. The piston width ratio follows √(area ratio), since the drawing is a cross-section of round cylinders.'
params:
  type: object
  properties:
    areaRatio:
      type: number
      description: Output piston area divided by input piston area, A₂/A₁ (default 4). Clamped to 1.2–12 for drawability; the drawn bore ratio is its square root.
    inputForce:
      type: number
      description: Numeric value of the input force applied to the small piston (default 100). Output force is shown as inputForce × areaRatio.
    forceUnit:
      type: string
      description: Unit shown after force values (default "N").
    showValues:
      type: boolean
      description: Show numeric force values and the numeric area relation (default true). Set false for a purely symbolic figure with just F₁, F₂, A₁, A₂.
    inputLabel:
      type: string
      description: Symbol for the input force (default "F₁").
    outputLabel:
      type: string
      description: Symbol for the output force / lifted load (default "F₂").
    smallAreaLabel:
      type: string
      description: Label for the small piston area (default "A₁").
    largeAreaLabel:
      type: string
      description: Label for the large piston area (default "A₂").
    loadLabel:
      type: string
      description: Text written inside the load block on the big piston (default "Load"; e.g. "Car", "1000 kg").
    fluidLabel:
      type: string
      description: Label for the fluid in the connecting channel (default "Incompressible fluid"). Empty string hides it.
    title:
      type: string
      description: Optional caption across the top of the figure (e.g. "Hydraulic jack"). Empty by default.
    showDisplacement:
      type: boolean
      description: 'Show the displacement marks: the small piston travels d₁ down while the large piston rises only d₂ = d₁/ratio (default false). Use it when explaining that work is conserved.'
    showEquation:
      type: boolean
      description: Show the pressure equation lines P = F₁/A₁ = F₂/A₂ (and the numeric output force) at the top (default true).
element_ids:
  ground / ground_line: hatched ground the press rests on
  vessel_outer / vessel_inner: the two walls of the connected cylinders
  fluid: the shaded fluid filling the channel and both bores
  piston_small / piston_small_fill: the narrow input piston
  rod_small / plate_small: the input piston rod and its push plate
  piston_large / piston_large_fill: the wide output piston
  load / load_fill / load_text: the load block resting on the big piston
  force_in: the downward input force arrow
  force_out: the upward output force arrow above the load
  displacement: group of dashed levels and d₁/d₂ travel arrows (optional)
  eq_pressure / eq_force / eq_dist: the pressure, force and distance equation lines
  title: optional caption
  label_force_in / label_force_out / label_area_small / label_area_large / label_fluid / label_d1 / label_d2: the collision-solved name labels
examples:
  - request: Draw a hydraulic press and show why a small force can lift a heavy load.
    params: {}
  - request: 'Explain Pascal''s principle with a hydraulic jack lifting a car: 50 N input, area ratio 10, show the distances each piston moves.'
    params:
      areaRatio: 10
      inputForce: 50
      loadLabel: Car
      showDisplacement: true
      title: Hydraulic jack
layout: |-
  const C=kit.COLORS,MS=kit.SKETCH_MS;
  const drawables=[],labels=[],anchors={},order=[];
  const push=(d)=>{drawables.push(d);order.push(d.id);};
  const addLabel=(id,at,side,text,o)=>{labels.push(kit.label(id,at,side,text,o||{}));order.push(id);};
  const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  const rawR=Number(params.areaRatio);
  const r=clamp(Number.isFinite(rawR)&&rawR>0?rawR:4,1.2,12);
  const unit=params.forceUnit??"N";
  const showValues=params.showValues!==false;
  const rawF=Number(params.inputForce);
  const F1=Number.isFinite(rawF)?rawF:100;
  const F2=F1*r;
  const l1=params.inputLabel??"F₁";
  const l2=params.outputLabel??"F₂";
  const a1=params.smallAreaLabel??"A₁";
  const a2=params.largeAreaLabel??"A₂";
  const loadLabel=params.loadLabel??"Load";
  const fluidLabel=params.fluidLabel??"Incompressible fluid";
  const title=params.title??"";
  const showD=params.showDisplacement===true;
  const showEq=params.showEquation!==false;
  const fmt=(v)=>String(Math.round(v*10)/10);

  const w1=96;
  const w2=clamp(w1*Math.sqrt(r),130,300);
  const xs=250,xl=690;
  const xsL=xs-w1/2,xsR=xs+w1/2;
  const xlL=xl-w2/2,xlR=xl+w2/2;
  const yBot=120,yBase=200;
  const topS=560,topL=410;
  const ysP=430,ysT=ysP+22;
  const ylP=360,ylT=ylP+26;
  const plateY=585;
  const rectPts=(x0,y0,x1,y1)=>[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];

  const gy=yBot-2;
  push(kit.stroke("ground_line",[[xsL-46,gy],[xlR+46,gy]],{color:C.guide,strokeWidth:2.5,ms:MS.guides}));
  const gticks=kit.hatch([xsL-36,gy],[xlR+36,gy],22,18,-1).map((s,i)=>kit.stroke("ground_h"+i,s,{color:C.guide,strokeWidth:2,ms:MS.guides}));
  push(kit.group("ground",gticks));

  push(kit.stroke("vessel_outer",[[xsL,topS],[xsL,yBot],[xlR,yBot],[xlR,topL]],{strokeWidth:5,ms:MS.stroke}));
  push(kit.stroke("vessel_inner",[[xsR,topS],[xsR,yBase],[xlL,yBase],[xlL,topL]],{strokeWidth:5,ms:MS.stroke}));

  const fluidPts=[[xsL,ysP],[xsL,yBot],[xlR,yBot],[xlR,ylP],[xlL,ylP],[xlL,yBase],[xsR,yBase],[xsR,ysP]];
  push(kit.area("fluid",fluidPts,C.supply,{opacity:0.25,ms:MS.region}));

  push(kit.area("piston_small_fill",rectPts(xsL,ysP,xsR,ysT),C.ink,{opacity:0.18,ms:MS.region}));
  push(kit.stroke("piston_small",rectPts(xsL,ysP,xsR,ysT),{closed:true,strokeWidth:4,ms:MS.node}));
  push(kit.stroke("rod_small",[[xs,ysT],[xs,plateY]],{strokeWidth:4,ms:MS.connector}));
  push(kit.stroke("plate_small",[[xs-42,plateY],[xs+42,plateY]],{strokeWidth:4,ms:MS.connector}));

  push(kit.area("piston_large_fill",rectPts(xlL,ylP,xlR,ylT),C.ink,{opacity:0.18,ms:MS.region}));
  push(kit.stroke("piston_large",rectPts(xlL,ylP,xlR,ylT),{closed:true,strokeWidth:4,ms:MS.node}));

  const bw=Math.min(w2*0.78,230),bh=82;
  const by0=ylT,by1=ylT+bh;
  push(kit.area("load_fill",rectPts(xl-bw/2,by0,xl+bw/2,by1),C.accent,{opacity:0.18,ms:MS.region}));
  push(kit.stroke("load",rectPts(xl-bw/2,by0,xl+bw/2,by1),{closed:true,color:C.accent,strokeWidth:4,ms:MS.node}));
  if(loadLabel)push(kit.text("load_text",[xl,by0+bh/2],loadLabel,{fontSize:28,color:C.accent}));

  push(kit.stroke("force_in",[[xs,690],[xs,plateY+8]],{arrowhead:"end",color:C.demand,strokeWidth:5,ms:MS.connector}));
  addLabel("label_force_in",[xs-8,644],"left",showValues?l1+" = "+fmt(F1)+" "+unit:l1,{color:C.demand,fontSize:28});
  push(kit.stroke("force_out",[[xl,by1+8],[xl,by1+78]],{arrowhead:"end",color:C.accent,strokeWidth:5,ms:MS.connector}));
  addLabel("label_force_out",[xl+10,by1+48],"right",showValues?l2+" = "+fmt(F2)+" "+unit:l2,{color:C.accent,fontSize:28});

  addLabel("label_area_small",[xs,ysP+11],"right",a1,{color:C.ink,fontSize:26});
  addLabel("label_area_large",[xl,ylP+13],"left",showValues?a2+" = "+fmt(r)+" × "+a1:a2,{color:C.ink,fontSize:26});
  if(fluidLabel)addLabel("label_fluid",[470,178],"above",fluidLabel,{color:C.supply,fontSize:24});

  if(showD){
    const d1=70,d2=70/r;
    const kids=[];
    kids.push(kit.stroke("disp_s_now",[[xsL-50,ysT],[xsL,ysT]],{dash:true,color:C.guide,strokeWidth:2,ms:MS.guides}));
    kids.push(kit.stroke("disp_s_next",[[xsL-50,ysT-d1],[xsR+10,ysT-d1]],{dash:true,color:C.guide,strokeWidth:2,ms:MS.guides}));
    kids.push(kit.stroke("disp_s_arrow",[[xsL-32,ysT],[xsL-32,ysT-d1]],{arrowhead:"end",color:C.guide,strokeWidth:2.5,ms:MS.connector}));
    kids.push(kit.stroke("disp_l_now",[[xlR,ylT],[xlR+50,ylT]],{dash:true,color:C.guide,strokeWidth:2,ms:MS.guides}));
    kids.push(kit.stroke("disp_l_next",[[xlL-10,ylT+d2],[xlR+50,ylT+d2]],{dash:true,color:C.guide,strokeWidth:2,ms:MS.guides}));
    kids.push(kit.stroke("disp_l_arrow",[[xlR+32,ylT],[xlR+32,ylT+d2]],{arrowhead:"end",color:C.guide,strokeWidth:2.5,ms:MS.connector}));
    push(kit.group("displacement",kids));
    addLabel("label_d1",[xsL-36,ysT-d1/2],"left","d₁",{color:C.guide,fontSize:26});
    addLabel("label_d2",[xlR+36,ylT+d2/2],"right","d₂",{color:C.guide,fontSize:26});
    anchors.d1=[xsL-32,ysT-d1/2];
    anchors.d2=[xlR+32,ylT+d2/2];
  }

  if(showEq){
    push(kit.text("eq_pressure",[452,662],"P = "+l1+"/"+a1+" = "+l2+"/"+a2,{fontSize:30,color:C.ink}));
    if(showValues)push(kit.text("eq_force",[452,622],l2+" = "+fmt(r)+" × "+l1+" = "+fmt(F2)+" "+unit,{fontSize:26,color:C.accent}));
    if(showD)push(kit.text("eq_dist",[452,586],"d₂ = d₁ / "+fmt(r),{fontSize:26,color:C.guide}));
    anchors.equation=[452,662];
  }
  if(title)push(kit.text("title",[500,716],title,{fontSize:32}));

  anchors.piston_small=[xs,ysP+11];
  anchors.piston_large=[xl,ylP+13];
  anchors.fluid=[470,160];
  anchors.load=[xl,by0+bh/2];
  anchors.force_in=[xs,644];
  anchors.force_out=[xl,by1+45];
  anchors.small_cylinder=[xs,ysP+70];
  anchors.large_cylinder=[xl,ylP-70];
  anchors.channel=[470,160];

  return {drawables,labels,anchors,order};
