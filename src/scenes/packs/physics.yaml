pack: physics
title: Physics
description: Optics ray diagrams, wave diagrams, circuits, projectiles, a bicycle drivetrain and a hydraulic press — classroom physics figures with computed geometry.
---
template: ray_diagram
interaction: "Drag the object (distance and height) or either F (focal length); the rays and the image follow, running off to infinity at F and coming back virtual."
title: Lens ray diagram
version: 2
kit: 11
status: ready
description: >-
  A thin-lens ray diagram with the geometry COMPUTED from the thin-lens
  equation 1/f = 1/d + 1/dᵢ: object arrow, lens, both focal points, the two
  principal rays (parallel→through F, and straight through the centre), and
  the image. A converging lens (default) makes a real, inverted image when
  the object is outside f, a virtual, upright, dashed one (rays traced back)
  when it is inside f, and no image at all with the object exactly at f (the
  rays leave parallel); a diverging lens (lens_type) always makes a small,
  upright, virtual image. Choose this scene for ANY request about lenses,
  ray diagrams, image formation, real vs virtual images, magnification, a
  magnifying glass, a camera, projector or eye lens, or "what happens when
  the object moves inside the focal length". Vary focal_length and
  object_distance and the figure re-derives itself — rescaled to fit on
  every frame unless `view` fixes the scale: set view to animate the object
  THROUGH the focal point, so the object really moves and the image runs
  off to infinity and comes back virtual. Paused, the viewer drags the
  object (distance and height) and either F (the focal length), and with
  show_distances scrubs or taps the d and f numbers; every value recomputes
  live ({lens.di}, m, do, f, image_kind: 1 real, −1 virtual, 0 none).
params:
  type: object
  properties:
    focal_length:
      type: number
      description: "Focal length in arbitrary units (default 10), always positive; lens_type says which way it bends."
    object_distance:
      type: number
      description: "Object distance from the lens, same units (default 25). Less than focal_length gives a virtual image; equal gives none."
    object_height:
      type: number
      description: "Object height in units (default 6)."
    lens_type:
      type: string
      enum: [converging, diverging]
      description: "converging (convex, default) or diverging (concave: the image is always virtual, upright and smaller)."
    show_labels:
      type: boolean
      description: "F / object / image labels (default true)."
    show_distances:
      type: boolean
      description: "Dimension marks under the axis on the object's side: d (object to lens) and f (F to lens), as numbers the viewer can scrub or tap (default false)."
    view:
      type: object
      description: "Fix the scale: the axis units shown left and right of the lens, and the height above the axis the page holds. Without it the figure refits to every object distance; set it (e.g. {left: 30, right: 45, height: 8}) to animate object_distance through f. The live drag sets it."
      properties:
        left: { type: number }
        right: { type: number }
        height: { type: number }
      required: [left, right]
element_ids:
  axis: the optical axis
  lens: the lens (double-headed arrow; arrowheads turned inward for a diverging lens)
  focal_left / focal_right: the focal-point ticks
  object: the object arrow
  ray_parallel: the parallel-then-through-focus principal ray
  ray_center: the straight-through-center principal ray
  ray_parallel_ext / ray_center_ext: dashed back-extensions, present only when the image is virtual (ray_center_ext only for a converging lens)
  image: the image arrow (dashed when virtual); absent with the object at f, where there is no image
  label_object / label_image / label_left / label_right: the labels (label_left and label_right are the two F labels)
  do_mark / do_value: the object-distance dimension arrow and its "d = 25" number (show_distances)
  f_mark / f_value: the focal-length dimension arrow and its "f = 10" number (show_distances)
examples:
  - request: "Draw a ray diagram for a converging lens with the object outside the focal length."
    params: { focal_length: 10, object_distance: 25, object_height: 6 }
  - request: "Show why a magnifying glass makes a virtual image when the object is inside the focal length."
    params: { focal_length: 12, object_distance: 7, object_height: 5 }
  - request: "Why does a diverging lens always make a smaller, upright image?"
    params: { focal_length: 10, object_distance: 20, object_height: 6, lens_type: diverging }
  - request: "Move the object in through the focal point and watch the image flip."
    params: { focal_length: 10, object_distance: 25, object_height: 4, show_distances: true, view: { left: 30, right: 45, height: 8 } }
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const num = (v, d) => (typeof v === "number" && Number.isFinite(v) ? v : d);
  const diverging = params.lens_type === "diverging";
  const f = Math.max(0.5, num(params.focal_length, 10));
  const fs = diverging ? -f : f;                     // the signed focal length
  const showLabels = params.show_labels !== false;
  const showDist = params.show_distances === true;
  const vw = params.view && typeof params.view === "object" ? params.view : null;
  const view = vw && num(vw.left, 0) > 0 && num(vw.right, 0) > 0
    ? { left: vw.left, right: vw.right, height: num(vw.height, 0) > 0 ? vw.height : null }
    : null;
  // A fixed view keeps the object on its page: its foot at x ≥ 110.
  const dObj = Math.min(view ? view.left : Infinity, Math.max(0.2, num(params.object_distance, 25)));
  const hObj = Math.max(0.1, num(params.object_height, 6));
  // Thin lens, 1/f = 1/d + 1/dᵢ. With the object AT f (converging) the rays
  // leave parallel: the image is at infinity, and there is none to draw.
  const atInf = !diverging && Math.abs(dObj - f) < 1e-9 * Math.max(1, f);
  const dImg = atInf ? Infinity : (fs * dObj) / (dObj - fs);   // < 0: virtual, on the object's side
  const m = atInf ? Infinity : -dImg / dObj;
  const hImg = m * hObj;
  const virtual = !atInf && dImg < 0;
  // Scale to fit, unless `view` fixes it. Virtual images sit FARTHER from the
  // lens than the object (converging), and the outgoing rays are drawn on to
  // 2f+2 — both must be inside the span. An image far out near d = f is capped
  // at 8× the figure's own size (it runs off the page rather than shrinking
  // the page to a dot), and the left span always holds the near F. The
  // object stands a little in from the page's edge — 1.3× its distance — so
  // a viewer can also pull it farther away.
  const CAP = 8 * Math.max(dObj, f);
  const dFit = atInf ? 0 : Math.min(Math.abs(dImg), CAP);
  const hFit = atInf ? hObj : (hObj * dFit) / dObj;
  const leftU = view ? view.left : Math.max(1.3 * dObj, virtual ? dFit : 0, f);
  const rightU = view ? view.right : Math.max(virtual || atInf ? 2 * f + 2 : dFit, 2 * f);
  const sx = 780 / (leftU + rightU);
  // Up to 250 above the axis; an inverted image gets 215 below it, which
  // keeps it (and its label) above the caption band.
  const sy = view ? (view.height ? 250 / view.height : sx) : Math.min(sx, 250 / Math.max(hObj, virtual ? hFit : 0), !virtual && !atInf ? 215 / hFit : Infinity);
  const lensX = 110 + leftU * sx, axisY = 375;
  const X = (u) => lensX + u * sx;                 // u < 0 left of the lens
  const Y = (h) => axisY + h * sy;
  const P = ([u, h]) => [X(u), Y(h)];
  // Everything is clipped to the page: a far image is cut at the edge, and
  // nothing reaches down into the caption band (y < 150).
  const B = { x0: 60, x1: 940, y0: axisY - 225, y1: axisY + 290 };
  const inside = (p) => p[0] >= B.x0 - 1e-6 && p[0] <= B.x1 + 1e-6 && p[1] >= B.y0 - 1e-6 && p[1] <= B.y1 + 1e-6;
  const clipSeg = (a, b) => {
    let t0 = 0, t1 = 1;
    const dx = b[0] - a[0], dy = b[1] - a[1];
    for (const [p, q] of [[-dx, a[0] - B.x0], [dx, B.x1 - a[0]], [-dy, a[1] - B.y0], [dy, B.y1 - a[1]]]) {
      if (p === 0) { if (q < 0) return null; continue; }
      const r = q / p;
      if (p < 0) { if (r > t1) return null; if (r > t0) t0 = r; }
      else { if (r < t0) return null; if (r < t1) t1 = r; }
    }
    return { a: [a[0] + t0 * dx, a[1] + t0 * dy], b: [a[0] + t1 * dx, a[1] + t1 * dy], cut: t1 < 1 };
  };
  // The first stretch of a polyline that is on the page (null: none of it).
  const clip = (pts) => {
    const out = [];
    for (let i = 1; i < pts.length; i++) {
      const s = clipSeg(pts[i - 1], pts[i]);
      if (!s) { if (out.length) break; continue; }
      if (!out.length) out.push(s.a);
      out.push(s.b);
      if (s.cut) break;
    }
    return out.length >= 2 ? out : null;
  };
  const C_OBJ = C.supply, C_R1 = C.demand, C_R2 = C.accent;
  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  const label = (id, anchor, side, text, color) => {
    if (!showLabels) return;
    labels.push(kit.label(id, anchor, side, text, { color, fontSize: 24 }));
    order.push(id);
  };
  // A ray in lens units, clipped to the page; absent when none of it shows.
  const ray = (id, ptsU, o) => {
    const pts = clip(ptsU.map(P));
    if (pts) push(kit.stroke(id, pts, o));
    return pts;
  };
  push(kit.stroke("axis", [[70, axisY], [930, axisY]], { strokeWidth: 2.5, color: C.guide, ms: MS.axis }));
  const top = axisY + 210, bot = axisY - 210;
  if (diverging) {
    // Arrowheads turned inward: the textbook's concave lens.
    push(kit.group("lens", [
      kit.stroke("lens__line", [[lensX, bot], [lensX, top]], { strokeWidth: 4, ms: MS.axis }),
      kit.stroke("lens__top", [[lensX - 14, top + 14], [lensX, top], [lensX + 14, top + 14]], { strokeWidth: 4, ms: MS.axis }),
      kit.stroke("lens__bottom", [[lensX - 14, bot - 14], [lensX, bot], [lensX + 14, bot - 14]], { strokeWidth: 4, ms: MS.axis }),
    ]));
  } else {
    push(kit.stroke("lens", [[lensX, bot], [lensX, top]], { arrowhead: "both", strokeWidth: 4, ms: MS.axis }));
  }
  anchors.lens = [lensX, top];
  for (const [id, u] of [["focal_left", -f], ["focal_right", f]]) {
    if (X(u) < B.x0 || X(u) > B.x1) continue;
    push(kit.stroke(id, [[X(u), axisY - 9], [X(u), axisY + 9]], { strokeWidth: 3, ms: MS.dot }));
    anchors[id] = [X(u), axisY];
    label("label_" + id.slice(6), [X(u), axisY - 26], "below", "F");
  }
  const T = [-dObj, hObj], L = [0, hObj], O = [0, 0];
  const tip = P(T);
  push(kit.stroke("object", [[X(-dObj), axisY], tip], { arrowhead: "end", strokeWidth: 5, color: C_OBJ, ms: MS.arrow }));
  anchors.object = tip;
  label("label_object", [tip[0], tip[1] + 26], "above", "Object", C_OBJ);
  // The point on line p→q at u (p and q never share a u here).
  const along = (p, q, u) => [u, p[1] + ((q[1] - p[1]) * (u - p[0])) / (q[0] - p[0])];
  const I = atInf ? null : [dImg, hImg];
  const uEnd = rightU;                             // the page's right edge, in lens units
  const spread = virtual || atInf;                 // the rays leave the lens apart
  // Ray 1: parallel to the axis, then through F (away from the near F, diverging).
  ray("ray_parallel", spread ? [T, L, along(L, [fs, 0], uEnd)] : [T, L, I], { arrowhead: "end", strokeWidth: 3, color: C_R1, ms: MS.connector });
  // Ray 2: straight through the centre.
  ray("ray_center", spread ? [T, along(T, O, uEnd)] : [T, I], { arrowhead: "end", strokeWidth: 3, color: C_R2, ms: MS.connector });
  if (virtual) {
    // Traced back: to the image (converging), or on to the near F it seems to
    // come from (diverging) — the image lies on that line, between F and the lens.
    ray("ray_parallel_ext", [L, diverging ? [fs, 0] : I], { dash: true, strokeWidth: 2.5, color: C_R1, ms: MS.guides });
    if (!diverging) ray("ray_center_ext", [T, I], { dash: true, strokeWidth: 2.5, color: C_R2, ms: MS.guides });
  }
  if (I) {
    const imgTip = P(I);
    const shown = inside(imgTip);
    const pts = clip([[X(dImg), axisY], imgTip]);
    if (pts) {
      // A cut image has no arrowhead: its tip is off the page.
      push(kit.stroke("image", pts, { arrowhead: shown ? "end" : undefined, strokeWidth: 5, color: C.ink, dash: virtual, ms: MS.arrow }));
      anchors.image = pts[pts.length - 1];
      // An upright image is named above its tip; an inverted one right of its
      // tip, where the rays that meet there leave room — clear of the caption
      // band below it.
      if (shown && hImg >= 0) label("label_image", [imgTip[0], imgTip[1] + 26], "above", "Virtual image");
      if (shown && hImg < 0) {
        if (showLabels) {
          labels.push({ ...kit.label("label_image", [imgTip[0] + 8, imgTip[1] + 4], "right", "Real image", { fontSize: 24 }), sides: ["right", "above-right", "left", "below-right"] });
          order.push("label_image");
        }
      }
    }
  }
  if (showDist) {
    // Both marks on the object's side, under the axis — the one quarter of
    // the figure no ray or image ever enters.
    const fmt = (v) => { const r = Math.round(v * 10) / 10; return kit.num(r, Number.isInteger(r) ? 0 : 1); };
    const dim = (id, valueId, u, y, text) => {
      const x0 = X(-u), x1 = lensX;
      push(kit.group(id, [
        kit.stroke(id + "__line", [[x0, y], [x1, y]], { arrowhead: "both", strokeWidth: 2, color: C.guide, ms: MS.guides }),
        kit.stroke(id + "__t0", [[x0, y - 10], [x0, y + 10]], { strokeWidth: 2, color: C.guide, ms: MS.guides }),
        kit.stroke(id + "__t1", [[x1, y - 10], [x1, y + 10]], { strokeWidth: 2, color: C.guide, ms: MS.guides }),
      ]));
      anchors[id] = [(x0 + x1) / 2, y];
      // Too short a span for its number: the number stands left of it.
      const w = kit.textWidth(text, 22);
      const at = x1 - x0 >= w + 24 ? { pos: [(x0 + x1) / 2, y - 27], anchor: "middle" } : { pos: [x0 - 12, y - 7], anchor: "end" };
      push(kit.text(valueId, at.pos, text, { fontSize: 22, color: C.ink, anchor: at.anchor }));
      anchors[valueId] = at.pos;
    };
    dim("do_mark", "do_value", dObj, axisY - 88, "d = " + fmt(dObj));
    dim("f_mark", "f_value", f, axisY - 158, "f = " + fmt(f));
  }
  // The numbers, for {lens.<key>} tokens: signed image distance (< 0
  // virtual) and magnification (< 0 inverted), absent with no image.
  const r3 = (v) => Math.round(v * 1000) / 1000;
  const values = { do: r3(dObj), f: r3(f), image_kind: atInf ? 0 : virtual ? -1 : 1 };
  if (!atInf) {
    values.di = r3(dImg);
    values.m = r3(m);
    values.image_height = r3(hImg);
    values.upright = m > 0 ? 1 : 0;
  }
  return { drawables, labels, anchors, order, values, frame: { x: [0, 1], y: [0, 1], box: { x0: lensX, y0: axisY, x1: lensX + sx, y1: axisY + sy } } };
widget: |
  // Free play (2026-09-28): paused, the viewer takes hold of the figure and
  // the rays, the image and every {lens.*} number recompute under the pointer.
  //
  //   the object (or its label)   drag: the arrow's tip follows the pointer —
  //                               sideways is the distance, up and down its height
  //   either F (tick or label)    drag sideways: the focal length
  //   d or f (show_distances)     drag sideways: a step per 4 units of travel;
  //                               tap: a number field
  //
  // The first move pins `view` to the figure as it stands (unless the cast set
  // one), so the page no longer refits: the object moves, the image runs off to
  // infinity at F and comes back virtual — nothing jumps. The object snaps to F
  // and to 2F within 8 units (converging); a dragged F snaps onto the object
  // and onto half its distance. Clamps: the object stays on its page, at least
  // 18 units from the lens and 20 tall; F stays on the page, at least 30 units
  // out. Every frame is computed from the press, so a gesture needs no state.
  // Free play only: no demo, no judge.
  const SNAP = 8, STEP_UNITS = 4;
  const OBJECT = ["object", "label_object"];
  const FOCI = ["focal_left", "focal_right", "label_left", "label_right"];
  const NUMBERS = ["do_value", "f_value"];
  const num = (v, d) => (typeof v === "number" && Number.isFinite(v) ? v : d);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const r2 = (v) => Math.round(v * 100) / 100;
  const r6 = (v) => Math.round(v * 1e6) / 1e6;
  const none = (state) => ({ state, effects: [] });
  // The figure as painted (under any box fit or growth): the axis is 860
  // template units long, which gives the fit's scale k; F and the object's tip
  // give the lens units' scale across and up.
  const geo = (scene) => {
    const ax = scene.lines.get("axis")?.[0], lens = scene.lines.get("lens")?.[0], ob = scene.lines.get("object")?.[0];
    if (!ax || !lens || !ob) return null;
    const p = scene.params;
    const f = Math.max(0.5, num(p.focal_length, 10));
    const h = Math.max(0.1, num(p.object_height, 6));
    const k = (ax[ax.length - 1][0] - ax[0][0]) / 860;
    const axisY = ax[0][1], xL = lens[0][0];
    const fr = scene.lines.get("focal_right")?.[0], fl = scene.lines.get("focal_left")?.[0];
    const sx = fr ? (fr[0][0] - xL) / f : fl ? (xL - fl[0][0]) / f : null;
    if (!sx || !(k > 0)) return null;
    const sy = (ob[ob.length - 1][1] - axisY) / h;
    const d = (xL - ob[0][0]) / sx;
    // The page in lens units, as the layout's `view` names it.
    const sxT = sx / k, syT = sy / k, lensT = 70 + (xL - ax[0][0]) / k;
    const own = p.view && typeof p.view === "object" && num(p.view.left, 0) > 0 && num(p.view.right, 0) > 0 ? p.view : null;
    const left = own ? own.left : (lensT - 110) / sxT;
    const right = own ? own.right : 780 / sxT - left;
    const height = own && num(own.height, 0) > 0 ? own.height : 250 / syT;
    return { f, h, d, k, sx, sy, sxT, syT, left, right, height, own, diverging: p.lens_type === "diverging" };
  };
  const pin = (g) => (g.own ? {} : { view: { left: r6(g.left), right: r6(g.right), height: r6(g.height) } });
  const dMin = (g) => 18 / g.sxT;
  const fMin = (g) => 30 / g.sxT;
  const fMax = (g) => 0.97 * Math.min(g.left, g.right);
  // v snapped onto the first target within SNAP template units.
  const snapTo = (v, targets, g) => {
    for (const t of targets) if (Math.abs(v - t) * g.sxT <= SNAP) return t;
    return v;
  };
  const objectAt = (g, d, h) => {
    const d1 = clamp(snapTo(d, g.diverging ? [] : [g.f, 2 * g.f], g), dMin(g), g.left);
    const h1 = clamp(h, 20 / g.syT, g.height * 1.12);
    const exact = d1 === g.f || d1 === 2 * g.f;
    return { object_distance: exact ? d1 : r2(d1), object_height: r2(h1) };
  };
  const focalAt = (g, f) => {
    const f1 = clamp(snapTo(f, g.diverging ? [] : [g.d, g.d / 2], g), fMin(g), fMax(g));
    const exact = f1 === g.d || f1 === g.d / 2;
    return { focal_length: exact ? r6(f1) : r2(f1) };
  };
  // A scrub's step: about 1 % of the value, 1, 2 or 5 times a power of ten.
  const niceStep = (v) => {
    const raw = Math.abs(v) * 0.01;
    if (!(raw > 0)) return 0.1;
    const pow = 10 ** Math.floor(Math.log10(raw));
    for (const m of [1, 2, 5]) if (m * pow >= raw - 1e-12) return m * pow;
    return 10 * pow;
  };
  // v0 moved by a step per STEP_UNITS of sideways travel, on the step's grid.
  const scrub = (v0, dx) => {
    const step = niceStep(v0);
    const n = Math.trunc(dx / STEP_UNITS + (dx >= 0 ? 1e-6 : -1e-6));
    return r6(Math.round((v0 + n * step) / step) * step);
  };
  const init = () => null;
  const on = (ev, st, scene) => {
    const g = geo(scene);
    if (!g) return none(st);
    const patch = (p) => ({ state: st, effects: [{ patch: { ...pin(g), ...p } }] });
    if (ev.type === "input") {
      if (ev.id === "do_value") return patch({ object_distance: clamp(ev.value, dMin(g), g.left) });
      if (ev.id === "f_value") return patch({ focal_length: clamp(ev.value, fMin(g), fMax(g)) });
      return none(st);
    }
    if ((ev.type !== "drag_move" && ev.type !== "drag") || !ev.from) return none(st);
    const dx = ev.point[0] - ev.from[0], dy = ev.point[1] - ev.from[1];
    if (OBJECT.includes(ev.id)) return patch(objectAt(g, g.d - dx / g.sx, g.h + dy / g.sy));
    if (FOCI.includes(ev.id)) return patch(focalAt(g, g.f + (ev.id.endsWith("right") ? dx : -dx) / g.sx));
    if (ev.id === "do_value") return patch({ object_distance: clamp(scrub(g.d, dx / g.k), dMin(g), g.left) });
    if (ev.id === "f_value") return patch({ focal_length: clamp(scrub(g.f, dx / g.k), fMin(g), fMax(g)) });
    return none(st);
  };
  const editable = (id, point, scene) => {
    const g = geo(scene);
    if (!g) return null;
    if (id === "do_value") return { value: r2(g.d), label: kit.say({ en: "Object distance", nb: "Gjenstandsavstand" }), min: r2(dMin(g)), max: r2(g.left), step: 0.1 };
    if (id === "f_value") return { value: r2(g.f), label: kit.say({ en: "Focal length", nb: "Brennvidde" }), min: r2(fMin(g)), max: r2(fMax(g)), step: 0.1 };
    return null;
  };
  // The numbers first (they sit on nothing else), then the object before the
  // F it may stand on — F's label, below the axis, stays F's.
  const parts = (scene) => [...NUMBERS, ...OBJECT, ...FOCI].filter((id) => scene.ids.includes(id));
  return { init, on, editable, parts, live: true };
---
template: wave_diagram
title: Wave diagram
version: 1
kit: 1
status: ready
description: >-
  A transverse wave with labeled amplitude and wavelength: a sine curve on an
  axis, a double-headed amplitude arrow, a wavelength bracket between crests,
  and optional crest/trough labels or a second dashed wave with a phase shift
  (interference/superposition setups). Choose this scene for requests about
  waves, wavelength, amplitude, frequency, phase, or interference.
params:
  type: object
  properties:
    amplitude:
      type: number
      description: "Amplitude in units 1–10 (default 5)."
    cycles:
      type: number
      description: "How many wavelengths to draw, 1–5 (default 3)."
    second_wave_phase_deg:
      type: number
      description: "If set, a second dashed wave shifted by this phase (e.g. 180 for destructive interference)."
    label_parts:
      type: boolean
      description: "Label amplitude, wavelength, crest and trough (default true)."
element_ids:
  axis: the horizontal axis
  wave: the main wave curve
  wave2: the second (dashed) wave when second_wave_phase_deg is set
  amp_arrow: double-headed amplitude arrow
  wl_arrow: double-headed wavelength arrow between crests
  label_amp / label_wl / label_crest / label_trough: the labels
examples:
  - request: "Draw a wave and label the wavelength and amplitude."
    params: { amplitude: 5, cycles: 3 }
  - request: "Show destructive interference of two waves."
    params: { amplitude: 4, cycles: 3, second_wave_phase_deg: 180, label_parts: false }
layout: |
  const ampU = Math.min(10, Math.max(1, params.amplitude ?? 5));
  const cycles = Math.min(5, Math.max(1, Math.round(params.cycles ?? 3)));
  const phase2 = params.second_wave_phase_deg;
  const labelParts = params.label_parts !== false;
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const x0 = 90, len = 800, midY = 375;
  const wl = len / cycles;
  const amp = ampU * 22;
  const drawables = [], labels = [], anchors = {}, order = [];
  const attached = {};
  const push = (d) => { drawables.push(d); order.push(d.id); };
  push(kit.stroke("axis", [[x0 - 20, midY], [x0 + len + 30, midY]], { arrowhead: "end", strokeWidth: 2.5, color: C.guide, ms: MS.axis }));
  push(kit.stroke("wave", kit.wave([x0, midY], len, amp, wl), { strokeWidth: 4.5, color: C.supply, ms: MS.curve }));
  anchors.wave = [x0 + wl / 4, midY + amp];
  if (phase2 !== undefined) {
    const sh = (((phase2 % 360) + 360) % 360) / 360 * wl;
    const shifted = [];
    for (let t = 0; t <= len; t += 4) shifted.push([x0 + t, midY + amp * Math.sin(((t - sh) / wl) * 2 * Math.PI)]);
    push(kit.stroke("wave2", shifted, { strokeWidth: 3.5, color: C.demand, dash: true, ms: MS.curve }));
  }
  if (labelParts) {
    const crestX = x0 + wl / 4;
    // The wavelength bracket normally spans crest-to-crest (one wavelength on
    // from the first crest). With few cycles that second crest can land past
    // the drawn wave — off the fixed-width canvas. When it would, anchor the
    // bracket along the axis instead: x0 and x0+wl are the same phase (both
    // ascending zero-crossings), so it is still a true one-wavelength span,
    // just not crest-to-crest. The amp arrow clamps to the same right edge so
    // it always lands inside the drawn span too.
    const wlFits = crestX + wl <= x0 + len;
    const wlX0 = wlFits ? crestX : x0;
    const wlX1 = wlFits ? crestX + wl : x0 + wl;
    push(kit.stroke("amp_arrow", [[wlX1, midY], [wlX1, midY + amp]], { arrowhead: "both", strokeWidth: 2.5, color: C.accent, ms: MS.guides }));
    labels.push(kit.label("label_amp", [wlX1 + 8, midY + amp / 2], "right", "Amplitude A", { color: C.accent, fontSize: 24 }));
    attached["amp_arrow"] = [...(attached["amp_arrow"] ?? []), "label_amp"];
    order.push("label_amp");
    push(kit.stroke("wl_arrow", [[wlX0, midY + amp + 26], [wlX1, midY + amp + 26]], { arrowhead: "both", strokeWidth: 2.5, color: C.accent, ms: MS.guides }));
    labels.push(kit.label("label_wl", [(wlX0 + wlX1) / 2, midY + amp + 34], "above", "Wavelength λ", { color: C.accent, fontSize: 24 }));
    attached["wl_arrow"] = [...(attached["wl_arrow"] ?? []), "label_wl"];
    order.push("label_wl");
    labels.push(kit.label("label_crest", [crestX, midY + amp], "above", "Crest", { fontSize: 22 }));
    order.push("label_crest");
    labels.push(kit.label("label_trough", [crestX + wl / 2, midY - amp], "below", "Trough", { fontSize: 22 }));
    order.push("label_trough");
  }
  return { drawables, labels, anchors, order, attached };
---
template: circuit_diagram
title: Electric circuit diagram
version: 1
kit: 2
status: ready
description: >-
  A rectangular electric-circuit loop built from component pictograms
  (resistor zigzag, battery long/short plates, bulb circled X, switch, and
  capacitor plates): in series every component is spliced one after another
  along the top wire; in parallel the loop opens 2-3 separate rungs between
  the top and bottom rails so each component gets its own branch. The battery
  always sits centered in the bottom wire regardless of where it appears in
  the component list. Small arrowheads along the rails show the direction of
  conventional current, clockwise starting from the battery's + terminal,
  when requested. Choose this scene for ANY request about a circuit diagram,
  an electric circuit, a resistor, a battery, a light bulb, a switch, a
  capacitor, series vs parallel circuits, or the direction of conventional
  current.
params:
  type: object
  properties:
    topology:
      type: string
      enum: [series, parallel]
      description: "Loop topology (default \"series\")."
    components:
      type: array
      minItems: 2
      maxItems: 5
      items:
        type: object
        properties:
          type:
            type: string
            enum: [resistor, battery, bulb, switch, capacitor]
          label:
            type: string
            description: "Caption under/beside the component (default: its type name)."
        required: [type]
      description: >-
        2-5 components in the loop, in order. Exactly one battery is
        recommended; it is always drawn centered in the bottom wire
        regardless of its position in this list. The remaining components are
        spliced along the top wire (series) or become the parallel rungs
        between the rails (parallel), in list order.
    show_current:
      type: boolean
      description: "Small arrowheads on the rails showing current direction, clockwise from the battery's + terminal (default true)."
element_ids:
  wire: the rectangular loop's plain wire segments — rails, top/bottom wire, and any rung stubs (one group)
  comp_<i>: the i-th entry in `components`, as a pictogram (i = its index in the `components` array, not draw order)
  comp_label_<i>: comp_<i>'s caption
  current_<i>: a small current-direction arrowhead on a wire segment, present only when show_current
examples:
  - request: "Draw a series circuit with a battery, a bulb and a switch."
    params:
      topology: series
      components:
        - { type: battery }
        - { type: bulb, label: "Lamp" }
        - { type: switch }
  - request: "Draw two resistors in parallel with a battery."
    params:
      topology: parallel
      components:
        - { type: battery }
        - { type: resistor, label: "R1" }
        - { type: resistor, label: "R2" }
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const VALID_TYPES = ["resistor", "battery", "bulb", "switch", "capacitor"];
  const topology = params.topology === "parallel" ? "parallel" : "series";
  const showCurrent = params.show_current !== false;
  const rawComponents = Array.isArray(params.components) ? params.components.filter((c) => c && typeof c === "object").slice(0, 5) : [];
  const componentsIn = rawComponents.length >= 2 ? rawComponents : [{ type: "battery" }, { type: "resistor" }, { type: "bulb" }];
  const capitalize = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const normalized = componentsIn.map((c) => ({
    type: VALID_TYPES.includes(c.type) ? c.type : "resistor",
    label: typeof c.label === "string" && c.label.trim() !== "" ? c.label : undefined,
  }));
  const batteryIdx = normalized.findIndex((c) => c.type === "battery");
  const othersIdx = normalized.map((c, i) => i).filter((i) => i !== batteryIdx);

  const X0 = 150, X1 = 850, YB = 200, YT = 550, CX = (X0 + X1) / 2, CY = (YB + YT) / 2;
  const SCALE = 42;

  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  const label = (id, anchor, side, text, color, fontSize) => {
    labels.push(kit.label(id, anchor, side, text, { color, fontSize }));
    order.push(id);
  };

  const compAt = {};
  const compAnchors = {};
  const n = othersIdx.length;
  othersIdx.forEach((origI, k) => {
    const x = n > 0 ? X0 + ((X1 - X0) * (k + 0.5)) / n : CX;
    const at = topology === "parallel" ? [x, CY] : [x, YT];
    const rot = topology === "parallel" ? Math.PI / 2 : 0;
    const st = kit.stamp(normalized[origI].type, at, { scale: SCALE, rot, idPrefix: "comp_" + origI });
    push(kit.group("comp_" + origI, st.drawables));
    compAt[origI] = at;
    compAnchors[origI] = st.anchors;
    anchors["comp_" + origI] = at;
  });

  let batteryAnchors = null;
  if (batteryIdx >= 0) {
    const st = kit.stamp("battery", [CX, YB], { scale: SCALE, rot: 0, idPrefix: "comp_" + batteryIdx });
    push(kit.group("comp_" + batteryIdx, st.drawables));
    compAt[batteryIdx] = [CX, YB];
    batteryAnchors = st.anchors;
    anchors["comp_" + batteryIdx] = [CX, YB];
  }

  normalized.forEach((c, i) => {
    const text = c.label || capitalize(c.type);
    if (i === batteryIdx) {
      label("comp_label_" + i, [CX, YB - 6], "below", text, undefined, 22);
    } else if (topology === "parallel") {
      label("comp_label_" + i, compAt[i], "right", text, undefined, 22);
    } else {
      label("comp_label_" + i, [compAt[i][0], YT + 6], "above", text, undefined, 22);
    }
  });

  const wireChildren = [];
  wireChildren.push(kit.stroke("wire__left", [[X0, YB], [X0, YT]], { strokeWidth: 3, ms: MS.stroke }));
  wireChildren.push(kit.stroke("wire__right", [[X1, YB], [X1, YT]], { strokeWidth: 3, ms: MS.stroke }));

  if (batteryAnchors) {
    wireChildren.push(kit.stroke("wire__bl", [[X0, YB], batteryAnchors.left], { strokeWidth: 3, ms: MS.stroke }));
    wireChildren.push(kit.stroke("wire__br", [batteryAnchors.right, [X1, YB]], { strokeWidth: 3, ms: MS.stroke }));
  } else {
    wireChildren.push(kit.stroke("wire__bottom", [[X0, YB], [X1, YB]], { strokeWidth: 3, ms: MS.stroke }));
  }

  if (topology === "parallel") {
    wireChildren.push(kit.stroke("wire__top", [[X0, YT], [X1, YT]], { strokeWidth: 3, ms: MS.stroke }));
    othersIdx.forEach((origI) => {
      const x = compAt[origI][0];
      const a = compAnchors[origI];
      wireChildren.push(kit.stroke("wire__rung_top_" + origI, [[x, YT], a.right], { strokeWidth: 3, ms: MS.stroke }));
      wireChildren.push(kit.stroke("wire__rung_bot_" + origI, [[x, YB], a.left], { strokeWidth: 3, ms: MS.stroke }));
    });
  } else {
    let prevPt = [X0, YT];
    othersIdx.forEach((origI) => {
      const a = compAnchors[origI];
      wireChildren.push(kit.stroke("wire__top_" + origI, [prevPt, a.left], { strokeWidth: 3, ms: MS.stroke }));
      prevPt = a.right;
    });
    wireChildren.push(kit.stroke("wire__top_end", [prevPt, [X1, YT]], { strokeWidth: 3, ms: MS.stroke }));
  }
  push(kit.group("wire", wireChildren));
  anchors.wire = [CX, CY];

  if (showCurrent) {
    function arrowSeg(a, b, len) {
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const L = Math.hypot(dx, dy) || 1;
      const ux = dx / L, uy = dy / L;
      const half = Math.min(len, L * 0.7) / 2;
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      return [[mx - ux * half, my - uy * half], [mx + ux * half, my + uy * half]];
    }
    let ci = 0;
    push(kit.stroke("current_" + ci, arrowSeg([X0, YB], [X0, YT], 55), { arrowhead: "end", strokeWidth: 3, color: C.accent, ms: MS.arrow })); ci++;
    push(kit.stroke("current_" + ci, arrowSeg([X1, YT], [X1, YB], 55), { arrowhead: "end", strokeWidth: 3, color: C.accent, ms: MS.arrow })); ci++;
    if (batteryAnchors) {
      push(kit.stroke("current_" + ci, arrowSeg(batteryAnchors.left, [X0, YB], 55), { arrowhead: "end", strokeWidth: 3, color: C.accent, ms: MS.arrow })); ci++;
      push(kit.stroke("current_" + ci, arrowSeg([X1, YB], batteryAnchors.right, 55), { arrowhead: "end", strokeWidth: 3, color: C.accent, ms: MS.arrow })); ci++;
    } else {
      push(kit.stroke("current_" + ci, arrowSeg([X1, YB], [X0, YB], 55), { arrowhead: "end", strokeWidth: 3, color: C.accent, ms: MS.arrow })); ci++;
    }
  }

  return { drawables, labels, anchors, order };
---
template: projectile_motion
interaction: "Drag the v0 arrow's tip (angle and speed) or the platform (launch height); the path, apex and readouts follow, the last throw stays as a ghost."
title: Projectile motion trajectory
version: 2
kit: 11
status: ready
description: >-
  A projectile's parabolic trajectory computed from real kinematics (g = 10
  unless set): launched at a given speed and angle, from the ground or from a
  platform of some height, the path is sampled from the exact closed-form
  y(x), with velocity-vector arrows at launch, apex (horizontal only —
  vertical velocity is zero at the top) and landing, optional dashed
  horizontal/vertical component arrows, a hatched ground line, and with
  show_values the angle, v₀, range R and apex height H written on the
  figure. speed, angle_deg and height are plain numeric params, so an
  `animate` can sweep any of them and the parabola, apex and vectors
  re-derive themselves frame by frame. The scale is set by the SPEED (a
  45° launch at this speed fills the width), not by the angle: a swept angle
  shows the real range and height change — 45° lands farthest on level
  ground, and two angles adding to 90° land together. `view` fixes the scale
  outright (for a speed sweep). Choose this scene for ANY request about
  projectile motion, trajectory, range, a launch angle, time of flight, or
  the height/velocity of a thrown or fired object (ignoring air
  resistance). Paused, the viewer drags the tip of the v₀ arrow (angle and
  speed), the platform (launch height), and with show_values scrubs or taps
  the angle and v₀ numbers; the previous flight stays as a faint ghost, and
  every value recomputes live ({projectile.range}, max_height, time, angle,
  v0).
params:
  type: object
  properties:
    speed:
      type: number
      description: "Launch speed, 1-10 arbitrary units (default 6). Animatable."
    angle_deg:
      type: number
      description: "Launch angle above the horizontal, 5-85 degrees (default 45). Animatable."
    height:
      type: number
      description: "Launch height above the ground, 0-10 units (default 0): a platform is drawn under the launch point. Animatable."
    gravity:
      type: number
      description: "g, 1-30 units (default 10)."
    show_vectors:
      type: boolean
      description: "Velocity arrows at launch, apex and landing (default true)."
    show_components:
      type: boolean
      description: "Dashed horizontal/vertical component arrows at launch and landing, when show_vectors is also true (default false)."
    label_apex:
      type: boolean
      description: "Label the apex point (default true); with show_values it reads its height, H = …"
    show_values:
      type: boolean
      description: "Write the numbers on the figure: the launch angle (an arc and 45°), v₀ = 6 on the launch arrow, the range R under the ground, the apex height H (default false). The viewer can scrub or tap the angle and v₀."
    ghost:
      type: object
      description: "An earlier flight drawn faint and dashed to compare with, e.g. {speed: 6, angle_deg: 30}. The live drag sets it to the flight before the drag."
      properties:
        speed: { type: number }
        angle_deg: { type: number }
        height: { type: number }
    view:
      type: object
      description: "Fix the scale: the range across and the height up the page holds, e.g. {range: 5, height: 3.3}. A flight too big for it still fits: the page pulls back. The live drag sets it."
      properties:
        range: { type: number }
        height: { type: number }
      required: [range, height]
element_ids:
  ground: the ground line and hatching (one group)
  platform: the block the projectile is launched from, present when height > 0
  path: the trajectory parabola
  ghost_path: the earlier flight, faint and dashed, present when ghost is set
  v0 / v_apex / v_land: the velocity-vector arrows at launch, apex (horizontal only) and landing, present when show_vectors
  vx_<k> / vy_<k>: dashed horizontal/vertical component arrows (k=0 launch, k=1 landing), present when show_vectors and show_components
  apex_label: the "Apex" caption ("H = 1.8" with show_values), present when label_apex
  angle_arc / angle_value: the launch-angle arc and its "45°" (show_values)
  speed_value: the "v₀ = 6" beside the launch arrow (show_values with show_vectors; it replaces the arrow's own v₀ label)
  range_mark: the range dimension under the ground with its "R = 3.6" (show_values)
  height_mark: the dashed drop from the apex to the ground (show_values)
examples:
  - request: "Show projectile motion at 45 degrees."
    params: { speed: 6, angle_deg: 45 }
  - request: "Show the horizontal and vertical velocity components of a projectile launched at a steep angle."
    params: { speed: 8, angle_deg: 70, show_components: true }
  - request: "Compare a 30 degree throw with a 60 degree throw."
    params: { speed: 8, angle_deg: 60, show_values: true, ghost: { angle_deg: 30 } }
  - request: "Why does a shot put fly farthest below 45 degrees?"
    params: { speed: 8, angle_deg: 45, height: 2, show_values: true }
layout: |
  const C = kit.COLORS, MS = kit.SKETCH_MS;
  const num = (v, d) => (typeof v === "number" && Number.isFinite(v) ? v : d);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const speed = clamp(num(params.speed, 6), 1, 10);
  const angleDeg = clamp(num(params.angle_deg, 45), 5, 85);
  const h0 = clamp(num(params.height, 0), 0, 10);
  const g = clamp(num(params.gravity, 10), 1, 30);
  const showVectors = params.show_vectors !== false;
  const showComponents = showVectors && params.show_components === true;
  const labelApex = params.label_apex !== false;
  const showValues = params.show_values === true;

  // The flight, exact: time up and down from height h, range, apex.
  const flight = (v, deg, h) => {
    const th = (deg * Math.PI) / 180, vx = v * Math.cos(th), vy = v * Math.sin(th);
    const T = (vy + Math.sqrt(vy * vy + 2 * g * h)) / g;
    return { v, deg, h, th, vx, vy, T, R: vx * T, H: h + (vy * vy) / (2 * g), xApex: (vx * vy) / g };
  };
  const F = flight(speed, angleDeg, h0);
  const gp = params.ghost && typeof params.ghost === "object" ? params.ghost : null;
  const G = gp ? flight(clamp(num(gp.speed, speed), 1, 10), clamp(num(gp.angle_deg, angleDeg), 5, 85), clamp(num(gp.height, h0), 0, 10)) : null;

  // The scale: a SPEED's widest flight (its best angle, from its height) fills
  // the width and its steepest the height, so the angle alone never rescales.
  const reach = (v, h) => ({ R: (v / g) * Math.sqrt(v * v + 2 * g * h), top: h + Math.pow(v * Math.sin((85 * Math.PI) / 180), 2) / (2 * g) });
  // The readouts (show_values) hang a range mark under the ground: the ground
  // then rises out of the caption band, and the flight keeps under the card.
  const X0 = 120, groundY = showValues ? 270 : 200;
  const availW = 650, availH = showValues ? 380 : 430, roomW = 690, roomH = showValues ? 390 : 450;
  const vw = params.view && typeof params.view === "object" ? params.view : null;
  const view = vw && num(vw.range, 0) > 0 && num(vw.height, 0) > 0 ? vw : null;
  let S;
  if (view) {
    // Fixed — but a flight too big for it still fits: the page pulls back.
    const R = Math.max(F.R, G ? G.R : 0), H = Math.max(F.H, G ? G.H : 0);
    S = Math.min(availW / view.range, availH / view.height, roomW / R, roomH / H);
  } else {
    const a = reach(speed, h0), b = G ? reach(G.v, G.h) : a;
    S = Math.min(availW / Math.max(a.R, b.R), availH / Math.max(a.top, b.top));
  }
  const W = (wx, wy) => [X0 + wx * S, groundY + wy * S];

  const drawables = [], labels = [], anchors = {}, order = [];
  const push = (d) => { drawables.push(d); order.push(d.id); };
  // One decimal (two under 1), no trailing zeros: 6, 3.6, 11.7, 0.9, 0.25.
  const fmt = (v) => kit.num(v, v >= 100 ? 0 : v >= 1 ? 1 : 2).replace(/([.,]\d*?)0+$/, "$1").replace(/[.,]$/, "");

  // The ground runs the page's width, whatever the flight.
  const groundX0 = 60, groundX1 = 940;
  const groundChildren = [kit.stroke("ground__line", [[groundX0, groundY], [groundX1, groundY]], { strokeWidth: 3, color: C.guide, ms: MS.axis })];
  kit.hatch([groundX0, groundY], [groundX1, groundY], 30, 16, -1).forEach(([a, b], i) => {
    groundChildren.push(kit.stroke("ground__hatch" + i, [a, b], { strokeWidth: 2, color: C.guide, ms: MS.guides }));
  });
  push(kit.group("ground", groundChildren));

  const launchPt = W(0, h0);
  if (h0 > 0) {
    push(kit.stroke("platform", [[X0 - 56, groundY], [X0 - 56, launchPt[1]], [X0, launchPt[1]], [X0, groundY]], { closed: true, strokeWidth: 3, color: C.ink, fill: C.guide, ms: MS.node }));
    anchors.platform = [X0 - 28, (groundY + launchPt[1]) / 2];
  }

  const pathOf = (fl) => kit.sample((x) => fl.h + x * Math.tan(fl.th) - (g * x * x) / (2 * fl.vx * fl.vx), 0, fl.R, 60).map(([wx, wy]) => W(wx, wy));
  if (G) {
    push(kit.stroke("ghost_path", pathOf(G), { strokeWidth: 3, color: C.guide, dash: true, opacity: 0.6, ms: MS.curve }));
    anchors.ghost_path = W(G.xApex, G.H);
  }
  const pathPts = pathOf(F);
  push(kit.stroke("path", pathPts, { strokeWidth: 4, color: C.supply, ms: MS.curve }));
  anchors.path = pathPts[Math.floor(pathPts.length / 2)];

  const apexPt = W(F.xApex, F.H);
  const landPt = W(F.R, 0);
  const cosT = Math.cos(F.th), sinT = Math.sin(F.th);
  anchors.apex_label = apexPt;
  // Arrow lengths are drawn in page units for the SPEED (not the flight's
  // scale), so the v₀ arrow's tip is where the viewer's pointer puts it.
  const mag2len = (m) => 24 + 10 * m;

  // Whether a polyline runs through a box (a label's spot).
  const crosses = (pts, b) => {
    const hit = (a, c) => {
      let t0 = 0, t1 = 1;
      const dx = c[0] - a[0], dy = c[1] - a[1];
      for (const [p, q] of [[-dx, a[0] - b.x], [dx, b.x + b.w - a[0]], [-dy, a[1] - b.y], [dy, b.y + b.h - a[1]]]) {
        if (p === 0) { if (q < 0) return false; continue; }
        const r = q / p;
        if (p < 0) { if (r > t1) return false; if (r > t0) t0 = r; } else { if (r < t0) return false; if (r < t1) t1 = r; }
      }
      return true;
    };
    for (let i = 1; i < pts.length; i++) if (hit(pts[i - 1], pts[i])) return true;
    return false;
  };
  // A flight too small on the page for its apex and landing arrows (a flat
  // launch, a slow throw on a pinned page) goes without them: they would
  // only pile onto the launch arrow.
  const roomApex = (F.H - h0) * S >= 30 && F.xApex * S >= 50;
  const roomLand = F.R * S >= 90;
  // The first of a small label's spots that no ghost path or component
  // arrow runs through (else the first: the lint will say so).
  const others = [pathPts];
  if (G) others.push(pathOf(G));
  if (showVectors && showComponents) others.push([launchPt, [launchPt[0], launchPt[1] + mag2len(F.vy)]], [launchPt, [launchPt[0] + mag2len(F.vx), launchPt[1]]]);
  const spot = (cands, more = []) => cands.find((p) => [...others, ...more].every((pts) => !crosses(pts, { x: p[0] - 14, y: p[1] - 12, w: 28, h: 24 }))) ?? cands[0];
  if (showVectors) {
    const v0Len = mag2len(speed);
    const v0Tip = [launchPt[0] + v0Len * cosT, launchPt[1] + v0Len * sinT];
    // Its v₀ up and left of the tip, as always — unless a component arrow or
    // the ghost's path runs through there: then left of the upright
    // component, past the tip, or below-right of it.
    const v0LabelAt = spot([
      [v0Tip[0] - sinT * 20, v0Tip[1] + cosT * 20],
      [Math.min(v0Tip[0] - sinT * 20, launchPt[0] - 18), v0Tip[1] + cosT * 20],
      [v0Tip[0] + 22 * cosT, v0Tip[1] + 22 * sinT],
      [v0Tip[0] + sinT * 20, v0Tip[1] - cosT * 20],
    ]);
    push(kit.group("v0", [
      kit.stroke("v0__arrow", [launchPt, v0Tip], { arrowhead: "end", strokeWidth: 4, color: C.demand, ms: MS.arrow }),
      ...(showValues ? [] : [kit.text("v0__label", v0LabelAt, "v₀", { fontSize: 20, color: C.demand })]),
    ]));
    anchors.v0 = v0Tip;
    if (showValues) {
      // Up and left of the tip: the side away from the path, which leaves the
      // launch along the arrow and bends below it.
      labels.push({ ...kit.label("speed_value", v0Tip, angleDeg < 15 ? "above" : "above-left", "v₀ = " + fmt(speed), { fontSize: 20, color: C.demand }), sides: ["above-left", "above", "left"] });
      order.push("speed_value");
    }

    if (roomApex) {
      const vApexLen = mag2len(F.vx);
      const vApexTip = [apexPt[0] + vApexLen, apexPt[1]];
      push(kit.group("v_apex", [
        kit.stroke("v_apex__arrow", [apexPt, vApexTip], { arrowhead: "end", strokeWidth: 4, color: C.demand, ms: MS.arrow }),
        kit.text("v_apex__label", spot([[vApexTip[0] + 12, vApexTip[1] + 18], [vApexTip[0] + 14, vApexTip[1] - 16], [vApexTip[0] + 22, vApexTip[1] + 2], [(apexPt[0] + vApexTip[0]) / 2, apexPt[1] + 20], [(apexPt[0] + vApexTip[0]) / 2, apexPt[1] - 20], [vApexTip[0] + 12, vApexTip[1] + 40], [vApexTip[0] + 12, vApexTip[1] - 38]]), "v", { fontSize: 20, color: C.demand }),
      ]));
      anchors.v_apex = vApexTip;
    }

    // Landing: as fast as it left, from level ground; faster from a height.
    const vyLand = Math.sqrt(F.vy * F.vy + 2 * g * h0);
    const vLand = Math.hypot(F.vx, vyLand);
    const cl = F.vx / vLand, sl = vyLand / vLand;
    if (roomLand) {
      const vLandLen = Math.min(mag2len(vLand), 170);
      const vLandTip = [landPt[0] + vLandLen * cl, landPt[1] - vLandLen * sl];
      // Past the tip; a flat landing's tip is at the ground, so its v stands above it.
      const vAt = vLandTip[1] - 14 * sl > groundY - 30 ? [vLandTip[0] + 14, groundY + 16] : [vLandTip[0] + 14 * cl, vLandTip[1] - 14 * sl];
      push(kit.group("v_land", [
        kit.stroke("v_land__arrow", [landPt, vLandTip], { arrowhead: "end", strokeWidth: 4, color: C.demand, ms: MS.arrow }),
        kit.text("v_land__label", spot([vAt, [vLandTip[0] + 16, groundY + 16], [vLandTip[0] + 22, vLandTip[1] - 8], [vLandTip[0] - 18, vLandTip[1] - 12], [landPt[0] + 34, groundY + 20]], [[landPt, vLandTip], [[landPt[0] - 40, groundY - 16], [vLandTip[0] + 60, groundY - 16]], [[landPt[0] - 40, groundY], [vLandTip[0] + 60, groundY]]]), "v", { fontSize: 20, color: C.demand }),
      ]));
      anchors.v_land = vLandTip;
    }

    if (showComponents) {
      const vxLen = mag2len(F.vx);
      push(kit.stroke("vx_0", [launchPt, [launchPt[0] + vxLen, launchPt[1]]], { arrowhead: "end", strokeWidth: 2.5, color: C.guide, dash: true, ms: MS.guides }));
      push(kit.stroke("vy_0", [launchPt, [launchPt[0], launchPt[1] + mag2len(F.vy)]], { arrowhead: "end", strokeWidth: 2.5, color: C.guide, dash: true, ms: MS.guides }));
      if (roomLand) {
        push(kit.stroke("vx_1", [landPt, [landPt[0] + vxLen, landPt[1]]], { arrowhead: "end", strokeWidth: 2.5, color: C.guide, dash: true, ms: MS.guides }));
        push(kit.stroke("vy_1", [landPt, [landPt[0], landPt[1] - Math.min(mag2len(vyLand), 170)]], { arrowhead: "end", strokeWidth: 2.5, color: C.guide, dash: true, ms: MS.guides }));
      }
    }
  }

  if (showValues) {
    // The angle at the launch: an arc inside the arrow, and its number in the
    // angle when it is wide enough, else left of the launch point.
    const arcR = Math.min(44, 0.6 * mag2len(speed));
    push(kit.angleMark("angle_arc", launchPt, 0, F.th, arcR, { color: C.accent }));
    anchors.angle_arc = launchPt;
    const wide = angleDeg >= 34;
    const aText = kit.num(Math.round(angleDeg), 0) + "°";
    const aAt = wide ? [launchPt[0] + (arcR + 4) * Math.cos(F.th / 2), launchPt[1] + (arcR + 4) * Math.sin(F.th / 2)] : [launchPt[0] - (h0 > 0 ? 60 : 8), launchPt[1] + 14];
    labels.push({ ...kit.label("angle_value", aAt, wide ? "right" : "left", aText, { fontSize: 20, color: C.accent }), sides: wide ? ["right", "above-right", "below-right"] : ["left", "above-left", "above"] });
    order.push("angle_value");
    // The range, under the ground from the launch to the landing.
    const ry = groundY - 44;
    const rText = "R = " + fmt(F.R);
    const span = landPt[0] - X0;
    const fits = span >= kit.textWidth(rText, 20) + 20;
    push(kit.group("range_mark", [
      kit.stroke("range_mark__line", [[X0, ry], [landPt[0], ry]], { arrowhead: "both", strokeWidth: 2, color: C.guide, ms: MS.guides }),
      kit.stroke("range_mark__t0", [[X0, ry - 9], [X0, ry + 9]], { strokeWidth: 2, color: C.guide, ms: MS.guides }),
      kit.stroke("range_mark__t1", [[landPt[0], ry - 9], [landPt[0], ry + 9]], { strokeWidth: 2, color: C.guide, ms: MS.guides }),
      kit.text("range_mark__value", fits ? [(X0 + landPt[0]) / 2, ry - 26] : [X0 - 14, ry - 7], rText, { fontSize: 20, color: C.ink, anchor: fits ? "middle" : "end" }),
    ]));
    anchors.range_mark = [(X0 + landPt[0]) / 2, ry];
    // The apex height: a dashed drop to the ground.
    push(kit.stroke("height_mark", [apexPt, [apexPt[0], groundY]], { strokeWidth: 2, color: C.guide, dash: true, ms: MS.guides }));
    anchors.height_mark = [apexPt[0], (apexPt[1] + groundY) / 2];
  }

  if (labelApex) {
    labels.push(kit.label("apex_label", apexPt, "above", showValues ? "H = " + fmt(F.H) : "Apex", { fontSize: 22 }));
    order.push("apex_label");
  }

  // The numbers, for {projectile.<key>} tokens.
  const r3 = (v) => Math.round(v * 1000) / 1000;
  const values = { range: r3(F.R), max_height: r3(F.H), time: r3(F.T), angle: r3(angleDeg), v0: r3(speed), height: r3(h0), g: r3(g) };
  return { drawables, labels, anchors, order, values, frame: { x: [0, 1], y: [0, 1], box: { x0: X0, y0: groundY, x1: X0 + S, y1: groundY + S } } };
widget: |
  // Free play (2026-09-28): paused, the viewer throws again and again — the
  // parabola, apex, vectors, readouts and every {projectile.*} number
  // recompute under the pointer, and the flight before the gesture stays as
  // a faint ghost to compare with.
  //
  //   the v₀ arrow           drag: its tip follows the pointer — the
  //                          direction is the angle (5–85°, whole degrees),
  //                          the length the speed (1–10, tenths)
  //   the platform           drag up and down: the launch height (0–10)
  //   45° or v₀ = 6          drag sideways: 1° or 0.1 per 4 units of travel;
  //   (show_values)          tap: a number field
  //
  // The first move pins `view` to the page as it stands (unless the cast set
  // one), so a slower or flatter throw really lands shorter; a throw too big
  // for the page makes it pull back (the arrow, drawn to the speed, stays
  // under the pointer). A platform is held to heights whose flight still
  // fits, so it never pulls back from under the pointer. Every frame is
  // computed from the press, so a gesture needs no state. Free play only.
  const STEP_UNITS = 4;
  const NUMBERS = ["angle_value", "speed_value"];
  const HANDLES = ["v0", "platform"];
  const num = (v, d) => (typeof v === "number" && Number.isFinite(v) ? v : d);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const r1 = (v) => Math.round(v * 10) / 10;
  const r2 = (v) => Math.round(v * 100) / 100;
  const r6 = (v) => Math.round(v * 1e6) / 1e6;
  const none = (state) => ({ state, effects: [] });
  const paramsOf = (p) => ({
    v: clamp(num(p.speed, 6), 1, 10),
    a: clamp(num(p.angle_deg, 45), 5, 85),
    h: clamp(num(p.height, 0), 0, 10),
    g: clamp(num(p.gravity, 10), 1, 30),
  });
  const flight = (q) => {
    const th = (q.a * Math.PI) / 180, vx = q.v * Math.cos(th), vy = q.v * Math.sin(th);
    const T = (vy + Math.sqrt(vy * vy + 2 * q.g * q.h)) / q.g;
    return { R: vx * T, H: q.h + (vy * vy) / (2 * q.g) };
  };
  // The page as painted (any box fit or growth): the ground is 880 template
  // units wide, which gives the fit's scale k; the path runs from the launch
  // point to the landing, R flight units away, which gives the flight's.
  const geo = (scene) => {
    const ground = scene.lines.get("ground")?.[0], path = scene.lines.get("path")?.[0];
    if (!ground || !path) return null;
    const q = paramsOf(scene.params);
    const k = (ground[ground.length - 1][0] - ground[0][0]) / 880;
    const L = path[0], land = path[path.length - 1];
    const S = (land[0] - L[0]) / flight(q).R;          // painted units per flight unit
    if (!(k > 0) || !(S > 0)) return null;
    const own = scene.params.view && typeof scene.params.view === "object" && num(scene.params.view.range, 0) > 0 && num(scene.params.view.height, 0) > 0;
    const arrow = scene.lines.get("v0")?.[0] ?? null;
    const readouts = scene.params.show_values === true;
    return { q, k, S, ST: S / k, L, arrow, groundY: ground[0][1], own, availH: readouts ? 380 : 430, roomH: readouts ? 390 : 450 };
  };
  const pin = (G) => (G.own ? {} : { view: { range: r6(650 / G.ST), height: r6(G.availH / G.ST) } });
  const ghost = (G) => ({ ghost: { speed: G.q.v, angle_deg: G.q.a, height: G.q.h } });
  // The highest platform whose flight still fits the pinned page (690 across,
  // 450 up in template units; 390 up with the readouts, whose ground stands
  // higher) — the range grows with the height, so bisect.
  const hRoom = (G) => {
    const fits = (h) => { const f = flight({ ...G.q, h }); return f.R * G.ST <= 690 && f.H * G.ST <= G.roomH; };
    if (fits(10)) return 10;
    let lo = 0, hi = 10;
    for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid; }
    return lo;
  };
  const init = () => null;
  const on = (ev, st, scene) => {
    const G = geo(scene);
    if (!G) return none(st);
    const patch = (p) => ({ state: st, effects: [{ patch: { ...pin(G), ...ghost(G), ...p } }] });
    if (ev.type === "input") {
      if (ev.id === "angle_value") return patch({ angle_deg: clamp(Math.round(ev.value * 10) / 10, 5, 85) });
      if (ev.id === "speed_value") return patch({ speed: clamp(r2(ev.value), 1, 10) });
      return none(st);
    }
    if ((ev.type !== "drag_move" && ev.type !== "drag") || !ev.from) return none(st);
    const dx = ev.point[0] - ev.from[0], dy = ev.point[1] - ev.from[1];
    const steps = Math.trunc(dx / G.k / STEP_UNITS + (dx >= 0 ? 1e-6 : -1e-6));
    if (ev.id === "angle_value") return patch({ angle_deg: clamp(Math.round(G.q.a) + steps, 5, 85) });
    if (ev.id === "speed_value") return patch({ speed: clamp(r1(G.q.v + steps * 0.1), 1, 10) });
    if (ev.id === "v0" && G.arrow) {
      // The tip, moved as the pointer moved, read back as direction and length.
      const tip = G.arrow[G.arrow.length - 1];
      const tx = (tip[0] + dx - G.L[0]) / G.k, ty = (tip[1] + dy - G.L[1]) / G.k;
      const a = clamp(Math.round((Math.atan2(ty, tx) * 180) / Math.PI), 5, 85);
      const v = clamp(r1((Math.hypot(tx, ty) - 24) / 10), 1, 10);
      return patch({ angle_deg: a, speed: v });
    }
    if (ev.id === "platform") {
      const h = clamp(G.q.h + dy / G.S, 0, hRoom(G));
      return patch({ height: h < 0.02 ? 0 : r2(h) });
    }
    return none(st);
  };
  const editable = (id, point, scene) => {
    const q = paramsOf(scene.params);
    if (id === "angle_value") return { value: Math.round(q.a * 10) / 10, label: kit.say({ en: "Launch angle in degrees", nb: "Utskytningsvinkel i grader" }), min: 5, max: 85, step: 1 };
    if (id === "speed_value") return { value: q.v, label: kit.say({ en: "Launch speed", nb: "Utskytningsfart" }), min: 1, max: 10, step: 0.1 };
    return null;
  };
  const parts = (scene) => [...NUMBERS, ...HANDLES].filter((id) => scene.ids.includes(id));
  return { init, on, editable, parts, live: true };
---
template: bicycle_drivetrain
title: Bicycle drivetrain & gear ratio
version: 1
kit: 1
status: ready
description: 'A side view of a bicycle drivetrain: a toothed front chainring and a smaller rear cog (sprocket) drawn at their correct relative sizes, joined by a chain that runs along both external tangents, plus the pedal crank, the rear wheel rim with spokes, force/speed arrows, and a gear-ratio caption. Choose this for anything about bicycle gears, gear ratios, chainrings, cassettes, cogs, sprockets, derailleurs, mechanical advantage on a bike, or why a small chainring with a big cog is easier to pedal than a big chainring with a small cog. Teeth counts are params, so you can show a climbing gear vs a top gear by re-rendering with different numbers.'
params:
  type: object
  properties:
    front_teeth:
      type: integer
      description: Teeth on the front chainring (default 52). Sizes are drawn in proportion to the two teeth counts.
      minimum: 7
      maximum: 80
    rear_teeth:
      type: integer
      description: Teeth on the rear cog / sprocket (default 16).
      minimum: 7
      maximum: 80
    show_chain:
      type: boolean
      description: Draw the chain wrapping both sprockets (default true).
    show_crank:
      type: boolean
      description: Draw the pedal crank arm and pedal (default true).
    show_arrows:
      type: boolean
      description: Draw the pedal force arrow and the rear-wheel rotation/speed arrow (default true). Turn off for a plain mechanical diagram.
    show_wheel:
      type: boolean
      description: Draw the faint rear wheel rim and spokes behind the cog for context (default true).
    show_teeth:
      type: boolean
      description: Draw individual teeth on both sprockets (default true).
    show_ratio:
      type: boolean
      description: Show the gear-ratio caption at the bottom (default true).
    front_label:
      type: string
      description: Label for the chainring (default "52T chainring" from front_teeth).
    rear_label:
      type: string
      description: Label for the rear cog (default "16T rear cog" from rear_teeth).
    chain_label:
      type: string
      description: Label for the chain (default "Chain").
    crank_label:
      type: string
      description: Label for the crank arm (default "Crank arm").
    pedal_label:
      type: string
      description: Label for the pedal force arrow (default "Pedal force").
    wheel_label:
      type: string
      description: Label for the rear-wheel speed arrow (default "Wheel N× per pedal").
    ratio_caption:
      type: string
      description: Override the bottom gear-ratio caption text.
element_ids:
  wheel_rim: faint rear wheel rim arc
  spokes: the rear wheel spokes (one group)
  chainring: front chainring pitch circle
  chainring_teeth: the chainring's teeth (one group)
  chainring_hub: crank axle / bottom bracket circle
  cog: rear cog pitch circle
  cog_teeth: the rear cog's teeth (one group)
  cog_hub: rear axle circle
  chain: the closed chain loop around both sprockets
  chain_links: the chain link ticks along the two straight runs (one group)
  crank: the crank arm
  pedal: the pedal at the end of the crank
  pedal_arrow: downward force arrow at the pedal
  wheel_arrow: curved rotation/speed arrow around the rear wheel
  ratio_caption: the gear-ratio caption text at the bottom
  label_front / label_rear / label_chain / label_crank / label_pedal_force / label_wheel: the name labels
examples:
  - request: Draw a bike drivetrain and explain what a gear ratio is.
    params: {}
  - request: Why is a small chainring with a big cog easier to pedal? Show a climbing gear.
    params:
      front_teeth: 34
      rear_teeth: 28
      show_arrows: true
      pedal_label: Less force needed
      wheel_label: Wheel only 1.21× per pedal
layout: |-
  const P=params||{};
  const C=kit.COLORS,MS=kit.SKETCH_MS;
  const cl=(v,d)=>{const n=Math.round(Number(v));return Number.isFinite(n)?Math.max(7,Math.min(80,n)):d;};
  const front=cl(P.front_teeth??52,52);
  const rear=cl(P.rear_teeth??16,16);
  const showChain=P.show_chain!==false;
  const showCrank=P.show_crank!==false;
  const showArrows=P.show_arrows!==false;
  const showWheel=P.show_wheel!==false;
  const showTeeth=P.show_teeth!==false;
  const showRatio=P.show_ratio!==false;
  const ratio=front/rear;
  const rs=String(Math.round(ratio*100)/100);
  const drawables=[],labels=[],anchors={},order=[];
  const push=(d)=>{drawables.push(d);order.push(d.id);};
  const lab=(id,a,side,t,color,fs)=>{if(!t)return;labels.push(kit.label(id,a,side,t,{color:color,fontSize:fs??24}));order.push(id);};
  const rad=(deg)=>deg*Math.PI/180;
  const k=135/Math.max(front,rear);
  const r1=Math.max(24,front*k),r2=Math.max(24,rear*k);
  const c1=[368,400],c2=[762,400];
  anchors.chainring=c1;anchors.cog=c2;

  const rimR=208;
  if(showWheel){
    push(kit.stroke("wheel_rim",kit.arc(c2,rimR,rad(102),rad(-102),46),{color:C.guide,strokeWidth:2.5,ms:MS.curve}));
    const spokes=[];
    [80,40,0,-40,-80].forEach((deg,i)=>{
      const th=rad(deg);
      spokes.push(kit.stroke("spoke_"+i,[[c2[0]+(r2+7)*Math.cos(th),c2[1]+(r2+7)*Math.sin(th)],[c2[0]+rimR*Math.cos(th),c2[1]+rimR*Math.sin(th)]],{color:C.guide,strokeWidth:1.8,ms:MS.guides}));
    });
    push(kit.group("spokes",spokes));
    anchors.wheel=[c2[0]+rimR*Math.cos(rad(45)),c2[1]+rimR*Math.sin(rad(45))];
  }

  push(kit.stroke("chainring",[c1],{shapeHint:{type:"circle",c:c1,r:r1},strokeWidth:4.5,ms:MS.node}));
  if(showTeeth){
    const t=[];const n=Math.min(front,72);
    for(let i=0;i<n;i++){const th=(i/n)*2*Math.PI;t.push(kit.stroke("ct_"+i,[[c1[0]+r1*Math.cos(th),c1[1]+r1*Math.sin(th)],[c1[0]+(r1+10)*Math.cos(th),c1[1]+(r1+10)*Math.sin(th)]],{strokeWidth:2.5,ms:MS.dot}));}
    push(kit.group("chainring_teeth",t));
  }
  push(kit.stroke("chainring_hub",[c1],{shapeHint:{type:"circle",c:c1,r:13},strokeWidth:3,ms:MS.dot}));
  lab("label_front",[c1[0],c1[1]+r1+14],"above",P.front_label??(front+"T chainring"),C.ink,26);

  push(kit.stroke("cog",[c2],{shapeHint:{type:"circle",c:c2,r:r2},strokeWidth:4.5,ms:MS.node}));
  if(showTeeth){
    const t=[];const n=Math.min(rear,72);
    for(let i=0;i<n;i++){const th=(i/n)*2*Math.PI;t.push(kit.stroke("rt_"+i,[[c2[0]+r2*Math.cos(th),c2[1]+r2*Math.sin(th)],[c2[0]+(r2+9)*Math.cos(th),c2[1]+(r2+9)*Math.sin(th)]],{strokeWidth:2.5,ms:MS.dot}));}
    push(kit.group("cog_teeth",t));
  }
  push(kit.stroke("cog_hub",[c2],{shapeHint:{type:"circle",c:c2,r:10},strokeWidth:3,ms:MS.dot}));
  lab("label_rear",[c2[0],c2[1]+r2+14],"above",P.rear_label??(rear+"T rear cog"),C.ink,26);

  const d=Math.hypot(c2[0]-c1[0],c2[1]-c1[1]);
  const alpha=Math.atan2(c2[1]-c1[1],c2[0]-c1[0]);
  const gamma=Math.acos(Math.max(-1,Math.min(1,(r1-r2)/d)));
  const aUp=alpha+gamma,aLo=alpha-gamma;
  const p1u=[c1[0]+r1*Math.cos(aUp),c1[1]+r1*Math.sin(aUp)];
  const p2u=[c2[0]+r2*Math.cos(aUp),c2[1]+r2*Math.sin(aUp)];
  const p1l=[c1[0]+r1*Math.cos(aLo),c1[1]+r1*Math.sin(aLo)];
  const p2l=[c2[0]+r2*Math.cos(aLo),c2[1]+r2*Math.sin(aLo)];
  if(showChain){
    const chainPts=[p1u].concat(kit.arc(c2,r2,aUp,aLo,20)).concat(kit.arc(c1,r1,aLo,aUp-2*Math.PI,30));
    push(kit.stroke("chain",chainPts,{closed:true,strokeWidth:3.5,ms:MS.curve}));
    const links=[];
    [[p1u,p2u],[p1l,p2l]].forEach((rn,ri)=>{
      const a=rn[0],b=rn[1];
      const L=Math.hypot(b[0]-a[0],b[1]-a[1])||1;
      const nx=-(b[1]-a[1])/L,ny=(b[0]-a[0])/L;
      const n=Math.max(3,Math.round(L/28));
      for(let i=1;i<n;i++){
        const t=i/n,qx=a[0]+(b[0]-a[0])*t,qy=a[1]+(b[1]-a[1])*t;
        links.push(kit.stroke("chain_link_"+ri+"_"+i,[[qx+nx*5,qy+ny*5],[qx-nx*5,qy-ny*5]],{strokeWidth:2.5,ms:MS.dot}));
      }
    });
    push(kit.group("chain_links",links));
    anchors.chain=[(p1u[0]+p2u[0])/2,(p1u[1]+p2u[1])/2];
    lab("label_chain",[(p1u[0]+p2u[0])/2,(p1u[1]+p2u[1])/2+8],"above",P.chain_label??"Chain",C.ink,24);
  }

  if(showCrank){
    const cAng=rad(-100);
    const L=r1+58;
    const pd=[c1[0]+L*Math.cos(cAng),c1[1]+L*Math.sin(cAng)];
    push(kit.stroke("crank",[c1,pd],{color:C.accent,strokeWidth:9,ms:MS.stroke}));
    const px=-Math.sin(cAng),py=Math.cos(cAng);
    push(kit.stroke("pedal",[[pd[0]+px*26,pd[1]+py*26],[pd[0]-px*26,pd[1]-py*26]],{color:C.accent,strokeWidth:10,ms:MS.stroke}));
    anchors.pedal=pd;
    lab("label_crank",[(c1[0]+pd[0])/2-16,(c1[1]+pd[1])/2],"left",P.crank_label??"Crank arm",C.accent,24);
    if(showArrows){
      const a0=[pd[0],pd[1]-18],a1=[pd[0],pd[1]-104];
      push(kit.stroke("pedal_arrow",[a0,a1],{color:C.demand,strokeWidth:4,arrowhead:"end",ms:MS.connector}));
      anchors.pedal_arrow=a1;
      lab("label_pedal_force",a1,"left",P.pedal_label??"Pedal force",C.demand,24);
    }
  }

  if(showArrows){
    const ar=Math.min(172,r2+64);
    const pts=kit.arc(c2,ar,rad(62),rad(-62),24);
    push(kit.stroke("wheel_arrow",pts,{color:C.supply,strokeWidth:4,arrowhead:"end",ms:MS.connector}));
    const tip=pts[pts.length-1];
    anchors.wheel_arrow=tip;
    lab("label_wheel",tip,"below-right",P.wheel_label??("Wheel "+rs+"\u00d7 per pedal"),C.supply,24);
  }

  if(showRatio){
    const cap=P.ratio_caption??(front+"T : "+rear+"T  =  "+rs+" wheel turns per pedal turn");
    push(kit.text("ratio_caption",[500,46],cap,{fontSize:30}));
    anchors.ratio=[500,46];
  }

  return {drawables,labels,anchors,order};
---
template: hydraulic_press
title: Hydraulic press (Pascal's principle)
version: 1
kit: 1
status: ready
description: 'A hydraulic press / lift / jack in cross-section: two connected cylinders of different bore joined by a fluid-filled channel, a small input piston pushed down by a force arrow and a wide output piston carrying a load block, with area labels (A₁, A₂), force labels, an optional displacement mark (d₁ down, d₂ = d₁/ratio up) and an optional pressure equation P = F₁/A₁ = F₂/A₂. Choose this scene for any request about hydraulic presses, hydraulic lifts, jacks, brakes, Pascal''s principle / Pascal''s law, pressure transmitted equally through a fluid, force multiplication, or ''why can a small force lift a heavy load''. The piston width ratio follows √(area ratio), since the drawing is a cross-section of round cylinders.'
params:
  type: object
  properties:
    areaRatio:
      type: number
      description: Output piston area divided by input piston area, A₂/A₁ (default 4). Clamped to 1.2–12 for drawability; the drawn bore ratio is its square root.
    inputForce:
      type: number
      description: Numeric value of the input force applied to the small piston (default 100). Output force is shown as inputForce × areaRatio.
    forceUnit:
      type: string
      description: Unit shown after force values (default "N").
    showValues:
      type: boolean
      description: Show numeric force values and the numeric area relation (default true). Set false for a purely symbolic figure with just F₁, F₂, A₁, A₂.
    inputLabel:
      type: string
      description: Symbol for the input force (default "F₁").
    outputLabel:
      type: string
      description: Symbol for the output force / lifted load (default "F₂").
    smallAreaLabel:
      type: string
      description: Label for the small piston area (default "A₁").
    largeAreaLabel:
      type: string
      description: Label for the large piston area (default "A₂").
    loadLabel:
      type: string
      description: Text written inside the load block on the big piston (default "Load"; e.g. "Car", "1000 kg").
    fluidLabel:
      type: string
      description: Label for the fluid in the connecting channel (default "Incompressible fluid"). Empty string hides it.
    title:
      type: string
      description: Optional caption across the top of the figure (e.g. "Hydraulic jack"). Empty by default.
    showDisplacement:
      type: boolean
      description: 'Show the displacement marks: the small piston travels d₁ down while the large piston rises only d₂ = d₁/ratio (default false). Use it when explaining that work is conserved.'
    showEquation:
      type: boolean
      description: Show the pressure equation lines P = F₁/A₁ = F₂/A₂ (and the numeric output force) at the top (default true).
element_ids:
  ground / ground_line: hatched ground the press rests on
  vessel_outer / vessel_inner: the two walls of the connected cylinders
  fluid: the shaded fluid filling the channel and both bores
  piston_small / piston_small_fill: the narrow input piston
  rod_small / plate_small: the input piston rod and its push plate
  piston_large / piston_large_fill: the wide output piston
  load / load_fill / load_text: the load block resting on the big piston
  force_in: the downward input force arrow
  force_out: the upward output force arrow above the load
  displacement: group of dashed levels and d₁/d₂ travel arrows (optional)
  eq_pressure / eq_force / eq_dist: the pressure, force and distance equation lines
  title: optional caption
  label_force_in / label_force_out / label_area_small / label_area_large / label_fluid / label_d1 / label_d2: the collision-solved name labels
examples:
  - request: Draw a hydraulic press and show why a small force can lift a heavy load.
    params: {}
  - request: 'Explain Pascal''s principle with a hydraulic jack lifting a car: 50 N input, area ratio 10, show the distances each piston moves.'
    params:
      areaRatio: 10
      inputForce: 50
      loadLabel: Car
      showDisplacement: true
      title: Hydraulic jack
layout: |-
  const C=kit.COLORS,MS=kit.SKETCH_MS;
  const drawables=[],labels=[],anchors={},order=[];
  const push=(d)=>{drawables.push(d);order.push(d.id);};
  const addLabel=(id,at,side,text,o)=>{labels.push(kit.label(id,at,side,text,o||{}));order.push(id);};
  const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  const rawR=Number(params.areaRatio);
  const r=clamp(Number.isFinite(rawR)&&rawR>0?rawR:4,1.2,12);
  const unit=params.forceUnit??"N";
  const showValues=params.showValues!==false;
  const rawF=Number(params.inputForce);
  const F1=Number.isFinite(rawF)?rawF:100;
  const F2=F1*r;
  const l1=params.inputLabel??"F₁";
  const l2=params.outputLabel??"F₂";
  const a1=params.smallAreaLabel??"A₁";
  const a2=params.largeAreaLabel??"A₂";
  const loadLabel=params.loadLabel??"Load";
  const fluidLabel=params.fluidLabel??"Incompressible fluid";
  const title=params.title??"";
  const showD=params.showDisplacement===true;
  const showEq=params.showEquation!==false;
  const fmt=(v)=>String(Math.round(v*10)/10);

  const w1=96;
  const w2=clamp(w1*Math.sqrt(r),130,300);
  const xs=250,xl=690;
  const xsL=xs-w1/2,xsR=xs+w1/2;
  const xlL=xl-w2/2,xlR=xl+w2/2;
  const yBot=120,yBase=200;
  const topS=560,topL=410;
  const ysP=430,ysT=ysP+22;
  const ylP=360,ylT=ylP+26;
  const plateY=585;
  const rectPts=(x0,y0,x1,y1)=>[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];

  const gy=yBot-2;
  push(kit.stroke("ground_line",[[xsL-46,gy],[xlR+46,gy]],{color:C.guide,strokeWidth:2.5,ms:MS.guides}));
  const gticks=kit.hatch([xsL-36,gy],[xlR+36,gy],22,18,-1).map((s,i)=>kit.stroke("ground_h"+i,s,{color:C.guide,strokeWidth:2,ms:MS.guides}));
  push(kit.group("ground",gticks));

  push(kit.stroke("vessel_outer",[[xsL,topS],[xsL,yBot],[xlR,yBot],[xlR,topL]],{strokeWidth:5,ms:MS.stroke}));
  push(kit.stroke("vessel_inner",[[xsR,topS],[xsR,yBase],[xlL,yBase],[xlL,topL]],{strokeWidth:5,ms:MS.stroke}));

  const fluidPts=[[xsL,ysP],[xsL,yBot],[xlR,yBot],[xlR,ylP],[xlL,ylP],[xlL,yBase],[xsR,yBase],[xsR,ysP]];
  push(kit.area("fluid",fluidPts,C.supply,{opacity:0.25,ms:MS.region}));

  push(kit.area("piston_small_fill",rectPts(xsL,ysP,xsR,ysT),C.ink,{opacity:0.18,ms:MS.region}));
  push(kit.stroke("piston_small",rectPts(xsL,ysP,xsR,ysT),{closed:true,strokeWidth:4,ms:MS.node}));
  push(kit.stroke("rod_small",[[xs,ysT],[xs,plateY]],{strokeWidth:4,ms:MS.connector}));
  push(kit.stroke("plate_small",[[xs-42,plateY],[xs+42,plateY]],{strokeWidth:4,ms:MS.connector}));

  push(kit.area("piston_large_fill",rectPts(xlL,ylP,xlR,ylT),C.ink,{opacity:0.18,ms:MS.region}));
  push(kit.stroke("piston_large",rectPts(xlL,ylP,xlR,ylT),{closed:true,strokeWidth:4,ms:MS.node}));

  const bw=Math.min(w2*0.78,230),bh=82;
  const by0=ylT,by1=ylT+bh;
  push(kit.area("load_fill",rectPts(xl-bw/2,by0,xl+bw/2,by1),C.accent,{opacity:0.18,ms:MS.region}));
  push(kit.stroke("load",rectPts(xl-bw/2,by0,xl+bw/2,by1),{closed:true,color:C.accent,strokeWidth:4,ms:MS.node}));
  if(loadLabel)push(kit.text("load_text",[xl,by0+bh/2],loadLabel,{fontSize:28,color:C.accent}));

  push(kit.stroke("force_in",[[xs,690],[xs,plateY+8]],{arrowhead:"end",color:C.demand,strokeWidth:5,ms:MS.connector}));
  addLabel("label_force_in",[xs-8,644],"left",showValues?l1+" = "+fmt(F1)+" "+unit:l1,{color:C.demand,fontSize:28});
  push(kit.stroke("force_out",[[xl,by1+8],[xl,by1+78]],{arrowhead:"end",color:C.accent,strokeWidth:5,ms:MS.connector}));
  addLabel("label_force_out",[xl+10,by1+48],"right",showValues?l2+" = "+fmt(F2)+" "+unit:l2,{color:C.accent,fontSize:28});

  addLabel("label_area_small",[xs,ysP+11],"right",a1,{color:C.ink,fontSize:26});
  addLabel("label_area_large",[xl,ylP+13],"left",showValues?a2+" = "+fmt(r)+" × "+a1:a2,{color:C.ink,fontSize:26});
  if(fluidLabel)addLabel("label_fluid",[470,178],"above",fluidLabel,{color:C.supply,fontSize:24});

  if(showD){
    const d1=70,d2=70/r;
    const kids=[];
    kids.push(kit.stroke("disp_s_now",[[xsL-50,ysT],[xsL,ysT]],{dash:true,color:C.guide,strokeWidth:2,ms:MS.guides}));
    kids.push(kit.stroke("disp_s_next",[[xsL-50,ysT-d1],[xsR+10,ysT-d1]],{dash:true,color:C.guide,strokeWidth:2,ms:MS.guides}));
    kids.push(kit.stroke("disp_s_arrow",[[xsL-32,ysT],[xsL-32,ysT-d1]],{arrowhead:"end",color:C.guide,strokeWidth:2.5,ms:MS.connector}));
    kids.push(kit.stroke("disp_l_now",[[xlR,ylT],[xlR+50,ylT]],{dash:true,color:C.guide,strokeWidth:2,ms:MS.guides}));
    kids.push(kit.stroke("disp_l_next",[[xlL-10,ylT+d2],[xlR+50,ylT+d2]],{dash:true,color:C.guide,strokeWidth:2,ms:MS.guides}));
    kids.push(kit.stroke("disp_l_arrow",[[xlR+32,ylT],[xlR+32,ylT+d2]],{arrowhead:"end",color:C.guide,strokeWidth:2.5,ms:MS.connector}));
    push(kit.group("displacement",kids));
    addLabel("label_d1",[xsL-36,ysT-d1/2],"left","d₁",{color:C.guide,fontSize:26});
    addLabel("label_d2",[xlR+36,ylT+d2/2],"right","d₂",{color:C.guide,fontSize:26});
    anchors.d1=[xsL-32,ysT-d1/2];
    anchors.d2=[xlR+32,ylT+d2/2];
  }

  if(showEq){
    push(kit.text("eq_pressure",[452,662],"P = "+l1+"/"+a1+" = "+l2+"/"+a2,{fontSize:30,color:C.ink}));
    if(showValues)push(kit.text("eq_force",[452,622],l2+" = "+fmt(r)+" × "+l1+" = "+fmt(F2)+" "+unit,{fontSize:26,color:C.accent}));
    if(showD)push(kit.text("eq_dist",[452,586],"d₂ = d₁ / "+fmt(r),{fontSize:26,color:C.guide}));
    anchors.equation=[452,662];
  }
  if(title)push(kit.text("title",[500,716],title,{fontSize:32}));

  anchors.piston_small=[xs,ysP+11];
  anchors.piston_large=[xl,ylP+13];
  anchors.fluid=[470,160];
  anchors.load=[xl,by0+bh/2];
  anchors.force_in=[xs,644];
  anchors.force_out=[xl,by1+45];
  anchors.small_cylinder=[xs,ysP+70];
  anchors.large_cylinder=[xl,ylP-70];
  anchors.channel=[470,160];

  return {drawables,labels,anchors,order};
