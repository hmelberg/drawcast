# Netlify build settings (Git-based deploys build on Netlify's servers).
#
# The secrets tripwire runs here and nowhere else matters: Netlify is the
# environment that actually holds ANTHROPIC_API_KEY and GOOGLE_API_KEY, so it
# is the one where a VITE_-prefixed slip would publish a paid key. That is the
# reason a test runs before the build at all, and it still does.
#
# It is ONE test file rather than `npm test` since 2026-09-11. The full suite
# passed on the container every time — 351 files, 7217 tests, green — and then
# vitest reported `Error: [vitest-worker]: Timeout calling "onTaskUpdate"`
# (birpc's 60-second ceiling) and exited 2, because passing tests plus an
# unhandled error is exit 2. `&&` then skipped the build, so the deploy died
# reporting a build failure with nothing wrong in the build. Four deploys went
# that way. It is not CPU contention: capping the worker pool at 2 left the
# duration at 114.17s against the uncapped 112.33s with the identical error.
# One error, always at the end, independent of worker count, with vitest's main
# thread idle (4.75s of transform all told) — a worker torn down with a call in
# flight, not anything in this repo.
#
# What still guards a deploy: the full suite before every push (the house rule,
# and `npm run build` runs tsc here regardless). What this gives up: a
# regression only the full suite catches could reach production if someone
# pushes without running it.
[build]
  command = "npx vitest run tests/no-bundled-secrets.test.ts && npm run build"
  publish = "dist"

# After a production deploy, ask for every card picture once so the CDN has
# them before visitors do (netlify/plugins/warm-cards).
[[plugins]]
  package = "./netlify/plugins/warm-cards"

# The Commodore 64 face is fetched cross-origin by pages that embed the
# engine (the engine build ships no public folder), and a font is a
# CORS-checked resource — without this header the browser refuses it.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

# The generic share card (spec 2026-10-02-share-design): /card/'s fallback
# redirects here, and the Share box fetches it from other origins (deploy
# previews, the dev server) for Copy image and the share sheet.
[[headers]]
  for = "/share-card.png"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# The player for drawcast pages (src/play.ts, src/standalone/page.ts): a
# `<name>.html` on github.io or anyone's site loads drawcast.app/play.js as a
# module, and a module script from another origin is a CORS request — so it
# and every chunk it imports need this header. Public code, nothing secret.
# play.js keeps its name (pages link it), so it is revalidated each load;
# the hashed chunks never change.
[[headers]]
  for = "/play.js"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

# Content-Security-Policy (security review 2026-09-28,
# docs/security/2026-09-28-code-execution-inventory.md). Defence in depth
# behind the code-trust gate (src/security/code-trust.ts): if code ever does
# run that should not, it cannot load scripts from elsewhere, and it cannot
# fetch()/XHR/beacon to any host outside this list — the bulk exfiltration
# channel for a stolen API key or account token.
#
# Every host below is one the app itself talks to (grep for the URL in src/):
#   script-src  'unsafe-eval' — template bodies are compiled with new Function
#               (scenes/compile.ts); 'wasm-unsafe-eval' — pyodide, webR,
#               MicroPython. CDNs: jsdelivr (pyodide, brython, micropython),
#               webR, plotly, Google sign-in + Drive picker (gsi, gapi), giscus.
#   connect-src the Anthropic API, drawcast's own functions and server, Google
#               APIs/Drive/Docs, GitHub (publish, remote packs, pylib/mdlib on
#               *.github.io), runtime package CDNs (pyodide/PyPI, webR repo),
#               Wikipedia/Wikimedia, Iconify, OpenAlex, Unpaywall, Open Library,
#               archive.org, YouTube oEmbed, PubChem, arXiv, Google Fonts (the
#               video export inlines the face).
#   img-src     https: — portraits, sources and images may name any host, and
#               are loaded as <img>. (A GET to an image host is a residual
#               exfiltration channel CSP cannot close without breaking that.)
#   frame-src   https: — YouTube, archive.org, the C64 emulator, giscus, Google
#               sign-in/picker, and PDFs the reader opens from any host.
#   frame-ancestors 'self' — the app holds secrets; it is not to be framed.
#               A framable, secret-free viewer origin is step 2
#               (docs/security/2026-09-28-viewer-origin.md).
# Deliberately NOT allowed: fetch() to arbitrary hosts. Casualties, all
# author-side and rare: a source PDF on a CORS-open host not listed here, a
# remote pack URL outside GitHub, an author poster URL on another host, a C64
# disk image from your own URL. To allow one, add its origin to connect-src.
# tests/csp.test.ts pins the key directives.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://webr.r-wasm.org https://cdn.plot.ly https://accounts.google.com https://apis.google.com https://giscus.app; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com https://drawcast.app https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' data: blob: https://drawcast.app https://drawcast.anvil.app https://api.anthropic.com https://*.googleapis.com https://accounts.google.com https://docs.google.com https://*.googleusercontent.com https://api.github.com https://raw.githubusercontent.com https://*.github.io https://cdn.jsdelivr.net https://pypi.org https://files.pythonhosted.org https://webr.r-wasm.org https://repo.r-wasm.org https://cdn.plot.ly https://*.wikipedia.org https://*.wikimedia.org https://api.iconify.design https://api.openalex.org https://api.unpaywall.org https://openlibrary.org https://covers.openlibrary.org https://archive.org https://*.archive.org https://www.youtube.com https://i.ytimg.com https://pubchem.ncbi.nlm.nih.gov https://arxiv.org https://export.arxiv.org https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self' blob:; frame-src https:; child-src 'self' blob: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; manifest-src 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# NAME.drawcast.app → drawcast.app/#name (netlify/edge-functions/name-host.mts).
# Needs `*.drawcast.app` as a domain alias on the site; the apex and www pass
# straight through, so the function costs the ordinary page one host check.
[[edge_functions]]
  path = "/*"
  function = "name-host"

# drawcast.app/w/<name> (2026-10-03): a drawcast's watch address — the app's
# own page, with this drawcast's head put in by
# netlify/edge-functions/watch-page.mts (its config path is /w/*).
[[redirects]]
  from = "/w/*"
  to = "/index.html"
  status = 200

# The listing picture (thumbnail round, 2026-10-04): /card/<name>.png draws
# the cast's style over its poster with resvg, a native module esbuild must
# not bundle, and with these three faces read from disk.
[functions.card]
  external_node_modules = ["@resvg/resvg-js"]
  included_files = ["public/fonts/thumb/*.ttf", "public/fonts/patrickhand/*.ttf"]
