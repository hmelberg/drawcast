{"title": "2 thing — A* · API", "elements": [{"id": "valve", "type": "node", "shape": "rect", "text": "Expansion valve", "x": 315, "y": 470, "width": 210, "height": 84, "font_size": 26}, {"id": "cond", "type": "node", "shape": "rect", "text": "Condenser coil", "x": 665, "y": 470, "width": 210, "height": 84, "font_size": 26, "style": {"color": "#b5482e"}}, {"id": "evap", "type": "node", "shape": "rect", "text": "Evaporator coil", "x": 315, "y": 220, "width": 210, "height": 84, "font_size": 26, "style": {"color": "#2f6b8f"}}, {"id": "comp", "type": "node", "shape": "rect", "text": "Compressor", "x": 665, "y": 220, "width": 210, "height": 84, "font_size": 26}, {"id": "food", "type": "node", "shape": "rect", "text": "Food", "x": 75, "y": 220, "width": 110, "height": 70, "font_size": 26, "style": {"color": "#2f6b8f"}}, {"id": "room", "type": "node", "shape": "rect", "text": "Kitchen 22 °C", "x": 905, "y": 470, "width": 160, "height": 70, "font_size": 22, "style": {"color": "#b5482e"}}, {"id": "wall", "type": "path", "points": [[490, 185], [490, 560]], "style": {"color": "#8f887c", "dash": true, "stroke_width": 3}}, {"id": "l_in", "type": "text", "text": "inside −", "x": 435, "y": 580, "font_size": 22, "style": {"color": "#2f6b8f"}}, {"id": "l_out", "type": "text", "text": "kitchen +", "x": 548, "y": 580, "font_size": 22, "style": {"color": "#b5482e"}}, {"id": "a1", "type": "arrow", "from": {"ref": "evap"}, "to": {"ref": "comp"}, "style": {"color": "#2f6b8f"}}, {"id": "a2", "type": "arrow", "from": {"ref": "comp"}, "to": {"ref": "cond"}, "style": {"color": "#b5482e"}}, {"id": "a3", "type": "arrow", "from": {"ref": "cond"}, "to": {"ref": "valve"}, "style": {"color": "#b5482e"}}, {"id": "a4", "type": "arrow", "from": {"ref": "valve"}, "to": {"ref": "evap"}, "style": {"color": "#2f6b8f"}}, {"id": "l1", "type": "text", "text": "cool gas, low pressure", "x": 635, "y": 290, "font_size": 22, "style": {"color": "#2f6b8f"}}, {"id": "l2", "type": "text", "text": "hot gas, 60 °C", "x": 762, "y": 345, "font_size": 22, "style": {"color": "#b5482e"}}, {"id": "l3", "type": "text", "text": "warm liquid, high pressure", "x": 655, "y": 405, "font_size": 22, "style": {"color": "#b5482e"}}, {"id": "l4", "type": "text", "text": "icy mist, −25 °C", "x": 212, "y": 345, "font_size": 22, "style": {"color": "#2f6b8f"}}, {"id": "heat_in", "type": "arrow", "from": {"ref": "food"}, "to": {"ref": "evap"}, "style": {"color": "#d0865f"}}, {"id": "heat_out", "type": "arrow", "from": {"ref": "cond"}, "to": {"ref": "room"}, "style": {"color": "#d0865f"}}, {"id": "lh_in", "type": "label", "text": "heat", "attach_to": "heat_in", "side": "below", "style": {"color": "#d0865f"}}, {"id": "lh_out", "type": "label", "text": "heat", "attach_to": "heat_out", "side": "above", "style": {"color": "#d0865f"}}, {"id": "uphill", "type": "path", "points": [[75, 258], [105, 500], [280, 612], [490, 632], [700, 612], [880, 548], [905, 506]], "smooth": true, "style": {"color": "#d0865f", "stroke_width": 6, "opacity": 0.85}}, {"id": "l_uphill", "type": "text", "text": "heat, pushed uphill", "x": 490, "y": 654, "font_size": 24, "style": {"color": "#d0865f"}}, {"id": "plug", "type": "icon", "of": "zap", "size": 46, "at": {"ref": "comp", "side": "right", "gap": 10}, "style": {"color": "#8a5fa8"}}], "commands": [{"card": {"title": "A* · API — How a fridge moves heat"}}, {"draw": ["food"], "speak": "How does a fridge keep its inside cold? The surprise: it never makes cold. It carries heat out."}, {"draw": ["wall", "l_in", "l_out"], "parallel": true}, {"draw": ["evap", "heat_in", "lh_in"], "speak": "Inside, behind the back wall, runs a thin coil. Heat flows from the food into it, because the coil is colder still."}, {"draw": ["l4"], "speak": "The coil is cold because a liquid is boiling in it — at about minus twenty-five degrees, since its pressure is kept very low."}, {"highlight": {"target": ["evap"]}, "speak": "Boiling soaks up heat, the way sweat drying on your skin cools you. So the liquid boils away, taking the food's heat with it as a gas."}, {"pause": 0.4}, {"draw": ["a1", "l1", "room"], "speak": "Now the problem: that gas holds the heat, but it is colder than the kitchen, and heat will not flow from cold to warm by itself."}, {"draw": ["comp", "a2", "l2"], "speak": "So the compressor — the humming box at the bottom — squeezes the gas hard. Squeezed gas heats up, to around sixty degrees."}, {"draw": ["cond"], "speak": "Now it is hotter than the kitchen. It flows through the coil on the back of the fridge."}, {"draw": ["heat_out", "lh_out"], "speak": "And there the heat finally leaves, into the kitchen air. That is why the back of a fridge feels warm."}, {"draw": ["a3", "l3"], "speak": "Losing its heat, the gas turns back into a liquid, still under high pressure."}, {"draw": ["valve", "a4"], "speak": "A narrow valve lets it spray back into the low-pressure side, where it chills to minus twenty-five, ready to boil again."}, {"flow": {"along": ["a1", "a2", "a3", "a4"]}, "speak": "Round and round: boil inside to pick up heat, get squeezed hot, dump the heat outside, expand cold again."}, {"highlight": {"target": ["a4", "evap", "a1", "l4", "l1"], "color": "#2f6b8f"}, "cue": 0.3, "speak": "The pressure is the whole trick: low pressure makes the fluid colder than the food,"}, {"highlight": {"target": ["a2", "cond", "a3", "l2", "l3"], "color": "#b5482e"}, "speak": "high pressure makes it hotter than the room."}, {"draw": ["plug"], "speak": "The electricity pays for that squeeze."}, {"pause": 0.5}, {"draw": ["uphill", "l_uphill"], "speak": "So a fridge is a heat pump: it moves heat uphill, from a cold box into a warm room — plus the heat of the motor on top."}, {"quiz": {"question": "You leave the fridge door open in a closed kitchen. What happens to the kitchen?", "choices": ["It cools down", "It warms up", "It stays the same"], "correct": 2, "right": "It warms up: the fridge just moves heat around the room, and the motor's own work adds more heat to it."}}]}
