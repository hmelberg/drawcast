_width": 3}}, {"id": "evaporator_cold", "type": "path", "points": [[450, 570], [90, 570], [90, 540], [450, 540], [450, 510], [90, 510], [90, 480], [450, 480]], "style": {"color": "#2f6b8f", "stroke_width": 6}}, {"id": "pipe_suction_blue", "type": "path", "points": [[450, 480], [520, 480], [520, 215], [545, 215]], "style": {"color": "#2f6b8f", "stroke_width": 6}}, {"id": "pipe_return_blue", "type": "path", "points": [[475, 640], [465, 640], [465, 570], [450, 570]], "style": {"color": "#2f6b8f", "stroke_width": 6}}, {"id": "condenser_hot", "type": "path", "points": [[650, 290], [570, 290], [570, 330], [650, 330], [650, 370], [570, 370], [570, 410], [650, 410], [650, 450], [570, 450], [570, 490], [650, 490], [650, 530], [570, 530], [570, 570], [650, 570], [650, 610], [570, 610]], "style": {"color": "#b5482e", "stroke_width": 6}}, {"id": "pipe_discharge_red", "type": "path", "points": [[635, 215], [680, 215], [680, 290], [650, 290]], "style": {"color": "#b5482e", "stroke_width": 7}}, {"id": "pipe_liquid_red", "type": "path", "points": [[570, 610], [570, 640], [545, 640]], "style": {"color": "#b5482e", "stroke_width": 6}}, {"id": "expansion_tube", "type": "path", "points": [[545, 640], [535, 648], [523, 632], [511, 648], [499, 632], [487, 648], [475, 640]], "smooth": true, "style": {"stroke_width": 3}, "details": "A capillary tube is a long, very thin copper tube. Its narrow bore holds back the flow, so the compressor can build high pressure behind it while the pressure after it stays low."}, {"id": "compressor", "type": "shape", "shape": "rect", "x": 590, "y": 215, "width": 90, "height": 60, "style": {"fill": "#8f887c"}}, {"id": "label_compressor", "type": "text", "text": "compressor", "x": 760, "y": 200, "font_size": 28}, {"id": "label_evap", "type": "text", "text": "0.6 bar, −25 °C", "x": 270, "y": 600, "font_size": 30, "style": {"color": "#2f6b8f"}}, {"id": "label_cond", "type": "text", "text": "5 bar, +40 °C", "x": 820, "y": 640, "font_size": 30, "style": {"color": "#b5482e"}}, {"id": "hi1_w", "type": "path", "points": [[130, 425], [138, 436], [122, 447], [138, 458], [130, 468]], "smooth": true}, {"id": "hi1_h", "type": "arrow", "from": {"x": 130, "y": 466}, "to": {"x": 130, "y": 478}}, {"id": "hi2_w", "type": "path", "points": [[330, 375], [338, 394], [322, 413], [338, 432], [322, 451], [330, 468]], "smooth": true}, {"id": "hi2_h", "type": "arrow", "from": {"x": 330, "y": 466}, "to": {"x": 330, "y": 478}}, {"id": "heat_in", "type": "group", "members": ["hi1_w", "hi1_h", "hi2_w", "hi2_h"]}, {"id": "ho1_w", "type": "path", "points": [[662, 350], [680, 360], [698, 340], [716, 360], [734, 350], [748, 350]], "smooth": true}, {"id": "ho1_h", "type": "arrow", "from": {"x": 746, "y": 350}, "to": {"x": 768, "y": 350}}, {"id": "ho2_w", "type": "path", "points": [[662, 470], [680, 480], [698, 460], [716, 480], [734, 470], [748, 470]], "smooth": true}, {"id": "ho2_h", "type": "arrow", "from": {"x": 746, "y": 470}, "to": {"x": 768, "y": 470}}, {"id": "ho3_w", "type": "path", "points": [[662, 590], [680, 600], [698, 580], [716, 600], [734, 590], [748, 590]], "smooth": true}, {"id": "ho3_h", "type": "arrow", "from": {"x": 746, "y": 590}, "to": {"x": 768, "y": 590}}, {"id": "heat_out", "type": "group", "members": ["ho1_w", "ho1_h", "ho2_w", "ho2_h", "ho3_w", "ho3_h"]}, {"id": "formula", "type": "math", "tex": "\\text{heat out} = \\text{heat in} + \\text{work}", "x": 830, "y": 515, "size": 30, "colors": {"\\text{heat out}": "#b5482e", "\\text{heat in}": "#2f6b8f"}, "details": "Energy is conserved: $$Q_{out} = Q_{in} + W$$ The ratio $Q_{in}/W$, the coefficient of performance, is typically around 2–3 for a household fridge: each joule of electricity moves two or three joules of heat out of the box."}, {"id": "ev", "type": "scratch", "work": ["Lower pressure → boils colder", "Everest: water boils ≈ 70 °C", "isobutane, 0.6 bar: −25 °C", "isobutane, 5 bar: +40 °C"], "x": 770, "y": 650, "font_size": 22}, {"id": "frame", "type": "annotation", "target": ["evaporator", "condenser", "compressor", "pipe_suction", "pipe_discharge", "pipe_liquid", "pipe_return", "expansion_tube", "formula"], "kind": "box"}, {"id": "quiz_q", "type": "text", "text": "The kitchen gets…?", "x": 860, "y": 425, "font_size": 30}, {"id": "choice_a", "type": "text", "text": "A  colder", "x": 845, "y": 385, "font_size": 30}, {"id": "choice_b", "type": "text", "text": "B  warmer", "x": 845, "y": 345, "font_size": 30}, {"id": "choice_c", "type": "text", "text": "C  the same", "x": 845, "y": 305, "font_size": 30}, {"id": "choices", "type": "group", "members": ["quiz_q", "choice_a", "choice_b", "choice_c"]}], "commands": [{"card": {"title": "D* · API — How a fridge keeps cold"}}, {"draw": ["cabinet", "floor", "kitchen"], "speak": "How does a fridge make its inside cold, when nothing in it is cold to begin with?"}, {"draw": ["big_arrow"], "speak": "It doesn't make cold at all; it carries heat out of the box and dumps it into the kitchen."}, {"erase": ["big_arrow"]}, {"draw": ["evaporator", "condenser", "pipe_suction", "pipe_discharge", "pipe_liquid", "pipe_return"], "speak": "The carrier is a fluid, isobutane in most modern fridges, running round a sealed loop of pipe."}, {"pause": 0.3}, {"draw": ["ev_box", "ev_line_1", "ev_line_2"], "speak": "It relies on the same trick that makes water boil at about seventy degrees on top of Everest: lower the pressure, and a liquid boils colder."}, {"draw": ["evaporator_cold", "pipe_suction_blue", "label_evap", "ev_line_3"], "speak": "Inside the box, the fluid is held at about half an atmosphere, where it boils at around minus twenty-five degrees."}, {"draw": ["heat_in"], "parallel": true, "speak": "Boiling soaks up heat, so the coil draws heat out of the food, the way drying sweat cools your skin."}, {"flow": {"along": ["evaporator_cold"], "duration": 2.5, "color": "#2f6b8f"}}, {"flow": {"along": ["pipe_suction_blue"], "color": "#2f6b8f"}, "speak": "The vapour now holds that heat, but it's still colder than the kitchen, so it can't hand it over yet."}, {"point": {"at": {"x": 590, "y": 215}, "gesture": "circle", "duration": 1.8}}, {"draw": ["compressor", "label_compressor", "pipe_discharge_red", "label_cond", "ev_line_4"], "speak": "So a compressor squeezes it to about five atmospheres, which heats it and lifts its boiling point to around forty degrees."}, {"move": {"target": ["ev"], "scale": 0.4, "to": {"x": 910, "y": 250}, "duration": 1.2}}, {"draw": ["condenser_hot", "pipe_liquid_red", "heat_out"], "speak": "In the coil on the back, the vapour is hotter than the room, so it sheds heat and condenses back into liquid."}, {"flow": {"along": ["condenser_hot"], "duration": 2.5, "color": "#b5482e"}}, {"highlight": {"target": ["condenser_hot"], "effect": "circle"}, "speak": "That's why the back of your fridge feels warm."}, {"draw": ["expansion_tube", "pipe_return_blue"], "speak": "Then a narrow tube lets the pressure fall again, the liquid flashes cold, and the loop starts over."}, {"flow": {"along": ["pipe_return_blue", "evaporator_cold", "pipe_suction_blue", "pipe_discharge_red", "condenser_hot", "pipe_liquid_red", "expansion_tube"], "duration": 5}}, {"speak": "At every step, heat flows the ordinary way, from warmer to colder.", "blocking": false}, {"point": {"at": {"ref": "hi2_w"}, "gesture": "underline", "duration": 1.8}}, {"point": {"at": {"ref": "ho2_w"}, "gesture": "underline", "duration": 1.8}}, {"highlight": {"target": ["evaporator_cold", "pipe_suction_blue", "pipe_return_blue"]}, "speak": "The pressure changes simply keep the fluid colder than the food on one side,"}, {"highlight": {"target": ["pipe_discharge_red", "condenser_hot", "pipe_liquid_red"]}, "speak": "and hotter than the kitchen on the other."}, {"highlight": {"target": ["compressor", "expansion_tube"], "effect": "pulse", "duration": 2}}, {"draw": ["formula"], "speak": "The price is the compressor's electricity, and that turns into heat as well."}, {"highlight": {"target": ["formula"], "part": "\\text{work}", "effect": "underline"}, "speak": "The back coil gives off the food's heat plus the motor's work."}, {"highlight": {"target": ["compressor"], "effect": "pulse", "duration": 1.8}}, {"draw": ["frame"], "speak": "So a fridge is a heat pump, and pressure is the lever that lets it push heat from a cold box into a warm room.", "delivery": "grave"}, {"flow": {"along": ["pipe_return_blue", "evaporator_cold", "pipe_suction_blue", "pipe_discharge_red", "condenser_hot", "pipe_liquid_red", "expansion_tube"], "duration": 4}}, {"fade": {"target": ["cabinet", "floor", "kitchen", "evaporator", "condenser", "pipe_suction", "pipe_discharge", "pipe_liquid", "pipe_return", "evaporator_cold", "pipe_suction_blue", "pipe_return_blue", "condenser_hot", "pipe_discharge_red", "pipe_liquid_red", "expansion_tube", "compressor", "label_compressor", "label_evap", "label_cond", "heat_in", "heat_out", "frame", "ev"], "to": 0.3}}, {"draw": ["choices"], "parallel": true}, {"quiz": {"question": "You leave the fridge door open in a sealed, insulated kitchen for hours. What happens to the kitchen?", "choices": ["It gets colder", "It gets warmer", "It stays the same"], "correct": 2, "right": "It gets warmer: the fridge only moves the room's own heat around, and the compressor's work is added as extra heat — heat out equals heat in plus work.", "wrong": "Think about where the compressor's electricity ends up."}}]}
