tch", "branchlabel_start_watch"], "speak": "Picture a hundred such people, each with a bulge in the aorta about four and a half centimetres wide."}, {"pause": 0.3}, {"draw": ["node_now", "label_now", "edge_now_now_ok", "branchlabel_now_now_ok", "node_now_ok", "label_now_ok", "edge_now_now_die", "node_now_die", "label_now_die"], "speak": "Repair now, and the whole risk is paid up front:"}, {"draw": ["branchlabel_now_now_die"], "speak": "roughly three in a hundred die from the operation itself."}, {"highlight": {"target": ["node_now_ok", "label_now_ok"]}, "speak": "The other ninety-seven are protected from rupture for good."}, {"draw": ["value_now"]}, {"pause": 0.4}, {"draw": ["node_watch", "label_watch", "edge_watch_never", "edge_watch_later", "edge_watch_rupture"], "speak": "Watching means a scan every six to twelve months, and surgery only once it passes five and a half centimetres."}, {"draw": ["branchlabel_watch_rupture", "node_rupture", "label_rupture"], "speak": "At this size rupture is rare, about one in a hundred per year, so only around two burst before they are caught —"}, {"highlight": {"target": ["node_rupture", "label_rupture"]}, "speak": "and most of those die."}, {"draw": ["branchlabel_watch_later", "node_later", "label_later", "edge_later_later_ok", "branchlabel_later_later_ok", "node_later_ok", "label_later_ok", "edge_later_later_die", "branchlabel_later_later_die", "node_later_die", "label_later_die"], "speak": "About sixty grow past the threshold and get the same operation later, with the same three-in-a-hundred risk."}, {"draw": ["branchlabel_watch_never", "node_never", "label_never"], "speak": "The remaining forty never reach it: their aneurysm stays small, or something else ends their life first."}, {"pause": 0.4}, {"focus": {"target": ["node_watch", "label_watch", "edge_watch_never", "edge_watch_later", "edge_watch_rupture", "branchlabel_watch_never", "branchlabel_watch_later", "branchlabel_watch_rupture", "node_never", "label_never", "node_later", "label_later", "edge_later_later_ok", "edge_later_later_die", "branchlabel_later_later_ok", "branchlabel_later_later_die", "node_later_ok", "label_later_ok", "node_later_die", "label_later_die", "node_rupture", "label_rupture"]}, "speak": "So what does waiting cost?"}, {"draw": ["ev_box", "ev_line_1"], "speak": "Add it up: nearly two deaths from rupture,"}, {"draw": ["ev_line_2"], "speak": "nearly two from the later operations —"}, {"draw": ["ev_line_3"], "speak": "about the same as operating on everyone today."}, {"draw": ["value_later", "value_watch"]}, {"highlight": {"target": ["value_now", "value_watch"], "effect": "circle"}, "speak": "Three and a bit against three: a tie."}, {"move": {"target": ["ev"], "scale": 0.55, "to": {"x": 150, "y": 220}}}, {"highlight": {"target": ["value_now", "value_watch"]}, "speak": "That tie is exactly what two large trials found in the 1990s, the UK Small Aneurysm Trial and the American ADAM trial: early repair did not help people live longer."}, {"draw": ["box_never"], "speak": "But the tie hides a difference: in the watching arm, forty people never had an operation at all.", "delivery": "grave"}, {"point": {"at": {"ref": "branchlabel_watch_later"}, "gesture": "underline"}, "speak": "The balance flips above five and a half centimetres, where rupture risk climbs steeply and repair wins."}, {"highlight": {"target": ["branchlabel_now_now_die"]}, "speak": "For one person the scales can tip either way: frailty raises the operative risk,"}, {"highlight": {"target": ["branchlabel_later_later_die"]}, "speak": "while a stent graft through the groin lowers it."}, {"draw": ["box_watch"], "speak": "So for a small aneurysm, waiting is not refusing surgery — it is postponing it, almost for free, and for many people postponing it forever."}, {"quiz": {"question": "In this tree, what does choosing to watch mainly change?", "choices": ["The risk of dying from the aneurysm drops to zero", "About 40 in 100 never need an operation", "Rupture becomes riskier than surgery", "The later operation becomes much more dangerous"], "correct": 2, "right": "About 40 in 100 never need an operation: deaths come out roughly even, but many aneurysms never reach 5.5 centimetres.", "wrong": "Look at what the two arms' death totals do, and then at the branch that never reaches the operating table."}}]}
