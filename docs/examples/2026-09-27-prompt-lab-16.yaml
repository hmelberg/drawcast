{"title": "1 econ — D* · API", "domain": {"x": [0, 100], "y": [0, 100], "box": {"x": 70, "y": 120, "w": 560, "h": 510}}, "vars": {"s": 0}, "elements": [{"id": "ax", "type": "axes", "x_label": "Real output (goods made)", "y_label": "Price level", "cross": "corner"}, {"id": "as_full", "type": "curve", "expr": "25 + 40/(88 - x)", "x_from": 0, "x_to": 87.3, "style": {"color": "#2f6b8f", "opacity": 0}}, {"id": "as_flat", "type": "curve", "expr": "25 + 40/(88 - x)", "x_from": 0, "x_to": 80, "style": {"color": "#2f6b8f"}}, {"id": "as_steep", "type": "curve", "expr": "25 + 40/(88 - x)", "x_from": 80, "x_to": 87.3, "style": {"color": "#2f6b8f"}}, {"id": "label_AS", "type": "label", "text": "AS", "attach_to": "as_steep", "side": "left", "style": {"color": "#2f6b8f"}}, {"id": "cap", "type": "path", "data": true, "points": [[88, 0], [88, 95]], "style": {"color": "#8f887c", "dash": true}}, {"id": "label_cap", "type": "label", "text": "full capacity", "attach_to": "cap", "side": "right", "style": {"color": "#8f887c"}}, {"id": "ad", "type": "curve", "expr": "110 - 2*(x - s)", "style": {"color": "#b5482e"}}, {"id": "label_AD", "type": "label", "text": "AD", "attach_to": "ad", "side": "right", "style": {"color": "#b5482e"}}, {"id": "eq", "type": "point", "at": {"intersection_of": ["ad", "as_full"]}, "guides": true}, {"id": "mv", "type": "math", "tex": "M \\times V = P \\times Y", "x": 810, "y": 420, "colors": {"M": "#b5482e", "V": "#b5482e"}, "details": "The quantity equation: $M$ is the money stock, $V$ its velocity (how many times a year each dollar is spent), $P$ the price level and $Y$ real output. It holds by definition; the economics is in which term gives when $M$ changes."}, {"id": "note", "type": "text", "text": "US 2008–14: base ×4,\ninflation < 2%", "font_size": 20, "x": 810, "y": 360}, {"id": "box_mv", "type": "annotation", "target": ["mv"], "kind": "box", "style": {"color": "#8a5fa8"}}, {"id": "box_steep", "type": "annotation", "target": ["as_steep"], "kind": "box", "style": {"color": "#8a5fa8"}}], "commands": [{"card": {"title": "D* · API — Money and prices"}}, {"draw": ["ax"], "speak": "Why does printing money push prices up, and why, sometimes, doesn't it?"}, {"draw": ["mv"], "speak": "Start with one piece of bookkeeping: money, times how often each dollar is spent, equals prices times the goods sold."}, {"pause": 0.3}, {"speak": "Print more M, and something on the right must give: either prices, or the amount produced.", "blocking": false}, {"highlight": {"target": ["mv"], "part": "M", "color": "#8a5fa8", "duration": 1.4}}, {"highlight": {"target": ["mv"], "part": "P", "color": "#8a5fa8", "duration": 1.4}}, {"highlight": {"target": ["mv"], "part": "Y", "color": "#8a5fa8", "duration": 1.4}}, {"draw": ["as_full", "as_flat", "as_steep", "label_AS", "cap", "label_cap"], "speak": "Which one gives depends on how much room the economy has to make more."}, {"highlight": {"target": ["as_flat"], "color": "#8a5fa8"}, "speak": "When factories sit idle and people want work, extra spending can be met with extra goods."}, {"highlight": {"target": ["as_steep"], "color": "#8a5fa8"}, "speak": "Near capacity there is no one left to hire, so the same spending can only bid up prices."}, {"pause": 0.4}, {"draw": ["ad", "label_AD", "eq"], "speak": "Total spending is the demand curve; here it crosses where there is plenty of slack."}, {"pause": 0.3}, {"animate": {"s": 34}, "duration": 3.5, "ghost": ["ad"], "speak": "Print money that people actually spend, and demand shifts to the right."}, {"speak": "Output rises; prices hardly move.", "blocking": false}, {"point": {"at": {"data": [58, 0]}, "gesture": "underline", "duration": 1.6}}, {"point": {"at": {"data": [0, 27]}, "gesture": "tap", "duration": 1.2}}, {"animate": {"s": 64}, "duration": 3.5, "speak": "Keep printing, and the crossing climbs into the steep part, where each extra dollar mostly raises prices."}, {"pause": 0.4}, {"focus": {"target": ["as_steep", "eq", "cap"]}, "speak": "That is Zimbabwe in 2008, or Germany in 1923: money growing far faster than anything the economy could make."}, {"highlight": {"target": ["mv"], "part": "V", "color": "#8a5fa8"}, "speak": "But what if the new money is never spent?"}, {"speak": "Then spending does not grow, and the demand curve stays exactly where it is.", "blocking": false}, {"morph": {"target": ["mv"], "tex": "{\\Large M} \\times {\\scriptsize V} = P \\times Y", "duration": 2}}, {"point": {"at": {"ref": "ad"}, "gesture": "tap", "duration": 2}}, {"draw": ["note"], "speak": "After 2008 the Fed more than quadrupled the monetary base, yet inflation stayed mostly under two percent; banks sat on the new money as reserves."}, {"pause": 0.4}, {"draw": ["box_mv", "box_steep"], "speak": "So printing money causes inflation only when it is spent, and spent faster than the economy can grow its output.", "delivery": "grave"}, {"quiz": {"question": "An economy is already at full capacity, and the central bank prints money that households immediately spend. What mostly happens?", "choices": ["Prices rise, output barely changes", "Output rises, prices stay steady", "Nothing: the money sits idle", "Prices fall"], "correct": 1, "right": "Prices rise: the money is spent, but with no idle workers or factories left, the extra spending can only bid up prices."}}]}
