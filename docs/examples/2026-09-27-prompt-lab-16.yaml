{"title": "4 decision — A* · API", "template": "decision_tree", "params": {"box": {"x": 30, "y": 250, "w": 680, "h": 400}, "root": {"id": "choice", "type": "decision", "label": "70, aneurysm < 5.5 cm", "children": [{"label": "", "node": {"id": "repair", "type": "chance", "label": "Repair now", "children": [{"label": "", "node": {"id": "r_die", "type": "terminal", "label": ""}}, {"label": "", "node": {"id": "r_ok", "type": "terminal", "label": ""}}]}}, {"label": "", "node": {"id": "watch", "type": "chance", "label": "Scan and wait", "children": [{"label": "", "node": {"id": "w_rupt", "type": "terminal", "label": ""}}, {"label": "", "node": {"id": "w_later", "type": "terminal", "label": ""}}, {"label": "", "node": {"id": "w_never", "type": "terminal", "label": ""}}]}}]}}, "elements": [{"id": "pe_r_die", "type": "text", "text": "p = 0.04", "font_size": 24, "at": {"ref": "edge_repair_r_die", "anchor": "mid", "offset": [-18, 24]}}, {"id": "pe_r_ok", "type": "text", "text": "p = 0.96", "font_size": 24, "at": {"ref": "edge_repair_r_ok", "anchor": "mid", "offset": [-18, -24]}}, {"id": "pe_w_rupt", "type": "text", "text": "p = 0.02", "font_size": 24, "at": {"ref": "edge_watch_w_rupt", "anchor": "mid", "offset": [-18, 24]}, "style": {"color": "#b5482e"}}, {"id": "pe_w_later", "type": "text", "text": "p = 0.60", "font_size": 24, "at": {"ref": "edge_watch_w_later", "anchor": "mid", "offset": [0, 22]}}, {"id": "pe_w_never", "type": "text", "text": "p = 0.38", "font_size": 24, "at": {"ref": "edge_watch_w_never", "anchor": "mid", "offset": [-18, -24]}}, {"id": "pe6_rupt", "type": "text", "text": "p = 0.25", "font_size": 24, "at": {"ref": "edge_watch_w_rupt", "anchor": "mid", "offset": [-18, 24]}, "style": {"color": "#b5482e"}}, {"id": "pe6_never", "type": "text", "text": "p = 0.15", "font_size": 24, "at": {"ref": "edge_watch_w_never", "anchor": "mid", "offset": [-18, -24]}, "style": {"color": "#b5482e"}}, {"id": "t_r_die", "type": "text", "text": "Dies in surgery · 0", "font_size": 24, "at": {"ref": "node_r_die", "side": "right", "gap": 14}, "anchor": "left"}, {"id": "t_r_ok", "type": "text", "text": "Repaired · 9.5", "font_size": 24, "at": {"ref": "node_r_ok", "side": "right", "gap": 14}, "anchor": "left"}, {"id": "t_w_rupt", "type": "text", "text": "Ruptures · 2", "font_size": 24, "at": {"ref": "node_w_rupt", "side": "right", "gap": 14}, "anchor": "left", "style": {"color": "#b5482e"}}, {"id": "t_w_later", "type": "text", "text": "Later repair · 9.2", "font_size": 24, "at": {"ref": "node_w_later", "side": "right", "gap": 14}, "anchor": "left"}, {"id": "t_w_never", "type": "text", "text": "Never operated · 9.5", "font_size": 24, "at": {"ref": "node_w_never", "side": "right", "gap": 14}, "anchor": "left"}, {"id": "calc_repair", "type": "math", "tex": "0.96\\times 9.5 + 0.04\\times 0 = 9.12", "x": 500, "y": 200, "size": 34, "colors": {"9.12": "#8a5fa8"}}, {"id": "calc_watch", "type": "math", "tex": "0.02\\times 2 + 0.6\\times 9.2 + 0.38\\times 9.5 \\approx 9.17", "x": 500, "y": 200, "size": 34, "colors": {"9.17": "#8a5fa8"}}, {"id": "ev_repair", "type": "math", "tex": "EV = 9.12", "at": {"ref": "node_repair", "side": "below", "gap": 16}, "style": {"color": "#8a5fa8"}}, {"id": "ev_watch", "type": "math", "tex": "EV \\approx 9.17", "at": {"ref": "node_watch", "side": "below", "gap": 16}, "style": {"color": "#8a5fa8"}}, {"id": "trials", "type": "scratch", "work": ["UK trial and US veterans' ADAM trial:", "early repair gave no longer life"], "x": 500, "y": 200, "font_size": 24, "cites": ["uksat", "adam"]}, {"id": "threshold", "type": "math", "tex": "9.5\\,(1-p) = 9.17 \\;\\Rightarrow\\; p \\approx 3.5\\%", "x": 500, "y": 200, "size": 34, "details": "Repair now is worth $9.5(1-p)$ expected QALYs when $p$ is the operative death risk. It beats watching (9.17) only when $p < 1 - 9.17/9.5 \\approx 0.035$. The numbers are illustrative, chosen to match the size of risks seen in the trials."}, {"id": "label_6cm", "type": "text", "text": "now 6 cm", "font_size": 26, "at": {"ref": "node_choice", "side": "above", "gap": 26}, "style": {"color": "#b5482e"}}], "sources": [{"id": "uksat", "title": "Mortality results for randomised controlled trial of early elective surgery or ultrasonographic surveillance for small abdominal aortic aneurysms", "authors": "UK Small Aneurysm Trial Participants", "year": 1998, "finding": "Early repair gave no survival benefit"}, {"id": "adam", "title": "Immediate repair compared with surveillance of small abdominal aortic aneurysms", "authors": "Lederle et al.", "year": 2002, "finding": "No survival benefit from immediate repair"}], "commands": [{"card": {"title": "A* · API — Repair now, or watch?"}}, {"draw": ["node_choice", "label_choice"], "speak": "Should a 70-year-old with a small aortic aneurysm — a bulge in the body's main artery, under five and a half centimetres — have it repaired now, or be scanned and watched? A decision tree weighs the two."}, {"draw": ["edge_choice_repair", "node_repair", "label_repair"], "speak": "Repair now leads to a circle, a chance node: the operation itself is a gamble."}, {"draw": ["edge_repair_r_die", "pe_r_die", "node_r_die", "t_r_die"], "speak": "For a 70-year-old having open repair, about 4 in 100 die from the operation."}, {"draw": ["edge_repair_r_ok", "pe_r_ok", "node_r_ok", "t_r_ok"], "speak": "The other 96 are protected for good: about 9.5 quality-adjusted life years ahead — years of life, weighted by how well they are lived."}, {"pause": 0.4}, {"draw": ["edge_choice_watch", "node_watch", "label_watch"], "speak": "Watching is a gamble too, only spread over years: an ultrasound scan every few months."}, {"draw": ["edge_watch_w_rupt", "pe_w_rupt", "node_w_rupt", "t_w_rupt"], "speak": "The feared ending: it bursts before anyone acts. While it is small and scanned, that is rare — here, 2 in 100."}, {"draw": ["edge_watch_w_later", "pe_w_later", "node_w_later", "t_w_later"], "speak": "Most, 60 in 100, see it grow past five and a half centimetres, and are repaired then — a little older, so 9.2."}, {"draw": ["edge_watch_w_never", "pe_w_never", "node_w_never", "t_w_never"], "speak": "And 38 in 100 never need the operation at all: it stays small, or at 70 something else ends their life first."}, {"highlight": {"target": ["t_w_rupt", "pe_w_rupt"]}, "speak": "The rupture is what frightens people. But the scans usually catch the growth before it happens."}, {"draw": ["calc_repair"], "speak": "Now fold back. 0.96 times 9.5, plus 0.04 times zero: 9.12 expected QALYs for repairing now."}, {"erase": ["calc_repair"]}, {"draw": ["ev_repair"]}, {"draw": ["calc_watch"], "speak": "Watching: 0.02 times 2, plus 0.6 times 9.2, plus 0.38 times 9.5 — about 9.17."}, {"erase": ["calc_watch"]}, {"draw": ["ev_watch"]}, {"highlight": {"target": ["ev_watch", "edge_choice_watch"]}, "speak": "A near tie, tipped slightly toward waiting. Repairing now takes the operation's risk for certain, for everyone; waiting takes it only for those who turn out to need it.", "delivery": "grave"}, {"draw": ["trials_box", "trials_line_1", "trials_line_2"], "speak": "Two large trials, in Britain and among American veterans, found just that: repairing small aneurysms early did not help people live longer."}, {"erase": ["trials"]}, {"draw": ["threshold"], "speak": "How fragile is the verdict? Call the operation's death risk p. Repairing now wins only if p is below about 3.5 percent."}, {"highlight": {"target": ["threshold"], "part": "3.5\\%"}, "speak": "So a very fit patient in a top centre might tip it — though trials of the gentler keyhole repair found no survival gain either."}, {"focus": {"target": ["node_repair", "node_watch", "label_repair", "label_watch", "ev_repair", "ev_watch"]}, "speak": "For a small aneurysm, the choice is not safety against danger. It is a certain risk now against a smaller, uncertain one later."}, {"quiz": {"question": "Her aneurysm grows to 6 cm, and its rupture risk climbs sharply. Which way does the tree tip?", "choices": ["Toward repair", "Toward watching", "It stays a tie"], "correct": 1, "right": "Toward repair: the watch branch's rupture chance jumps, while the operation's risk stays the same — which is why surgery is offered at 5.5 cm."}}, {"erase": ["label_choice"]}, {"fade": {"target": ["threshold"], "to": 0.25}}, {"draw": ["label_6cm"], "speak": "Let's see it happen. The same woman, but her aneurysm is now 6 centimetres."}, {"erase": ["pe_w_rupt", "pe_w_never"], "parallel": true}, {"draw": ["pe6_rupt", "pe6_never"], "parallel": true, "speak": "Waiting now means about one in four bursting before repair, and only 15 in 100 never needing it."}, {"highlight": {"target": ["pe_w_later"]}, "speak": "Growing on and being repaired in time stays at 60 in 100."}, {"morph": {"target": ["ev_watch"], "tex": "EV \\approx 7.45", "duration": 1.5}, "speak": "Fold back again: watching falls to about 7.45, far below repair's unchanged 9.12."}, {"highlight": {"target": ["edge_choice_repair"]}, "speak": "Same operation, same risk — but now the danger of waiting is the bigger gamble, and the tree says repair."}]}
