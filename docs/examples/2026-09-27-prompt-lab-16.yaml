{"title": "3 tax — D* · maskin", "template": "supply_demand", "params": {"x_label": "Tickets sold", "y_label": "Price ($)", "demand": {"curvature": "linear", "elasticity": 1}, "supply": {"curvature": "linear", "elasticity": 1}, "equilibrium": {"show": true, "guides": true}, "tax": {"amount": 10, "side": "seller", "kind": "per_unit"}, "regions": ["government_revenue"], "units": {"price": [0, 100], "quantity": [0, 1000], "price_unit": "$", "quantity_unit": "tickets"}, "readout": []}, "elements": [{"id": "t_fans", "type": "text", "text": "Fans pay ${market.price_buyers}", "x": 760, "y": 470, "font_size": 26, "style": {"color": "#b5482e"}}, {"id": "t_sell", "type": "text", "text": "Sellers keep ${market.price_sellers}", "at": {"ref": "t_fans", "side": "below", "gap": 12}, "font_size": 26, "style": {"color": "#2f6b8f"}}, {"id": "t_before", "type": "text", "text": "before: $55 / $45", "at": {"ref": "t_sell", "side": "below", "gap": 12}, "font_size": 22, "style": {"color": "#8f887c"}}, {"id": "mark_ps", "type": "annotation", "target": ["t_sell"], "kind": "box"}], "details": {"tax_supply_curve": "A per-unit tax of $t collected from sellers shifts supply up by exactly $t: to supply a ticket, a seller now needs the old price plus the tax.", "supply_curve": "With a fixed number of seats, the quantity offered hardly responds to price in the short run: supply is nearly perfectly inelastic, so almost all of a tax falls on sellers."}, "commands": [{"card": {"title": "D* · maskin — Who pays a ticket tax?"}}, {"draw": ["axes"], "speak": "When the government taxes every concert ticket by ten dollars, who really pays it?"}, {"draw": ["demand_curve", "label_D"], "speak": "Start with the ticket market before any tax: fans on one side…"}, {"draw": ["supply_curve", "label_S"], "speak": "…sellers on the other."}, {"draw": ["equilibrium_point", "guide_lines", "label_E", "label_Pstar"], "speak": "They meet at fifty dollars a ticket."}, {"pause": 0.4}, {"draw": ["tax_supply_curve", "label_S_tax"], "speak": "Now the law says the seller must send ten dollars per ticket to the government, so the whole supply curve lifts by ten."}, {"point": {"at": {"data": [50, 60]}, "gesture": "tap"}, "speak": "The seller would love to just add ten dollars to the price."}, {"draw": ["tax_equilibrium_point", "tax_guide_lines"], "speak": "But at sixty dollars some fans stay home, so the price settles in between."}, {"draw": ["price_buyers_point", "label_Pb", "price_sellers_point", "label_Ps", "t_fans", "t_sell"], "speak": "Fans now pay fifty-five, and sellers keep forty-five."}, {"draw": ["wedge_region", "label_wedge"], "speak": "The ten-dollar gap between those two prices is the government's cut, split five and five."}, {"pause": 0.4}, {"draw": ["t_before"], "speak": "That even split came from assuming both sides can back out equally easily."}, {"highlight": {"target": ["supply_curve"]}, "speak": "A concert is different: the hall has the same number of seats tonight, whatever the price."}, {"animate": {"supply.elasticity": 0.06}, "duration": 3.5, "speak": "So the supply curve is about to stand up straight.", "ghost": ["supply_curve", "tax_supply_curve", "price_buyers_point", "price_sellers_point"]}, {"fade": {"target": ["label_S_tax"], "to": 0, "duration": 0.6}}, {"highlight": {"target": ["price_buyers_point", "t_fans"]}, "speak": "Now the fans' price barely moves above fifty."}, {"highlight": {"target": ["price_sellers_point", "t_sell"]}, "speak": "And the sellers' take drops to just over forty: they carry almost the whole tax.", "delivery": "grave"}, {"focus": {"target": ["supply_curve", "tax_supply_curve"]}, "speak": "Empty seats earn nothing, so the promoter cannot refuse the lower price the way a fan can refuse a higher one."}, {"draw": ["mark_ps"], "speak": "Whoever has fewer ways out pays more of the tax, no matter who writes the cheque to the government."}, {"quiz": {"question": "With a fixed number of seats, who bears most of the $10 ticket tax?", "choices": ["The fans, because they buy the tickets", "The sellers, who cannot cut the seats", "It is always split fifty-fifty", "The government, since it collects it"], "correct": 2, "right": "The sellers: with the seats fixed they cannot walk away, so the price fans pay barely rises and the tax comes out of what sellers keep."}}]}
