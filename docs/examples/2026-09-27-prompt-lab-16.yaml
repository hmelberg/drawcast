{"title": "2 thing — A* · maskin", "elements": [{"id": "cabinet", "type": "shape", "shape": "rect", "x": 300, "y": 410, "width": 400, "height": 460}, {"id": "l_inside", "type": "text", "text": "inside: 4 °C", "x": 300, "y": 610, "style": {"color": "#2f6b8f"}}, {"id": "milk", "type": "shape", "shape": "rect", "x": 200, "y": 240, "width": 70, "height": 120}, {"id": "l_milk", "type": "text", "text": "milk", "x": 272, "y": 240}, {"id": "evap", "type": "path", "points": [[500, 545], [140, 545], [140, 505], [460, 505]], "style": {"color": "#2f6b8f", "stroke_width": 4}, "details": "This part is the evaporator. Most home fridges today use isobutane (R600a) as the coolant; at the low pressure inside this pipe it boils far below freezing."}, {"id": "l_evap", "type": "text", "text": "boils at −25 °C", "style": {"color": "#2f6b8f"}, "x": 312, "y": 468}, {"id": "heat_in", "type": "arrow", "from": {"ref": "milk", "anchor": "top"}, "to": {"x": 200, "y": 493}, "style": {"color": "#d0865f", "stroke_width": 3}}, {"id": "l_heat_in", "type": "text", "text": "heat", "style": {"color": "#d0865f"}, "x": 238, "y": 398}, {"id": "p1", "type": "path", "points": [[460, 505], [475, 505], [475, 220], [565, 220]], "style": {"color": "#2f6b8f", "stroke_width": 4}}, {"id": "compressor", "type": "shape", "shape": "circle", "radius": 45, "x": 610, "y": 220, "style": {"color": "#8a5fa8", "fill": "#8a5fa8"}, "details": "The compressor is an electric pump. Squeezing a gas does work on it, and that work shows up as a higher temperature — the same reason a bicycle pump gets warm."}, {"id": "l_comp", "type": "label", "text": "compressor", "attach_to": "compressor", "side": "right", "style": {"color": "#8a5fa8"}}, {"id": "condenser", "type": "path", "points": [[580, 325], [580, 585], [630, 585], [630, 325], [680, 325], [680, 585]], "style": {"color": "#b5482e", "stroke_width": 4}}, {"id": "p2", "type": "arrow", "from": {"ref": "compressor", "anchor": "top"}, "to": {"ref": "condenser", "anchor": "start"}, "style": {"color": "#b5482e", "stroke_width": 4}}, {"id": "l_cond", "type": "label", "text": "hot coils, 45 °C", "attach_to": "condenser", "side": "right", "style": {"color": "#b5482e"}}, {"id": "kitchen", "type": "text", "text": "kitchen: 20 °C", "x": 888, "y": 370}, {"id": "heat_out", "type": "arrow", "from": {"x": 700, "y": 370}, "to": {"x": 790, "y": 370}, "style": {"color": "#d0865f", "stroke_width": 3}}, {"id": "l_heat_out", "type": "label", "text": "heat", "attach_to": "heat_out", "side": "above", "style": {"color": "#d0865f"}}, {"id": "p3", "type": "path", "points": [[680, 585], [680, 615], [602, 615]], "style": {"color": "#b5482e", "stroke_width": 4}}, {"id": "valve", "type": "polygon", "points": [[550, 631], [575, 618], [600, 631], [600, 599], [575, 612], [550, 599]], "style": {"color": "#3d3833", "fill": "#8f887c"}}, {"id": "l_valve", "type": "label", "text": "narrow valve", "attach_to": "valve", "side": "above"}, {"id": "p4", "type": "path", "points": [[548, 615], [525, 615], [525, 545], [500, 545]], "style": {"color": "#2f6b8f", "stroke_width": 4}}, {"id": "low_side", "type": "group", "members": ["p4", "evap", "p1"]}, {"id": "high_side", "type": "group", "members": ["p2", "condenser", "p3"]}], "commands": [{"card": {"title": "A* · maskin — How a fridge keeps cold"}}, {"draw": ["cabinet", "l_inside", "milk", "l_milk"], "speak": "How does a fridge stay cold in a warm kitchen? The surprise: it makes no cold at all — it carries heat out."}, {"draw": ["kitchen"], "speak": "Inside it is 4 degrees, out here 20, and heat always creeps from warm to cold — so warmth leaks in through the walls all day."}, {"draw": ["evap", "l_evap"], "speak": "So a pipe runs round the inside, carrying a coolant that boils at about minus 25 degrees."}, {"draw": ["heat_in", "l_heat_in"], "speak": "Colder than the milk, it soaks up the milk's heat, and that heat makes it boil into gas."}, {"highlight": {"target": ["evap"]}, "speak": "Boiling swallows a lot of heat — the way drying sweat cools your skin. This is where the inside gets cold."}, {"pause": 0.4}, {"draw": ["p1", "compressor", "l_comp"], "speak": "Now the heat is in the gas. A pump, the compressor, sucks that gas out of the cabinet…"}, {"highlight": {"target": ["compressor"], "effect": "pulse", "color": "#8a5fa8"}, "speak": "…and squeezes it hard."}, {"draw": ["p2", "condenser", "l_cond"], "speak": "Squeezed gas heats up: to about 45 degrees, hotter than the kitchen."}, {"draw": ["heat_out", "l_heat_out"], "speak": "So in the coils on the back, heat flows out into the room, and the gas cools back into a liquid."}, {"pause": 0.3}, {"draw": ["p3", "valve", "l_valve", "p4"], "speak": "Last, the liquid squeezes through a narrow valve back into the cabinet. Its pressure drops, and at low pressure it boils at minus 25 again."}, {"flow": {"along": ["p4", "evap", "p1", "p2", "condenser", "p3"]}, "speak": "Round and round it goes: pick heat up inside, carry it out, dump it behind."}, {"highlight": {"target": ["low_side"]}, "speak": "The whole trick is pressure: low where the coolant must be colder than the food,", "delivery": "grave"}, {"highlight": {"target": ["high_side"]}, "speak": "high where it must be hotter than the room.", "delivery": "grave"}, {"highlight": {"target": ["compressor"]}, "speak": "That squeeze is what the electricity pays for: pushing heat uphill, from cold to warm."}, {"point": {"at": {"ref": "heat_out"}, "gesture": "circle"}, "speak": "And it is why the back of a fridge feels warm: that is the heat that was in your food."}, {"quiz": {"intro": "A quick check.", "question": "On a hot day you leave the fridge door open. What happens to the kitchen?", "choices": ["It cools down", "It gets warmer"], "correct": 2, "right": "It gets warmer: the fridge only moves heat from its inside to its back, both in the same room — and its motor adds heat of its own.", "wrong": "Think about where the heat taken from inside ends up."}}]}
