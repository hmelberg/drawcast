{"title": "3 tax — A* · maskin", "template": "supply_demand", "params": {"x_label": "Concert tickets", "y_label": "Ticket price", "demand": {"curvature": "linear", "elasticity": 1}, "supply": {"elasticity": 1}, "equilibrium": {"show": true, "guides": true}, "tax": {"amount": 25}, "units": {"price": [0, 40], "quantity": [0, 20000], "price_unit": "$", "quantity_unit": "tickets"}, "regions": ["government_revenue"], "readout": ["price_buyers", "price_sellers"], "readout_at": "inside"}, "details": {"price_buyers_point": "The share of a tax that buyers carry is roughly $$\\frac{E_s}{E_s + E_d}$$ where $E_s$ and $E_d$ are how strongly supply and demand respond to price. The side that responds less carries more.", "tax_supply_curve": "A per-ticket tax collected from the seller lifts the supply curve by exactly the tax: to be as willing as before, the organiser needs \\$10 more per ticket."}, "elements": [{"id": "tag_short", "type": "text", "text": "one show", "x": 575, "y": 280, "font_size": 24, "style": {"color": "#8a5fa8"}}, {"id": "tag_long", "type": "text", "text": "over the years", "x": 760, "y": 520, "font_size": 24, "style": {"color": "#8a5fa8"}}], "commands": [{"card": {"title": "A* · maskin — Who pays a ticket tax?"}}, {"draw": ["axes"], "speak": "If the government puts a ten-dollar tax on every concert ticket, who ends up paying it: the fans, or the people putting on the show?"}, {"draw": ["demand_curve", "label_D"], "speak": "Fans first: the cheaper the ticket, the more of them come."}, {"pause": 0.3}, {"draw": ["supply_curve", "label_S"], "speak": "Organisers: the higher the price, the more shows they are willing to put on."}, {"draw": ["equilibrium_point", "guide_lines", "label_E", "label_Pstar", "label_Qstar"], "speak": "Without a tax, they meet at twenty dollars a ticket."}, {"pause": 0.4}, {"draw": ["tax_supply_curve", "label_S_tax"], "speak": "Now the law: the organiser must send ten dollars to the state for every ticket sold, so they need ten dollars more per ticket to be as willing as before. Supply lifts by exactly ten."}, {"erase": ["label_Pstar"]}, {"draw": ["tax_equilibrium_point", "tax_guide_lines", "price_buyers_point", "label_Pb", "readout_price_buyers"], "speak": "The market settles again, and fans now pay more — but not ten dollars more."}, {"draw": ["price_sellers_point", "label_Ps", "readout_price_sellers"], "speak": "Because after handing over the tax, the organiser keeps less than the twenty dollars they got before."}, {"point": {"at": {"ref": "tax_equilibrium_point"}, "gesture": "circle"}, "speak": "Why not pass on all ten? Some fans would stay home, and an empty seat earns nothing — so the organiser swallows part of it."}, {"draw": ["wedge_region"], "speak": "This band, ten dollars on every ticket still sold, is what the state collects: part from fans, part from the organiser."}, {"pause": 0.4}, {"point": {"at": {"ref": "supply_curve"}}, "speak": "But one concert is special: the hall has a fixed number of seats, and tonight they exist whatever the price."}, {"hide": ["label_wedge"]}, {"fade": {"target": ["tax_guide_lines", "guide_lines"], "to": 0.3}}, {"animate": {"supply.elasticity": 0.15}, "duration": 3, "speak": "So for a single show, the supply of seats is almost vertical."}, {"draw": ["tag_short"]}, {"highlight": {"target": ["price_sellers_point"], "effect": "circle"}, "speak": "Now fans pay barely more than before, and the organiser absorbs nearly all ten dollars: a cheaper seat still beats an empty one."}, {"highlight": {"target": ["supply_curve"]}, "speak": "Over the years, though, organisers can respond: fewer tour dates, smaller venues, cities skipped."}, {"animate": {"supply.elasticity": 1.6}, "duration": 3, "ghost": ["supply_curve"], "speak": "Then supply turns flat, and the tax slides onto the fans: ticket prices climb by the larger share of the ten dollars."}, {"draw": ["tag_long"]}, {"focus": {"target": ["tax_supply_curve", "demand_curve", "price_buyers_point", "price_sellers_point"]}, "speak": "So who pays is not written in the tax law. The tax lands on whichever side finds it harder to walk away — tonight the organiser, in the long run more and more the fans.", "delivery": "grave"}, {"quiz": {"question": "A one-off stadium show has a fixed number of seats. Who carries most of a ticket tax on it?", "choices": ["The fans", "The organiser", "Always half each"], "correct": 2, "right": "The organiser: the seats exist whatever the price, so raising it would only leave them empty, and the organiser has to absorb the tax instead.", "wrong": "Think about which side cannot walk away tonight."}}]}
