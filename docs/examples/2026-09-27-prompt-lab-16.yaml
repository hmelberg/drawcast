{"title": "1 econ — A* · maskin", "vars": {"m": 1, "v": 5, "s": 5, "y": 5, "p": 1}, "elements": [{"id": "money", "type": "node", "shape": "rect", "text": "Money: ${m:0},000", "style": {"color": "#b5482e"}, "width": 360, "height": 110, "font_size": 30}, {"id": "turns", "type": "node", "shape": "rect", "text": "Each dollar spent {v}× a year", "style": {"color": "#d0865f"}, "width": 360, "height": 110, "font_size": 30}, {"id": "spend", "type": "node", "shape": "rect", "text": "Spending: ${s:0},000 a year", "style": {"color": "#b5482e"}, "width": 360, "height": 110, "font_size": 30}, {"id": "spend_side", "type": "group", "members": ["money", "turns", "spend"], "layout": "column", "gap": 24}, {"id": "loaves", "type": "node", "shape": "rect", "text": "Loaves: {y:0},000 a year", "style": {"color": "#2f6b8f"}, "width": 360, "height": 110, "font_size": 30}, {"id": "price", "type": "node", "shape": "rect", "text": "Price: ${p:2} a loaf", "style": {"color": "#8a5fa8"}, "width": 360, "height": 110, "font_size": 30}, {"id": "goods_side", "type": "group", "members": ["loaves", "price"], "layout": "column", "gap": 24}, {"id": "market", "type": "group", "members": ["spend_side", "goods_side"], "layout": "row", "gap": 160, "fit": {"x": 60, "y": 160, "w": 880, "h": 390}, "align": "center"}, {"id": "spend_arrow", "type": "arrow", "from": {"ref": "spend", "anchor": "right"}, "to": {"ref": "goods_side", "anchor": "left"}}, {"id": "spend_arrow_label", "type": "label", "text": "chases", "attach_to": "spend_arrow", "side": "above"}, {"id": "eq", "type": "math", "tex": "M \\times V", "colors": {"M": "#b5482e", "V": "#d0865f"}, "details": "The equation of exchange: $M$ is the stock of money, $V$ its velocity (how many times a year each dollar is spent), $P$ the price level and $Y$ real output. It is true by definition — total spending equals the value of what is bought. It becomes a theory of inflation only with the claims that $V$ is fairly stable and $Y$ is set by capacity, so that $\\%\\Delta P \\approx \\%\\Delta M$.", "size": 34, "at": {"ref": "spend_side", "side": "above", "gap": 24}}, {"id": "tag_1", "type": "text", "text": "Printing, same loaves", "font_size": 26, "at": {"ref": "goods_side", "side": "below", "gap": 20}, "style": {"color": "#3d3833"}}, {"id": "tag_2", "type": "text", "text": "Escape 1: idle ovens", "font_size": 26, "at": {"ref": "goods_side", "side": "below", "gap": 20}, "style": {"color": "#3d3833"}}, {"id": "tag_3", "type": "text", "text": "Escape 2: money hoarded", "font_size": 26, "at": {"ref": "goods_side", "side": "below", "gap": 20}, "style": {"color": "#3d3833"}}, {"id": "cases", "type": "group", "members": ["tag_1", "tag_2", "tag_3"], "walk": "replace"}, {"id": "eq_eq", "type": "math", "tex": "=", "size": 34, "at": {"ref": "market", "side": "above", "gap": 24}}, {"id": "eq_r", "type": "math", "tex": "P \\times Y", "size": 34, "at": {"ref": "goods_side", "side": "above", "gap": 24}, "colors": {"P": "#8a5fa8", "Y": "#2f6b8f"}}, {"id": "eq_box", "type": "annotation", "target": ["eq", "eq_eq", "eq_r"], "kind": "box"}], "commands": [{"card": {"title": "A* · maskin — When printing money raises prices"}}, {"draw": ["money"], "speak": "Why does printing money make prices rise — and why, sometimes, does it not? Picture an island with a thousand dollars on it."}, {"draw": ["turns"], "speak": "Each dollar changes hands about five times a year…"}, {"draw": ["spend"], "speak": "…so the island spends five thousand dollars a year."}, {"draw": ["loaves"], "speak": "And all it makes is bread: five thousand loaves a year."}, {"draw": ["spend_arrow", "spend_arrow_label"], "speak": "All that spending chases all those loaves…"}, {"draw": ["price"], "speak": "…so a loaf costs one dollar: five thousand dollars over five thousand loaves."}, {"draw": ["eq", "eq_eq", "eq_r"], "speak": "Economists write it as money times turns equals price times goods."}, {"pause": 0.4}, {"draw": ["tag_1"], "speak": "Now the island's bank prints a second thousand dollars and hands it out."}, {"speak": "Twice the money, spent just as often, meets the same loaves: the price doubles, to two dollars.", "blocking": false}, {"highlight": {"target": ["price"], "effect": "pulse"}}, {"animate": {"m": 2, "s": 10, "p": 2}, "duration": 3}, {"highlight": {"target": ["price"]}, "speak": "No loaf got better or scarcer. Each dollar simply buys half as much: that is inflation."}, {"draw": ["tag_2"]}, {"animate": {"m": 1, "s": 5, "p": 1}, "duration": 1.5, "speak": "But we held the loaves fixed. Rewind, and let half the island's ovens stand cold."}, {"speak": "Now the new dollars send idle bakers back to work: the loaves double, and the price stays at a dollar.", "blocking": false}, {"highlight": {"target": ["loaves"], "effect": "pulse"}}, {"animate": {"m": 2, "s": 10, "y": 10}, "duration": 3}, {"point": {"at": {"ref": "loaves"}, "gesture": "circle"}, "speak": "That works only while there are cold ovens. Once every baker is busy, extra money has nowhere to go but into the price."}, {"draw": ["tag_3"]}, {"animate": {"m": 1, "s": 5, "y": 5}, "duration": 1.5, "speak": "The second escape: rewind again, and let people keep the new money under the mattress."}, {"animate": {"m": 2, "v": 2.5}, "duration": 3, "speak": "Money doubles, but each dollar changes hands half as often: spending stays at five thousand, and so does the price."}, {"highlight": {"target": ["turns"]}, "speak": "After 2008 the US Federal Reserve grew its balance sheet about fivefold, yet inflation stayed low for years: banks sat on most of the new money."}, {"draw": ["eq_box"], "speak": "So new money raises prices when people spend it and there are no more goods to buy — which is why printing a lot, for long enough, ends in higher prices."}, {"quiz": {"question": "An economy with every worker busy doubles its money, and people spend it as usual. What happens?", "choices": ["Output doubles", "Prices roughly double", "Nothing changes"], "correct": 2, "right": "Prices roughly double: with no idle capacity output cannot rise, so the extra spending lands on the price.", "wrong": "Ask what can still grow when every oven is already busy."}}]}
