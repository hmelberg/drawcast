{"title": "3 tax — A* · API", "template": "supply_demand", "params": {"x_label": "Concert tickets", "y_label": "Ticket price", "demand": {"curvature": "linear", "elasticity": 1}, "supply": {"elasticity": 1}, "equilibrium": {"show": true, "guides": true}, "tax": {"amount": 20}, "regions": ["government_revenue"]}, "commands": [{"card": {"title": "A* · API — Who pays a ticket tax?"}}, {"hide": ["label_wedge"]}, {"draw": ["axes"], "speak": "If the government puts a ten-dollar tax on every concert ticket, who ends up paying it? The law names the organiser, but that settles less than you might think."}, {"draw": ["demand_curve", "label_D"], "speak": "Fans first: the cheaper the ticket, the more tickets they buy."}, {"pause": 0.3}, {"draw": ["supply_curve", "label_S"], "speak": "Organisers: the higher the price, the more shows they put on."}, {"draw": ["equilibrium_point", "guide_lines", "label_E", "label_Pstar", "label_Qstar"], "speak": "Without the tax, the two meet at twenty-five dollars a ticket."}, {"pause": 0.4}, {"draw": ["tax_supply_curve", "label_S_tax", "ten_arrow", "ten_lab"], "speak": "Now the tax, collected from organisers. Each ticket costs them ten dollars more to sell, so the whole supply curve lifts by exactly ten."}, {"draw": ["tax_equilibrium_point", "tax_guide_lines"], "speak": "The market finds a new crossing, but the ticket price has not jumped by ten dollars."}, {"draw": ["price_buyers_point", "label_Pb", "card_base_box", "card_base_line_1"], "speak": "Fans now pay about thirty dollars: roughly five more than before."}, {"draw": ["price_sellers_point", "label_Ps", "card_base_line_2"], "speak": "And after handing ten to the state, organisers keep about twenty: roughly five less."}, {"move": {"target": ["ten_arrow"], "anchor": "tail", "to": {"x": 330, "y": 330}, "duration": 1.2}}, {"draw": ["wedge_region", "rev_lab"], "speak": "The band between those two prices, on every ticket still sold, is the government's revenue. Here each side pays about half of it."}, {"draw": ["q_tax", "drop_arrow", "drop_lab"], "cue": 0.15, "speak": "Why a split? Pass on all ten, and some fans stay home. Swallow all ten, and some shows stop paying. The price settles in between."}, {"highlight": {"target": ["demand_curve", "label_D"]}, "speak": "So what decides the split? Change the kind of fan, and watch."}, {"erase": ["card_base", "q_tax", "drop_arrow", "drop_lab", "rev_lab", "ten_arrow", "ten_lab"], "parallel": true, "speak": "Say the ticket is for a star everyone must see, and fans will come at almost any price."}, {"animate": {"demand.elasticity": 0.3}, "duration": 3, "speak": "Their demand turns steep."}, {"draw": ["card_steep"], "speak": "Now fans carry most of the ten dollars. Organisers can pass it on, because these buyers are not leaving."}, {"highlight": {"target": ["demand_curve", "label_D"]}, "speak": "Now the opposite: a local band on a Saturday, with plenty else to do in town."}, {"erase": ["card_steep"], "parallel": true, "speak": "These fans walk away at the first price rise,"}, {"animate": {"demand.elasticity": 1.7}, "duration": 3.5, "speak": "so demand turns flat."}, {"draw": ["card_flat"], "speak": "Now organisers swallow most of the tax. Raising the price would only empty the hall."}, {"focus": {"target": ["demand_curve", "tax_supply_curve", "wedge_region"]}, "speak": "So a tax lands hardest on whichever side finds it harder to walk away, not on whoever the law tells to pay.", "delivery": "grave"}, {"erase": ["card_flat"], "parallel": true}, {"animate": {"demand.elasticity": 1}, "duration": 2.5, "speak": "Back to ordinary fans, and the even split."}, {"draw": ["q_tax"]}, {"draw": ["dtax", "label_dtax"], "speak": "Collect the same ten dollars from fans at the door instead: the demand organisers face drops by ten."}, {"highlight": {"target": ["wedge_region", "q_tax"], "effect": "pulse", "color": "#8a5fa8"}, "speak": "It meets supply at the same quantity, so nothing changes: the same two prices, the same split."}, {"fade": {"target": ["tax_supply_curve", "label_S_tax"], "to": 0.25}}, {"fade": {"target": ["wedge_region", "q_tax", "dtax", "label_dtax", "tax_guide_lines", "tax_equilibrium_point", "price_buyers_point", "price_sellers_point", "label_Pb", "label_Ps", "tax_supply_curve", "label_S_tax"], "to": 0.15}}, {"quiz": {"question": "A tax on insulin is collected from pharmacies. Who bears most of it?", "choices": ["The pharmacies", "The patients", "Split evenly, always"], "correct": 2, "right": "The patients: they need insulin whatever it costs, so they cannot walk away, and the pharmacies pass the tax on to them."}}], "elements": [{"id": "card_base", "type": "scratch", "work": ["Fans: $30 (+$5)", "Organisers: $20 (−$5)"], "font_size": 22, "x": 760, "y": 150}, {"id": "card_steep", "type": "scratch", "work": ["Fans: $33 (+$8)", "Organisers: $23 (−$2)"], "font_size": 22, "x": 780, "y": 155}, {"id": "card_flat", "type": "scratch", "work": ["Fans: $27 (+$2)", "Organisers: $17 (−$8)"], "font_size": 22, "x": 770, "y": 150}, {"id": "rev_lab", "type": "text", "text": "Tax revenue", "font_size": 22, "x": 170, "y": 460}, {"id": "q_tax", "type": "math", "tex": "Q_{\\text{tax}}", "x": 420, "y": 95, "size": 30}, {"id": "drop_arrow", "type": "arrow", "from": {"x": 500, "y": 115}, "to": {"x": 420, "y": 115}, "style": {"color": "#b5482e", "stroke_width": 4}}, {"id": "dtax", "type": "path", "points": [[130, 560], [700, 110]], "style": {"color": "#d0865f", "dash": true}}, {"id": "label_dtax", "type": "text", "text": "D − tax", "style": {"color": "#d0865f"}, "x": 710, "y": 118, "font_size": 24}, {"id": "drop_lab", "type": "label", "text": "fewer tickets", "attach_to": "drop_arrow", "side": "left", "style": {"color": "#b5482e"}}, {"id": "ten_arrow", "type": "arrow", "from": {"x": 620, "y": 300}, "to": {"x": 620, "y": 400}, "style": {"color": "#8a5fa8", "stroke_width": 3}}, {"id": "ten_lab", "type": "label", "text": "+$10", "attach_to": "ten_arrow", "side": "left", "style": {"color": "#8a5fa8"}}]}
