{"title": "3 tax — D* · API", "template": "supply_demand", "params": {"x_label": "Tickets sold", "y_label": "Ticket price", "demand": {"elasticity": 1}, "supply": {"elasticity": 1}, "equilibrium": {"show": true, "guides": true}, "tax": {"amount": 12.5, "side": "seller", "kind": "per_unit"}, "regions": ["government_revenue"], "units": {"price": [0, 80], "quantity": [0, 2000], "price_unit": "$", "quantity_unit": "tickets"}, "readout": ["price_buyers", "price_sellers"], "readout_at": "top"}, "elements": [{"id": "verdict", "type": "annotation", "target": ["wedge_region", "label_Ps"], "kind": "box"}], "commands": [{"card": {"title": "D* · API — Who pays a ticket tax?"}}, {"draw": ["axes"], "speak": "A ten-dollar tax on every concert ticket: who actually ends up paying it?"}, {"draw": ["demand_curve", "label_D"], "speak": "Start with the fans, who buy fewer tickets the higher the price."}, {"pause": 0.3}, {"draw": ["supply_curve", "label_S"], "speak": "Then the venues, who offer more shows and seats when prices are high."}, {"pause": 0.3}, {"draw": ["equilibrium_point", "guide_lines", "label_Pstar"], "speak": "With no tax, the two meet at forty dollars a ticket."}, {"pause": 0.4}, {"draw": ["tax_supply_curve", "label_S_tax"], "speak": "Now the law makes the venue hand ten dollars per ticket to the government, which lifts its curve by ten."}, {"speak": "The venue would love to pass all of it on, but at fifty dollars some fans stay home.", "blocking": false}, {"point": {"at": {"ref": "equilibrium_point"}, "gesture": "tap", "duration": 1.5}}, {"point": {"at": {"ref": "tax_equilibrium_point"}, "gesture": "circle", "duration": 2.5}}, {"draw": ["tax_equilibrium_point", "tax_guide_lines", "price_buyers_point", "label_Pb", "price_sellers_point", "label_Ps"], "speak": "So the market settles in between:"}, {"draw": ["readout"], "speak": "fans pay about forty-five, the venue keeps about thirty-five."}, {"pause": 0.4}, {"draw": ["wedge_region", "label_wedge"], "speak": "The ten dollars is the gap between those two prices,"}, {"highlight": {"target": ["wedge_region"]}, "speak": "split roughly in half."}, {"highlight": {"target": ["label_Pb", "label_Ps"]}, "speak": "Charging the fans at the door instead would give exactly the same two prices."}, {"focus": {"target": ["demand_curve", "supply_curve"]}, "speak": "What decides the split is which side can more easily walk away."}, {"highlight": {"target": ["supply_curve"], "effect": "circle"}, "speak": "A concert hall can't: tonight it has a fixed number of seats, whatever the price, so its supply curve is about to turn nearly vertical."}, {"animate": {"supply.elasticity": 0.06}, "duration": 4, "speak": "Watch the two prices as it turns."}, {"pause": 0.4}, {"highlight": {"target": ["readout_price_buyers"]}, "speak": "The fans' price slides back toward forty,"}, {"highlight": {"target": ["readout_price_sellers"]}, "speak": "and the venue's sinks toward thirty."}, {"highlight": {"target": ["price_sellers_point", "wedge_region"]}, "speak": "An empty seat earns nothing, so the venue swallows almost the whole tax to keep the hall full.", "delivery": "grave"}, {"draw": ["verdict"], "speak": "A tax falls on whoever has fewer ways out, and here that's the one with seats to fill tonight."}, {"pause": 0.5}, {"quiz": {"question": "With a fixed number of seats, how much more does a fan pay for a ticket after the $10 tax?", "choices": ["The full $10 more", "About $5 more", "Almost nothing more", "About $20 more"], "correct": 3, "right": "Almost nothing more: the hall can't offer fewer seats tonight, so the venue absorbs nearly all of the $10 to keep them filled.", "wrong": "Think about which side can't walk away when the seats are fixed."}}]}
