{"title": "1 econ — A* · API", "domain": {"x": [0, 100], "y": [0, 100], "box": {"x": 70, "y": 120, "w": 620, "h": 520}}, "vars": {"s": 0}, "elements": [{"id": "ax", "type": "axes", "x_label": "Goods produced (real output)", "y_label": "Price level", "cross": "corner"}, {"id": "as", "type": "curve", "expr": "15 + 300/(92 - x)", "x_from": 0, "x_to": 88, "style": {"color": "#2f6b8f"}, "details": "A short-run aggregate supply curve with spare capacity: nearly flat while resources sit idle, nearly vertical as output nears its potential."}, {"id": "as_label", "type": "label", "text": "Supply", "attach_to": "as", "side": "left", "style": {"color": "#2f6b8f"}}, {"id": "slack_txt", "type": "text", "text": "idle workers, empty machines", "x": 230, "y": 220, "font_size": 20, "style": {"color": "#2f6b8f"}}, {"id": "cap", "type": "line", "through": [[92, 0]], "angle": 90, "style": {"color": "#8f887c", "dash": true}}, {"id": "cap_label", "type": "label", "text": "full capacity", "attach_to": "cap", "side": "left", "style": {"color": "#8f887c"}}, {"id": "ad", "type": "curve", "expr": "60 + s - 0.9*x", "x_from": 0, "x_to": 100, "style": {"color": "#b5482e"}}, {"id": "ad_label", "type": "label", "text": "Demand (spending)", "attach_to": "ad", "side": "above-right", "style": {"color": "#b5482e"}}, {"id": "eq", "type": "point", "at": {"intersection_of": ["ad", "as"]}, "guides": true, "style": {"color": "#8a5fa8"}}, {"id": "eqn", "type": "math", "tex": "M \\cdot V = P \\cdot Y", "x": 840, "y": 470, "colors": {"M": "#b5482e", "V": "#8a5fa8"}, "details": "The quantity equation. $M$ is the money supply, $V$ its velocity (how many times a year each dollar is spent), $P$ the price level and $Y$ real output. It is an identity; the economics lies in which terms move when $M$ changes."}, {"id": "eqn_label", "type": "label", "text": "money × times spent = prices × goods", "attach_to": "eqn", "side": "below", "font_size": 20}], "commands": [{"card": {"title": "A* · API — Does printing money cause inflation?"}}, {"draw": ["ax"], "speak": "When a central bank prints money, do prices have to rise? Here is a whole economy: everything it produces, against the level of prices."}, {"draw": ["as", "as_label", "slack_txt"], "speak": "Supply is what firms can make. With idle workers and empty machines, they can make much more at almost the same price."}, {"draw": ["cap", "cap_label"], "speak": "But there is a limit. Once everyone who wants a job has one, output can hardly grow, and the curve turns almost vertical."}, {"pause": 0.3}, {"draw": ["ad", "ad_label"], "speak": "Demand is all the spending in the economy: the lower prices are, the more that spending buys."}, {"draw": ["eq"], "speak": "Start in a slump, here, with plenty of factories standing idle."}, {"point": {"at": {"ref": "ad_label"}}, "speak": "Now the bank prints money. Loans get cheaper, and people and firms spend more at every price level."}, {"animate": {"s": 25}, "duration": 3, "ghost": ["ad"], "speak": "So the demand curve slides right. Output jumps, and prices barely move."}, {"highlight": {"target": ["slack_txt"]}, "speak": "Idle firms meet the extra orders by hiring and running machines longer. They have no need to raise prices."}, {"point": {"at": {"ref": "cap"}, "gesture": "underline"}, "speak": "Now keep printing: two more pushes of exactly the same size, toward the limit."}, {"animate": {"s": 75}, "duration": 4, "trail": {"of": "eq"}, "speak": "Each push adds less output and more to prices, until almost all of it is price."}, {"highlight": {"target": ["eq"]}, "speak": "At capacity, more money meets the same goods. Firms cannot make more, so they raise prices, and bid up the wages of scarce workers. That is inflation."}, {"draw": ["eqn", "eqn_label"], "speak": "The same story as bookkeeping: money, times how often each dollar is spent, equals prices times goods."}, {"highlight": {"target": ["eqn"], "part": "V"}, "speak": "And here is the second escape. If the new money is not spent, how often dollars change hands falls, and neither prices nor output need to move."}, {"highlight": {"target": ["eqn"], "part": "M"}, "speak": "After 2008 the Federal Reserve made its balance sheet about five times larger. Much of the money sat in banks as reserves, and inflation stayed mostly below its two percent target for years."}, {"point": {"at": {"ref": "eq"}, "gesture": "circle"}, "speak": "So printing money causes inflation when it gets spent in an economy that cannot make more. With idle factories, or money nobody spends, it mostly does not."}, {"quiz": {"question": "A country at full employment doubles its money, and people spend it. What mostly rises?", "choices": ["Output", "Prices", "Neither"], "correct": 2, "right": "Prices: at capacity firms cannot produce more, so the extra spending bids up prices and wages instead."}}]}
