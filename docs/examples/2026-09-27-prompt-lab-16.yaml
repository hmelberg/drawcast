{"title": "4 decision — A* · maskin", "template": "decision_tree", "params": {"box": {"x": 30, "y": 250, "w": 940, "h": 400}, "root": {"id": "choice", "type": "decision", "label": "4.5 cm aneurysm", "children": [{"label": "", "node": {"id": "now", "type": "chance", "label": "Operate now", "value": "12.6 years", "children": [{"label": "Survives", "probability": 0.97, "node": {"id": "now_ok", "type": "terminal", "label": "Repaired", "payoff": 13}}, {"label": "Dies", "probability": 0.03, "node": {"id": "now_death", "type": "terminal", "label": "Died", "payoff": 0}}]}}, {"label": "", "node": {"id": "wait", "type": "chance", "label": "Watch and wait", "value": "12.6 years", "children": [{"label": "Stable", "probability": 0.45, "node": {"id": "small", "type": "terminal", "label": "Never operated", "payoff": 13}}, {"label": "Grows", "probability": 0.53, "node": {"id": "later", "type": "terminal", "label": "Repaired later", "payoff": 12.6}}, {"label": "Bursts", "probability": 0.02, "node": {"id": "rupture", "type": "terminal", "label": "Rupture", "payoff": 4}}]}}]}}, "sources": [{"id": "uksat", "title": "Mortality results for randomised controlled trial of early elective surgery or ultrasonographic surveillance for small abdominal aortic aneurysms", "authors": "UK Small Aneurysm Trial Participants", "year": 1998, "finding": "Early repair of 4–5.5 cm aneurysms: no survival gain"}, {"id": "adam", "title": "Immediate repair compared with surveillance of small abdominal aortic aneurysms", "authors": "Lederle et al.", "year": 2002, "finding": "Immediate repair did not improve survival"}], "elements": [{"id": "ev", "type": "scratch", "work": ["Chance × years, summed", "Now: 0.97 × 13 ≈ 12.6", "Wait: 0.45×13 + 0.53×12.6 + 0.02×4 ≈ 12.6"], "x": 215, "y": 265, "font_size": 20, "cites": ["uksat", "adam"]}], "commands": [{"card": {"title": "A* · maskin — Operate now, or wait?"}}, {"draw": ["node_choice", "label_choice"], "speak": "A 70-year-old has a small bulge in the main artery of the belly: an aortic aneurysm, four and a half centimetres wide. Fix it now, or watch it? A decision tree lays out both paths and weighs them."}, {"draw": ["edge_choice_now", "node_now", "label_now"], "speak": "The square is the choice we make. Operate now, and we reach a circle: from here on, chance decides."}, {"draw": ["edge_now_now_ok", "branchlabel_now_now_ok", "node_now_ok", "label_now_ok", "payoff_now_ok"], "speak": "Ninety-seven times in a hundred the repair goes well, and about thirteen more years of life lie ahead — a typical 70-year-old's."}, {"draw": ["edge_now_now_death", "branchlabel_now_now_death", "node_now_death", "label_now_death", "payoff_now_death"], "speak": "But three in a hundred die of the operation itself. That risk is paid today, by everyone who is operated on.", "delivery": "grave"}, {"pause": 0.4}, {"draw": ["edge_choice_wait", "node_wait", "label_wait"], "speak": "Waiting means an ultrasound scan every six to twelve months, and surgery only if the bulge grows."}, {"draw": ["edge_wait_small", "branchlabel_wait_small", "node_small", "label_small", "payoff_small"], "speak": "About forty-five in a hundred never need the operation: the aneurysm grows slowly, and life ends of something else first."}, {"draw": ["edge_wait_later", "branchlabel_wait_later", "node_later", "label_later", "payoff_later"], "speak": "Most of the rest reach five and a half centimetres and are repaired then — the same operation, a few years later."}, {"draw": ["edge_wait_rupture", "branchlabel_wait_rupture", "node_rupture", "label_rupture", "payoff_rupture"], "speak": "And about two in a hundred burst before the scan catches them. Most of those die."}, {"highlight": {"target": ["payoff_now_death", "payoff_rupture"]}, "speak": "So the trade is a risk paid for certain today, against one that may never come — and if it does, comes later."}, {"draw": ["ev_box", "ev_line_1"], "speak": "To compare the paths, fold the tree back: weigh each ending by its chance."}, {"draw": ["ev_line_2", "value_now"], "speak": "Operate now: 0.97 times thirteen, about 12.6 expected years."}, {"draw": ["ev_line_3", "value_wait"], "speak": "Wait: 0.45 times thirteen, plus 0.53 times 12.6, plus 0.02 times four — also about 12.6."}, {"highlight": {"target": ["value_now", "value_wait"]}, "speak": "A dead heat. The early deaths from operating cancel the ruptures it prevents.", "delivery": "grave"}, {"erase": ["ev"], "speak": "These numbers are illustrative, but two large trials, one British and one American, found the same: repairing small aneurysms early saved no lives."}, {"highlight": {"target": ["node_small", "label_small", "payoff_small"]}, "speak": "And waiting holds a bonus the averages hide: nearly half the patients are never operated on at all."}, {"point": {"at": {"ref": "branchlabel_wait_rupture"}, "gesture": "circle"}, "speak": "The tie breaks on size. Past five and a half centimetres the yearly chance of bursting climbs steeply, this branch grows, and operating wins — which is where surgeons draw the line."}, {"highlight": {"target": ["node_now_death", "label_now_death"]}, "speak": "It also breaks on the patient: a weak heart or weak lungs raise the operation's risk, and tip the tree further toward waiting."}, {"highlight": {"target": ["node_wait", "label_wait"]}, "speak": "So for a small aneurysm, watching is not doing nothing. It is choosing to take the operation's risk only once the aneurysm has earned it."}, {"quiz": {"question": "The scans show the aneurysm has grown to six centimetres. Which way does the tree tip now?", "choices": ["Operate", "Keep watching", "Still a tie"], "correct": 1, "right": "Operate: at six centimetres a rupture is far more likely each year, so waiting now costs more than the operation risks."}}]}
