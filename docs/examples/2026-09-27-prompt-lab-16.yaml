{"title": "1 econ — D* · maskin", "vars": {"m": 100, "v": 4, "s": 400, "p": 2, "goods": 200, "r": 400}, "elements": [{"id": "spend", "type": "shape", "shape": "rect", "x": 275, "y": 300, "width": 150, "height": 200, "bind": {"width": "1.5*m", "height": "50*v", "x": "200 + 0.75*m", "y": "200 + 25*v"}, "style": {"color": "#2f6b8f", "fill": "#d6e4ee"}, "details": "Total spending in a year is the money stock times how often each coin is spent: $M \\times V$. Here the rectangle's width is the money and its height the times each coin changes hands, so its area is the spending."}, {"id": "lab_m", "type": "text", "text": "money {m:0}", "style": {"color": "#2f6b8f"}, "x": 275, "y": 172, "bind": {"x": "200 + 0.75*m"}}, {"id": "lab_v", "type": "text", "text": "times spent {v:0}", "style": {"color": "#2f6b8f"}, "x": 95, "y": 300, "bind": {"y": "200 + 25*v"}}, {"id": "area_s", "type": "text", "text": "{s:0}", "x": 305, "y": 370, "font_size": 34, "bind": {"x": "200 + 1.5*m - 45", "y": "200 + 50*v - 30"}, "style": {"color": "#2f6b8f"}}, {"id": "eqsign", "type": "text", "text": "=", "x": 540, "y": 300, "font_size": 48}, {"id": "goods_rect", "type": "shape", "shape": "rect", "x": 655, "y": 300, "width": 150, "height": 200, "bind": {"width": "0.75*goods", "height": "100*p", "x": "580 + 0.375*goods", "y": "200 + 50*p"}, "style": {"color": "#b5482e", "fill": "#f3dcd4"}, "details": "What the sellers receive is the loaves sold times the price of each: $P \\times Y$. Width is the loaves, height the price, area the same spending seen from the other side."}, {"id": "lab_q", "type": "text", "text": "loaves {goods:0}", "style": {"color": "#b5482e"}, "x": 655, "y": 172, "bind": {"x": "580 + 0.375*goods"}}, {"id": "lab_p", "type": "text", "text": "price {p:0}", "style": {"color": "#b5482e"}, "x": 790, "y": 300, "bind": {"x": "640 + 0.75*goods", "y": "200 + 50*p"}}, {"id": "area_r", "type": "text", "text": "{r:0}", "x": 685, "y": 370, "font_size": 34, "bind": {"x": "580 + 0.75*goods - 45", "y": "200 + 100*p - 30"}, "style": {"color": "#b5482e"}}, {"id": "eq", "type": "math", "tex": "M \\times V", "x": 275, "y": 640, "colors": {"M": "#2f6b8f", "V": "#2f6b8f", "P": "#b5482e", "Y": "#b5482e"}, "details": "The quantity equation. As written it is an identity: spending equals receipts. It becomes a theory of inflation only with two extra assumptions — that V is stable and that Y is fixed by what the economy can produce. Drop either, and more M need not mean higher P.", "size": 56}, {"id": "box_eq", "type": "annotation", "target": ["eq", "eq_mid", "eq_r"], "kind": "box"}, {"id": "eq_mid", "type": "math", "tex": "=", "x": 540, "y": 640, "size": 56}, {"id": "eq_r", "type": "math", "tex": "P \\times Y", "x": 655, "y": 640, "size": 56, "colors": {"P": "#b5482e", "Y": "#b5482e"}}, {"id": "spend0", "type": "shape", "shape": "rect", "x": 275, "y": 300, "width": 150, "height": 200, "style": {"color": "#8f887c", "dash": true, "opacity": 0.5, "stroke_width": 1.5, "roughness": 0}}, {"id": "goods0", "type": "shape", "shape": "rect", "x": 655, "y": 300, "width": 150, "height": 200, "style": {"color": "#8f887c", "dash": true, "opacity": 0.5, "stroke_width": 1.5, "roughness": 0}}], "commands": [{"card": {"title": "D* · maskin — Money and prices"}}, {"draw": ["spend"], "speak": "Why does printing money make prices rise — and why sometimes doesn't it?"}, {"draw": ["lab_m", "lab_v", "area_s"], "speak": "Start with a tiny island that has 100 coins, and each coin changes hands 4 times a year."}, {"draw": ["goods_rect", "eqsign", "lab_q", "lab_p", "area_r"], "speak": "That is 400 coins of spending a year, and it all goes on bread: 200 loaves at 2 coins each."}, {"pause": 0.3}, {"draw": ["eq", "eq_mid", "eq_r"], "speak": "Whatever is spent is exactly what the sellers receive, so the two areas are always the same."}, {"highlight": {"target": ["spend", "goods_rect"], "duration": 1.2}}, {"show": ["spend0", "goods0"]}, {"speak": "Now the island's ruler doubles the coins, and we will stretch the left rectangle to match.", "blocking": false}, {"highlight": {"target": ["eq"], "part": "M", "duration": 1}}, {"point": {"at": {"ref": "spend0"}, "gesture": "circle", "duration": 1}}, {"animate": {"m": 200, "s": 800}, "duration": 3}, {"focus": {"target": ["goods_rect", "lab_q", "lab_p", "area_r"]}, "speak": "Eight hundred coins of spending now chase the bread."}, {"speak": "If the bakers are already working flat out, there are still only 200 loaves, so the price has to give.", "blocking": false}, {"highlight": {"target": ["eq_r"], "part": "P", "duration": 1}}, {"highlight": {"target": ["lab_p"], "duration": 0.8}}, {"animate": {"p": 4, "r": 800}, "duration": 3}, {"highlight": {"target": ["lab_p"], "effect": "circle"}, "speak": "Same bread, twice the price: that is inflation.", "delivery": "grave"}, {"pause": 0.5}, {"animate": {"p": 2, "r": 400}, "duration": 1.5, "speak": "Rewind, and this time let the island have idle ovens and bakers looking for work."}, {"speak": "The extra coins hire them, so the rectangle grows sideways instead of up.", "blocking": false}, {"highlight": {"target": ["eq_r"], "part": "Y", "duration": 1}}, {"animate": {"goods": 400, "r": 800}, "duration": 3}, {"pause": 0.5}, {"animate": {"goods": 200, "r": 400, "m": 100, "s": 400}, "duration": 1.5, "speak": "Rewind once more."}, {"animate": {"m": 200, "s": 800}, "duration": 2.5, "speak": "What if people simply keep the new coins in a jar?"}, {"speak": "Each coin now changes hands only twice, so spending stays at 400, and neither bread nor prices budge.", "blocking": false}, {"highlight": {"target": ["eq"], "part": "V", "duration": 1.5}}, {"animate": {"v": 2, "s": 400}, "duration": 3}, {"point": {"at": {"ref": "lab_v"}, "gesture": "tap"}, "speak": "That is roughly what happened after 2008, when the US Federal Reserve about quadrupled its base money, but banks mostly sat on it as reserves and inflation stayed near 2 percent."}, {"highlight": {"target": ["eq_r"], "effect": "underline", "duration": 1.2}}, {"draw": ["box_eq"], "speak": "So printing money raises prices only when the new money is spent into an economy that cannot make more."}, {"quiz": {"question": "The island doubles its coins, the bakers are already at full capacity, but everyone now spends each coin half as often. What happens to the price of bread?", "choices": ["It doubles", "It halves", "It stays the same", "It quadruples"], "correct": 3, "right": "It stays the same: twice the coins, each spent half as often, is the same spending, so the same bread sells at the same price.", "wrong": "Multiply the two changes on the left side before looking at the price."}}]}
