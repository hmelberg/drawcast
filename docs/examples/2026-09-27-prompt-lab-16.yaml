{"title": "2 thing — D* · maskin", "elements": [{"id": "fridge_box", "type": "shape", "shape": "rect", "x": 355, "y": 390, "width": 410, "height": 400}, {"id": "food", "type": "shape", "shape": "rect", "x": 260, "y": 245, "width": 120, "height": 60, "style": {"fill": "#87a878"}}, {"id": "l_food", "type": "label", "text": "food, 4 °C", "attach_to": "food", "side": "right"}, {"id": "evaporator", "type": "path", "points": [[200, 520], [228, 548], [256, 492], [284, 548], [312, 492], [340, 548], [368, 492], [396, 548], [424, 492], [452, 548], [480, 520]], "style": {"color": "#2f6b8f", "stroke_width": 3}}, {"id": "pipe_suction", "type": "path", "points": [[480, 520], [600, 520], [600, 320]], "style": {"color": "#2f6b8f"}}, {"id": "compressor", "type": "shape", "shape": "circle", "x": 600, "y": 280, "width": 80, "style": {"color": "#3d3833"}}, {"id": "pipe_hot", "type": "path", "points": [[640, 280], [720, 280], [720, 300]], "style": {"color": "#b5482e"}}, {"id": "condenser", "type": "path", "points": [[720, 300], [680, 330], [760, 362], [680, 394], [760, 426], [680, 458], [760, 490], [680, 522], [720, 560]], "style": {"color": "#b5482e", "stroke_width": 3}}, {"id": "pipe_liquid", "type": "path", "points": [[720, 560], [720, 635], [70, 635], [70, 582]], "style": {"color": "#b5482e"}}, {"id": "valve", "type": "polygon", "points": [[48, 582], [92, 582], [78, 560], [92, 538], [48, 538], [62, 560]], "style": {"color": "#3d3833", "fill": "#8f887c"}}, {"id": "pipe_return", "type": "path", "points": [[70, 538], [70, 520], [200, 520]], "style": {"color": "#2f6b8f"}}, {"id": "cycle", "type": "group", "members": ["evaporator", "pipe_suction", "compressor", "pipe_hot", "condenser", "pipe_liquid", "valve", "pipe_return"]}, {"id": "l_evap", "type": "text", "text": "evaporator", "x": 425, "y": 455, "style": {"color": "#2f6b8f"}}, {"id": "t_cold", "type": "text", "text": "−25 °C, 0.6 bar", "x": 425, "y": 423, "style": {"color": "#2f6b8f"}}, {"id": "l_comp", "type": "label", "text": "compressor", "attach_to": "compressor", "side": "below"}, {"id": "l_cond", "type": "text", "text": "condenser", "x": 850, "y": 455, "style": {"color": "#b5482e"}}, {"id": "t_hot", "type": "text", "text": "+40 °C, 5 bar", "x": 860, "y": 422, "style": {"color": "#b5482e"}}, {"id": "l_valve", "type": "text", "text": "valve", "x": 70, "y": 505}, {"id": "heat_in_1", "type": "arrow", "from": {"x": 230, "y": 285}, "to": {"x": 230, "y": 482}, "style": {"color": "#d0865f", "stroke_width": 3}}, {"id": "heat_in_2", "type": "arrow", "from": {"x": 285, "y": 285}, "to": {"x": 285, "y": 482}, "style": {"color": "#d0865f", "stroke_width": 3}}, {"id": "heat_out_1", "type": "arrow", "from": {"x": 775, "y": 335}, "to": {"x": 880, "y": 335}, "style": {"color": "#d0865f", "stroke_width": 3}}, {"id": "heat_out_2", "type": "arrow", "from": {"x": 775, "y": 505}, "to": {"x": 880, "y": 505}, "style": {"color": "#d0865f", "stroke_width": 3}}, {"id": "l_kitchen", "type": "text", "text": "kitchen, 20 °C", "x": 860, "y": 295}, {"id": "calc", "type": "scratch", "work": ["food 4 °C → coil −25 °C", "coil +40 °C → room 20 °C"], "x": 828, "y": 195}, {"id": "calc_mark", "type": "annotation", "target": ["calc_line_1", "calc_line_2"], "kind": "box"}], "commands": [{"card": {"title": "D* · maskin — How a fridge makes cold"}}, {"draw": ["fridge_box", "food", "l_food"], "speak": "How does a fridge keep its inside cold, when heat always flows from warm things to cold ones?"}, {"pause": 0.4}, {"draw": ["heat_in_1"], "speak": "The trick is that it never makes cold at all."}, {"draw": ["heat_in_2"], "speak": "It moves heat out of the box, like a pump moving water uphill."}, {"draw": ["evaporator", "l_evap"], "speak": "The carrier is a fluid that boils very easily, and inside the box it runs through these coils."}, {"draw": ["t_cold"], "speak": "Here it is kept at low pressure, so it boils at about minus twenty-five degrees."}, {"flow": {"along": ["evaporator"], "speed": 50, "duration": 2.5}}, {"flow": {"along": ["heat_in_1", "heat_in_2"]}, "speak": "Boiling takes heat, and the coldest thing around is the coil, so heat flows from the food into it on its own."}, {"draw": ["calc_box", "calc_line_1"]}, {"draw": ["pipe_suction"], "speak": "Now the vapour carries that heat, but it is colder than the kitchen, so it cannot give it away yet."}, {"flow": {"along": ["evaporator", "pipe_suction"], "duration": 2.5}}, {"draw": ["compressor", "l_comp", "pipe_hot"], "speak": "So the compressor squeezes it."}, {"pause": 0.4}, {"flow": {"along": ["pipe_suction", "pipe_hot"], "duration": 2.5}}, {"draw": ["t_hot"], "speak": "Squeezing a gas heats it: at five bar it comes out at about forty degrees.", "cue": 0.5}, {"draw": ["condenser", "l_cond"], "speak": "That is hotter than a twenty-degree kitchen."}, {"draw": ["heat_out_1", "heat_out_2", "l_kitchen"], "parallel": true, "speak": "So in the coils at the back, the heat now flows out, downhill again."}, {"draw": ["calc_line_2"]}, {"flow": {"along": ["condenser"], "speed": 40}, "speak": "Giving away its heat, the vapour turns back into liquid."}, {"draw": ["pipe_liquid", "valve", "l_valve", "pipe_return"], "speak": "Last, it squeezes through a narrow valve, and the sudden drop in pressure makes it cold again."}, {"flow": {"along": ["pipe_liquid", "pipe_return"], "duration": 2.5}}, {"flow": {"along": ["evaporator", "pipe_suction", "pipe_hot", "condenser", "pipe_liquid", "pipe_return"]}, "speak": "Then the whole loop starts over, carrying heat out one load at a time."}, {"flow": {"along": ["heat_out_1", "heat_out_2"], "color": "#d0865f"}, "speak": "That is why the back of a fridge is warm: it is where the food's heat, plus the motor's work, ends up in your kitchen."}, {"speak": "The pressure does the work: low pressure lets the fluid boil colder than the food, high pressure makes it hotter than the room.", "blocking": false}, {"highlight": {"target": ["t_cold"], "duration": 2.5}}, {"highlight": {"target": ["t_hot"], "duration": 2.5}}, {"draw": ["calc_mark"]}, {"pause": 0.5}, {"quiz": {"question": "Where does the heat taken from the food end up?", "choices": ["Destroyed by the cold refrigerant", "In the kitchen, through the coils at the back", "Stored in the compressor", "In the freezer compartment"], "correct": 2, "right": "In the kitchen: the hot coils at the back give it off, along with the motor's work.", "wrong": "Follow the dots: where does the loop give its heat away?"}}]}
