title: Compute it
book: { layout: columns, look: mixed }
elements:
  - id: calc
    type: code
    language: python
    show: above
    figures: 2
    code: |-
      import matplotlib.pyplot as plt

      def pct(a, b):
          return (b - a) / ((a + b) / 2)

      p1, p2 = 60, 70
      q1, q2 = 30, 20
      print("elasticity:", round(pct(q1, q2) / pct(p1, p2), 2))

      plt.figure(); _ = plt.plot([10, 80], [80, 10])
      plt.figure(); _ = plt.plot([10, 80], [80, 10]); _ = plt.plot([q1, q2], [p1, p2], "o")
    marks: ["(a + b) / 2"]
commands:
  - draw: [calc, calc_line_1]
    speak: Doing this by hand every time gets tedious, so let the computer do it, in Python, running right here in your browser.
  - write: "A **function** for the formula: write it once, use it for any two points."
    speak: We start with a small function for the midpoint percentage change.
  - draw: [calc_line_3, calc_line_4]
    parallel: true
  - draw: [calc_mark_1]
    speak: Its one idea is the average of the two values, underneath.
  - draw: [calc_line_6, calc_line_7]
    parallel: true
    speak: Then we give it our two points, fares of sixty and seventy, and thirty and twenty rides.
  - draw: [calc_line_8]
    speak: With those in place, elasticity is just one change over the other.
  - highlight: { target: calc_line_8, part: "pct(q1, q2)" }
    speak: The rides go on top,
  - highlight: { target: calc_line_8, part: "pct(p1, p2)" }
    speak: and the fares underneath.
  - draw: [calc_out]
    speak: Run it, and out comes minus two point six, the same as by hand.
  - draw: [calc_line_10, calc_fig_1]
    speak: A picture helps too. First the demand line on its own,
  - draw: [calc_line_11, calc_fig_2]
    speak: and then, one line later, the same line with our two points on it.
  - write: "```python\nround(pct(30, 20) / pct(60, 70), 2)\n```\n```output\n-2.6\n```"
    speak: And once the function exists, any new pair of points is a single line.
  - pause: 1
