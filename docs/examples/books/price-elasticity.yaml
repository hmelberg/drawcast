title: The midpoint method
book: { layout: columns, look: mixed }
domain: { x: [0, 50], y: [40, 80] }
elements:
  - { id: ax, type: axes, x_label: Rides, y_label: Price }
  - { id: d, type: curve, expr: "90 - x", x_from: 10, x_to: 50, style: { color: "#b5482e" } }
  - { id: pA, type: point, at: { x: 30, on: d }, guides: { values: true } }
  - { id: pB, type: point, at: { x: 20, on: d }, guides: { values: true } }
  - { id: pM, type: point, at: { x: 25, on: d }, style: { color: "#8a5fa8" }, guides: { values: true } }
  - { id: lM, type: label, attach_to: pM, side: right, text: midpoint, style: { color: "#8a5fa8" } }
commands:
  - draw: [ax, d, pA, pB]
    parallel: true
    speak: Back to the buses, because our minus two hides a snag.
  - write: "60 → 70 or 70 → 60? A % change depends on where you start."
    speak: Going up from sixty, the fare rose seventeen percent. But going down from seventy, the same step is only fourteen.
  - write: "$$\\%\\Delta P = \\frac{P_2 - P_1}{(P_1 + P_2)/2}$$"
    speak: The usual fix is to measure both changes from the midpoint, the average of the two.
  - draw: [pM, lM]
  - write: { text: "65 = halfway between 60 and 70", temp: true }
    speak: For the fares, that is sixty-five.
  - write: "$$\\%\\Delta P = \\frac{70 - 60}{65} \\approx 15.4\\%$$"
    speak: So ten kroner over sixty-five makes about fifteen percent.
  - write: "$$\\%\\Delta Q = \\frac{20 - 30}{25} = -40\\%$$"
    speak: The rides get the same treatment, minus ten over twenty-five, which is minus forty percent.
  - write: { id: midpoint_result, text: "$$\\varepsilon = \\frac{-40\\%}{15.4\\%} \\approx -2.6$$" }
    speak: Dividing one by the other then gives an elasticity of about minus two point six.
  - highlight: { target: midpoint_result, effect: box, keep: true }
  - write: "The same answer in **both directions**."
    speak: And because both changes start from the middle, you get the same number whichever way you go.
  - highlight: { target: pM }
  - pause: 1
