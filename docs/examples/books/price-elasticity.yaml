chapter: What elasticity is
---
title: What elasticity measures
book: { layout: columns, look: mixed }
domain: { x: [0, 100], y: [0, 100] }
elements:
  - { id: ax, type: axes, x_label: Rides, y_label: Price }
  - { id: d, type: curve, expr: "90 - x", x_from: 10, x_to: 80, style: { color: "#b5482e" } }
  - { id: lD, type: label, attach_to: d, side: above-right, text: D, style: { color: "#b5482e" } }
  - { id: pA, type: point, at: { x: 30, on: d }, guides: { values: true } }
  - { id: pB, type: point, at: { x: 20, on: d }, guides: { values: true } }
  - { id: mv, type: arrow, from: { ref: pA }, to: { ref: pB }, style: { color: "#8a5fa8" } }
  - { id: lmv, type: label, attach_to: mv, side: above-right, text: price up, style: { color: "#8a5fa8" } }
commands:
  - draw: [ax]
    speak: Everyone knows that when a price goes up, people buy less. The interesting question is how much less.
  - draw: [d, lD]
    speak: To see it, take the demand for bus rides in a small town.
  - draw: [pA]
    speak: At sixty kroner a ride, people take thirty rides a day.
  - draw: [pB, mv, lmv]
    speak: Now raise the fare to seventy, and the rides drop to twenty.
  - write: "**Elasticity** — how strongly quantity reacts to a price change"
    speak: That jump, from one point to the other, is what elasticity turns into a single number.
  - write: { id: formula, text: "$$\\varepsilon = \\frac{\\%\\,\\Delta Q}{\\%\\,\\Delta P}$$" }
    speak: It compares the two changes in percent, how much quantity moved, divided by how much the price moved.
  - highlight: { target: formula, effect: circle }
    speak: So quantity sits on top, and price underneath.
  - write: "Bus rides: $\\dfrac{-33\\%}{+17\\%} \\approx -2$"
    speak: For our buses, the fare rose about seventeen percent while rides fell by a third, which gives an elasticity of about minus two.
  - highlight: { target: [pA, pB] }
  - pause: 1
