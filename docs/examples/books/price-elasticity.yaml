title: Why it matters for revenue
book: { layout: columns, look: mixed }
domain: { x: [0, 100], y: [0, 100] }
elements:
  - { id: ax, type: axes, x_label: Rides, y_label: Price }
  - { id: d, type: curve, expr: "90 - x", x_from: 10, x_to: 80, style: { color: "#b5482e" } }
  - { id: lD, type: label, attach_to: d, side: above-right, text: D, style: { color: "#b5482e" } }
  - { id: rA, type: polygon, data: true, points: [[0, 0], [30, 0], [30, 60], [0, 60]], style: { color: "#d0865f", fill: "#f2c14e" } }
  - { id: pA, type: point, at: { x: 30, on: d } }
  - { id: rB, type: polygon, data: true, points: [[0, 0], [20, 0], [20, 70], [0, 70]], style: { color: "#2f6b8f", fill: "#9cc3dc" } }
  - { id: pB, type: point, at: { x: 20, on: d } }
commands:
  - draw: [ax, d, lD]
    speak: All of this would be a curiosity if it did not decide something that matters to the bus company, its takings.
  - write: "Revenue $= P \\times Q$"
  - draw: [rA, pA]
    speak: Its revenue is the fare times the rides, which is this rectangle. Sixty times thirty, eighteen hundred kroner a day.
  - write: "$60 \\times 30 = 1800$ → $70 \\times 20 = 1400$"
  - draw: [rB, pB]
    speak: After the fare rise the rectangle is taller, but much narrower. Seventy times twenty, only fourteen hundred.
  - write: { text: "1800 − 1400 = 400 lost", temp: true }
    speak: So the rise costs the company four hundred kroner a day.
  - write: { id: rule, text: "**Elastic** demand: raise the price, revenue **falls**" }
    speak: That is what elastic demand means in money. A higher price loses more in rides than it gains per ride.
  - highlight: { target: rule, part: falls, effect: circle }
    speak: And so revenue falls.
  - quiz:
      question: A ten percent fare rise cuts rides by four percent. What happens to revenue?
      choices: [It rises, It falls, It stays the same]
      correct: 1
      right: It rises. Rides fall less than the fare rose, so demand is inelastic here.
