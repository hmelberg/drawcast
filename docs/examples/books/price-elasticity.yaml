book: { layout: columns, look: mixed }
template: bar_race
params:
  labels: [Petrol, Bus rides, Cigarettes]
  values: [[0.1, 0.3, 0.2], [0.3, 0.6, 0.35], [0.6, 0.9, 0.5]]
  ticker: [1 month, 1 year, 5 years]
  stage: 0
  value_labels: true
  decimals: 1
  xlim: [0, 1]
  x_label: Elasticity (size)
commands:
  - draw: [axes, ticker, race_1, race_2, race_3]
    parallel: true
    speak: There is one more thing that bends these numbers, and it is time.
  - write: "Demand is more elastic in the **long run**: people find other ways."
    speak: In the first month after a price rise, people mostly grumble and pay.
  - animate: { stage: 1 }
    easing: linear
    duration: 2.5
    speak: But give them a year, and they start to adjust, with car pools, a bike, a closer job.
  - animate: { stage: 2 }
    easing: linear
    duration: 2.5
    speak: After five years every bar has grown, bus rides most of all.
  - write: "| Good | 1 month | 5 years |\n|---|---|---|\n| Petrol | 0.1 | 0.6 |\n| Bus rides | 0.3 | 0.9 |\n| Cigarettes | 0.2 | 0.5 |"
    speak: Written down as a table, the pattern is the same in every row.
  - write: "*Illustrative numbers, not estimates.*"
  - pause: 1
