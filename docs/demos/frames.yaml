playlist:
  title: Five frames, one script
---
title: On a CRT
elements:
  - id: p
    type: code
    language: brython
    show: below
    lines: 5
    width: 800
    frame: crt
    draw:
      mode: type
    marks:
      - "random.seed(7)"
    code: |
      import random
      import matplotlib.pyplot as plt
      random.seed(7)
      heads, share = 0, []
      for i in range(1, 401):
          heads += 1 if random.random() < 0.5 else 0
          share.append(heads / i)
      _ = plt.plot(share)
      _ = plt.plot([0.5] * 400)
commands:
  - card: { title: "Five frames, one script", style: center, subtitle: "the same seed on every machine" }
  - draw: [p, p_line_1, p_line_2]
    parallel: true
    speak: "Why does a script of random coin flips draw the same curve on every computer? Here it is on an old tube monitor."
  - draw: [p_line_3, p_mark_1]
    speak: "This line is why. A computer's random numbers come from a recipe, and the seed is the point where the recipe starts."
  - draw: [p_line_4, p_line_5, p_line_6, p_line_7]
    speak: "Four hundred flips. Each adds a head or nothing, and after every flip the script stores the share of heads so far."
  - draw: [p_line_8, p_line_9]
    speak: "Then it plots that share, beside a flat line at one half."
  - draw: [p_out]
    speak: "The first flips swing wildly. By four hundred, the share has settled close to a half."
---
title: On a home computer
elements:
  - id: p
    type: code
    language: brython
    show: below
    lines: 4
    width: 780
    frame: c64
    draw:
      mode: type
    code: |
      import random
      import matplotlib.pyplot as plt
      random.seed(7)
      heads, share = 0, []
      for i in range(1, 401):
          heads += 1 if random.random() < 0.5 else 0
          share.append(heads / i)
      _ = plt.plot(share)
      _ = plt.plot([0.5] * 400)
commands:
  - draw: [p, p_line_1, p_line_2, p_line_3, p_line_4, p_line_5, p_line_6, p_line_7, p_line_8, p_line_9]
    parallel: true
    speak: "The same script on a tube standing on a home-computer keyboard, the way a desk looked in 1982."
  - draw: [p_out]
    speak: "And the same curve, wiggle for wiggle. The machine changed; the recipe and its seed did not."
  - point: { at: { ref: p }, gesture: tap }
    speak: "Pause here and press the buttons on the chin: they work. The round one blanks the picture."
---
title: On a flat screen
elements:
  - id: p
    type: code
    language: brython
    show: below
    lines: 5
    width: 800
    frame: screen
    draw:
      mode: type
    code: |
      import random
      import matplotlib.pyplot as plt
      random.seed(7)
      heads, share = 0, []
      for i in range(1, 401):
          heads += 1 if random.random() < 0.5 else 0
          share.append(heads / i)
      _ = plt.plot(share)
      _ = plt.plot([0.5] * 400)
commands:
  - draw: [p, p_line_1, p_line_2, p_line_3, p_line_4, p_line_5, p_line_6, p_line_7, p_line_8, p_line_9]
    parallel: true
    speak: "On a flat display now: one rounded shell, a chin, and no stand."
  - draw: [p_out]
    speak: "Seed seven in, the same four hundred flips out, on any computer that runs it."
---
title: On a laptop
elements:
  - id: p
    type: code
    language: brython
    show: below
    lines: 5
    width: 800
    frame: laptop
    draw:
      mode: type
    marks:
      - "random.seed(8)"
    code: |
      import random
      import matplotlib.pyplot as plt
      random.seed(8)
      heads, share = 0, []
      for i in range(1, 401):
          heads += 1 if random.random() < 0.5 else 0
          share.append(heads / i)
      _ = plt.plot(share)
      _ = plt.plot([0.5] * 400)
commands:
  - draw: [p, p_line_1, p_line_2, p_line_3, p_line_4, p_line_5, p_line_6, p_line_7, p_line_8, p_line_9]
    parallel: true
    speak: "On a laptop, with one change to the script."
  - draw: [p_mark_1]
    speak: "The seed is now eight, so the recipe starts somewhere else."
  - draw: [p_out]
    speak: "A different run of luck, so the early wiggles differ. Yet by four hundred flips the share is close to a half again."
  - highlight: { target: [p_out] }
    speak: "That is the split. The seed fixes every single flip; the settling toward a half is the law of large numbers, and no seed changes it."
---
title: On bare paper
elements:
  - id: p
    type: code
    language: brython
    show: below
    lines: 5
    width: 800
    draw:
      mode: type
    code: |
      import random
      import matplotlib.pyplot as plt
      random.seed(7)
      heads, share = 0, []
      for i in range(1, 401):
          heads += 1 if random.random() < 0.5 else 0
          share.append(heads / i)
      _ = plt.plot(share)
      _ = plt.plot([0.5] * 400)
commands:
  - draw: [p, p_line_1, p_line_2, p_line_3, p_line_4, p_line_5, p_line_6, p_line_7, p_line_8, p_line_9]
    parallel: true
    speak: "And with no frame at all, the default: plain paper, and seed seven again."
  - draw: [p_out]
    speak: "The first curve, exactly. The frame is costume; what a script computes depends only on its code and its seed."
  - highlight: { target: [p_line_3] }
    speak: "Standard Python's recipe is the Mersenne Twister, from the late 1990s. Its sequence only repeats after two to the power 19,937, minus one, numbers."
  - quiz:
      question: "You delete the seed line and run the script twice. What happens?"
      choices: ["The same curve both times", "Two different curves, both settling near a half", "The curve stops settling near a half"]
      correct: 2
      right: "Two different curves: without a seed, Python starts its recipe somewhere new each run, but four hundred flips still settle near a half."
