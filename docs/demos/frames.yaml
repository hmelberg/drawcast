title: On a CRT
elements:
  - id: p
    type: code
    language: brython
    show: below
    lines: 5
    width: 800
    frame: crt
    draw:
      mode: type
    code: |
      import random
      import matplotlib.pyplot as plt
      random.seed(7)
      heads, share = 0, []
      for i in range(1, 401):
          heads += 1 if random.random() < 0.5 else 0
          share.append(heads / i)
      _ = plt.plot(share)
      _ = plt.plot([0.5] * 400)
commands:
  - draw: [p, p_line_1, p_line_2, p_line_3, p_line_4]
    parallel: true
    speak: An old tube monitor, drawn in ink — and a coin about to be flipped four hundred times.
  - draw: [p_line_5, p_line_6, p_line_7, p_line_8, p_line_9]
    speak: Every flip adds a head or nothing, and the running share is stored after each one.
  - draw: [p_out]
    speak: The first flips swing wildly; by four hundred the share has settled near a half.
