commands:
  - card:
      title: From ticks to a weight
  - draw:
      - scale
      - tk1
      - tk0
      - l1
      - l0
    speak: Last time, four years at q = 0.5 became 2 QALYs — but where does a weight like 0.5, or 0.7, actually come from?
  - draw:
      - eq5d
    speak: It starts with a short questionnaire, and the most widely used one is the EQ-5D.
  - draw:
      - rl1
      - rl2
      - rl3
      - rl4
      - rl5
    speak: 'It asks about five dimensions of health: mobility, self-care, usual activities, pain or discomfort, and anxiety or depression.'
  - draw:
      - grid
      - h1
      - h2
      - h3
      - h4
      - h5
    speak: In the EQ-5D-5L version, each dimension has five levels, from no problems to extreme problems.
  - draw:
      - t1
      - t2
      - t3
      - t4
      - t5
    speak: Our patient on the new treatment ticks one box per row — say, slight problems walking, moderate pain, and none on the rest.
  - draw:
      - code
      - states
    speak: 'The ticks become a five-digit code, here 2 1 1 3 1: one of 3,125 possible health states.'
  - camera:
      center:
        ref: code
      zoom: 1.8
  - camera:
      reset: true
  - highlight:
      target:
        - t1
        - t4
      effect: circle
    speak: 'The code alone is not a weight: nobody has yet said how bad moderate pain is compared with trouble walking.'
  - draw:
      - vs
      - vs_sub
    speak: 'That is the job of a value set: a scoring formula estimated from a survey of the general public.'
  - highlight:
      target:
        - vs_sub
    speak: Members of the public value a sample of states, usually with the time trade-off, and a statistical model fills in the rest.
  - draw:
      - a1
      - a2
      - q07
      - lq07
    speak: Feed in 21131, and the value set returns a weight — here, for illustration, 0.7.
  - draw:
      - worst
      - lworst
      - luk
    speak: 'The scale runs below zero too: in the 1997 UK value set for the older three-level version, the worst state scored minus 0.594.'
  - highlight:
      target:
        - t1
        - t2
        - t3
        - t4
        - t5
        - vs
    speak: 'So a weight joins two things: the patient describes the state, and the public says what it is worth.'
  - quiz:
      question: The same patient's EQ-5D answers are scored in two countries and get different weights. Why?
      choices:
        - Different value sets
        - Different questionnaires
        - The patient changed
      correct: 1
      right: 'Different value sets: each country''s public values the same states differently.'
      wrong: The ticks are identical — what else goes into the weight?
sources:
  - id: dolan
    title: Modeling valuations for EuroQol health states
    authors: Dolan P
    year: 1997
    finding: UK EQ-5D-3L value set; worst state (33333) = −0.594
---
title: Time trade-off
template: qaly_profiles
params:
  x_label: Years
  y_label: Quality of life, q
  x_max: 11
  lines: straight
  profiles:
    - id: state
      label: 'Life A: the state'
      color: '#2f6b8f'
      waypoints:
        - t: 0
          u: 0.7
        - t: 10.1
          u: 0.7
      death_at: 10.1
    - id: healthy
      label: 'Life B: full health'
      color: '#b5482e'
      waypoints:
        - t: 0
          u: 1
        - t: 10
          u: 1
      death_at: 10
  shade_between:
    a: healthy
    b: state
    gain_label: Quality gained
    loss_label: Years given up
elements:
  - id: sc
    type: scratch
    work:
      - tex: q = 7 \div 10 = 0.7
      - tex: 0.3 \times 7 = 0.7 \times 3 = 2.1
    x: 330
    'y': 300
  - id: wtd
    type: text
    text: 'Worse than dead: q < 0'
    at:
      data: [3.5, 0.15]
    style:
      color: '#8f887c'
  - id: y10
    type: text
    text: '10'
    at:
      data: [10, -0.06]
  - id: y7
    type: text
    text: '7'
    at:
      data: [7, -0.06]
    style:
      color: '#b5482e'
commands:
  - card:
      title: Time trade-off
  - draw:
      - axes
      - tick_one
      - tick_zero
    speak: Now that we know the public values the states, how do you ask a person what a state is worth?
  - draw:
      - full_health_line
    speak: The time trade-off offers a choice between two lives.
  - draw:
      - curve_state
      - label_state
      - y10
    speak: 'Life A: ten years in the health state, then death.'
  - draw:
      - curve_healthy
      - label_healthy
    speak: 'Life B: years in full health, then death — and at first, the same ten years.'
  - highlight:
      target:
        - curve_healthy
    speak: With equal years, everyone picks full health.
  - animate:
      profiles.1.death_at: 7
    duration: 4
    ghost:
      - curve_healthy
    speak: So shorten Life B, a year at a time, until the person can no longer choose between them.
  - draw:
      - y7
    speak: Say that happens at seven years.
  - highlight:
      target:
        - curve_state
        - curve_healthy
    speak: Then ten years in the state are worth seven healthy years.
  - erase:
      - curve_healthy_ghost
  - draw:
      - sc_box
      - sc_line_1
    speak: 'The weight is the ratio: q = 7 ÷ 10 = 0.7.'
  - draw:
      - gain_regions
      - label_gain
      - loss_regions
      - label_loss
      - sc_line_2
    speak: 'On the figure, the two lives now enclose equal areas: the quality gained in the first seven years balances the three years given up.'
  - erase:
      - sc
  - highlight:
      target:
        - gain_regions
        - loss_regions
    speak: 'That is the QALY idea run backwards: indifference means equal QALYs.'
  - draw:
      - wtd
    speak: For a state some find worse than dead, the question is reframed — a spell in the state followed by full health, against dying now — and the weight comes out below zero.
  - highlight:
      target:
        - curve_healthy
    speak: So a time trade-off weight is the share of your years you would keep in full health, instead of living them all in the state.
  - quiz:
      question: Someone would give up 2 of 10 years to be free of a state. What is its weight?
      choices:
        - '0.2'
        - '0.8'
        - '2.0'
      correct: 2
      right: '0.8: they keep 8 healthy years in place of 10 in the state, and 8 ÷ 10 = 0.8.'
      wrong: The weight is the share of years kept, not given up.
---
title: Standard gamble
template: decision_tree
params:
  rollback: true
  unit: q
  box:
    x: 40
    'y': 170
    w: 920
    h: 470
  decimals: 2
  root:
    id: choice
    type: decision
    label: Choose
    children:
      - label: Gamble
        node:
          id: gamble
          type: chance
          label: Treatment
          children:
            - label: Full health
              probability: 1
              node:
                id: healthy
                type: terminal
                label: Healthy
                payoff: 1
            - label: Dead
              node:
                id: dead
                type: terminal
                label: Dead
                payoff: 0
      - label: Certain
        node:
          id: state
          type: terminal
          label: The state
          payoff: 0.7
elements:
  - id: sc
    type: scratch
    work:
      - tex: 0.7 \times 1 + 0.3 \times 0 = 0.7
    x: 780
    'y': 290
commands:
  - card:
      title: Standard gamble
  - draw:
      - node_choice
      - label_choice
    speak: The time trade-off pays in years; the standard gamble pays in risk.
  - draw:
      - edge_choice_state
      - branchlabel_choice_state
      - node_state
      - label_state
    speak: 'The choice: live on in the health state for certain,'
  - draw:
      - edge_choice_gamble
      - branchlabel_choice_gamble
      - node_gamble
      - label_gamble
      - edge_gamble_healthy
      - branchlabel_gamble_healthy
      - node_healthy
      - label_healthy
      - payoff_healthy
      - edge_gamble_dead
      - branchlabel_gamble_dead
      - node_dead
      - label_dead
      - payoff_dead
    speak: or take a treatment that restores full health with probability p, and kills you with probability 1 − p.
  - draw:
      - value_gamble
      - best_choice_gamble
    speak: If p is 1, the gamble is a free cure, and everyone takes it.
  - erase:
      - best_choice_gamble
  - hide:
      - prune_choice_state
  - animate:
      root.children.0.node.children.0.probability: 0.8
    duration: 3
    speak: Lower p step by step, and at some point the person can no longer choose.
  - animate:
      root.children.0.node.children.0.probability: 0.7
    duration: 2
    speak: Say that point is p = 0.7.
  - draw:
      - sc_box
      - sc_line_1
    speak: The gamble is then worth 0.7 × 1 + 0.3 × 0, which is 0.7.
  - draw:
      - payoff_state
    speak: 'So the certain state is worth 0.7 too: the weight is read straight off the probability.'
  - erase:
      - sc
  - explore: {}
    speak: 'Pause and drag p: the gamble''s value follows it, and where it matches the certain state is the weight.'
  - highlight:
      target:
        - payoff_healthy
        - payoff_dead
    speak: Both methods put the state on the same scale, with full health at 1 and death at 0.
  - point:
      at:
        ref: payoff_state
      gesture: underline
    speak: In practice, the same person usually gives a higher weight in the gamble than in the time trade-off — we come back to why.
  - highlight:
      target:
        - branchlabel_gamble_dead
    speak: So the standard gamble weighs a state by how much risk of death you would accept to escape it.
  - quiz:
      question: Someone accepts at most a 5% risk of death to be cured of a state. What is its weight?
      choices:
        - '0.05'
        - '0.95'
        - '0.5'
      correct: 2
      right: '0.95: indifference comes at a 95% chance of full health, so the state is worth 0.95.'
      wrong: p is the chance of full health, not of death.
---
title: Over time, to a cost per QALY
template: bar_chart
params:
  labels:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
  x_label: Year
  y_label: QALYs in the year
  ylim: [0, 0.8]
  stage: 0
  box:
    x: 90
    'y': 170
    w: 590
    h: 450
  series:
    - name: Standard care
      values:
        - - 0.5
          - 0.5
          - 0.5
          - 0.5
          - 0
        - - 0.5
          - 0.5
          - 0.5
          - 0.5
          - 0
        - - 0.5
          - 0.483
          - 0.467
          - 0.451
          - 0
    - name: New treatment
      values:
        - - 0
          - 0
          - 0
          - 0
          - 0
        - - 0.7
          - 0.7
          - 0.7
          - 0.7
          - 0.7
        - - 0.7
          - 0.676
          - 0.653
          - 0.631
          - 0.61
vars:
  ts: 2
  tn: 3.5
elements:
  - id: rs
    type: text
    text: 'Standard: {ts:2}'
    x: 845
    'y': 560
    font_size: 30
    style:
      color: '#b5482e'
  - id: rn
    type: text
    text: 'New: {tn:2}'
    x: 845
    'y': 510
    font_size: 30
    style:
      color: '#2f6b8f'
  - id: scA
    type: scratch
    work:
      - tex: \frac{q}{(1+r)^{t-1}}
      - tex: r = 3.5\%
    x: 840
    'y': 330
  - id: scB
    type: scratch
    work:
      - tex: \Delta Q = 3.27 - 1.90 = 1.37
      - tex: \Delta C = 30{,}000
      - tex: ICER = \frac{30{,}000}{1.37} \approx 21{,}900
      - tex: 21{,}900 < \lambda = 30{,}000
    x: 830
    'y': 300
    font_size: 22
commands:
  - card:
      title: Over time, to a cost per QALY
  - draw:
      - axes
    speak: Now that each year has a weight, we can add up our running example over time.
  - draw:
      - bar_1
      - bar_2
      - bar_3
      - bar_4
      - bar_5
      - legend
      - rs
    speak: 'Standard care: four years at 0.5, one bar per year, for 2.0 QALYs.'
  - animate:
      stage: 1
    duration: 2
    speak: 'The new treatment: five years at 0.7, for 3.5 QALYs.'
  - draw:
      - rn
  - highlight:
      target:
        - bar_5
    speak: But a healthy year far in the future usually counts for less than one today, so future QALYs are discounted.
  - draw:
      - scA_box
      - scA_line_1
      - scA_line_2
    speak: Each year is divided by (1 + r) to the power of how far away it is; NICE in England uses r = 3.5% for both costs and QALYs.
  - animate:
      stage: 2
      ts: 1.9
      tn: 3.27
    duration: 3
    speak: 'Watch the bars shrink: year one stays whole, and year five keeps 87% of its weight.'
  - highlight:
      target:
        - rs
        - rn
    speak: Summed, standard care falls to 1.90 QALYs, and the new treatment to 3.27.
  - erase:
      - scA
  - draw:
      - scB_box
      - scB_line_1
    speak: The gain ΔQ shrinks from 1.5 to 1.37 QALYs.
  - draw:
      - scB_line_2
    speak: The extra cost, ΔC = 30,000, is paid up front here, so it is not discounted.
  - draw:
      - scB_line_3
    speak: 'The ICER is ΔC ÷ ΔQ: 30,000 ÷ 1.37, about 21,900 per QALY, up from 20,000.'
  - draw:
      - scB_line_4
    speak: A payer with a threshold λ of 30,000 per QALY would still say yes.
  - highlight:
      target:
        - bar_1
        - bar_2
        - bar_3
        - bar_4
        - bar_5
    speak: 'So a cost per QALY is a chain: ticks on a form, the public''s trade-offs, weights times years, and a discount rate.'
  - erase:
      - scB_box
      - scB_line_1
      - scB_line_2
      - scB_line_3
      - scB_line_4
  - highlight:
      target:
        - rs
        - rn
    speak: Every link is a choice someone made, and changing any one of them moves the ICER.
  - quiz:
      question: If the new treatment's extra benefit came 20 years from now instead of within five, what would discounting do to its ICER?
      choices:
        - Raise it more
        - Lower it
        - Leave it unchanged
      correct: 1
      right: 'It raises it more: QALYs twenty years away are divided by a much bigger (1 + r) to the power t, so ΔQ shrinks while the cost paid now does not.'
      wrong: A later year is divided by a bigger (1 + r) to the power t.
