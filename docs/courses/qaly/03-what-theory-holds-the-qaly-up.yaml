playlist:
  title: What theory holds the QALY up?
  prompt: Why is the standard gamble tied to expected utility theory? Which assumptions must hold for QALYs to represent preferences — utility independence, constant proportional trade-off, risk neutrality over life years? Is the QALY meant to measure welfare, or health as a social goal (welfarism versus extra-welfarism)?
---
title: The gamble as a ruler
template: decision_tree
params:
  rollback: true
  unit: Utility
  decimals: 1
  table: false
  root:
    id: choice
    type: decision
    label: Choose
    children:
      - label: Certain
        node:
          id: sure
          type: terminal
          label: State q
          payoff: 0.7
      - label: Gamble
        node:
          id: gamble
          type: chance
          label: Gamble
          children:
            - label: Win
              probability: 0.3
              node:
                id: full
                type: terminal
                label: Full health
                payoff: 1
            - label: Lose
              node:
                id: dead
                type: terminal
                label: Death
                payoff: 0
elements:
  - id: eu
    type: scratch
    work:
      - tex: EU = p \cdot 1 + (1-p) \cdot 0
      - tex: '= p'
    x: 780
    'y': 570
    font_size: 26
sources:
  - id: vnm
    title: Theory of Games and Economic Behavior
    authors: von Neumann & Morgenstern
    year: 1944
    finding: axioms under which choices maximise expected utility
commands:
  - card:
      title: The gamble as a ruler
  - hide:
      - best
      - pruned
      - value_choice
  - draw:
      - node_choice
      - label_choice
    speak: What theory lets us read a QALY weight as a person's utility — what is holding that number up?
  - draw:
      - edge_choice_sure
      - branchlabel_choice_sure
      - edge_choice_gamble
      - branchlabel_choice_gamble
    parallel: true
    speak: 'The easy answer: a weight is just a score for how good a state feels.'
  - highlight:
      target:
        - node_choice
    speak: Expected utility theory makes a much stronger claim, and the standard gamble shows it.
  - draw:
      - node_sure
      - label_sure
    speak: 'One branch is certain: live out your life in the treated state.'
  - draw:
      - node_gamble
      - label_gamble
      - edge_gamble_full
      - branchlabel_gamble_full
      - node_full
      - label_full
      - payoff_full
      - edge_gamble_dead
      - branchlabel_gamble_dead
      - node_dead
      - label_dead
      - payoff_dead
    speak: 'The other is a gamble: full health with probability p, immediate death otherwise.'
  - animate:
      root.children.1.node.children.0.probability: 0.7
    duration: 4
    speak: We raise p until the person cannot choose between them — say, at p = 0.7.
  - speak: Why should that indifference point be the weight?
  - pause: 1.8
  - draw:
      - eu_box
      - eu_line_1
    cue_end: true
    cue: 0.9
    speak: Von Neumann and Morgenstern showed that if choices obey a few axioms, a gamble is worth the probability-weighted average of its outcomes' utilities.
  - draw:
      - eu_line_2
      - value_gamble
    speak: Full health is fixed at 1 and death at 0, so the gamble is worth p times 1 plus one minus p times 0 — exactly p.
  - draw:
      - payoff_sure
    speak: 'Indifference means the certain state is worth the same: q = 0.7.'
  - erase:
      - eu
  - explore: {}
    speak: 'Pause and drag p: the gamble''s value follows it one for one.'
  - highlight:
      target:
        - edge_choice_sure
        - node_sure
        - label_sure
    speak: The catch is that many people overweight a sure thing, and then p is no longer their utility.
  - highlight:
      target:
        - value_gamble
        - payoff_sure
    speak: So the weight is a utility exactly as far as the person chooses by expected utility.
level: advanced
---
title: Adding up rectangles
template: qaly_profiles
params:
  x_label: Years t
  y_label: Quality q
  x_max: 10.5
  lines: straight
  shade_between: null
  profiles:
    - id: treated
      label: Treated
      color: '#2f6b8f'
      fill: true
      waypoints:
        - t: 0
          u: 0.7
        - t: 10
          u: 0.7
      death_at: 5
    - id: full
      label: Full health
      color: '#b5482e'
      fill: true
      waypoints:
        - t: 0
          u: 1
        - t: 10
          u: 1
      death_at: 3.5
elements:
  - id: area5
    type: text
    text: 3.5 QALYs
    at:
      data: [2.5, 0.2]
    style:
      color: '#2f6b8f'
    font_size: 30
  - id: area10
    type: text
    text: 7 QALYs
    at:
      data: [8.5, 0.2]
    style:
      color: '#2f6b8f'
    font_size: 30
  - id: gap5
    type: arrow
    from:
      data: [5, 0.85]
    to:
      data: [3.5, 0.85]
    style:
      color: '#8f887c'
  - id: gap5_l
    type: label
    text: 1.5 y = 30%
    attach_to: gap5
    side: above
  - id: gap10
    type: arrow
    from:
      data: [10, 0.85]
    to:
      data: [7, 0.85]
    style:
      color: '#8f887c'
  - id: gap10_l
    type: label
    text: 3 y = 30%
    attach_to: gap10
    side: above
  - id: form
    type: scratch
    work:
      - tex: U(q,t) = V(q)\cdot f(t)
      - tex: f(t) = t \;\Rightarrow\; U = V(q)\cdot t
    x: 300
    'y': 330
    font_size: 28
sources:
  - id: psw
    title: Utility functions for life years and health status
    authors: Pliskin, Shepard & Weinstein
    year: 1980
    finding: conditions under which QALYs represent preferences
commands:
  - card:
      title: Adding up rectangles
  - draw:
      - axes
      - full_health_line
    speak: Now that one weight is a utility, can we simply multiply it by years and add?
  - highlight:
      target:
        - axes
    speak: Pliskin, Shepard and Weinstein asked exactly that in 1980, and answered with conditions on preferences.
  - draw:
      - curve_treated
      - label_treated
      - fill_treated
      - area5
    speak: 'Take the treated patient: five years at q = 0.7 — an area of 3.5 QALYs.'
  - draw:
      - curve_full
      - label_full
      - fill_full
    speak: 'The QALY model says this is as good as 3.5 years in full health: equal areas, equal value.'
  - speak: 'First condition, mutual utility independence: how you rank lengths of life does not depend on the health state, and how you rank states does not depend on the length.'
    blocking: false
  - point:
      at:
        data: [5, 0]
      gesture: tap
  - pause: 1.2
  - point:
      at:
        data: [0, 0.7]
      gesture: tap
  - pause: 4
  - draw:
      - gap5
      - gap5_l
    speak: 'Second, constant proportional trade-off: suppose the patient would give up 1.5 of the 5 years — 30 per cent — to be in full health.'
  - keep:
      target:
        - curve_treated
        - curve_full
    speak: Now make it ten years at 0.7. How many would they give up?
  - pause: 1.8
  - animate:
      profiles.0.death_at: 10
      profiles.1.death_at: 7
    duration: 3
    speak: 'Constant proportional trade-off says 30 per cent again: three years, leaving seven in full health.'
  - erase:
      - area5
  - draw:
      - area10
      - gap10
      - gap10_l
    speak: The share traded is fixed whatever the duration — that is what makes q a constant multiplier.
  - highlight:
      target:
        - gap10_l
    speak: For some states people will bear a few years but not many, and then the share is not constant.
  - erase:
      - curve_treated_ghost
      - curve_full_ghost
      - gap5
      - gap5_l
      - gap10
      - gap10_l
  - draw:
      - form_box
      - form_line_1
    speak: Together these two give utility as a quality weight times some function of years;
  - draw:
      - form_line_2
    speak: a third condition makes that function the years themselves.
  - highlight:
      target:
        - form_line_2
    speak: 'So adding up rectangles is not arithmetic: it is an assumption about how people trade time for quality.'
level: advanced
---
title: Risk neutral about years
template: decision_tree
params:
  rollback: true
  unit: QALYs
  decimals: 1
  table: false
  root:
    id: choice
    type: decision
    label: q = 0.7
    children:
      - label: Sure
        node:
          id: sure
          type: terminal
          label: 5 years
          payoff: 3.5
      - label: Coin flip
        node:
          id: flip
          type: chance
          label: Flip
          children:
            - label: Heads
              probability: 0.5
              node:
                id: ten
                type: terminal
                label: 10 years
                payoff: 7
            - label: Tails
              node:
                id: dead
                type: terminal
                label: Death
                payoff: 0
elements:
  - id: bwj
    type: scratch
    work:
      - BWJ 1997
      - tex: \text{risk neutral} \Rightarrow \text{QALY}
    x: 790
    'y': 580
    font_size: 26
sources:
  - id: bwj97
    title: Characterizing QALYs by risk neutrality
    authors: Bleichrodt, Wakker & Johannesson
    year: 1997
    finding: for chronic states, risk neutrality in life years plus the zero condition implies the QALY model
commands:
  - card:
      title: Risk neutral about years
  - hide:
      - best
      - pruned
      - value_choice
  - draw:
      - node_choice
      - label_choice
    speak: 'The third condition is the strongest: risk neutrality over life years.'
  - draw:
      - edge_choice_sure
      - branchlabel_choice_sure
      - node_sure
      - label_sure
    speak: 'Here is the test, all in the treated state, q = 0.7: five years for sure.'
  - draw:
      - edge_choice_flip
      - branchlabel_choice_flip
      - node_flip
      - label_flip
      - edge_flip_ten
      - branchlabel_flip_ten
      - node_ten
      - label_ten
      - edge_flip_dead
      - branchlabel_flip_dead
      - node_dead
      - label_dead
    speak: 'Or a coin flip: ten years with probability one half, immediate death otherwise.'
  - draw:
      - payoff_sure
    speak: The QALY model scores the sure branch at 3.5 QALYs.
  - draw:
      - payoff_ten
      - payoff_dead
      - value_flip
    speak: And the flip? Half of 7 plus half of 0 is 3.5 — exactly the same.
  - highlight:
      target:
        - payoff_sure
        - value_flip
    speak: So the QALY model says you should not care which you get. Would you really flip that coin?
  - pause: 1.8
  - highlight:
      target:
        - edge_choice_sure
        - node_sure
        - label_sure
    speak: 'Most people would not: studies usually find people risk averse about the length of their life.'
  - point:
      at:
        ref: value_flip
      gesture: underline
    speak: For them a QALY is not their utility — it rates the gamble as highly as the sure five years they prefer.
  - draw:
      - bwj_box
      - bwj_line_1
    speak: Bleichrodt, Wakker and Johannesson showed in 1997 how much hangs on this one condition.
  - draw:
      - bwj_line_2
    speak: For chronic states, risk neutrality over life years — plus the zero condition, that zero years are worth the same in every health state — is enough on its own; the other conditions follow.
  - explore: {}
    speak: 'Pause and drag the flip''s probability: its value moves, the sure branch stays at 3.5, and they meet only at one half.'
  - erase:
      - bwj
  - highlight:
      target:
        - branchlabel_flip_ten
        - branchlabel_flip_dead
    speak: So the QALY as a utility stands or falls with one testable attitude to risk — and few people quite hold it.
level: advanced
---
title: Welfare or health?
elements:
  - id: head_w
    type: text
    text: Welfarism
    x: 460
    'y': 600
    font_size: 40
    style:
      color: '#b5482e'
  - id: head_x
    type: text
    text: Extra-welfarism
    x: 775
    'y': 600
    font_size: 40
    style:
      color: '#2f6b8f'
  - id: rule
    type: path
    points:
      - [50, 560]
      - [950, 560]
    style:
      color: '#8f887c'
  - id: divider
    type: path
    points:
      - [615, 630]
      - [615, 265]
    style:
      color: '#8f887c'
      dash: true
  - id: row_counts
    type: text
    text: Counts
    x: 170
    'y': 500
    font_size: 30
    style:
      color: '#8f887c'
  - id: row_measure
    type: text
    text: Tool
    x: 170
    'y': 400
    font_size: 30
    style:
      color: '#8f887c'
  - id: row_needs
    type: text
    text: Needs
    x: 170
    'y': 300
    font_size: 30
    style:
      color: '#8f887c'
  - id: w_counts
    type: text
    text: Own utility
    x: 460
    'y': 500
    font_size: 36
    style:
      color: '#b5482e'
  - id: x_counts
    type: text
    text: Health
    x: 775
    'y': 500
    font_size: 36
    style:
      color: '#2f6b8f'
  - id: w_measure
    type: text
    text: CBA · WTP
    x: 460
    'y': 400
    font_size: 36
    style:
      color: '#b5482e'
  - id: x_measure
    type: text
    text: CEA · QALY
    x: 775
    'y': 400
    font_size: 36
    style:
      color: '#2f6b8f'
  - id: w_needs
    type: text
    text: EU conditions
    x: 460
    'y': 300
    font_size: 36
    style:
      color: '#b5482e'
  - id: x_needs
    type: text
    text: Agreed measure
    x: 775
    'y': 300
    font_size: 36
    style:
      color: '#2f6b8f'
  - id: rowlabels
    type: group
    members:
      - row_counts
      - row_measure
      - row_needs
  - id: ex
    type: scratch
    work:
      - tex: \frac{\Delta C}{\Delta Q} = \frac{30{,}000}{1.5} = 20{,}000 \text{ vs } \lambda
    x: 615
    'y': 205
    font_size: 28
commands:
  - card:
      title: Welfare or health?
  - draw:
      - rule
      - divider
      - rowlabels
    speak: Now that the utility foundation looks thin, ask what the QALY is for.
  - draw:
      - head_w
      - w_counts
    speak: 'Two answers split health economics. The first, welfarism: what counts is each person''s own utility, as they judge it.'
  - draw:
      - w_measure
    speak: Its natural tool is cost–benefit analysis, with benefits valued by willingness to pay.
  - draw:
      - w_needs
    speak: 'For a welfarist, the conditions of this lecture are essential: a QALY that is not a utility does not measure welfare.'
  - draw:
      - head_x
    speak: The second answer is extra-welfarism, a term associated with Anthony Culyer, drawing on Amartya Sen.
  - draw:
      - x_counts
      - x_measure
    speak: Here health itself is the social goal a decision-maker pursues, and the QALY measures health — not anyone's whole welfare.
  - highlight:
      target:
        - w_needs
    speak: Does the QALY then still need risk neutrality and the rest?
  - pause: 1.8
  - draw:
      - x_needs
    speak: 'Much less: it must be a good, agreed measure of health, not a perfect model of each person''s choices.'
  - draw:
      - ex_box
      - ex_line_1
    speak: 'Our example reads cleanly this way: 1.5 QALYs gained for 30,000 more — 20,000 per QALY, set against the payer''s threshold λ.'
  - highlight:
      target:
        - x_counts
    speak: 'The price is that the value judgements come into the open: the decision-maker, not the individual, chooses what counts.'
  - erase:
      - ex
  - highlight:
      target:
        - row_needs
        - w_needs
        - x_needs
      effect: underline
    speak: 'So the QALY rests on one of two things: expected utility theory, if it is to be a utility, or a social choice to maximise health, if it is not.'
  - highlight:
      target:
        - head_w
        - head_x
      effect: underline
    speak: Now you can see what an argument about QALYs is often really about — which of those two foundations the speaker stands on.
level: advanced
