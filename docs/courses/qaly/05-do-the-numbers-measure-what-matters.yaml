title: The rivals
template: data_table
params:
  columns:
    - Measure
    - Counts
    - Plus
    - Minus
  rows:
    - - QALY
      - health gained
      - comparable
      - health only
    - - DALY
      - health lost
      - one yardstick
      - health, not choice
    - - WELLBY
      - life satisfaction
      - beyond health
      - adaptation counts
    - - ICECAP
      - capabilities
      - freedom
      - hard to trade
  font_size: 30
  box:
    x: 30
    'y': 300
    w: 940
    h: 300
elements:
  - id: daly
    type: scratch
    work:
      - DALY = YLL + YLD
      - 0 = full health
      - 1 = death
    x: 790
    'y': 250
    font_size: 28
  - id: c1
    type: text
    text: Whose values?
    font_size: 34
    style:
      color: '#b5482e'
    x: 190
    'y': 230
  - id: c2
    type: text
    text: Which method?
    font_size: 34
    style:
      color: '#b5482e'
    x: 470
    'y': 230
  - id: c3
    type: text
    text: Which questionnaire?
    font_size: 34
    style:
      color: '#b5482e'
    x: 775
    'y': 230
  - id: ring
    type: annotation
    target:
      - c1
      - c2
      - c3
    kind: box
commands:
  - card:
      title: The rivals
  - draw:
      - header
    speak: Now that we have seen what the QALY can and cannot see, here are its rivals, side by side.
  - draw:
      - row_1
    speak: The QALY counts health gained, weighted by preferences — comparable across any disease, but health only.
  - draw:
      - row_2
    speak: 'The DALY, the disability-adjusted life year, turns it around: it counts health lost, years of life lost plus years lived with disability.'
  - draw:
      - daly_box
      - daly_line_1
      - daly_line_2
      - daly_line_3
    speak: Its disability weights run the other way, 0 for full health and 1 for death, and they underpin the Global Burden of Disease studies.
  - speak: Its strength is one yardstick for every country; its weakness is that the weights judge health, not what people would give up for it.
    blocking: false
  - highlight:
      target:
        - row_2
      part: one yardstick
      duration: 2.5
  - highlight:
      target:
        - row_2
      part: health, not choice
      duration: 3
  - erase:
      - daly
  - draw:
      - row_3
    speak: 'The WELLBY counts life satisfaction: one point on a 0 to 10 scale, for one person, for one year.'
  - highlight:
      target:
        - row_3
      part: beyond health
    speak: It reaches beyond health, so a housing policy and a drug can be compared; Britain's Treasury has guidance for using it.
  - highlight:
      target:
        - row_3
      part: adaptation counts
    speak: But it counts adaptation in full — the very issue we began with.
  - draw:
      - row_4
    speak: 'Capability measures such as ICECAP-O, for older people, ask what a person is able to do and be: attachment, security, role, enjoyment, control.'
  - speak: They value freedom rather than function, but there is no settled way yet to weigh them against years of life.
    blocking: false
  - highlight:
      target:
        - row_4
      part: freedom
      duration: 2.5
  - highlight:
      target:
        - row_4
      part: hard to trade
      duration: 3
  - focus:
      target:
        - row_1
        - row_2
        - row_3
        - row_4
    speak: Each rival repairs one blind spot and opens another.
  - fade:
      target:
        - header
        - row_1
        - row_2
        - row_3
        - row_4
      to: 0.3
  - draw:
      - c1
      - c2
      - c3
    speak: 'So a cost per QALY is not a fact about a drug: it carries a choice of whose values, which method, and which questionnaire.'
  - draw:
      - ring
    speak: Its strength is that those choices are written down, so they can be checked, changed and argued over in the open.
  - highlight:
      target:
        - c1
        - c2
        - c3
    speak: Read any ICER with those three questions, and you can see what the number measures — and what it leaves out.
  - quiz:
      question: Two analyses of the same drug report 18,000 and 35,000 per QALY. Before calling one of them wrong, what should you check first?
      choices:
        - Whose values, which method, which questionnaire
        - Which has the larger sample
        - Which was published later
      correct: 1
      right: 'The three choices behind the weights: whose values, which method, which questionnaire can each move an ICER that far.'
      wrong: Think back over what moved our example's ICER in this lecture.
