playlist:
  title: Do the numbers measure what matters?
  prompt: Whose values should count — patients who have adapted, or the public imagining the state? Why do different methods and questionnaires give different QALYs for the same patient? Where do QALYs miss things (mental health, children, carers), and what are the alternatives such as DALYs and WELLBYs?
---
title: Whose values?
template: qaly_profiles
params:
  x_label: Years
  y_label: Quality weight q
  x_max: 7.6
  lines: straight
  profiles:
    - id: std
      label: Standard care
      color: '#2f6b8f'
      fill: true
      waypoints:
        - t: 0
          u: 0.5
        - t: 4
          u: 0.5
      death_at: 4
    - id: new
      label: New treatment
      color: '#b5482e'
      waypoints:
        - t: 0
          u: 0.7
        - t: 5
          u: 0.7
      death_at: 5
  shade_between:
    a: new
    b: std
    gain_label: ''
    loss_label: ''
vars:
  qs: 2
  dq: 1.5
elements:
  - id: tk5
    type: text
    text: '0.5'
    at:
      data: [-0.35, 0.5]
    font_size: 24
    style:
      color: '#2f6b8f'
  - id: tk7
    type: text
    text: '0.7'
    at:
      data: [-0.35, 0.7]
    font_size: 24
    style:
      color: '#b5482e'
  - id: tk6
    type: text
    text: '0.6'
    at:
      data: [-0.35, 0.6]
    font_size: 24
    style:
      color: '#8a5fa8'
  - id: t_std
    type: text
    text: '{qs:1} QALYs'
    at:
      data: [2, 0.25]
    font_size: 30
    style:
      color: '#2f6b8f'
  - id: t_new
    type: text
    text: 3.5 QALYs
    at:
      data: [2.5, 0.84]
    font_size: 30
    style:
      color: '#b5482e'
  - id: t_dq
    type: text
    text: ΔQ = {dq:1}
    at:
      data: [6.4, 0.84]
    font_size: 34
  - id: up
    type: arrow
    from:
      data: [1.2, 0.5]
    to:
      data: [1.2, 0.62]
    style:
      color: '#8a5fa8'
  - id: l_up
    type: label
    text: patients
    attach_to: up
    side: right
    style:
      color: '#8a5fa8'
  - id: l_pub
    type: label
    text: public
    attach_to: tk5
    side: below
    font_size: 22
    style:
      color: '#2f6b8f'
  - id: icer
    type: scratch
    work:
      - ICER = ΔC / ΔQ
      - tex: 30{,}000 / 1.5 = 20{,}000
      - tex: 30{,}000 / 1.1 \approx 27{,}000
    x: 835
    'y': 330
    font_size: 24
commands:
  - card:
      title: Whose values?
  - draw:
      - axes
      - full_health_line
      - tick_one
      - tick_zero
    speak: 'We have asked whether every QALY should count the same; now the harder question: do the numbers themselves measure what matters?'
  - draw:
      - curve_std
      - label_std
      - tk5
      - fill_std
      - t_std
    speak: 'Take our 60-year-old: standard care, four years at a weight of 0.5 — two QALYs.'
  - draw:
      - curve_new
      - label_new
      - tk7
      - t_new
      - gain_regions
      - t_dq
    speak: With the new treatment, five years at 0.7 — three and a half QALYs, a gain of 1.5.
  - pause: 0.4
  - highlight:
      target:
        - tk5
      effect: circle
    speak: But who said the untreated state is worth 0.5?
  - draw:
      - l_pub
    speak: In the value sets NICE prefers, members of the general public did — people imagining the state, not living in it.
  - draw:
      - up
      - l_up
    speak: Patients who live with a condition tend to rate it higher than the public imagines it.
  - highlight:
      target:
        - up
    speak: 'Part of that is adaptation: people adjust their goals, find new routines, and cope better than outsiders expect.'
  - animate:
      profiles.0.waypoints.0.u: 0.6
      profiles.0.waypoints.1.u: 0.6
    ghost:
      - curve_std
    duration: 2.5
    speak: Suppose patients put the untreated state at 0.6 — an illustrative number.
  - erase:
      - up
      - l_up
  - draw:
      - tk6
  - animate:
      qs: 2.4
      dq: 1.1
    duration: 2
    speak: Standard care is now worth 2.4 QALYs, and the gain shrinks from 1.5 to 1.1.
  - draw:
      - icer_box
      - icer_line_1
      - icer_line_2
      - icer_line_3
    speak: 'The same 30,000 now buys fewer QALYs: the ICER rises from 20,000 to about 27,000 per QALY.'
  - highlight:
      target:
        - curve_std_ghost
        - l_pub
    speak: 'The case for the public: they pay for the health service, and any of them could become the patient.'
  - erase:
      - icer
  - highlight:
      target:
        - curve_std
        - tk6
    speak: 'The case for patients: they know the state, and the public may imagine it far worse than it is.'
  - point:
      at:
        data: [2, 0.65]
      gesture: underline
    speak: 'And adaptation cuts both ways: counting it means less value in treating people who have learned to cope.'
  - highlight:
      target:
        - t_dq
      effect: circle
    speak: So the same patient's gain depends on whose judgement sets the weight.
  - quiz:
      question: A value set is built from patients who live with a condition, not from the public. For a treatment that cures it, the QALY gain is likely to…
      choices:
        - Grow
        - Shrink
        - Stay the same
      correct: 2
      right: 'It shrinks: patients rate their own state higher, so there is less distance left to full health.'
      wrong: Patients tend to rate their own state higher — how much is left to gain?
