commands:
  - card:
      title: What the questionnaire sees
  - draw:
      - t_eq
    speak: Now that we have seen methods move the weight, look at the questionnaire that feeds it.
  - draw:
      - d1
      - d2
      - d3
      - d4
      - d5
    speak: 'The EQ-5D asks about five things: mobility, self-care, usual activities, pain, and anxiety or depression.'
  - draw:
      - frame
    speak: Whatever it does not ask about, it cannot see.
  - draw:
      - o1
      - o2
      - o3
    speak: Hearing loss and poor vision barely register, and in some mental illnesses the five questions miss much of what changes.
  - draw:
      - sf_box
      - sf_line_1
    speak: A different questionnaire, the SF-6D, gives different values for the same patients.
  - draw:
      - sf_line_2
      - sf_line_3
      - sf_line_4
    speak: Its values cannot fall below zero, and compared with the EQ-5D it tends to rate the worst states higher and mild states lower.
  - highlight:
      target:
        - sf_line_1
    speak: So a trial's QALY gain can depend on which form the patients filled in.
  - erase:
      - sf
  - draw:
      - child
      - l_child
    speak: 'Children are harder still: a young child cannot fill in the form, and adults must imagine a child''s state to value it.'
  - draw:
      - carer
      - l_carer
    speak: 'Carers sit outside the frame altogether: the spouse who loses sleep and work appears nowhere in the patient''s QALYs.'
  - draw:
      - carer_in
      - l_in
    speak: NICE allows carers' health effects to be added when they are relevant, but analyses often leave them out.
  - highlight:
      target:
        - five
    speak: 'Yet the narrowness is also the strength: five short questions, answered by anyone, in any trial, comparable across diseases.'
  - draw:
      - bolt
    speak: Bolt-on questions, for hearing, vision or sleep, are one repair under study.
  - focus:
      target:
        - frame
        - five
        - t_eq
        - bolt
    speak: A QALY sees health through its questionnaire's window; whatever falls outside counts for nothing.
  - quiz:
      question: A hearing-aid programme shows almost no QALY gain on the EQ-5D, though users say their lives are much better. What is the most likely reason?
      choices:
        - Hearing aids do not work
        - The EQ-5D does not ask about hearing
        - The discount rate is too high
      correct: 2
      right: The EQ-5D has no question about hearing, so a real improvement there barely moves its score.
      wrong: Look at what the five questions ask about.
