commands:
  - card:
      title: Same state, three methods
  - draw:
      - scale
      - t_full
      - t_dead
      - n1
      - n5
      - n0
    speak: Now that we have seen whose values count, take one group of people and ask about the same state three ways.
  - draw:
      - m_vas
      - l_vas
    speak: On a visual analogue scale, they simply mark the state on a line from dead to full health, like a thermometer.
  - draw:
      - m_tto
      - l_tto
    speak: In a time trade-off, they give up years of life to live the rest in full health.
  - draw:
      - m_sg
      - l_sg
    speak: In a standard gamble, they accept a risk of death for a chance at full health.
  - point:
      at:
        ref: m_sg
      gesture: underline
    speak: 'For the same state, the numbers usually fall in the same order: the gamble highest, the trade-off next, the scale lowest.'
  - draw:
      - v_tto
      - v_vas
      - v_sg
    speak: Our 0.5 is a trade-off value; the scale might say 0.4, the gamble 0.6 — illustrative numbers.
  - pause: 0.4
  - draw:
      - r_sg
    speak: 'The gamble comes out high because most people dislike risk: facing a chance of death, they cling to the state they know.'
  - draw:
      - r_tto
    speak: 'The trade-off has its own pull: distant years feel worth less, so people give more of them up, which pulls the weight down.'
  - draw:
      - r_vas
    speak: 'The scale asks for no sacrifice at all: it records a feeling about the state, not a choice.'
  - erase:
      - r_vas
  - draw:
      - brace
      - l_brace
    speak: None of the three is simply right; each builds its own assumption about risk and time into the weight.
  - draw:
      - nice
      - l_nice
    speak: Payers answer by fixing one method in advance — NICE uses EQ-5D values from time trade-off — so every drug is measured with the same ruler.
  - highlight:
      target:
        - brace
        - l_brace
    speak: So a weight is not a fact about the state; it is the state seen through a method.
  - quiz:
      question: A state is valued at 0.8 by standard gamble. Valued by time trade-off, the same people would most likely give it…
      choices:
        - A higher weight
        - A lower weight
        - The same weight
      correct: 2
      right: 'A lower weight: the gamble''s number is pushed up by dislike of risk, and the trade-off usually lands below it.'
      wrong: Think about what dislike of risk does to the gamble's number.
