playlist:
  title: What is a QALY?
  prompt: Why would anyone want one number that combines length and quality of life? What do 1, 0 and a weight below 0 mean — and how do 4 years at 0.5 become 2 QALYs? Where did the idea come from?
---
title: Longer or better?
elements:
  - id: h0
    type: text
    text: Treatment
    font_size: 40
    style:
      color: '#8f887c'
    x: 200
    'y': 610
  - id: h1
    type: text
    text: Longer
    font_size: 40
    style:
      color: '#8f887c'
    x: 510
    'y': 610
  - id: h2
    type: text
    text: Better
    font_size: 40
    style:
      color: '#8f887c'
    x: 790
    'y': 610
  - id: c1_0
    type: text
    text: Cancer drug
    font_size: 40
    x: 200
    'y': 505
  - id: c1_1
    type: text
    text: + months
    font_size: 40
    x: 510
    'y': 505
  - id: c1_2
    type: text
    text: —
    font_size: 40
    x: 790
    'y': 505
  - id: c2_0
    type: text
    text: New hip
    font_size: 40
    x: 200
    'y': 415
  - id: c2_1
    type: text
    text: —
    font_size: 40
    x: 510
    'y': 415
  - id: c2_2
    type: text
    text: less pain
    font_size: 40
    x: 790
    'y': 415
  - id: c3_0
    type: text
    text: New treatment
    font_size: 40
    x: 200
    'y': 325
  - id: c3_1
    type: text
    text: + 1 year
    font_size: 40
    x: 510
    'y': 325
  - id: c3_2
    type: text
    text: better days
    font_size: 40
    x: 790
    'y': 325
  - id: rule
    type: path
    points:
      - [60, 565]
      - [940, 565]
    style:
      color: '#8f887c'
  - id: tbl
    type: group
    members:
      - h0
      - h1
      - h2
      - c1_0
      - c1_1
      - c1_2
      - c2_0
      - c2_1
      - c2_2
      - c3_0
      - c3_1
      - c3_2
      - rule
  - id: budget
    type: text
    text: One budget
    x: 500
    'y': 240
    font_size: 32
    style:
      color: '#8a5fa8'
  - id: box_all
    type: annotation
    target:
      - tbl
    kind: box
  - id: qaly_word
    type: text
    text: QALY
    x: 500
    'y': 225
    font_size: 52
    style:
      color: '#b5482e'
commands:
  - card:
      title: Longer or better?
  - draw:
      - h0
      - h1
      - h2
      - rule
    parallel: true
    speak: How do you compare a treatment that makes life longer with one that makes life better?
  - draw:
      - budget
    speak: Every health service faces that question, because it has one budget and many treatments asking for it.
  - draw:
      - c1_0
      - c1_1
      - c1_2
    speak: Take a cancer drug that gives patients extra months of life.
  - erase:
      - budget
  - draw:
      - c2_0
      - c2_1
      - c2_2
    speak: And a hip replacement, which adds no years, but takes away pain and brings back walking.
  - pause: 0.4
  - focus:
      target:
        - h1
        - c1_1
        - c2_1
    speak: The natural first answer is to count the years of life each one adds.
  - highlight:
      target:
        - c2_1
      effect: circle
    speak: By that count the hip replacement is worth nothing, which no one waiting for a new hip would accept.
  - focus:
      target:
        - h2
        - c1_2
        - c2_2
    speak: Count pain or mobility instead, and the cancer drug's extra time vanishes from view.
  - draw:
      - c3_0
      - c3_1
      - c3_2
    speak: Most treatments do some of both, like the new treatment in our running example for a 60-year-old with a chronic disease.
  - highlight:
      target:
        - c3_1
        - c3_2
    speak: What we need is one currency that counts length and quality of life at once.
  - draw:
      - box_all
      - qaly_word
    speak: 'That currency is the quality-adjusted life year: the QALY.'
  - pause: 0.5
  - highlight:
      target:
        - qaly_word
      effect: underline
    speak: Agencies such as NICE in England use it to decide which treatments public money pays for.
  - highlight:
      target:
        - box_all
    speak: So the QALY exists to put very different treatments on one scale.
level: basic
---
title: The quality scale
domain:
  x: [0, 1]
  'y': [-0.9, 1.12]
elements:
  - id: scale
    type: path
    points:
      - [0.4, -0.68]
      - [0.4, 1.05]
    data: true
  - id: band_alive
    type: polygon
    data: true
    points:
      - [0.37, 0]
      - [0.43000000000000005, 0]
      - [0.43000000000000005, 1]
      - [0.37, 1]
    style:
      fill: '#87a878'
      color: '#87a878'
  - id: band_worse
    type: polygon
    data: true
    points:
      - [0.37, -0.68]
      - [0.43000000000000005, -0.68]
      - [0.43000000000000005, 0]
      - [0.37, 0]
    style:
      fill: '#c96567'
      color: '#c96567'
  - id: p_full
    type: point
    at:
      x: 0.4
      'y': 1
    style:
      color: '#3d3833'
  - id: l_full
    type: text
    text: Full health
    at:
      ref: p_full
      side: right
      gap: 40
    font_size: 32
    style:
      color: '#3d3833'
  - id: n_full
    type: text
    text: '1'
    at:
      ref: p_full
      side: left
      gap: 40
    font_size: 32
    style:
      color: '#3d3833'
  - id: p_dead
    type: point
    at:
      x: 0.4
      'y': 0
    style:
      color: '#3d3833'
  - id: l_dead
    type: text
    text: Dead
    at:
      ref: p_dead
      side: right
      gap: 40
    font_size: 32
    style:
      color: '#3d3833'
  - id: n_dead
    type: text
    text: '0'
    at:
      ref: p_dead
      side: left
      gap: 40
    font_size: 32
    style:
      color: '#3d3833'
  - id: l_alive
    type: text
    text: ill or limited
    at:
      data: [0.6000000000000001, 0.25]
    font_size: 30
    style:
      color: '#5f7f52'
  - id: p_std
    type: point
    at:
      x: 0.4
      'y': 0.5
    style:
      color: '#b5482e'
  - id: l_std
    type: text
    text: Standard care
    at:
      ref: p_std
      side: right
      gap: 40
    font_size: 32
    style:
      color: '#b5482e'
  - id: n_std
    type: text
    text: '0.5'
    at:
      ref: p_std
      side: left
      gap: 40
    font_size: 32
    style:
      color: '#b5482e'
  - id: p_new
    type: point
    at:
      x: 0.4
      'y': 0.7
    style:
      color: '#2f6b8f'
  - id: l_new
    type: text
    text: New treatment
    at:
      ref: p_new
      side: right
      gap: 40
    font_size: 32
    style:
      color: '#2f6b8f'
  - id: n_new
    type: text
    text: '0.7'
    at:
      ref: p_new
      side: left
      gap: 40
    font_size: 32
    style:
      color: '#2f6b8f'
  - id: hop
    type: arrow
    from:
      data: [0.23, 0.51]
    to:
      data: [0.23, 0.69]
    style:
      color: '#2f6b8f'
  - id: l_hop
    type: label
    text: '+0.2'
    attach_to: hop
    side: left
    style:
      color: '#2f6b8f'
  - id: l_worse
    type: text
    text: worse than dead
    at:
      data: [0.6000000000000001, -0.28]
    font_size: 30
    style:
      color: '#a04a4c'
  - id: p_worst
    type: point
    at:
      x: 0.4
      'y': -0.59
    style:
      color: '#a04a4c'
  - id: l_worst
    type: text
    text: Worst EQ-5D state
    at:
      ref: p_worst
      side: right
      gap: 40
    font_size: 32
    style:
      color: '#a04a4c'
  - id: n_worst
    type: text
    text: −0.59
    at:
      ref: p_worst
      side: left
      gap: 40
    font_size: 32
    style:
      color: '#a04a4c'
  - id: cue
    type: text
    text: q = quality weight
    font_size: 34
    style:
      color: '#8a5fa8'
    at:
      data: [0.82, 0.5]
commands:
  - card:
      title: The quality scale
  - draw:
      - scale
    speak: Now that we want one currency, we need a scale for how good a year of life is.
  - draw:
      - cue
    speak: Call it q, the quality weight of a health state; economists also call it a utility.
  - draw:
      - p_full
      - n_full
      - l_full
    speak: 'At one end, q equals 1: a year in full health.'
  - draw:
      - p_dead
      - n_dead
      - l_dead
    speak: 'At the other, q equals 0: dead.'
  - erase:
      - cue
  - draw:
      - band_alive
      - l_alive
    speak: Everything in between is a year lived with some illness or limitation.
  - draw:
      - p_std
      - n_std
      - l_std
    speak: Our patient on standard care sits at 0.5, so one year like that counts as half a year of full health.
  - draw:
      - p_new
      - n_new
      - l_new
      - hop
      - l_hop
    speak: On the new treatment, q rises to 0.7.
  - pause: 0.4
  - point:
      at:
        ref: p_dead
      gesture: underline
    speak: The scale does not stop at zero.
  - draw:
      - band_worse
      - l_worse
    speak: When people are asked, many rate the worst states, such as extreme pain with no ability to move or wash, as worse than being dead, so those get a weight below 0.
  - draw:
      - p_worst
      - n_worst
      - l_worst
    speak: In the first UK value set for the EQ-5D questionnaire, the worst state scored about minus 0.59.
  - highlight:
      target:
        - n_std
        - n_new
    speak: Where numbers like 0.5 and 0.7 come from is the next lecture's question; here, take them as given.
  - highlight:
      target:
        - p_std
        - n_std
      effect: circle
    speak: 'So q is an exchange rate: it says how many years of full health one year in that state is worth.'
level: basic
---
title: Area under the line
template: qaly_profiles
params:
  x_label: Time t (years)
  y_label: Quality q
  x_max: 7
  lines: straight
  profiles:
    - id: std
      label: Standard care
      color: '#b5482e'
      fill: true
      waypoints:
        - t: 0
          u: 0.5
        - t: 4
          u: 0.5
      death_at: 4
    - id: new
      label: New treatment
      color: '#2f6b8f'
      fill: true
      waypoints:
        - t: 0
          u: 0.7
        - t: 5
          u: 0.7
      death_at: 5
  shade_between:
    a: new
    b: std
    gain_label: ''
    loss_label: ''
elements:
  - id: t_std
    type: text
    text: 2.0 QALYs
    at:
      data: [3, 0.25]
    font_size: 36
    style:
      color: '#b5482e'
  - id: t_new
    type: text
    text: 3.5 QALYs
    at:
      data: [2, 0.3]
    font_size: 36
    style:
      color: '#2f6b8f'
  - id: healthy2
    type: polygon
    data: true
    points:
      - [0, 0]
      - [2, 0]
      - [2, 1]
      - [0, 1]
    style:
      color: '#8f887c'
      dash: true
  - id: tk4
    type: text
    text: '4'
    at:
      data: [4, -0.06]
    font_size: 30
    style:
      color: '#b5482e'
  - id: tk5
    type: text
    text: '5'
    at:
      data: [5, -0.06]
    font_size: 30
    style:
      color: '#2f6b8f'
  - id: tq5
    type: text
    text: '0.5'
    at:
      data: [-0.3, 0.5]
    font_size: 30
    style:
      color: '#b5482e'
  - id: tq7
    type: text
    text: '0.7'
    at:
      data: [-0.3, 0.7]
    font_size: 30
    style:
      color: '#2f6b8f'
  - id: t_dq
    type: text
    text: ΔQ = 1.5
    at:
      data: [1.6, 0.6]
    font_size: 30
    style:
      color: '#4f7a43'
  - id: calc
    type: scratch
    work:
      - tex: 4 \times 0.5 = 2.0
      - tex: 5 \times 0.7 = 3.5
      - tex: 3.5 - 2.0 = 1.5
    font_size: 28
    x: 855
    'y': 330
commands:
  - card:
      title: Area under the line
  - draw:
      - axes
      - full_health_line
    speak: Now that each year has a weight, we can add up a whole stretch of life.
  - highlight:
      target:
        - axes
    speak: Time t runs along the bottom, in years, and the weight q runs up the side.
  - draw:
      - curve_std
      - label_std
      - tk4
      - tq5
    speak: On standard care, our patient lives four years at q equals 0.5.
  - draw:
      - fill_std
      - t_std
      - calc_box
      - calc_line_1
    speak: 'The QALYs are the area under that line: 4 times 0.5, which is 2.0 QALYs.'
  - draw:
      - healthy2
    speak: So four years at half quality count the same as two years in full health.
  - erase:
      - healthy2
      - t_std
  - fade:
      target:
        - curve_std
        - fill_std
        - label_std
      to: 0.3
  - draw:
      - curve_new
      - label_new
      - tk5
      - tq7
    speak: Now the new treatment, for the same patient with the same disease.
  - draw:
      - fill_new
      - t_new
      - calc_line_2
    speak: 'Five years at q equals 0.7: 5 times 0.7, which is 3.5 QALYs.'
  - pause: 0.4
  - fade:
      target:
        - fill_new
        - t_new
      to: 0.15
  - fade:
      target:
        - curve_std
        - label_std
      to: 1
  - draw:
      - gain_regions
    speak: Part of the gain is the extra year; part is that every year is better.
  - draw:
      - t_dq
      - calc_line_3
    speak: The difference, which we call delta Q, is 1.5 QALYs.
  - point:
      at:
        data: [4.5, 0.04]
      gesture: underline
    speak: Counting years alone would have said one year gained, blind to the better quality.
  - erase:
      - calc
  - highlight:
      target:
        - curve_new
    speak: 'Real quality lines are rarely flat, but the rule is the same: add up q times t, the area under the line.'
  - fade:
      target:
        - fill_new
        - t_new
      to: 1
    speak: 'So a QALY is simply area: how long, times how well.'
level: basic
---
title: Where the idea came from
template: timeline
params:
  milestones:
    - label: '1968'
      sublabel: Klarman
    - label: '1970'
      sublabel: Fanshel & Bush
    - label: '1976'
      sublabel: the name
      emphasize: true
    - label: '1985'
      sublabel: Williams
    - label: '1999'
      sublabel: NICE
elements:
  - id: readout
    type: text
    text: 2.0 → 3.5 QALYs
    x: 500
    'y': 240
    font_size: 40
    style:
      color: '#2f6b8f'
commands:
  - card:
      title: Where the idea came from
  - draw:
      - line
    speak: Now that we can compute a QALY, where did the idea come from?
  - draw:
      - dot_0
      - label_0
    speak: In 1968, Herbert Klarman and colleagues compared kidney dialysis with transplants, and counted a year with a working transplant as worth more than a year on dialysis.
  - highlight:
      target:
        - label_0
    speak: 'That was the core move: adjust years of life for their quality.'
  - draw:
      - dot_1
      - label_1
    speak: In 1970, Fanshel and Bush built a health status index to put such weights on one scale.
  - draw:
      - dot_2
      - label_2
    speak: 'In 1976, Richard Zeckhauser and Donald Shepard gave the idea its name: the quality-adjusted life year.'
  - draw:
      - dot_3
      - label_3
    speak: In 1985, Alan Williams at York used QALYs to weigh heart bypass surgery against other uses of the same money.
  - draw:
      - dot_4
      - label_4
    speak: In 1999, England set up NICE, which came to judge new treatments by their cost per QALY.
  - point:
      at:
        ref: dot_4
      gesture: circle
    speak: Today health technology assessment agencies in many countries do the same.
  - draw:
      - readout
    speak: 'Back to our 60-year-old: 2.0 QALYs on standard care, 3.5 on the new treatment.'
  - highlight:
      target:
        - readout
    speak: Because length and quality now share one unit, that gain can stand beside a cancer drug or a new hip.
  - highlight:
      target:
        - dot_2
        - label_2
      effect: circle
    speak: 'That is what the QALY gives us: one yardstick for very different kinds of health.'
  - highlight:
      target:
        - line
    speak: Whether the yardstick is fair, and whether it measures what matters, is what the rest of this course argues about.
  - quiz:
      question: A treatment adds no years, but lifts q from 0.5 to 0.7 over the patient's 4 remaining years. How many QALYs does it gain?
      choices:
        - '0'
        - '0.2'
        - '0.8'
        - '2.8'
      correct: 3
      right: '0.8: it adds 0.2 in each of 4 years, 4 times 0.2, even though not a single year is added.'
      wrong: The gain in each year is the change in q; now count how many years get it.
sources:
  - id: klarman
    title: Cost effectiveness analysis applied to the treatment of chronic renal disease
    authors: Klarman, Francis & Rosenthal
    year: 1968
  - id: fanshel
    title: A health-status index and its application to health-services outcomes
    authors: Fanshel & Bush
    year: 1970
  - id: zs
    title: Where now for saving lives?
    authors: Zeckhauser & Shepard
    year: 1976
  - id: williams
    title: Economics of coronary artery bypass grafting
    authors: Williams
    year: 1985
text:
  font_size: 31
level: basic
