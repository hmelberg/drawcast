playlist:
  title: Is a QALY a QALY, whoever gets it?
  prompt: What is the ethical case for counting every QALY equally? Do QALYs discriminate against the old and the disabled? Should severity, fair innings or the rule of rescue add weight — and how do payers such as NICE and Norway handle this?
---
title: A QALY is a QALY?
template: qaly_profiles
params:
  box:
    x: 20
    'y': 150
    w: 690
    h: 510
  lines: straight
  x_label: Years from age 60
  y_label: Quality, q
  x_max: 6
  profiles:
    - id: std
      label: 'Standard: 2.0'
      color: '#2f6b8f'
      waypoints:
        - t: 0
          u: 0.5
        - t: 4
          u: 0.5
      death_at: 4
    - id: new
      label: 'Treatment: 3.5'
      color: '#b5482e'
      waypoints:
        - t: 0
          u: 0.7
        - t: 5
          u: 0.7
      death_at: 5
  shade_between:
    a: new
    b: std
    gain_label: ''
    loss_label: ''
elements:
  - id: claim_a
    type: node
    shape: rect
    text: Just arithmetic
  - id: claim_b
    type: node
    shape: rect
    text: A moral choice
  - id: claims
    type: group
    members:
      - claim_a
      - claim_b
    layout: column
    gap: 50
    fit:
      x: 730
      'y': 340
      w: 250
      h: 240
  - id: strike_a
    type: annotation
    target:
      - claim_a
    kind: strike
  - id: icer
    type: text
    text: ICER 20,000 = λ
    x: 850
    'y': 240
    font_size: 26
    style:
      color: '#8a5fa8'
  - id: dq
    type: text
    text: ΔQ = 1.5
    at:
      data: [1.6, 0.6]
    font_size: 24
    style:
      color: '#4f7a43'
  - id: weight
    type: text
    text: × 1
    at:
      data: [4.5, 0.3]
    font_size: 30
    style:
      color: '#3d3833'
commands:
  - card:
      title: A QALY is a QALY?
  - draw:
      - axes
      - full_health_line
      - tick_one
      - tick_zero
      - claim_a
      - claim_b
    speak: Some say a QALY is just neutral arithmetic, the same for everyone; others say it hides a moral choice about who counts.
  - highlight:
      target:
        - claim_a
        - claim_b
    speak: Who is right?
  - pause: 0.5
  - draw:
      - curve_std
      - label_std
    speak: 'Take our 60-year-old: standard care gives four years at a quality of 0.5, which is two QALYs.'
  - draw:
      - curve_new
      - label_new
      - gain_regions
      - dq
    speak: The new treatment gives five years at 0.7, three and a half QALYs, and the gain between them is 1.5.
  - pause: 0.3
  - speak: The sum asks how much health is gained, never whose — a QALY to this patient weighs exactly what it would to anyone else.
    focus:
      target:
        - gain_regions
        - dq
        - curve_new
        - curve_std
  - highlight:
      target:
        - dq
      effect: circle
    speak: 'That is the first case for equal weighting: impartiality, no one''s health counts for more because of who they are.'
  - draw:
      - icer
    speak: 'The second is the budget: the extra 30,000 spent here, at a threshold of 20,000 per QALY, would buy 1.5 QALYs for someone else.'
  - highlight:
      target:
        - icer
    speak: So any extra weight for one group is health taken from patients we never see.
  - draw:
      - weight
    speak: 'Yet the sum did choose something: it gave every person''s QALYs a weight of one.'
  - draw:
      - strike_a
    speak: That is a moral choice too, so 'just arithmetic' is wrong.
  - highlight:
      target:
        - claim_b
      effect: circle
    speak: Equal weighting is a defensible choice, not the absence of one.
  - erase:
      - claims
      - strike_a
      - icer
  - highlight:
      target:
        - label_std
        - label_new
    speak: And equal per QALY is not equal per person — which is where the critics begin.
---
title: The old and the disabled
template: qaly_profiles
params:
  box:
    x: 20
    'y': 150
    w: 740
    h: 510
  lines: straight
  x_max: 95
  y_label: Quality, q
  shade_between: null
  profiles:
    - id: young
      label: 'Age 30: 40'
      color: '#2f6b8f'
      fill: true
      waypoints:
        - t: 30
          u: 0.8
        - t: 80
          u: 0.8
      death_at: 80
    - id: old
      label: 'Age 70: 8'
      color: '#b5482e'
      fill: true
      waypoints:
        - t: 70
          u: 0.8
        - t: 80
          u: 0.8
      death_at: 80
    - id: dis
      label: 'Disabled: 20'
      color: '#8a5fa8'
      fill: true
      waypoints:
        - t: 30
          u: 0.4
        - t: 80
          u: 0.4
      death_at: 80
  x_label: Age
sources:
  - id: harris
    title: QALYfying the value of life
    authors: John Harris
    year: 1987
    finding: QALYs discriminate against the old and the disabled
elements:
  - id: harris_card
    type: node
    shape: rect
    text: Harris, 1987
    x: 870
    'y': 560
    cites:
      - harris
  - id: harris_cue
    type: text
    text: Each life, equal
    at:
      ref: harris_card
      side: below
      gap: 18
    font_size: 24
    style:
      color: '#3d3833'
  - id: t30
    type: text
    text: '30'
    at:
      data: [30, -0.06]
    font_size: 22
    style:
      color: '#8f887c'
  - id: t70
    type: text
    text: '70'
    at:
      data: [70, -0.06]
    font_size: 22
    style:
      color: '#8f887c'
  - id: t80
    type: text
    text: '80'
    at:
      data: [80, -0.06]
    font_size: 22
    style:
      color: '#8f887c'
commands:
  - card:
      title: The old and the disabled
  - draw:
      - axes
      - full_health_line
      - tick_one
      - tick_zero
      - t30
      - t70
      - t80
    speak: Now that we have seen the case for weighting every QALY equally, look at who ends up with fewer QALYs to gain.
  - draw:
      - curve_young
    speak: Say a cure saves a life, and afterwards the person lives to 80 at a quality of 0.8 — illustrative numbers.
  - draw:
      - fill_young
      - label_young
    speak: 'Saved at 30, that is fifty years at 0.8: forty QALYs.'
  - fade:
      target:
        - fill_young
        - curve_young
        - label_young
      to: 0.3
  - draw:
      - curve_old
      - fill_old
      - label_old
    speak: 'Saved at 70, the same cure buys ten years: eight QALYs.'
  - highlight:
      target:
        - label_old
      effect: circle
    speak: Same treatment, same cost, but the older patient's rescue counts for a fifth as much.
  - erase:
      - curve_old
      - fill_old
      - label_old
  - draw:
      - curve_dis
    speak: Now a young patient with a lasting disability, living at 0.4 after the cure.
  - draw:
      - fill_dis
      - label_dis
    speak: 'The same fifty years give only twenty QALYs: half the priority, because of the disability.'
  - draw:
      - harris_card
      - harris_cue
    speak: In 1987 the philosopher John Harris attacked exactly this, in a paper called 'QALYfying the value of life'.
  - highlight:
      target:
        - harris_cue
    speak: 'His point: each person who wants to go on living has the same claim to it, however many QALYs their life holds.'
  - highlight:
      target:
        - curve_dis
    speak: 'Critics call the disability case double jeopardy: the first misfortune lowers your quality of life, and then it lowers your priority.'
  - speak: Defenders reply that the QALY counts health gained, not the worth of a person, and that ignoring it means buying less health overall.
    focus:
      target:
        - fill_dis
        - curve_dis
        - label_dis
        - fill_young
        - curve_young
  - erase:
      - harris_card
      - harris_cue
  - draw:
      - curve_old
      - fill_old
      - label_old
    speak: So QALYs do not rank people, but wherever there is less health to gain, the old and the disabled come second.
---
title: Fair innings and rescue
template: qaly_profiles
params:
  box:
    x: 20
    'y': 150
    w: 700
    h: 510
  lines: straight
  x_max: 90
  x_label: Age
  y_label: Quality, q
  shade_between: null
  reference:
    label: Fair innings
    waypoints:
      - t: 0
        u: 0.92
      - t: 40
        u: 0.88
      - t: 82
        u: 0.75
    death_at: 82
  profiles:
    - id: early
      label: Struck at 30
      color: '#b5482e'
      waypoints:
        - t: 0
          u: 0.92
        - t: 30
          u: 0.89
        - t: 30
          u: 0.5
          step: true
        - t: 40
          u: 0.45
      death_at: 40
    - id: sixty
      label: Our 60-year-old
      color: '#2f6b8f'
      waypoints:
        - t: 0
          u: 0.92
        - t: 60
          u: 0.8
        - t: 60
          u: 0.5
          step: true
        - t: 64
          u: 0.5
      death_at: 64
  shortfall:
    - of: early
      index_age: 30
      areas: true
    - of: sixty
      index_age: 60
      areas: true
sources:
  - id: williams
    title: 'Intergenerational equity: an exploration of the ''fair innings'' argument'
    authors: Alan Williams
    year: 1997
    finding: extra weight for those who would fall short of a fair innings
elements:
  - id: crowd
    type: population
    count: 13
    states:
      unseen: 12
      seen: 1
    order: rows
    colors:
      unseen: '#8f887c'
      seen: '#b5482e'
    labels:
      unseen: Unseen
      seen: Seen
    fit:
      x: 745
      'y': 300
      w: 230
      h: 300
  - id: t30
    type: text
    text: '30'
    at:
      data: [30, -0.06]
    font_size: 22
    style:
      color: '#8f887c'
  - id: t60
    type: text
    text: '60'
    at:
      data: [60, -0.06]
    font_size: 22
    style:
      color: '#8f887c'
  - id: t82
    type: text
    text: '82'
    at:
      data: [82, -0.06]
    font_size: 22
    style:
      color: '#8f887c'
commands:
  - card:
      title: Fair innings and rescue
  - hide:
      - shortfall_note
      - shortfall_note_2
      - index_line
      - index_line_2
      - label_index
      - label_index_2
      - shortfall_region
      - shortfall_region_2
      - expected_region
      - expected_region_2
      - kept_region
      - kept_region_2
  - draw:
      - axes
      - full_health_line
      - tick_one
      - tick_zero
      - t30
      - t60
      - t82
    speak: Now that we have seen the complaint that QALYs favour the young, here is an argument that they should favour them even more.
  - draw:
      - curve_sixty
      - label_sixty
      - curve_early
      - label_early
    speak: 'Alan Williams, one of the QALY''s pioneers, made it in 1997: the fair innings argument.'
  - draw:
      - reference_curve
      - label_reference
    speak: Everyone, he argued, has a claim to a fair lifetime of health — a normal span in reasonable quality.
  - highlight:
      target:
        - reference_curve
    speak: The dashed curve is such a life, lived to its natural end; the area beneath it is a fair innings.
  - draw:
      - lifetime_region_2
      - label_lifetime_2
      - lifetime_region
      - label_lifetime
    speak: Our 60-year-old has already had most of one; someone struck down at 30 falls far short.
  - highlight:
      target:
        - label_lifetime
      effect: circle
    speak: Williams proposed extra weight for QALYs that go to those who would otherwise fall short of a fair innings.
  - focus:
      target:
        - lifetime_region
        - label_lifetime
        - curve_early
        - reference_curve
    speak: On this view the young patient's QALYs count for more — the opposite of Harris's remedy.
  - draw:
      - crowd_seen
    speak: 'The rule of rescue pulls another way: the urge to save an identified person in danger, whatever it costs.'
  - draw:
      - crowd
      - crowd_legend
    speak: One named patient in the news, against many unnamed patients who would gain more from the same money.
  - highlight:
      target:
        - crowd
    speak: 'The QALY sum cannot see the difference: a named life and a statistical one weigh the same.'
  - highlight:
      target:
        - crowd_unseen
    speak: Defenders call that fairness to the unseen; critics call it blindness to something people really value.
  - erase:
      - crowd
      - crowd_legend
  - highlight:
      target:
        - label_lifetime
        - reference_curve
    speak: 'So both arguments ask the same of the sum: add weight — for a lifetime cut short, or for a person we can see.'
---
title: Severity, in practice
template: qaly_profiles
params:
  box:
    x: 20
    'y': 150
    w: 640
    h: 510
  lines: straight
  x_max: 23
  x_label: Years from age 60
  y_label: Quality, q
  index_age: 0
  reference:
    label: Normal life
    waypoints:
      - t: 0
        u: 0.86
      - t: 21
        u: 0.84
    death_at: 21
  profiles:
    - id: std
      label: Standard
      color: '#2f6b8f'
      waypoints:
        - t: 0
          u: 0.5
        - t: 4
          u: 0.5
      death_at: 4
    - id: new
      label: Treatment
      color: '#b5482e'
      waypoints:
        - t: 0
          u: 0.7
        - t: 5
          u: 0.7
      death_at: 5
  shade_between:
    a: new
    b: std
    gain_label: ΔQ = 1.5
    loss_label: ''
  shortfall:
    of: std
    show: both
    label: Health lost
elements:
  - id: calc
    type: scratch
    work:
      - 'NICE 2022: × 1.2 or × 1.7'
      - tex: 1.5 \times 1.2 = 1.8
      - tex: 30{,}000 \div 1.8 \approx 16{,}700
    at:
      place: top_right
  - id: l_exp
    type: text
    text: 'Expected: 17.8'
    x: 820
    'y': 470
    font_size: 26
    style:
      color: '#8f887c'
  - id: l_left
    type: text
    text: 'Left: 2.0'
    x: 820
    'y': 420
    font_size: 26
    style:
      color: '#2f6b8f'
  - id: l_lost
    type: text
    text: 'Lost: 15.8'
    x: 820
    'y': 370
    font_size: 26
    style:
      color: '#3d3833'
  - id: l_prop
    type: text
    text: '= 89% of it'
    x: 820
    'y': 325
    font_size: 26
    style:
      color: '#3d3833'
  - id: us
    type: text
    text: 'US Medicare: no λ'
    x: 820
    'y': 230
    font_size: 26
    style:
      color: '#8a5fa8'
commands:
  - card:
      title: Severity, in practice
  - hide:
      - shortfall_note
      - index_line
      - label_index
  - draw:
      - axes
      - full_health_line
      - tick_one
      - tick_zero
      - curve_std
      - label_std
      - curve_new
      - label_new
      - gain_regions
      - label_gain
    speak: Now that we have seen the arguments for extra weight, the one payers have actually adopted is severity.
  - draw:
      - reference_curve
      - label_reference
    speak: 'Severity asks how much health the disease takes: the gap between a normal life from 60 and what this patient can expect.'
  - draw:
      - l_exp
      - l_left
    speak: With illustrative population norms, our 60-year-old could expect about eighteen more QALYs; standard care leaves two.
  - draw:
      - shortfall_region
      - l_lost
    speak: That gap, about sixteen QALYs, is the absolute shortfall — the measure of severity Norway uses.
  - speak: 'Norway''s priority-setting weighs three things: the benefit, the resources it takes, and the severity.'
    focus:
      target:
        - shortfall_region
        - reference_curve
        - curve_std
        - l_lost
  - highlight:
      target:
        - l_lost
    speak: The more severe the condition, the higher the cost per QALY Norway will accept.
  - draw:
      - calc_box
      - calc_line_1
    speak: 'In 2022 NICE, in England, brought in a severity modifier: QALYs in the most severe conditions count 1.2 or 1.7 times.'
  - speak: 'Our patient loses about 89 percent of the health they could expect: enough for the 1.2 weight.'
    draw:
      - l_prop
  - draw:
      - calc_line_2
      - calc_line_3
    speak: Then the gain of 1.5 QALYs counts as 1.8, and the ICER falls from 20,000 to about 16,700 per QALY.
  - erase:
      - calc
  - speak: 'The United States went another way: the Affordable Care Act restricts the use of cost per QALY thresholds in Medicare.'
    draw:
      - us
  - focus:
      target:
        - gain_regions
        - label_gain
        - shortfall_region
    speak: So a QALY is a QALY only because someone decided it should be; every weight, even a weight of one, is a choice about whose health the budget buys.
