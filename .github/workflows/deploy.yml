name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lock file yet (the fork dropped mermaid/jsxgraph and the stale lock);
      # switch back to `npm ci` + cache once a fresh package-lock.json is committed.
      - run: npm install
      # The full suite, with ONE known exception: vitest sometimes ends a
      # fully green run with `[vitest-worker]: Timeout calling "onTaskUpdate"`
      # (a worker torn down with a call in flight — see netlify.toml) and
      # exits non-zero. That alone is let through; any failed test, or any
      # other unhandled error, still stops the deploy.
      - name: npm test
        shell: bash
        env:
          NO_COLOR: "1"
        run: |
          set +e
          npm test 2>&1 | tee vitest.log
          code=${PIPESTATUS[0]}
          [ "$code" -eq 0 ] && exit 0
          if grep -Eq '^ *Tests .* failed' vitest.log || grep -Eq '^ *Test Files .* failed' vitest.log; then exit "$code"; fi
          if grep -Eq '^ *Errors +1 error' vitest.log && grep -q 'Timeout calling "onTaskUpdate"' vitest.log; then
            echo "::warning::vitest's onTaskUpdate timeout after a green run — ignored (see deploy.yml)"
            exit 0
          fi
          exit "$code"
      # Actions secrets reach a step only when that step names them. Without
      # this block VITE_GOOGLE_CLIENT_ID is empty in the Pages bundle and every
      # ☁/▶ button hides itself. Secrets that do not exist yet interpolate to
      # the empty string, i.e. exactly today's behaviour, so this is safe to
      # land before they are configured.
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_PICKER_KEY: ${{ secrets.VITE_GOOGLE_PICKER_KEY }}
      - uses: actions/configure-pages@v5
        with:
          # First run on a fresh repo: create the Pages site (source: GitHub Actions).
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
