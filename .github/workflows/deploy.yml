name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lock file yet (the fork dropped mermaid/jsxgraph and the stale lock);
      # switch back to `npm ci` + cache once a fresh package-lock.json is committed.
      - run: npm install
      - run: npm test
      # Actions secrets reach a step only when that step names them. Without
      # this block VITE_GOOGLE_CLIENT_ID is empty in the Pages bundle and every
      # ☁/▶ button hides itself. Secrets that do not exist yet interpolate to
      # the empty string, i.e. exactly today's behaviour, so this is safe to
      # land before they are configured.
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_PICKER_KEY: ${{ secrets.VITE_GOOGLE_PICKER_KEY }}
      - uses: actions/configure-pages@v5
        with:
          # First run on a fresh repo: create the Pages site (source: GitHub Actions).
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
